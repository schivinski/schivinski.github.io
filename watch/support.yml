# Reader support for Marketing in 3, through Ko-fi (ko-fi.com/marketingin3, paid out to PayPal).
# Ko-fi has one item, a coffee set to EUR 3 in Ko-fi's settings. Clicking a support link opens Ko-fi inside the page
# (a dialog with Ko-fi's embedded widget, scripts/add_support.py); the plain link is the fallback.
# Everything stays hidden while `url` is empty. With a url it shows:
#   * a card at the end of every issue (`text`) and on the Subscribe page (`text_subscribe`), with one button
#     per option below (only one now);
#   * a line on the Marketing in 3 page (`line` + `link`) and a footer link on every page
#     (`link`, scripts/add_support.py).
# Clicks show in GoatCounter as the event `support`, with the button and the page they came from.
url: "https://ko-fi.com/marketingin3"
link: "Buy me a coffee"
options:
  - label: "Buy me a coffee"
    price: "€3"
    icon: coffee
    primary: true
text: >-
  If this issue saved you a meeting or sharpened a campaign, buy me a coffee. It
  keeps Marketing in 3 free and ad-free, with new issues every Monday and Thursday.
text_subscribe: >-
  Marketing in 3 is free and ad-free, with new issues every Monday and Thursday. If it earns its place in your feed, a coffee helps keep it
  that way.
line: "Free and ad-free, kept going by readers."
# The round-avatar prompt shown mid-issue (after the how-to) and on the Subscribe page.
inline_title: "Found this useful?"
inline_text: "Marketing in 3 is free and ad-free, with new issues every Monday and Thursday. A coffee keeps it that way."
inline_text_subscribe: "Marketing in 3 is free and ad-free, with new issues every Monday and Thursday. If it earns its place in your feed, a coffee keeps it that way."
