short_answer: >-
  For some readers, yes, and mainly when the treatment's legal status is in doubt. In an experiment with 488 US adults
  aged 18 to 25, people nudged into a mindset of chasing gains judged a post backing medical marijuana for multiple
  sclerosis more likely to prompt a call to a doctor than safety-minded people did. That held only when the treatment
  was described as illegal and six people of their own age and gender had shared the post.

takeaways:
  - "With a note that the treatment was illegal in 12 US states, gain-minded people's descriptions of it to a friend scored about 2.7 times higher on positive tone than safety-minded people's. With a note that it was legal in 38 states, the gap disappeared."
  - "When all six visible sharers matched the reader's age and gender and the post carried the illegality note, gain-minded readers rated its chance of getting someone to phone a doctor at 5.89, against 5.25 from safety-minded readers."
  - "Swapping three of those six faces for people of a different age erased the gap: 5.59 against 5.69."
  - "Feeling calm was the route. In that look-alike, illegal setting gain-minded readers scored 2.33 for tension against 2.83 (1 means extremely relaxed), while hope and fear played no part."

