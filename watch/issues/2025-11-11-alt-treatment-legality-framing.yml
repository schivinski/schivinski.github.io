title: "Does it matter who shares a post about a legally contested treatment? What a Psychology & Marketing study found"
dek: >-
  Medical marijuana is banned under US federal law yet allowed in most states, so posts about it meet readers who weigh
  the law very differently. Two US experiments show that a line about where it is illegal, and the faces of the people
  sharing a post, change how warmly some readers respond.
short_title: "Legal status, look-alike sharers and posts about a contested treatment"

description: >-
  Hsieh et al. find gain-minded readers warm more than cautious ones to medical marijuana posts flagged as illegal, above
  all when sharers look like them.

keywords: [medical marijuana marketing, cannabis social media marketing, health messaging on social media, legality framing,
  regulatory focus, promotion focus, prevention focus, peer similarity, social proof, risky consumption, Psychology & Marketing]
