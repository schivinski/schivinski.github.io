title: "How do online reviews shape shoppers' views of the brands they buy? What a Journal of Product & Brand Management study found"
dek: >-
  Reviews do more than inform. They stir feelings, and a large survey of online buyers suggests those feelings carry
  through into how people judge a brand and whether they return to the same shop.
short_title: "How reviews stir the feelings behind brand attitude"

description: >-
  Blanco-Encomienda and Rosillo-Díaz find believable reviewers and plentiful reviews go with shoppers feeling pleased and
  in control, and with warmer brand views.

keywords: [online reviews, review credibility, source credibility, number of reviews, e-commerce brand attitude, S-O-R model,
  pleasure arousal dominance, shopper emotions, purchase intention, repeat purchase from a platform,
  Journal of Product & Brand Management]
topics: [Retail, UGC]

