short_answer: >-
  Through the feelings they stir. In a survey of 835 online shoppers, believing the people behind the reviews went with more
  pleasure, a stronger sense of control and more nervous energy. Plenty of popular, well-rated reviews added pleasure and control,
  while convincing arguments added control and jittery excitement but no pleasure. Shoppers who felt in control and pleased
  held warmer views of the brand they wanted, and keyed-up shoppers were less likely to plan a return.

takeaways:
  - "Shoppers gave reviewer credibility the lowest score of the 3 review signals, averaging 4.6 of 7 points, but it alone was tied to all three feelings."
  - "Seeing lots of comments, good ratings and a popular product was the signal rated highest (5.5 on the same scale) and the one most closely tied to feeling in control."
  - "Of the 16 links in the model, the strongest ran from a sense of control to a favourable view of the brand."
  - "Of the 4 things tied to coming back to the same platform, pleasure pulled hardest, and a jittery mood, the next strongest, pulled the other way."

