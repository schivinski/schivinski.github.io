sections:
  - h: "What the researchers did"
    body: |
      Francisco Javier Blanco-Encomienda and Elena Rosillo-Díaz, both of the University of Granada's Faculty of Education,
      Economy and Technology in Ceuta, Spain, asked how the review section of a shopping site works on people's emotions, and
      whether those emotions reach as far as the brand. Plenty of research has looked at site design. Far less has looked at
      the social cues other buyers leave behind.

      They used a classic three-part frame: something in the setting (the stimulus) stirs an inner state (the organism), which
      shapes their next judgements and actions (the response). The stimuli were three impressions of the reviews: their quality
      (complete, accurate and convincing), their volume (lots of people commenting, good ratings, a popular product) and how
      credible the reviewers seemed (expert, trustworthy, reliable). The inner states were pleasure, arousal and a sense of
      control. The responses were attitude to the brand a shopper meant to buy and the intention to buy from the same
      platform again.

      A panel company ran the online questionnaire. Filter questions screened out people who do not shop online and a control
      question caught automatic answers, so 835 of 1,520 responses were kept. Everyone answered about the platform they use
      most. Before testing any links, the authors checked that the questions captured eight distinct ideas and that the model
      fitted the data acceptably (CFI 0.92, RMSEA 0.06).
    facts:
      - ["Participants", "835 online shoppers from a panel survey (1,520 responded); 52% women, about two in three aged 25 to 54"]
      - ["Shopping habits", "42% buy online at least weekly and 43% at least monthly"]
      - ["Setting", "Each person's most-used e-commerce platform; the paper names no platform or country"]
      - ["Measured", "Three review signals, three feelings, brand attitude and plans to return, all on seven-point agreement scales"]
      - ["Analysis", "Structural equation model, one survey dataset"]

  - h: "Which review signals stirred which feelings"
    body: |
      Credibility, meaning a sense that the people commenting know how to judge products and can be trusted, had the widest
      reach. It was linked with every feeling measured and had the strongest single link to pleasure.

      Volume did the most for shoppers' feeling of control and also lifted pleasure. It showed no link with arousal, so more comments did
      not seem to rattle anyone. Arousal here was measured with words such as frenzied and jittery, so it describes a tense,
      wound-up state rather than happy excitement.

      Quality behaved differently. Reviews judged complete, accurate and convincing went with more control and, more strongly
      than either other signal, with more arousal, yet they added nothing to pleasure. The authors' explanation: weighing up
      arguments is work, and it can keep shoppers on alert without making the visit any more enjoyable.
    chart: signals

  - h: "Feeling in control mattered most for the brand"
    body: |
      Two of the three feelings went with a warmer view of the brand people were shopping for. Control, the sense that your own
      choices decide what you see and do on the site, had the larger link. Pleasure had a smaller one. Arousal showed none.

      The authors suggest that seasoned online shoppers, or those familiar with a brand, do not hold a moment of tension on
      the site against it. That is their explanation; the survey did not test it.
    chart: brand

  - h: "What brought shoppers back to the platform"
    body: |
      The final outcome needs reading with care. Its four questions asked whether people would make their next purchase on the
      same platform and visit it again, so it captures loyalty to the shop more than to any one brand.

      Pleasure had the strongest link to it, a standardised coefficient of 0.50 on a scale where 0 means no link. Control
      followed at 0.27, and brand attitude added a smaller push of its own at 0.16. Arousal ran the other way at −0.36: with
      the other feelings held level, shoppers who felt frenzied or on edge were less inclined to come back. The authors think
      tension felt in the moment can halt a purchase even when it leaves the view of the brand untouched.

  - h: "What the authors suggest platforms do"
    body: |
      The advice follows from these links rather than from any test of it. Encourage more customers to comment, for instance
      with rewards or game-like incentives. Make genuine customer reviews easy to tell apart from promotional ones. Let shoppers
      filter reviews by quality, so finding the useful ones takes less effort, and add credibility cues like purchase counts
      or buyers' own product photos.

      They also want platforms to ease the nervousness of buying from a screen, making the exchange feel closer and warmer, and
      to do all of this without intruding on customers' privacy.

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["Read your product pages as a stranger", "Pick your three best-selling products. Open each page as a first-time buyer would, count the reviews, note the average rating and ask yourself whether you can tell who wrote each one."]
  - ["Choose your proof of a real buyer", "Pick two or three signs to show beside every review, such as a verified-purchase tag, how long the person has been a customer, or a photo they took of the product."]
  - ["Ask every buyer for a review", "Send one short request 7 to 10 days after delivery, with a one-tap star rating and an optional line of text. If you offer a thank-you, give it for any honest review and never tie it to a high score."]
  - ["Make good reviews easy to find", "Add filters for star rating, most helpful and reviews with photos. Pin the three most helpful reviews at the top so a shopper reaches them in two taps or fewer."]
  - ["Weed out anything that looks staged", "Once a week, scan new reviews for copied wording, bursts from new accounts or posts that read like adverts. Label gifted or sponsored reviews clearly and remove fakes."]
  - ["Ask shoppers how the visit felt", "Add three questions to your post-purchase survey: did shopping here feel pleasant, did you feel in control, did you feel rushed or on edge? Track the answers each month next to your repeat-purchase rate."]

expect:
  - "**Feelings first, sales later.** In this model the review signals reached the outcomes only through how shopping felt, and the final outcome was a stated plan to return, not a recorded purchase."
  - "**Convincing reviews cut both ways.** Strong, well-argued comments went with feeling more in control, but also with the tense arousal that went with fewer plans to come back."
  - "**Volume did not rattle shoppers.** More comments showed no link with feeling wound up. The authors suspect that long, demanding reviews strain people more than many short ones, an idea they did not test."
  - "**Rewards need care.** The authors suggest incentives for posting reviews. Tying a reward to a good rating would undercut the very credibility that mattered most here; that is our inference, not a finding."
  - "**The shop may gain most.** Because the outcome was a repeat purchase on that site, the payoff looks like loyalty to the retailer as much as to the brands it sells. That is an inference from how the outcome was worded."

limits:
  - "**One survey, one moment.** Everyone answered once, so these are associations. The data cannot show that reviews caused the feelings or the feelings caused the attitudes."
  - "**No platform or country named.** People answered about whichever site they use most, and the article gives neither the panel's country nor its fieldwork dates."
  - "**Impressions, not pages.** Review quality, volume and credibility were shoppers' own judgements, not counts taken from real product pages."
  - "**A sign that flips.** On its own, arousal went very slightly with more plans to return (a correlation of 0.14). The negative link appears only once pleasure, control and brand attitude are in the model, so treat it with some care. We draw this from the paper's own tables; the authors do not discuss it."
  - "**Panel answers.** The authors note that panel respondents may answer carelessly or misread questions, despite the screening and control questions."

faq:
  - q: "Do online reviews change brand attitudes?"
    a: "Indirectly, in this survey of online shoppers. Impressions of the reviews went with how pleasant and in control shopping felt, and those two feelings went with a kinder judgement of the brand they meant to buy (Blanco-Encomienda & Rosillo-Díaz, 2025)."
  - q: "What is the S-O-R model?"
    a: "Stimulus, organism, response: a framework from environmental psychology in which cues in a setting stir inner states that then lead people towards or away from something. Here the cues came from reviews, the inner states were emotions, and the responses were views of the brand and intentions to buy again."
  - q: "What are pleasure, arousal and dominance?"
    a: "Three classic dimensions of emotion: how good a person feels, how stirred up or alert, and how far they feel in charge. In this survey, dominance was asked as feeling that your own actions shape your experience on the site."
  - q: "Are detailed, persuasive reviews always a good thing?"
    a: "Not entirely. Shoppers who saw the reviews as thorough and convincing felt more firmly in charge, yet more tense too, and they did not enjoy shopping any more. The authors think judging arguments takes mental effort that keeps people on alert."
  - q: "Does the number of reviews matter?"
    a: "It did here. A sense that many people had commented, ratings were good and the product was popular went with more enjoyment and more control, and was unrelated to feeling on edge."

also:
  - doi: "10.1002/mar.22240"
    title: "Does Inconsistency Between Influencer-Generated and User-Generated Content Hurt Brands? The Role of Perceived Content Credibility"
    authors: "Liu, Wang, & Chen"
    journal: "Psychology & Marketing"
    year: 2025
    text: >-
      When what influencers say about a brand clashes with what ordinary users post, the brand loses favour, because
      the content as a whole starts to look less credible. In several studies, the harm grew when the influencer did not
      disclose the sponsorship. Stressing functional details and using two-sided messages softened it. Some gap between paid
      and organic voices is unavoidable, so it pays to plan for one.
  - doi: "10.1108/jpbm-03-2024-5017"
    title: "Do reviewers increase their preference for the products they reviewed? The effect of identity signaling on reviewers' niche product preferences"
    authors: "Huo, Yang, & Sun"
    journal: "Journal of Product & Brand Management"
    year: 2025
    text: >-
      Writing a review that touches on who you are seems to change what you buy next. Using purchase records and three
      experiments, the authors found that identity-related reviews nudged reviewers towards niche rather than mainstream
      products by easing doubts about their identity, more so when buying gifts for people unlike themselves. A review prompt
      shapes the writer as well as the reader.

