short_answer: >-
  Partly. In 21,190 Taobao livestream shows from 123 rooms that used both, AI hosts sold about as much as people once
  returns were taken off, yet drew far fewer likes, comments and new followers. For practical goods they matched people on
  every sales measure; for treats and other pleasure buys, people still sold more before refunds. Over those 20 weeks,
  the machines' edge on practical goods faded, while their pull on pleasure purchases grew.

takeaways:
  - "Machines do not tire: AI-hosted shows stayed on air 25.5% longer on average than shows presented by a person."
  - "The sales tie was a real one rather than a blind spot: a Bayesian test on sales after returns came out at 0.079, below the 0.1 mark that signals no genuine difference."
  - "For practical goods, the AI hosts' edge in category-slot sales (a model estimate of +0.076 averaged over the whole period) had turned into a small deficit (−0.075) by its end."
  - "AI hosts worked through shorter product lists: 28.7 items per show on average, against 49.5 when a person was hosting."

