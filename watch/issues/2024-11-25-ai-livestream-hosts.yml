title: "Can AI hosts replace people in livestream shopping? What a Journal of Business Research study found"
dek: >-
  Chinese retailers have started handing the microphone to virtual hosts that never get tired. A season of Taobao data
  shows where these machines sell as well as people, where they fall short, and how both change over time.
short_title: "Where AI livestream hosts sell, and where they stall"

description: >-
  Yuan et al. track 21,190 Taobao livestreams: AI hosts matched people on sales after returns but drew far less chat, fewer
  likes and fewer follows.

