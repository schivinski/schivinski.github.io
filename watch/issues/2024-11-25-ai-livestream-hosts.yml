sections:
  - h: "What the researchers did"
    body: |
      Haixia Yuan and Wenting Fang of Anhui University in Hefei, China, and Kevin Lü of Brunel, University of London, looked
      at a change Chinese shoppers can see on their screens. Live selling has grown fast, good hosts are scarce and expensive,
      and retailers have begun handing the show to virtual, AI-driven presenters instead. These hosts can talk through a
      product, read out coupons and answer questions without a break. The team asked where they do as well as
      people, on which outcomes, and whether that changes over time.

      They wrote their own software to collect show-by-show records from Taobao, the country's leading livestream shopping
      platform, and kept only the live rooms that had switched between AI and human hosts. Watching the replays told them
      who, or what, had presented each show. They then compared how viewers responded with their money (sales, sales after returns, and
      sales from the room's slot in Taobao's category pages) and in other ways (tapping like, posting in the live chat,
      following the room).

      The analysis came in three steps. The first compared AI and human hosts across all rooms, allowing for audience size,
      the number of products, show length, airtime in peak hours, weekends and shopping festivals. The second split the
      rooms by whether shoppers were buying for practical reasons or for pleasure. The third let the AI host's effect drift
      across the months, to see whether it grew or faded.
    facts:
      - ["Platform", "Taobao, China's leading livestream shopping site; records collected by the team's own software"]
      - ["Period", "21 July to 9 December 2021"]
      - ["Shows", "21,190 from 123 live rooms: 8,071 AI-hosted and 13,119 presented by people"]
      - ["Products", "924,036 items in categories such as beauty, office equipment, clothing and snacks"]
      - ["Scale", "The average show took more than 1 million yuan, in line with Taobao's live studios as a whole"]
      - ["Measured", "Sales before and after returns, category-slot sales, likes, live comments and new followers"]
      - ["Methods", "Models that allow for differences between rooms, Bayesian checks for real ties, and a model that lets effects change over time"]

  - h: "Sales held level, the chat did not"
    body: |
      On raw averages, the AI-hosted shows looked smaller on almost every count, as the chart shows. Part of that is
      audience size. AI hosts spent most of their airtime outside the hours when the most people are online, while
      retailers kept their human hosts for the busiest slots.

      Once the models allowed for audience size and the other differences between shows, the picture changed. The two
      kinds of host earned about the same after refunds, and about the same from their category slots. That is the core
      of the substitution story: on the money that stays in the till, a machine could take a person's place.

      Social response was another matter. Likes, comments and follows stayed below human levels in every version
      of the model, and on likes the time model showed no sign of the machines closing the gap at any point in the season.
    chart: gap

  - h: "Practical goods: a lead that does not last"
    body: |
      Split by type of buying, the result sharpened. Where people shop for practical reasons, AI and human hosts sold the
      same, and the AI hosts came out slightly ahead on category-slot sales. Questions about practical goods tend to have
      clear answers, such as price, quality, size or material, which suits a scripted machine. In these rooms the AI hosts'
      showing on comments and new followers even improved as the months went on.

      The lead did not survive the season. The authors' explanation is competition. Retailers bring in AI hosts to save
      money, rivals copy them to save money too, and soon the saving is simply the cost of doing business in that
      category. Being first stops paying once everyone has a machine.

  - h: "Pleasure goods: behind at first, then catching up"
    body: |
      Products bought for pleasure went the other way. In these rooms human hosts out-sold AI ones before returns over the
      period as a whole, though the two drew level on sales after returns and on category-slot sales. Shoppers buying a
      treat seem to want the warmth and personal attention a person brings.

      Over time, the AI host's effect on sales in these rooms climbed, from below zero at the start of the window to above
      it by the end. The authors credit the machines' ability to keep learning from data, though their figures cannot show
      what changed inside the AI tools. Comments and new followers moved the other way, falling off towards December, a pattern the authors tie to the personal, emotional questions that come with
      buying for pleasure.

  - h: "Where an AI host fits in the schedule"
    body: |
      The authors suggest bringing AI hosts in first where shoppers' needs are practical, then improving them steadily,
      because the early gain fades as rivals catch up. For pleasure goods they counsel patience: the machines started
      behind but were still gaining when the data ended, so investment in better AI there may pay off later.

      Read together, the findings point to a rota rather than a straight swap. We draw that conclusion ourselves; nobody
      tried out a mixed schedule in this research. The machine kept sales steady at a lower cost; the person kept the room
      talking and brought in followers. A retailer who cares about building a community around its live shows still needs people for that part.

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["Sort your range into two lists", "Split the products you sell live into two lists: things people buy for a practical purpose, such as chargers, storage or office supplies, and things they buy for pleasure, such as make-up, snacks or fashion. Put anything that could go either way on the pleasure list."]
  - ["Collect the 20 questions viewers ask most", "Read back through the comments from your last five live shows and write down the 20 questions you see most. Mark each one that has a fixed answer, such as price, size, material or delivery time."]
  - ["Give the virtual host the practical list", "Schedule the AI host for practical products in your off-peak hours, such as mornings and mid-afternoon. Load it with the fixed answers from your list and a short script for each product."]
  - ["Keep people on busy hours and treats", "Put your human hosts on your busiest hours, usually the evening, and on big sale days. Give them the pleasure list, where viewers want opinions, jokes and a reply that uses their name."]
  - ["Put a person behind every AI show", "Have someone watch the comments during each AI-hosted show and step in by voice or text when a question falls outside the script. Aim to answer within two minutes."]
  - ["Compare the two hosts monthly", "At the end of each month, line up AI-hosted and human-hosted shows on sales after refunds, likes, comment counts and follower growth. If the virtual host's sales on practical products slip two months running, refresh its script or hand the slot back to a person."]

expect:
  - "**Lower running costs.** The paper quotes Chinese industry figures: a human host earns roughly 10,000 to 20,000 yuan a month, while a ready-made virtual studio package was priced at 99,000 yuan a year. One cloud provider claims AI cuts the cost of a livestream by more than 30%."
  - "**Count what customers keep.** Across all rooms, AI-hosted shows trailed slightly on sales before refunds, but that difference disappeared once returns came off. Judge any trial on net sales."
  - "**Less interaction.** Even where sales hold steady, expect fewer comments and follows when the machine is hosting. If community matters to you, budget for shows that people present."
  - "**A season, not a fortnight.** The shifts in this data unfolded over months. A short trial will show where an AI host starts, not where it ends up."

limits:
  - "**One platform, one year.** Everything comes from Taobao between July and December 2021. The authors note that apps where shopping is added to entertainment video, rather than video added to a shop, may behave differently."
  - "**Retailers chose the schedule.** Shops decided when to send in the AI host, mostly away from peak hours. The models adjust for timing and audience size, but this was not a controlled test, so some differences may come from those choices."
  - "**All AI hosts treated alike.** The analysis did not separate simple scripted avatars from more capable systems, which may improve at very different speeds."
  - "**Two broad kinds of buying.** Rooms were sorted into practical or pleasure buying, but the paper does not explain how, and product categories were not compared one by one."
  - "**Shaky final weeks.** The sharpest turns in the time curves come at the end of the window, where the confidence bands are at their widest."

faq:
  - q: "Can AI hosts sell as well as human hosts in livestream shopping?"
    a: "On what customers kept after returns, yes, in rooms that used both. On every social signal, from likes to new followers, the machines fell well short of people, and their sales advantage on practical goods proved short-lived (Yuan et al., 2025)."
  - q: "What is an AI streamer?"
    a: "A virtual presenter, usually a digital human or avatar, that introduces products, reads out prices and coupons and answers viewers' questions during a live shopping broadcast. In 2022 Taobao named AI hosts and virtual sets as two of the most promising directions for live selling."
  - q: "What is danmaku?"
    a: "Live comments that scroll across the video as it plays, so the host and every other viewer can read them. Hosts reply on the spot, which makes this chat one of the main ways viewers take part in a show."
  - q: "Why do AI hosts get fewer likes and comments?"
    a: "Machines have limited perception, emotion and social skill, and they struggle with personal questions outside their script. People also tune in to live shopping for company and entertainment, not only to buy, and a person meets that need far better."
  - q: "Which products suit an AI host best?"
    a: "The authors suspect electronics may offer the biggest short-term saving, because buyers' questions there are objective, but that the advantage may also vanish fastest. Beauty and fashion may behave differently. They did not test categories one by one, and call for that work next."

also:
  - doi: "10.1177/00222429241304322"
    title: "The Impact of App Crashes on Consumer Engagement"
    authors: "Shi et al."
    journal: "Journal of Marketing"
    year: 2025
    text: >-
      With field data from an app and three experiments, this paper shows that a single crash can bring people back for more:
      the session is cut short, but the next one has more page views, driven by curiosity and a wish to finish what was
      started. That rebound never makes up for what the crash cost, and crashes that come often or close together push users
      away in frustration. A well-worded message after a crash softened the damage of repeated failures. The words on screen
      after something breaks are worth drafting as carefully as the feature.
  - doi: "10.1007/s11747-024-01057-2"
    title: "There is business like show business! What marketing scholars and managers can learn from 40 years of entertainment science research"
    authors: "Behrens et al."
    journal: "Journal of the Academy of Marketing Science"
    year: 2025
    text: >-
      This review gathers four decades of research on films, series, music, books and other entertainment, organised around
      six traits: these products are hedonic, story-driven, cultural, creative, innovative and digital. Plenty of other
      industries share at least one of those traits, so the lessons travel well beyond Hollywood. The authors also set out
      what entertainment firms, often the first to meet trends such as virtual worlds and generative AI, have learned about
      adapting to them. If your brand sells an experience rather than a function, someone in this field has probably met your
      problem already.

