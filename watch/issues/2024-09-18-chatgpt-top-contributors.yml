short_answer: >-
  Yes, at least at first. On Stack Overflow, the coding help site, the regulars who had been answering most posted fewer
  answers in the days after ChatGPT went public than in the same days a year earlier, and their answers drew fewer votes.
  Occasional helpers carried on as before. Members with the most reputation to protect pulled back hardest, and a ban on
  AI-written answers only partly reversed the slide.

takeaways:
  - "Of the answers deleted in the moderators' clean-up, almost 95% had been posted after ChatGPT went live: a measure of how fast machine-written replies poured in."
  - "Heavy answerers cut their daily answers by 8.1% compared with the matching days of 2021. Light answerers showed no measurable change."
  - "Fewer new questions explain part of the dip. Allowing for how many questions were posted each day cuts the regulars' overall shortfall from 11.2% to 4.7%."
  - "Votes slipped as well: answers from regulars scored 0.122 points lower on average, net of downvotes, and 0.149 lower among heavy answerers."

