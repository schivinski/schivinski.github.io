title: "Does generative AI drive away a community's most active contributors? What a Marketing Letters study found"
dek: >-
  When ChatGPT went public, a coding help site filled up with machine-written answers. Data on its regular helpers show
  that the helpers who had answered most were the ones who stepped back, and that banning AI posts won back only part
  of the loss.
short_title: "Why ChatGPT made a forum's keenest helpers post less"

description: >-
  Li and Kim find that after ChatGPT came out, Stack Overflow's busiest regular answerers posted 8.1% fewer answers a day,
  while occasional helpers kept pace.

keywords: [generative AI, ChatGPT, Stack Overflow, online community management, user-generated content, brand communities,
  Q&A platforms, top contributors, AI-generated content moderation, AI content disclosure, Marketing Letters]
