short_answer: >-
  They punish you for it. Across three American studies, more than half of viewers worked out on their own that the
  presenter in a customer-style video advert was an AI avatar, and those who did scored the ad 2.83 out of 7 against
  4.59 among the people who never noticed. Being told afterwards was a bigger surprise but a far gentler one,
  because the technology still read as clever. A short briefing beforehand made spotting it markedly more likely,
  which is the warning in the whole paper.

takeaways:
  - "No prompting was needed: 103 of the 187 people in the first study called the presenter out as synthetic on their own."
  - "Intention to buy fell as well, from 3.52 to 2.81, so this is not only a question of how the ad was liked."
  - "Viewers who were told afterwards found the technique far more novel, 4.16 against 3.18, and that is what cushioned them."
  - "A short briefing beforehand took recognition from 46% to 58%, with the ad itself left exactly as it was."

