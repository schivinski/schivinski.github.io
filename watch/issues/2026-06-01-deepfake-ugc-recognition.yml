title: "What happens when viewers spot the AI actor themselves? What a Journal of Retailing and Consumer Services study found"
short_title: "Caught, not told: the worst way for an AI actor to be found out"
dek: >-
  Brands are hiring AI avatars to play delighted customers. The question is no longer whether anyone notices. It is
  who gets to say it first, you or them.
description: >-
  Viewers who worked out the actor was AI rated the ad 2.83 against 4.59. Being told afterwards hurt far less, and
  priming people made them twice as likely to notice.
