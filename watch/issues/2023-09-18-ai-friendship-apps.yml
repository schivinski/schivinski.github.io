short_answer: >-
  It can be both. In a survey of 572 US adults who use AI companion apps such as Replika, the closer people felt to their AI
  friend, the more well-being they said chatting gave them. Yet that same well-being, along with loneliness, worry about
  being judged and the impression that the AI has feelings, went with higher addiction scores. Companions seen as warm and
  always available went with lower ones.

takeaways:
  - "Of the 7 possible drivers tested, only 1 predicted the well-being people said the app gave them: the strength of their bond with the companion."
  - "4 things were tied to stronger addiction: fear of judgment, believing the AI can feel, loneliness and the well-being gained from chatting. Fear of judgment carried the most weight."
  - "2 app qualities went with lower addiction scores: an AI friend that is always on hand and replies quickly, and one that comes across as warm."
  - "Replika was the app used by 38.5% of survey respondents and Kuki by 28.3%; the therapy-style apps Woebot and Wysa accounted for 8.4% and 7.9%."

