title: "Do AI friendship apps make users feel better, or make them dependent? What a Psychology & Marketing study found"
dek: >-
  Chatbot companions such as Replika offer conversation to people who feel alone. Reddit posts, interviews and a
  survey of app users in the US show that the benefit people report rests on their bond with the AI friend, and that
  more benefit goes with higher addiction scores.
short_title: "AI friends, well-being and addiction"

description: >-
  Marriott and Pitardi find that among 572 US users of AI friendship apps, the bond with the AI predicted well-being,
  while fear of judgment went with addiction.

keywords: [AI friendship apps, AI companions, Replika, chatbot companionship, loneliness and technology, digital well-being,
  app addiction, conversational AI design, responsible AI, netnography, Psychology & Marketing]
topics: [AI, Service]

