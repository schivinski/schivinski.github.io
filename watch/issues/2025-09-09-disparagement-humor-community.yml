title: "Should a brand roast its critics in social media replies? What a Psychology & Marketing study found"
dek: >-
  Witty put-downs of customers have made some brand accounts famous, yet on average they collect fewer likes than friendly
  replies. A field study and four experiments on X show that the jab which cools casual onlookers can pull a brand's own fans closer.
short_title: "When a brand's put-down pulls its fans closer"

description: >-
  Iveson and Harris find sarcastic brand replies on X win fewer likes and cool casual onlookers, yet draw fans closer by
  making their group feel distinct.

