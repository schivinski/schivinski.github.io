short_answer: >-
  Mostly not, unless the people watching are its fans. Across five studies, sarcastic brand replies to people on X won fewer
  likes and shares than friendly teasing, and left onlookers outside the brand's community feeling less attached to it. People who
  counted themselves members of the brand's community reacted the other way: the same put-down drew them closer, because it sharpened
  their sense that their group differed from the critic.

takeaways:
  - "Of 237 replies that six brands aimed at individual users on X, 46% were sarcastic, and those collected fewer likes and fewer shares than the friendly ones."
  - "Likes depended heavily on who was posting: differences between the six brands accounted for 55% of the variation in likes and 24% in shares."
  - "In a test with 349 Detroit Lions fans and non-fans, one sarcastic reply pushed the two groups in opposite directions, towards the team for fans and away from it for everyone else."
  - "A further test with 357 people found that insiders warmed to the brand because they felt different from the critic. A sense of being better than the critic explained none of it."

