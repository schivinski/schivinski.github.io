title: "Should a shopping chatbot let customers speak or type? What a Journal of the Academy of Marketing Science study found"
dek: >-
  Most chatbots expect customers to type. Five experiments show that speaking leads people towards choices made on
  feeling and typing towards choices made on reasons, and that people like their pick more when the mode suits the product.
short_title: "Speak or type: fitting the chatbot to the product"

description: >-
  Schindler et al. show that shoppers who speak to a chatbot pick more pleasure buys, those who type pick practical ones,
  and a fitting mode lifts satisfaction.

