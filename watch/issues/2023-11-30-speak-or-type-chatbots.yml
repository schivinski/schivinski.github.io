short_answer: >-
  It depends on what you sell. Across five experiments involving more than 1,000 people, speaking to a shopping
  assistant raised the odds that people picked options bought for enjoyment, while typing favoured practical ones.
  People were also more satisfied with their choice when the mode suited the product. Speaking helped a little-known
  brand more than a market leader.

takeaways:
  - "In a hotel-booking chat, 56% of the people who spoke chose the hotel described by enjoyment features such as a city view, while 70% of those who typed chose the one described by practical features such as a nearby subway station."
  - "When people were randomly told to send a voice or a text message about two new films, 66% of voice senders picked the action film and 63% of typists picked the documentary."
  - "Given a free choice, about two in three people typed rather than spoke: 67% in the hotel booking and 66% in a tablet purchase."
  - "For a minor tablet brand with 0.3% of the US market, people who spoke rated their chance of buying it clearly higher than people who typed. For the market leader, with 52%, the mode made no significant difference."

