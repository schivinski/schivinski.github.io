title: "What makes a brand's Facebook post engaging? What a Journal of Consumer Behaviour study found"
dek: >-
  Three researchers coded 600 brand posts from nine industries to see which choices of format, tone, endorser and
  timing went with more Likes, reactions, comments and shares. Pictures and feelings did better than links, prompts
  and micro-influencers.
short_title: "Photos, feelings and fewer prompts on Facebook"

description: >-
  Drossos et al. code 600 posts from 18 Greek brand Facebook Pages: photo posts, emotional appeals and service posts
  drew more engagement; posting hour did not.

keywords: [Facebook brand posts, social media content strategy, brand post engagement, Facebook Reactions,
  emotional vs informational appeal, post vividness, calls to action on social media, caption length,
  best time to post on Facebook, endorsers in brand posts, service vs product brands, Journal of Consumer Behaviour]
topics: [Social media, Creative]

