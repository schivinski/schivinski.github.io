short_answer: >-
  Simple, emotional posts did best. Across 600 posts from 18 of the most popular brand Pages in Greece, photo posts
  drew more engagement for the size of the audience than text, link or video posts, and posts without links, hashtags
  or calls to action outperformed those with them. Emotional posts collected more Likes than factual ones, service
  posts outdid product posts, and the hour of posting made no measurable difference.

takeaways:
  - "Three in four posts (75.7%) carried links, URLs or hashtags, but posts built around a photo drew the most engagement per fan."
  - "Only 117 posts in the sample used an emotional appeal. Those posts drew clearly more Likes and positive reactions than factual ones."
  - "Posts about services averaged 581 Likes, against 282 for posts about products."
  - "Posting in working hours, as 58% of the posts did, gave posts no measurable edge."

