short_answer: >-
  Mostly because of how the platform makes them feel. Researchers at Tianjin University recorded 25 Weibo users as they
  scrolled, asked each to estimate the share of ads, then interviewed them at length. Women who met stereotyped ads,
  hostile comments about women or a sense of being watched guessed high. Those who trusted the algorithm, or found ads
  useful for what they came to do, guessed low. Most of the men judged it about right.

takeaways:
  - "Of the 8 men, 6 came within one band of the recorded figure, on a 5-band scale running from under 1 post in 20 being an ad to over 1 in 7."
  - "The study centred on women who misjudged: of the 17 it analysed, 8 guessed too high and 9 too low, so both kinds of error were common."
  - "The misses traced back to 5 themes: why people use the platform, their attitude to algorithms, their grasp of how algorithms work, how watched they feel, and gender bias on the site."
  - "Coding the interviews turned up 11 kinds of reason behind guessing high and 8 behind guessing low, from hate speech aimed at women to ads that helped users make contacts."

