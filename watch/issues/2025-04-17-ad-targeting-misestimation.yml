title: "Why do some users feel flooded with ads while others hardly notice them? What a Journal of Advertising study found"
dek: >-
  Two researchers compared what Weibo users believed their feeds were showing them with what a screen recording caught.
  The guesses that ran high or low tracked how respected, how watched and how well served people felt on the platform.
short_title: "Why some users feel swamped by ads and others barely notice"

description: >-
  Zhang & Zhang find Weibo users misjudge how many ads they see: women who sense gender bias or feel watched guess high,
  those whose needs are met guess low.

keywords: [ad targeting, targeted advertising, perceived ad frequency, algorithm awareness, algorithmic bias,
  gender bias in advertising, perceived surveillance, personalized advertising, Weibo, social media advertising,
  Journal of Advertising]
topics: [Advertising, Personalization, Privacy]

