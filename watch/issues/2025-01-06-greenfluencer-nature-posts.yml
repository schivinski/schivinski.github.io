title: "Do an influencer's nature photos make followers act on climate change? What an International Journal of Advertising study found"
dek: >-
  Creators who champion green living fill their feeds with lakes, forests and coastlines. Two studies, one in Australia and one
  in the United States, show those quiet landscape shots do real persuasive work, and that trust in the creator makes them work harder.
short_title: "Why green influencers should post more nature"

description: >-
  Hartmann et al. show greenfluencers' landscape photos lift climate intentions: identical captions with nature pictures raised
  planned action by about 12%.

