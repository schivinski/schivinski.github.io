short_answer: >-
  Yes, they nudge followers towards it. In a US experiment with 600 adults, people saw three Instagram posts from a green influencer.
  The captions never changed; only the pictures did, either unspoilt landscapes or scenes with no nature in them. The landscape
  versions left people feeling they had spent time outdoors, more worried about the climate and readier to act. A survey of 550
  Australian Instagram users found the same chain, strongest where followers trusted the creator.

takeaways:
  - "Swapping in landscape photos, with every caption word for word the same, almost doubled how much viewers felt they were out in nature: 3.36 against 1.84 on a five-point scale."
  - "Planned climate action, such as cutting one's carbon footprint or choosing green power, came out about 12% higher after the nature posts."
  - "Reputation counted for more than the pictures: across both picture sets, planned action averaged 3.16 when the influencer was well regarded and 2.59 when she had been accused of greenwashing."
  - "Among Australian followers, how close to nature and how worried about climate they felt explained close to half (49%) of the differences in their plans to act."

