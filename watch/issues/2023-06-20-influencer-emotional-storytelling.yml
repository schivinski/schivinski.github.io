short_answer: >-
  Give the caption real feeling, keep its tone positive and expect the strongest return from creators with smaller
  followings. Across 6,122 sponsored posts on Instagram, arranged through one influencer agency, captions that expressed
  emotion about the product attracted more likes and comments than those written in a neutral way. A more pleasant tone
  added engagement; more intense wording had no detectable effect. That advantage became smaller as the influencer's
  follower count grew.

takeaways:
  - "Posts with emotional captions averaged 1,695 likes and comments, against 1,446 for neutral captions, before other factors were taken into account."
  - "Tone counted, intensity did not. Captions were scored from −1 (very negative) to +1 (very positive); higher scores went with more engagement, while stronger wording added nothing measurable."
  - "Follower counts ranged from 1,016 to 505,237, and the bigger the audience, the less extra engagement an emotional, upbeat caption brought."
  - "Most engagement came as likes: 1,625 per post on average, against 33 comments. A happier tone was linked to extra likes but slightly fewer comments, the latter a marginal result."

