title: "How do you make sponsored influencer posts on Instagram more engaging? What a Journal of Interactive Advertising study found"
dek: >-
  A team from KEDGE Business School and ETH Zurich scored the captions of 6,122 sponsored Instagram posts for emotion.
  Personal feeling helped, a pleasant tone counted for more than forceful wording, and the benefit faded as the
  influencer's audience grew.
short_title: "Emotional captions in sponsored Instagram posts"

description: >-
  Gross et al. find sponsored Instagram posts whose captions share upbeat feelings about a product get more likes and
  comments, above all for small influencers.

keywords: [influencer advertising, sponsored Instagram posts, emotional storytelling, Instagram captions, micro-influencers,
  macro-influencers, social media engagement, likes and comments, sentiment analysis, Google Natural Language API,
  influencer marketing agency, Journal of Interactive Advertising]
topics: [Influencers, Social media, Creative]

