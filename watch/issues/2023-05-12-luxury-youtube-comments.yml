title: "How do YouTube comments on luxury brands change with the brand's price tier? What a Psychology & Marketing study found"
dek: >-
  Luxury brands spend heavily on video, and the comments under it hold more than any view count. Software read the
  comments under 88 brand videos and found that the way people write shifts with the brand's tier, most of all for
  cars and beauty.
short_title: "What YouTube comments reveal about luxury tiers"

description: >-
  Oc et al. analyse 29,128 YouTube comments on nine luxury brands: entry-level brands drew candid wording, top-tier
  cars and beauty more analytical talk.

keywords: [luxury brand marketing, YouTube comments, electronic word of mouth, eWOM analysis, LIWC, automated text
  analysis, sentiment analysis, emoji sentiment, face recognition demographics, luxury video marketing, brand
  luxuriousness, Psychology & Marketing]
topics: [Social media, UGC, Research methods]

