short_answer: >-
  It changes, at least for cars and beauty. Across 29,128 English comments on 88 YouTube videos from nine luxury brands,
  the most accessible brand in each category drew the most personal, candid wording, while comments on the pricier car
  and beauty brands were more analytical. Fashion showed the fewest differences between tiers. The commenters' gender and
  age, estimated by AI from profile pictures, also changed how the tier related to what people wrote.

takeaways:
  - "In all 3 categories, comments on the entry-level luxury brand (BMW, Burberry, Lush) scored highest for authentic, personal wording."
  - "In cars and beauty, the middle tier drew the most positive wording: Charlotte Tilbury's comments scored 71.97 out of 100 for tone, against 61.61 for Chanel Beauty and 60.43 for Lush."
  - "For all 9 brands, the emojis in comments were more positive on average than the words around them."
  - "Of commenters whose age the AI could estimate, 76.9% to 83.3% per category were aged 20 to 39, and just 4.4% of beauty commenters were 40 or older."

