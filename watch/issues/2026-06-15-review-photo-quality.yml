title: "Why do five-star reviews come with better photos? What a Journal of Marketing Research study found"
short_title: "Nobody styles a photo of a bad cookie"
dek: >-
  Six studies, three hidden cameras and two cookies that looked identical. People photograph what they like with
  care and what they hate in a hurry, and that quiet difference decides which reviews a platform pushes up the page.
description: >-
  Judges called 72.3% of the photos in positive Amazon reviews well composed, against 39.7% of those in negative
  ones. Nobody stages a complaint.

