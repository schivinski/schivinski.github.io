short_answer: >-
  Not in the setting studied. The researchers tracked 54,953 social media posts published for 134 PC games, together with
  5.4 million replies. On days when the replies were more toxic, the games were played more in
  the days that followed. Posts celebrating a game's quality or inviting fans to belong drew more toxicity, and posts
  pushing sales drew less. All the effects were small.

takeaways:
  - "Posts showing off what a game does well drew more toxic replies for the next 6 days; posts inviting fans to feel part of a group, for 2."
  - "A more toxic thread drew extra comments for 4 days, and extra comments went with more playing time for over 9 days."
  - "Of the 20 themes a topic model found in the posts, only store discounts on PlayStation, Xbox and Steam went with more play, although selling content in general went with less."
  - "In threads with 3 or more comments, toxicity in the first two-thirds went with more play, while toxicity in the final third showed no significant link."

