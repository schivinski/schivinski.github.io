title: "Do toxic comments under brand posts drive customers away? What a Journal of Interactive Marketing study found"
dek: >-
  "Don't feed the trolls" is standard advice for brand pages. Two years of social media posts by 134 PC game brands point
  to a less simple picture: some kinds of post attract hostile replies, and hostile threads went with more playing, not less.
short_title: "Toxic comments, brand posts and how much people play"

description: >-
  Nepomuceno et al. find that when comments under PC game brands' social posts turned more toxic, players spent more
  time in those games for over ten days.

keywords: [toxic comments, internet trolls, marketer-generated content, brand social media posts, comment moderation,
  online brand community, Perspective API, social media engagement, product usage, video game marketing,
  panel vector autoregression, Journal of Interactive Marketing]
topics: [Social media, UGC]

