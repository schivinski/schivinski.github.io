title: "Does the page around your ad change how long people look at it? What a Journal of Marketing study found"
short_title: "Match ads to pages by look, not just by topic"
dek: >-
  Eye-tracking data on 3,531 magazine ads trained a model that predicts attention from images of the ad and the page
  beside it. Placing ads by its predictions lifted attention by up to 10%. Matching by topic or keywords alone did not help.
description: >-
  Placing ads by both look and topic of the page lifted predicted attention by up to 10%; matching by category or text
  alone did not. Evidence from 3,531 ads.
