sections:
  - h: "What the researchers did"
    body: |
      Contextual advertising, placing an ad next to content that suits it, is a market worth more than 200 billion US
      dollars a year. In practice, ads are usually matched to content by product and media category: fashion ads in
      lifestyle titles, kitchen ads on cooking pages. Jianping Ye and Michel Wedel (University of Maryland) and Rik
      Pieters (Tilburg University and Católica Lisbon) asked whether that is the best way to win attention.

      They used one of the largest eye-tracking databases studied so far: 3,531 display ads from 29 Dutch digital
      magazines, each viewed by 80 to 100 people as they leafed through the pages. From images of each ad and the page
      opposite it, they extracted dozens of features, from size, colour texture and visual clutter to the topics shown,
      described by an AI model that reads both words and pictures. A machine-learning model then learned to predict how
      long people looked at the ad and at its brand. Finally, they tested which placements would win the most
      attention.
    facts:
      - ["Data", "3,531 display ads in 29 digital magazines, 71 product categories and 812 brands; about 3,600 Dutch consumers"]
      - ["Measured", "Seconds of eye gaze on the whole ad and on its brand name or logo"]
      - ["Checks", "55 very different ads (banners, native, outdoor) and a controlled experiment with 715 people"]
      - ["Tool", "AdGazer, with free code and a public web app that predicts gaze from an ad and page image"]

  - h: "The page around your ad matters"
    body: |
      The model predicted attention well: its predictions correlated .83 with real gaze on ads and .80 with gaze on
      brands, better than two widely used image-recognition models. It also held up on ads it had never seen, such as
      banners, native ads and outdoor posters.

      The size of the ad and of its brand, text and picture still mattered most. But features of the surrounding page
      accounted for 33% to 43% of predicted attention to the ad, and about 20% of attention to the brand. Counting how
      ad and page features work together, the context was behind about half of ad attention.

      And the page competes. In a controlled experiment where 24 ads were placed at random beside editorial pages, the
      same ads drew about 1.2 seconds less gaze, and their brands about a quarter of a second less, than when shown
      alone. Good matching is a way to reduce that loss.
    chart: context

  - h: "Topic matching alone does not win attention"
    body: |
      The researchers then reassigned 749 ads to the available pages in 95 magazine issues, using the model to predict
      attention for each pairing. The placements actually used in the data were no better than random. Re-placing
      ads by product and media category, or by text and keywords only, the way most contextual targeting works, did
      not improve on them either.

      What worked was visual fit. Matching only on how ad and page look, the logic of native advertising, raised
      predicted attention by about 5% when any magazine could be chosen. Using both look and topic together raised it
      by 4.8% within a single magazine and by 10.1% across magazines. Choosing the magazine with the ad in mind
      doubled the gain.
    chart: placement

  - h: "Beyond the magazine page"
    body: |
      The study covers digital magazines viewed on a desktop screen, but the decision it improves is everywhere: which
      ad goes next to which content. My reading, not tested in the paper, is that the same logic applies to retail
      media pages, publisher sites, in-app placements and digital out-of-home screens, wherever you can see the ad and
      its surroundings before you buy. Matching on what the page is about is not enough; what it looks like matters as
      much.

      The bigger shift is cost. Predicting attention used to need an eye-tracking lab. Here each image is processed in
      about 1.5 seconds, so screening many ad-and-page combinations before a campaign becomes realistic.

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["Stop matching on category alone", "In this study, placing ads by product and media category, or by keywords, did no better than the placements in use. Treat category fit as a starting point, not the plan."]
  - ["Collect your options as images", "For each campaign, gather screenshots of the ad versions and of the pages or slots you could buy. The tool works from what people actually see."]
  - ["Score the pairings before buying", "Use the authors' free AdGazer web app or code, or a similar attention-prediction tool, to estimate ad and brand gaze for each ad-and-page pairing and shortlist the strongest."]
  - ["Match the look as well as the theme", "Pick pages whose visual style, colour and amount of clutter suit the ad, as well as its subject. Visual fit alone added about 5%; visual and topic fit together added up to 10%."]
  - ["Choose media with the ad in mind", "The gain doubled when ads could go to any title rather than into slots of a media vehicle booked in advance. Decide placement and media together, not one after the other."]
  - ["Check against real attention", "The model predicts; it does not prove cause. Test your top placements with real dwell-time or eye-tracking data, and track brand attention separately, because the page affects it less than attention to the ad."]

expect:
  - "**Gains of 5% to 10% in attention.** That is what better placement predicted here; the authors cite earlier research linking 10% more gaze to roughly 1% to 5% more sales."
  - "**A smaller effect on the brand.** Context drove about a third or more of ad attention but only about a fifth of brand attention."
  - "**Context costs attention by default.** Ads next to content got less gaze than ads alone, so a poor match is a real loss, not a neutral choice."
  - "**Low cost to try.** The code and web app are free, and scoring an ad takes seconds."

limits:
  - "**Magazines on a desktop screen.** The data come from digital magazines viewed in a lab in the Netherlands; results may differ for phones, social media feeds, video or search."
  - "**Prediction, not cause.** Feature contributions show what predicts attention, not what causes it, so they suggest hypotheses to test."
  - "**Simulated placements.** The 5% to 10% gains are model predictions from re-assigning ads, not results from a live campaign."
  - "**Attention is not sales.** The study measured gaze; the links to sales and revenue come from other research."

faq:
  - q: "Does the content around an ad affect how much attention it gets?"
    a: "Yes. In eye-tracking data on 3,531 digital magazine ads, features of the surrounding page accounted for 33% to 43% of predicted attention to the ad, and ads beside editorial content got about 1.2 seconds less gaze than when shown alone (Ye, Wedel and Pieters, 2026, Journal of Marketing)."
  - q: "Does contextual advertising improve attention?"
    a: "It can, if the match is done well. Placing ads by both the visual look and the topic of the page raised predicted attention by 4.8% within a magazine and 10.1% across magazines. Matching by category or keywords alone did not help."
  - q: "Is keyword-based contextual targeting enough?"
    a: "Not for attention, in this study. Matching ads to pages on text features alone did no better than the placements actually used. Image features of the ad and page mattered more."
  - q: "How can I predict how much attention an ad will get?"
    a: "Attention-prediction models trained on eye-tracking data can estimate it from images. The authors' AdGazer predicted real gaze with correlations of about .8 and is available as free code and a web app."
  - q: "What is the difference between native and contextual advertising?"
    a: "Native advertising matches the look of the ad to the page so it blends in; contextual advertising matches the subject. In this study, visual matching alone added about 5% attention, and combining both added up to 10%."

also:
  - doi: "10.1080/00218499.2025.2588040"
    title: "When in-feed ads carry a location tag: The effectiveness of local in-feed ads on offline and mobile sales"
    authors: "Zhang, S., & Ou, Y.-C."
    journal: "Journal of Advertising Research"
    year: 2026
    text: >-
      A quick-service restaurant chain in China ran social media in-feed ads tagged as being within 3 km of the store.
      Comparing 3 advertised stores with 26 similar ones, the ads raised in-store sales but lowered mobile-app sales,
      with effects depending on store age and review volume. A location tag pulls people through the door, so judge
      local ads on total sales, not just the channel they ran in.
  - doi: "10.1080/02650487.2026.2624918"
    title: "The carousel effect: Leveraging sideways swiping for enhanced ad effectiveness in social media"
    authors: "Rohrbach, S., Bruns, D., & Langner, T."
    journal: "International Journal of Advertising"
    year: 2026
    text: >-
      In four studies, including a real-world mobile eye-tracking study, carousel ads that people swiped through drew
      more attention and better brand recall than other in-feed formats, and longer carousels held attention longer.
      People were more likely to swipe ads from brands they already liked. Carousels reward strong brands; weaker brands
      need a first card that earns the swipe.

