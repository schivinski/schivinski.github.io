title: "Do AR try-on tools build stronger brand bonds? What a Journal of Consumer Behaviour study found"
dek: >-
  Watching sneakers appear on the feet through an AR try-on, rather than on a product page, helped women picture wearing
  them, feel more open to change and connect more with a sportswear brand. With Gucci, the shoes became easier to picture
  but the bond did not grow, and picturing did less for the sense of self when the virtual look felt far from the real one.
short_title: "AR try-ons, a more flexible self and closer brand ties"

description: >-
  Kim & Im find an AR sneaker try-on made women see themselves as more changeable and tied them closer to a sportswear
  brand, but not reliably to Gucci.

