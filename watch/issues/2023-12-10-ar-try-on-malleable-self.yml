short_answer: >-
  For an everyday brand, yes. In an online experiment, 116 US women in their 20s and 30s watched a sneaker try-on filmed
  from the shopper's point of view, either through an AR app or on a mobile website. The AR version made the sportswear
  brand feel closer to their own identity, by helping them picture wearing the shoes and feel that their self-image
  could change. With Gucci sneakers, that closer bond did not reliably appear.

takeaways:
  - "After the AR try-on video, ease of picturing oneself in the sneakers averaged 5.84 out of 7. The mobile website video produced 4.98."
  - "Seen through AR, the sportswear sneakers lifted agreement that one's self-image can change from 4.35 to 5.01."
  - "The sense that the sportswear brand reflects who you are rose to 5.29 with AR, from 4.66 on the website, measured the same way."
  - "With Gucci sneakers, AR still made the shoes easier to picture (5.65 against 5.13), but brand connection (4.93 against 4.37) did not differ reliably."

