title: "Do online customers need to trust the app or the company behind it? What an Electronic Markets study found"
dek: >-
  Anyone using a shopping site or a banking app is weighing up two things: the technology on the screen and the firm
  that runs it. A meta-analysis across online retail, banking and e-health finds the two closely linked, both related
  to use, and fed by partly different drivers.
short_title: "Trusting the app, trusting the firm"

description: >-
  Kuen et al. pool 272 samples on online trust: faith in an app and in the firm behind it go together, track intention
  to use, and rise with reputation.

keywords: [online trust, trust in technology, trust in provider, website trust, technology acceptance, intention to use,
  online reputation, institution-based trust, trust transfer, online banking trust, meta-analysis, Electronic Markets]
topics: [Service, Retail]

