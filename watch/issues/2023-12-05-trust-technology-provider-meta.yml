short_answer: >-
  Both, and the two go together. Pooling 272 samples with 105,199 respondents in online shopping, banking and health,
  the researchers found that trust in the website or app and trust in the company each had a strong link with whether
  people intended to use the service. When both were modelled side by side, the technology carried slightly more
  weight. Reputation was the strongest correlate of either kind of trust, while familiarity mattered more for the
  system than for the firm.

takeaways:
  - "Trust in the technology and trust in the provider were strongly related, at a correlation of 0.59 across 25 samples, where 1 would mean they always move together."
  - "Each kind of trust was linked to intention to use at about the same level: 0.50 across 128 samples for the technology and 0.50 across 105 for the provider."
  - "Familiarity from past use went with trust in the system more than with trust in the company: 0.52 against 0.36."
  - "In banking, the sense that safeguards such as guarantees and regulation are in place correlated 0.69 with trust in the provider, against 0.24 in online shopping (5 and 18 samples)."

