title: "Should every influencer in a campaign share the same look? What a Journal of the Academy of Marketing Science study of 182 campaigns found"
dek: >-
  Briefing a dozen creators on one campaign raises an old question: should their pictures match, or should each person do their own thing?
  An agency's records from 182 Instagram campaigns suggest the answer depends on where the content appears.
short_title: "Matching looks suit posts, a mix suits stories"

description: >-
  Boluki et al. studied 1,812 Instagram posts and stories from 182 influencer campaigns: matching looks suit posts, while stories do better with a mix.

keywords: [influencer marketing, visual consistency, Instagram posts and stories, influencer briefs, image analysis, social media engagement,
  campaign creative, micro and macro influencers, visual strategy, content strategy, Journal of the Academy of Marketing Science]
topics: [Influencers, Social media, Creative]

image:
  file: issue-41-visual-consistency.jpg
  og: issue-41-visual-consistency-og.jpg
  alt: "A wall of large oval discs in cream, orange, red, blue and mint hanging in a grid in front of a concrete building"
  caption: "One shape, one palette, and room to vary the colour. Photo: Austin on Unsplash."

short_answer: >-
  Keep feed posts matched, and loosen up for stories. In 707 sponsored Instagram posts, those whose look lined up with other posts in
  the same campaign earned more likes. In 1,105 stories the picture was mixed: some cues earned clicks by staying the same, others by
  changing. A brief that picked which cues to match and which to vary beat both "everyone match" and "everyone be different".

takeaways:
  - "Posts did better when a campaign's images matched on brightness, colour complexity, number of faces, face size and diagonal layout. Brightness mattered most."
  - "Stories were a blend. Keeping the person's presence and any on-image text steady went with more clicks, and so did changing the setting, the activity and the colour temperature."
  - "Creators with 100,000 or more followers and product campaigns leaned toward matching posts. Smaller creators and service campaigns did better with a mix."
  - "In simulations, a brief that decided cue by cue what to keep and what to change beat one-size-fits-all advice, with predicted gains of about 1% for posts and 7% for stories. These are model scenarios, not tested results."

