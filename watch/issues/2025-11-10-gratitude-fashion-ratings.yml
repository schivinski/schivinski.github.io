short_answer: >-
  Some do, and gratitude appears to be the link. In an online study with 393 US women, those who wore larger sizes and worried
  that others judge them by their weight felt more grateful to a clothing seller, and grateful shoppers gave it more stars. Women
  without that worry showed no such pattern. Across 6.5 million sales of summer clothes on a large marketplace, better-rated
  sellers also sold more, though only modestly.

takeaways:
  - "Among women in larger sizes, gratitude to the seller was about 3.8 out of 5 when worry about weight stigma was high, against about 3.1 when it was low."
  - "The link between size and gratitude only appeared once worry about weight stigma reached 3.25 out of 7, a level that 62% of the women met or passed."
  - "When women could pick from four colours, 57% to 58% chose black, yet black went with more gratitude for larger sizes in only two of three studies."
  - "Being able to find one's size did not explain the gratitude, and a range of 64 designs worked no better than one of 4."

