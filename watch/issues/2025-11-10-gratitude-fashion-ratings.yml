title: "Do larger-sized shoppers give online fashion stores better ratings? What a European Journal of Marketing study found"
dek: >-
  Women in larger sizes who fear weight-based judgement feel grateful to the online stores that dress them, and grateful
  shoppers hand out more stars. Three online studies, plus sales records from a big marketplace, follow that chain from
  feeling to rating to sales.
short_title: "Larger-sized shoppers, gratitude and star ratings"

description: >-
  O’Rourke et al. find larger-sized women who fear weight stigma feel more grateful to online fashion stores, and that
  gratitude goes with higher star ratings.

keywords: [plus-size fashion, larger-sized shoppers, online fashion retail, inclusive sizing, size inclusivity, consumer gratitude,
  weight stigma, seller ratings, star ratings and sales, black clothing, European Journal of Marketing]
topics: [Retail, UGC]

