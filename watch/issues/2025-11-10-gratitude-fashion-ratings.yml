sections:
  - h: "What the researchers did"
    body: |
      Anne-Maree O’Rourke from The University of Queensland,
      Hiba Khan from Bond University, and
      Frank Mathmann and Shasha Wang from Queensland University of Technology, all in Australia, began with a well-known
      pattern. Many larger-sized women prefer to buy clothes online, partly to avoid fitting rooms, unhelpful staff and stores
      that tuck bigger sizes away. Far less is known about how these shoppers feel once they are on a retailer's site, and
      whether those feelings reach the seller's ratings.

      The team's answer was gratitude. As they saw it, stocking larger sizes costs a seller more fabric and effort, while
      shopping online spares these customers some of the judgement they meet in person. That mix can leave shoppers thankful,
      and thankful people like to give something back.

      Three online studies put women in front of an invented store, My Clothing Shop, offering one T-shirt in 14 sizes from 3XS
      to 8XL, with the chance to bid on it as an entry into a cash prize draw. Women then said how grateful, thankful and
      appreciative they felt towards the store. Their body size came from the clothing size they usually wear or, in one
      study, from the height and weight they reported. A fourth study turned to real sales records.
    facts:
      - ["Participants", "886 women recruited on Prolific: 313 in the UK, then 180 and 393 in the US"]
      - ["The store", "An invented online seller offering a single T-shirt in every size from 3XS to 8XL"]
      - ["What changed", "T-shirt colour, assigned in the first study and chosen by the women in the next two"]
      - ["Measured", "Gratitude towards the store (1 to 5), worry about weight stigma (1 to 7) and, in the third study, a star rating"]
      - ["Field data", "Seller ratings and sales for 1,491 summer clothing products on Wish.com"]
      - ["Design note", "Body size cannot be assigned at random, so every link with size is an association"]

  - h: "Worry about being judged makes the difference"
    body: |
      The clearest result concerns weight stigma: the fear that other people will judge you, reject you or withhold respect
      on account of your weight.

      The second study measured body size by body mass index. A higher index went with more gratitude only for women who felt
      this fear at a middle or high level. At a low level there was no link at all. The third study, with T-shirt size in place
      of body mass index, found the same thing. Among women who worried little, size did not change how grateful they
      felt. Among those with average or strong worry, larger sizes went with more gratitude, and the pattern was strongest among
      the most worried.

      The authors think online shopping matters most to the women who most fear being judged in a store. The first
      study supports part of that story: women in bigger sizes reported more shame about shopping for clothes in person.
    chart: stigma

  - h: "Black helped, though not every time"
    body: |
      Colour was the second factor. Black has a reputation for slimming and for letting the wearer blend in, so the team
      expected it to protect the comfort of shopping from home.

      In the first study, colour was handed out at random. Among larger-sized women, those shown the black T-shirt
      reported more gratitude than those shown white, blue, green, yellow or grey. Among women in smaller sizes, black did
      slightly worse than the colours. In the second study women picked their own colour, and the pattern for black held.

      The third study broke the run. There, the colour a woman chose did not alter the link between her size and her
      gratitude, even though black was again the most popular pick.
    chart: colour

  - h: "Having your size was not the point"
    body: |
      Could the gratitude simply be relief at finding something that fits? The team checked twice. In the first study they asked
      how much women expect to find their size when shopping for clothes online. That expectation had no bearing on gratitude,
      and the colour pattern survived with it taken into account. In the third study, half the women saw a store with a large
      range of designs and half a store with a small one. The size of the range changed nothing.

      The authors put the gratitude down to how safe the online store feels, rather than to choice. Feeling safe
      was never measured, though, so this part rests on their interpretation.

  - h: "From stars to sales"
    body: |
      In the third study, women also gave My Clothing Shop a rating from one to five stars, and the average came to just over
      four. Gratitude did the connecting: once it was accounted for, body size and the rating were no longer linked. The route
      from size through gratitude to stars ran only for women with at least average worry about weight stigma.

      The fourth study used records from a large online marketplace where third-party sellers are rated by buyers. Products from
      better-rated sellers sold more, a modest association with a correlation of 0.12. Products in larger sizes carried slightly
      higher seller ratings and also sold more, partly through those ratings. The pattern held when the team kept only products
      made for women. These are associations in real data. By the authors' own account, they cannot prove that ratings
      cause sales.

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["Audit your size range", "List the sizes on offer for your 20 best-selling styles. Where a style stops at XL, plan two or three larger sizes for the next order."]
  - ["Keep black in every size", "For each style sold in extended sizes, offer black alongside the colours. Check stock weekly so black never runs out in the largest sizes first."]
  - ["Put every size on one page", "Show all sizes on the same product page and in the same filters, not in a separate corner of the site. Launch new styles in every size on the same day."]
  - ["Open review requests with thanks", "Start the post-delivery email by thanking the customer for shopping with you. Then ask what they appreciated about the order, four or five days after it arrives."]
  - ["Test the thank-you wording", "For four weeks, send half your customers the new email and half your usual one. Compare how many reviews each version brings in and the average stars."]
  - ["Track ratings by size band", "Every month, split your ratings into small, middle and extended sizes. If extended sizes trail, read those reviews first and fix what they mention."]

expect:
  - "**Gratitude sits with one group.** The lift showed up among larger-sized women who feel judged on their weight, not across all shoppers."
  - "**A small step per customer.** In the third study, each extra point of gratitude on the five-point scale went with roughly one third of a star."
  - "**Everyone sees the stars.** Ratings are public, so in the authors' view goodwill from larger-sized customers can help a seller win shoppers of every size."
  - "**Costs are real.** Larger garments use more material. The authors believe the rating benefit outweighs that, but they did not put a number on costs or profit."

limits:
  - "**Associations, not proof.** Nobody can be given a body size at random, so the ties between size, gratitude and ratings are correlations."
  - "**A scenario, not a purchase.** Women reacted to one T-shirt from a made-up store in a short online task, not to a real shopping trip."
  - "**Women in two countries.** Only women living in the UK or the US took part. Other genders, cultures and categories such as shoes or accessories were not covered."
  - "**Colour is a weak lead.** The black T-shirt result did not hold in the third and largest study."
  - "**Stars and sales move together.** The marketplace records cannot tell which one drives the other."

faq:
  - q: "Do plus-size shoppers prefer buying clothes online?"
    a: "Earlier work says many do, partly to avoid changing rooms, awkward encounters with sales staff and plus-size sections placed at the back of the store. This paper looks at what happens next: larger-sized women who are anxious about weight stigma tend to feel thankful to the online seller, which in turn comes with better ratings for the store (O’Rourke et al., 2025)."
  - q: "Weight stigma: what exactly was measured?"
    a: "It is the worry of being judged, turned away or treated unfairly by others because of your weight. The team measured it with five statements, each answered on a seven-step scale."
  - q: "Should online fashion stores push black clothing?"
    a: "Offer it rather than push it. The colour effect came and went across the studies, and the authors still recommend a wide range of styles and colours."
  - q: "Do better seller ratings lead to more sales?"
    a: "They tend to rise together. In marketplace records for almost 1,500 clothing products, higher-rated sellers sold more, but the link was modest and the data cannot settle cause and effect."
  - q: "Why focus on gratitude rather than plain happiness?"
    a: "Gratitude carries a wish to give something back to whoever helped you. The authors argue this makes it less self-focused than happiness or enjoyment, and more likely to reward the seller, for instance with a good rating."

also:
  - doi: "10.1002/mar.70071"
    title: "Diversity in Femvertising: An Experimental Investigation"
    authors: "Papadopoulou, Hultman, & Oghazi"
    journal: "Psychology & Marketing"
    year: 2026
    text: >-
      Ads that set out to empower women are now common, but does a diverse cast make them work better? Across four experiments,
      more diverse representation improved how people saw the brand and their intention to buy, mainly because the brand seemed
      more authentic. Political leaning split the response: liberals warmed to diverse ads, while conservatives
      preferred casts that looked alike. Inclusion lands best when it reads as genuine rather than token, and when you know who
      is watching.
  - doi: "10.1002/cb.70058"
    title: "Alignment of GenAI Modalities With Product Types in Generating Ads: The Mediating Roles of Cognitive Load and Perceived Immersion"
    authors: "Huang & Jiang"
    journal: "Journal of Consumer Behaviour"
    year: 2026
    text: >-
      Some AI tools work in a single format, while others blend text, images and sound. Drawing on real-world data and two
      online studies, this paper finds that multimodal AI ads suit experience products because they make people feel immersed,
      while single-format AI ads suit search products because they are easier to take in, which lifts intentions to buy. The
      product, more than the novelty of the tool, should decide how rich the AI-made ad needs to be.

