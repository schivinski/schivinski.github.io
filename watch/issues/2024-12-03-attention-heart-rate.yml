title: "How can you tell if viewers are really paying attention to a video ad? What an International Journal of Advertising study found"
dek: >-
  Advertisers are being urged to buy attention instead of impressions, and most attention data come from tracking eyes.
  A lab comparison of eight body signals, checked against brainwaves, found that a viewer's heart rate separated
  well-watched ads from weaker ones far better than their gaze did.
short_title: "Why heart rate beats eye tracking for ad attention"

description: >-
  Hartnett et al. find heart rate sorted 9 of 10 video ads into high or low attention in a lab test, while eyes-on-screen
  tracking did no better than guessing.

keywords: [attention measurement, attention metrics, video advertising, heart rate, eye tracking, EEG,
  attention-based media buying, advertising effectiveness, biometrics, neuromarketing, International Journal of Advertising]
topics: [Advertising, Research methods]

