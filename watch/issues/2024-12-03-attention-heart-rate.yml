  alt: "A packed cinema with rows of red seats, the audience lit by the glow of the screen and looking up towards it"
  caption: "Counting eyes on a screen is easy. Knowing what gets through is harder. Photo: Krists Luhaers on Unsplash."

short_answer: >-
  Watch their heart rate, not just their eyes. In a lab, 261 viewers sat through an hour of TV with ad breaks while
  sensors recorded eight body signals, which were then checked against brainwave readings and the viewers' own ratings.
  A slight slowing of the heart, compared with each person's resting rate, was the only scalable signal that reliably
  separated ads people attended to from ads they half-watched. Gaze-based scores missed the difference.

takeaways:
  - "A heart beating more slowly than at rest put 9 of the 10 test ads in the right group, high or low attention, matching the brainwave benchmark."
  - "Eyes-on-screen time and fixation counts labelled all 5 low-attention ads as high-attention ones, because viewers kept looking at the screen through the weaker ads too."
  - "Averaged across the eight body signals, accuracy was 54%, barely above the 50% that pure guessing would score."
  - "Only the high-attention ads changed which brand people picked: they captured 27% of the possible gain over viewers who saw no ads, while low-attention ads captured none."

