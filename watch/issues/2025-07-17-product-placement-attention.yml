title: "How do you get viewers to notice a product placed in a video? What a Journal of Advertising study found"
dek: >-
  Seventy-one viewers watched clips from TV series on an eye tracker while every second of each scene was coded. Where
  their eyes went depended on the product's part in the plot, whether anyone named it, how easy it was to see and what
  the scene had just done.
short_title: "What makes viewers look at a placed product?"

description: >-
  Yu et al. tracked 71 viewers' eyes on TV clips: a placed product won looks when the plot needed it and a character
  named it, and the scene's mood counted.

keywords: [product placement, brand placement, eye tracking, visual attention, video advertising, embedded advertising,
  branded content, verbal brand mention, visual salience, biometrics in advertising, Journal of Advertising]
