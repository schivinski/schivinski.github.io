short_answer: >-
  Write it into the story, have someone name it and mind the scene. In one experiment, 71 young adults in Taiwan had
  their gaze tracked across 12 TV clips, each with one placed brand. A product the plot needed and a character
  mentioned drew more looks than an unnamed one, most of all when hard to spot. Naming an off-plot product paid off
  only if it already stood out, and exciting moments pulled eyes to every product.

takeaways:
  - "The average placed product ranked 6.74 for how much it stood out from the rest of its frame (1 is the first thing the eye would hit), roughly where a spoken mention stopped helping off-plot products."
  - "When the plot needed the product and it was named, looks rose steadily as it got harder to see, across the whole 1 to 14 salience range; unnamed products barely changed with visibility."
  - "Exciting stretches in the 2 to 5 seconds before a product appeared raised attention to it, and excitement while it was on screen lifted on-plot and off-plot products alike."
  - "Busier pictures during an appearance, scored across 7 visual production features, helped on-plot products and pulled eyes away from off-plot ones, whatever the soundtrack was doing."

