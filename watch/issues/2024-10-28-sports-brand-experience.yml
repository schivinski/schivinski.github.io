title: "Does experiential marketing make people more engaged with sports brands? What a Scientific Papers of Silesian University of Technology study found"
dek: >-
  We asked 526 Australians about a sports brand they had experienced in real life, not just seen advertised. The fuller
  that experience, the stronger the feelings it left behind. And the people who felt most were the ones most engaged
  with the brand: thinking about it, enjoying it and choosing it first.
short_title: "Sports brands win engagement through feelings"

description: >-
  Schivinski et al. surveyed 526 Australians: richer real-life experiences with sports brands stirred stronger feelings,
  which went with deeper engagement.

keywords: [experiential marketing, brand experience, sports marketing, consumer brand engagement, emotional branding,
  brand activations, run clubs, fan engagement, stimulus-organism-response model, Australian sports brands,
  Scientific Papers of Silesian University of Technology]
topics: [Advertising, Social media]

