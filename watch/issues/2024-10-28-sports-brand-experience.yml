short_answer: >-
  Yes, and feelings are the bridge. In our survey of 526 Australians who had encountered a sports brand's advertising
  in person, those who rated the experience as richer for the senses, the emotions, the mind and the body
  also reported stronger emotional responses to the brand. People with stronger emotional responses were, in turn, more
  engaged with it. So the thing to design for is how an experience leaves people feeling.

takeaways:
  - "Of the two links we tested, the one from feelings to engagement was the stronger: 0.50 on a standardised scale, against 0.39 from the experience to feelings."
  - "Happiness was the strongest emotion people recalled from their last encounter with the brand, at 4.03 out of 5, ahead of excitement at 3.91."
  - "People leaned on feeling rather than thinking: feeling very positive when using the brand averaged 3.88, wanting to learn more about it just 3.13, both out of a possible 5."
  - "Feelings, together with age and gender, explained 27% of the variation in engagement scores: a respectable share in consumer research, with most of engagement still driven by other things."

