title: "Do food scanner apps sway shoppers more than the nutrition grade on the pack? What a Psychology & Marketing study found"
dek: >-
  Phone apps that grade groceries now compete with the scores printed on packs. Four studies from France show the app
  wins only in particular cases: a bad score, a brand without a big name, and a shopper who does not put official sources first.
short_title: "When scanner apps beat the label on the pack"

description: >-
  Cornudet et al. find a poor score in a food scanner app deters shoppers more than the same grade on the pack, except for
  a market leader or label loyalists.

keywords: [food scanner apps, Yuka app, Nutri-Score, front-of-pack nutrition labels, nutrition labelling, consumer distrust,
  brand equity, healthier food choices, perceived healthiness, food marketing, Psychology & Marketing]
topics: [Retail, UGC]

