short_answer: >-
  Sometimes, and mainly when the score is bad. Among 407 French adults tested online, a poor rating on a phone app that
  grades food put people off an orange juice brand more than the same poor grade printed on the pack. A second
  experiment found the app's extra bite held for a mid-range brand but not for the market leader, and grew as shoppers'
  trust shifted from official labels towards apps.

takeaways:
  - "Compared with showing no grade, a poor score in the app cut ratings of the juice brand by 1.63 points out of 7, while the same poor grade on the pack cut them by 0.94."
  - "Good grades barely registered: they nudged brand ratings up by 0.30 points on the pack and 0.35 in the app, too little to count as a real lift."
  - "77.1% of people surveyed linked front-of-pack labels to governments or big companies, against 26.6% for scanner apps."
  - "Almost half the shoppers (49.5%) trusted the official label more than the app and 21.7% leaned the other way; the app's extra pull grew as trust tilted towards the app."

