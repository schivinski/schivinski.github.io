title: "Does the content around your social media ad matter? What a Journal of Marketing study found"
short_title: "Test your ads in the feed, not on a slide"
dek: >-
  People meet your ad between memes, news and friends' posts, yet most ads are tested alone. A free tool that
  recreates a scrollable feed shows how bad neighbours hurt your brand and why holding attention beats ad position.
description: >-
  The same airline ad scored lower (4.31 vs 4.82 out of 7) when placed among flood posts. How to pretest social ads in
  a realistic feed, for free.
keywords: [brand safety social media, ad context effects, pretest social media ads, social media ad testing, feed
  experiments, ad recall, attention, dwell time, ad placement, A/B testing limits, Journal of Marketing]
topics: [Social media, Advertising, Research methods]

