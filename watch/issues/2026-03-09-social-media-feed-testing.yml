short_answer: >-
  Yes. When the same airline ad for flights to Brazil appeared among posts about deadly floods in Brazil instead of
  ordinary Brazil content, people rated the airline lower (4.31 against 4.82 out of 7), and the damage grew the longer
  they looked at the ad. In a second test, ads higher up the feed were remembered more, but only because people spent
  more time on them. The researchers released a free tool, DICE, that lets brands and researchers test ads inside a
  realistic scrollable feed before launch.

takeaways:
  - "An airline ad placed among posts about a flood disaster in the destination lowered brand attitude from 4.82 to 4.31 out of 7, with the same ad in the same position."
  - "The harm appeared only when people looked at the ad for more than about 2.3 seconds; those who scrolled straight past were unaffected."
  - "Ads further up a feed were recalled more, but attention explained the effect: once time spent on the ad was counted, position no longer mattered."
  - "Likes and comments are a poor test signal: only 11% of people liked any of the five ads in a 40-post feed, and 1% replied to one."

