title: "Do shoppers prefer a chatbot when buying embarrassing products? What a Journal of Consumer Psychology study found"
dek: >-
  Some purchases make people blush even when they are alone with a laptop. Six studies show that a chatbot which is
  upfront about being software can put those shoppers at ease, as long as nobody tries to make it seem human.
short_title: "Why an honest bot beats a person for awkward purchases"

description: >-
  Jin et al. find people buying awkward products open up more to a chatbot that admits it is a bot, while a humanlike
  look and excited tone cancel the edge.

keywords: [chatbots, chatbot disclosure, embarrassing products, AI customer service, humanlike chatbots, anthropomorphism,
  online customer service, live chat, consumer embarrassment, self-presentation, Journal of Consumer Psychology]
topics: [AI, Service, Retail]

