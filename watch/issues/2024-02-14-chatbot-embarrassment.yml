short_answer: >-
  Often, yes, if the bot is plainly labelled and does not act human. In an experiment where more than 1,300 Americans
  imagined buying diarrhoea medicine online, people were readier to chat with an agent that said it was a bot than with
  a human service rep. Give that bot a cartoon face and gushing lines and its edge largely vanished. And when nobody says
  who is typing, shoppers with something to hide tend to assume a person is.

takeaways:
  - "Buying hay fever tablets, 91% of students picked the online pharmacy with a human adviser over one run by a chatbot. Switch the purchase to antidiarrhoeal medicine and the chatbot shop gained ground, with awkwardness showing up in people's written reasons."
  - "In a live skincare chat, 119 of the 191 people who handed over an email address for a free sample had been talking to a labelled bot; only 72 had been talking to a supposed person."
  - "A cartoon face and an excited tone made a labelled bot seem far more able to feel: 2.77 against 1.79 for a plain speech-bubble bot, with a human rep at 3.61."
  - "For the 14.5% of people most uneasy talking about sex, a humanlike bot that openly called itself a bot was credited with roughly as much inner life as a human agent."

