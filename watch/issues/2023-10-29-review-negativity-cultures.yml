title: "Are negative online reviews more helpful, and does culture change the answer? What a Journal of Consumer Behaviour study found"
dek: >-
  On Amazon's Indian and US sites, reviews in critical language collected more helpful votes. In an experiment with
  five reviews of one phone, Americans found the glowing set both more useful and more concrete than Indian participants did.
short_title: "Negative reviews, helpful votes and culture"

description: >-
  Shah et al. find negative wording drew more helpful votes on Amazon in India and the US, yet in an experiment
  Americans rated glowing phone reviews most useful.

keywords: [online reviews, review helpfulness, negative reviews, review sentiment, review subjectivity, concrete language,
  cross-cultural marketing, individualism and collectivism, Amazon reviews, India and US shoppers, review ranking,
  Journal of Consumer Behaviour]
