short_answer: >-
  It depends on where you look. In 99,746 Amazon reviews from India and the US, reviews written in more negative
  language drew more helpful votes in both countries. Yet when 234 Americans and Indians rated sets of five phone
  reviews, critical ones came out least helpful. Americans rated the positive and mixed sets higher than Indians did,
  and for Americans alone, how concrete the reviews seemed explained part of their preference for positive over negative ones.

takeaways:
  - "Across 30,180 reviews on Amazon India and 62,253 on Amazon US, more negative wording went with more helpful votes on both sites, once review length and product price were allowed for."
  - "Shown five glowing reviews of a phone, Americans rated them 5.73 out of 7 for helpfulness, the top score in the experiment; Indians gave the same reviews 4.87."
  - "Five critical reviews scored 4.74 with Americans and 4.49 with Indians, and the two scores did not differ significantly."
  - "Americans placed the glowing reviews at 2.98 on a 1-to-9 scale where 1 means very concrete, while Indians put them at 4.25."

