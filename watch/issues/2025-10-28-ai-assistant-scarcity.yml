short_answer: >-
  Some will, mostly when stock is running out. Asked to choose, most people prefer an assistant that spots a deal and
  leaves the purchase to them. Across five studies with US and UK shoppers, scarcity shifted that: when good products
  were said to sell out fast, noticeably more let the AI complete the buy. The pull came from how enjoyable and relaxing people
  expected the handover to be, not from the assistant's practical quality.

takeaways:
  - "A week of Google search ads for an AI shopping assistant drew a 6.02% click-through rate when it bought automatically, against 3.41% when it only sent alerts."
  - "Auto-buy picks for a new smartphone rose from 4.3% to 11.7% when models were said to be low in stock or to sell out fast."
  - "Scarcity narrowed the gap without closing it: intent to use an auto-buy laptop assistant climbed from about 2.4 to 3.3 out of 7; the alert version held near 5.7."
  - "Scores for how much people would enjoy and relax with the auto-buy assistant rose from about 2.8 to 4.2 out of 7 under scarcity, the only benefit that explained the extra uptake."

