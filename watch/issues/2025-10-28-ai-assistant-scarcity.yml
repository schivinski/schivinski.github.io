title: "Will shoppers let an AI assistant buy for them? What a Psychology & Marketing study found"
dek: >-
  Most people would rather an AI flag a bargain than spend their money for them. Five studies, including a week of live
  search ads, show when that changes: once the good deals start selling out.
short_title: "When shoppers let the AI press buy"

description: >-
  Frank et al. find most shoppers want AI that flags deals, but when stock sells out fast more let it buy for them, drawn
  by how relaxing handing over feels.

keywords: [AI shopping assistant, autonomous AI, agentic commerce, AI agents in retail, auto-purchase, AI autonomy,
  scarcity marketing, limited-time offers, Black Friday, consumer acceptance of AI, experiential benefits, Psychology & Marketing]
topics: [AI, Retail]

