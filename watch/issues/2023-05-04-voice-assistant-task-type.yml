short_answer: >-
  For practical tasks, by a clear margin. In three experiments with 300 adults, people who heard Google Assistant handle
  practical requests, such as a sum, a unit conversion or a timer, liked it more than when it handled social ones, such as
  'Do you love me?' or 'I feel sick'. Practical answers made the assistant seem more capable, and that drove the
  difference. Social exchanges did not make it seem significantly warmer.

takeaways:
  - "Among 123 Australian owners of voice-enabled devices, the assistant scored 7.77 out of 9 on average after practical requests, against 6.31 after social ones."
  - "The best-liked exchange was a multiplication, at 7.91. The least liked was a get-well wish in reply to 'I feel sick', at 5.30."
  - "A second test with 116 people repeated the result (7.83 against 6.46), and leading people to feel more or less powerful did not affect their ratings."
  - "In a third test, practical requests raised the assistant's perceived competence only among people who rated it at least 5.87 out of 9 for ease of use."

