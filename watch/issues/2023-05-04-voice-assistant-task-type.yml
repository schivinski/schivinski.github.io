title: "Do people like voice assistants more for practical tasks or for small talk? What an International Journal of Consumer Studies study found"
dek: >-
  Voice assistants are sold on their skills and on their personality. Three experiments with Google Assistant found that
  people rated it far higher when it handled practical requests, and that its apparent competence explained why.
short_title: "Why voice assistants are judged on competence"

description: >-
  Sung et al. find people liked a voice assistant more after practical requests than social chat, 7.77 versus 6.31 out
  of 9, as it seemed more competent.

keywords: [voice assistants, smart speakers, Google Assistant, voice app design, conversational AI, voice commerce,
  perceived competence, warmth and competence, trust in voice assistants, ease of use, International Journal of Consumer Studies]
