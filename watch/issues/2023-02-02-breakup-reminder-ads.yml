short_answer: >-
  In two online experiments, yes. People who saw a mock Facebook ad telling them it was fine to move on after a breakup
  clicked through for more information almost twice as often as people who saw the same ad built around loved ones. The
  breakup line made the brand feel more supportive. In the second test, that extra support showed up only among people
  who believe partners are either meant to be or not.

takeaways:
  - "The cookie ad drew clicks from 23.1% of viewers when it reassured them after a breakup, against 12.5% when it invited them to enjoy the cookies with loved ones."
  - "The travel ad repeated the pattern, 21.6% against 11.2%, so the gain carried over from a snack to a holiday."
  - "On the support measure, which runs from 1 to 7, the brand gained roughly half a point after the breakup version in each test, and that gain carried the extra clicks."
  - "None of the 408 participants was asked whether they had been through a breakup, so the gain came from a general audience, not from people known to be newly single."

