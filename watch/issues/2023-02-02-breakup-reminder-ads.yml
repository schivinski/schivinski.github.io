title: "Do ads that cheer people on after a breakup get more clicks than ads about loved ones? What a Psychology & Marketing study found"
dek: >-
  Ads love to show people enjoying life with their loved ones. In two experiments with US adults, a mock Facebook post
  that nudged people past a breakup drew more clicks, because readers felt the brand was there for them.
short_title: "Breakup lines that win the click"

description: >-
  Tan et al. find a reassuring breakup line in a mock Facebook ad nearly doubled clicks for more information over a
  loved-ones line, in two US tests.

keywords: [breakup advertising, relationship reminders in ads, emotional advertising appeals, click-through rate,
  Facebook ad copy, brand social support, destiny beliefs, implicit theories of relationships, consumer-brand relationships,
  ad copywriting, Psychology & Marketing]
topics: [Advertising, Creative]

