title: "Can a bad review make your product worse? What a Journal of Marketing Research study found"
short_title: "The review keeps working after the sale"
dek: >-
  Everyone knows a bad review costs you the sale. This one shows it also ruins the thing for the people who buy
  anyway. Good reviews, meanwhile, do nothing at all to make the experience better.

description: >-
  People who read bad reviews before listening paid $17.29 to see a show, against $20.45 for people who read none.
  The review changes the experience, not just the purchase.

keywords: [negative reviews, online reviews, consumer experience, negativity bias, review management, word of mouth,
  customer satisfaction, product experience, review response, post-purchase experience, willingness to pay,
  Journal of Marketing Research]
topics: [UGC, Retail, Service]

