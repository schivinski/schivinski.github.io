title: "Does a VR experience that feels like your own body make people want the real thing? What a Psychology & Marketing study found"
dek: >-
  Festival visitors put on a headset and paddled a virtual kayak among Antarctic icebergs, some seated and some on their
  feet. Those who sensed that the virtual body belonged to them found the trip more absorbing and more enjoyable, and
  sitting down made that link stronger.
short_title: "Feeling the virtual body, wanting the real trip"

description: >-
  Leveau and Camus find VR users with a firmer sense of owning their virtual body felt more immersed and enjoyed the trip
  more, among 300 festival visitors.

keywords: [virtual reality marketing, VR embodiment, immersion in virtual reality, enjoyment, virtual tourism,
  destination marketing, VR brand experience, body position in VR, sense of agency and ownership, experiential marketing,
  metaverse marketing, Psychology & Marketing]
topics: [Creative, Service]

