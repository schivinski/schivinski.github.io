short_answer: >-
  Somewhat, and mainly by way of a more absorbing, enjoyable experience. At a festival in Angers, France, 300 visitors
  kayaked through a virtual Antarctica in a headset, half seated and half standing. The more the virtual body felt like
  their own, the more immersed they felt and the more they enjoyed it, and both were linked to a stronger wish to visit
  for real. Sitting strengthened the first two links but not the step to the wish to travel.

takeaways:
  - "Feeling that the virtual body was their own explained 31.9% of how much visitors' immersion scores varied, and 22.6% of how much their enjoyment scores varied."
  - "Immersion and enjoyment together accounted for only 7.7% of the differences in wanting to visit Antarctica for real."
  - "2 of the 4 posture comparisons held: sitting, the natural kayaking position, strengthened embodiment's link with immersion and with enjoyment, but neither link to travel plans."
  - "6 of the 13 visitors interviewed afterwards spoke of the virtual trip giving them a desire to go there."

