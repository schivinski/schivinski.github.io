title: "Do virtual influencers work? What a Journal of the Academy of Marketing Science meta-analysis found"
dek: >-
  Across 210 experiments and about 91,000 consumers, computer-generated influencers beat humans on novelty and
  trail them on trust. How lifelike the character looks decides which of the two does the persuading.
short_title: "Virtual influencers: novelty or trust, not both"

description: >-
  A meta-analysis of 210 experiments finds virtual influencers win on novelty, lose on credibility, and that how human they look decides which one matters.

keywords: [virtual influencers, AI influencers, influencer marketing, meta-analysis, anthropomorphism, credibility, novelty,
  endorsement, computer-generated influencers, social media marketing, Journal of the Academy of Marketing Science]
topics: [Influencers, AI, Social media]

