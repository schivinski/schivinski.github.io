short_answer: >-
  The ones that keep circling back to a single problem. In low-rated TripAdvisor reviews of Texas hotels, posts
  that named the same failure again and again, or kept spelling out what caused what, were followed by lower sales. In
  experiments, one such review was enough to cool interest in booking. The best reply depends on the repetition: a
  heartfelt apology for the first kind, an offer of compensation for the second.

takeaways:
  - "Each 1% rise in same-failure repetition across a hotel's low-rated reviews was followed by about $11,700 less revenue in the next quarter on average, and up to $115,300 at the highest-earning hotels."
  - "Writers still replaying the incident in their heads named the same failure about twice as often as those who dwelt on it less: 1.66 extra mentions per post against 0.86."
  - "Beyond hotels, in a set of 41,847 complaints on ten big US firms' Facebook pages, posts that repeated themselves drew more likes from other customers, and both kinds of repetition did so about equally."
  - "Matched replies won a little back: each 1% more compensation in answers to cause-heavy reviews was worth about $213 a quarter (up to $2,090 at the most profitable hotels), and each 1% more heartfelt apology in answers to same-failure reviews about $135 (up to $1,330)."

