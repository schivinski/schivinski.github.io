title: "Which bad reviews hurt sales most, and should your reply say sorry or offer something back? What a Journal of the Academy of Marketing Science study found"
dek: >-
  Some unhappy customers cannot let a bad experience go, and it shows in how they write. Five studies, from hotel sales in
  Texas to complaints aimed at big US firms on Facebook, find that repetitive complaints put off the next customer, and
  that the right reply turns on what the writer keeps repeating.
short_title: "The bad reviews that repeat themselves cost the most"

description: >-
  Tran et al. find bad reviews dwelling on one problem cut hotel sales; a heartfelt apology softens them, while
  compensation suits posts that keep citing causes.

keywords: [customer rumination, negative online reviews, how to respond to bad reviews, service recovery, empathetic apology,
  compensation for complaints, TripAdvisor hotel reviews, Facebook complaints, review text mining,
  online reputation management, Journal of the Academy of Marketing Science]
topics: [Service, UGC, Social media]

