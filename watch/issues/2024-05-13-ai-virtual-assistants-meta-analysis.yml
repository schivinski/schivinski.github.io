short_answer: >-
  Mostly a good deal and a safety net. Pooling results from 244 groups of customers, this meta-analysis found that value
  for money and having help on hand did most to drive use of chatbots and voice assistants. What other people think and how
  human the assistant seems came next. Unease during the exchange, such as anxiety or discomfort, was the strongest brake
  on actually using them.

takeaways:
  - "Help on hand was the biggest driver of an assistant feeling easy to use, with a weight of 0.48, nearly twice that of value for money at 0.27."
  - "Bad feelings pulled actual use down by 0.25 on the same standardised scale, roughly twice the push that came from finding the assistant useful (0.13)."
  - "Privacy worries were a weak brake: their pooled link with plans to use an assistant was 0.14 in the negative direction, against 0.53 for trust."
  - "Typing beat talking more often than not: voice instead of text weakened 6 links between helpful drivers and customers' reactions, and strengthened only 2."

