title: "What makes shoppers keep using a retailer's chatbot or voice assistant? What a Journal of Retailing meta-analysis found"
dek: >-
  Retailers keep launching chatbots and voice assistants, and customers keep drifting away from them. A meta-analysis of 195
  studies shows what keeps people using them: a fair deal, help when they need it, and an assistant that does not leave them
  uneasy.
short_title: "What keeps shoppers coming back to retail chatbots"

description: >-
  Blut et al. pool 195 studies of retail chatbots and voice assistants: value for money and help on hand drive use, while
  bad feelings are the main brake.

keywords: [AI virtual assistants, retail chatbots, voice assistants, chatbot adoption, conversational commerce,
  customer service automation, anthropomorphism, uncanny valley, customer emotions, technology acceptance, meta-analysis,
  Journal of Retailing]
topics: [AI, Retail, Service]

