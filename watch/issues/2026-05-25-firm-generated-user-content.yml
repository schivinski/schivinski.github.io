short_answer: >-
  On the evidence here, yes, and more carefully than most do. Giving customers a finished post to send, instead of
  asking them to write one, raised sharing from 0.4% to 2.1% among real gym members and from 1.4% to 3.4% in a
  second field test. The wording decides who answers: warm, enthusiastic text pulled satisfied customers up to
  roughly half, while the flat factual wording most brands use did almost nothing. Unhappy customers handed the same
  warm text mostly went quiet instead of hitting back.

takeaways:
  - "In a real gym campaign, a ready-made post was clicked through by 2.1% of members against 0.4% asked to write their own."
  - "Among satisfied customers, enthusiastic wording lifted sharing to 50.7%, against 20.7% for a blank box."
  - "Flat, factual wording — the kind most brands supply — reached 30.7% and was no better than asking people to write their own."
  - "Among dissatisfied customers, the most glowing version cut sharing to 8.6%, below the 23.5% who would have written something themselves."

