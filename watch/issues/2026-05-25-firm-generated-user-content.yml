title: "Should brands write the posts their customers share? What a Journal of Marketing study found"
short_title: "Write the post for them and they will send it"
dek: >-
  A birthday week, and a reason to go back to the subject I have spent most of my career on. Word of mouth was
  supposed to be the one channel brands could not touch. That is no longer quite true.
description: >-
  Handing customers a ready-made post lifted sharing from 0.4% to 2.1% in a real gym campaign, and quietly stopped
  unhappy customers posting at all. How to use it, and where it gets uncomfortable.
keywords: [user-generated content, firm-generated user content, word of mouth, eWOM, social media sharing, customer
  advocacy, review solicitation, brand communication, customer satisfaction, authenticity, CRM, Journal of Marketing]
