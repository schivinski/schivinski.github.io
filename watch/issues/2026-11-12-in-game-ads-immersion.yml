short_answer: >-
  They add to it when the brand belongs in the game's world or gives players something useful to do, and players reject
  them when they interrupt play or appear in a game people paid for. A study of 730 posts on Reddit, TikTok and YouTube and
  12 player interviews found that negative reactions were stronger than positive ones and could extend from a single ad to
  the whole game, ending in refunds, boycotts or piracy.

takeaways:
  - "Industry estimates cited by the authors put in-game advertising at $110 billion in 2024, rising to $169.4 billion by 2029."
  - "Of about 3,000 posts, videos and comments collected, 730 dealt directly with in-game ads and how players felt about them."
  - "Players judged an ad on four attributes together: what is advertised, its format and style, how often it appears and how long it lasts."
  - "Branded items players could use were accepted even outside the setting, such as cars that seated four but drove slower, or seated two and drove faster."

