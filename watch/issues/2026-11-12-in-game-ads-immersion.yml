title: "When do in-game ads add to the experience and when do players reject them? What a Journal of Advertising study of 730 player posts and 12 interviews found"
dek: >-
  Advertising inside video games is a fast-growing format, and players post readily about the ads they dislike. More than
  two years of player discussion online, together with interviews, show which ads players accept, which they resent and
  why.
short_title: "When in-game ads work and when players reject them"

description: >-
  Zagni et al. read 730 player posts and ran 12 interviews: in-game ads were welcomed when they fit the game world or
  helped play, resented when they stopped it.

keywords: [in-game advertising, in-game ads, video game advertising, brand integration in games, product placement in video
  games, player engagement, ad intrusiveness, psychological reactance, flow in gaming, netnography, gamers and advertising,
  Journal of Advertising]
topics: [Advertising, Creative]

