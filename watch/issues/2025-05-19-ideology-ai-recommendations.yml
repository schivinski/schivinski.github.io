title: "Does political ideology change who follows AI recommendations? What a Journal of Consumer Psychology study found"
dek: >-
  Across six online studies and one paid ad on Facebook, people who described themselves as conservative were readier than liberals
  to take an AI suggestion for a recipe, a film or a playlist. The reason, the authors argue, is a taste for consistency:
  most of us assume the algorithm is learning from our own past.
short_title: "Who says yes to the algorithm's picks, and why"

description: >-
  Paul et al. find conservatives accept everyday AI recommendations more readily than liberals, since the picks feel
  consistent with their past, in seven studies.

keywords: [AI recommendations, recommendation systems, political ideology, conservatives and liberals, personalization,
  preference for consistency, resistance to change, recommendation acceptance, streaming recommendations, Facebook ad test,
  Journal of Consumer Psychology]
topics: [AI, Personalization]

