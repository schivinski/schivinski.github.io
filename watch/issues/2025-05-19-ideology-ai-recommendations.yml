short_answer: >-
  Yes, for everyday picks. In six online studies with 1,548 people and a Facebook ad test, those who rated themselves
  conservative were more willing than liberals to follow AI suggestions for recipes, films and music. The authors attribute
  this to a stronger preference for consistency, because people assume these systems learn from their own past. Where the AI
  could not know that past, or offered something unlike it, the gap disappeared.

takeaways:
  - "Given a choice of two music apps, 74% of conservatives and 60% of liberals picked the one promising suggestions close to their past taste."
  - "A single Facebook ad for AI playlists drew 27 clicks from 8,152 impressions in conservative-voting areas and 16 from 12,750 in liberal-voting ones."
  - "For people told they had only just downloaded a music app, the difference vanished: 5.42 for conservatives and 5.66 for liberals out of 9."
  - "The gap is real but modest: willingness to watch a smart TV's film suggestion averaged 5.48 among conservatives and 4.83 among liberals, scored from 1 to 9."

