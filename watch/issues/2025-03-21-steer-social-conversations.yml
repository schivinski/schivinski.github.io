short_answer: >-
  Answer the exact point the customer raised, in words like theirs. In ten years of Twitter conversations between four
  large US banks and their users, replies that stayed on the customer's topic warmed the customer's next post far more
  than anything else, by over double the runner-up. Empathy and an offer to continue by direct message helped most in
  angry threads; a cheerful, candid voice helped most in friendly ones.

takeaways:
  - "Moving a reply from generic to squarely on the customer's subject raised the sentiment of their next post by 0.29, where minus 1 is very negative and plus 1 very positive."
  - "In a negative thread, inviting the customer to a direct message added 0.06 to how positive their following post sounded. In an upbeat thread it added close to nothing (0.00)."
  - "A positive tone from the brand added 0.09 when the customer was already upbeat, but only 0.01 when they were upset."
  - "Seven in ten customer posts were neutral or positive, and each of the eight reply features, used well, added at least 0.02, enough to tip a neutral thread into positive territory."

