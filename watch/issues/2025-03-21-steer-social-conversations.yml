title: "What makes a brand's reply to a customer on social media work? What a Journal of Marketing Research study found"
dek: >-
  Nearly a million posts between four big US banks and the people tweeting at them show that answering the exact point
  raised does more for the customer's next message than speed, a friendly sign-off or a cheerful tone. What else helps
  depends on whether the conversation is going well or badly.
short_title: "Answer the point: how brand replies steer the next post"

description: >-
  Saljoughian et al. find that answering the customer's own point does more for the tone of their next post than speed or
  cheer, in nearly a million bank tweets.

