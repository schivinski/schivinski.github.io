title: "Does disclosing sponsorship hurt influencer marketing? What a Marketing Letters meta-analysis found"
dek: >-
  Many creators still leave the paid tag off, afraid their followers will turn away. Pooling 37 experiments with more than
  12,000 people, two researchers show the label helps viewers see the ad and costs the creator a little credibility, yet
  leaves liking and buying plans flat. Format, length and audience decide the rest.
short_title: "What a sponsorship label really costs an influencer post"

description: >-
  Liu and Zhao pool 37 experiments: a sponsorship label helps people spot the ad and trims credibility, yet liking for the
  brand and plans to buy hold steady.

keywords: [sponsorship disclosure, influencer marketing, paid partnership label, ad hashtags, advertising disclosure rules,
  persuasion knowledge, influencer credibility, purchase intention, sponsored video content, meta-analysis, Marketing Letters]
