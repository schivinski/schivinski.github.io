short_answer: >-
  Less than many brands fear. Pooling 37 experiments with 12,721 people, the analysis showed that a sponsorship
  disclosure helped viewers spot that a post was advertising and made both the creator and what they said seem slightly
  less believable. Overall, brand attitudes and purchase intentions stayed where they were. How the label was done
  mattered more: hashtags, longer wording and video posts all drew warmer reactions, and adults took labels better than
  younger viewers.

takeaways:
  - "Across 28 studies and 9,359 people, a disclosure reliably helped viewers see a post as an ad with something to sell, the very job the rules give it."
  - "The doubt landed on the creator: in 16 studies with 5,105 people, the influencer looked a little less credible once the post carried a label."
  - "Purchase plans held: the 15 studies that asked about buying, with 3,944 people between them, showed no real change either way."
  - "A label written by the creator drew responses 0.19 standard deviations cooler than one added by someone else, such as the platform, a gap the authors treat as borderline."

