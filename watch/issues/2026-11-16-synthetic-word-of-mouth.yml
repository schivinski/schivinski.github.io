title: "What is synthetic word of mouth, and how does AI change recommendations and influencer marketing? What a Journal of the Academy of Marketing Science editorial proposes"
dek: >-
  Reviews drafted with AI, AI summaries of reviews, virtual influencers and shopping agents that read reviews for us all
  change how recommendations travel. An editorial introducing a special issue on influencer marketing gives this a name,
  synthetic word of mouth, and sets out what is different.
short_title: "When AI writes, carries and reads word of mouth"

description: >-
  Haenlein et al. define synthetic word of mouth, where AI writes, carries, judges or acts on recommendations, and how people judge what looks machine-made.

