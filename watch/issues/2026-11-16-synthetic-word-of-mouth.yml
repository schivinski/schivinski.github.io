short_answer: >-
  It is word of mouth in which AI takes part: a review polished with AI, a platform summary of many reviews, a virtual
  influencer shown using a product, or an agent that books a hotel from reviews. The editors argue that this changes all
  four classic elements of word of mouth, and that people use four cues to judge how machine-made such content seems. It
  is a framework, not a test.

takeaways:
  - "The special issue drew more than 80 submissions and published nine articles, grouped into content design, influencer identity, and aligning the interests of influencers, brands and consumers."
  - "Across those articles, engagement and sales did not always move together: frequent emotional switches in a livestream held viewers but reduced purchases."
  - "Their new term, synthetic word of mouth, covers any recommendation in which AI plays a part, from drafting a review to acting on it."
  - "They propose four cues people use to judge whether a recommendation is machine-made: storyline, voice, the person shown and whether the product seems to have been really used."

