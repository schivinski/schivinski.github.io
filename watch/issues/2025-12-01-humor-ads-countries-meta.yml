title: "Why is humour in advertising more common in some countries? What an International Journal of Advertising study found"
dek: >-
  Some countries joke in their ads far more than others, and the usual culture scores never explained why. A meta-analysis
  of humour across 15 countries, new German and Polish TV and YouTube data, and an experiment point to an unexpected
  driver: how often relationships end.
short_title: "Why some countries laugh more in their ads"

description: >-
  Karpinska-Krakowiak et al. pool 50 ad samples from 15 countries and find more funny ads where divorce is more common,
  but no clear role for individualism.

keywords: [humour in advertising, humor in advertising, international advertising, cross-cultural advertising,
  advertising across countries, meta-analysis, content analysis, YouTube pre-roll ads, creative strategy,
  Hofstede cultural dimensions, relationship negotiability, International Journal of Advertising]
topics: [Advertising, Creative]

