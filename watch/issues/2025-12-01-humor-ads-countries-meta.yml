short_answer: >-
  One clear clue is how easily people form and end relationships there. In a meta-analysis of 50 samples of ads from 22
  content analyses across 15 countries, the share of ads trying to be funny rose with the national divorce rate. Culture
  scores such as individualism showed no reliable link. A separate experiment with 150 single young adults backed the idea
  behind it: people in a dating frame of mind reach for the joke.

takeaways:
  - "On average, 29% of the ads in the pooled samples tried to be funny, from 7.8% in one German print sample to 67.8% in one US print sample."
  - "France, Britain and the US score alike on individualism, yet in one earlier comparison the authors cite, about 16% of French ads were funny against 34% of British ones."
  - "Spending at least 2 minutes imagining a perfect first date made young singles likelier to recommend a funny ad concept to a client than writing about the weather did."
  - "With every factor included, the model explained just under half (49%) of how much humour varied between samples, so much of the gap is still a mystery."

