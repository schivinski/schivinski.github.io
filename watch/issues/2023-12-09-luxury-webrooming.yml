short_answer: >-
  Mainly because they want to touch the product and talk to someone who sells it. In a survey of 431 luxury fashion
  shoppers approached while visiting luxury boutiques in four major Indian cities, those two wishes were the traits tied
  directly to checking items on the internet before a store purchase. Online reviews and the sense of risk in buying
  online then changed how strongly the value people saw in luxury led to that habit.

takeaways:
  - "Online reviews of luxury items scored 4.49 out of 5 for usefulness, the highest average of the 22 survey statements reported."
  - "Shoppers agreed at 4.22 out of 5 that they hesitate to buy a luxury item they cannot touch in the shop, and this need for touch had the strongest direct link to webrooming of the four drivers tested."
  - "Only 2 of the 4 drivers, the need for touch and the desire for contact with salespeople, were linked directly to webrooming. Easy and useful online search had no direct link; their influence ran through enjoyment and perceived quality."
  - "The route through practical value (quality, design, durability) carried an estimate of 0.245, more than double the 0.105 through the pleasure of shopping for luxury."

