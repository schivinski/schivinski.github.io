title: "Why do luxury shoppers research online and then buy in the store? What a Journal of Consumer Behaviour study found"
dek: >-
  Plenty of luxury shoppers look an item up on their phone and then go to the boutique to buy it. A survey of shoppers at
  luxury stores in four Indian cities ties that habit to wanting to handle the product and deal with staff, and finds that
  online reviews and online risk change how strongly it holds.
short_title: "Why luxury shoppers look online, then buy in store"

description: >-
  Akram & Lavuri find luxury shoppers who need to touch products and talk to staff look items up online before buying in
  store, and reviews shape that habit.

keywords: [webrooming, luxury webrooming, research online buy offline, showrooming vs webrooming, luxury retail,
  omnichannel luxury, need for touch, online reviews luxury, perceived online risk, hedonic and utilitarian value,
  Indian luxury market, Journal of Consumer Behaviour]
topics: [Retail, Search]

