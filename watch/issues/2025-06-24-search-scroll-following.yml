title: "Should you sound upbeat or balanced to win followers? What a Journal of Consumer Research study found"
dek: >-
  Some apps are for looking things up and others for passing the time. On four big platforms, the tone that attracts
  followers flips between the two: a mixed record on review sites, steady cheer on social feeds.
short_title: "Balanced or upbeat: what wins followers depends on the app"

description: >-
  Shalev et al. find reviewers with mixed ratings draw the most followers on Yelp and Goodreads, while the most upbeat
  accounts lead on Twitter and Instagram.

