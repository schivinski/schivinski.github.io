short_answer: >-
  It depends on whether people come to look something up or to pass the time. Across four large datasets covering
  nearly eight million accounts, reviewers on Yelp and Goodreads drew the most followers when their ratings were mixed,
  a sign of credibility, while on Twitter and Instagram the most upbeat accounts drew the most. An experiment on X found
  the same switch inside one app: searchers followed more expert accounts, browsers warmer ones.

takeaways:
  - "On Yelp, reviewers whose ratings averaged between 3 and 4 stars had 1.5 followers on average, about twice the 0.73 of reviewers who averaged above 4."
  - "On Twitter, the most positive quarter of accounts averaged 3,372 followers, more than twice the 1,559 of the most negative quarter."
  - "Among 300 X users, those sent to hunt for information followed someone they rated 3.58 out of 5 for credibility, against 3.34 for those told to browse for fun, whose picks were rated higher for likability, 3.15 against 2.83."
  - "In a pilot test, a restaurant reviewer whose nine reviews ranged from two to five stars was rated more credible than one giving almost all five stars (5.71 against 5.09 out of 7), but less likable (5.08 against 5.57)."

