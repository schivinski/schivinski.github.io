short_answer: >-
  It can, though not only for the worse. Researchers held long interviews with 31 Instagram followers of virtual
  influencers such as Lil Miquela. Knowing they were looking at computer-made characters did not stop people measuring
  themselves against them. Some came away envious, angry or ashamed of comparing at all; others picked up style ideas and felt more
  confident. Those who were hurt talked themselves down, put the phone away or unfollowed.

takeaways:
  - "Cartoon looks seemed to soften the sting. Fans of human-looking characters reported envy as well as inspiration, while Noonoouri's 5 followers in the group, who at first denied comparing at all, described only inspiration and admiration when they looked up to her."
  - "A comparison could outlast the scroll by hours: one follower kept comparing for 2 or 3 hours, and another dwelt on it for about an hour afterwards."
  - "Attachment could run deep. One young man checked a virtual influencer's posts 5 or 6 times a day before he caught himself wondering about ordering her as a robot and forming a bond with her."
  - "Comparison can cost reach. Some hurt followers unfollowed, which the authors offer as one reason Lil Miquela lost 114,000 followers in a single year, a figure they take from an industry source."

