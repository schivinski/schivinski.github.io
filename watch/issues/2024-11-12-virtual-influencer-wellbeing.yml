title: "Does comparing yourself with virtual influencers hurt your wellbeing? What a Psychology & Marketing study found"
dek: >-
  Lil Miquela and other computer-made influencers post holidays, outfits and friendships that nobody is actually living.
  Their followers still size themselves up against them. In long interviews, they explained what that does to them, and
  what they do about it.
short_title: "Measuring up to influencers who don't exist"

description: >-
  Nasr et al. talked to 31 Instagram fans of virtual influencers: comparing with characters they knew were fake stirred
  envy and shame, but also inspiration.

keywords: [virtual influencers, CGI influencers, AI influencers, social comparison on social media, consumer wellbeing,
  Lil Miquela, influencer marketing ethics, envy and inspiration, Instagram followers, digital wellbeing,
  Psychology & Marketing]
topics: [Influencers, AI, Social media]

