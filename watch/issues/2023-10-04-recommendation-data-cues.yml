title: "Should you tell shoppers why they are seeing a recommendation? What a Psychology & Marketing study found"
dek: >-
  One short line above a set of personalized picks can change how people receive them. Three experiments in Europe find
  that pointing to the shopper's own buying history works better than naming similar customers, and helps most where
  the picks are weakest.
short_title: "Why this pick? Name the shopper's own data"

description: >-
  Weidig and Kuehnl find a line saying picks come from a shopper's own data makes them feel more personal, most of all
  when the picks miss or feel awkward.

keywords: [personalized recommendations, recommendation explanations, recommender transparency, because you bought labels,
  attribution theory, self-attribution, trust in recommendations, consumer reactance, personalization paradox,
  collaborative filtering, e-commerce personalization, Psychology & Marketing]
topics: [Personalization, Retail]

