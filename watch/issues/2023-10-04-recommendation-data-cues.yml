short_answer: >-
  Yes, if the line refers to the shopper's own purchases. Three online experiments with 1,076 European adults tested
  this. A note saying the picks drew on people's own buying history and account made the picks feel more like a
  reflection of themselves, and that feeling went with more trust and less resistance. A note citing "customers similar to you" did much less.
  The own-data note helped most where picks missed the mark or touched on money worries.

takeaways:
  - "Naming the shopper's own purchases and account raised the sense that tablet picks reflected them by 1.25 points (the scale ran from 1 to 7). Naming similar customers brought no significant change."
  - "When holiday picks missed what the traveller had asked for, the own-data line added 1.49 points, more than twice the 0.67 it added for picks that matched."
  - "For bank offers linked to financial strain, such as an overdraft, the same line lifted self-attribution by 1.50 points, against 0.57 for savings products."
  - "Through that stronger sense of ownership, the own-data line was linked to about 12 extra points of interest in buying, measured from 0 to 100."

