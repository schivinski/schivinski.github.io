title: "Is your advertising reaching older consumers? What an International Journal of Advertising study found"
dek: >-
  Marketers often assume older buyers are set in their ways or slow to take in ads. Surveys in two countries point
  somewhere else: fewer older people connect brands to anything at all, yet those who do hold on to as much as anyone.
short_title: "Why fewer older buyers think of your brand"

description: >-
  Mecredy et al. find fewer older people tie brands to any buying cue: for US fitness trackers, 26% of over-75s did so
  per brand, against 68% of under-40s.

keywords: [advertising reach, older consumers, mental availability, age-inclusive advertising, brand tracking,
  purchase funnel, consideration set, advertising effectiveness, generational marketing, media planning,
  International Journal of Advertising]
topics: [Advertising, Research methods]

