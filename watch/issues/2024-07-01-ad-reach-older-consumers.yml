short_answer: >-
  Not as well as it reaches younger ones, and the shortfall looks like a reach problem rather than failing memory.
  In surveys in the US and New Zealand, each older age group had fewer people who could tie a given brand to even one
  buying cue. Yet older people who made that link held about as many ideas about the brand as anyone. The authors
  suspect the advertising simply never got to many older people.

takeaways:
  - "In New Zealand, the average streaming service was tied to at least one buying cue by 64% of people under 40 and by 25% of those aged 75 and over."
  - "Small brands lost the most: in the US, 56% of under-40s linked the smart ring Oura to a buying cue, against 3% of over-75s, while Yoplait barely moved (92% against 88%)."
  - "Once they made a link at all, older people were not short of ideas: Americans aged 60 to 74 held 4.3 associations per yogurt brand on average, against 3.5 for under-40s."
  - "US over-75s recognised more streaming services than under-40s (6.7 against 5.3) yet would consider fewer than half as many (1.65 against 3.78)."

