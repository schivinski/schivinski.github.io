short_answer: >-
  No, not on this evidence. Researchers followed more than 400 Instagram accounts in beauty, fashion and lifestyle, some run
  by real people and some by computer-generated characters, across two years of posts. Relative to audience size, the humans
  drew more likes and comments. Both groups wrote almost uniformly cheerful captions, but they talked about different things:
  people promoted their own content and links, while virtual influencers kept stressing what they were.

takeaways:
  - "Measured as likes plus comments relative to followers, human influencers averaged 5.48 against 3.90 for virtual ones, roughly 40% higher."
  - "Both groups were overwhelmingly upbeat: 97.9% of the virtual influencers' sampled posts and 95.8% of the human ones read as positive, with 1.1% and 2.5% negative."
  - "The weakest response came from accounts with 100,000 to 999,999 followers, behind both the 1,000 to 9,999 band and accounts with a million or more."
  - "A blue tick did not lift engagement by itself: verified accounts averaged 4.90 and unverified ones 5.43, a difference too small to rely on."

