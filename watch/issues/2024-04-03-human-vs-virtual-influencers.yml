title: "Do virtual influencers get more engagement than human ones on Instagram? What a Journal of Interactive Advertising study found"
dek: >-
  Agencies have pitched computer-generated influencers as the safer, more engaging choice for brands. A look at two years of
  their Instagram posts, set against matched human creators, points the other way.
short_title: "Real influencers still beat virtual ones"

description: >-
  Looi and Kahlor find human influencers outperform virtual ones on Instagram: across 393 accounts, real people drew about
  40% more engagement per follower.

