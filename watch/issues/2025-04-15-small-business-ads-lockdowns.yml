title: "Did social media ads help small businesses survive lockdowns? What a Journal of Interactive Marketing study found"
dek: >-
  When stay-at-home orders emptied the high street, more small firms shut for good. Data spanning 49 countries suggest
  those already advertising on Facebook took a noticeably smaller hit.
short_title: "Social ads and small-business survival in lockdown"

description: >-
  Lee et al. find stay-at-home orders raised business closures less among Facebook advertisers, in data on more than
  79,000 firms across 49 countries.

