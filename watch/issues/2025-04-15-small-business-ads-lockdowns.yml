sections:
  - h: "What the researchers did"
    body: |
      Shun-Yang Lee and Yakov Bart of the D’Amore-McKim School of Business at Northeastern University,
      Julian Runge of the Medill School of Journalism at Northwestern University, and
      Daniel Yoo, Anett Gyurak and J.W. Schneider of Meta Platforms took on a question many shop owners
      faced when the first lockdowns arrived. If customers are ordered to stay home, is advertising still worth paying for?

      Answering it needed data that rarely sit together. Whether each business was open or shut in a given month came from the
      Future of Business Survey, which the World Bank, the OECD and Facebook ran with firms on the platform. What each firm
      actually spent on Facebook ads came from the platform's own records rather than from owners' memories. The timing of
      lockdowns came from the Oxford COVID-19 Government Response Tracker, with a month counted as locked down if an order
      applied on at least one day.

      Countries closed their doors in different months, and some never did. That let the team compare how closures moved in a
      country once its order began with countries that were still open at that point, a design economists call staggered
      difference-in-differences. They ran the analysis once for advertisers and once for everyone else, then compared the results.
    facts:
      - ["Businesses", "79,117 firms in 49 countries, 51,977 of which had run Facebook ads and 27,140 had not"]
      - ["Size", "83% had fewer than 10 employees; services and retail were the largest sectors"]
      - ["Period", "Each month, December 2019 through May 2020"]
      - ["Outcome", "Whether the business was closed that month, from survey answers"]
      - ["Advertising", "Real ad activity and spend logged by Facebook, not self-reported"]
      - ["Held constant", "National income per head, firm size and number of Facebook fans"]

  - h: "How hard lockdowns hit"
    body: |
      The raw curves already told much of the story. The share of closed businesses jumped in the month an order took effect
      and kept rising after it. The models confirmed it: a simpler linear version put the average lift in closure risk at 3.6
      percentage points, close to the main estimate, and the damage deepened the longer an order stayed in place.

      One detail suggests owners saw trouble coming. A second estimation method found closures already edging up a month before
      orders began, and that early rise came mostly from firms that were not advertising.

  - h: "Advertisers took a smaller hit"
    body: |
      The core comparison split firms by whether they had advertised on Facebook in the first half of 2019, long before anyone
      had heard of the virus. In every month after an order, both groups became more likely to close. For advertisers the rise
      was smaller each time, and the gap kept widening until the third month.

      A second split looked at advertising in the two months before each month observed, with matching results. Three months
      into lockdown, closure risk was up 8.0 points for non-advertisers against 6.2 for advertisers. Four months on, risk had
      jumped above nine points in every group and the gap had narrowed to between half a point and just over one. A stricter
      check that compared each firm only with itself kept the overall gap, 3.4 against 3.0 points, but gave mixed results
      month by month.
    chart: gap

  - h: "Bigger budgets, smaller hit"
    body: |
      Spend told a steadier story than a simple yes or no. Among advertisers, each step up the budget ladder went with a smaller
      lockdown effect. Counting how many ads a firm ran, rather than what it paid, pointed the same way.

      An obvious objection is that healthier firms can afford more advertising and would have survived anyway. To get around
      it, the team replaced each firm's own spend with the average spend of its competitors in its own industry and country.
      That figure tracks how much businesses like it advertise without reflecting any one firm's private fortunes. The pattern
      survived: 3.3 points of added risk in the lowest group against 1.8 in the highest, although the estimates for the two
      top groups were too imprecise to rule out no effect at all.
    chart: spend

  - h: "Who gained most"
    body: |
      The smallest firms, the bulk of the sample, showed the clearest difference. Read from the paper's chart, a lockdown added
      roughly 3.4 points of closure risk for tiny businesses that did not advertise and about 2.6 for tiny ones that did. Among
      firms with 500 or more staff the two groups sat almost level. The authors treat these size splits as directional, since
      the ranges around each estimate overlap a good deal.

      Sectors varied too. Retail and construction appeared to benefit most from Facebook advertising, transport hardly at all,
      and in agriculture, around 2% of the businesses, advertisers fared slightly worse. In every other sector advertisers came
      out ahead.

  - h: "Advertising as a kind of insurance"
    body: |
      Why would ads bought before a crisis help during one? Earlier studies cited in the paper show that advertising
      works with a delay and builds assets that never appear on a balance sheet, such as recognition and a following of
      engaged customers. Targeted social ads, they argue, are well suited to building those assets, which can then carry a
      firm when footfall vanishes. Their careful phrase is that ad technology may act as insurance against sudden demand shocks.

      That runs against instinct. Firms have historically trimmed marketing when the economy turns. The authors' view is that
      holding or even raising social spend in a crisis may be the better call. They go further, proposing that
      governments could subsidise small firms' social campaigns in a downturn and that lenders could offer credit to keep
      them running. Those ideas are the authors' proposals; the data did not test them.

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["Set a floor for your ad budget", "Decide the smallest weekly ad budget you would keep running even if sales halved. Write the amount down and agree it with whoever signs off spending."]
  - ["Put three months of it aside", "Keep three months of that floor budget in a separate pot, away from stock and wage money, so the ads do not stop the week cash gets tight."]
  - ["Keep one campaign always on", "Run one small campaign on the social platform your customers use most, aimed at people within easy reach of your shop or delivery area. Leave it running every week, good or bad."]
  - ["Write your closure posts now", "Draft four short posts for a forced closure: how to order, delivery or pickup times, new opening hours, and a thank-you to regulars. Save them with photos, ready to publish."]
  - ["Switch the message within two days", "When footfall drops, swap your ads to those posts within 48 hours. Keep spending at or above the floor for a full eight weeks before you judge the results."]
  - ["Log orders against spend weekly", "Every Monday, note orders, enquiries and ad spend on one sheet. After eight weeks, move money from the weakest ad to the one that brought in the most orders."]

expect:
  - "**Protection, not immunity.** Advertisers still closed more often once an order began. Their added risk was smaller, not absent."
  - "**The cushion builds over months.** The difference between advertisers and the rest grew through the first three months of an order."
  - "**Spend level matters.** Risk rose less at each step up the spending ladder, which suggests, as our own inference, that a token budget buys less cover than a steady one."
  - "**Small firms first.** Businesses with fewer than ten people showed the clearest gap; for the largest firms advertising made little visible difference."

limits:
  - "**A pattern, not proof.** The authors stress that their results are correlational. Firms that advertise may be healthier, older or better run in ways the data do not record."
  - "**One platform.** Only Facebook advertising was observed, so search, display or offline ads are invisible here."
  - "**Only lockdowns modelled.** Governments also brought in other economic and health policies, which the analysis left out."
  - "**Six months of data.** The window closes in May 2020, so it says nothing about recovery or later waves."
  - "**Reached through Facebook.** The survey ran on the platform, so firms with no presence there are unlikely to be in the sample."
  - "**Ties to the data source.** The ad records came from Meta. The paper declares that two authors work there, a third used to, and a fourth was employed by Facebook before the company was renamed."

faq:
  - q: "Did advertising help small businesses survive COVID-19 lockdowns?"
    a: "The evidence points that way. Across 49 countries, lockdown orders increased closure risk less for firms that had advertised on Facebook than for those that had not, although the authors describe the result as directional and correlational (Lee et al., 2025)."
  - q: "Is it wise to keep advertising when sales collapse?"
    a: "The authors suggest not. Because advertising builds recognition and customer ties that pay off later, they see keeping or even increasing social media spend during a crisis as a counterintuitive but possibly wise choice."
  - q: "Does spending more on ads make a difference?"
    a: "In these records, yes, directionally. The biggest spenders saw the smallest rise in closure risk, and the pattern held when each firm's budget was replaced by the average spend of local rivals in the same line of business."
  - q: "Which businesses gained most from advertising during lockdowns?"
    a: "Firms with fewer than ten employees showed the clearest advantage, and retail and construction looked like the biggest winners among sectors. In transport the difference was close to nil, and in agriculture, a small slice of the sample, the sign reversed."
  - q: "Is this proof that Facebook ads keep businesses open?"
    a: "No. Advertisers may differ from other firms in ways the survey did not capture, such as financial health or age, so some of the difference may come from who chooses to advertise, not from the ads themselves."

also:
  - doi: "10.1177/10949968251335616"
    title: "How Does Brand-Generated Content Engage Consumers? A Study on Fashion Brands’ Instagram Data"
    authors: "Gao et al."
    journal: "Journal of Interactive Marketing"
    year: 2026
    text: >-
      Machine learning pulled design features out of Instagram posts from major fashion brands, and a count model linked
      each feature to likes. Putting a link in a post turned users off, while adding more images to the same post generally
      helped. Luxury and mass-market audiences split: luxury followers preferred clean product shots without influencers or
      busy backdrops, while mass-market followers engaged more with celebrity faces and attractive settings. A post that suits
      one brand can be wrong for its neighbour on the rail.
  - doi: "10.1108/jcm-01-2024-6526"
    title: "Analyzing the impact of faces on consumer engagement in social media videos: a machine learning approach"
    authors: "Wallach, Pham, Koschmann, & Arwade"
    journal: "Journal of Consumer Marketing"
    year: 2025
    text: >-
      A frame-by-frame machine learning scan of 2,754 TikTok videos from 50 leading brands, posted over three years, found
      that simply showing a human face lifted engagement, and larger faces lifted it further. How long the face stayed on
      screen, and whether the brand sold pleasure or practicality, shaped the size of that lift. Likes, comments and shares did
      not all respond alike, so it pays to know which of the three a video is meant to win.

