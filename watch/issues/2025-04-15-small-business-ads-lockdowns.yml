short_answer: >-
  It looks that way. Lee and colleagues followed more than 79,000 businesses in 49 countries from December 2019 to May
  2020, matching survey answers on whether each was open with its real Facebook ad records and the timing of national
  stay-at-home orders. Lockdowns made closing more likely everywhere, but less so for firms that had been advertising, and
  least for the biggest spenders. The data show a consistent pattern, not proof of cause.

takeaways:
  - "On average, a stay-at-home order raised a firm's chance of closing by 2.9 percentage points, and the effect grew from 2.2 points in the month it began to 11.5 points four months later."
  - "Three months into a lockdown, the added risk of closing was 5.1 points for firms with no Facebook ads in early 2019 and 3.3 points for those that had run them, about a third lower."
  - "Among advertisers, the fifth that spent most faced less than half the added risk of the fifth that spent least: 2.0 against 4.3 points."
  - "Before any modelling, 15% of non-advertisers had closed by May 2020, compared with 12% of advertisers."

