title: "What makes a city seem cool, and does it get residents posting? A Journal of Product & Brand Management survey of 537 people who follow their city online"
dek: >-
  A look back at a study I co-wrote with colleagues on how people see the city they live in. How well a place works did
  most to make it feel cool, and a cool city got attention and action, but not affection.
short_title: "A cool city gets attention and action, not affection"

description: >-
  Schivinski et al. surveyed 537 Saudi residents who follow their city online: practical strengths made it seem cool, which drew attention and action.

keywords: [city branding, place branding, brand coolness, city brand coolness, social media engagement, residents,
  user-generated content, destination marketing, functional attributes, structural equation modelling, Saudi Arabia,
  Journal of Product & Brand Management]
topics: [Social media, UGC]

