sections:
  - h: "What we did"
    body: |
      A note first: this issue covers a paper I co-wrote, and I am its first author. The team was Xiufang (Leah) Li and
      Abdullah M. Alahmari of RMIT University in Melbourne, where I was based at the time, Quynh Phuong Nguyen of Foreign
      Trade University in Hanoi and Gdańsk University of Technology, Barbara Czarnecka of London South Bank University and
      Sandra Maria Correira Loureiro of ISCTE-IUL in Lisbon.

      Cities now compete like brands, and residents are part of the audience. They look at their city's posts, take photos
      of it and tell others what it is like. We wanted to know why some residents lean in and others scroll past. Our idea
      was that a city's features do not move people directly. People first judge whether the place is cool, meaning
      attractive, desirable and something they would like to be linked with, and that judgement drives what they do online.

      We asked people in Saudi Arabia who follow their city on social media to rate it. Four things were measured: how the
      city looks, how well it works, how well it fits who they are, and how much it matters to the people around them.
      Then we asked how cool they thought it was and how much they paid attention to the city online, how attached they felt
      and how often they liked, shared or posted about it.
    facts:
      - ["Sample", "537 residents of Saudi Arabian cities, 55.3% women, half aged 25 to 34"]
      - ["Recruited", "Over four weeks through social media channels and forums, with an English-language online survey"]
      - ["City features rated", "Physical (scenery, historic sites, architecture), functional (services, transport, business, shops, culture), individual value and social value"]
      - ["Coolness", "Usefulness, high status, popularity and subculture, combined into one score for how cool the city seems"]
      - ["Engagement", "Attention (cognitive), attachment (emotional) and actions such as liking, sharing and posting (behavioural)"]
      - ["Method", "Structural equation modelling, with 5,000 bootstrap samples to test the indirect paths"]

  - h: "A city that works is a city that seems cool"
    body: |
      All four features made residents more likely to call their city cool, but not equally. Functional strengths led by a
      distance: clean surroundings, jobs and business, shops and cafes, transport, cultural activities and public services.
      Next came how well the city fits a person's own taste and identity, then how much the place counts with others.
      Looks came last, and only just made it as a real effect.

      City marketing spends a lot on scenery and landmarks. In this survey, residents did not rate a city as cool because
      it was pretty. They rated it as cool because it worked, and because it made them feel they belonged in it.
    chart: drivers

  - h: "Cool buys attention and action, not affection"
    body: |
      Once a city seemed cool, residents followed it more closely. They paid more attention to its posts and were more
      likely to like, comment, share and post their own content about it. Coolness was the bridge: practical strengths had no
      direct effect on either attention or action. They only worked because they made the city seem cool first.

      Then came the surprise. Seeing the city as cool did nothing for how attached residents felt to it. The only thing
      linked to emotional engagement was how the city looks, and that link ran directly, without passing through
      coolness. So a city can seem cool without being loved, and it can be loved for its streets and skyline without being
      thought cool.

      One more result is worth noting. Residents who care what others think of their city paid it the most attention of all,
      and most of that effect did not come through coolness.
    chart: engagement

  - h: "Why I think a cool city is a different job from a loved one"
    body: |
      What follows is my opinion, not something we measured. Cool is a quick, social judgement. People decide it in a glance
      and pass it on in a post. Love is slow. It comes from memory, time and the people you know, which is why I read the
      missing emotional link as sensible rather than disappointing. A city that chases cool and expects devotion has set
      itself the wrong goal.

      I also take a practical lesson. If how well a place works day to day does most to make it cool, then good city marketing
      starts well before the post, in the quality of the transport, the services and the street. A campaign can only
      repeat what residents already feel.

      What I would test next is real behaviour. We asked people what they do, and we asked them once, in one country in a
      period of fast change. I would like to see the same model in a city whose brand grew from the bottom up, with actual posting data
      alongside the survey.

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["Score your place on four things", "Ask at least 30 people who know the place to rate it from 1 to 5 on how it looks, how well it runs, how well it fits people like them and how much it counts with their friends and neighbours. Note your lowest score."]
  - ["Check how cool it seems", "In the same survey, ask people to rate from 1 to 5 how cool the place is. Record the average as your starting point."]
  - ["Lead with how the place works", "Pick your strongest practical feature, such as transport, services, jobs or clean streets. Publish one post a week that shows it in use, from a resident's point of view."]
  - ["Make it a place for people like them", "Feature residents telling their own stories, and run one local event a month where people can meet. This builds the sense of fit and belonging that also makes a place seem cool."]
  - ["Ask for attention first, then action", "Start each campaign with an easy request, such as a poll or a question. Follow it a week later with a hashtag that invites people to share their own photos."]
  - ["Track attention, action and feeling separately", "Each month, count views and reads, then shares and posts, then replies that express feelings. Repeat the cool rating every quarter. For feelings, add memory-based content such as old photos and local history."]

expect:
  - "**More attention, then more action.** A place that seems cool tends to be read first and shared second, so judge the plan on both."
  - "**Reputation built on basics.** Residents credit the practical side first, so posts that show services working will carry more weight than pretty ones."
  - "**No shortcut to loyalty.** Cool posts will not make people attached, so plan separate content for belonging and memory."
  - "**Slow movement.** How people see a place changes over months, so repeat the rating each quarter and judge by the trend."

limits:
  - "**One country.** All the residents lived in Saudi Arabian cities during a period of rapid state-led development, so other places may differ."
  - "**English-language online survey.** Recruiting online in English may have favoured better-educated and more affluent respondents."
  - "**Reported, not observed.** People described their own behaviour and attitudes, and no real posting data was collected."
  - "**Patterns, not proof.** Everyone answered once, so the survey cannot show that cool causes more engagement."

faq:
  - q: "What makes a city seem cool?"
    a: "In this survey, the practical side did most: services, transport, jobs, shops and clean streets. How well a city fits a person and how much it counts with others came next, and looks came last (Schivinski et al., 2026, Journal of Product & Brand Management)."
  - q: "Does a cool city get more social media engagement?"
    a: "Yes, on two counts: attention and action. Residents who saw their city as cool followed it more closely and shared and posted more."
  - q: "Do cool cities make residents feel more attached?"
    a: "No. Calling the city cool did not raise emotional attachment. The one link to attachment in the study was the city's physical look."
  - q: "Do the findings apply outside Saudi Arabia?"
    a: "The study covers one country, so that is untested. The authors expect the process, from city features to coolness to engagement, to hold elsewhere, and say it needs checking in other cities and cultures."
  - q: "Can I read the paper for free?"
    a: "Yes. It is open access, and a free copy of the full text is on the paper page together with the survey items."

also:
  - doi: "10.1007/s11747-026-01181-1"
    title: "Process and outcome frames in firms' environmental posts and consumer engagement"
    authors: "Tran et al."
    journal: "Journal of the Academy of Marketing Science"
    year: 2026
    text: >-
      Across seven studies, including a field experiment and over 12,000 environmental posts on X by 110 US firms, this
      research compares posts that describe what a firm did with posts that state the result. Either frame raises engagement,
      but mixing them backfires. A warm tone helps the "what we did" frame most, and a competent tone helps the "what we
      achieved" frame win engagement with the firm itself.
  - doi: "10.1080/02650487.2026.2700928"
    title: "Can too many hashtags backfire? Understanding audiences' perceptions of hashtags on Instagram"
    authors: "Jin & Kim"
    journal: "International Journal of Advertising"
    year: 2026
    text: >-
      In three experiments, Instagram posts stuffed with hashtags earned less favourable attitudes because they looked less
      authentic. The penalty hit non-followers but not followers, and it faded when a post was clearly sponsored. A useful
      check before you brief a hashtag campaign.

