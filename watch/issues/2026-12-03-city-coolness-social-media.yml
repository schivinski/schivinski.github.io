  file: issue-53-city-coolness.jpg
  og: issue-53-city-coolness-og.jpg
  alt: "People gathered at pavement tables outside a corner bar in warm evening sun, on a quiet city street lined with trees and apartment blocks"
  caption: "Cool shows up on the street long before it shows up on a feed. Photo: Eirik Skarstein on Unsplash."

short_answer: >-
  Residents called their city cool mostly for how well it works day to day, more than for its scenery or landmarks. In my
  survey of 537 people following their city's accounts, feeling that the city was cool led them to read, like, share
  and post about it more. It did not make them feel more attached to it. For a place that wants attention and action, work
  on the practical side first. For one that wants love, cool is the wrong tool.

takeaways:
  - "Practical strengths such as services, transport, jobs and clean streets did the most to make a city seem cool, and looks did the least."
  - "A city seen as cool drew more reading and attention from its residents, and more sharing, liking and posting."
  - "Cool did not buy emotional attachment. The one thing linked to feeling attached was how the city looks."
  - "Caring what others think of the city had the biggest total pull on attention, and most of that pull was direct."

