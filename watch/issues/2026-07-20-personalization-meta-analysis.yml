short_answer: >-
  Yes, and the backlash is smaller than most marketers fear. A Journal of Marketing meta-analysis pooling 1,536
  results found that personalization reliably improves how people respond (average correlation .23),
  while privacy worry, irritation and ad avoidance did not measurably rise. Data tied to who people are, such as
  interests and values, beats age, location and browsing history. And the curve is J-shaped: the weakest results
  sit in the middle, not at the top.

takeaways:
  - "Across 290 studies, personalization raised positive responses (average correlation .23) and left negative ones at zero (.02)."
  - "Stated intentions rose (.22). Measured behaviour on its own, such as clicks and orders, averaged .02, which cannot be told apart from zero."
  - "Personalizing on age, location or past behaviour weakened the effect. Personalizing on interests and values did not."
  - "A curve fitted the data better than a straight line in 9 of 10 tests: the weakest results sat in the middle of the personalization scale."

