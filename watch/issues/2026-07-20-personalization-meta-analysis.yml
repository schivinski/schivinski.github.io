title: "Does personalization work, or does it creep people out? What a Journal of Marketing meta-analysis found"
short_title: "Personalization works. Half-hearted does not."
dek: >-
  The privacy backlash everyone warns about is hard to find in 290 studies. What the data does show is a trap:
  a little personalization is the weakest position, and the best results sit at the far end.

description: >-
  A meta-analysis of 1,536 results from 290 studies finds personalization lifts responses with almost no backlash.
  Moderate levels do worst.

keywords: [personalization, personalized marketing, personalization privacy paradox, privacy concerns, marketing
  meta-analysis, psychographic data, targeted advertising, data-driven advertising, customer data, privacy
  cynicism, personalized email, Journal of Marketing]
