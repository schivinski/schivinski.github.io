title: "How can brands and influencers keep sponsored content authentic? What a Journal of Marketing study found"
dek: >-
  Brands suspect creators of chasing the fee, creators chafe at brand scripts, and followers can tell when a paid post rings
  false. Interviews with all four sides of the deal map where they disagree and how partners can close the gap.
short_title: "What keeps sponsored creator content authentic"

description: >-
  Duffek et al. interviewed 185 consumers, creators, brand managers and agencies and found that authenticity lives in the
  partnership, not in the creator.

