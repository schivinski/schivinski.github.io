short_answer: >-
  By closing the gaps between what each side wants from a post. In 185 interviews with consumers, influencers, brand managers
  and agency staff, five qualities kept coming up: expertise, a real bond with followers, integrity, an original voice and candour
  about flaws. Each group weighs them differently. Brand managers watch engagement and want the script, while followers want
  honesty and the creator's own style. The authors show each party how to bring those interests into line.

takeaways:
  - "Integrity, meaning the creator acts in the audience's best interest and not just for the money, is a high priority for only 1 of the 4 groups interviewed. Followers care; the other three sides of the deal rate it low."
  - "Brand managers and agencies have settled on rules of thumb such as likes worth 1% to 5% of followers, comments worth 1% to 2% and video views worth 10% to 30%; the authors urge looking past them to how deep the conversation with followers goes."
  - "A makeup micro-influencer kept wearing a pair of gifted jeans until followers asked about them. Once she said where they came from, the jeans sold out within 3 days, the brand manager recalled."
  - "One podcaster said AI turns a 10-hour task into 2 hours' work, and the authors conclude that being open about AI use can keep a creator's originality intact."

