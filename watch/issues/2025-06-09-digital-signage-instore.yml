title: "Do screens inside stores sell the products they advertise? What a Journal of Marketing study found"
dek: >-
  Retailers now rent out their aisles to brands as video screens. Field data from 237 campaigns and close to 30 million
  shopper observations show a small, dependable lift for the advertised product, and big swings depending on what is
  advertised, when and how.
short_title: "Screens in the aisle: when in-store video ads sell"

description: >-
  Herhausen et al. find in-store screen ads made shoppers 8.1% likelier to buy the advertised product, across 237
  campaigns in ten European supermarkets.

keywords: [digital signage, in-store advertising, retail media, in-store video ads, point-of-sale advertising,
  supermarket screens, shopper marketing, retail media networks, field experiments, impulse buying, Journal of Marketing]
topics: [Retail, Advertising]

