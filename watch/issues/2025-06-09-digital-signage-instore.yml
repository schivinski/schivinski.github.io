short_answer: >-
  Yes, by a modest but reliable margin. Across 237 campaigns on aisle screens in ten western European supermarkets,
  shoppers whose trolley set off a product's video ad were 8.1% more likely to buy it than shoppers who did not see that
  ad. New, cheap and indulgent products and big brands gained most, and the extra sales were fresh demand rather than
  purchases brought forward.

takeaways:
  - "A product newly added to the shelves gained about 24.7% in purchase likelihood from its ad, against 3.3% for one already stocked."
  - "Flagging a promotion in the ad cut its lift from 12.0% to 1.2%, too small to tell apart from no effect at all."
  - "On Saturdays (the stores closed on Sundays) the lift reached about 11.7%, against 7.1% on weekdays."
  - "The authors estimate that brands earned an average gross return of 21% on their screen spending, and that the retailer's system paid for itself within one to two years."

