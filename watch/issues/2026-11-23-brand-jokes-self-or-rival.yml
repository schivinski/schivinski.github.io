short_answer: >-
  Usually itself. In three experiments with 1,590 people, a brand post that poked fun at one of the brand's own past
  decisions was liked more, and lifted opinions of the brand more, than the identical joke pointed at a competitor.
  Mocking a rival made the brand look mean, and that cost cancelled out the extra likes. The advantage was largest for
  brands seen as sincere or competent.

takeaways:
  - "Compared with a plain product post, a jab at a competitor raised post liking by 0.56 points (out of 7) but left opinions of the brand where they were."
  - "Turning that joke on the posting brand raised post liking by 1.25 over the plain post and brand evaluation by 0.31."
  - "A fictional coffee roaster rated 5.49 out of 7 for competence but 3.23 for market power still gained from self-directed jokes, so the benefit does not depend on market leadership."
  - "The fit advantage of self-directed jokes appeared only once a brand's sincerity or competence rating passed about 4.0; for brands rated lower, the target of the joke made no difference to fit."

