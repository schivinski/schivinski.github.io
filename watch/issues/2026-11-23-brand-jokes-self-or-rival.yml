title: "Is a joke at a rival's expense worth the likes? What three Journal of Research in Interactive Marketing experiments found"
dek: >-
  Brands that mock competitors on social media often get plenty of likes for it. Three experiments with almost 1,600
  people find that the same joke aimed at the brand itself is liked more, seems less mean and leaves a better
  impression of the brand.
short_title: "Brand jokes aimed at itself or a rival"

description: >-
  Moorhouse ran three experiments: brand posts mocking a rival won likes but no better brand ratings, while the same
  joke about the brand itself improved both.

keywords: [brand humour on social media, self-deprecating humour, self-disparaging brand posts, competitor
  disparagement, brand rivalry on social media, perceived meanness, brand personality fit, sincere brands, competent
  brands, social media engagement versus brand evaluation, humorous brand posts, Journal of Research in Interactive
  Marketing]
topics: [Social media, Creative, Advertising]

