title: "Who stops applying when an algorithm decides? What a Journal of Consumer Research field study and seven experiments found"
dek: >-
  Lenders, landlords, employers and universities increasingly tell applicants that software will assess them. Eight
  studies show that this news discourages one group in particular, people who doubt the strength of their own case, and
  test two ways to keep them applying.
short_title: "Who stops applying when an algorithm decides"

description: >-
  Liu et al. ran eight studies: people who saw their applications as weak were less willing to apply when an algorithm
  decided, unless it could make exceptions.

keywords: [algorithmic evaluation, AI screening of applicants, algorithm aversion, applicant strength, human versus
  algorithm decisions, AI in lending decisions, AI in recruiting, credit card applications, appeal to a human, AI
  disclosure, self-selection of applicants, Journal of Consumer Research]
topics: [AI, Service]

