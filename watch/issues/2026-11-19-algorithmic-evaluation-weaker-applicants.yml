short_answer: >-
  People who think their own application is weak. In eight studies covering freelance jobs, credit cards, loans, rentals
  and graduate school, weaker applicants were more reluctant to apply if an algorithm would decide, while stronger
  applicants applied either way. Weaker applicants value a person's capacity for flexibility and leniency, and the
  difference disappeared when the algorithm could make exceptions or a rejection could be appealed to a person.

takeaways:
  - "In a survey of 300 Americans, 83% thought credit card applications are mostly decided by algorithms, against 31% for rental housing applications."
  - "On Upwork, each one-unit rise in a freelancer's track-record index multiplied the odds of applying to the algorithm-screened job by 2.44."
  - "When a cash bonus depended on the verdict, 58% of high scorers in an online game chose an algorithm as their judge, against 50% of low scorers."
  - "Choosing five of ten graduate schools, people told they were in the top 25% of applicants picked 1.77 algorithm-assessed schools on average; those told they were in the bottom 25% picked 1.28."

