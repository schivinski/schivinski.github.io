title: "Does a scented parcel make online shoppers value the product inside more? What a Marketing Letters study found"
dek: >-
  For many online shoppers, opening the parcel is the first time they touch the brand at all. In a German lab test, a box
  misted inside with pine and sandalwood made an identical water bottle look better, polished the brand's image and drew higher bids.
short_title: "What a scented parcel does to the product inside"

description: >-
  Oberwegner et al. find that spraying a parcel inside with a pine and sandalwood scent lifted bids for the bottle it held by
  24% and improved brand ratings.

keywords: [scented parcels, olfactory marketing, scent marketing in e-commerce, unboxing experience, e-commerce packaging,
  sensory marketing, willingness to pay, product returns, brand personality, green brand equity, Marketing Letters]
topics: [Retail, Creative]

