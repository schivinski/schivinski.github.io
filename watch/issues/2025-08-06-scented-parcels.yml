short_answer: >-
  Yes, in a first test. Researchers in Germany gave 300 people a sealed parcel holding a water bottle from a made-up outdoor
  label. Half the boxes had been sprayed inside with a woody, piney scent. People who opened a scented box rated the bottle and
  its brand more highly and bid 24% more for it in an auction paid from their own fee. The bottle was identical; only the smell
  differed.

takeaways:
  - "The very same bottle earned a 6% higher quality rating when it came out of a scented box."
  - "The brand's green image got the biggest lift: an 11% higher score for being worth choosing over rivals because of its environmental commitment."
  - "Readiness to recommend the brand rose from 3.87 to 4.60 on a 0 to 10 scale, though both groups stayed far from fan territory."
  - "Scent did not reliably raise the wish to own the bottle: 79% of the scented group and 71% of the rest entered a draw for one, a gap within chance."

