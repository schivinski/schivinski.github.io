short_answer: >-
  Yes, on the measures that build an audience. In two online experiments with 413 US adults, a computer-made influencer
  described as having Down syndrome, and a group of virtual influencers mixed in age, gender and race, drew stronger
  intentions to follow them and tell others about them than versions without that diversity did. They struck people as fresher and
  more likeable. Buying plans rose for an unknown coffee brand, but not directly for a famous chain.

takeaways:
  - "Describing the virtual influencer as having Down syndrome nearly doubled people's intention to follow her, a rise of 93% on the same seven-point scale."
  - "A cast of four virtual influencers of different ages, genders and ethnic backgrounds lifted both word of mouth and follow intentions by about a third (33%) for a famous coffee chain."
  - "Buying plans rose 50% for the unknown coffee brand but only about 10% for the famous chain, too small a change for the authors to treat as real."
  - "Nobody mistook these characters for people: on a scale from human (1) to AI-generated (7), every version scored between 6.18 and 6.30."

