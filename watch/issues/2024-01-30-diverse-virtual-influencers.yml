title: "Do diverse virtual influencers win more followers? What an International Journal of Advertising study found"
dek: >-
  Brands can now design an influencer's face, body and story from scratch. Two US experiments asked whether giving a
  computer-made creator a diverse identity pays off, and found people were keener to follow it and talk about it.
short_title: "Why diverse virtual influencers win followers"

description: >-
  Ferraro et al. find a virtual influencer with Down syndrome nearly doubled intentions to follow her, and a mixed cast
  lifted word of mouth by a third.

keywords: [virtual influencers, AI influencers, CGI influencers, diversity in advertising, inclusive marketing,
  disability representation, influencer marketing, word of mouth, novelty in advertising, influencer likability,
  International Journal of Advertising]
