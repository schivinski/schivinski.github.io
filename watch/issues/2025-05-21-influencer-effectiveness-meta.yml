short_answer: >-
  Mostly, but not on every goal. Pooling 135 experiments with 44,210 people, the researchers found influencer posts
  drew more engagement and stronger purchase intent than a brand's own posts or no endorsement at all. Against celebrities,
  and against virtual influencers, they came out ahead on only one of those two goals. Account size split the work: creators
  with more than a million followers did more for purchase intent, smaller ones for engagement.

takeaways:
  - "Influencers won 6 of the 8 head-to-head comparisons. The two ties were celebrities on purchase intent and virtual influencers on engagement."
  - "Past 1 million followers, the effect on purchase intent was about three times that of smaller accounts, while smaller accounts led on engagement."
  - "Credibility is where influencers stood apart, 0.23 ahead of other endorsers, where 0 would mean no edge at all. Their 0.10 edge on attractiveness was too uncertain to count."
  - "Seven of the 13 conditions tested made no reliable difference, among them Instagram versus other platforms and emotional versus rational appeals."

