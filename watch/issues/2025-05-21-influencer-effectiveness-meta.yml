title: "Do influencers beat celebrities, brand posts and virtual influencers? What a Journal of the Academy of Marketing Science study found"
dek: >-
  A meta-analysis of 135 experiments finds creators outperform a brand's own posts on engagement and on buying intent alike.
  Against celebrities and virtual influencers the answer turns on which of those two goals you want, and on how many
  followers the creator has.
short_title: "When influencers beat the other endorsers"

description: >-
  Barari et al. pool 135 experiments: influencers beat brand posts on engagement and purchase intent; big accounts lift
  buying intent, smaller ones engagement.

keywords: [influencer marketing effectiveness, influencers vs celebrities, virtual influencers, micro vs macro influencers,
  influencer follower count, influencer credibility, brand posts vs influencer posts, purchase intention, consumer engagement,
  influencer message strategy, meta-analysis, Journal of the Academy of Marketing Science]
topics: [Influencers, Social media]

