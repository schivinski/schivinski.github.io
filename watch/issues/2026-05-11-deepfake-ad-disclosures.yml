short_answer: >-
  Only if the label finishes the thought. A plain warning that an ad has been deepfaked left viewers exactly where
  they started: they still rated the ad as realistic, still liked it the same, still clicked through at the same
  rate. Adding one sentence that drew the conclusion for them — this is not a real scene — pulled perceived
  truthfulness down from 3.33 to 2.41 on a seven-point scale. And it did that without
  denting choice of the advertised product, which is the part that makes it usable in practice.

takeaways:
  - "Undisclosed, a deepfaked ad was indistinguishable from the real one: viewers rated it 3.61 for looking synthetic, against 3.73 for the genuine ad."
  - "The usual style of label moved nothing at all: realism 4.85 with it against 4.84 without, and no change in liking or click-through."
  - "Spelling out the consequence worked: perceived truthfulness fell from 3.33 with no label to 2.41, and 2.68 when a line about being misled was added."
  - "Across all three studies, the share choosing the advertised product never moved, so transparency here cost nothing."

