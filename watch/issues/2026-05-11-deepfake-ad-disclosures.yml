title: "Can a label stop a deepfaked ad from fooling people? What a Journal of Advertising study found"
short_title: "\"This ad is deepfaked\" is not a warning. It is a fact nobody acts on"
dek: >-
  Swap a celebrity's face into an ad and viewers cannot tell. Three experiments tested what you have to write
  underneath before the penny drops, and the usual wording is not it.
description: >-
  A plain "this ad is deepfaked" label changed nothing. Adding one sentence about what that means cut perceived
  truthfulness from 3.33 to 2.41, without costing a single sale.
keywords: [deepfakes, AI-generated advertising, synthetic media, disclosure labels, advertising transparency,
  perceived realism, perceived factuality, consumer protection, AI disclosure, virtual influencers, celebrity
  endorsement, advertising regulation, Journal of Advertising]
topics: [AI, Advertising]

