short_answer: >-
  Often, yes, under some conditions. Across TripAdvisor reviews of hotels that use service robots, guests who mentioned
  a robot gave higher star ratings than guests who did not. The link was stronger when they called the robot by its name
  and when they posted from a phone. It weakened as the robot took up more of the review, and how many reviews the guest
  had written before did not matter.

takeaways:
  - "13.8% of the reviews mentioned a robot, and those reviews carried higher ratings even with the hotel's displayed score, trip type and review length taken into account."
  - "Only 4.6% of reviews used the robot's name, yet naming it strengthened the connection between the robot and a high score."
  - "Nearly a quarter of reviews (23.2%) came from a mobile device, and among these a robot mention went with an even better rating."
  - "On average, sentences about the robot made up 3% of a review's text; the bigger the robot's share, the weaker its association with a top rating."

