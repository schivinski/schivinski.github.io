title: "Do service robots lead to better hotel reviews, and when? What a Psychology & Marketing study found"
dek: >-
  Hotels now use robots to greet guests, carry luggage and deliver to rooms. A look at 20,166 reviews posted on
  TripAdvisor about 19 such hotels shows that guests who write about the robot tend to rate their stay higher,
  especially when they call it by name.
short_title: "Service robots and hotel review ratings"

description: >-
  Borghi et al. analysed 20,166 reviews of 19 hotels with robots: reviews mentioning a robot came with higher ratings,
  more so when the guest named it.

keywords: [service robots, hotel robots, hospitality technology, online reviews, TripAdvisor ratings, customer satisfaction,
  electronic word of mouth, customer-robot rapport, mobile reviews, review management, Psychology & Marketing]
topics: [Service, UGC, AI]

