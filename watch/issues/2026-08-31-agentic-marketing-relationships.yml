short_answer: >-
  The relationship stops being a line between you and the customer and becomes a triangle that includes the customer's
  AI agent. The authors argue that in this setting trust has to exist before satisfaction can, and that five jobs decide
  whether the relationship survives: keep the agent aligned with what the customer wants, explain decisions truthfully, give back
  value for data, be reachable by agents, and keep learning. This is a theory paper, not a test, and its propositions are untested.

takeaways:
  - "The paper names a new setting, business-to-agent-to-customer marketing, where firms and customers each act through AI agents."
  - "It proposes five mechanisms that keep such relationships healthy: calibration, accountability, reciprocity, mediation and adaptivity."
  - "Trust comes first. A customer must trust the delegated system enough to hand over a decision before satisfaction can build up."
  - "The authors offer six measures, from the share of decisions delegated to how often a customer overrides the agent, and call them proposals still to be validated."

paper:
  doi: "10.1177/00222429261481116"
  title: "Agentic AI and the New Architecture of Marketing Relationships"
  authors: ["Pattabhiramaiah, A.", "Mende, M.", "Gao, H.", "Sridhar, S."]
  authors_full: ["Adithya Pattabhiramaiah", "Martin Mende", "Huachao Gao", "Shrihari Sridhar"]
