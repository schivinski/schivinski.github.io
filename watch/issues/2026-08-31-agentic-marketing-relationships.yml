title: "What happens to customer relationships when AI agents do the buying? What a Journal of Marketing paper argues"
dek: >-
  When shoppers send an AI agent to search, compare and order for them, your brand is judged by a machine as well as by a person.
  A new Journal of Marketing framework says how to keep the relationship working, and gives six numbers to track.
short_title: "When your customer's AI agent does the shopping"

description: >-
  Customers are starting to delegate shopping to AI agents. A Journal of Marketing framework sets out five things firms must get right, and six KPIs.

