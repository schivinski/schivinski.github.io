short_answer: >-
  Mostly by seeming unrehearsed and ordinary. In 186 videos from 62 of the biggest finance channels, creators in both
  countries spoke straight to viewers, used plain words, shared their own money stories and let their enthusiasm show.
  American YouTubers went further with several of them: most were on camera, dressed down and named their sponsors.
  Many Chinese creators on Bilibili stayed off screen and let charts and animation do the talking.

takeaways:
  - "How unscripted a host sounded was the widest gap between the countries: nationality accounted for about 70% of the variation in spontaneity scores, with American hosts rated far more spontaneous."
  - "Going live was rare on both platforms. Only 11 videos in the whole set, 6 American and 5 Chinese, were recordings of live streams, so the feeling of a real-time chat came from delivery rather than broadcasting."
  - "Men fronted 90% of the top US channels and 85% of the Chinese ones, even though both platforms have roughly as many women users as men."
  - "Two things barely differed by country: how much emotion hosts showed and how everyday their language was. Nationality explained about 1% of the variation in emotion scores and almost none in language."

