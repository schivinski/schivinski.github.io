title: "How do finance influencers make themselves look authentic, and is it the same in China as in the US? What an International Journal of Advertising study found"
dek: >-
  Money creators need to sound expert, yet their followers want someone who feels like one of them. A close look at the
  leading finance channels on YouTube and on China's Bilibili shows the tactics they use to manage both, and how
  differently the two countries use them.
short_title: "How finance creators act natural on camera"

description: >-
  Zhu and Wang find top US finance YouTubers showed their face in 94% of videos and named a sponsor in 60%; on China's
  Bilibili, just 39% and 13%.

