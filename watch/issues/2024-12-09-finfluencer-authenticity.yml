sections:
  - h: "What the researchers did"
    body: |
      Lin Zhu of the University of Massachusetts Boston and Yan Wang of Hong Kong Baptist University looked at a tension
      every money creator lives with. A finance channel grows because viewers trust the host's knowledge, which calls for
      a polished, expert image. Followers stay because the host feels like a real person, and a sponsor's message or a
      slick studio can wear that feeling away. Researchers call the effort to look natural while working to a plan
      strategic authenticity.

      The pair took the 30 leading personal finance channels on US YouTube and 32 on Bilibili, China's main platform for
      video bloggers, where YouTube is blocked. From each channel they chose three uploads: the most watched, the least
      watched and one posted in the week of 16 to 23 March 2022.

      Two bilingual coders then scored every video against a checklist built from earlier work on influencer
      authenticity. Some items were simple yes or no questions, such as whether the host's face appeared. Others were
      rated from 1 to 5, such as how conversational the delivery felt or how strongly emotion came through.
    facts:
      - ["Channels", "30 American YouTube channels picked from Fincon.com recommendations; 32 Bilibili channels pieced together from several published rankings, since Bilibili has no official one"]
      - ["Reach", "Subscriber counts ran from 18,000 to 6.58 million"]
      - ["Videos", "Three per channel, from under 2 minutes to over 2.5 hours long"]
      - ["Coded", "Transparency, immediacy, ordinariness and passion: naming sponsors and showing a portfolio, eye contact and slips, clothing and setting, emotion"]
      - ["Pre-test", "The coders first tried the checklist on 10 finance channels outside the main set and agreed well (Krippendorff's alpha above .8)"]
      - ["Analysis", "Counts for the yes or no items; for the 1 to 5 ratings, a comparison of the two countries across each channel's three videos"]

  - h: "The four tactics behind looking real"
    body: |
      Creators in both countries drew on the same four tactics.

      Transparency came mostly from hosts talking about themselves rather than about products. Some showed their own
      investment portfolios, so viewers could see them following their own advice. One leading American creator told his
      audience his net worth.

      Immediacy is the sense of a live conversation. Live streams were scarce, so hosts built it in other ways: greeting
      viewers, saying "you" a lot, holding eye contact with the lens and keeping small stumbles in the edit. One host
      jumped at a sudden noise, swore, and left the moment in the video.

      Ordinariness meant playing down success. Hosts recalled modest childhoods, explained money in everyday words, wore
      T-shirts, jeans and caps, and filmed in bedrooms, living rooms and kitchens instead of a studio.

      Passion meant showing that the work is a love and not just a living. Some hosts ranted about money habits they
      disliked; others told viewers how much they enjoyed making the videos and hoped to keep going for years.

  - h: "Where American and Chinese creators parted ways"
    body: |
      The tactics were shared, but the dose was not. Nearly every American video put the host's face on screen. On
      Bilibili most videos kept the host out of shot, with narration over screen recordings, news pictures or animation. The few
      Chinese hosts who did appear tended to wear formal clothes and use professional microphones, closer to a television
      presenter than a friend on the sofa.

      Sponsorship went the same way: American hosts said who was sponsoring a video much more often.
      They also talked about themselves more, although here the gap was modest: nationality accounted for only about 8% of
      the variation in self-disclosure scores. When Chinese hosts did open up, it was mostly about how their portfolio had
      performed, not about their lives.

      Each channel's three videos, its biggest hit, its least watched upload and a recent one, scored much the same on
      self-disclosure, spontaneity and emotion. In this set, the manner belonged to the channel rather than to the videos
      that took off.
    chart: split

  - h: "Two reasons for the gap"
    body: |
      Zhu and Wang see two likely causes, and both may be at work. The first is money. YouTube creators earn from adverts
      shown around their videos, from paid memberships and from highlighted messages during live streams, and many also
      take brand deals that sit inside the video itself. Paid mentions are what tend to make followers suspect a
      creator has sold out, so American hosts have more reason to work hard at looking genuine.

      Bilibili pays creators differently. It runs no banner ads, lets viewers tip creators directly, supports virtual gifts
      during live streams and links videos to shopping, so creators can sell products straight from their content.

      The second explanation is culture. People raised in individualist societies such as the US tend to present
      themselves as distinct from others, while people in more collectivist societies such as China tend to put the group
      first. Earlier research found that East Asian users gave their faces less room in Facebook profile pictures than
      Americans did, which fits the many Bilibili hosts who never appear at all.

  - h: "The expert who seems ordinary"
    body: |
      The authors describe the top finance creators as ordinary experts and amateur professionals. They prove they know
      their subject with market analysis, company accounts, financial software, careful editing and the odd bit of jargon.
      Then they soften all of it with jeans, a kitchen table and a story about a money mistake they once made.

      Expertise and approachability are not rivals here. Earlier evidence cited in the paper suggests that seeming expert
      itself helps a creator feel authentic, so a professional touch need not cost trust as long as the
      person still comes through.

      Because the study only describes what creators do, this last point is ours alone. A sponsor brief
      that pushes a finance creator into a suit, a word-for-word script and a hired studio may remove the very signals
      their audience tunes in for.

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["Watch three videos before you sign", "Before you sponsor a finance creator, watch three of their videos: their biggest hit, their weakest upload and the newest one. In each one, note whether they look into the camera, talk about their own money and say who paid for the video."]
  - ["Learn the local house style", "Open the ten biggest money channels on the platform and in the country you are targeting. Count how many show the host's face and how many talk over charts. Brief creators to that norm, not to the one you know from home."]
  - ["Send talking points, not a script", "Give the creator three points the video must cover and nothing more. Let them film in their usual room and their usual clothes. Ask for one chart or worked example on screen so the advice still looks expert."]
  - ["Have the sponsor named early, in their words", "Ask the creator to name your brand out loud within the first minute and again in the description. Let them phrase it their own way, and check the disclosure rules in every market you run in."]
  - ["Try face against voice-over", "If the creator works both ways, publish one video with their face on screen and one voiced over charts on a similar topic. After 14 days, compare average watch time and how many comments each one drew."]
  - ["Read the comments for four weeks", "Over the first four weeks, read the comments under the sponsored video and under two of the creator's unsponsored ones. Count remarks about trust or selling out in each, and take that count into the renewal talk."]

expect:
  - "**Each market has its own norm.** A face-to-camera, jeans-and-kitchen look is normal among top American money channels, while many leading Chinese ones do without a face. A format that works in one country may need rebuilding for the other."
  - "**Disclosure is routine at the top.** Saying who paid is common practice for the biggest US finance channels, so asking a creator to do it puts them in good company. Whether it costs any goodwill was not measured."
  - "**Delivery is a channel habit.** A host's manner hardly moved between their most and least watched uploads, so manner alone did not mark out the hits. Look elsewhere for what makes one video reach more people than another."
  - "**Know-how still matters.** Showing real expertise helps a creator come across as genuine, so the relaxed look and the charts on screen work together rather than against each other."

limits:
  - "**What creators do, not how viewers react.** No viewer was asked anything. The idea that these tactics make a creator seem authentic comes from earlier work and was not tested here."
  - "**Only the biggest channels.** The set covers top channels and three videos from each, so smaller creators in the long tail may go about it differently."
  - "**Platform and country move together.** Every American channel was on YouTube and every Chinese one on Bilibili, so platform rules and culture cannot be separated."
  - "**Human judgement.** Ratings such as how spontaneous a host seemed came from two coders, who the authors say could have been swayed by a video's view count."
  - "**One moment, one niche.** The videos were gathered in March 2022 and all deal with personal finance, so creators in beauty, gaming or travel may strike a different balance."

faq:
  - q: "What is a finfluencer?"
    a: "A social media creator who gives advice about money, such as saving, budgeting, investing or property. The audience is large: the authors cite a count of 10.6 billion TikTok views for videos tagged #moneytok, more than for popular food and gossip tags."
  - q: "How do finance influencers seem authentic?"
    a: "By coming across as open, natural, down to earth and keen. They share their own results and life stories, address viewers directly, dress casually, film at home and let their feelings show. Leading channels in the US and China used all four approaches, with American hosts using them more heavily (Zhu & Wang, 2025)."
  - q: "Is the spontaneity in finance videos real?"
    a: "Often not entirely. The authors judged that many top presentations followed a written script, and they suspect that even a slip of the tongue is sometimes kept in on purpose. They did not check this with the creators themselves."
  - q: "Does looking authentic make a finfluencer more persuasive?"
    a: "This study did not measure persuasion. Earlier work the pair draw on links finfluencers' credibility to whether followers act on their tips, and one case they mention saw an Indonesian share rise 8.33% on a single day in January 2021 after an influencer with 51 million Instagram followers recommended it."

also:
  - doi: "10.1111/ijcs.13104"
    title: "Facebook and Consumer Research: A Review, AI-Driven Thematic Visualisation, and Research Agenda"
    authors: "Zaveri & Wilk"
    journal: "International Journal of Consumer Studies"
    year: 2024
    text: >-
      Reviewing 336 consumer studies of Facebook published in leading journals between 2008 and 2023, the authors used
      text-mining software to sort the field into themes. Research interests shifted as the platform changed, most sharply
      over the last five years. The review lists the gaps still open and the questions most in need of answers. Before
      planning another year of Facebook campaigns, it is a quick way to see which questions the evidence already covers.
  - doi: "10.1111/ijcs.70001"
    title: "Curiosity in Consumer Behavior: A Systematic Literature Review and Research Agenda"
    authors: "Strzelecki et al."
    journal: "International Journal of Consumer Studies"
    year: 2024
    text: >-
      Drawing on 122 papers from 1992 to 2024, this review traces how curiosity shapes what shoppers do, from buying
      decisions to engagement with brands and the take-up of new technology. Curiosity often works in the background,
      changing how strongly other influences land, and it turns up again and again in research on AI and virtual reality.
      Work on the topic has grown quickly. Teasers, mystery offers and half-told stories all lean on this pull, and the
      review is a sensible first read for anyone using them.

