short_answer: >-
  For some products, yes. Lengthening the digital vocal tract of a synthetic voice by 20% made listeners picture a bigger,
  more masculine speaker, and they paired that voice more often with stereotypically masculine foods and cars. In a
  three-day YouTube test, 2.72% of viewers clicked a beef burger ad voiced this way, compared with 1.79% when the
  tract was 20% shorter. With a vegan burger, the shorter voice led only slightly, and not reliably.

takeaways:
  - "A voice with a 20% shorter digital vocal tract was pictured as a smaller speaker: 8.60 on a 14-point height scale, against 10.98 for the default voice."
  - "A 20% lower pitch or 4 dB more volume left the speaker's imagined weight close to the default (6.08 and 6.09, against 5.67). The longer vocal tract raised it to 9.78."
  - "With a voice that fitted the product, 1,000 ad impressions cost 28.17% less for the beef burger (€0.71 down to €0.51) and 6.45% less for the vegan burger (€0.62 down to €0.58)."
  - "In the vegan burger ads, the shorter voice drew 2.18% click-through against 2.03% for the longer one, a margin the statistical test did not confirm."

