title: "Should an AI voiceover be tuned to match the product? What a Journal of Interactive Marketing study found"
dek: >-
  Text-to-speech tools can make one synthetic voice seem bigger or smaller by changing a single setting. Three online
  experiments and a YouTube field test show that this setting shapes which products the voice seems made for, and how
  often viewers click on the ad.
short_title: "Tuning an AI voice to the product"

description: >-
  Efthymiou et al. find a 20% longer digital vocal tract made an AI voice seem bigger and lifted a beef burger ad's
  YouTube click-through to 2.72% from 1.79%.

keywords: [AI-generated voices, synthetic voiceover, text-to-speech advertising, voice marketing, vocal tract length,
  voice and product fit, sound symbolism, Amazon Polly SSML, YouTube video ads, click-through rate, conversational agents,
  Journal of Interactive Marketing]
topics: [AI, Advertising, Creative]

