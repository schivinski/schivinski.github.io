title: "Whose social media posts persuade people, official accounts or ordinary users? What a Journal of Marketing Communications study of COVID-19 vaccine decisions found"
dek: >-
  During Australia's 2021 vaccine rollout, we asked 428 adults how they rated vaccine information from official accounts
  and from other users on social media. Official posts lifted intentions by making people surer of the jab's protection
  and safety. Posts from other users counted only when they did the same.
short_title: "Official posts persuade by building belief"

description: >-
  Park et al. surveyed 428 Australians: official social media posts lifted vaccine intentions by building belief in
  efficacy and safety; user posts did not.

