short_answer: >-
  Official accounts, and mostly through belief. In our survey of 428 adults in Australia during the 2021 vaccine rollout,
  people who rated official social media information more positively were more willing to be vaccinated, largely because
  they were more convinced the vaccine works and is safe. Posts from friends and other users had no direct link with
  intentions at all; they helped only by shifting those same two beliefs. Fear of the virus made no difference.

takeaways:
  - "Posts and beliefs together accounted for 73% of the differences in people's intention to be vaccinated."
  - "Believing the vaccine works was the strongest driver, almost four times as strong as believing it is safe."
  - "Official-source posts had about three times the overall link with intentions that user posts had, and the user-post link fell short of statistical significance."
  - "On average, respondents had talked about vaccines with about 17 people on social media in the previous month."

