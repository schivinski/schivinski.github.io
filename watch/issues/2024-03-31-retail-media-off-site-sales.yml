title: "Do retail media ads drive sales outside the retailer's website? What a Journal of Interactive Marketing study found"
dek: >-
  Brands judge retail media by the sales a retail website reports back to them. Matching a survey of that site's shoppers to
  their browsing shows more of them read up there and buy somewhere else than buy on the site, and that some ad formats push
  a far bigger share of their effect to those outside sales.
short_title: "Retail media sells beyond the retailer's site"

description: >-
  Zenetti and Pauwels find 17 shoppers research on a retail site and buy elsewhere for every 10 who buy there, and display
  and video ads tilt furthest off-site.

keywords: [retail media, retail media networks, webrooming, off-site sales, omnichannel advertising, sponsored products ads,
  upper-funnel advertising, always-on advertising, return on ad spend, machine learning in marketing,
  Journal of Interactive Marketing]
