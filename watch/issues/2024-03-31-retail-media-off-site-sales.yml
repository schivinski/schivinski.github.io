short_answer: >-
  Yes, and by more than the retailer's own reports show. At one of the largest online retailers, nearly 42,000 shoppers who had
  browsed a category said where they then bought. For every 10 who researched and bought on the site, 17 researched there and
  bought elsewhere. A follow-up on laptops linked several of the site's ad formats to higher sales of the same brands through
  other channels, with display and video leaning furthest that way.

takeaways:
  - "Adding the off-site buyers, sales among people who browsed on the site came to about 2.7 times the figure based on on-site purchases alone, if both groups spend the same."
  - "Of the people who browsed a category, between 11% (audio speakers, tablets) and 21% (microwaves, running shoes) went on to buy it somewhere else."
  - "Display, video and sponsored display ads earned on average 39% of their sales effect away from the site, about twice the 19% for sponsored product and brand listings."
  - "13 of the 27 retail media options tested went with clearly higher laptop sales elsewhere, yet brands left them unused in about a quarter of the months."

