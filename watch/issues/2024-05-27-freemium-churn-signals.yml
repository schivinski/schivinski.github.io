title: "Which paying subscribers are most likely to cancel a freemium plan? What a Journal of Consumer Behaviour study found"
dek: >-
  On a freemium platform most of the money comes from the members who pay. The records of more than 20,000 premium members of a
  horse-sport information service show which of them were likeliest to walk away, and which habits went with staying.
short_title: "The early signs that a paying member will cancel"

description: >-
  Lehmann-Zschunke finds freemium members on six-month plans or back after cancelling are likeliest to quit, while email
  opt-ins and keen viewers stay.

