short_answer: >-
  Watch four signals. In the records of 20,319 paying members of a freemium platform about horse sport, people who picked
  a six-month plan instead of a year, or who had cancelled before and come back, were the likeliest to quit. Members who
  had said yes to email updates, and those who watched more of the paid videos, were the likeliest to stay. Paying by
  direct debit, surprisingly, went with more cancelling.

takeaways:
  - "Members who chose a six-month plan over a full year had about 2.2 times the odds of cancelling (odds set the chance of leaving against the chance of staying)."
  - "People who had cancelled a premium plan before and later rejoined were the riskiest group, with about 2.4 times the odds of quitting again."
  - "Agreeing to the newsletter and new-content alerts went with 39% lower odds of cancelling."
  - "Of the 10 factors in the final model, video viewing gave the clearest read on who would stay, with a statistical signal about twice as strong as plan length, the runner-up."

