  caption: "Paying someone else to love your brand out loud can feel like a betrayal to the people who already do. Photo: Marah Bashir on Unsplash."

short_answer: >-
  Sometimes, and the people it puts off are your biggest fans. In five online experiments built around Instagram posts,
  customers who felt a strong bond with a brand planned to buy less after seeing a paid creator's post than after the very
  same post from the brand. Customers with a weak bond did not care who posted. Fans took the payment as a slight, and the
  dip faded when the creator was unpaid or someone the fan also loved.

takeaways:
  - "Attached shoppers offered $18.52 for a pair of new jeans after a creator's post and $21.05 after the brand's own: about 12% less, with a real prize draw riding on their answer."
  - "In a 750-person check across five kinds of promotion, attached Levi's fans valued the jeans at $54.08 after a creator's post, against $68.48 after a brand post and $63 to $66 after print ads, social ads or an unpaid customer review."
  - "The penalty was not confined to a hard core: in the prize-draw jeans test it showed for everyone above 3.13 on the seven-point attachment scale, 58% of the people taking part."
  - "When people judged a creator they already followed, the dip held only for the 22% who felt little attachment to that creator."

