sections:
  - h: "What the researchers did"
    body: |
      Kara Bentley of Chapman University in California, Priyali Rajagopal of the University of North Texas and Katina Kulow from
      the University of Louisville noticed a blind spot. Research on influencer deals has mostly looked at the creator: follower
      numbers, credibility, fit with the brand. The audience has had much less attention, above all the people who already love
      the brand.

      Their reasoning goes like this. Customers attached to a brand carry an unwritten set of expectations about how it should
      treat them, and one of those is fairness: customers like them should get the same deal. A paid creator looks a lot like an
      ordinary customer, yet gets free products or a fee for saying nice things. To a loyal fan, that can look like favouritism.

      To test it, the team ran five experiments online, each centred on a single Instagram post. Each time the picture and the words
      stayed the same; what changed was whose account the post came from, the brand's or a creator's. People first rated their bond
      with the brand, then saw the post and gave their buying plans or the price they would pay.
    facts:
      - ["Studies 1 and 5", "Target and an invented denim line; 243 and 552 people analysed. In Study 5 the creator was one each person had named"]
      - ["Study 2", "An invented electronics brand selling headphones; 388 people, attachment set by a short scenario, plus a group who saw no post"]
      - ["Study 3", "Dove body scrub; 411 people, each picking one of nine real beauty creators they followed or would follow"]
      - ["Study 4", "Starbucks; 374 people saw a brand post, a paid creator post, or a creator post saying openly it was unpaid"]
      - ["Participants", "1,968 adults from the CloudResearch online panel, after removing anyone who missed an attention question or took far too long"]
      - ["Measured", "Attachment to the brand on two statements, purchase plans rated from one to seven, and in Study 1 a price backed by a real prize draw"]

  - h: "Why fans take it personally"
    body: |
      Before the main studies, a quick check with 107 people found that the more attached someone felt to a coffee chain, the more
      they believed it had promised to treat them just like its other customers. That is the expectation a paid creator seems to break.

      Study 3 measured the break directly. After a creator's paid post for a new body scrub, attached customers agreed more strongly
      that the brand had broken the rules of their relationship (3.03 against 2.45 for the brand's own post). They also reported more
      bad feeling, such as envy, resentment and irritation (2.50 against 1.95). Customers with little attachment showed neither reaction.

      The two feelings rose together, but only the sense of broken rules explained why fans' buying plans fell. An extra study,
      tucked into the supplementary material, fits the same story: the dip was larger among people who habitually compare themselves with others.

  - h: "When an influencer post does worse than no post"
    body: |
      A fair objection is that brand posts might simply give fans a lift, which would make any other source look worse by comparison.
      Study 2 ruled that out by adding a group who saw nothing at all.

      Among attached customers, the brand's own post did no better than silence. The creator's post, with its "paid partnership"
      label and sponsored hashtags, left them clearly less willing to buy than either. Among customers with little attachment, all
      three groups ended up in much the same place. So with fans, the creator post did not just fail to help. It took something away.
    chart: nopost

  - h: "The payment, not the creator, is what stings"
    body: |
      If fans were simply wary of outsiders talking about their brand, an unpaid recommendation should hurt as much as a paid one.
      Study 4 tested that with a third version: a creator post that said plainly it was not sponsored and that the creator just loved
      the product.

      For attached customers, only the paid version fell short of the brand's own post. The unpaid version landed close to the brand
      post, and ratings of how believable and honest each post seemed did not account for the gap. Read this with some
      care, though. The difference between the paid and unpaid creator posts could itself have been chance, so a creator's mere
      presence may still cost a little with the most devoted fans.
    chart: paid

  - h: "Pick creators your fans already love"
    body: |
      Study 5 moved closer to everyday scrolling. People named two creators they follow on Instagram, said how attached they felt to
      one of them, and then saw the denim post from either the brand or that same creator, having been told it was a paid partnership.

      Where brand fans felt little for the creator, the familiar dip came back. Where they were attached to both, the creator's post
      did just as well as the brand's own. A fan who also loves the messenger, it seems, does not see a stranger being rewarded. That
      makes creator choice a question about your existing customers as much as about reach.
    chart: shield

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["Find your most attached customers", "Put two statements in the next survey you send customers: this brand is part of who I am, and I feel personally attached to it. Ask people to rate each from one to seven. Tag everyone who gives five or more to both as a core fan."]
  - ["Decide who each creator campaign is for", "Write one line at the top of every creator brief naming the audience. If it is people who have never bought from you, a creator is a good choice. If it is your core fans, plan the post for your own account instead."]
  - ["Ask fans which creators they follow", "Send your core fans a short poll asking them to name up to three creators they follow and like. Shortlist the names that come up most often before you look at follower counts."]
  - ["Keep paid creator posts away from your fan list", "When you pay to boost a creator's post, upload your customer and email lists as an excluded audience. Give those people the same news from your own account on the same day."]
  - ["Try both versions on fans", "Split a group of core fans in two. Show one half the creator's post and the other half the same picture and words from your own account. Compare clicks, basket adds and sales over two weeks."]
  - ["Read fan comments for a week", "For seven days after each creator post goes live, read every comment and message from your regular customers. Note any that mention favouritism, freebies or selling out, and change the next brief if they keep coming."]

expect:
  - "**A dip, not a desertion.** In several of the studies attached customers still planned to buy more than casual ones after the creator's post. Their enthusiasm fell back; it did not disappear."
  - "**No lift with casual buyers on these measures.** Purchase plans and prices did not rise among people with little attachment either. The authors expect creators to help most with awareness, which they did not measure."
  - "**Totals can hide the loss.** A campaign report that pools everyone may look healthy while your best customers quietly cool. Break results down by how close people feel to the brand."
  - "**Long partnerships may soften it.** The authors think fans may accept perks more readily for a creator who has worked with the brand for years than for one paid for a single post. That is their view, not a finding."

limits:
  - "**Plans and prices, not purchases.** Most outcomes were stated intentions. Only one study tied the answer to a real prize, and none tracked sales."
  - "**A single post, seen once.** Real feeds repeat. The authors suspect a steady stream of creator posts could widen the gap, but that was not tested."
  - "**Relative, not extreme, attachment.** Average attachment scores hovered around four out of seven, so the comparison is between more and less attached people rather than superfans and strangers."
  - "**One look at the why.** The broken-rules explanation rests on a single experiment, so other reasons may also play a part."
  - "**Big names on one platform.** Four of the five studies used well-known brands and all used Instagram. Small brands with cult followings, or short-video apps, may behave differently."

faq:
  - q: "Can influencer marketing backfire with a brand's loyal customers?"
    a: "It can. When the same Instagram content came from a paid creator instead of the brand's own account, customers who felt close to the brand reported weaker purchase plans and named lower prices. Customers with little attachment reacted the same way to both (Bentley et al., 2025)."
  - q: "What is brand attachment?"
    a: "It describes how strongly a person feels a brand belongs to their sense of self, and how personally bound to it they feel. It is often measured with just two statements on those lines, each rated from strongly disagree to strongly agree. Earlier research finds attached customers more loyal and more forgiving of mistakes, which is why their cooler reaction to creators stands out."
  - q: "Is it the #ad label that puts loyal fans off?"
    a: "Not by itself. In one test the brand's post and the creator's post both carried the same ad tag, and fans still offered a lower price after the creator's version. What seems to matter is the sense that someone like them is being paid or gifted for their praise."
  - q: "Should new brands still work with influencers?"
    a: "Yes, and they may have the most to gain. The backlash comes from customers who already feel close to a brand, and a young brand has few of them. The authors see creators as a natural fit for launches and for reaching people who do not yet know the brand."
  - q: "Do celebrity endorsers cause the same reaction?"
    a: "That was not tested. Every creator in these studies was an everyday influencer whom followers could see as a peer. The authors suspect famous names may escape the problem, because fans are more likely to think a celebrity deserves the deal."

also:
  - doi: "10.1002/mar.22075"
    title: "Authenticity in TikTok: How content creator popularity and brand size influence consumer engagement with sponsored user-generated content"
    authors: "Walsh et al."
    journal: "Psychology & Marketing"
    year: 2024
    text: >-
      Three studies on TikTok asked what a sponsorship tag does to engagement with a creator's post. Sponsored creators came across
      as less genuine, and that cost the brand engagement, but only when the creator had a big following; smaller creators
      paid no such price. A big creator could even gain from sponsorship when the brand behind it seemed small. For a niche label,
      a famous face may be less of a gamble than it looks.
  - doi: "10.1093/jcr/ucae040"
    title: "Why and How Consumers Perform Online Reviewing Differently"
    authors: "de Kerviler et al."
    journal: "Journal of Consumer Research"
    year: 2025
    text: >-
      Using a big collection of online reviews plus interviews with the people who wrote them, this qualitative study argues that
      reviewers differ not just in personality or expertise but in what they believe a review is for. Some write to help fellow buyers, some grade
      products against a system, and some perform as critics with an audience in mind. Each habit produces a recognisably different
      voice. A platform that asks everyone the same questions may be squeezing three kinds of help into one score.

