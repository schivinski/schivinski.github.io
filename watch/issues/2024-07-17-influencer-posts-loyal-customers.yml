title: "Do influencer campaigns put off a brand's most loyal customers? What a Journal of Consumer Psychology study found"
dek: >-
  Paying a creator to praise your brand looks harmless to its existing fans. Five experiments suggest otherwise: shoppers with a
  strong bond read the deal as favouritism towards someone just like them, and grow less eager to buy.
short_title: "Why paid creator posts can cool your biggest fans"

description: >-
  Bentley et al. find paid influencer posts cool a brand's most attached fans: in one of five experiments, they offered
  about 12% less for the very same jeans.

keywords: [influencer marketing backlash, brand attachment, loyal customers, sponsored Instagram posts, paid partnerships,
  influencer sponsorship, choosing influencers, willingness to pay, brand relationships, psychological contract,
  Journal of Consumer Psychology]
topics: [Influencers, Social media, Advertising]

