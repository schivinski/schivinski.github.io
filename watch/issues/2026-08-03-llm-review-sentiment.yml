    title: "The Impact of Follower-Based Status Change on Influencer Content Creation: Evidence from a Regression Discontinuity Approach"
    authors: "Zhong, Wu, Sun, & Chen"
    journal: "Journal of Interactive Marketing"
    year: 2026
    text: >-
      A Chinese platform gives influencers "mid-tier" status once they pass 50,000 followers. Comparing creators just
      above and below that line, gaining the status led to more sponsored posts but not more organic ones, and neither
      kind got more engagement. The extra sponsorship came through the agencies that manage creators and hand out deals
      by status. Where status is a gate to brand deals, a follower count can matter more than the content.
  - doi: "10.1177/00222429261466254"
    title: "Preference Filtering: When Customers Share Narrow Preferences with Algorithms"
    authors: "Gai, Leung, & Klesse"
    journal: "Journal of Marketing"
    year: 2026
    text: >-
      Asked to pick interests for recommendations, customers share a narrower set with an algorithm than with a human
      curator, because they expect the algorithm to weigh everything equally. Across 12 studies with 8,824 people,
      this looks sensible at the time but leads to poorer recommendations later. Two studies on video-streaming sites
      show that easing the filtering increased engagement. If you ask for preferences, show what the choices will be used for.

