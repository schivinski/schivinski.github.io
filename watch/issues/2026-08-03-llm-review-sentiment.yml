title: "Can AI read a review the way its writer meant it? What a Marketing Letters study found"
short_title: "When an AI misreads a review, readers do too"
dek: >-
  A language model read 28,900 product reviews and guessed each star rating. Most guesses were right. The misses
  are the interesting part, because they point to reviews that people also struggle to read.

description: >-
  A language model guessed the star rating of 28,900 reviews from the text alone. When it missed, human readers missed too,
  and found the review less helpful.

