short_answer: >-
  Have the robot speak for a person. Across six studies, four of them with working robots in everyday settings, people did what a
  robot asked more often when it said a nurse, university staff, a lecturer or a doctor was behind the request. At a
  campus entrance, 80% of students cleaned their hands when the robot relayed a request from staff, against 66.3% when it
  asked in its own name. People felt more answerable, and the lift lasted.

takeaways:
  - "In a care home, older residents chose the activity the robot said the nurse recommended in 68.4% of choices, and the one it suggested on its own in 31.6%."
  - "Over four weeks of tutorials, no student in the robot-only groups ever joined its exercise break, while the groups told their lecturer was asking reached 16.4% in week three and 21.1% in week four."
  - "Naming the doctor as the source lifted how accountable people felt to a robot physiotherapist from 3.29 to 5.03, with 7 the top of the scale."
  - "Stacking both levers backfired online: willingness to attend the session the doctor recommended fell from 5.86 to 5.34 (out of 7) once the robot also said how exercise helps recovery."

