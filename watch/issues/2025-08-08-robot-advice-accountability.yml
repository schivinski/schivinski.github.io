title: "How do you get customers to follow a service robot's advice? What a Journal of Marketing study found"
dek: >-
  People shrug off advice from machines far more easily than advice from staff. Four field experiments with real robots and
  two online studies show that a robot is obeyed more often when it passes on another person's request, and that one
  sentence on why the advice helps can do much of the same work.
short_title: "Robot advice works better in a person's name"

description: >-
  Holthöwer et al. find people obey a service robot more when it relays a request from a person: 80% vs 66.3% of
  students sanitised their hands at a campus door.

keywords: [service robots, robot advice, customer compliance, accountability, social presence, human-robot interaction,
  healthcare robots, AI advice, frontline service automation, message framing, Journal of Marketing]
topics: [AI, Service]

