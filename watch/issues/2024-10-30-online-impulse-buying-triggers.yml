sections:
  - h: "What the researchers did"
    body: |
      T. S. Anoop and Zillur Rahman of the Department of Management Studies at the Indian Institute of Technology Roorkee, in
      India, took on a field that had grown fast and kept arguing with itself. Dozens of studies had asked why people buy
      things online they never meant to buy, and they disagreed about what matters. Survey figures the authors cite suggest
      the habit is spreading: in a 2022 poll, 73% of people said they often bought online on impulse, up from 59% in 2020.

      The pair searched three large research databases and kept only studies with data of their own, published in journals
      ranked in the top quarter of their field, that reported the statistics needed for pooling. They turned every result
      into a correlation, corrected it for measurement error, and combined the results with a method that allows for real
      differences between studies.

      They then grouped 31 single triggers into four families. The shopper: personality, motives, moods and how earlier
      purchases felt. Marketing: product, price and promotion. The situation: the urge to buy, enjoyment, a sense of good
      value, whether buying on a whim seems acceptable, and scarcity. The platform: design, ease of use, trust, payment
      options, the feeling of knowing a host or creator, and more. Finally, they checked whether five features of the
      studies changed the results, and whether the links had shifted over the years.
    facts:
      - ["Articles", "75 journal articles in English, all from top-quartile journals; some reported more than one study"]
      - ["Samples", "139,545 responses in total, adding up the sample behind each result"]
      - ["Search", "Scopus, EBSCO Business Source Ultimate and ProQuest in December 2023, plus records from other sources"]
      - ["Where", "71% of studies from Asia, 13% from Europe, 10% from North America, the rest from Africa and South America"]
      - ["Shop types", "Web shops 52%, social commerce 32%, mobile commerce 11%"]
      - ["How data were gathered", "92% online questionnaires; more than 80% of samples not drawn at random"]
      - ["Checks", "Several tests for missing or unpublished studies suggested any bias in the four family results was negligible"]

  - h: "Which family of triggers pulls hardest?"
    body: |
      All four families were clearly and positively tied to impulse buying online. Situational cues came out on top, with
      marketing offers close behind, then the shopper and the platform. The ranges around the four averages
      overlap, though, so read the order as a guide rather than a final ranking.

      The platform family was the most studied, with 139 results and a combined sample of 55,101, which says something about
      where researchers have been looking. Marketing offers had the thinnest base: 24 results.

      We would add one caution about the top spot, which is our own. The situational family includes the urge to buy
      itself, a feeling that sits very close to the purchase. Enjoyment, perceived value and scarcity belong to the
      same family and each showed a solid link on its own, so the result does not rest on the urge alone. Still, the
      family's lead is probably a little inflated by it.
    chart: groups

  - h: "The single triggers that stand out"
    body: |
      Taken one by one, the strongest link belonged to a personality trait: people who like trying new things were the most
      prone to unplanned buys. Promotions such as limited-time deals showed a stronger link than price alone, and both edged out scarcity
      messages of the "only a few left" kind, although the ranges overlap and scarcity rested on just five results.

      Two results should interest anyone who designs a shop. Visual appeal, one of the most studied triggers, sat in the
      bottom third of the list. And feeling close to a host, creator or brand voice, almost as if they were a friend, matched
      enjoyment, the most studied trigger of all.

      Trust in the platform also showed a strong link (0.43, from 13 results), and the feeling that one's data was safe one
      of the strongest (0.50), though that came from only four results. Perceived risk was weak, with a range running from
      below zero to above it. Both the risk and the self-control figures are fragile, the authors note: very few unpublished
      studies with no effect would be enough to erase them.
    chart: drivers

  - h: "Does the type of shop or shopper change the picture?"
    body: |
      Five study characteristics were tested to see whether they shifted the links, and the clearest answer came from the
      type of shop. The shopper's own traits and moods went with impulse buying noticeably more strongly on social commerce, such as
      buying inside a social app or during a live stream, than on ordinary web shops. Platform features showed the same
      order, at 0.43 on social shops against 0.35 on web shops and 0.32 in mobile apps. The authors think live-stream
      selling, common in the studies of social shops, may account for some of that difference.

      Situational cues varied with culture and with who was asked. They were linked much more strongly in collectivist
      countries, where people tend to see themselves through their group, than in individualist ones (0.47 against 0.18).
      That result only just passed the usual test for chance and rests on ten results from individualist countries. Student
      samples also showed stronger situational links than samples from the general public (0.58 against 0.42), though only
      eight results came from students.

      Marketing offers were the steady ones. None of the five study features made a reliable difference to how strongly
      price, promotion and product information were tied to impulse buying.
    chart: commerce

  - h: "Are the links getting stronger?"
    body: |
      The authors also tracked how the size of the links changed with the year each study came out, using results from 2009
      onwards. For platform features, situational cues and marketing offers, newer studies found stronger links than older
      ones, at a similar pace for all three. For the shopper's own traits the change was close to nothing.

      For the authors, this is evidence that online buying behaviour keeps moving, and they urge managers to keep re-checking
      what works. That is a fair reading. Still, the same years also brought changes in how studies were run, such as new
      questions, platforms and panels, and the analysis cannot separate the two. Treat it
      as a trend in the research rather than proof that shoppers themselves have changed.

      How the data were gathered mattered too. Results for the shopper's own traits were larger in online questionnaires
      (0.41) than in studies that mixed online and offline questionnaires (0.20).

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["Find your unplanned orders", "Pull last month's orders and flag the ones placed within 15 minutes of a first visit, with no earlier search, wishlist or basket. Note the page, post or live stream each one came from."]
  - ["Decide which nudges you can stand behind", "List every offer and cue you could use next month, such as a price cut, a bundle or a low-stock note. Strike out anything that is not true, like a countdown that quietly resets."]
  - ["Make browsing fun and paying quick", "Add a 'new this week' row and short product videos where people scroll. Swap in fresh items every week. Keep checkout to three taps, with the payment methods your customers already use."]
  - ["Give the shop a familiar voice", "Pick one host or creator and give them a weekly live session or short video. Have them answer real questions and show products being used, rather than reading out specifications."]
  - ["Test one trigger at a time", "Run each new offer or design change against the current version for 14 days, keeping products and traffic as alike as you can. Keep a change only if orders rise and returns do not."]
  - ["Check for regret every month", "Compare return rates and complaints for quick, unplanned orders with those for planned ones. If impulse orders come back much more often, tone down the urgency and make the product page clearer."]

expect:
  - "**Several small levers, not one big switch.** Even the strongest family sat below 0.5 on the 0 to 1 scale, so gains are likely to come from several changes adding up."
  - "**Different shops, different levers.** The authors suggest that social shops lean on the shopper's mood and personality, while web shops put their effort into how the site looks and works."
  - "**Smaller effects on your own customers.** The averages come almost entirely from online questionnaires and easy-to-reach panels, so tests with real buyers will probably show more modest gains."
  - "**Some of the extra sales may come back.** The authors point to economists' warnings that impulse spending can end in debt. Returns and regret were not measured, so track them yourself."

limits:
  - "**Questionnaires, not shopping baskets.** Every result came from surveys, so the findings show what goes together with impulse buying, not what causes it, and purchases were reported by shoppers rather than observed."
  - "**Weighted towards collectivist cultures.** Only about one study in five came from an individualist country, which makes the culture comparisons thin."
  - "**Top journals, English only.** Studies in other languages, in lower-ranked journals or without the numbers a meta-analysis needs were left out, as the authors themselves note."
  - "**Big differences between studies.** For nearly every trigger, results swung widely across the pooled work, so an average may describe your own shoppers poorly."
  - "**Broad buckets.** Similar ideas measured in different ways were treated as one trigger, and several subgroup tests rely on very few results."

faq:
  - q: "What triggers impulse buying online?"
    a: "Four kinds of trigger all play a part: the moment itself, marketing offers, the shopper's own make-up and the design of the platform. A meta-analysis of a quarter-century of research found the first two had the strongest average links, with the other two close behind (Anoop & Rahman, 2025)."
  - q: "Do discounts work better than scarcity messages for impulse sales?"
    a: "On average, yes. Promotions such as time-limited deals had a stronger link with unplanned buying than low-stock messages, and price on its own sat between the two. Far fewer results stood behind scarcity, so that comparison could shift as more evidence comes in."
  - q: "Is impulse buying stronger on social commerce than on websites?"
    a: "The links were stronger there. Both the shopper's moods and traits and the features of the platform were more closely tied to impulse buying on social shops than on web shops, a pattern the authors connect with selling through live streams."
  - q: "Does self-control stop people buying on impulse online?"
    a: "Not reliably, judging by the research to date. Some studies found it held shoppers back and others found the reverse, so on average it showed almost no link. The authors also class the result as fragile."
  - q: "What counts as online impulse buying?"
    a: "A purchase made on a website, app or social platform without any earlier plan to buy, usually sparked on the spot by a feeling, an offer or something on the screen."

also:
  - doi: "10.1002/mar.22137"
    title: "Putting an artificial intelligence-generated label on it comes naturally"
    authors: "Sigurdsson et al."
    journal: "Psychology & Marketing"
    year: 2025
    text: >-
      Three experiments asked wine buyers how they felt about bottles shown with or without a sustainability badge. A made-up
      badge created with AI lifted willingness to buy and to pay just as much as a genuine third-party certification, compared
      with no badge at all. People who pay close attention to front-of-pack labels, and those who know and care about wine,
      were keener to buy whatever the badge. A convincing badge persuades whether or not anyone stands behind it, which is a
      strong reason to make sure someone stands behind yours.
  - doi: "10.1002/mar.22143"
    title: "Augmented reality experiences: Consumer-centered augmented reality framework and research agenda"
    authors: "Barta et al."
    journal: "Psychology & Marketing"
    year: 2025
    text: >-
      This systematic review maps consumer research on augmented reality since Pokémon Go made it mainstream: the theories,
      methods, devices and settings involved. It sorts the work into four strands, running from how the medium shapes
      responses to what makes people adopt AR apps and how firms should roll them out. The authors then propose a framework
      that puts the consumer at the centre, alongside content, context and device. Before funding an AR try-on or game, check
      which of those four pieces you have actually planned for.

