title: "What makes people buy on impulse online? What a Journal of Consumer Behaviour meta-analysis found"
dek: >-
  Unplanned purchases make up a big share of online sales, yet research on what sets them off kept contradicting itself.
  A meta-analysis of 25 years of studies sorts the triggers into four families and finds that the situation and the deal on offer
  pull hardest, with their grip tightening over time.
short_title: "What tips online shoppers into impulse buys"

description: >-
  Anoop and Rahman pool 84 studies of online impulse buying: situational cues and offers link most strongly, while
  shoppers' self-control shows almost no link.

keywords: [online impulse buying, impulse purchases, unplanned buying, e-commerce conversion, social commerce,
  live stream shopping, promotions and discounts, scarcity marketing, online shop design, parasocial interaction,
  meta-analysis, Journal of Consumer Behaviour]
topics: [Retail, Social media]

