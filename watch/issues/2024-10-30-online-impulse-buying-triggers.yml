short_answer: >-
  Mostly the moment and the offer. Pooling 341 results from 84 studies published between 2000 and 2024, this meta-analysis
  found the strongest links with situational cues, such as enjoying the browse or sensing a bargain, and with prices,
  promotions and product details. Shoppers' own traits and moods, and the design of the site or app, also mattered, a little
  less. Every one of the four families went with more impulse buying, not less.

takeaways:
  - "Good moods pulled harder than bad ones: feeling upbeat while shopping had a correlation of 0.40 with impulse buying (zero would be no connection at all), against 0.23 for a bad mood."
  - "Self-control hardly registered, with an average link of 0.02 across nine results that pointed in opposite directions."
  - "Between 2009 and 2024, the links for site features, offers and situational cues grew roughly eight times faster per year than those for shoppers' own traits."
  - "Studies with random samples found site features mattered far less than studies using whoever was easy to reach: 0.24 against 0.42."

