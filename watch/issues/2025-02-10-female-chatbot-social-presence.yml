short_answer: >-
  It can, through how it talks rather than how it looks. In two German-language experiments with 666 consumers, a chatbot
  given a stereotypically feminine writing style, warm, chatty and with emojis, gave people a stronger sense of someone being
  there than a brisk "male" version, and the gain was explained by its seeming more sociable. A female avatar picture also
  looked friendlier than a male one, yet overall it felt less present. Men and women responded alike.

takeaways:
  - "The 'female' chat script was built from a handful of cues. When 88 people rated the trip versions beforehand, it scored 4.20 against 1.95 for emoji use and 5.64 against 1.61 for talk about family and friends."
  - "Men took to the friendlier script as much as women did: its boost to presence, working through friendliness, came to 0.25 for men and 0.29 for women, a gap the statistics could not tell apart from chance."
  - "Of the 3 traits measured, only friendliness linked a female agent to a stronger sense of presence, in both studies. Seeming honest or capable played no part in that link."
  - "The authors report that the friendliness route held across 4 purchases, practical and pleasurable alike: investments, clothing, a holiday trip and an electric toothbrush."

