title: "Does a female chatbot feel more like a real person to customers? What a Journal of Consumer Behaviour study found"
dek: >-
  Most of the best-known digital assistants have female names and voices. Two German-language experiments trace where any
  advantage comes from, and find it rests on seeming friendly, not on seeming honest or clever.
short_title: "Why a feminine chatbot feels more human"

description: >-
  Nickel and Meyer find a chatbot written in a warm, feminine style seemed more present because it felt friendlier, while a
  female avatar face did not.

