    title: "Cultural Influences on Privacy Calculus in Loyalty Programs: An Analysis of Individual and National-Level Cultural Values"
    authors: "Balabanis et al."
    journal: "Journal of International Marketing"
    year: 2025
    text: >-
      Shoppers in four countries with very different cultures, 1,259 in all, were surveyed about the personal data they hand to retail
      loyalty schemes in return for perks. People who disliked uncertainty, and those living by more collective norms, voiced
      sharper privacy worries, and cultural values also shaped how far members trusted the retailer and stayed loyal. The authors
      looked at culture both in each person's own values and at the level of whole countries. One data promise will rarely fit
      every market a scheme runs in.
  - doi: "10.1002/mar.22050"
    title: "Gift giving in the age of AI: The role of social closeness in using AI gift recommendation tools"
    authors: "Fu et al."
    journal: "Psychology & Marketing"
    year: 2024
    text: >-
      Five studies asked when people let an AI tool choose a present. How close the giver felt to the recipient made a clear
      difference: a gift for someone close is meant to say something about the relationship, and expecting that signal held
      people back from the tool. A tool that could chat back and forth drew more use, especially for gifts to close friends.
      For personal occasions, a gift finder that can hold a conversation may stand a better chance.

