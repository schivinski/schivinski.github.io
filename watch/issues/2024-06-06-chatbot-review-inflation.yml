title: "Do chatbots inflate online review ratings? What a Journal of the Academy of Marketing Science study found"
dek: >-
  More firms now ask for reviews through a chat window instead of a form. Four studies show that the more humanlike the
  bot, the higher the stars, while the words that come with them get shorter and less useful.
short_title: "Why chatbots collect kinder, thinner reviews"

description: >-
  Tsekouras et al. find reviews gathered by chatbot score up to 16% higher than those from a plain form, yet run about 42%
  shorter and help readers less.

keywords: [conversational reviews, chatbots, online reviews, review solicitation, rating inflation, anthropomorphism,
  review helpfulness, social presence, customer feedback, review collection, Journal of the Academy of Marketing Science]
topics: [AI, UGC, Retail]

