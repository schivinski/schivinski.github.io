short_answer: >-
  Yes, they can. Across four studies, people gave the same product higher marks when a chatbot asked for their review
  than when a standard form did. A bot with a name, a face and a chatty, personal manner pushed scores highest. The
  written part suffered at the same time: reviews gathered in chat were shorter, and other readers found them less
  helpful when choosing.

takeaways:
  - "In a live statistics course, students rated the same teaching videos 4.38 out of 5 when a chatbot asked and 3.79 when a form did, about 16% higher."
  - "Pooling all four studies, a plain chatbot raised ratings by 0.35 standard deviations over a form, and a humanlike bot by 0.62."
  - "In the final study, reviews written through the plain chatbot ran about 42% shorter than those written on a form."
  - "Weak products gained most from the chat: a deliberately clumsy survey scored 8.05 out of 10 in chat against 7.37 on a form, while a well-made one barely moved (8.78 against 8.66)."

