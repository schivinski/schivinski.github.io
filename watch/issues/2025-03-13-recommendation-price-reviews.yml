short_answer: >-
  One of them, not both. A US online retailer split 47,996 website shoppers into four groups whose recommended products
  showed price and reviews, price only, reviews only, or just a name and picture. The one-cue tiles produced the most sales.
  Full tiles let shoppers reject weak suggestions without clicking. Bare tiles pushed them back to the search box, where
  they hunted longer and bought least.

takeaways:
  - "Compared with tiles showing both cues, the odds that a visit ended in a purchase were about 19% higher with reviews alone and about 14% higher with the price alone."
  - "Bare tiles drew the most clicking and the longest visits of the four designs, yet cut the odds of a purchase by about 28% against the full tiles."
  - "Nothing in the algorithm changed, although its suggestions were already bringing in less than the 12% industry average share of sales from recommendations. Only what the tiles showed was altered."
  - "Among the 40 biggest US online stores, price alone ties for the most common setup: 27.5% use it as their only design, and none uses reviews alone as its only one."

