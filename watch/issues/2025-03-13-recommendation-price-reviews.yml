title: "Should recommended products show the price and the reviews? What a Journal of Marketing study found"
dek: >-
  Most online stores print a price, a star rating or both under every item in their "you may also like" row. A five-week
  field test on a US retailer's website found those tiles sold best carrying one of the two, and worst carrying neither.
short_title: "One cue, not two: what to put on recommendation tiles"

description: >-
  Fang et al. find recommendation tiles showing just the price or just the reviews outsold tiles showing both, in a
  randomized trial on 47,996 shoppers.

keywords: [product recommendations, recommender systems, recommendation tiles, product page design, information cues,
  showing prices online, star ratings display, search frictions, on-site search, A/B testing, e-commerce conversion,
  Journal of Marketing]
topics: [Retail, Personalization, Search]

