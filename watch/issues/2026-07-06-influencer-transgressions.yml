title: "When a brand and an influencer get caught together, who gets punished? What a Journal of the Academy of Marketing Science study found"
short_title: "The brand walks. The influencer burns."
dek: >-
  A famous Italian Christmas cake, a charity donation that never happened, and fines for both parties. Then 80,000
  tweets showing the public went after only one of them, for a reason the researchers did not expect.

description: >-
  In the Ferragni and Balocco case, 96% of journalists' tweets were about the influencer. Consumers followed the
  press, and the brand barely got mentioned.

keywords: [influencer marketing, brand transgression, influencer scandal, crisis response, media legitimacy,
  consumer backlash, parasocial identification, Chiara Ferragni, Balocco, reputation management, brand safety,
  Journal of the Academy of Marketing Science]
topics: [Influencers, Advertising, Social media]

