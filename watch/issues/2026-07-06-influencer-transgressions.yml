  title: "From influence to infamy: Responses to company-influencer transgressions"
  authors: ["Nanni, A.", "Ulqinaku, A.", "Giannetti, V."]
  authors_full: ["Anastasia Nanni", "Aulona Ulqinaku", "Verdiana Giannetti"]
  year: 2026
