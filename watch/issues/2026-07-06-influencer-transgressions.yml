short_answer: >-
  The influencer, by a wide margin, and not because consumers worked out who was more to blame. Journalists decide
  first. In the case the authors studied, the press wrote almost entirely about the influencer and wrote about her
  more harshly, consumer sentiment followed a day later, and attitudes toward the company barely moved. Neither
  fame nor money explained it. What did was identification: people see something of themselves in an influencer, so
  when the influencer is disgraced they push her away to protect their own self-image. Nobody identifies with a
  confectionery company.

takeaways:
  - "Consumers barely discussed the brand. Of 80,314 tweets about the case, 79,078 were about the influencer and 1,236 about the company."
  - "Fame did not explain it. Swapping an influencer with 304 million followers for one with 114,000 changed nothing, and nor did swapping a $45 million net worth for $50,000."
  - "Of four candidate explanations tested side by side, only identification survived. Journalists' self-interest, accountability and schadenfreude were all ruled out."
  - "Journalists restored most legitimacy to an influencer who sat down with a hostile interviewer: 4.12, against 3.38 for a friendly one and 3.34 for a post to followers."

