title: "Should a brand put its logo front and centre in a meme? What three Journal of Retailing and Consumer Services experiments found"
dek: >-
  Some brands tuck their name into a meme as lightly as they can, hoping it will not read as an ad. Three US experiments
  point the other way: making the brand easy to spot pulled people into the joke, above all when they barely knew the brand.
short_title: "Why memes work better when the brand shows"

description: >-
  Razzaq et al. find memes that show the brand clearly earn more liking and sharing intent, most of all for little-known
  brands and captions written to "you".

keywords: [meme marketing, brand memes, logo placement in memes, brand prominence, brand placement, narrative transportation,
  meme literacy, second-person pronouns in advertising, humour on social media, customer engagement,
  Journal of Retailing and Consumer Services]
