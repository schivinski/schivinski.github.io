short_answer: >-
  Yes, and early arrivals win back less than late ones lose. Across more than two million orders from a Western European
  meal delivery firm, regular customers took longer to order again after a delivery missed its promised time and came back
  sooner after one that beat it. Minute for minute, lateness counted for more. A follow-up online experiment showed the effect
  runs through how satisfied people feel with the delivery time.

takeaways:
  - "Close to the quoted time, each minute of lateness cut a customer's chance of reordering at any given moment by about 0.18%, while each minute of earliness raised it by about 0.08%: lateness weighed more than twice as heavily."
  - "The firm already ran ahead of its own promises: 74% of orders beat the quoted time, and the typical order turned up about 7 minutes early."
  - "Satisfaction carried the effect: every extra point of contentment with the wait went with about two-thirds of a point more on the likelihood of ordering again, both on 11-point scales."
  - "People privately expected to wait 35 to 37 minutes on average against a 30-minute quote, yet their own guess hardly moved their satisfaction."

