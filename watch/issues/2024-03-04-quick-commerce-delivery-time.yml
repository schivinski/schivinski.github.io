title: "Do late food deliveries cost repeat orders, and do early ones win them back? What a Journal of Service Research study found"
dek: >-
  Delivery apps promise dinner within half an hour, and customers hold them to the minute. Ordering data from a European
  meal delivery firm and an online experiment show that lateness costs more repeat business than earliness earns, and that
  arriving far too soon is not much of a gift either.
short_title: "Why a late delivery hurts more than an early one helps"

description: >-
  Harter et al. tracked two million meal delivery orders: each minute late slowed reordering more than twice as much as a
  minute early sped it up.

keywords: [quick commerce, food delivery apps, delivery time estimates, late deliveries, early deliveries, customer retention,
  repurchase behaviour, on-demand delivery, service recovery, customer satisfaction, Journal of Service Research]
topics: [Service, Retail]

