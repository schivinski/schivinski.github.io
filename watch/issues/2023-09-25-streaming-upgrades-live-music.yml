short_answer: >-
  Partly. In a German panel followed over three years, adults who moved to Spotify Premium said they would pay €27.5 to
  €28.2 more a year for live music in the next six months than similar people who kept their plan. People who cancelled
  or dropped to the free plan went to 1.7 fewer events over the same months. Joining the free plan brought no clear gain,
  and album buying did not change.

takeaways:
  - "Losing a subscriber mattered more than gaining one: within six months of the switch, cancelling or downgrading cut the yearly amount people would pay for live music by €32.9, while joining or upgrading added €16.6."
  - "Six to twelve months after going from no streaming straight to Premium, people still said they would pay €31.9 a year more for concerts and festivals than similar non-switchers."
  - "Asked what they would do if the free plan disappeared, 36% of 1,093 free users said they would pay for Premium and 64% said they would stop using the service."
  - "In the authors' revenue scenario, removing the free plan would add €18.5 a year per user, against €9.7 for cutting its features. Cutting features only comes out ahead if at least 32.7% of free users upgrade."

