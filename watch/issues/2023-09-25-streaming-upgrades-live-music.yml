title: "Do premium streaming subscriptions help sell concert tickets? What a Journal of Interactive Marketing study found"
dek: >-
  Live events bring in most of the music industry's money, so a listener's streaming plan matters beyond its monthly fee.
  A three-year panel of German adults links the move to a paid plan with a bigger budget for concerts, and cancelling with
  a smaller one.
short_title: "Paid streaming and the concert budget"

description: >-
  Seifert et al. find German adults who moved to paid music streaming would pay more for live music, and those who
  cancelled went to fewer concerts.

keywords: [music streaming, freemium business model, free tier, premium subscription conversion, subscription upgrades,
  customer churn, live music demand, concert ticket sales, demand spillovers, willingness to pay, propensity score matching,
  Journal of Interactive Marketing]
topics: [Service, Retail]

