    authors: "Bhardwaj & Sharma"
    journal: "Journal of Advertising Research"
    year: 2026
    text: >-
      Across four experiments and a field test, luxury brands promoted by micro-influencers felt less crowded and more
      exclusive than the same brands promoted by big names, which raised purchase intentions. The effect was strongest for
      shoppers who like to stand out and faded among people tired of luxury. Bigger reach is not always the better buy.

