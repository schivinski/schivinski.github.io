short_answer: >-
  It can. In our experiment, a travel influencer who added a romance and private memories to her travel tips was rated
  less credible than the same influencer giving the tips alone. The personal story did not hurt by being personal. It
  hurt because followers felt it no longer fitted what she is known for. People who felt the influencer made them more
  capable were far less bothered by the drift.

takeaways:
  - "Credibility fell from 5.14 to 4.54 out of 7 when the same travel tips came wrapped in an intimate story."
  - "Followers rated the intimate post a full point lower for fit with the influencer's expertise, 2.63 against 3.63 out of 5."
  - "Among followers who felt most capable through the influencer, the loss of fit was about half the size it was among those who felt least capable."
  - "Once fit was taken into account, intimacy did no further damage on its own (b = 0.20, not significant)."

