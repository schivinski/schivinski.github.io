sections:
  - h: "What we did"
    body: |
      Fernanda Polli Leite and Nicolas Pontes of the University of Queensland Business School led this study, and I took
      part from RMIT University in Melbourne.

      Travel influencers often share more than tips. They talk about who they met, what a place meant to them and moments
      most people would keep private. Earlier work had found that this kind of openness can make followers feel closer to a
      creator, but also that it can backfire. We wanted to know when it costs credibility, and why.

      We built a fictitious travel influencer called Sophia and showed people her Instagram profile and a post with tips for
      Thailand: eat at a local food stall to meet people, and spend three days on Koh Lipe. Half saw only the tips. The other
      half saw the same tips with intimate extras: a new romance that started over dinner, and a very private memory tied to
      the island. Everyone then rated how credible she seemed, how well the post fitted her field and how capable she made
      them feel.
    facts:
      - ["Participants", "212 US social media users recruited online, 60.4% women, average age 36"]
      - ["Design", "Two versions of one Instagram post, assigned at random: tips only (108 people) or tips with intimate content (104)"]
      - ["Influencer", "Sophia, a fictitious female travel creator, so nobody arrived with an existing opinion of her"]
      - ["Measured", "Credibility on 15 pairs of words such as dishonest to honest, fit between the post and her expertise, and how capable she made followers feel"]
      - ["Checks", "The intimate post was rated far more personal, and both versions were seen as realistic"]

  - h: "The confession cost her credibility"
    body: |
      Same influencer, same advice, one extra story. The tips-only version scored 5.14 out of 7 for credibility, while
      the intimate version scored 4.54. The drop showed up across the three things credibility is made of: how
      attractive, trustworthy and expert she seemed.

      What explained it was fit. People judged the intimate post as much less in line with what a travel expert should be
      posting, and that sense of mismatch accounted for the whole credibility loss. With fit in the picture, the intimacy
      itself had no extra effect. Followers were not punishing her for being personal. They were reacting to a post that had
      wandered away from the reason they follow her.
    chart: credibility

  - h: "Followers who feel more capable forgive more"
    body: |
      The second finding is the one I find most useful. We also asked how capable and effective the influencer made each
      person feel, a basic need that psychologists call competence. Among people low on that feeling, the intimate post
      lost 1.20 points of fit. Among people high on it, the loss shrank to 0.63.

      Our reading draws on how persuasion works. Followers who get a sense of mastery from a creator pay attention to the
      core message, the travel advice, and treat the personal story as background. Followers who get less from her lean on
      side cues, and an off-topic confession is a loud one.
    chart: competence

  - h: "Why I think this matters more now"
    body: |
      What follows is opinion, not something we measured. Since we ran the study, the pressure on creators to be raw and unfiltered has
      grown, and brands brief influencers to be authentic as if more disclosure always means more trust. Our results point
      somewhere more precise. Sharing is not the risk. Drifting is. A personal story that helps the audience do the thing
      they follow you for can sit comfortably in a post. One that pulls them somewhere else asks them to rethink who you
      are.

      I also think the competence side is underused. Much influencer advice is about relationships: reply to comments, feel
      like a friend. That matters, but no creator can be close to hundreds of thousands of people. Making followers feel
      more capable scales in a way intimacy does not.

      What we did not test matters too. Sophia was invented, the story was strong, and we showed one woman, one destination
      and one post. Real creators with years of history may get more leeway.

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["Write down what you are known for", "Before your next campaign, describe the creator's field in one sentence, such as budget travel in Southeast Asia. Every post is judged against that sentence."]
  - ["Screen each personal detail", "Read the draft and mark every personal line. For each one, ask whether it helps a follower plan, choose or do something in that field. Cut or move any line that does not."]
  - ["Tie the story to a tip", "When a personal moment stays, attach a practical takeaway to it in the next sentence, such as where it happened, what it cost or what to book."]
  - ["Add one skill-building element", "Put at least one thing in every post that leaves followers more capable: a three-day itinerary, a cost breakdown, a safety checklist or a short quiz."]
  - ["Test two versions with a small group", "Show the post with and without the personal story to 20 followers. Ask each one to rate how expert and trustworthy the creator seems, from 1 to 7."]
  - ["Watch the comments for drift", "For the first 48 hours after posting, count comments that question the creator or say the post is off topic. If they pass one in ten, trim the personal part next time."]

expect:
  - "**Personal content is not banned.** It works when it serves the advice, so the job is editing, not hiding."
  - "**Engaged followers give more room.** People who feel they learn from a creator tolerate more personal material."
  - "**A real cost when stories drift.** A single off-topic confession was enough to pull credibility down."
  - "**Slow gains from teaching.** Building followers' skills pays off over a run of posts, not one."

limits:
  - "**An invented influencer.** Followers had no history with Sophia, so real creators with loyal audiences may be judged differently."
  - "**One strong story.** The intimate version was very personal, and milder disclosure may cost less."
  - "**One post, one destination, one woman.** Other topics, platforms and male creators were left untested."
  - "**Longer posts.** The intimate version was also longer, which the paper flags as a limitation."

faq:
  - q: "Should influencers share personal stories?"
    a: "Yes, when the story fits what they are known for. In this experiment an intimate story unrelated to the travel advice lowered credibility, and the reason was poor fit rather than the personal detail itself (Leite, Pontes & Schivinski, 2024)."
  - q: "Why does oversharing make an influencer seem less credible?"
    a: "Because followers judge every post against the creator's field. When a post drifts away from it, they see it as off topic, and that mismatch carried the whole credibility loss in the study."
  - q: "Do some followers mind less?"
    a: "Yes. People who felt the influencer made them more capable showed a much smaller drop in perceived fit, about half that of people who felt least capable."
  - q: "What kind of content protects an influencer's credibility?"
    a: "Content that matches their expertise and teaches something, such as itineraries, cost breakdowns or safety advice, so followers come away better at the thing they follow the creator for."

