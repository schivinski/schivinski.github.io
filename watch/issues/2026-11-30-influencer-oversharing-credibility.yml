title: "Does oversharing hurt an influencer's credibility? What a Journal of Travel & Tourism Marketing experiment with 212 social media users found"
dek: >-
  A look back at a study I ran with two colleagues on travel influencers who mix personal confessions into their tips.
  The private story itself was not the problem. The problem was that it no longer matched what she was known for.
short_title: "Personal stories cost trust when they drift off topic"

description: >-
  Leite et al. showed 212 social media users a travel influencer's tips: an added intimate story cut her credibility,
  as the post stopped fitting her field.

keywords: [influencer credibility, influencer self-disclosure, oversharing, travel influencers, personal content,
  authenticity, content fit, influencer marketing, tourism marketing, follower competence, Journal of Travel & Tourism Marketing]
topics: [Influencers, Social media]

