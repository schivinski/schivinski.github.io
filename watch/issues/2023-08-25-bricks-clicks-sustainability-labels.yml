title: "Do eco and fair-trade labels sell differently online than in stores? What a Journal of Service Research study found"
dek: >-
  Organic and other environmental labels took a bigger share of grocery spending when people ordered online, while labels
  for fair pay and working conditions did better on the shop floor. Loyalty-card records from two Scandinavian retailers
  suggest the channel shapes which kind of sustainability claim people buy.
short_title: "Green labels sell online, fair-trade labels in store"

description: >-
  Fröberg et al. find environmental labels take a larger share of grocery spending online, and social labels such as fair
  trade a larger share in store.

