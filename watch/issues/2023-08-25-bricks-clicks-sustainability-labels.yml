short_answer: >-
  Yes, on this evidence. Loyalty-card records covering almost 900,000 baskets show Scandinavian grocery shoppers spending
  more on environmentally labelled products, such as organic food, when they ordered online, and more on socially labelled
  products, such as fair-trade goods, when they shopped in the store. It held up when the team compared each customer's
  online and in-store baskets. At a beauty retailer, social labels also sold better in store.

takeaways:
  - "After a grocer opened an online shop, households that used it spent an estimated US$5.70 a month extra on environmentally labelled products and US$1.40 a month less on socially labelled ones, relative to households that stayed in the store."
  - "Among 700 customers who used both channels, the online rise in environmentally labelled spending showed up for bananas and vacuum-packed coffee, while chocolate and ice cream showed no channel difference for that label."
  - "For one coffee sold with and without labels, 15 of 131 shoppers who bought it in both channels chose the environmentally labelled pack more often online, 3 less often, and 113 kept the same mix."
  - "At a beauty retailer with 9,271 customers using both channels, socially labelled products sold better in store, although the difference came to under US$1 a month per customer."

