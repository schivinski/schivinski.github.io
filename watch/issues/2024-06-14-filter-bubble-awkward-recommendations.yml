title: "Can an embarrassing product recommendation break the filter bubble? What a Psychology & Marketing study found"
dek: >-
  Recommendation engines keep showing people more of what they already like. Three experiments, two in China and one
  in Britain, show that an embarrassing suggestion makes people want to set the record straight, and they lean towards
  the unfamiliar.
short_title: "When an awkward suggestion sends people exploring"

description: >-
  Lv et al. find an embarrassing recommendation nudges people towards novelty: 58% chose a newer prize after a piles
  cream suggestion, 37% after hand cream.

keywords: [filter bubbles, personalized recommendations, recommendation algorithms, embarrassing products,
  unmentionable products, novelty seeking, sensitive product advertising, social recommendations, algorithmic labelling,
  personalized advertising, consumer identity, Psychology & Marketing]
topics: [Personalization, AI, Social media]

