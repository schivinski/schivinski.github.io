short_answer: >-
  Sometimes, yes. In three experiments involving 804 people, a personalised suggestion for something embarrassing, such
  as piles cream or an HIV test, made people keener to try new things than a suggestion for an everyday product. They
  wanted to alter the impression the system seemed to have of them. The push disappeared when the same suggestion was
  said to come from the people they follow.

takeaways:
  - "Students told that a system had matched them with piles cream chose the newer of two equally priced prizes 58% of the time, against 37% for those matched with hand cream."
  - "On Facebook, an HIV test-kit ad rather than a flu one raised people's wish to correct the system's picture of them by 0.85 points, on a scale that tops out at 7."
  - "People do read the small print: told an ad was picked from what the accounts they follow browse, viewers placed its origin at 4.83 out of 7, where 1 meant 'my own behaviour' and 7 'my network', against 2.52 when told it came from their own browsing."
  - "Asked whether buying each item felt like a secret they could not share, adults in China scored condoms 6.28 and tests for sexually transmitted infections 6.46 out of 7, against 1.55 for chewing gum."

