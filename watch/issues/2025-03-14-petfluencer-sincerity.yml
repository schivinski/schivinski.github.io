short_answer: >-
  Often, yes. When a peanut butter brand ran two sponsored Instagram posts for four days, the one showing a dog's paws
  drew three times the engagement of the one showing a man's hands, at a third of the cost per engagement. Online, people
  offered more for wine a cat recommended than for wine a woman recommended, largely because the cat seemed more sincere,
  and a second experiment confirmed that sincerity drives the gap.

takeaways:
  - "The price offered for a case of wine rose from $40.57 to $58.08, about 43% more, when a cat rather than a woman posted the recommendation."
  - "Viewers scored the cat higher on sincerity traits such as honesty than the woman, 5.03 against 4.02 on a scale of 1 to 7."
  - "Primed to think about sincerity, people offered 46% more for a bottle the cat endorsed than for the woman's; after recalling insincerity, the cat's lead disappeared."
  - "Framing mattered too: students who readily humanise animals offered about $1.14 more for socks after a today-focused prompt, while those who rarely do offered about $1.22 more when the prompt pointed to the future."

