title: "Are pet influencers more persuasive than human ones? What a Journal of Advertising Research study found"
dek: >-
  Brands now pay dogs and cats to post on their behalf. A live Instagram test and three experiments suggest an animal can
  be the more persuasive endorser on social media, because followers take a pet's recommendation as sincere.
short_title: "Why a pet's sponsored post can beat a person's"

description: >-
  Lavertu et al. find pet influencers can out-persuade people: a post with a dog's paws drew triple the engagement, and
  a cat lifted the price offered for wine.

