sections:
  - h: "What the researchers did"
    body: |
      Laura Lavertu of the University of Strathclyde,
      Katina Kulow of the University of Louisville,
      and Kirsten Cowan and Ben Marder of the University of Edinburgh
      studied a kind of creator that brands are signing up quickly and researchers have mostly ignored: the petfluencer.
      They define it as a pet with its own dedicated social media account and a sizeable following, sometimes paid to promote
      brands. A dog that turns up now and then on its owner's feed does not qualify.

      Their starting point is influencer fatigue. As sponsored posts multiply, followers increasingly suspect human creators of
      praising products for the money. Nobody suspects a cat of that. The team asked whether this innocence makes a pet's
      endorsement more persuasive, why, and whether the wording of a pet's post changes the result.

      They worked in four steps, from a live ad test on Instagram to three controlled experiments. Each post spoke in the
      creator's own voice and carried the usual #ad and #sponsored tags.
    facts:
      - ["Studies", "An Instagram ad test lasting four days, two online experiments and one lab experiment"]
      - ["People", "35,837 Instagram users reached; 150 and 201 online participants; 185 students at a large US university"]
      - ["Creators", "A dog's paws or a man's hands; a cat or a woman; a pet alone in the final study"]
      - ["Products", "Peanut butter, wine and socks"]
      - ["Measured", "Post and page engagements, perceived sincerity, and the most people would pay"]
      - ["Checks", "Pretests found the posters believable, and the pet and the person equally attractive and cute"]

  - h: "Paws against hands in a live Instagram test"
    body: |
      The first test ran where sponsored posts actually live. Using Meta's split-testing tool, the team showed two versions of
      a sponsored post for a peanut butter brand to separate, randomly drawn groups of US users aged over 18 with an interest in
      peanut butter. One version showed a man's hands at the jar. The other showed a dog's paws, with a caption about helping
      "my human daddy" finish it off.

      Showing only hands or paws was deliberate. It kept faces, looks and gender out of the comparison.

      Over four days, with matching budgets each day, the two reached audiences of similar size. The dog's
      version won: each post engagement cost £2.29, against £6.86 for the human version, and the gap in engagements with the
      brand's page was wider still. The counts are small, which is why the controlled studies that followed matter.
    chart: field

  - h: "Why would a cat sell wine better than a woman?"
    body: |
      Next came an online experiment with 150 people recruited through TurkPrime. Each saw one Instagram post for an online
      wine seller, from either a woman or a cat, with the same picture content and near-identical words. A woman was chosen
      because, by an industry count the authors cite, 84% of influencers are female. Participants said what a case of wine was
      worth to them and rated the poster on seven sincerity traits.

      The cat came across as more genuine, and that impression explained much of the higher price. In the authors' mediation
      analysis, about $8.74 of the difference ran through perceived sincerity.

      Answers varied widely within each group, partly because nobody was told how many bottles a case holds. The authors
      tightened the design in the next study.

  - h: "Switch sincerity off and the advantage goes"
    body: |
      To check that sincerity really was the driver, the team manipulated it directly. In a second online study, 201 people
      first spent up to a minute recalling a person, or an animal, whose actions were either heartfelt and genuine or the
      opposite. They then saw a matching post, pet or human, now without the glasses used as a prop earlier, and named a price
      for one bottle of wine, up to $50.

      The cat pulled ahead only after the sincerity prompt. After the insincerity prompt, the two posters landed close together.
      One result surprised the authors: for the woman, recalling sincerity lowered the price people offered, a borderline effect.
      Their tentative explanation is that thinking about sincerity reminded people how often influencers fall short of it. A
      follow-up test in the paper's appendix ruled out novelty and credibility as rival explanations for the pet's edge.
    chart: wine

  - h: "Speak to the moment for people who humanise animals"
    body: |
      The final study, with 185 students, turned from whether to how. Everyone saw the same petfluencer post for a sock brand,
      in which a pet called Pookie eats the socks and the brand replaces them. Just before, half had seen a dish soap ad with a
      tagline about today and half one about the future, an established way to nudge people towards near or distant thinking.

      Students then stated the most they would pay for a pair of socks in a prize draw that made their answers count, and
      completed a 15-item measure of how readily they credit animals and objects with minds and feelings, which psychologists
      call anthropomorphism.

      The prompts worked in opposite directions for different people. The authors reason that humanising a pet makes
      it feel close and concrete, so a message about the here and now fits that frame of mind, while people who keep animals
      at a distance respond better to the longer view. No human influencer appeared in this study: it shows how to word a
      pet's post, not whether a pet beats a person.

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["Pick two products to test", "List the products you plan to promote through creators this quarter. Choose two where an animal in the frame would feel natural or at least funny, and start there."]
  - ["Pick an animal that runs its own account", "Shortlist three animal accounts that post as the pet, not owners who share the odd dog photo. Read 20 recent sponsored posts on each and check that the comments sound warm, not suspicious."]
  - ["Read how your followers talk about pets", "Scroll through 50 comments on animal posts in your niche. If people call pets babies or give them thoughts and moods, plan captions about today. If the tone is cooler, try a line about what the product will do over time."]
  - ["Write the caption in the pet's voice", "Let the pet speak in the first person about what it is doing right now, in two short sentences. Give it a name and one habit, and keep the paid-partnership label in plain view."]
  - ["Run a pet against a person", "Launch the same post twice for a week, giving both the same budget per day: once with the pet and once with a human creator or just human hands. Compare cost per engagement and clicks to your page, not likes."]
  - ["Ask whether it felt genuine", "Poll 100 people who saw each version with one question: how honest did this post feel, from 1 to 7? If the pet scores no higher than your human creators, move the budget back."]

expect:
  - "**Small rates, even when they triple.** The winning field ad still drew fewer than one engagement for every 1,000 people it reached."
  - "**Cheaper page engagement.** With equal daily spend, each engagement with the brand's page cost about nine times as much from the human version as from the dog's."
  - "**Sincerity is the asset to protect.** The advantage held only while people saw the pet as genuine. It is our inference that a post which feels staged or over-produced could lose it."
  - "**Fewer scandals, more control.** The authors argue that pets cost less, rarely land in scandals and leave the brand more say over content. Those points rest on industry reports they cite, not on their own data."

limits:
  - "**Posts made for the research.** Every post was built for the studies, with two pets credited in the acknowledgements playing the part. No real petfluencer's bond with followers was tested."
  - "**A short, small field test.** The Instagram ads ran for four days for one brand and produced 24 post engagements in total."
  - "**Mostly stated prices.** In the two wine experiments, prices were hypothetical answers. Only the sock study tied answers to a real prize draw, and it used students."
  - "**Products with no link to pets.** Wine and socks bear no relation to animals. Whether a closer fit helps a pet or hurts it was not tested."
  - "**No owner, and no framing test for people.** Owners never appeared in the posts, and the today-or-future wording was tried only with a pet."

faq:
  - q: "Do pets make better brand endorsers than people on social media?"
    a: "They did in these tests. Across a live ad test and two experiments, sponsored posts from a pet earned more engagement and higher offered prices than matching posts from a person (Lavertu et al., 2025). The authors stress that human creators can still be effective and remain the mainstream choice."
  - q: "What is a petfluencer?"
    a: "An animal that has a dedicated account and a large audience of its own, and may be paid to endorse brands. The account can appear to be run by the pet or openly by its owner, but it centres on the animal. A pet that only appears on its owner's personal feed is not one."
  - q: "Why do pets seem more sincere than human creators?"
    a: "People do not imagine an animal praising a product for money or lying about it. Earlier research the authors draw on shows animals are widely seen as unable to deceive, which sidesteps the suspicion many followers now feel towards paid human posts."
  - q: "Does the product have to be for pets?"
    a: "Not in these studies. A cat lifted what people would pay for wine, and the final study used a pet to promote socks. Peanut butter, the field test product, suits dogs and people alike. Whether a closer match between animal and product adds anything was left for future work."
  - q: "Should the owner appear alongside the pet?"
    a: "Nobody knows yet, because the posts never showed the owner. The authors suggest an owner might borrow some of the pet's sincerity and make the post stronger, and they flag it as an open question."

also:
  - doi: "10.1108/ejm-03-2022-0191"
    title: "Effect of pre-roll ad choice on brand attitude and attitude toward the viewing experience"
    authors: "Newton, Newton, Wong, & Tsarenko"
    journal: "European Journal of Marketing"
    year: 2025
    text: >-
      Three experiments let some viewers pick which pre-roll ad to watch before the content they came for, first as an
      illusion of choice and then as a real one. Choosing improved attitudes towards the advertised brand and the viewing
      experience, but only when the options came from competing brands. It worked by making viewers feel empowered, a route
      that held for people who dislike online ads or had little interest in the category. For an audience that skips ads, a
      short menu may earn more goodwill than a forced spot.
  - doi: "10.1111/ijcs.70037"
    title: "Influencers and Consumer Financial Decision‐Making"
    authors: "Gerritsen & de Regt"
    journal: "International Journal of Consumer Studies"
    year: 2025
    text: >-
      A hand-collected set of 453 stock and cryptocurrency tips from 21 Dutch financial influencers showed a clear pattern. The
      creators tended to recommend assets that had just risen, and those assets typically lost value after the tip. The authors
      see crowd-following behind it and call for tighter oversight and more transparency. Any brand that partners with
      finance creators takes on their track record as well as their reach.

