short_answer: >-
  Yes, and for a reason almost nobody guesses. Across TikTok's first nine months of labelling and eight
  preregistered experiments, posts carrying an AI disclosure collected fewer likes at the same reach. It is not
  that people think the content is worse, and it is not a general dislike of AI. The label reads as a signal that
  the creator did not put much in, which weakens the one-sided bond viewers feel toward them, and people like
  posts by people they feel close to. Change the label to name a specific tool and the penalty disappears.

takeaways:
  - "Labelled posts received 7% to 8% fewer likes than the same creator's unlabelled posts at the same number of views."
  - "The penalty was worse on still images, at around 12%, than on video, at around 8%."
  - "Only about half the people in each experiment noticed the label at all. Among those who did, the effect was roughly twice as large."
  - "By the authors' own back-of-envelope sum, each extra percentage point of labelled posts costs TikTok about 382 million likes a month."

