title: "Does the \"Made with AI\" label hurt engagement? What a Journal of Consumer Research study found"
short_title: "The label does not read as artificial. It reads as lazy."
dek: >-
  A million TikTok posts and eight experiments agree that the label costs you likes. The reason is not what anyone
  assumed, and it points at a fix that costs nothing at all: change what the label says.

description: >-
  Posts carrying TikTok's AI label collected 7% to 8% fewer likes at the same reach. Not because people distrust
  AI. Because the label says the creator did not try.

keywords: [AI disclosure, Made with AI label, AI generated content, social media engagement, TikTok, content
  creators, parasocial connection, influencer marketing, platform policy, AI transparency, creator economy,
  Journal of Consumer Research]
topics: [AI, Social media, UGC]

