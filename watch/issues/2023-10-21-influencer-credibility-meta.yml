short_answer: >-
  Credibility first, then similarity and fit. Across 58 studies and 250 effect sizes, how believable an influencer
  seems had the closest links with attitudes toward the influencer, the content and the brand. For purchase intention,
  followers' feeling that the influencer is like them, and how well the influencer suits the brand, counted as much.
  Whether followers saw the content as advertising was only weakly linked to purchase intention and engagement. Platform, product type and
  region changed several links.

takeaways:
  - "Credibility showed the strongest link with attitudes in the review: a correlation of 0.73 with how people rated the influencer across 4 studies, where 1 would be a perfect match."
  - "Feeling that an influencer is like you tracked purchase intention more closely than expertise did: 0.51 across 11 studies, against 0.36 across 18."
  - "Trust counted for more with practical products. Its link with brand attitude was 0.74 for utilitarian products and 0.51 for hedonic, pleasure-led ones."
  - "Spotting a post as advertising was barely related to engagement: 0.06 across 7 studies, a value not statistically different from zero."

