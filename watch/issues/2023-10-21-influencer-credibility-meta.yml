title: "What makes a social media influencer persuasive? What a Psychology & Marketing study found"
dek: >-
  Follower counts and good looks are easy to see. A meta-analysis of 58 studies finds that believability tracks how
  followers feel most closely, that similarity and brand fit count as much for purchase intent, and that platform,
  product and region change several of these links.
short_title: "Credibility first: what drives influencer impact"

description: >-
  Han & Balabanis pool 250 effect sizes from 58 studies: credibility tracks attitudes most closely, while similarity
  and brand fit match it for purchase intent.

keywords: [influencer marketing, social media influencer credibility, influencer trustworthiness, influencer expertise,
  homophily, influencer-brand fit, parasocial interaction, source credibility theory, micro vs mega influencers,
  sponsored content disclosure, meta-analysis, Psychology & Marketing]
topics: [Influencers, Social media]

