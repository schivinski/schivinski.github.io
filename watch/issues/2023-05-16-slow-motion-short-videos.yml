short_answer: >-
  Often, yes. In six experiments and a field data set of 514 GIFs, slowed-down clips were liked more than the same
  clips at normal speed, because they felt easier to watch. The benefit came from footage full of complex movement and
  pleasant content, and it carried over to brands shown alongside. Slowing very simple motion or unpleasant scenes
  lowered liking, and viewers looking for excitement showed no gain.

takeaways:
  - "When two unfamiliar sportswear brands were shown beside basketball clips, 279 of 403 people (69.2%) picked a voucher for the brand paired with slow motion."
  - "Viewers of a hotel video that slowed down after its first 1.5 seconds would pay $152.70 a night on average, against $140.33 when it switched from slow to normal speed instead."
  - "Asked how they wanted to rewatch each clip, people chose slow motion for 2.73 of 4 pleasant clips but only 0.84 of 4 unpleasant ones."
  - "Zooming in strengthened the effect: close-cropped clips scored 4.62 slowed and 4.18 at normal speed (scale 1 to 7), while wide shots differed less (4.57 against 4.43)."

