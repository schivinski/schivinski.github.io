title: "Does slow motion make short-form videos and ads more appealing? What a Journal of Marketing Research study found"
dek: >-
  Slow motion is everywhere in reels, stories and GIFs. Seven studies, from online experiments to a sample of GIFs on a
  sharing site, show that it makes clips easier to watch and more likeable, and that brands benefit too, provided there is
  complex, pleasant movement to slow down.
short_title: "When slow motion makes a short video more appealing"

description: >-
  Stuppy et al. find slow motion makes short looping clips more liked and lifts brand choice, as long as the movement is
  complex and the content pleasant.

keywords: [slow motion video, short-form video, Instagram reels, TikTok video editing, video ad creative, GIF marketing,
  processing fluency, dynamic complexity, brand liking, willingness to pay, Journal of Marketing Research]
topics: [Creative, Social media, Advertising]

