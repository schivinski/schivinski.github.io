title: "Which delivery app failures cost the most stars, and why does blame make them worse? What a Journal of Service Research study found"
dek: >-
  Cancelled orders, codes that will not redeem, a help chat that goes nowhere. Years of app store reviews show that every hitch
  costs a delivery app some goodwill, and that the story customers tell themselves about the hitch can cost it far more.
short_title: "When customers blame the app, ratings sink further"

description: >-
  Amat-Lefort and Barnes find delivery app failures cost far more stars when customers see them as avoidable or recurring,
  across 222,371 US app reviews.

