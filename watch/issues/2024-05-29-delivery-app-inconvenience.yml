short_answer: >-
  Cancelled orders hurt most on their own, followed by poor customer support and late food. But across 222,371 Google Play
  reviews of four US delivery apps, the bigger story was blame. When reviewers wrote as if a problem kept happening, or as if
  the company could easily have prevented it, the same problem pulled the star rating down much harder. Customers judge the
  failure and the reason they give it.

takeaways:
  - "A cancelled order weighed on the rating roughly six times as heavily as a thin choice of restaurants, the mildest of the 12 problems tracked."
  - "Getting help from the platform, a stage the classic convenience model had no place for, filled about 9.5% of the average review, one of the three biggest themes."
  - "When reviewers described a driver problem as something that kept happening, its penalty grew by 426%, from 1.01 to 5.33."
  - "Blame mattered even more: a poor restaurant selection seen as the company's doing went from 0.57 to 7.01, a rise of 1,140%."

