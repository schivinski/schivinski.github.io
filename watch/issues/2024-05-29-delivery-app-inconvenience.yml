sections:
  - h: "What the researchers did"
    body: |
      Natalia Amat-Lefort of the Leiden Institute of Advanced Computer Science at Leiden University and Stuart J. Barnes of
      Newcastle University Business School asked why some hitches on a delivery app cost a star or two while others leave
      customers livid. Work on convenience has long treated a wasted minute as simply a wasted minute. They suspected the account a
      customer gives of the problem matters as well: will this happen again, and was it the company's fault?

      Rather than asking people to imagine a bad order, they went to what customers had already written. They gathered Google Play
      reviews of the four leading US meal delivery apps of the time, Uber Eats, DoorDash, Grubhub and Postmates, and kept the ones
      written in English and at least ten words long.

      To turn free text into numbers, they built word lists for each kind of problem and for each kind of explanation, then ran a
      keyword-assisted topic model, which scores how much of every review is about each theme. A statistical model made for ordered
      outcomes then linked those scores to whether the review was negative, neutral or positive. The figures below are that model's
      estimates of how hard each theme pulls a review towards a lower rating. Bigger means worse.
    facts:
      - ["Reviews", "222,371 English-language reviews posted on Google Play from 2010 to 2021"]
      - ["Selection", "Reviews the store ranked most relevant, usually those with the most thumbs-up from other users; duplicates and reviews under ten words removed"]
      - ["Mood of the data", "Average rating 2.62 stars; 35.7% of reviews gave a single star"]
      - ["Coding", "271 seed words across 14 hand-built dictionaries of 10 to 39 words each, used to steer the topic model"]
      - ["Outcome", "Star rating grouped as negative (1 or 2), neutral (3) or positive (4 or 5), with controls for app and year"]

  - h: "Which problems cost the most stars?"
    body: |
      Every one of the 12 problems dragged ratings down, but how often a problem came up said little about how much it hurt. Cold
      food and missing items were the most talked-about theme of all, filling about 9.6% of the average review, yet their pull on
      the rating was among the mildest. Cancellations took up about half as much space, 4.9%, and did far more damage.

      Late deliveries were both common, at about 9.3% of review content, and costly. Log-in trouble was rare, at about 2.6%, yet it
      hurt nearly as much as lateness. A dashboard that ranks complaints by volume alone could send a team to the wrong fix.

      At the light end sat a thin selection of restaurants, with missing app features and driver mix-ups not far above. Customers
      grumbled about these often, without marking the app down much for them.
    chart: damage

  - h: "A kind of inconvenience the old model missed"
    body: |
      The team sorted the problems into the five stages of a well-known convenience framework from 2002: deciding what to buy,
      getting into the service, paying, receiving what you paid for, and coming back for more. One large theme refused to fit.
      Reviewers spent many of their words on trying to reach someone, waiting for answers and chasing refunds.

      The authors called it remote support inconvenience: the time and effort it takes to get help from a platform through live
      chat, chatbots or outsourced call centres. Unlike the other five, it belongs to no single moment. It can strike before, during
      or after an order, whenever an order goes awry and help is slow to come.

      It also cost the app dearly, as the chart in the previous section shows. The authors note why platforms find this hard:
      customers turn to the app even when a restaurant or another partner caused the trouble, so the platform's help desk
      inherits other people's mistakes.

  - h: "Will it happen again, and whose fault is it?"
    body: |
      Attribution theory holds that after something goes wrong, people ask two quick questions. Is this a one-off, or the way
      things always are? And could the company have stopped it? The team built a word list for each, with terms such as "always",
      "repeated" and "recurring" for the first, and "deliberately", "careless" and "avoidable" for the second.

      Both explanations made every problem hurt more, and blame did more than recurrence. Averaged over the 12 problems, a sense
      that the trouble would keep coming back raised its penalty by about 244%. A sense that the firm was responsible raised it by
      about 537%.

      Recurrence weighed most on getting in and on getting the food at all: repeated log-in failures (7.52) and cancellations that
      kept happening (7.51) came out worst. Blame struck hardest where the company plainly holds the controls: glitches in the app,
      discount codes that fail and poor support, which reached 12.37 when reviewers saw it as avoidable.
    chart: blame

  - h: "What the authors would change"
    body: |
      Their first priority is support. Platforms should train agents and give them the means to solve problems well and kindly,
      and they should set clear rules for compensating cancelled and late orders that are fair and quick.

      Their second is to manage the explanation. To stop a fault from looking permanent, a platform should answer negative reviews
      promptly and show that the feedback is feeding a fix, above all for app errors, payment failures and log-in trouble. Where
      customers already hold the firm responsible, an apology and compensation should come with a plain account that the problem
      was not intended.

      Finally, they suggest that any service firm can run the same kind of text analysis on its own reviews, to learn which problems
      customers raise, how often they expect a repeat and how often they hold the firm to account.

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["Read your last 300 bad reviews", "Export every review of one or two stars from the past three months, from each app store you are listed in. Read 300 of them and put each under one stage: choosing, logging in, paying, receiving the order, reordering or getting help."]
  - ["Mark the words of blame and repetition", "Highlight phrases such as \"every time\", \"always\", \"again\", \"on purpose\" and \"should have\". Count how many reviews in each stage use them and put the counts in one table."]
  - ["Fix the faults people expect to repeat", "Pick the two problems that most often come with \"every time\" or \"always\". Put them at the top of the next product sprint, ahead of rarer one-off faults."]
  - ["Reply with the fix, not just sorry", "Answer every one- or two-star review within 24 hours. Say what went wrong, that it was not intended, and what is changing and by when. Keep it under 80 words and sign it with a first name."]
  - ["Let support settle it in one contact", "Allow every support agent to refund or credit a cancelled or very late order on the spot, with no manager sign-off. Aim to close these cases within a single chat or call."]
  - ["Recount the blame words every month", "On the first Monday of each month, count the blame and repetition phrases again for each stage. If a stage's count rises two months running, hand it to a named owner to fix."]

expect:
  - "**Explanation is a lever of its own.** If the pattern holds, a quick reply that shows what is being fixed could soften ratings before the fault itself is gone. That is our inference; replies were not tested."
  - "**A different priority list.** Ranking problems by the harm they do rather than by how loudly they are reported is likely to move some quiet faults up the queue and some noisy ones down."
  - "**A listening tool you can rerun.** The method works on reviews a firm already holds, so it can be repeated as new ones arrive. It does need someone at ease with text-analysis software to build and check the word lists."
  - "**Not every predicted pattern appeared.** The authors expected recurrence to bite hardest on delivery and access problems, and blame on payment and support problems. Formal comparisons backed both ideas only in part."

limits:
  - "**One sector, one country.** Every review came from US food delivery apps. Other regions and other services still need checking."
  - "**Reviewers are not all customers.** The sample favoured reviews that other users had voted helpful, and it leaned heavily towards complaints. People who never write a review are missing."
  - "**Stars as the only yardstick.** Satisfaction was read from the star rating alone; a second measure, such as the tone of the text, was not tried."
  - "**The largest effects sit at the extreme.** Recurrence and blame were scored as the share of a review given over to them. The headline increases describe a review entirely about those themes, whereas in the average review they filled about 5% and 2% of the content."
  - "**Associations, and no remedies tried.** The reviews were observed, not manipulated, so the links found here are not proof of cause and effect. Apologies, refunds and other recovery steps were not analysed either."

faq:
  - q: "What is service inconvenience?"
    a: "The feeling that a service has wasted your time or made you work harder than you should, through slow, clumsy or broken processes. It is one kind of service failure, and on a delivery app it ranges from a crashed checkout to a courier who ignores the delivery note."
  - q: "Why do customers punish an avoidable mistake so much more?"
    a: "Because blame changes what the problem means. In a large set of delivery app reviews, a failure the reviewer saw as within the company's control weighed far more on the rating than the same failure described plainly, and more than one described as recurring (Amat-Lefort & Barnes, 2026)."
  - q: "How can a company measure blame in its own reviews?"
    a: "Draw up a handful of words that signal each fault, plus words that signal a repeat, such as \"every time\", or blame, such as \"careless\". Topic-modelling software that accepts seed words then scores every review against those lists. The researchers drafted theirs in WordStat, ran the scoring with a tool called keyATM and related the scores to star ratings."
  - q: "Does this apply outside food delivery?"
    a: "It has not been tested. The approach may well carry over to other on-demand services such as ride hailing or grocery apps, but every review here came from US meal delivery apps, and the authors list other sectors and regions as the next step."

also:
  - doi: "10.1177/00222429241260687"
    title: "Self-Donations and Charitable Contributions in Online Crowdfunding: An Empirical Analysis"
    authors: "Liu et al."
    journal: "Journal of Marketing"
    year: 2025
    text: >-
      On an education crowdfunding site, teachers who put money into their own classroom appeals drew the next gift sooner,
      shortening the wait by about 15% across more than three million donations. The boost vanished when the teacher gave
      anonymously, which points to a credible sign of commitment rather than plain momentum. It mattered most early in a campaign
      and for teachers new to the platform. Putting your own money in first, where backers can see it, earns trust when advertising
      is off the table.
  - doi: "10.1108/ejm-05-2022-0366"
    title: "Conceptualizing ephemerality in online marketing communication for consumers and firms"
    authors: "Wakefield"
    journal: "European Journal of Marketing"
    year: 2024
    text: >-
      Messages built to vanish, such as stories and snaps, do different jobs from posts that stay up. This conceptual article argues
      that people send disappearing messages to share things that matter to a small circle, manage their mood, bond and keep
      things private, and seldom to shape their image or pass on useful information. For brands, it proposes that short-lived
      content suits frequent playful reminders, urgency and loyalty better than awareness, detailed facts or hard selling. The ideas
      still await data, so use them as a planning lens: the countdown offer goes in stories, the specifications stay on the
      permanent page.

