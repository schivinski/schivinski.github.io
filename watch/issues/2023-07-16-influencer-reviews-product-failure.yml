title: "Can an influencer's positive review lift the mood of a disappointed buyer? What an International Journal of Electronic Commerce study found"
dek: >-
  Influencer marketing is usually aimed at the moment before a sale. Four experiments with US residents find that after a
  product disappoints, a positive video review from a trusted influencer improves buyers' mood and their view of the
  product, unless the product has actually broken.
short_title: "Influencer reviews after a product lets buyers down"

description: >-
  Suri et al. find a positive influencer review lifts the mood of buyers let down by a product and curbs online
  complaints, unless the fault is severe.

keywords: [influencer marketing, influencer product reviews, product failure, post-purchase dissatisfaction,
  service recovery, negative word of mouth, influencer trustworthiness, failure severity, facial expression analysis,
  sentiment analysis, social contagion, International Journal of Electronic Commerce]
topics: [Influencers, Service]

