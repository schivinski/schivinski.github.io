short_answer: >-
  Yes, as long as the fault is minor. Across four online experiments, US residents imagined owning disappointing
  headphones. Those who then watched an influencer praise the same model wrote more positive reviews of it than those
  who saw him criticise it. Their mood and their opinion of the product improved, and they became less inclined to
  complain online. The lift depended on trusting the influencer and vanished when the headphones had broken.

takeaways:
  - "Reviews that participants wrote after the influencer's praise scored about 70 out of 100 for positive tone, against about 28 after his criticism."
  - "Praise raised opinions of the headphones from 1.85 to 2.77 out of 7; criticism lowered them from 1.82 to 1.55."
  - "Willingness to criticise the brand online fell from 3.91 to 3.51 out of 7 after a positive review, and edged up from 3.97 to 4.10 after a negative one."
  - "The influencer's verdict made a significant difference only for people who rated his trustworthiness at 2.91 or higher on a seven-point trust scale, which is below the scale's midpoint."

