title: "Do AI-made ads hurt a brand, and can a sense of purpose soften the blow? What an International Journal of Advertising study found"
dek: >-
  Learning that a campaign came out of an AI tool makes people think a little less of the brand behind it. Four experiments
  with 972 Americans show that a brand seen to put society ahead of profit can win most of that trust back.
short_title: "When AI ads cost trust, and how purpose wins it back"

description: >-
  Sands et al. find AI-made ads lower a brand's credibility, but a brand seen to lead for the greater good wins most of it
  back, in four US experiments.

keywords: [AI-generated ads, AI in advertising, AI aversion, generative AI advertising, brand credibility, brand attitude,
  leadership for the greater good, corporate purpose, responsible AI, AI disclosure, International Journal of Advertising]
topics: [AI, Advertising]

