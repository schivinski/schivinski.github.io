short_answer: >-
  A little, and purpose helps. In four online experiments with 972 US adults, people who read that a coffee brand's new
  campaign was made with AI judged the brand less credible and liked it less than people told a creative agency made it.
  When the brand was also described as putting the wider community ahead of profit, most of the credibility gap closed,
  and that goodwill carried through to intentions to buy.

takeaways:
  - "Learning that a campaign was AI-made cut the brand's credibility from 5.20 to 4.81 out of 7."
  - "A brand known for leading for the greater good closed about 70% of the credibility gap between its AI-made and agency-made campaigns."
  - "The same commitment did nothing for campaigns made by people: their credibility sat at about 5.2 with or without it."
  - "These are modest shifts: whether the work was AI-made explained only 2% to 6% of the differences in how people rated the brand."

