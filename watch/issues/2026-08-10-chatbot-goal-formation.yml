title: "Should a shopping chatbot guess what you want? What a Psychology & Marketing study found"
short_title: "When a smart chatbot is too smart"
dek: >-
  A chatbot that reads your browsing and jumps ahead is a gift when you know what you want. When you are still
  looking around, a lot of people would rather talk to the plain one.

description: >-
  Among shoppers still browsing, 80% chatted with a plain chatbot and only 51% with a personalized one. Shoppers with a clear goal reversed.

keywords: [chatbot personalization, AI chatbot marketing, personalized chatbot, customer journey, goal formation,
  consumer autonomy, browsing behaviour, e-commerce chatbot, decision stages, interdependent self, consumer
  control, Psychology & Marketing]
topics: [AI, Personalization, Service]

