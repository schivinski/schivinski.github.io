short_answer: >-
  Not always. Across five experiments, shoppers who were only looking around were less willing to use a chatbot that
  tailored itself to their behaviour than a plain one. With a clear goal, the preference reversed. The cause was a lost
  sense of being in charge, not privacy worry, and letting shoppers choose what the bot used removed the problem.

takeaways:
  - "Among browsers, 80% chatted with a low-personalization bot and 51% with a high-personalization one. Among shoppers with a goal, it flipped: 88% against 61%."
  - "Given a choice while browsing, 60% picked the low-personalization chatbot. With a purchase in mind, 77% picked the high-personalization one."
  - "While browsing, the personalized bot cut shoppers' felt freedom to decide from 5.78 to 4.96 out of 7. For buyers it barely moved."
  - "When shoppers could choose what information the bot used, intention to use it came back: 5.78 against 5.31 when the bot decided."

