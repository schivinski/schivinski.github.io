title: "Does a seamless omnichannel experience make a brand seem more authentic? What a Psychology & Marketing study found"
dek: >-
  A discount spotted on a brand's Instagram that the shop refuses to honour. An online order the store will not take back.
  Three experiments tested a brand whose channels work as one instead, and found shoppers judged it more genuine and grew
  keener to buy.
short_title: "One brand across every channel"

description: >-
  Massi et al. find a seamless omnichannel scenario made a sunscreen brand seem more authentic, lifting purchase intention
  from 3.42 to 4.77 out of 7.

keywords: [omnichannel retailing, seamless customer experience, channel integration, brand authenticity, multichannel versus
  omnichannel, click and collect, buy online return in store, cross-channel promotions, signaling theory, brand trust,
  purchase intention, Psychology & Marketing]
topics: [Retail, Service]

