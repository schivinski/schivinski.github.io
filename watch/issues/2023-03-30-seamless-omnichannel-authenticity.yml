short_answer: >-
  Yes, in these tests. People read about a visit to a sunscreen shop. When the staff honoured a discount from the brand's
  Instagram page and offered pickup, exchange and return in store for online orders, participants judged the brand more
  genuine and reported stronger intentions to purchase than those whose channels each kept separate rules. That sense of authenticity
  carried the effect on buying. The boost to authenticity was weaker among people who already distrusted the brand.

takeaways:
  - "Brand authenticity ratings rose from 3.34 to 4.58 when the store matched the Instagram offer and accepted online orders back."
  - "All 3 experiments, run in Canada, in Italy and with online workers, found higher willingness to buy under the seamless scenario."
  - "Among 107 online workers, the boost from a seamless experience was larger when the purchase started on Instagram and ended in the store than the other way round."
  - "In 20 interviews, shoppers linked joined-up channels with freedom, convenience and loyalty, and inconsistent ones with lower trust in the company."

