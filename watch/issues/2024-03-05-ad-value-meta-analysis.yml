short_answer: >-
  Mostly whether they believe it, enjoy it and learn something from it. Pooling 107 studies from 98 papers, this
  meta-analysis found those three qualities did most to make ads feel worthwhile, with believability narrowly ahead.
  Annoyance and personal relevance had far smaller direct effects. Ads seen as worthwhile were also better liked, which in
  turn went with plans to act. The weights shifted between in-app, text-message, web and social media ads.

takeaways:
  - "Seeing an ad as worthwhile and liking it moved together: at 0.70, this was the strongest pooled correlation in the review."
  - "Relevance worked mostly through the other qualities. Counting every route, its effect on liking an ad was 0.465, close to entertainment's 0.493 and nearly double believability's 0.240."
  - "On social media, liking an ad was the weakest guide to plans to act among the digital formats: 0.52, against 0.72 for in-app ads."
  - "The qualities feed each other: ads rated entertaining were also rated informative (a pooled correlation of 0.59), and informative ads were rated believable (0.58)."

