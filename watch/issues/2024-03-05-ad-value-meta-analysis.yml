title: "What makes people see an ad as worth their time? What a Journal of Advertising meta-analysis found"
dek: >-
  Marketers often blame annoyance when ads get ignored. A meta-analysis pooling 107 studies finds that whether people believe
  an ad, enjoy it and learn from it counts for far more, and that apps, feeds, text messages and websites weigh those
  qualities differently.
short_title: "Believable, fun, useful: what makes an ad worth it"

description: >-
  Ye et al. pool 107 studies on how people judge ads: believable, entertaining and informative ads feel worth the time,
  and in-app ads raise the stakes.

keywords: [advertising value, ad effectiveness, ad credibility, entertaining ads, informative advertising, ad irritation,
  personalised advertising, in-app advertising, social media advertising, mobile advertising, meta-analysis,
  Journal of Advertising]
topics: [Advertising, Social media, Personalization]

