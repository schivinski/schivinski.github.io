short_answer: >-
  Yes, though the average gain is small and comes mainly from ethnic minority audiences. Pooling 155 experiments from 21
  countries, the researchers found that ads with an ethnic minority endorser, rather than an ethnic majority one, drew
  clearly warmer responses from ethnic minority consumers, from liking the ad to wanting to buy. Majority consumers'
  attitudes and buying intentions did not change significantly. Country, era, celebrity casting and the brand itself
  all made the effect larger or smaller.

takeaways:
  - "Ethnic minority consumers responded more favourably on 8 of the 13 outcomes measured, including liking the ad, identifying with the endorser and intending to buy."
  - "For ethnic majority consumers, 11 of the 13 outcomes showed no significant change. The two exceptions came from thought-listing tasks, each based on just two experiments."
  - "Celebrities featured in only 65 of 1,019 persuasion results, yet they were the one ad feature that weakened the effect for every audience."
  - "Roughly 5% of the persuasion evidence, 51 results in all, came from ads shown online, so the evidence base is still mostly offline."

