title: "Does ethnic diversity in advertising work, and with which audiences? What a Journal of Marketing study found"
dek: >-
  Advertisers have long feared that casting an ethnic minority endorser wins one audience and loses another. A meta-analysis
  of more than five decades of experiments finds small average gains, clear ones among ethnic minority consumers, and no
  significant change in how majority consumers rate the ad or the brand.
short_title: "Ethnic diversity in ads: who responds, and by how much"

description: >-
  Eisend et al. pool 155 experiments across 21 countries: ethnic minority endorsers win over minority consumers and leave
  majority attitudes unchanged.

keywords: [ethnic diversity in advertising, multicultural marketing, inclusive advertising, diverse casting in ads,
  ethnic minority endorsers, representation in advertising, targeting without alienating, celebrity endorsers,
  cross-cultural advertising, advertising effectiveness, meta-analysis, Journal of Marketing]
topics: [Advertising, Creative]

