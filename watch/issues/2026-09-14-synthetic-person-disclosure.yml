  alt: "AI-generated beauty portrait of a woman with long dark hair against a deep teal studio background, warm light on her skin, looking straight at the camera"
  caption: "Not a real person. This image was generated with AI for this issue, which is rather the point."

short_answer: >-
  It helps less than you would hope. Across 606 people shown a brand's Instagram post, trust fell in every group once
  they were told the model in the picture was generated. The tag brands actually use, a bare mention of AI, changed nothing. The fuller
  label, the one naming the person as somebody who does not exist, set off two forces that almost cancel each other.
  It softened the suspicion that the brand was pulling a trick, which protected trust, and it made the image feel
  more artificial, which cost about as much. Only among younger viewers did the protective side win.

takeaways:
  - "Trust fell in all three groups once the AI origin was revealed, from 3.78 to 3.05 with no label and from 3.41 to 2.93 with the fullest one."
  - "The short tag most platforms ask for made no measurable difference to how far trust fell."
  - "The detailed label cut the sense of being manipulated, worth 0.19 points of protected trust, and raised the sense of artificiality, costing 0.16."
  - "The protective half worked only for younger viewers. Among older ones the effect on perceived manipulation was not significant."

