    title: "Introducing the special issue on influencer marketing with extension into synthetic word of mouth: How AI shapes the future of influencer marketing"
    authors: "Haenlein, M., Kannan, P. K., Muller, E., & Wahid, R."
    journal: "Journal of the Academy of Marketing Science"
    year: 2026
    text: >-
      A framework paper for what the authors call synthetic word of mouth, meaning recommendation in which a machine
      has a hand in writing, carrying, judging or acting on the message. Their useful contribution is degree of
      syntheticity, broken into narrative, voice, appearance and consumption. It gives a vocabulary for the thing
      everyone is now buying without a name for it.
  - doi: "10.1177/10949968261487442"
    title: "The AI-driven scam economy: Persuasion knowledge, consumer vulnerability, and empowerment"
    authors: "Hermann, E., Trieb, A., Puntoni, S., Schweidel, D., & Wilbur, K."
    journal: "Journal of Interactive Marketing"
    year: 2026
    text: >-
      Online scams are recast here as malicious persuasion, with AI supplying the simplicity, the sophistication and
      the scale. The authors argue that regulation alone cannot keep up, and that consumers need practical ability
      to recognise and resist these attempts, report what happens to them and recover afterwards. Worth reading
      beside anything your own brand is doing with synthetic media.

