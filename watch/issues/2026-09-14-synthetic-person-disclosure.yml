title: "Should an AI model be labelled as a person who does not exist? What a Journal of Marketing Communications study found"
short_title: "The label that buys honesty, then spends it on artificiality"
dek: >-
  Brands are filling their feeds with people who were never born. This study followed what trust does once the
  audience finds out, and whether saying so up front softens the blow.
description: >-
  A detailed "this person does not exist" label cut the sense of being manipulated and raised the sense of
  artificiality. The two effects cancelled out, except among younger viewers.
keywords: [AI-generated models, synthetic influencers, AI disclosure, advertising transparency, consumer trust,
  persuasion knowledge, perceived manipulative intent, syntheticness, Instagram advertising, virtual models,
  generative AI in advertising, Journal of Marketing Communications]
topics: [AI, Advertising, Social media]

