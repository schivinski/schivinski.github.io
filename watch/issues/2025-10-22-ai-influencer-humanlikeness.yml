short_answer: >-
  Not because of their looks. Across two online experiments involving 957 young US women, AI influencers whose posts
  revealed fears, doubts and hopes were credited with more of a mind, and that sense of a mind made them seem more human
  and less eerie. A realistic face made a character look human but left eeriness unchanged. The more human she felt, the
  readier women were to open up to her, take her advice and like the brand behind her.

takeaways:
  - "In the first experiment, posts about identity, doubts and fears lifted the sense that the AI character had feelings and could plan by about 16% (2.95 against 2.54 out of 7)."
  - "A realistic photo doubled how human the character looked next to a cartoon-filtered version, a jump of 2.3 points out of 7. Even so, she seemed neither more nor less eerie."
  - "Seeming to have a mind did close to 4 times as much as appearance to make the influencer feel human."
  - "On all 3 outcomes, the lift from seeming human outweighed the drag from seeming eerie, by between 1.5 and 2.2 times."

