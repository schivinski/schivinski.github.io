title: "Do lifelike AI influencers put followers off, and what makes them feel human? What a Journal of Consumer Behaviour study found"
dek: >-
  The temptation with a virtual creator is to keep polishing her face. Two experiments with 957 young American women point
  somewhere else: posts in which the character admits doubts and feelings convince people there is someone in there, and
  that is what wins followers over, for her and for the brands she promotes.
short_title: "Why an AI influencer's inner life beats a perfect face"

description: >-
  Kim and Im find AI influencers who reveal fears and doubts feel more human and less creepy, while a lifelike face adds
  little, in two tests with 957 US women.

keywords: [AI influencers, virtual influencers, AI influencer marketing, uncanny valley, humanlike AI, anthropomorphism,
  influencer self-disclosure, eeriness, virtual creator brand endorsement, CGI influencers on Instagram, Journal of Consumer Behaviour]
