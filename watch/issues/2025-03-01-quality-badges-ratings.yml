short_answer: >-
  It can. Across more than 1.5 million Airbnb ratings, the same home scored slightly lower while it carried the Superhost
  badge and recovered after losing it, while its ratings on Vrbo, which shows no badge, did not move with it. In online
  experiments the badge alone lowered ratings of an identical stay, and most people then picked a higher-rated listing
  without the badge over a badged one, so the lost stars outweighed the badge's pull.

takeaways:
  - "While a home held the badge, its average fell by about 0.04 stars: small on paper, but a fifth of the gap between a typical 4.8 and a perfect 5."
  - "Losing the badge brought a rebound in ratings more than 2 times the size of the dip that came with winning it."
  - "In an experiment with 502 people, the very same so-so stay earned an average of 2.96 stars when the property was described as a Superhost and 3.19 when it was not."
  - "Experience did not protect shoppers: among participants who stay on Airbnb and with Superhosts more often than most, 54% still chose the higher-rated home without the badge, against 39% for the badged listing."

