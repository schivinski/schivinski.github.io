title: "Does a quality badge lower your star ratings? What a Journal of Consumer Research study found"
dek: >-
  Platforms hand out badges to flag their best hosts and sellers, and the badges do bring in customers. Eighteen months
  of Airbnb data and three experiments show a hidden cost: badged listings get rated more harshly, and shoppers then
  follow the stars.
short_title: "Why a quality badge can cost you stars"

description: >-
  Meister and Reinholtz find Airbnb homes are rated lower while they hold the Superhost badge, and most shoppers then
  choose a higher-rated rival with no badge.

keywords: [quality badges, platform certifications, Superhost badge, star ratings, online ratings, user-generated ratings,
  customer expectations, marketplace design, top rated seller, review management, Journal of Consumer Research]
topics: [UGC, Service]

