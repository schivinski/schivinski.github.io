title: "Does an ad icon help young viewers spot sponsored influencer videos? What an International Journal of Advertising study found"
dek: >-
  Young people helped three Dutch researchers create advertising pictograms, then liked the results and linked them to
  sponsored content. Placed in real YouTube videos, the icons went largely unnoticed and changed nothing in how young
  viewers judged the advertising.
short_title: "Why ad icons in creator videos went unnoticed"

description: >-
  Boerman et al. find that ad icons designed with young people went largely unnoticed in YouTube videos and did not help
  656 Dutch minors recognise advertising.

keywords: [influencer marketing disclosure, sponsored content disclosure, advertising pictogram, "#ad label",
  ad disclosure icon, advertising literacy, children and teenagers online, sponsored YouTube videos, persuasion knowledge,
  Audiovisual Media Services Directive, Kijkwijzer, International Journal of Advertising]
topics: [Influencers, Advertising]

