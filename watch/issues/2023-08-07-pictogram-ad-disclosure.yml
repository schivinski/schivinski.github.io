short_answer: >-
  Not in the form tested. Dutch researchers developed advertising pictograms with input from young people, then tested
  three of them in sponsored YouTube videos watched by 656 viewers aged 8 to 18, each icon shown in a corner for 10
  seconds. Compared with no icon, none improved recognition of the advertising, understanding of what the video was for,
  or critical feelings about the brand's presence. Most viewers did not even remember seeing the icon.

takeaways:
  - "Recall of the icon was low. Of viewers shown each one, 23.9% remembered seeing the #AD pictogram, 8.5% the megaphone version and 4.2% the drawing of an influencer."
  - "Scepticism about the brand's place in the video averaged 2.66 out of 6 with no icon and between 2.54 and 2.78 with one, so the icons did not make viewers more critical."
  - "In the survey, 85.1% of young people said they had seen advertising in online videos, yet only a third (33.3%) of the usable examples they gave actually described influencer marketing."
  - "Young people matched #AD to the word 'advertisement' (51%), but only 10% matched it to 'paid partnership', where the influencer drawing led with 42%."

