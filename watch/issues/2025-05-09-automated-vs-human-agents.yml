title: "Can robots, chatbots and algorithms stand in for your employees? What a Journal of Marketing study found"
dek: >-
  Ask customers and many will say they would rather deal with a person. A meta-analysis of hundreds of experiments shows their
  words and their actions part ways, and that each kind of machine needs its own conditions to keep up with staff.
short_title: "When a machine can stand in for your staff"

description: >-
  Gelbrich et al. pool 327 experiments: customers rate robots, chatbots and algorithms a little below human staff, yet choose and
  buy from them about as often.

keywords: [automated agents, service robots, chatbots vs human agents, algorithms in customer service, AI customer service,
  algorithm aversion, chatbot avatar design, naming a chatbot, robots in retail and hospitality, meta-analysis, Journal of Marketing]
topics: [AI, Service]

