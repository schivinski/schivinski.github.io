short_answer: >-
  Often, yes, if you judge by what customers do. Pooling 327 experiments, the research team found that people rate automated agents a
  little below human employees, mostly as less humanlike and less warm, yet their choices and purchases barely differ. Success
  depends on the machine: a name helps robots and chatbots, chatbots shine with embarrassing purchases, and algorithms falter when
  a choice is about pleasure or needs an expert.

takeaways:
  - "Robots took the widest gap in the data on seeming humanlike: 0.64 below human staff, where 0 would mean customers saw no difference."
  - "Chatbots handling embarrassing purchases came out ahead of people by a predicted 0.28, the clearest win for any machine in the analysis."
  - "Algorithms almost matched staff on functional purchases, trailing by just 0.08, but fell 0.39 behind when the purchase was about pleasure."
  - "Bad news travels well by machine: with an unfavourable outcome, robots trailed staff by only 0.05 and algorithms by 0.01."

