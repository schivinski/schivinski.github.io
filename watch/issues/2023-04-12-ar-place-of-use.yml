title: "Does it matter where shoppers use an augmented reality app? What a Psychology & Marketing study found"
dek: >-
  Furniture and homeware apps let people drop a virtual product into a room through their phone. Two German field studies,
  one with a sofa and one with a kettle, show that the setting changes how the product is judged, though not as the
  researchers predicted.
short_title: "Where shoppers use AR changes what they see"

description: >-
  von der Au et al. show a virtual sofa or kettle viewed in its usual room seems more plausible but less present, across
  two German field studies with 344 people.

keywords: [augmented reality marketing, AR shopping apps, place of use, context in augmented reality, local presence,
  plausibility, virtual furniture app, perceived tangibility, utilitarian benefits, expected usage congruence,
  purchase intention, Psychology & Marketing]
topics: [Retail, Advertising]

