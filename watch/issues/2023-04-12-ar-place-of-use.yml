short_answer: >-
  Yes, in two different ways. In two German field studies, people who viewed a sofa or a kettle through an AR app in
  the room where that product normally belongs judged the scene more plausible, yet felt less that the object was
  physically there. Both judgements affected people's views of the product, and among students viewing the sofa, the
  feeling of presence was the stronger link to wanting to buy it.

takeaways:
  - "The 42 students who tried a virtual sofa in their dorm rooms found it more plausible, but felt it less present, than the 38 who tried it elsewhere on campus."
  - "Plausibility and the sense of presence together accounted for about two-thirds (66%) of the variation in the students' intention to buy the sofa."
  - "Presence carried about 1.7 times the weight of plausibility in that link to buying intention."
  - "The setting itself made a modest difference: it explained 13% of the spread in plausibility among the students and 2% among the 264 iPhone owners who tried a kettle."

