title: "Do playlists boost a song's streams, and which ones work best? What a Journal of Marketing study found"
dek: >-
  Labels can no longer compete on price or shelf space when listeners pay one fee for everything, so they chase playlist
  spots instead. Three years of global streaming data show what a spot is worth, and which placements leave listeners
  still playing the song after it has gone.
short_title: "What a playlist spot is really worth to a song"

description: >-
  Wlömert et al. find a curated playlist lifts a song's daily streams 8.5% while listed and 4% after removal, across
  200,455 listings on 23,721 playlists.

keywords: [playlist marketing, curated playlists, music streaming, playlist pitching, music discovery, streaming revenue,
  song promotion, record label marketing, content curation, digital music marketing, Journal of Marketing]
topics: [Retail, Influencers]

