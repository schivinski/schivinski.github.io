short_answer: >-
  Yes, and the right placement matters far more than the average suggests. In 200,455 cases where a single curated
  playlist added a song and later dropped it, the song's daily global streams rose 8.5% while it was listed and stayed
  4% above their earlier level after removal. Large playlists, a slot in the first ten and songs few listeners already
  knew produced the biggest gains.

takeaways:
  - "By the authors' estimate, a spot on one of the largest playlists earned an average song about $1,997 in extra streaming income over 90 days on the list and 90 days after, against $77 on one of the smallest."
  - "Songs that had reached few playlist followers before gained 14.6% in streams while listed, against 3.4% for songs already in front of large playlist audiences."
  - "A place among a playlist's first ten tracks lifted streams by 13.4% during the listing, against 8.0% further down, and the edge held after removal (6.7% against 3.7%)."
  - "Playlists run by the streaming platform gave the biggest lift while a song was on them (10.4%) but the smallest once it came off (2.1%, against 4.0% for lists run by the song's own label)."

