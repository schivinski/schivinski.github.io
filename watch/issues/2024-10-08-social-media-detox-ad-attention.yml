short_answer: >-
  Yes, but only after a real break. German students wore eye-tracking glasses while scrolling their own Instagram feeds,
  real ads included. Students who had stayed off every social platform since getting up gave each ad a clearly shorter
  look than students who had used social media as normal. Capping a visit at one minute, the lighter kind of detox, made
  no difference, either in a lab or in a university library.

takeaways:
  - "Students back on Instagram after keeping off social media since waking looked at each ad for 0.85 seconds on average, against 1.35 seconds for students who had not taken a break."
  - "Capping each visit at one minute changed nothing in the lab: ads drew 1.08 seconds of looking with the timer running and 1.04 seconds without it."
  - "Ads arrive early in a visit: students met 3.7 different ads in their first minute of scrolling, out of 4.7 across a whole session."
  - "A few hours off was enough to show the effect. Students in the time-out groups had stayed away from every social platform for at least 3 hours before they picked up their phones."

