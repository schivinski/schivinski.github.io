title: "Do people pay less attention to social media ads after a social media detox? What an International Journal of Advertising study found"
dek: >-
  More and more people step away from their feeds for hours at a time, sometimes for days. Eye-tracking glasses worn by
  German students as they browsed their personal Instagram feeds show that ads met just after such a break get a much
  shorter look, while a one-minute cap on the session changes nothing.
short_title: "Why feed ads get less of a look after a detox"

description: >-
  Kopka et al. find Instagram ads seen just after a social media break got about a third less looking time, while a
  one-minute session cap made no difference.

keywords: [social media detox, digital detox, attention to ads, eye tracking, Instagram advertising, ad timing,
  social media time-outs, screen time limits, gaze duration, fear of missing out, International Journal of Advertising]
topics: [Social media, Advertising]

