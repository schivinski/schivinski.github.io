short_answer: >-
  Most people find a way around it, and a minority switch. Among 56 Indian millennials interviewed, accent failures led
  people to type instead, repeat or rephrase, or hand the command to someone the assistant understood better. Failing in
  front of colleagues or guests caused the most discomfort. In a survey of 298 users, people's reactions were linked to
  their intention to keep using the assistant, but none predicted plans to stop.

takeaways:
  - "Accent mix-ups were not only a source of irritation: 37 of the 56 interviewees (66%) spoke of excitement at an assistant that was still learning, while 19 (34%) got frustrated and 9 (16%) felt ashamed."
  - "Other people often spoke for them: 21 interviewees said their children gave voice commands for them at home, and 6 said a colleague could step in at work when it mattered."
  - "Ten of the 56 interviewees had given up on one assistant and bought a different one."
  - "Across the 298 survey respondents, the three kinds of reaction together explained 78% of the differences in plans to carry on with the assistant, against 1% for plans to stop."

