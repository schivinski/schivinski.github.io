title: "What happens when a voice assistant cannot understand a customer's accent? What a Journal of Consumer Behaviour study found"
dek: >-
  Voice assistants are trained on languages, but people speak those languages with many accents. Interviews with 56 Indian
  millennials and a 298-person survey show how people cope when an assistant fails them, and how embarrassment in front
  of others can lead some to switch.
short_title: "When voice assistants miss an accent"

description: >-
  Sattarapu et al. find Indian users type, rephrase or ask family when voice assistants miss their accent, and some
  switch: 56 interviews, 298 surveyed.

keywords: [voice assistants, accents, speech recognition, voice search, voice user experience, conversational AI,
  Alexa and Siri, customer service chatbots, localisation, continuance intention, Journal of Consumer Behaviour]
topics: [AI, Service, Search]

