short_answer: >-
  It can, though mostly on one side. In six US studies, Republicans were more willing than Democrats to pass on
  one-sided political claims of doubtful accuracy, but chiefly when the topic or its wording cast the parties as enemies.
  When the same material stressed cooperation, the two groups behaved alike. Conflict seemed to stir a wish to see one's
  own side on top, and that wish, more than party label alone, drove the sharing.

takeaways:
  - "After a feed of seven combative political news stories, Republicans put their chance of making posts like the slanted ones at 2.53, where 7 meant extremely likely, while Democrats sat at 1.80. After a cooperative feed the two sides were statistically level, at 2.03 and 2.18."
  - "On topics that split the parties, statements by Republican public figures averaged 3.62 for falsehood against 2.98 for Democrats. Where the parties broadly agreed, the gap (3.11 against 2.85) did not hold up statistically."
  - "Over the longer record, claims from Republicans were rated less accurate overall (3.59 against 2.94), and the gap only closed in months when conflict in the news had dropped by roughly two-thirds from the month before."
  - "In campaign speeches, Republican presidents used about 13 more upbeat words alongside 'we', 'us' and 'our' than Democratic presidents did. In their other speeches the Democrats were about 4 words ahead."

