title: "Does political polarisation make people spread misinformation? What a Journal of Marketing study found"
dek: >-
  Conservatives get much of the blame for political falsehoods online. Fact-check records, three online experiments and
  nearly a century of presidential speeches point to a trigger in the setting: cast politics as a fight, and conservatives grow
  keener to share slanted claims that help their own side.
short_title: "How fight framing feeds slanted political posts"

description: >-
  Zhu and Pechmann find US conservatives were keener than liberals to share slanted, doubtful political posts, but
  mainly when news cast the parties as rivals.

keywords: [misinformation, political polarization, fake news sharing, conflict framing, news headlines, social media
  newsfeeds, political ideology, conservatives and liberals, fact-checking, media literacy, Journal of Marketing]
topics: [Social media, UGC]

