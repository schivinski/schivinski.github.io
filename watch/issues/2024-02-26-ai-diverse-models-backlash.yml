short_answer: >-
  They can. Across four experiments run online with 952 people, LGBTQIA+ adults and adults with disabilities read
  about a fashion label planning to generate diverse models by computer instead of booking them. They suspected the
  brand would stereotype them, felt less that they belonged, and liked it less. Framing inclusion as a matter of
  principle, not profit, softened that reaction only slightly.

takeaways:
  - "Among LGBTQIA+ readers, liking for the brand fell by about 29%, from 5.37 to 3.79 where 7 is the top score, when its new models were to be made by AI instead of booked through an agency."
  - "With real models, LGBTQIA+ readers rated the brand 0.87 points higher than heterosexual white men did; with AI-made models the gap shrank to 0.14 points, too small to count."
  - "Hearing the models would be AI-made raised people's suspicion of being stereotyped by the brand by 1.05 points out of seven, for LGBTQIA+ people and for people with disabilities alike."
  - "When the label called diversity the right thing to do rather than good for profit, that worry came out 0.53 points lower, which lifted belonging and, through it, liking."

