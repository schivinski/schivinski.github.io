title: "Do AI-generated diverse models put off the people they are meant to represent? What a Psychology & Marketing study found"
dek: >-
  Fashion labels can now generate a model of any body, skin tone or identity in minutes. Four experiments show that the
  communities those models stand in for can read the move as a slight, and that a well-chosen reason only partly repairs it.
short_title: "Why AI-made diverse models can backfire"

description: >-
  Sands et al. find a fashion brand's plan to make LGBTQIA+ models with AI, rather than hire them, cut LGBTQIA+ people's
  liking for the brand by about 29%.

keywords: [AI-generated models, AI fashion models, diversity in advertising, inclusive marketing, LGBTQIA+ marketing,
  disability representation, authenticity in advertising, sense of belonging, social identity threat, brand motives,
  Psychology & Marketing]
topics: [AI, Advertising, Creative]

