short_answer: >-
  No, not in this survey. Among 315 Instagram users living in Sweden, those more worried that their personal data could be
  misused said they used the app more, not less. Worry did not even dent their faith in the platform: the more concerned
  they were, the more they trusted it. It was a single survey, so it shows which feelings travel together, not
  whether worry causes the scrolling.

takeaways:
  - "Of the 7 links the team predicted, 5 came out the other way round, and a sixth, from tiredness to use, did not show up at all."
  - "Concern about data and feeling worn out by the app rose together: their link weighed 0.41, on a scale where zero means no link."
  - "People who did more to shield their data were heavier users (weight 0.23), yet the more anxious users reported doing less of it (minus 0.44)."
  - "Older respondents were less concerned about their data (minus 0.63); age showed no dependable link with trust, tiredness or use."

