sections:
  - h: "What the researchers did"
    body: |
      Nicole Lumare and Lusine Muradyan, master's students in marketing at Linnaeus University in Växjö, Sweden, and Clarinda
      Jansberg, an associate professor at the same university's Kalmar campus, took on a tension every social media marketer
      lives with. Platforms run on personal data and ad targeting depends on it, yet more and more users feel uneasy about
      where that data ends up.

      Earlier studies had looked at these links one or two at a time: worry and trust, worry and tiredness, worry and the
      precautions users take. The team wanted all of them in one picture, linked to how much people actually use the app. They
      chose Instagram, which had about 5.85 million users in Sweden in 2023, many of them under 40.

      People were asked how concerned they were that what they share could be misused or leaked, how far they trusted
      Instagram, how drained it left them, what they did to keep their details private, and how heavily they used the app. The model
      gives each link a weight. Zero means no link, and the further a weight sits from zero, the stronger the link. A minus
      sign means one goes down as the other goes up.
    facts:
      - ["Who", "315 active Instagram users resident in Sweden; the survey aimed at ages 18 to 40"]
      - ["How", "An online questionnaire in English, run in October 2023 and shared by email and in Instagram posts"]
      - ["Sample", "166 men, 148 women and one person of another gender; 126 lived in Stockholm"]
      - ["Measured", "Privacy concern, trust in Instagram, tiredness from using it and protective habits, five statements each on five-point agreement scales; use of the app on a seven-point frequency scale"]
      - ["Analysis", "A structural equation model, which estimates every link between these measures at the same time"]

  - h: "Worried, and still scrolling"
    body: |
      The central result is the one the team least expected. They had predicted that people who fret about their data would
      pull back from Instagram. Instead, the more concerned someone was, the more they said they used it.

      To the authors, this is a fresh case of the privacy paradox. Instagram is handy and easy to use, friends are on it, and
      dropping out has a social cost, so concern gets weighed against all of that and usually loses. They also point to habit
      and the fear of missing out: people can feel worn out by the feed and still keep opening it. That is what the tiredness
      results suggest. Being tired of the app had no dependable bearing on how much people used it. Women may have felt a
      little more drained than men, but that gap was not reliable either.
    chart: links

  - h: "Trust and protection ran the wrong way round"
    body: |
      Two more results turn the usual story upside down. Concerned users were more likely, not less, to agree that Instagram
      treats them fairly and acts in their interest. And those who trusted it more used it slightly less, with a small negative
      weight of 0.14.

      Protective habits behaved just as oddly. The team expected worried users to guard their details more closely. In this
      group they took fewer precautions, while those who did take them were the keener users. The authors explain
      this with a sense of control: once someone has changed a setting or held back a detail, they feel safe enough to carry
      on, even if their data is no safer than before. Our own caution is that every result involving use leans on the
      shakiest measure in the model, which the limits below explain.

  - h: "Younger users worry most"
    body: |
      Why would younger people worry more? The authors suggest that Generation Z, more
      practised online and more aware of how data gets used, frets more than millennials do. Rather than logging off, they
      may handle it with tactics such as disappearing stories or anonymous accounts.

      Keep in mind who answered. Four in five sat in the two youngest bands, 18 to 25 and 25 to 30, so the comparison with
      older users rests on a small group: 61 people aged 30 to 40.
    chart: ages

  - h: "What the authors want marketers to change"
    body: |
      Their advice centres on openness and choice. Brands should be clear about what data they use and why, and cut back on
      intrusive ads, which in their view breed much of the distrust and fatigue. Letting people pick which kinds of ads
      they see, and how often, is one route. Short campaigns that show users where the privacy controls are, and how to work
      them, are another.

      They also look further ahead: to AI that analyses data in anonymised form, so content can still be tailored, and to
      blockchain-based storage that gives users more say over their records. The survey itself checked none of this.
      It is advice built on what the results suggest about users who stay loyal while they worry.

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["List the data your social posts collect", "List each kind of personal data your social media activity gathers, from competition entries and lead forms to tracking pixels. Beside every item, add the reason you need it. Drop at least one you cannot justify."]
  - ["Write a three-sentence privacy note", "In three sentences at most, explain what data you gather, what it is for and how people can turn it off. Read it to someone outside marketing. If they cannot repeat it back, make it simpler."]
  - ["Let followers choose how often they hear from you", "Add a choice of frequency, such as weekly or monthly, and a choice of topics to every sign-up form and preference page. Offer at least two options for each."]
  - ["Cap repeat ads", "Set a frequency cap of three showings per person per week in your ad manager. Rotate at least three versions of each ad so nobody sees the same one again and again."]
  - ["Show people where the settings are", "Once a quarter, post a short video, no longer than 30 seconds, showing followers where to find their privacy and ad settings. Pin it to the top of your profile for a week."]
  - ["Ask about worry and tiredness twice a year", "Every six months, add two questions to a follower poll: how worried are you about your data, and how tired are you of your feed? Read the answers next to your engagement figures, because heavy use can hide both."]

expect:
  - "**Concern does not show up as churn.** Uneasy followers seem unlikely to drift away over privacy alone, so steady engagement is no proof that they are relaxed about their data."
  - "**Fatigue stays out of the dashboard.** Feeling drained did not cut use, so it will not appear in reach or time spent. The only way to see it is to ask."
  - "**Control tools are unlikely to backfire.** On this evidence, making privacy settings easy to find should not cost you active users, though nothing here shows it will win new ones."
  - "**Some work up front.** Plain notices, ad controls and settings guides take time to write and keep current, and the authors' suggestions remain untested."

limits:
  - "**Links, not causes.** A single questionnaire, answered once, shows which answers rise together. Heavy users may share more and so have more to worry about, rather than worry driving use. That reading is ours."
  - "**One app, one country.** Only Instagram users in Sweden took part, and Swedish data protection rules are strict. The authors expect other platforms and countries to give different results."
  - "**A self-selected, young group.** People found the questionnaire through email or Instagram posts, so they are not a random cross-section of users, and older users are thinly represented."
  - "**Self-reported habits.** Time on the app and how often people post came from their own estimates, not from app data."
  - "**A loose usage score.** The usage measure combined five rather different questions, from how often people open the app to whether they post photos when travelling, and in the paper's measurement table those items barely moved together. Answers ran from 1 for always to 7 for never; whether that scale was reversed before the analysis is not stated. Results that involve use deserve the most caution."

faq:
  - q: "Do people use social media less when they worry about privacy?"
    a: "Not according to this Swedish survey of Instagram users. People more concerned that their data could be misused reported using the app more, and that link mostly ran straight from concern to use, not by way of trust or tiredness (Lumare et al., 2026)."
  - q: "What is the privacy paradox?"
    a: "The gap between what people claim to care about and how they behave online. They report real concern about their personal data, yet keep sharing it and keep using the services that collect it. This survey adds Instagram users in Sweden to a long line of studies that find it."
  - q: "What is social media fatigue?"
    a: "A worn-out feeling that builds with heavy use. In this survey, the statements covered feeling overwhelmed by the amount of content, finding it hard to relax afterwards, and feeling too tired to do other things well."
  - q: "Which privacy protection steps were measured?"
    a: "Five everyday habits: clearing browser cookies, giving false details when a website asks you to register, refusing to let the browser save passwords, leaving social profiles deliberately incomplete, and avoiding specific personal details on social networks."

also:
  - doi: "10.1002/mar.22137"
    title: "Putting an artificial intelligence-generated label on it comes naturally"
    authors: "Sigurdsson et al."
    journal: "Psychology & Marketing"
    year: 2025
    text: >-
      Three experiments asked shoppers about wines carrying a sustainability label made up with AI, a genuine third-party
      certification label, or no label. Either kind of label raised willingness to buy and the price people would pay,
      and the invented labels did as well as the certified ones. Shoppers who read food labels closely, and those who know
      and care more about wine, were readier to buy throughout. When a convincing badge takes seconds to generate, it is
      worth naming the certifier behind a real one.
  - doi: "10.1002/mar.22143"
    title: "Augmented reality experiences: Consumer-centered augmented reality framework and research agenda"
    authors: "Barta, Gurrea & Flavián"
    journal: "Psychology & Marketing"
    year: 2025
    text: >-
      This systematic review maps consumer research on augmented reality: the theories used, the methods, the types of
      device and the settings where AR turns up. The work falls into four themes: what the medium does to people, the
      psychology behind those effects, app features and adoption, and advice for industry. The authors pull it together in
      a framework that looks at content, context, device and consumer at once. A team planning a try-on tool or a branded
      filter could use those four corners as a checklist before the build.

