title: "Do privacy worries make people use Instagram less? What a Journal of Marketing Communications study found"
dek: >-
  Many Instagram users say they are uneasy about what happens to their personal data. A survey of young adults in Sweden
  asked whether that unease changes how they use the app, and most of the answers ran the opposite way to what the
  researchers expected.
short_title: "Why privacy worries do not keep people off Instagram"

description: >-
  Lumare et al. survey 315 Instagram users in Sweden: those more uneasy about their data reported heavier use of the app
  and trusted it more as well.

keywords: [privacy paradox, social media privacy concerns, Instagram users, social media fatigue, trust in social media
  platforms, privacy protection behaviour, data privacy in marketing, Gen Z privacy, social media usage,
  Journal of Marketing Communications]
