title: "Are online reviews worse on weekends? What a Journal of Marketing Research study found"
short_title: "Why weekend reviews are harsher, and when to ask for one"
dek: >-
  Across almost 400 million reviews on 33 platforms, from Amazon to Glassdoor, reviews written on Saturdays and Sundays
  were more negative. Not because people are grumpier at weekends, but because different people write them.
description: >-
  Weekend reviews carry fewer 5-star ratings and more 1–3 star ratings, across 33 platforms. Why it happens, and why
  you should ask for reviews on weekdays.
keywords: [weekend effect online reviews, when to ask for reviews, review request timing, online ratings, Google
  reviews, Amazon reviews, Glassdoor, Yelp, reputation management, review solicitation, Journal of Marketing Research]
