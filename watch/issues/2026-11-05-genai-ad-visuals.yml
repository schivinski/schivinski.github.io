short_answer: >-
  For background images, in one real campaign, yes. Two researchers paired an image generator with two learning models, one
  predicting clicks and one predicting brand approval, and trained them over nine weekly rounds of Instagram ads. In the final
  test, the AI's ten images averaged a 0.98% link click-through rate, against 0.78% for images chosen by a beauty score and
  0.65% for a professional designer's, and they varied least.

takeaways:
  - "Teaching the system what the brand accepts took the company's representative under two hours of rating, spread over 60 small rounds."
  - "In 99.6% of 10,000 resamples of the final test, the AI set's average beat the designer's. Against the beauty-score set it led in 90.8%, too close to call."
  - "Just 0.6% of the training images ranked in the top tenth on both scores, predicted clicks and brand approval."
  - "In the firm's busy spring season, with no retraining, the company's single standout ad came first, but the next five best ads were all made by the AI."

