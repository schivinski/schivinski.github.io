title: "Can AI find the ad pictures that win clicks and still fit the brand? What a Marketing Science field test on Instagram found"
dek: >-
  An image generator can turn out endless scenery, so making pictures is no longer the hard part. Choosing is. A live Instagram
  test pitted an AI that learns both what gets clicked and what the brand accepts against a professional designer.
short_title: "AI ad backgrounds that click and stay on brand"

description: >-
  Daviet and Nishimura trained an AI on nine weeks of Instagram ads: its background images averaged 0.98% link clicks, against
  0.65% for a designer's.

keywords: [generative AI advertising, AI-generated ad images, ad creative testing, creative optimisation, click-through rate,
  Instagram ads, brand guidelines, Bayesian active learning, alternatives to A/B testing, Thompson sampling, digital advertising,
  Marketing Science]
topics: [AI, Creative, Advertising]

