title: "Does offering compensation to customers who complain on social media invite more complaints? What a Journal of Research in Interactive Marketing study found"
dek: >-
  When Facebook let brands answer comments directly, airlines that replied to complaints in public drew more negativity
  than airlines that kept quiet. Most of it followed replies that put money back or a perk on display.
short_title: "Why public refunds can breed more complaints"

description: >-
  Zhang and Zhang find airlines that offered refunds or freebies in public Facebook replies drew more, and harsher,
  complaints, while apologies added nothing.

