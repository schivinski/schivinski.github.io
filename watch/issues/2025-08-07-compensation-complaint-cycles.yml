short_answer: >-
  On Facebook, it did. When the platform added a reply button under comments, airlines that began answering complaints
  on their brand pages drew more negative comments, and harsher ones, than airlines that stayed silent. Most of that
  rise followed replies offering refunds, upgrades or freebies, which seemed to show other followers what a complaint
  could earn. Replies that apologised added nothing measurable either way.

takeaways:
  - "Before the reply button arrived, only 2 of 133 large brand pages answered individual comments; afterwards 78% of the airlines answered complaints."
  - "Brands that answered complaints openly picked up about 3.5 extra negative comments per post, on pages that averaged 3.6."
  - "A reply mentioning a refund, an upgrade or a freebie was linked to about 4 more negative comments per post than a plain reply."
  - "Saying sorry made no measurable difference of its own on any of the 4 outcomes tracked, from how many complaints arrived to how harsh they sounded."

