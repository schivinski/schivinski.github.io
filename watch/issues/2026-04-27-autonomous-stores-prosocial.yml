short_answer: >-
  Yes, a little, and it adds up. Across nine experiments in Singapore, the US, the UK and China, people who had just
  been in an AI-run store, hotel or restaurant gave less time and money to good causes than people served by staff.
  Outside two real convenience stores, shoppers from the staff-free one pledged about 40% fewer volunteer hours. The
  missing human contact left them feeling less connected to others. Shopping with family, explaining how the tech
  helps customers, and charity appeals that stress what the giver gets back all closed the gap.

takeaways:
  - "Shoppers didn't see it coming: 76% said a staff-free store would make no difference to their willingness to donate."
  - "Even a humanoid robot receptionist didn't help: 45% agreed to do a longer, more useful hotel survey after meeting the robot, against 61% after meeting a person."
  - "In a real autonomous store, one line saying the technology was there to make shopping easier lifted volunteer pledges from 0.28 to 0.59 hours a month."
  - "A Red Cross appeal framed as \"benefits for you and your family\" worked as well after an AI store as after a staffed one."

