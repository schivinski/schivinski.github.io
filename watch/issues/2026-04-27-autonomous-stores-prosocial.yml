title: "Do checkout-free stores make shoppers less generous? What a Journal of Marketing study found"
short_title: "No cashier, less kindness: the hidden cost of autonomous stores"
dek: >-
  Ask shoppers whether skipping the cashier changes how charitable they feel and most will laugh it off. Nine
  experiments suggest they're wrong, and point to some easy fixes.
description: >-
  Shoppers leaving a staff-free store pledged about 40% fewer volunteer hours than those leaving a staffed one. Why it
  happens, and three fixes.
keywords: [autonomous stores, cashierless stores, self-checkout, retail automation, prosocial behavior, charitable
  giving, social connectedness, service robots, cause-related marketing, store design, Journal of Marketing]
