short_answer: >-
  Selectively, and with help from each other. In 14 video interviews with UK adults aged 65 to 80 and six months of posts
  on a forum for older people, the researchers found three habits. People chose a few platforms for clear jobs, each on a
  preferred device, and kept to the friends they already had. They learned by trial and error and from peers. And they
  used the platforms to offset isolation and grief.

takeaways:
  - "Every interviewee reported using social networks more in lockdown to make up for lost face-to-face contact, and 10 of the 14 used them every day."
  - "WhatsApp was the favourite platform of 8 of the 14 interviewees, well ahead of Facebook with 3. Twitter, YouTube, FaceTime and Zoom were named once each."
  - "A forum post from someone unsure what Zoom even was drew 24 replies, with many members offering information and stories of their own Zoom use."
  - "In one circle of about 8 friends that moved its pub evenings onto Zoom, 7 learned to use it. The one who refused had not been seen by the organiser for a year."

