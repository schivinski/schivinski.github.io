title: "How do people over 65 use social media to stay connected? What a Journal of Interactive Marketing study found"
dek: >-
  Lockdown moved much of older people's social life onto video calls and group chats. Interviews with Britons over 65,
  and what members of an online community for older people wrote, show how they chose their apps, taught each other and
  leaned on them through loneliness and loss.
short_title: "How over-65s used social media in lockdown"

description: >-
  Wilson-Nash et al. find Britons aged 65 to 80 stuck to a few chosen apps and devices in lockdown, and learned to use
  them by helping each other.

keywords: [older consumers and social media, seniors on social networking sites, older adults video calls,
