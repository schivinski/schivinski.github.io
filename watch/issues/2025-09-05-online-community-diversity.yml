title: "Does calling an online community diverse attract more members? What a Marketing Letters study found"
dek: >-
  Two sign-up flyers for a local food app were identical except for three phrases. Shown to 3,128 adults across six
  European countries, the one promising a diverse community drew more would-be members, and the keenest planned to do more once inside.
short_title: "Why a diverse pitch draws more community members"

description: >-
  Peschel et al. find that describing an online community as diverse rather than like-minded raised interest in joining by
  about 30% among 3,128 Europeans.

keywords: [online community marketing, community recruitment, diversity and inclusion marketing, diverse online communities,
  like-minded communities, community engagement, diversity orientation, membership diversity, inclusive marketing,
  sign-up messaging, Marketing Letters]
