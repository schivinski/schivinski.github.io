short_answer: >-
  It made people more interested. When 3,128 adults in six European countries took part in an online test, a flyer
  inviting them into a local food community drew more interest in joining when it promised members unlike themselves
  than when it promised like-minded ones. The diversity message did not quieten anyone once inside: people who were
  keener to join said they would react to, comment on or share more of the community's posts.

takeaways:
  - "Interest in joining rose from 3.56 to 4.62 out of 7, roughly 30% higher, when the flyer promised a diverse community instead of a like-minded one."
  - "Just 3 phrases differed between the two flyers; the offer, the design and the download link stayed exactly the same."
  - "People shown the diverse pitch planned about a quarter more actions on a community post: 1.31 against 1.04, out of a possible 4."
  - "Location mattered as much as wording: Dutch respondents given the diverse flyer were less keen to join (3.74) than Spanish respondents given the like-minded one (4.42)."

