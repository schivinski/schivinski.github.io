short_answer: >-
  That depends on what the banner is for. In a live Google display campaign for a large central European charity,
  banners showing a sad child drew more clicks and fewer instant exits than the same banners with the child smiling.
  Once people reached the charity's site, though, the smiling version kept them there longer, and most of all those who
  had visited before.

takeaways:
  - "Pairing the sad child with the concrete school line lifted the click-through rate to about 0.5%, more than twice that of any other banner; the other three managed 0.2% or less."
  - "People who had been on the charity's site in the previous 30 days spent 151 seconds on the landing page after a smiling banner, against 73 seconds after a sad one."
  - "For those returning visitors, the smiling child with the concrete line held attention for 185 seconds, more than three times the 54 seconds the sad child managed with the same words."
  - "In the lab, swapping the sad expression for a smile cut sympathy by 1.23 points (the top score was 7), and sympathy, not the expression itself, is what moved people's willingness to click."

