title: "Should a charity ad show a sad face or a smiling one? What an International Journal of Advertising study found"
dek: >-
  Charities have long been split between pictures of children in tears and pictures of children beaming. A live banner
  campaign that ran to more than three million impressions suggests each side has a point, depending on whether the ad
  is meant to win a click or to keep a visitor reading.
short_title: "Sad faces win the click, smiles hold the visit"

description: >-
  Stokburger-Sauer et al. find a sad child in a charity banner won more clicks, while a smiling child kept returning
  visitors on the site about twice as long.

keywords: [charity advertising, nonprofit marketing, display advertising, banner ads, emotional appeals in ads,
  sad vs smiling faces, ad copy, retargeting, click-through rate, marketing funnel, Google Display Network,
  International Journal of Advertising]
