title: "When do customers choose AI over human staff? What a Journal of Marketing study found"
short_title: "When the front line all looks alike, some customers choose the bot"
dek: >-
  Picture walking into a bank where every teller is White and you are not. For a lot of people in that spot, the robot
  teller in the corner suddenly looks like the easier option.
description: >-
  Facing all-White staff, 50% of non-White customers chose a digital kiosk, against 36% with non-White staff. What it
  means for service design and AI options.
