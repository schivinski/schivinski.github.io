sections:
  - h: "What the researchers did"
    body: |
      Ask people whether they'd rather be served by a person or a machine and most pick the person. Yeseul Kim
      (University of Bath), Dipayan Biswas (University of South Florida), Courtney Szocs (Penn State) and Khalia
      Jenkins (American University) wanted to know who the exceptions are, and when.

      Their starting point is uncomfortable but well documented: in US banks, shops and rental offices, Black customers
      often wait longer, get less warmth and face more suspicion. Being the only non-White person in the room can bring
      all of that to mind. The question was whether, in that moment, a machine starts to look safer than a person.

      The team ran ten studies. Two were real job adverts with paid work at the end, one was a Facebook ad campaign,
      and the rest were online experiments set in banks, rental offices and an investment firm. Every time, people
      chose between a human and an algorithm: an AI interviewer, a robot teller or a digital kiosk.
    facts:
      - ["Studies", "Ten US studies with nearly 4,000 participants, plus a Facebook ad campaign"]
      - ["Settings", "Banking, apartment leasing, investment advice and job interviews"]
      - ["Choice", "A human employee or an AI interviewer, robot teller or digital kiosk"]
      - ["Surveys", "97 non-White consumers and 201 managers on concerns about being judged in service settings"]

  - h: "Identity, not technology, drives the switch"
    body: |
      The first job advert, posted at historically Black colleges, set the pattern. A second run, shared through Black
      community networks, showed an even steeper jump: from 15% to 37% choosing the AI interviewer. Online, Black participants looking at a bank full of
      White customers chose the robot teller 38% of the time; in a mixed crowd, 22%.

      What tipped the balance was a specific worry. When non-White participants were told they felt out of place at a
      bank, their concern that staff would size them up by race rose from 2.57 to 3.79 on a 7-point scale, and that
      concern explained the move towards the robot.

      It isn't just people wanting staff who look like them. White men in the bank study said they felt less similar to
      non-White employees, yet they went to the kiosk no more often (38.8% against 37.5%). Feeling different only
      mattered for people who had reason to expect unfair treatment.
    chart: kiosk

  - h: "The same pattern in real ads"
    body: |
      The Facebook ads ran for one day at a time in mostly Black and mostly White US neighbourhoods. Where most
      residents were Black, a diverse advice team did almost as well as the chatbot. Where most were White, the ranking
      flipped: the all-White team drew the most clicks and the chatbot fell behind. One image, two very different
      audiences.
    chart: clicks

  - h: "Signals of inclusion change the picture"
    body: |
      The pull towards machines weakened wherever judgment felt less likely. Applying to lease a flat, people who had
      just recalled a time they stood out as a minority chose an AI interviewer 52% of the time, against 36% in the
      control group. Applying to a social club for people with mixed interests, that same reminder made no real
      difference.

      Telling people the bank was minority-owned did something similar. The jump towards the robot teller shrank to
      eight points (24% to 32%), against twenty-two (30% to 52%) without that line. And at the investment firm, a
      short diversity statement was enough to cancel out the effect of an all-White team.

  - h: "Beyond the bank branch"
    body: |
      The authors studied race and ethnicity in the US, and they suggest that other groups who expect to be judged,
      by sexual orientation or by wealth for example, may react the same way. Going a step further than the paper, the
      same logic could hold at a GP's front desk, an insurance claims line, a debt advice service, a car dealership or
      a luxury boutique: anywhere a customer might feel assessed as a type rather than helped as a person.

      It also changes how to read your channel data. If one group of customers sticks to the app, the kiosk or the
      chatbot, convenience may not be the whole story. They may be telling you something about the counter.

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["Ask before you assume", "Most managers in the survey had no idea this worry existed. Talk to customers from different backgrounds about how your service feels, not just how quickly it works."]
  - ["See the front line as a newcomer would", "Walk through the branch, the website team page, the ad creative and the interview panel. Note who is visible at each point a customer decides whether to come in."]
  - ["Offer a judgment-free route", "Let people complete sensitive tasks, such as loan applications, rental applications and first interviews, through a kiosk, an app or an AI assistant if they prefer."]
  - ["Make inclusion visible", "A diversity statement or a clear signal of ownership changed behaviour in these studies. Place it on the door, the landing page and the booking screen, where the choice is made."]
  - ["Check the machine for bias too", "Customers may see AI as neutral, but scoring tools and chatbots can treat groups unequally. Test outcomes by group before you offer AI as the fair alternative."]
  - ["Track uptake by customer group", "Report kiosk, app and chatbot use by segment and by location. A sudden skew is a cue to look at training and staffing, not only at the technology."]

expect:
  - "**Most people still want a person.** Even in the strongest conditions, about half of the customers stayed with the human option."
  - "**Shifts of roughly 10 to 20 points.** That was the usual size of the swing towards the machine when customers felt they stood out."
  - "**The payoff is in high-stakes services.** Banking, renting and hiring showed the effect; a relaxed social setting did not."
  - "**Cheap to try.** An extra channel and a visible statement cost far less than restructuring a team, and both are easy to A/B test."

limits:
  - "**US, race and ethnicity only.** Other identities and countries were not tested."
  - "**Mostly hypothetical choices.** Only the job adverts and the Facebook campaign recorded what people actually did."
  - "**Perceived fairness, not actual fairness.** The study didn't check whether the AI options treated people more equally."
  - "**Some results were marginal.** A few comparisons only just reached significance, and click-through rates on the ads were very low."

faq:
  - q: "Do minority customers prefer AI customer service?"
    a: "Generally no, but the gap narrows when the staff are all White. In one online bank study, the robot teller's share rose from about one in five to nearly two in five once the other customers in the branch were all White (Kim et al., 2026)."
  - q: "Why would someone pick a robot over a person?"
    a: "To avoid being stereotyped. Feeling out of place raised worries that staff would judge them by race, and those worries, not a liking for technology, explained the switch."
  - q: "Isn't this just people preferring staff who look like them?"
    a: "No. White men noticed the difference just as clearly, yet stuck with the human teller, so the effect depends on expecting unfair treatment, not on difference alone."
  - q: "Is AI actually fairer than human staff?"
    a: "Not necessarily. The authors cite cases where lending chatbots rated Black borrowers as riskier. Customers may still see AI as less judgmental, which is a perception to respect, not a guarantee."
  - q: "What can a business do without changing its staff?"
    a: "Offer a self-service or AI route for sensitive tasks and show clear signs of inclusion, such as a diversity statement. Both reduced the pull towards machines in the studies."

also:
  - doi: "10.1177/10949968251408781"
    title: "Marketing AI superiority: Risks of using the \"better-than-human\" framing"
    authors: "Weihrauch, A., & Xie, C."
    journal: "Journal of Interactive Marketing"
    year: 2026
    text: >-
      Four experiments show that advertising AI as "better than humans" can backfire by stirring fears about AI
      threatening humanity, especially among people already anxious about AI. A short reassuring message alongside the
      claim softened the reaction. Bragging rights for your AI come with a cost, so add the reassurance.
  - doi: "10.1007/s11747-025-01136-y"
    title: "Keeping it real in human eyes: Receptivity to human vs. AI in luxury authentication and the role of perceived perspective similarity"
    authors: "Ma, X., Jin, F., & Dai, X."
    journal: "Journal of the Academy of Marketing Science"
    year: 2026
    text: >-
      Across eight studies, buyers and sellers preferred luxury goods authenticated by human experts over AI, because
      they felt human experts see the item the way they do. The preference weakened when the purchase was less about
      social status, the product was not positioned as luxury, or the branding was discreet. Status shoppers want a
      human eye on the goods, even when the machine may be just as good.

