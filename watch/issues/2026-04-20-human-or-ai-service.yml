short_answer: >-
  When they expect to be judged for who they are. In ten US studies, Black and other non-White customers leaned
  towards a machine instead of a person whenever the people around them were all White. At one bank, half
  of non-White men picked the kiosk when the staff were all White, against just over a third when the staff were
  non-White too. White customers didn't budge either way. Signs that a business values diversity took most of the effect
  away.

takeaways:
  - "With real paid work on offer, students at historically Black colleges picked an AI interviewer 49% of the time when the pictured panel was all White, against 35% when it was Black."
  - "On Facebook, a financial advice ad fronted by a chatbot got twice the clicks of one fronted by White male advisers (0.63% against 0.30%) in mostly Black neighbourhoods."
  - "An all-White investment team pushed choice of the AI adviser from 9% to 26%, unless the firm also showed a diversity statement."
  - "73% of non-White consumers surveyed had worried about being judged on their identity when buying services; 72% of managers had no idea."

