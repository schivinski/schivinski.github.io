sections:
  - h: "What the researchers did"
    body: |
      Most research finds that customers prefer a human to a machine. Yeseul Kim (University of Bath), Dipayan Biswas
      (University of South Florida), Courtney Szocs (Penn State) and Khalia Jenkins (American University) asked whether
      that holds for everyone. Black and other non-White consumers in the US often report slower, colder or more
      suspicious service. When everyone behind the counter is White, being "the only one" can bring that experience to
      mind. Would an AI option then feel safer?

      They ran ten studies, including three in the field: a real paid job ad shared at historically Black colleges and
      through community networks, and a Facebook ad campaign. The others were controlled online experiments set in
      banks, apartment leasing, investment advice and job interviews. Each time, people chose between a human and an
      algorithmic provider: an AI interviewer, a robot teller or a digital kiosk.
    facts:
      - ["Studies", "Ten US studies with nearly 4,000 participants, plus a Facebook ad campaign"]
      - ["Settings", "Banking, apartment leasing, investment advice and job interviews"]
      - ["Choice", "A human employee or an AI interviewer, robot teller or digital kiosk"]
      - ["Surveys", "97 non-White consumers and 201 managers on concerns about being judged in service settings"]

  - h: "Identity, not technology, drives the switch"
    body: |
      In the real job ad, applicants from historically Black colleges chose the AI interviewer 49% of the time when the
      pictured interviewers were all White men, against 35% when they were Black. A second field version found 37%
      against 15%. In an online bank study, Black participants shown a branch full of White customers chose the robot
      teller 38% of the time, against 22% in a mixed branch.

      The reason was concern about being judged. Non-White participants who were told they felt like a minority at the
      bank were more worried that staff would judge them on their race (3.79 against 2.57 out of 7), and that worry
      explained their move to the robot teller.

      White customers did not react the same way. When a bank's staff were all non-White, White men chose the kiosk no
      more often than when the staff were White. So this is not simply people preferring staff who look like them.
    chart: kiosk

  - h: "The same pattern in real ads"
    body: |
      In a Facebook campaign for financial advice, ads ran in mostly Black and mostly White neighbourhoods in US cities.
      In the mostly Black areas, the ad featuring a chatbot drew twice the click-through rate of the ad featuring only
      White male advisers (0.63% against 0.30%), and the ad with a diverse team did almost as well as the chatbot
      (0.58%). In the mostly White areas, the all-White ad drew the most clicks.

      The authors stress that, overall, most people still chose humans. The shift was relative, from roughly a third to
      roughly half in the strongest cases.
    chart: clicks

  - h: "Signals of inclusion change the picture"
    body: |
      The effect faded when customers had less reason to fear judgment. After recalling a time they felt like a
      minority, participants applying for an apartment lease chose an AI interviewer 52% of the time, against 36% in
      the control group; for a social club catering to diverse interests, it made no clear difference. At a bank described as minority-owned, the shift towards a robot
      teller was much smaller (24% to 32%, against 30% to 52% otherwise). And at an investment firm, an all-White team raised choice of the AI adviser from 9% to
      26% when the firm showed a generic mission statement, but not when it showed a diversity statement (19% against
      17%).

  - h: "Beyond the bank branch"
    body: |
      The study looks at race and ethnicity in the US, but the authors suggest the same mechanism may apply to other
      groups who expect to be judged, for example by sexual orientation or wealth. My reading, not tested in the paper,
      is that it applies wherever a customer might feel judged as a type rather than served as a person: healthcare,
      insurance claims, debt advice, car sales, luxury retail or job applications.

      It also reframes how to read channel data. When a group of customers heavily uses self-service, chatbots or
      apps, the reason may not be convenience; it may be what they expect at the counter. That is a signal about your
      front line, not just about digital adoption.

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["Ask the customers you may be missing", "72% of managers surveyed did not know their customers worried about being judged on their identity. Talk to and survey customers from different backgrounds about how your service feels, not only how fast it is."]
  - ["Look at your front line through their eyes", "Check who customers actually see at branches, in ads, on team pages and in interview panels. A uniform team can make some customers feel singled out before anyone says a word."]
  - ["Offer a no-judgment option", "Give customers a genuine choice of channel, such as a kiosk, an app or an AI assistant, for tasks like applications, quotes and account opening, especially in finance, housing and hiring."]
  - ["Show inclusion clearly", "Diversity statements, visibly diverse teams and ownership signals reduced the shift in these studies. Put them where customers decide: on the door, the landing page and the booking screen."]
  - ["Audit the AI as well as the humans", "Customers saw AI as less judgmental, but algorithms can carry bias too. Test chatbots, scoring tools and kiosks for unequal outcomes before you present them as the fair option."]
  - ["Read channel choice as feedback", "Track which customer groups choose self-service or AI and why. A sharp skew may be telling you about your front-line experience, and should prompt service training, not just more automation."]

expect:
  - "**Humans still win overall.** Even in the strongest conditions, about half of customers still chose the human provider."
  - "**A shift of 10 to 20 percentage points.** That was the typical rise in choosing the AI option when customers' identity was made salient."
  - "**No change for White customers.** Offering an AI option did not alter White customers' choices in response to staff composition."
  - "**Cues work.** A diversity statement or minority ownership largely removed the shift, a low-cost step for any service brand."

limits:
  - "**US, race and ethnicity only.** The studies focus on Black and other non-White consumers in the United States; other groups and countries were not tested."
  - "**Mostly hypothetical choices.** Most studies were online scenarios; only the job ads and the Facebook campaign involved real behaviour."
  - "**Perception, not fairness.** People saw AI as less judgmental, but the study did not test whether the AI options were actually fairer."
  - "**Some effects were modest.** A few comparisons were only marginally significant, and the ad click-through rates were very low."

faq:
  - q: "Do minority customers prefer AI customer service?"
    a: "Not in general, but more so in some situations. In a 2026 Journal of Marketing study, Black and other non-White customers were more likely to choose an AI or robot provider when all the human staff were White, for example 50% against 36% for a bank kiosk (Kim et al., 2026)."
  - q: "Why would customers choose a robot over a human employee?"
    a: "To avoid being judged on their identity. Non-White participants who felt like a minority at a bank worried more about being judged on their race, and that worry explained their shift towards the robot teller."
  - q: "Do White customers react the same way?"
    a: "No. In the study, White men did not choose the kiosk more often when the bank's staff were all non-White, so the effect is not simply a preference for staff who look like you."
  - q: "How can service businesses reduce this concern?"
    a: "Visible signals of inclusion helped. A diversity statement, a minority-owned business or a context with diverse customers largely removed the shift towards AI providers."
  - q: "Should companies replace diverse hiring with AI options?"
    a: "The authors present AI options as a way to serve customers who worry about judgment, especially where diverse hiring is hard. Their own results show diverse teams and inclusion cues also work, and algorithms can carry their own biases."

also:
  - doi: "10.1177/10949968251408781"
    title: "Marketing AI superiority: Risks of using the \"better-than-human\" framing"
    authors: "Weihrauch, A., & Xie, C."
    journal: "Journal of Interactive Marketing"
    year: 2026
    text: >-
      Four experiments show that advertising AI as "better than humans" can backfire by stirring fears about AI
      threatening humanity, especially among people already anxious about AI. The authors also test a reassuring
      message that softens the reaction. If you sell AI on superiority, pair the claim with reassurance about its role.
  - doi: "10.1007/s11747-025-01136-y"
    title: "Keeping it real in human eyes: Receptivity to human vs. AI in luxury authentication and the role of perceived perspective similarity"
    authors: "Ma, X., Jin, F., & Dai, X."
    journal: "Journal of the Academy of Marketing Science"
    year: 2026
    text: >-
      Across eight studies, buyers and sellers preferred luxury goods authenticated by human experts over AI, because
      they felt human experts see the item the way they do. The preference weakened when the purchase was less about
      social status, the product was not positioned as luxury, or the branding was discreet. For status goods, keep a
      human in the authentication story.

