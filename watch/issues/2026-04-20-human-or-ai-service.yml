short_answer: >-
  When they expect to be judged for who they are. Across ten US studies, Black and other non-White customers were
  more likely to choose an AI interviewer, robot teller or digital kiosk when the human staff (or other customers) were
  all White: in one bank study, 50% chose the kiosk against 36% when staff were non-White. Concern about being judged
  on their race drove the shift. White customers showed no such change, and diversity statements or minority ownership
  largely removed the effect.

takeaways:
  - "Facing an all-White bank staff, 50% of non-White men chose a digital kiosk over a human teller, against 36% when the staff were non-White."
  - "White men's choice did not change with the staff's race (37.5% against 38.8%)."
  - "In a real job ad shown at historically Black colleges, choosing an AI interviewer rose from 35% to 49% when the pictured interviewers were all White."
  - "73% of non-White consumers surveyed had worried about being judged on their identity in service settings, yet 72% of managers were unaware of this."

