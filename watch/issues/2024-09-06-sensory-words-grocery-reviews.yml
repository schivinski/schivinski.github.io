short_answer: >-
  Some do. In 13,575 Trustpilot reviews of the five biggest UK grocery chains, the more a review talked about how things
  looked or tasted, the higher its star rating tended to be. Words about sound, touch and smell showed no such link. Reviews
  that described both looks and taste came out a little lower than those two senses alone would predict, so stacking senses
  added nothing.

takeaways:
  - "For every extra percentage point of a review's words that described how things looked, the star rating rose by about 0.025, the clearest link of any sense."
  - "Taste words turned up in only 8.6% of reviews but still went with higher ratings, and in reviews of a sixth chain their link was stronger still, at 0.044 per percentage point."
  - "Sound words were the most common, in 62.4% of reviews, and touch words appeared in 38.3%, yet neither moved the stars in the main data."
  - "Smell was the rarest sense, mentioned in just 1.7% of reviews, and showed no link with ratings in either set of reviews."

