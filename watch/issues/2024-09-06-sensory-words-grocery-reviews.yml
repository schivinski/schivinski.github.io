title: "Do sensory words in online reviews go with higher star ratings? What a Psychology & Marketing study found"
dek: >-
  Supermarket reviews are full of what shoppers saw, heard, touched, tasted and smelled. A word count across thousands of
  UK reviews on Trustpilot shows that only two of the five senses track the stars, and that piling them together does not help.
short_title: "Which senses show up in the stars"

description: >-
  Hallikainen et al. find words about looks and taste are linked to higher stars in 13,575 UK grocery reviews on
  Trustpilot, while sound, touch and smell are not.

keywords: [sensory marketing, online reviews, star ratings, Trustpilot reviews, grocery retail, supermarket customer
  experience, text analysis, LIWC, electronic word of mouth, social listening, review analytics, Psychology & Marketing]
