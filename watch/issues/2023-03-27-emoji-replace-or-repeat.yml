short_answer: >-
  Yes, when the emoji repeats a word rather than replacing it. Across ten studies, a face placed after the praise it echoed
  nudged people to choose, like, share and click. In a lab test, 82% picked a reviewed lemonade when the post said
  "really delicious" and added a face, against 54% for words alone. A face standing in for the word made the message vaguer
  and gained nothing overall.

takeaways:
  - "A Facebook ad that repeated its key word with a face cost 0.55 euros per click, against 0.73 euros for the words-only version."
  - "Status updates with a laughing face after \"so funny\" collected roughly twice the likes in 24 hours of the words-only posts (6.15 against 3.02)."
  - "A face in place of \"really love\" lifted intention to try a juice from 3.82 to 4.97 out of 7, but only when the review described the taste first."
  - "Told about a deal by a close friend whose post used a face instead of praise, people wanted to tell about 5.5 others, against 3.6 for words; from an acquaintance, the face changed nothing."

