title: "Do emojis make reviews and brand posts more persuasive? What a Journal of the Academy of Marketing Science study found"
dek: >-
  Ten studies show that where a face emoji sits decides whether it helps. Placed after the word it echoes, it made reviews,
  posts and ads more persuasive. Dropped in where the word should be, it left readers guessing.
short_title: "Emojis persuade when they echo the words"

description: >-
  Maiberger et al. find a face emoji that repeats a word gives reviews, tweets and Facebook ads more pull, while one that
  replaces the word adds nothing.

keywords: [emojis in marketing, emoji persuasion, facial emojis, emojis in online reviews, electronic word of mouth,
  eWOM, emojis in Facebook ads, click-through rate, social media copywriting, emoji ambiguity,
  Journal of the Academy of Marketing Science]
topics: [Social media, UGC, Advertising]

