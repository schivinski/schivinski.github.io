short_answer: >-
  Different things for each, judging by 417 brand-sponsored videos on TikTok's Chinese version, Douyin. For
  microinfluencers with 30,000 to 100,000 followers, titles naming the product and its benefits went with more likes,
  while viewers' admiration for the creator was of no help. For far larger accounts, admiration accompanied extra
  likes and shares, and product titles made no difference. In both groups, shares tracked link sales more closely than
  likes did.

takeaways:
  - "Among 189 videos by small creators, titles stating what the product is and what it does were linked to more likes. Among 228 videos by far bigger accounts, they were not."
  - "The average video collected about 88,000 likes but only about 440 shares, yet shares were the stronger link to sales for small and big creators alike."
  - "Sponsored videos lasted 46.8 seconds on average. Longer ones were linked to higher like and share counts for big accounts, but not for small creators."
  - "Ten of the authors' 12 predictions held. The two that failed: cues of a bond with viewers did not lift likes, and product-focused titles did not lift shares for small creators."

