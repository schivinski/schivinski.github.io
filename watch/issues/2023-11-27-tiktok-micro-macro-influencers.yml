title: "What drives likes, shares and sales for TikTok micro- and macroinfluencers? What a Journal of Interactive Advertising study found"
dek: >-
  Small creators and big ones win attention in different ways. A study of 417 sponsored videos on Douyin, TikTok's
  counterpart in China, links product-focused titles to likes for the small accounts, viewer admiration to engagement
  on the big ones, and shares more than likes to sales.
short_title: "Micro or macro: what moves TikTok sales"

description: >-
  Chan et al. study 417 sponsored Douyin videos: product-led titles went with likes for small creators, star appeal for
  big ones, and shares tracked sales best.

