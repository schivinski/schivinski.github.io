title: "Does a loading spinner's speed change how long a wait feels? What a Journal of Consumer Research study found"
dek: >-
  Most sites fill a slow load with nothing at all or a spinning wheel, and the usual design advice says faster movement makes
  time fly. Ten experiments find that a middle pace makes waits feel shortest and keeps more people from walking away.
short_title: "The spinner speed that makes waits feel shorter"

description: >-
  Ding and Kyung find a loading spinner at a moderate pace makes waits feel shorter than a blank screen or a fast spinner,
  and keeps more people on the page.

keywords: [loading animation, loading spinner speed, perceived waiting time, page load time, website abandonment,
  user interface design, digital customer experience, conversion rate, click-to-landing rate, mobile shopping,
  time perception, Journal of Consumer Research]
topics: [Service, Retail, Creative]

