short_answer: >-
  Yes, though not in the way most designers assume. Across ten experiments, waits felt shortest when a looping spinner moved
  at a moderate pace, about two seconds per full turn, rather than not at all, very slowly or very fast. Pace also changed
  behaviour: after clicking a Facebook ad, 44.5% of people sat through a 20-second load with a moderate spinner, against 37.5%
  with a still image and 38.9% with a fast one.

takeaways:
  - "On a phone, two 7-second waits felt 26% shorter with a moderate spinner than with a blank screen, and 20% shorter than with a fast spinner."
  - "When people clicked through to an optional one-minute survey, 67% finished it after a 30-second wait with a moderate spinner, compared with 32% after a still image and 50% after a fast spinner."
  - "In a mobile shopping task, backpacks opened after a moderate spinner earned a liking score of 63 out of 100, against 58 when a still image had filled the wait."
  - "Of 100 popular websites checked by hand, 32 showed nothing at all while loading, and the animations timed across sites and apps took about 1.2 seconds per turn on average."

