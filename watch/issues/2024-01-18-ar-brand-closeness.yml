short_answer: >-
  It can, by first making the brand feel near. In a German lab experiment, 155 students used a carmaker's app with or
  without its AR view. The AR group sensed the brand nearer, and that sense went with more brand love. A second study, in
  which 173 women tried on makeup virtually, traced the same path, which ran strongest when the products looked real and
  the brand was already familiar.

takeaways:
  - "Switching on the AR view, and changing nothing else in the app, raised how near the brand seemed: a standardised effect of 0.24."
  - "When everyone used AR, how real the virtual makeup looked was strongly tied to closeness, with a standardised weight of 0.50."
  - "Knowing the brand did not bring it closer by itself, but it made a convincing AR effect count for more (interaction p = 0.007)."
  - "Love for the brand recorded weeks earlier strongly predicted love afterwards (0.56), yet closeness during the session still added its own push."

