title: "Does augmented reality make customers love a brand? Evidence from two Psychology & Marketing studies"
dek: >-
  Augmented reality can park a virtual car outside your front door or put a lipstick shade on your lips. Two German studies
  show that having the brand right there turns into something warmer, brand love, above all when the illusion convinces.
short_title: "How AR brings a brand closer, and why that breeds love"

description: >-
  Rauschnabel et al. show AR makes a brand seem close at hand, and that nearness grows into brand love, strongest when the
  virtual product looks real.

keywords: [augmented reality marketing, AR apps, brand love, consumer-brand relationships, virtual try-on, local presence,
  perceived closeness, brand familiarity, immersive technology, mobile marketing, Psychology & Marketing]
topics: [Retail, Advertising]

