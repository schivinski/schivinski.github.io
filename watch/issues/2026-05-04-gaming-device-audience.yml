title: "Is \"gamers\" one audience? What a study of 116,047 players found"
short_title: "Four screens, four audiences: reading the gaming channel"
dek: >-
  A survey built to study problem gaming also produced something marketers rarely get: a map of 116,047 players,
  what they play, and the device they play it on. The four groups barely overlap.
description: >-
  Shooters are the favourite of 36% of console players and 17% of phone players; strategy games 35% on laptops and
  4% on consoles. How to read the gaming channel, from 116,047 players.
keywords: [gaming marketing, in-game advertising, audience segmentation, media planning, esports, game genres,
  console versus PC, mobile gaming, player engagement, responsible marketing, gaming disorder, brand safety,
  Journal of Behavioral Addictions]
