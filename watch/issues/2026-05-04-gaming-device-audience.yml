short_answer: >-
  No. Among 116,047 players from across the world, the machine someone chose predicted what they played far better
  than anything else on file. Shooters were the favourite game of 36% of console players and 17% of phone players.
  Strategy games ran the other way: 35% on laptops, 4% on consoles. Four in five preferred games had multiplayer
  in them, and those players reported the heaviest and most troubled play. Yet the same tags were close to useless
  for judging any one person, which is the part most media plans get backwards.

takeaways:
  - "Action was the common ground: it sat on about three in four favourite games on consoles and computers, and on 60% of them on phones."
  - "Massively multiplayer worlds were the pick of 30% of desktop players and 14% of console players."
  - "Phones were the least social screen: 66% of their players' favourites had multiplayer, against 82% on desktops."
  - "Game tags barely predicted any individual's score on the gaming-disorder scales (R from .08 to .15), so they describe crowds, not people."

