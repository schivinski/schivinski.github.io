short_answer: >-
  Not in this test. When an alumni club emailed 3,521 university students, opening the subject line with each student's
  first name did not raise opens or clicks. A more formal version did better: a start-up's survey
  invitation to 3,700 local and regional politicians was opened more often when the subject line addressed them by
  title and surname, although clicks did not rise reliably. An influential earlier result did not reproduce.

takeaways:
  - "Among students, 56.9% opened the email that used their first name and 58.5% opened the plain version, a difference that could well be due to chance."
  - "Clicks did not change either: 4.5% of students followed the link in each version."
  - "Addressing politicians as Mr. or Ms. plus their surname raised opens by 11.8%, the only statistically significant difference in either experiment."
  - "The same formal subject line lifted the politicians' clicks by 14%, from 4.3% to 4.9%, but statistically that rise was not reliable."

