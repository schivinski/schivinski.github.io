sections:
  - h: "What the researchers did"
    body: |
      Laurens Defau and Alexander Zauner,
      of the JKU Business School at Johannes Kepler University Linz in Austria, went back to one of the best-known
      findings in email marketing. An earlier field study reported that adding the recipient's first name to a subject
      line raised opens by 20% and sales leads by 31% (Sahni et al., 2018). That work has been cited more than 200 times,
      and the tactic has since become routine.

      The original data were collected in 2014. Since then, inboxes have filled with emails that use the reader's name,
      and the authors asked whether people have simply got used to it. As far as they could tell, nobody had repeated the
      original test, so they ran two randomized field experiments with real senders. The paper appears in the journal's
      Replication Corner, which publishes studies that check whether earlier results hold.
    facts:
      - ["Design", "Two randomized field experiments; in each, two versions of one email differed only in the subject line"]
      - ["Experiment 1", "An alumni club invited university students to a career platform: 1,773 got a subject line with their first name, 1,748 a plain version"]
      - ["Experiment 2", "A social media software start-up invited local and regional politicians to a survey: 1,846 were addressed by title and surname, 1,854 were not"]
      - ["Language", "Both emails were written and sent in German"]
      - ["Measured", "The share of sent emails that were opened, clicked through and unsubscribed from, compared with independent-sample t-tests"]

  - h: "A first name did nothing for students"
    body: |
      In the first experiment, an alumni club that offers career advice invited university students to join an exclusive
      career platform. One group received a subject line that opened with their first name, which in English reads
      "John, a successful start for your career". The other group received the same email without the name.

      Slightly fewer students opened the named version, but the difference could easily have been chance (p = 0.333).
      The share who went on to click the link was identical for the two versions. The first name made no measurable
      difference.

  - h: "A title and surname helped with politicians"
    body: |
      The second experiment had a more formal setting. A start-up that develops tools for managing social media accounts
      wanted to learn how professional groups use social media, and sent local and regional politicians an email inviting
      them to take a survey. Because the contact was formal, the named version used a title and surname instead of a first name:
      "Mr. Smith, how do you view digitalization in politics?", with Herr or Frau in the German original.

      This time the name made a difference. Of the politicians greeted by name, 38.8% opened the email, against 34.7% of those who received the plain version (p = 0.010).
    chart: opens

  - h: "Clicks barely moved"
    body: |
      An open is only the first step. What a sender usually wants is a click on the link inside, and neither experiment
      produced a reliable change there. Among students, click rates were the same with and without the first name
      (p = 0.943). Among politicians, a few more clicked after the named subject line, but the difference fell short of
      significance (p = 0.373).

      Unsubscribes were rare in both tests. Fifteen students in the first-name group left the mailing list, against 13
      in the plain group, which the authors caution against reading too much into. Only one politician unsubscribed, from
      the named group.
    chart: clicks

  - h: "Why the first-name effect may have worn off"
    body: |
      The authors offer three possible reasons for the students' result, none of which they tested. The first is
      familiarity: once many senders put names in subject lines, a name no longer stands out. The second is the audience,
      since students grew up online and may spot the tactic more readily. The third is culture, as earlier research links
      national cultural traits to how people respond to promotional email (Lorente-Páramo et al., 2020).

      For the politicians, they suggest that a title and surname are still rare in subject lines and so may still
      surprise the reader. Politicians are also, in general, older than students and perhaps less used to digital
      marketing. The two experiments differed in audience, sender, topic and type of name at the same time, which leaves
      the paper unable to say which of these accounts for the different results.

  - h: "What it means for email teams"
    body: |
      The authors conclude that personalization of this kind can still work, but it needs to be more creative and
      surprising to catch attention. They add that consumers adapt as technology changes, so the effect of any single
      marketing tool can fade.

      A suggestion of ours, not something the study examined: a personalization rule that once won an A/B test is a
      claim to recheck, not a permanent setting. Holding back part of each list for a plain version keeps a running
      record of whether the rule still pays off.

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["Look back at ten campaigns", "Open your last ten email campaigns and mark which subject lines used the reader's name. Write the open rate and the click rate next to each one."]
  - ["Choose how to address this list", "Ask how you would greet these readers in person. For business or formal lists, prepare a title and surname version, but only if your records hold titles reliably. For casual lists, prepare a first-name version."]
  - ["Write three subject lines", "Write one line with no name, one with the name, and one that opens with a detail the reader will recognise, such as the event or product they signed up for. Leave everything else in the email unchanged."]
  - ["Split the list at random", "Divide the list at random into three equal groups of at least 1,500 addresses each. Send all three versions at the same hour on the same day."]
  - ["Judge on clicks after three days", "Wait 72 hours, then compare clicks first and opens second, because some mail apps open messages automatically. If a free A/B significance calculator does not confirm a difference, treat it as none."]
  - ["Repeat the test every six months", "Run the same three-way test twice a year. When a named or detailed version stops beating the plain line, drop it and try a new detail."]

expect:
  - "**No built-in gain from a first name.** Do not plan on a lift from adding first names; in this replication they changed neither opens nor clicks."
  - "**Formality can suit professional readers.** A respectful title and surname worked for a formal audience here, and the benefit showed up in opens."
  - "**Opens move more easily than clicks.** A subject line that wins more opens may not bring more clicks, so judge it on what happens after the open."
  - "**Tactics wear out.** The authors expect devices like this to lose force as readers get used to them, so today's best subject line may need replacing."

limits:
  - "**Audience and tactic changed together.** First names were tried only with students, and titles with surnames only with politicians, so the two results cannot be compared head to head."
  - "**One email in each test.** Each experiment was a single message to one list with one wording of the subject line."
  - "**Opens, clicks and unsubscribes only.** Neither test followed recipients through to sign-ups, survey completions or purchases."
  - "**German-language emails.** Both lists received emails in German, and the authors expect reactions to promotional email to differ from one culture to another."
  - "**Reasons not measured.** Familiarity, age and digital experience were offered as explanations but not measured, and the data cannot be shared, to protect the organisations involved."

faq:
  - q: "Does putting the reader's first name in the subject line increase email open rates?"
    a: "Not in this replication. When an alumni club tested a first-name subject line on university students, opens and clicks were no higher than for the plain version, so the earlier finding of a lift was not reproduced (Defau & Zauner, 2023)."
  - q: "Is a title and surname better than a first name in a subject line?"
    a: "It helped in one setting. A survey invitation that addressed local and regional politicians by title and surname was opened more often than one with no name. The first-name test used a different audience and sender, so the study does not show that surnames beat first names in general."
  - q: "Why would name personalization stop working?"
    a: "Mainly through familiarity, in the authors' view: when many brands use the same device, readers stop noticing it. They also point to a younger, digitally experienced audience and to cultural differences, without testing either."
  - q: "What did earlier studies find about names in email?"
    a: "Apart from the first-name study this paper set out to repeat, a charity field experiment matched each potential donor's surname with that of a teacher seeking funds. The matching name lifted opens by around 27%, and average donations in that group were twice those from a standard email (Munz et al., 2020)."

also:
  - doi: "10.1177/00222437231195576"
    title: "Guardians of Trust: How Review Platforms Can Fight Fakery and Build Consumer Trust"
    authors: "Beck, Wuyts, & Jap"
    journal: "Journal of Marketing Research"
    year: 2024
    text: >-
      Fake reviews threaten the trust on which review platforms depend. Drawing on research on governance and identity
      disclosure, the authors propose five design practices: monitoring, exposure, community building, status endowment
      and identity disclosure. Across five studies these practices raised trust in the platform, over and above the
      content of the reviews themselves, and exposure, community building and status endowment made identity disclosure
      unnecessary for building that trust. A platform can win confidence without asking reviewers to give up their privacy.
  - doi: "10.1177/00222437231193343"
    title: "Is It as Bad as It Looks? Judgments of Quantitative Scores Depend on Their Presentation Format"
    authors: "Lembregts, Schepers, & De Keyser"
    journal: "Journal of Marketing Research"
    year: 2024
    text: >-
      Ratings of drivers, products and hotels can be shown one score at a time, as a running average, or both. In nine
      experiments, when a usually strong performer received one poor score, people judged its overall performance less
      harshly if they saw only the running average, and the mirror pattern held for a weak performer with one good
      score. The effect grew when the odd score seemed more representative, for example because it was recent, an effect the
      authors explain by the average distorting how people perceive the raw score. Choosing how to display ratings is a
      marketing decision in its own right.

