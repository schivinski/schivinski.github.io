title: "Does a first name in an email subject line still raise opens? What a Marketing Letters study found"
dek: >-
  A well-known result says that greeting readers by first name gets more marketing emails opened. Two
  field experiments with German-language emails found no such lift among students, while a formal title and surname did
  win more opens from local and regional politicians.
short_title: "When first-name subject lines stopped working"

description: >-
  Defau and Zauner find putting students' first names in email subject lines did not lift opens or clicks, while a
  title and surname raised politicians' opens.

keywords: [email marketing, email subject lines, personalized subject lines, first-name personalization,
  email open rate, click-through rate, email A/B testing, name personalization, replication study, field experiment,
  Marketing Letters]
topics: [Personalization, Creative]

