sections:
  - h: "What the researchers did"
    body: |
      Retailers add AR try-ons because they help shoppers picture a product on their own feet, face or living room. The usual
      hope is that fewer surprises mean fewer returns. Minghao Li and colleagues at the University of Nottingham Ningbo China
      asked a less comfortable question. If a preview makes a product feel more certain, what happens when the real product
      lets the shopper down?

      Their idea is what they call the virtual idealization paradox. An AR preview makes a product look personal and
      informative, so shoppers fill in what it cannot show, such as fabric texture, fit and small flaws, in a flattering way. That sets
      a higher bar. If the delivered item falls short, the gap between hope and reality is bigger, regret is stronger and a
      return becomes more likely.

      They tested this in four experiments. In each, one group previewed a product with an AR try-on and another saw ordinary
      photos. Then everyone was told, or shown, that the product they received was flawed. The flaw was held constant, so any difference in
      returns came from the preview.
    facts:
      - ["Study 1", "104 students in a lab, a real pair of slightly defective shoes, and a real return code in the box"]
      - ["Study 2", "815 online shoppers in China, shoes previewed by AR video or photos"]
      - ["Study 3", "1,539 shoppers, adding positive reviews to the preview or leaving them out"]
      - ["Study 4", "1,675 shoppers, an interactive shop with a knit scarf shown at low or high realism"]
      - ["Measures", "Return intention on a 7-point scale, expectations, and regret"]

  - h: "A better view, then a harder fall"
    body: |
      In the lab, participants tried on shoes through a shopping app, or looked through six photos. They then opened a box
      holding shoes with small colour differences and workmanship flaws. To return them, they had to scan a code in the box and
      enter their ID.

      Of the people who had used the AR try-on, 65% started a return. Of those who had seen photos, 37% did.

      The online study checked why. People who had seen the AR preview expected more from the product and reported more regret
      once told it was unsatisfactory, and both fed into higher return intention. Once expectations and regret were taken into account,
      the preview format had no direct effect left. In other words, the whole effect ran through the raised bar.
    chart: returns

  - h: "Reviews as a cushion"
    body: |
      The third study asked whether something in the preview could soften the fall. Half the participants saw a stream of positive customer
      comments about the product and the try-on, and half did not.

      Without reviews, AR shoppers wanted to return the flawed shoes more than photo shoppers did. With reviews, the pattern reversed and
      AR shoppers wanted to return them less.

      The authors' explanation is that regret depends on whether the choice still feels justifiable. When other people have praised
      the product, keeping it is easier to defend, and that matters most for AR shoppers, who had the bigger disappointment to
      explain away. They did not measure that justification directly, so it is a reading of the pattern and not a proven step.
    chart: proof

  - h: "Realism closes the gap"
    body: |
      The fourth study changed the preview's quality. Shoppers browsed a scarf in a simulated shop. In the low-realism version, the
      scarf looked smooth with little visible texture. In the high-realism version it showed finer detail and more natural
      variation in the material.

      With low realism, the AR group again showed more return intent for the flawed scarf. With high realism, the difference
      vanished. A richer picture seems to have pulled expectations down to something closer to the physical product.

      The same pattern showed in the mediation analysis. Under low realism, AR raised expectations, which raised regret and return
      intent. Under high realism, that chain was no longer reliable.
    chart: realism

  - h: "What it means for a retailer"
    body: |
      This is not a case against AR. The study only looks at what happens after a product disappoints, which is when a preview
      matters least. If the product is as good as shown, a higher bar is no problem.

      What it does show is that a preview is a promise. Anything it leaves out, such as texture, fit variance or material
      quality, is filled in by the shopper, usually favourably. The practical answer is to make the preview carry more of the
      truth, and to give shoppers a reason to stay comfortable with a decision that was reasonable when they made it.

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["Find where reality drifts", "List the three things customers say were different from what they expected, using your return reasons and reviews. Colour, texture and fit are the usual suspects."]
  - ["Check your preview against the real item", "Place the real product next to your preview on one screen. Note every detail the preview makes look better than the item, and fix the three biggest ones first."]
  - ["Add one honest line to the preview", "Put a short note beside the try-on, such as \"Colour and texture may vary slightly from the screen.\" Keep it to one sentence, in plain words, where the shopper can see it."]
  - ["Put real reviews inside the try-on", "Show your average rating and two recent reviews on the same screen as the preview. Pick reviews that mention fit or feel, and not only praise."]
  - ["Test with and without the changes", "Split visitors evenly, so half see the new preview and half see the old one. Run it for at least four weeks, or until each group has 500 orders."]
  - ["Compare return rates, not just sales", "Count orders returned within 30 days for each group, as a share of orders. Keep the changes if returns fall and sales do not drop by more than you can afford."]

expect:
  - "**Higher conversion, mixed returns.** A try-on can lift sales and still raise returns on items that vary, so track both."
  - "**Bigger effects where the product varies.** Fabric, colour and fit differences leave the most room for a flattering guess."
  - "**Cheap fixes first.** Reviews and a short expectation note cost far less than rebuilding a 3D model."
  - "**Realism takes work.** A more detailed render needs better product data, so start with your highest-return products."

limits:
  - "**Scenarios, not sales.** Apart from the lab study, people imagined receiving a flawed product and reported what they would do. Real returns involve costs and habits the studies do not capture."
  - "**One country.** All the participants were in China, where return norms and trust in reviews may differ from yours."
  - "**Shoes and a scarf.** Furniture, electronics or luxury items may behave differently."
  - "**A flaw was always present.** The studies show what AR does when a product disappoints, not how often that happens in practice."

faq:
  - q: "Does AR increase product returns?"
    a: "Once a product disappointed, yes. AR users showed the higher return intent in all four experiments (Li, Huang, Yuan & Chen, 2026). The studies did not test products that met expectations."
  - q: "Why would a better preview lead to more returns?"
    a: "It sets higher expectations. The bigger the gap between what shoppers expected and what arrived, the more they regret the purchase, and regret leads to returns."
  - q: "How can retailers reduce the effect?"
    a: "Two things worked in the experiments. Showing positive reviews within the preview softened it, and making the rendering highly realistic removed it."
  - q: "Does this mean retailers should drop AR try-ons?"
    a: "No. The paper does not say AR hurts sales or returns in general. It shows a risk that appears when the product falls short, and it points to ways of reducing that risk."
  - q: "Are the results based on real purchases?"
    a: "Only partly. The lab study used real shoes and a real return code, but the three online studies used imagined scenarios and stated intentions."

also:
  - doi: "10.1016/j.ijresmar.2026.04.003"
    title: "Getting hands on(line)? A meta-analysis of the effectiveness of extended realities in online retailing"
    authors: "Uhlendorf, Uhrich, & Völckner"
    journal: "International Journal of Research in Marketing"
    year: 2026
    text: >-
      A meta-analysis of 298 effect sizes from 111 experiments finds that 360-degree views, AR and VR moderately improve consumer
      responses compared with images and videos. The effect is stronger when text overlays the virtual content and for
      experiential shoppers, and weaker for VR on a PC and for familiar brands. Add overlay text to your try-on.
  - doi: "10.1016/j.jretai.2026.08.003"
    title: "Testing the effects of augmented and virtual reality attributes on the customer journey in online retailing: A meta-analysis"
    authors: "Li, Chen, Blut, Yuan, & Huang"
    journal: "Journal of Retailing"
    year: 2026
    text: >-
      A meta-analysis of 126 samples and 36,386 consumers links four AR and VR qualities to different stages of the customer
      journey. Immersion matters most before purchase, vividness at the point of purchase, and presence and interactivity afterwards.
      Match the feature you invest in to the stage you want to improve.

