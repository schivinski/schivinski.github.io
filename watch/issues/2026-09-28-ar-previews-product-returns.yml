short_answer: >-
  They can, when the product turns out worse than the preview suggested. In four experiments where every shopper received a flawed
  product, people who had tried it on in AR were more likely to return it than people who had seen photos. Their expectations had been
  higher, so the letdown stung more. The effect shrank when positive reviews appeared in the preview and disappeared when the
  rendering was highly realistic.

takeaways:
  - "In a lab test with a flawed pair of shoes, 65% of people who had tried them on in AR returned them, against 37% of people who had seen photos."
  - "AR raised expectations first, and those higher expectations produced more regret and then more return intent. Preview format had no direct effect once these two were counted."
  - "Positive reviews shown in the preview removed the extra return intent and reversed it. AR shoppers then wanted to return less than photo shoppers."
  - "A highly realistic preview removed the gap, because it set expectations closer to what the product really looks and feels like."

