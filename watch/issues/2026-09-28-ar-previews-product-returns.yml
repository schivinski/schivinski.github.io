title: "Do AR try-ons cause more returns? What an International Journal of Research in Marketing study found"
dek: >-
  A virtual try-on makes a product feel more certain before you buy. Four experiments show what happens when the real thing
  arrives with a flaw. Reviews and realistic rendering took most of the sting out.
short_title: "AR try-ons can raise returns when the product disappoints"

description: >-
  In four experiments, AR try-on previews raised return intentions after a flawed product arrived. Positive reviews and realistic rendering reduced the effect.

keywords: [augmented reality, AR try-on, product returns, expectation disconfirmation, regret, social proof, visual realism, online retail,
  virtual try-on, e-commerce, consumer expectations, International Journal of Research in Marketing]
topics: [Retail, Research methods]

