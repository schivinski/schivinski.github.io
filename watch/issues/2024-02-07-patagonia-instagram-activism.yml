title: "How can a brand take a stand on Instagram and still come across as authentic? What a Journal of Business Research study found"
dek: >-
  Patagonia hardly uses Instagram to sell. Six months of its posts, and thousands of replies from fans and critics, show what
  authenticity looks like when a brand takes sides on purpose and refuses to back down.
short_title: "How an activist brand stays authentic on Instagram"

description: >-
  Bulmer et al. read 104 Patagonia Instagram posts and 5,541 replies: under 6% sold anything, and social causes showed up
  more often in the most-debated posts.

keywords: [brand activism, brand authenticity, sustainability marketing, Instagram brand posts, Patagonia Instagram,
  activist brands, consumer comments, social media backlash, woke washing, purpose-driven branding,
  Journal of Business Research]
