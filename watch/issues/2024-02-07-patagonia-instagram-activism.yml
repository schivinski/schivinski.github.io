short_answer: >-
  By putting its mission ahead of its products and holding to it when critics push back. Researchers read every post on
  Patagonia's US Instagram account over six months of 2021, 104 in all, and 5,541 replies. The feed showed wild places and
  ordinary people doing good, admitted flaws when asked, and took sides on climate and social justice. Fans praised that
  steadiness, opponents objected loudly, and the authors treat both reactions as part of a genuine stance.

takeaways:
  - "Fewer than 6% of the posts promoted products, holiday deals or discounts; roughly 94% served the brand's mission instead."
  - "Social and community issues, such as diversity and racial injustice, featured in 37.5% of all posts but in 55.2% of the 29 most-discussed ones."
  - "Replies fell into 8 kinds: four warm (inspiration, appreciation, advocacy, respect) and four hostile (disappointment, anger, walking away, and complaints that the brand had gone 'too woke')."
  - "The busiest post drew 347 comments and more than 830,000 views, yet 75 of the 104 posts drew 50 comments or fewer."

