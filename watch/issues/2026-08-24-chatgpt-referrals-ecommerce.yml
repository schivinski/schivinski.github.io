title: "Is ChatGPT a real traffic source for online shops? What a Marketing Science study found"
dek: >-
  A year after ChatGPT began linking to online shops, researchers followed its visitors through 973 e-commerce sites.
  The channel is tiny, and its shoppers convert better than paid social but worse than almost everything else.
short_title: "ChatGPT sends few shoppers, and they buy less often"

description: >-
  Across 973 online shops and $20 billion in sales, ChatGPT referrals made up under 0.2% of traffic and converted below most channels.

keywords: [ChatGPT referrals, LLM traffic, e-commerce channels, conversion rate, average order value, revenue per session,
  generative engine optimization, AI search, last-click attribution, product complexity, digital channels, Marketing Science]
topics: [AI, Retail, Search]

