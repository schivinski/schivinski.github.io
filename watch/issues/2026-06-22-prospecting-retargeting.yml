short_answer: >-
  In the only experiment of its kind, no. Two researchers took over the display budget of a large mattress company
  and randomly varied spending across 210 American media markets for two months, $5.7 million in all. Ads shown to
  people who had never visited the site moved orders reliably on both Google and Facebook. Ads shown to previous
  visitors moved nothing, at any budget level, not even going from nothing to half the usual spend. The platforms,
  meanwhile, were reporting retargeting as the best money the company spent.

takeaways:
  - "Markets where Google retargeting was switched off entirely grew orders by 12.6%. Markets kept at the full budget grew 13.8%."
  - "Prospecting behaved as advertising should: Facebook markets at zero grew 6.3%, markets at full spend grew 16.9%."
  - "Someone who clicked a prospecting ad stayed in the retargeting pool for 45 days and took around two weeks to buy. The last ad they clicked got the credit."
  - "At a 50% contribution margin the model puts the right Facebook prospecting budget at $2.46 million. The company was spending $3.53 million."

