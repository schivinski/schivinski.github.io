title: "Does retargeting actually sell anything? What a Journal of Interactive Marketing study found"
short_title: "The dashboard said 7.47. The experiment said nothing."
dek: >-
  A mattress company let two researchers move $5.7 million of its ad budget around 210 American media markets, then
  counted the orders. Chasing people who had already visited the site produced no measurable sales at all.

description: >-
  Facebook reported a return of 7.47 on retargeting. A field experiment across 210 markets found the retargeting
  budget could be cut to zero without losing a single order.

keywords: [retargeting, prospecting ads, display advertising, attribution, return on ad spend, geo experiment,
  incrementality testing, Facebook ads, Google Display Network, media budget allocation, frequency capping,
  Journal of Interactive Marketing]
