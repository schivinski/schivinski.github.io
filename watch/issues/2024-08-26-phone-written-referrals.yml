short_answer: >-
  Not by itself, but the phone changes what people write. In four experiments with 728 people in Germany,
  refer-a-friend messages typed on smartphones came out shorter and a little less glowing than ones typed on a
  laptop or PC. Short or neutral messages, in turn, left readers less keen to subscribe. Yet when people read real
  referrals from both kinds of device, their interest in signing up was the same.

takeaways:
  - "Phone-typed referrals came out roughly 18% to 20% shorter than laptop or PC ones, both when people picked their own device and when the lab picked it for them at random."
  - "Phone writers also covered less ground: in the lab, their messages touched on 2.6 distinct subjects on average, against 3.2 on a PC."
  - "With real referrals, readers judged the phone-written ones clearly less effortful, 3.49 against 4.18 out of 7, yet their stated chance of subscribing barely differed: 4.47 against 4.48."
  - "Phones are where referrals happen: of 13,425 visits in a year to a large German insurer's online referral page, 59.79% came from smartphones and 36.57% from laptops or PCs."

