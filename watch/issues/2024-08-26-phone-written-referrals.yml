title: "Are customer referrals written on a phone less persuasive? What a Journal of Consumer Behaviour study found"
dek: >-
  Most refer-a-friend messages are now typed with a thumb. Four experiments in Germany show those messages come out
  shorter and a shade cooler, and that short, flat referrals win less interest. Whether the phone itself costs
  sign-ups is a separate question.
short_title: "Why referrals typed on a phone come out thinner"

description: >-
  Wolf et al. find refer-a-friend notes typed on phones run about a fifth shorter and less upbeat than on PCs, and
  short, flat notes cut readers' wish to sign up.

keywords: [customer referral programmes, refer-a-friend, referral marketing, word of mouth, smartphone vs laptop,
  mobile word of mouth, eWOM, message length, message tone, customer acquisition, Journal of Consumer Behaviour]
topics: [UGC, Service]

