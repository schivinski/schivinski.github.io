title: "What makes augmented reality feel real enough to sell? What a Journal of the Academy of Marketing Science study found"
dek: >-
  Putting AR on a website does not by itself make shopping better. Five studies show that people judge a virtual object on
  its looks, its responses and how it sits in the room or on the face, and that a convincing result nudges them towards buying.
short_title: "The three checks that make AR feel real"

description: >-
  Schein et al. find shoppers judge AR on design, responsiveness and fit with its setting; when all three land, the
  product feels present and buying intent rises.

keywords: [augmented reality marketing, AR quality, virtual try-on, AR shopping apps, local presence, product visualisation,
  immersive retail, customer experience, scale development, purchase intention, Journal of the Academy of Marketing Science]
topics: [Retail, Research methods]

