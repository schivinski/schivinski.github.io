short_answer: >-
  Getting three things right at once. Across five studies, people judged an AR object by how well it was designed, how
  smoothly it responded and how naturally it sat in its surroundings. The higher those scores, the more the object seemed
  really there, and the gains ran through that feeling. In a sunglasses try-on with 175 passers-by, it made the app more
  enjoyable, which lifted intent to buy, and more useful, which raised plans to use AR again.

takeaways:
  - "Of 199 candidate statements about what makes AR look right, 13 survived testing: nine about the virtual object and four about whether it felt physically present."
  - "Offered a raffle prize, 42% of 175 try-on users chose the sunglasses they had picked in the app, priced at EUR 200 to 440, over EUR 100 in cash."
  - "A quarter (25%) asked to take the app's details home, and that request grew more likely as confidence in their verdict on the glasses rose."
  - "Among 320 people testing apps on their own Apple devices, prior AR know-how and a vivid imagination had no detectable bearing on whether the object felt real. The overlay's quality outweighed every personal trait tested."

