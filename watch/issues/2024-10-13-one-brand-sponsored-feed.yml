title: "Does an influencer posting ad after ad for one brand put followers off? What a Journal of Marketing Communications study found"
dek: >-
  Brands fear that once a creator's feed fills up with paid posts, followers start to doubt everything on it. An online
  test run in two waves with young US Instagram users found no extra doubt when every post promoted the same new drink,
  but the slow build in wanting to buy it came only from the version where the ad was mixed in with ordinary posts.
short_title: "Why a feed of ads for one brand raised no extra doubt"

description: >-
  Balaban et al. find a run of four paid posts for one drink stirred no more doubt than a single one, but only the lone
  ad lifted buying intent 20 days on.

keywords: [influencer marketing, sponsored posts, influencer advertising frequency, paid partnership disclosure,
  ad saturation, advertising scepticism, sleeper effect, persuasion knowledge, purchase intention, Instagram influencers,
  brand ambassadors, Journal of Marketing Communications]
