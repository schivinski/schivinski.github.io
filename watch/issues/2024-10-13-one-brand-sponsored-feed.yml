short_answer: >-
  Not straight away. In a two-part online experiment, US Instagram users browsed an unknown creator's profile showing
  either a single paid post among three everyday ones or four paid posts back to back, all for the same new energy
  drink. Both groups were equally wary of paid posts and judged the brand alike. Twenty days later, though, only those
  shown the lone ad had grown keener to buy.

takeaways:
  - "Scepticism towards paid influencer posts averaged 4.57 out of 7 after one sponsored post and 4.58 after four, a difference of one hundredth of a point."
  - "Doubt still did damage wherever it came from: each extra point of it went with brand ratings about 0.4 lower and buying intent nearly half a point lower, on seven-point scales."
  - "Over the following 20 days, buying intent climbed by 0.38 points in the group that met one sponsored post and slipped by 0.04 in the group that met four."
  - "Liking for the brand held steady over the same stretch, at 4.29 out of 7 at first viewing and 4.28 at the follow-up."

