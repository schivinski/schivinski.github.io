title: "Does protecting their data make customers happier online? What a European Journal of Marketing study found"
dek: >-
  Customers who feel exposed online worry more, and worry makes them protect themselves. A survey of 706 Americans shows that
  only the steps taken before trouble pay off in how people feel online, and that those worn down by privacy react differently.
short_title: "Why preventing privacy problems beats cleaning up after them"

description: >-
  Quach et al. find that preventive privacy habits, unlike clean-up after the fact, are linked to greater satisfaction online,
  in a US survey of 706 people.

keywords: [data vulnerability, online privacy concerns, privacy fatigue, digital well-being, online well-being,
  privacy protection behaviour, proactive privacy protection, cookie consent, privacy by design, privacy dashboard,
  European Journal of Marketing]
