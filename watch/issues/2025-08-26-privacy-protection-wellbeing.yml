short_answer: >-
  Only the kind that comes first. In a survey of 706 US adults, people who felt their personal data was exposed worried more
  about privacy, and that worry pushed them to protect themselves in two ways. Preventive habits, such as changing cookie
  settings or running security software, went with a more satisfying online life. Cleaning up after the fact, such as deleting
  old posts or asking a firm to erase details, had no link of its own.

takeaways:
  - "Privacy fatigue is widespread: on 3 statements about being tired of online privacy, people averaged 5.1 out of 7, close to their level of privacy worry (5.3)."
  - "For people not yet tired of privacy, feeling more exposed went with online satisfaction about 1 point lower out of 7. For the tired, it changed little, but it started much lower."
  - "Tired users turned worry into damage control faster: their after-the-fact score rose about 0.9 points between low and high worry, against 0.6 for people still fresh."
  - "In simple comparisons, older respondents worried more and reported more prevention, and men reported a little more prevention than women, 5.0 against 4.8 out of 7, a borderline gap."

