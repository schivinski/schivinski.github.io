  caption: "Makkah by night: faith is built into the skyline, and into the posts that promote a city. Photo: Rushdi Fatani on Unsplash."

short_answer: >-
  It helps people approve, more than it gets them talking. We analysed 1,253 posts from Saudi government accounts
  promoting the 2019 Jeddah and Riyadh festival seasons on Twitter, Facebook and Instagram. Religion ran through them, in
  buildings, events and beliefs. Residents answered with likes and shares, above all for posts about what the cities offer
  and what they stand for. Comments, the deeper kind of engagement, stayed rare on every platform.

takeaways:
  - "Of all the government posts, 53% sold the cities on what they offer, such as events, transport and clean streets, and 32% on their character; just 15% were about how the cities look."
  - "Every kind of post scored at least 2.0 on the engagement index on Twitter, while on Facebook nothing went above 0.9."
  - "Comments barely registered: the comment index never passed 0.4 on any platform, and on Twitter it sat at 0.1 or 0.2."
  - "Religion travelled inside events: one government competition, built on the Prophet's call to teach children swimming, archery and horse riding, offered more than US$300,000 in prizes."

