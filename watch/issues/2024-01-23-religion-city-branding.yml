title: "Does religion help a city brand engage residents on social media? What a PLOS ONE study of Jeddah and Riyadh found"
dek: >-
  We looked at how Saudi government accounts drew on faith to promote two city festivals online, and at what residents
  did in return. Religion pulled people in, but mostly as a tap of approval. Real conversation, the kind that lets residents
  help shape their city's brand, hardly happened.
short_title: "Faith wins likes for a city brand, not conversation"

description: >-
  Li et al. coded 1,253 Saudi government festival posts: faith-led content on events and values won likes and shares from
  residents, but very few comments.

keywords: [place branding, city branding, religion in marketing, Islamic values, stakeholder engagement,
  government social media, resident engagement, Saudi Seasons, Twitter engagement, likes shares and comments,
  content analysis, PLOS ONE]
topics: [Social media, Advertising]

