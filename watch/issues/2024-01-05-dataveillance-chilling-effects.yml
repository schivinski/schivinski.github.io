short_answer: >-
  Some do, and the way the data is gathered matters. In an experiment with 604 American and Dutch adults, people read that
  an ad on their phone matched what was on their TV. Those told a hidden sound in the broadcast had tipped off the
  phone planned to cut their TV viewing more than those told it came from browsing data: 4.05 against 3.62 out of 7. Other
  habits did not differ between the two groups.

takeaways:
  - "Swapping TV for something else, such as reading or a podcast, was among the least likely responses: no group averaged above 3.10 on a six-point scale."
  - "Americans were readier than the Dutch to change how they use their phone, 4.30 against 3.96 on that six-point scale, whichever tracking method they had read about."
  - "Americans worried more about privacy than the Dutch, 5.59 against 5.03 out of 7, yet both felt about equally watched when they imagined a personalised ad: 5.19 and 4.96, a gap too small to count."
  - "Trust that advertisers handle personal data well averaged just 2.73 out of 7 in the experiment, far below the midpoint of the scale."

