title: "Do people change their media habits when they learn how ads track them? What a two-country study in the Journal of Business Research found"
dek: >-
  Tell people the ad on their phone was matched to the show on their TV, and some resolve to watch less or lock down their
  phones. A survey and an experiment among American and Dutch adults show which kind of tracking provokes that retreat,
  and who is most likely to make it.
short_title: "When ad tracking makes viewers switch off"

description: >-
  Strycharz and Segijn: 604 US and Dutch adults told an ad was matched by a sound code in TV broadcasts planned bigger
  viewing cuts than if told browsing did it.

