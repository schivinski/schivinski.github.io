title: "Can personalization embarrass your customers? What a Journal of Interactive Marketing study found"
short_title: "When \"just for you\" backfires"
dek: >-
  "Based on your last purchase" sounds helpful until the purchase is weight-loss pills or a tween playlist. Three
  studies show that announcing personalization for products people would rather not be linked to makes them like the
  brand less.
description: >-
  A "recommended for you" weight-loss refill lowered ratings of the pharmacy from 3.79 to 3.02 out of 7. When
  personalization embarrasses customers, and what to do.
