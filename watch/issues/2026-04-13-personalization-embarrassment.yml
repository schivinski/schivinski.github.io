short_answer: >-
  Yes, when the product is one people would rather not be linked to. Shoppers buying weight-loss medicine rated an online
  pharmacy 3.02 out of 7 when it greeted them with a personalized refill reminder, against 3.79 without it; for
  headache pills, personalization made no difference. Students liked a music service less when its "personalized"
  playlists were called "Tween Party". The cause was embarrassment, not privacy worries. The fix is to tailor quietly
  in sensitive categories rather than announce it.

takeaways:
  - "Buying weight-loss medicine, people rated a pharmacy 3.02 out of 7 when it announced a personalized refill, against 3.79 when they found the product themselves."
  - "For headache medicine, personalization made no difference (4.89 against 4.98)."
  - "Students liked a music service less when it labelled the same songs as a personalized \"Tween Party\" playlist (4.47 against 5.13), but not as \"College Party\"."
  - "Embarrassment, not privacy concern or fear of being identified, explained the drop."

