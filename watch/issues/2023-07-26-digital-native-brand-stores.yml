title: "Does opening a brand store help or hurt a digital-native brand's online and supermarket sales? What a Journal of Marketing study found"
dek: >-
  A German cereal brand that began online opened ten shops of its own. Nearby webshop sales fell, supermarkets sold more of
  the brand and more of them stocked it, and total sales grew. Profit was less certain: four stores made a loss once the
  profit lost in the other channels was counted.
short_title: "What a brand's own shop does to its webshop and retailers"

description: >-
  Van Crombrugge et al. find ten brand stores cut a cereal brand's nearby webshop sales by 23%, lifted its supermarket sales
  by 12% and won it new listings.

keywords: [digital-native brands, direct-to-consumer brands, DTC brand stores, brand store entry, omnichannel distribution,
  channel cannibalization, webshop sales, supermarket distribution, synthetic control method, FMCG marketing,
  Journal of Marketing]
topics: [Retail, Research methods]

