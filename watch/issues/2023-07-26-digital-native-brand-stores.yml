short_answer: >-
  Both, in this case. After an online-born German breakfast cereal brand opened ten brand stores, its webshop sales
  within five kilometres of each store fell by about 23% in the next year against a statistical match, while its
  supermarket sales there rose by about 12%. With the stores' own takings counted, total brand sales in those areas were
  about four times what they would otherwise have been. Yet four of the ten stores ended the year in the red.

takeaways:
  - "Every one of the ten stores took sales from the brand's webshop nearby, with falls of between 15% and 36% depending on the area."
  - "Around the stores, 17% more supermarkets stocked the brand than the comparison predicted, and those new listings delivered 28% of the extra supermarket sales."
  - "After opening, the brand stores made 75% of the brand's sales in their areas; the webshop made 15% and supermarkets 10%."
  - "On average, a store had to keep just €1.55 of every €100 it took as profit to cover what the brand lost in its other two channels."

