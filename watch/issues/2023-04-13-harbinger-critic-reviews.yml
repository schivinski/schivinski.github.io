title: "Do glowing early reviews mean a launch will succeed? What a Marketing Letters study found"
dek: >-
  Before release, studios show films to critics, and the reviews that follow read like an early forecast. Five years of
  releases show that praise from some critics is a sign of a weak opening, and that ranking critics by their track record
  sharpens the forecast.
short_title: "When a critic's praise signals a flop"

description: >-
  Loupos et al. find praise from film critics with a poor track record signals a weak opening weekend, in 28,884 pre-release
  reviews of 448 films.

