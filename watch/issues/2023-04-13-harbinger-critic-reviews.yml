short_answer: >-
  Not always, and from some reviewers it means the opposite. Tracking 28,884 critic reviews posted on Rotten Tomatoes
  before 448 films opened, the researchers found that a plain count of positive reviews said nothing about how a film
  would open. Sorting critics by their past record changed that: praise from critics whose favourites usually flopped
  lowered the chance of a strong opening weekend, while praise from critics with a good record raised it.

takeaways:
  - "One more positive review from a critic with a strong record raised a film's odds of a strong opening by 80%; one more from a critic whose favourites tended to flop cut them by about 37%."
  - "Setting aside 20 sleeper films, which opened weakly but succeeded later, made the warning stronger: praise from the worst-record critics then cut the odds by about 43%."
  - "Pans showed a similar but weaker pattern: negative reviews from critics whose dislikes often became hits went with better, not worse, odds of success."
  - "Critics with poor records wrote I, me or my less often when praising a film: 0.18% of their words, against 0.30% for critics with good records."

