title: "Does faster delivery lead to more product returns? What a Journal of Retailing study found"
dek: >-
  Retailers have spent years shaving days off delivery. Order data from a global fashion retailer suggests a parcel that
  arrives early is more likely to go back, and that new customers react to it most.
short_title: "Why a fast parcel is more likely to come back"

description: >-
  Masuch et al. find that in 1.8 million US fashion orders, parcels that came ahead of the average delivery time were sent
  back more, most sharply by new buyers.

keywords: [delivery speed, fast delivery, product returns, ecommerce returns, online fashion retail, return rates,
  first-time customers, order fulfilment, buyer's remorse, cognitive dissonance, Journal of Retailing]
topics: [Retail, Service]

