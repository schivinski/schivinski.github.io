short_answer: >-
  Yes, in fashion at least. Researchers looked at close to 1.8 million single-item orders on a worldwide fashion
  retailer's US website. Parcels that turned up sooner than the usual delivery time came back more often, and so did
  late ones. The rise for early parcels was sharpest among people buying from the shop for the first time. Quick
  delivery seems to leave buyers less time to feel sure about what they chose.

takeaways:
  - "For a new customer, each day a parcel beat the average delivery time raised the chance of a return by 0.36 percentage points. For a returning customer the rise was 0.12 points."
  - "Delays still cost something: every day late added about 0.11 points to the return chance, whether or not the person had bought there before."
  - "Truly quick parcels were rare. Only 7.9% arrived within two days of the order, and the average took 4.93 days."
  - "A follow-up survey of 1,001 US shoppers weighed 10 possible reasons. Just two linked a speedy arrival to a return: second thoughts about the purchase and bad feelings when it landed."

