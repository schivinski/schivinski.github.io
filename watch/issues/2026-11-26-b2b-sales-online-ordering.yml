short_answer: >-
  Because the visits paid off. When small restaurant customers of a large US food distributor started ordering online,
  they moved 28% of their purchases to the website, yet their sales reps cut in-person order meetings by only 9%.
  Reps used the time once spent writing up orders to advise customers, and each account's gross margin grew by
  about 7% a quarter.

takeaways:
  - "Average sales per in-person order fell by $219, while customers bought from 0.22 more product categories each quarter: visits shifted from order taking to advice."
  - "A customer that switched to online ordering returned $269 less product a quarter, and the distributor sold $212 less of it below cost."
  - "Customers whose online orders and rep visits fell in the same week gave a margin lift of $557 a quarter, against $156 for those whose orders and visits rarely coincided."
  - "For every ten customers who moved online, a rep served one more customer, on a typical book of about 40 accounts."

