title: "Why do sales reps keep visiting customers who now order online? What a Journal of Marketing study found"
dek: >-
  When a food-service distributor let its restaurant customers order online, the sales force kept turning up in
  person. Those visits turned from taking orders to giving advice, and each customer became more profitable.
short_title: "B2B sales reps after customers order online"

description: >-
  Nahm et al. find B2B customers moved 28% of purchases online, yet reps cut in-person orders by only 9% and
  quarterly gross margin per customer rose 7%.

keywords: [B2B online ordering, B2B e-commerce and the sales force, hybrid sales model, outside sales reps, sales rep
  visits after online ordering, gross margin per customer, cross-selling in B2B, product returns, food-service
  distribution, online channel integration, Journal of Marketing]
topics: [Retail, Service]

