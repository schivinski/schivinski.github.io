  file: 2025-ingroup-online-condemnation.jpg
  og: 2025-ingroup-online-condemnation-og.jpg
  alt: "Seen from behind, an outdoor crowd raises dozens of hands towards a pale late-afternoon sky, festival wristbands on their wrists and green trees blurred beyond"
  caption: "Speaking up comes easier with your own crowd at your back. Photo: Roberto Rendon on Unsplash."

short_answer: >-
  Their own offence, plus a crowd they think agrees with them. In five experiments with 1,107 people, anger at an offensive
  post turned into a wish to condemn it mainly when people believed their friends or followers felt the same, and when the
  condemnation would be seen. It reached choices too: after a fast-food chain's account posted an insult aimed at Donald
  Trump, conservative-leaning participants more often took a rival chain's gift card.

takeaways:
  - "Willingness to condemn a tweet was about 18% higher, 4.54 against 3.84 (scale 1 to 7), when people thought their friends would take offence as well as themselves."
  - "Anger at a post predicted an urge to call it out only among people who leaned towards thinking their own feed would find it offensive too: above 4.05, where 1 meant strongly disagree and 7 strongly agree."
  - "When a tweet to the candidate blamed for an offensive remark would be private, all four voter groups scored between 1.90 and 2.26 out of 7; the gap between rival camps opened only in public."
  - "In a sixth, hypothetical test, a shirt at half price ($10 instead of $20) still lost ground to a full-price rival after its brand's boss posted an offensive tweet about Barack Obama; only the most conservative participants were unmoved."

