title: "What makes people publicly condemn a post or a brand online? What a Psychology & Marketing study found"
dek: >-
  Feeling offended is only half of it. Across five experiments, the urge to call out an offensive tweet was strongest when
  people believed their own circle shared the offence and would see them speak up.
short_title: "Why online outrage needs an audience"

description: >-
  Rotman et al. find people condemn offensive posts mostly when they think their own circle is offended too: willingness
  rose from 3.84 to 4.54 (1 to 7).

keywords: [online outrage, brand backlash, online condemnation, moral outrage, social media backlash, virtue signalling,
  cancel culture, ingroup signalling, social media crisis management, consumer boycotts, Psychology & Marketing]
topics: [Social media, Advertising]

