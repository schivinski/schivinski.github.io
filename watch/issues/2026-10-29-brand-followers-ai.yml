title: "Which brand followers actually join in, and does it still hold in the age of AI? A Journal of Business Research study of 1,356 social media users"
dek: >-
  A look back at my own machine learning study of people who follow brands online. Four things they believe about a brand
  sort them into five very different kinds of follower, and the logic has aged better than the platforms.
short_title: "Five kinds of brand follower, and why AI hasn't changed them"

description: >-
  Schivinski's machine learning study of 1,356 brand followers found five engagement patterns driven by commitment, and
  they still matter in the age of AI.

