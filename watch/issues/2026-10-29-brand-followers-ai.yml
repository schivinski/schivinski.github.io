sections:
  - h: "What I did"
    body: |
      With AI now part of almost every marketing conversation, this felt like the right paper of mine to revisit, so this
      time the series looks back as well as forward.

      The question was simple. Brands want followers to read, comment, share and post about them. Most research at the time
      looked at people's motives. I wanted to know how what people think of a brand turns into what they do with it on social
      media, and whether those beliefs sort followers into recognisable types.

      Brand pages in Poland shared my survey with their followers. Each person named a brand they follow and answered questions
      about it: how well they know it, what they associate with it, how good they think it is and how loyal they are. They also
      said how often they consume, contribute to and create content about it. Instead of averaging effects across everyone, I
      used a machine learning method, a conditional inference tree, which keeps splitting people on the belief that best
      separates them and ends with rules a manager can read.
    facts:
      - ["Sample", "1,356 social media users who follow a brand, 56.7% women, average age 29"]
      - ["Brands", "282 brands, from drinks and cars to fashion, beauty, retail and hospitality"]
      - ["Beliefs measured", "12 brand equity items: awareness, associations, perceived quality and loyalty, on 1 to 7 scales"]
      - ["Behaviour measured", "17 items on consuming, contributing to and creating brand content, split into low, medium and high"]
      - ["Method", "Conditional inference tree, controlling for age, gender, social media use and brand"]

  - h: "Commitment comes first"
    body: |
      Out of twelve beliefs, the tree kept four. The first split was commitment, a single statement: "I am committed to this
      brand". People who rated it 5 or above on the 7-point scale went one way, everyone else the other.

      For the committed, the next question was familiarity: do they know the brand well? For the less committed, it was
      recognition, then whether the brand's associations were favourable. Perceived quality, for all the attention brands give
      it, did not make the cut.

      Five end points came out of those splits. Brand passionates (625 people) recognise and like the brand without being
      committed. Brand fans (558) are committed and familiar. Low engaged followers (108) recognise the brand but think little
      of what it stands for. Brand curious followers (41) have neither commitment nor strong recognition. Prospect brand fans
      (24) are committed but only partly familiar with the brand.
    chart: types

  - h: "Who creates, and who only watches"
    body: |
      Brand passionates are the quiet majority. Almost nine in ten consumed brand content at a medium level, and more than half
      created little or nothing. They are the audience that watches, likes now and then, and moves on.

      Brand fans did a bit of everything. About one in five contributed at a high level, by commenting and sharing, and almost
      as many created content of their own.

      The surprise was the small groups. A third of the brand curious created a lot, in what looked like learning by doing. And
      among prospect brand fans, committed but still discovering the range, a third were heavy creators too. Low engaged
      followers almost never created anything: two in three stayed at the bottom on creation.
    chart: creators

  - h: "Why I think this matters more in the age of AI"
    body: |
      I collected these data before generative AI was part of every marketing brief. Since then, feeds have been ranked by
      recommendation systems, brand posts can be drafted by a model in seconds, and people ask chatbots about brands instead of
      searching. It's fair to ask whether a survey of brand followers from that era still says anything useful.

      My honest answer is yes, and for a simple reason. The technology decides what lands in front of someone. It does not
      decide whether that person feels committed to the brand, recognises it, knows it well or likes what it stands for. Those
      are human judgements, built slowly, and they are what turns seeing into joining in. When content becomes cheap and
      endless, the scarce thing is not another post. It is a follower who cares enough to answer.

      A second reason makes me fond of this paper now. Much of today's AI in marketing is a black box that scores
      audiences without saying why. A tree like this one is machine learning you can read: if commitment is high and
      familiarity is high, expect a fan. I'd still choose a model a manager can explain over one they have to trust.

      What I would do differently is test it. The tree describes patterns. It cannot prove that raising commitment causes more
      posting, and those people all already followed a brand in one country. If I ran it again, I would add AI-made brand
      content to the mix and see whether committed followers respond to it the same way.

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["Ask the commitment question first", "Survey a sample of your followers with a single commitment statement, rated from 1 to 7. Treat 5 and above as committed and split everyone else into a second group."]
  - ["Add three follow-up questions", "Ask the committed group how well they know your brand. Ask the rest whether they can pick your brand out among others and whether it has favourable associations, each on the same 1 to 7 scale."]
  - ["Fix associations before asking for posts", "Where people recognise you but score your associations at 3 or below, run content about what the brand stands for, such as values, origin and people, before you ask them to share or create anything."]
  - ["Turn passionates into members", "For followers who like you but are not committed, give them a reason to belong: a recurring community format, a members' perk or a weekly question, run for at least eight weeks."]
  - ["Widen what committed followers know", "For committed followers who know only part of your brand, show the rest of the range in a short series, one product or service per post, and invite them to post their own use of it."]
  - ["Track each group separately", "Every month, count comments, shares and posts from each group. Keep a tactic only if its group's activity rises in two months out of three, and re-run the survey every six months."]

expect:
  - "**A loud minority.** Most of your creation will come from committed followers, so treat them as partners rather than as an audience."
  - "**A quiet majority that still counts.** Followers who watch and like are the largest group, and they need reasons to belong before they will post."
  - "**Slow movement.** Commitment and associations change over months, not days, so judge the plan by the quarter."
  - "**Less need for volume.** More posts will not move a follower who does not care, so spend effort on the beliefs first."

limits:
  - "**Patterns, not proof.** The tree finds combinations that go together and cannot show that changing a belief causes more engagement."
  - "**Followers only, one country.** Everyone already followed a brand, and all were recruited through brand pages in Poland."
  - "**Data from before generative AI.** The survey predates AI-made brand content, so how followers respond to it is untested."
  - "**Small groups at the edges.** Two of the five types had fewer than 50 people, so their shares are less certain."

faq:
  - q: "What makes people engage with brands on social media?"
    a: "In this study, four beliefs about the brand did: commitment, recognition, familiarity and favourable associations, with commitment the first and strongest split (Schivinski, 2021)."
  - q: "What are the five types of brand follower?"
    a: "Brand passionates, brand fans, low engaged followers, brand curious followers and prospect brand fans. Passionates and fans together made up more than eight in ten of the people surveyed."
  - q: "Who posts the most about brands?"
    a: "Committed followers. Fans who know the brand well were consistent contributors, and committed followers who were still learning the range had the highest share of heavy creators."
  - q: "Does this still apply now that AI writes and ranks content?"
    a: "The study predates generative AI, so that part is my view rather than a finding. AI shapes what people see, but whether they act still depends on how they feel about the brand."
  - q: "Can I use the questionnaire?"
    a: "Yes. The brand equity and engagement items are listed on the paper page, together with a free copy of the accepted manuscript."

