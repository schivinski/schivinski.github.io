    text: >-
      Comparing 204 matched pairs of AI-run and human-run Instagram accounts, this study finds the same engagement rates and likes, and no gap
      in comments. AI accounts did gain more followers per post, so synthetic creators help reach, while real conversation stays scarce for both.

