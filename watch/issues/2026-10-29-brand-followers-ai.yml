short_answer: >-
  The followers who join in are the committed ones. In my survey of 1,356 people who follow brands on social media, a
  decision tree found that four beliefs about a brand decide how much people read, share and post about it, and commitment
  to the brand comes first. That produced five kinds of follower, from casual fans who mostly watch to committed fans who
  create. Feeds are now ranked and partly written by AI, but those four beliefs are still what moves a person to act.

takeaways:
  - "Commitment splits followers first, and every later step depends on which side of that line someone sits."
  - "Nearly half of followers are brand passionates: they know the brand and think well of it, watch and react, but rarely create."
  - "The most active creators were committed followers, including a small group who love the brand but do not yet know its full range."
  - "Followers who know the brand but rate its associations poorly stay quiet, which makes associations the lever to fix first."

