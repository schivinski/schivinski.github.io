title: "Does the wording of a fake review give its writer away? What a Psychology & Marketing study found"
dek: >-
  Fake reviews mislead shoppers and drain the value from every star rating. An analysis of Amazon reviews finds that one dark
  personality style leaves its fingerprints on the fakes, two others steer clear of them, and a humble badge beats all three.
short_title: "The personality behind fake reviews"

description: >-
  Borghi and Ratcharak find cynical, curt wording marks fake Amazon reviews, while narcissistic and impulsive styles point
  away from fakes, in 21,000 reviews.

keywords: [fake online reviews, fake review detection, Dark Triad, Machiavellianism, narcissism, psychopathy,
  online review fraud, verified purchase, Amazon reviews, natural language processing, electronic word of mouth,
  Psychology & Marketing]
