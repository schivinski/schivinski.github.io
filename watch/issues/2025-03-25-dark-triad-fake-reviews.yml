short_answer: >-
  Partly, but a plain badge says more. Scoring 21,000 Amazon product reviews, half of them labelled fake, for language tied
  to three dark personality traits, two UK researchers found that reviews reading as cynical, negative and short turned out
  to be fakes more often. Wording linked to narcissism or psychopathy went the other way. Yet the verified-purchase label
  separated fakes from genuine reviews far better than any word pattern did.

takeaways:
  - "Each standard step up in Machiavellian wording (swearing, negative emotion, little warmth, few words) went with about 10% higher odds that a review was fake, on our conversion of the model."
  - "Language tied to the other two traits pointed away from fakes: roughly 5% lower odds per standard step for narcissism and 11% lower for psychopathy, on the same basis."
  - "A review from a verified purchase had odds of being fake roughly 20 times lower than an unverified one, by our reckoning from the published estimates: the strongest single signal in the analysis."
  - "Length counted too: doubling a review's word count went with about 29% lower odds that it was a fake (again our conversion)."

