title: "Should a retailer charge the same price online and in store? What a Journal of the Academy of Marketing Science study found"
dek: >-
  When a large Chinese electronics and appliance chain promised one price on its website and in its shops, sales of the
  products involved slipped at first. Eighteen months of sales data show them pulling ahead in both channels within a
  year of the change.
short_title: "One price everywhere: a dip, then a lift"

description: >-
  Zhuang et al. find one price on the web and in stores cost a Chinese electronics retailer online sales at first, then
  lifted them 9.20% by the fourth quarter.

