short_answer: >-
  Yes, if it can ride out a slow start. A big Chinese electronics and appliance seller gave the products it owned
  outright a single price across its website and stores, while comparable products kept separate prices. Online sales of the
  switched products fell at first. By the fourth quarter after the change they were 9.20% higher online and 8.00% higher
  in stores than the comparison suggests. The authors credit shoppers learning they need not check both
  channels.

takeaways:
  - "Across the full year, store sales of switched products rose 3.56% against comparable products; the 1.31% online gain could have been chance."
  - "Online sales took the early hit, down 5.64% in the three months after the switch, and did not turn positive until the third quarter."
  - "The same-price promise on its own lifted online sales 7.47% and store sales 5.34%, while prices forced to move cut online sales 8.52%."
  - "About one customer in five (22.6%) bought 39.89% more of the switched products, while the other 77.4% bought 12.54% less."

