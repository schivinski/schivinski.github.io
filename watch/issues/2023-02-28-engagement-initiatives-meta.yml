title: "Which customer engagement tactics work best, and on which platforms? What a Journal of the Academy of Marketing Science study found"
dek: >-
  Brands ask customers to post, review, refer and vote, or they put on events and stunts meant to delight. Pooling
  hundreds of engagement studies, five marketing scholars show which approach does more, and why the platform can
  change the answer.
short_title: "Tasks or experiences? Engagement, platform by platform"

description: >-
  Blut et al. pool 395 samples covering 434,233 customers: structured tasks engage people more than fun experiences,
  and the platform decides where each fits.

keywords: [customer engagement, customer engagement marketing, task-based engagement, experiential marketing,
  engagement platforms, brand community engagement, review and referral programmes, social media engagement,
  online vs offline engagement, loyalty intentions, meta-analysis, Journal of the Academy of Marketing Science]
topics: [Social media, UGC]

