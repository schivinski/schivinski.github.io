short_answer: >-
  Simple, structured tasks usually do more than staged experiences. Drawing on 395 samples with 434,233 customers, the
  researchers found that asking people to review, refer, share ideas or post did more for enthusiasm and action than
  events built for fun. The platform matters: tasks suit channels people return to and plain formats, while experiences
  hold up better as one-off bursts. Engagement went with stronger loyalty intentions, though less so online.

takeaways:
  - "Tasks such as reviews, referrals and contests accounted for 4% of the variation in how actively customers took part, against 1% for fun experiences."
  - "For enthusiasm, product quality counted for more than either kind of campaign: it overlapped 36% with how keen customers felt about a brand, against 23% for tasks and 14% for experiences."
  - "Active engagement shared 24% of the variation in what customers said they would do next, but only 6% of the spread in what they actually bought or used."
  - "Of the 4 platform traits tested, 2 changed which initiative worked best: how often people come back and how rich the format is. Whether the platform was online or offline did not matter for building engagement."

