short_answer: >-
  Apologise by default, but some complaints are met just as well with a fix. In our online experiment, 564 Facebook
  users in Portugal read an angry post on a brand's page, then the company's answer. Those who came away with a better
  opinion of the brand were less inclined to share the complaint, and that brake worked hardest after an apology. When
  the complaint was about poor service or a deleted comment, explaining the fix worked just as well.

takeaways:
  - "People put the blame squarely on the brand, rating its responsibility at 5.39 out of 7: the kind of preventable crisis in which a brand is expected to own the problem."
  - "Each extra point in people's opinion of the brand after its reply went with a 0.18-point drop in their readiness to share the complaint, with age and gender held constant."
  - "The wish to pass the complaint on still averaged 3.69 after the reply, a little under the scale's midpoint of 4: a reply works as a brake, not an off switch."
  - "In 2 of the 3 kinds of complaint we tested, a customer service failure and a deleted critical comment, the apology's advantage vanished and a corrective reply performed on a par with it."

