title: "Should a brand say sorry or promise a fix when an angry complaint starts spreading on social media? What a Journal of Marketing Communications study found"
dek: >-
  We put a furious Facebook post about a brand in front of 564 people in Portugal, followed by the company's response.
  A good response made them think better of the brand, and that left them less keen to spread the post. Saying sorry gave
  this the most force overall; for a service slip or a deleted comment, describing the fix did as well.
short_title: "Sorry or fixed: answering an online firestorm"

description: >-
  Langaro et al. tested brand replies to an angry Facebook complaint with 564 users: an apology curbed sharing best,
  but a fix matched it for service failures.

