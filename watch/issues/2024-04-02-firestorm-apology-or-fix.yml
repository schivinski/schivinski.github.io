    title: "A Topic-Based Segmentation Model for Identifying Segment-Level Drivers of Star Ratings from Unstructured Text Reviews"
    authors: "Kim et al."
    journal: "Journal of Marketing Research"
    year: 2024
    text: >-
      A new machine learning model reads the text of online reviews and works out which words really push star ratings up
      or down, while grouping businesses whose customers care about different things. Run on Yelp reviews of 5,241
      restaurants in Arizona, it found three such groups, each with three to five topics that mattered most, and it
      predicted ratings better than six rival models. Reading reviews group by group, instead of watching the average star
      score, shows which complaint is costing which kind of business.
  - doi: "10.1002/jcpy.1418"
    title: "The mobile giving gap: The negative impact of smartphones on donation behavior"
    authors: "Hock et al."
    journal: "Journal of Consumer Psychology"
    year: 2025
    text: >-
      People were less likely to give to charity on a smartphone than on a computer, and the gap showed up in all three
      studies. One asked for real money, another traced the drop to people thinking less about others while on their
      phones, and Google display ads run in the field showed the same pattern. Appeals centred on the people being helped
      narrowed it. A donation page that converts on a laptop may need a different pitch on a phone.

