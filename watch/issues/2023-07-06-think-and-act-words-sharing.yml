title: "Which words make a brand's social media post more shareable? What a Journal of Consumer Psychology study found"
dek: >-
  Posts that ask readers both to choose well and to get going earned more shares, but only when their language stayed
  abstract. Text analyses of brand and customer posts on Facebook and Twitter and three studies with US adults back the
  pattern, with a caveat for customers' own replies.
short_title: "Posts that pair choosing words with action words"

description: >-
  Pham et al. find brand posts pairing be-right words like right with action words like get earned more shares when the
  wording around them stayed abstract.

keywords: [social media sharing, shareable content, social media copywriting, brand posts, abstract language,
  construal level, regulatory mode, assessment and locomotion, regulatory fit, retweets, text analysis,
  Journal of Consumer Psychology]
