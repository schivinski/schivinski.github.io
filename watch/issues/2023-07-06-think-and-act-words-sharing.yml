short_answer: >-
  Words that ask readers to get it right (right, perfect, compare) placed next to words that ask them to get moving
  (get, go, start) were linked to more sharing, but only when the rest of the post was abstract and big-picture. The pattern
  appeared in Facebook posts and tweets from 100 global brands, and in online studies where US adults first answered
  "why" rather than "how" questions, or pictured a place far from home.

takeaways:
  - "Only 4.24% of 210,963 Facebook posts from 100 global brands contained both a be-right word and an action word, and only 2.88% of their 311,365 tweets did."
  - "On Facebook, more of the paired wording went with more shares in the 42.83% of brand posts with the most abstract language, and with fewer shares in the most concrete 7.64%."
  - "After answering \"why\" questions, people listing their thoughts on an ad with both kinds of words wrote 24.47 words on average, against 18.45 to 20.31 words for the other versions, a sign of closer attention."
  - "Across 377,086 replies written by customers to the same brands, more paired wording was tied to fewer retweets for 86.06% of replies, and to more retweets only in the most abstract 0.45%."

