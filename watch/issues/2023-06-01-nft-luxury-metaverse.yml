short_answer: >-
  For what an item could be resold for, and for what it says about its owner. Among 469 users of Fortnite, Roblox,
  ZEPETO and similar platforms in the US and South Korea, both motives went with closer attention to whether a luxury
  NFT was genuine and rare. Rarity and proof of authenticity went with a stronger expected boost from buying and a
  stronger fear of missing out. Both feelings went with plans to spend more on luxury fashion.

takeaways:
  - "Platform habits split by country: 69.2% of the 146 US users played Fortnite against 13% of the 323 Korean users, while 46% of the Koreans used ZEPETO against 6.2% of the Americans."
  - "South Korean men rated resale value as a reason to collect luxury NFTs at 4.63 out of 7, South Korean women at 4.08, about the scale's midpoint, which stands for neutral."
  - "Among the 146 US users, a luxury brand that matched the person they wanted to be was linked to buying plans inside the metaverse but not to plans for luxury spending offline."
  - "Of all the links compared between the two countries, just 1 differed significantly: proof of authenticity mattered more for Korean users' fear of missing out."

