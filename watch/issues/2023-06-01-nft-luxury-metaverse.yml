title: "Why do people buy luxury fashion NFTs in the metaverse? What a Psychology & Marketing study found"
dek: >-
  Luxury houses now sell handbags, sneakers and outfits that exist only on avatars. Surveying people who use metaverse
  platforms in two countries, researchers tied the wish to buy them to two things a brand controls: proof that an item
  is genuine, and how few copies exist.
short_title: "Why rarity and proof sell luxury NFTs"

description: >-
  Sung et al. find that among 469 American and Korean metaverse users, rare and blockchain-verified luxury NFTs were
  tied to stronger intent to buy luxury.

keywords: [luxury NFTs, NFT marketing, metaverse marketing, digital fashion, virtual fashion for avatars,
  blockchain authenticity, scarcity marketing, fear of missing out, avatar self-image, cross-cultural luxury consumers,
  Psychology & Marketing]
topics: [Retail, Social media]

