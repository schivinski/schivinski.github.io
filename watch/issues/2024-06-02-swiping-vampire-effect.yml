short_answer: >-
  They get looked at for longer but, on this evidence, remembered less. In an eye-tracking experiment, 36 people scrolled
  their own social feeds at home twice, once with their usual grip and once with the one they rarely use. The unfamiliar
  grip slowed them down, so sponsored posts held their gaze for longer. Yet the brands behind those posts were named less
  often afterwards. Steering the phone seemed to use up the attention the ads needed.

takeaways:
  - "Of the 30 people filmed at home, 24 were thumb swipers, scrolling with the hand that held the phone; the other 6 were index swipers, using the free hand to move the feed."
  - "Eyes stopped on each sponsored post about 4.2 times when the grip felt least natural, against about 2.9 times when it felt most natural."
  - "Only 19 of the 411 sponsored posts that crossed people's screens had their brand named afterwards without a prompt, 4.6% of the ads seen."
  - "In 68% of cases, people rated their two sessions at least 4 points apart on a 0 to 6 scale of typicality, so the switch was clearly felt."

