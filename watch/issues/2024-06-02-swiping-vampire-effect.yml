title: "Do ads that make people swipe in an unfamiliar way get remembered better? What an International Journal of Advertising study found"
dek: >-
  Ad formats that ask for a new finger movement are often sold as a way to stop the scroll. An eye-tracking experiment run in
  people's own living rooms suggests they do hold the eyes, and may lose the brand along the way.
short_title: "Odd swipes: more looks, less brand memory"

description: >-
  Rohrbach et al. find that scrolling a feed with a rarely used grip kept eyes on sponsored posts longer, yet brands were
  recalled less, in an at-home test.

