title: "Which influencers bring new followers to a brand's account at a product launch? What a Journal of Business Research study found"
dek: >-
  When a big video game comes out, its official account wants the fans that gamers and commentators already have. More than
  two million launch tweets show which kind of influencer actually sends their audience across, and which common
  assumptions about picking creators did not hold up.
short_title: "Which influencers move their fans to your account"

description: >-
  Benevento et al. follow 197 influencers through three game launches on Twitter: those drawing more likes and sitting at
  the hub of the chatter moved more fans.

keywords: [influencer marketing, product launch, brand follower growth, influencer selection, social network analysis,
  Twitter influencers, engagement rate, degree centrality, video game marketing, micro-influencers,
  Journal of Business Research]
topics: [Influencers, Social media]

