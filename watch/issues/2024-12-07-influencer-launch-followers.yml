short_answer: >-
  The ones whose audiences react, and who sit at the centre of the conversation. Across three big video game launches on
  Twitter, 197 influencers were tracked from 20 days before release to a month after. Those whose posts drew more likes
  and retweets for the size of their audience, and who had more direct links in the launch chatter, saw more of
  their followers move to the game's official account. Sheer follower count made no difference.

takeaways:
  - "On average, 0.75% of an influencer's followers, about one person in 130, went on to follow the game's own account during the launch window."
  - "About half of what these influencers posted (50%) was entertainment and one post in seven (14%) was informative, yet neither mix changed how many followers crossed over."
  - "Influencers who follow a great many accounts did worse: the average influencer followed 1,418 accounts, and a longer list went with a smaller share of fans moving across."
  - "Together, the factors in the model explained 44% of the differences between influencers, and the result survived three alternative ways of running the numbers."

