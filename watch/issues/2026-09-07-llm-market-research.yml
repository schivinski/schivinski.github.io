title: "Can AI answer your survey for you? What a Marketing Science study found"
dek: >-
  Asking a chatbot to play your customers is cheap and tempting. Mixed in carelessly, those answers make your results worse.
  Used with a correction, they can cut the number of real people you need to ask.
short_title: "AI survey answers help, if you correct them"

description: >-
  Pooling AI-generated answers with real customer answers can bias a preference study. A correction method kept the AI's help and saved up to 80% of real data.

keywords: [large language models, market research, conjoint analysis, synthetic respondents, data augmentation, consumer preferences,
