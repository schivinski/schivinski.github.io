title: "Do long-time followers trust an influencer's sponsored posts more? What a Journal of Current Issues & Research in Advertising study found"
dek: >-
  Brands count every follower as the same, whether they joined last week or years ago. A German experiment suggests the bond
  with a creator takes months to form, and that the newest fans size up a paid post much as strangers do.
short_title: "Why an influencer's newest followers are slow to be persuaded"

description: >-
  Breves and Liebers find people who had followed an Instagram creator for at least four months rated them more credible and
  their paid post more convincing.

keywords: [influencer marketing, long-term followers, parasocial relationships, parasocial interaction, influencer credibility,
  sponsored posts, Instagram influencers, follower loyalty, choosing influencers, purchase intention,
  "Journal of Current Issues & Research in Advertising"]
