short_answer: >-
  Yes, once the bond has had time to grow. In an online experiment, 217 Instagram users in Germany viewed an advert from a
  creator they either did not follow or had followed for a given stretch of time. Those who had been following for four months
  or longer judged the creator more credible and the post more convincing. Anyone with a shorter history reacted much like
  someone who did not follow at all.

takeaways:
  - "Following length accounted for about 25% of the spread in credibility ratings and about 22% of the spread in how absorbed viewers felt by the advert."
  - "Ten of the 51 long-term followers had reached the deepest stage of attachment, where being a fan is part of who they are. Across the 166 people in the other three groups, just 1 had."
  - "Mid-term followers were the keenest to buy, 0.94 of a point ahead of the two shorter-standing groups on a scale running from 1 to 7."
  - "Credibility carried most of the effect on buying plans: the indirect route through trust in the creator was about 6 times stronger than the route through feeling drawn in (0.19 against 0.03)."

