short_answer: >-
  Only while the brand's personality is still taking shape. In two experiments with 439 young adults in Germany, a car
  brand with a less distinct personality was rated more sincere on a sincere micro-influencer's page and more exciting on
  an exciting one's. Brands with a clear personality gained nothing from a matching influencer. Their own trait scored
  higher beside an influencer with the opposite personality, which also raised buying interest among people who saw
  themselves in the brand.

takeaways:
  - "The car brand with the vaguest personality scored 4.14 out of 9 for sincerity when it appeared beside a sincere micro-influencer, against 3.23 when people saw it with no influencer."
  - "A brand already known for sincerity reached 6.21 on the 1 to 9 sincerity scale next to an exciting micro-influencer, compared with 5.63 next to a sincere one."
  - "Personality fed through to buying interest only among people who felt the brand suited them. For them, the sincere influencer added 1.13 points to purchase intentions for the less distinct brand, through its higher sincerity, on a scale running from 1 to 9."
  - "How credible, attractive or expert the influencer seemed did not measurably change brand personality ratings in either of the 2 experiments."

