title: "Should a brand pick micro-influencers who match its personality? What an Australasian Marketing Journal study found"
dek: >-
  Whether an influencer should mirror a brand depends on how firmly people already picture it. In experiments run in
  Germany, one car brand with a vague image absorbed the traits of the creator who showed it, while brands with a settled
  image were rated even higher on their own trait beside a creator unlike them.
short_title: "Influencer fit and brand personality"

description: >-
  Zwicker et al. find a brand with an unclear personality absorbs its micro-influencer's traits, while clearly defined
  brands gain most from a mismatched one.

keywords: [micro-influencers, brand personality, influencer-brand fit, influencer brand congruence, brand personality
  transfer, novice brands, established brands, assimilation and contrast effects, ceiling effect, influencer selection,
  Australasian Marketing Journal]
topics: [Influencers, Social media]

