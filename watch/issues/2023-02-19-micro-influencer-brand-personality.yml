sections:
  - h: "What the researchers did"
    body: |
      Sebastian Zwicker of Germany's Kiel University of Applied Sciences,
      Liudmila Tarabashkina of the University of Western Australia,
      Michael Proksch of H2O.ai in Mountain View, California, and
      Marco Hardiman, also of Kiel University of Applied Sciences,
      asked how a brand's personality changes when it turns up on the page of a micro-influencer, a creator with a
      modest following. Such creators often share brand content without being asked, so brands have little say over who
      shows them.

      The idea behind the study comes from a principle in social psychology called context effects: people judge an object partly
      by the setting in which they meet it. The team treated an influencer's profile page as that setting. If people know
      little about a brand, they should absorb the traits the page suggests, which is assimilation. If they already hold a
      firm view of the brand, a page that clashes with it should make the brand's own trait more visible, which is
      contrast. The authors added a third case, a ceiling: a page that matches a well-known brand should leave its image
      unchanged.

      Participants first saw an influencer's page on its own and rated her personality. After a short task about their
      social media use, they saw the page again, now with a car brand in the top-right corner, and rated the brand. A
      control group saw the brand without any influencer. The check worked: in Study 1, the sincere influencer averaged
      7.26 for sincerity, against 3.04 for her exciting counterpart.
    facts:
      - ["Participants", "439 young adults recruited through German universities: 165 in Study 1 and 274 in Study 2"]
      - ["Influencers", "Two invented female micro-influencers on Facebook-style profile pages built from stock photos, one designed to look sincere and one exciting"]
      - ["Brands", "Real car brands: KIA, which scored lowest on both traits of three candidates in a pilot, then Mercedes-Benz as a clearly sincere brand and Ferrari as a clearly exciting one"]
      - ["What changed", "Whether the brand was shown with the sincere influencer, the exciting influencer or neither"]
      - ["Measured", "Brand sincerity and excitement, purchase intentions and self-brand connection, each rated from 1 to 9; the influencer's credibility, attractiveness and expertise as controls"]
      - ["Pilots", "Three pilot studies with 390, 50 and 34 people chose the two profiles and the three brands"]

  - h: "The vaguer brand takes on the influencer's traits"
    body: |
      The first experiment used the brand whose personality the pilot group found least distinct. Next to the exciting
      influencer, it scored 4.16 for excitement, against 3.44 in the control group, who saw no influencer. The sincere page
      had a stronger effect on sincerity ratings: the influencer condition explained roughly 10% of their variation
      (η² = .10), twice the share found for excitement (η² = .05).

      In the authors' reading, people knew too little about this brand's character, so they took their cue from the page
      around it. Both influencer personalities were absorbed, which means the same mechanism could attach a
      trait the brand would rather not have.
    chart: novice

  - h: "A well-known brand reacts differently"
    body: |
      The second experiment swapped in two brands with clear personalities. The brand known for excitement was rated
      6.96 for excitement on the sincere influencer's page, against 5.77 with no influencer and 5.46 on the exciting
      influencer's page. This was the largest effect in the study (η² = .14). The brand known for sincerity mirrored this,
      with its highest sincerity score when paired with the exciting influencer.

      Two results matter here. A matching influencer produced no significant change for either brand, against no
      influencer at all. The authors call this the ceiling: the page only confirms what people already believe about the
      brand. A mismatched influencer, by contrast, did not weaken the brand's image. In the authors' account, people compared the page
      with their existing picture of the brand, and the brand's own trait came out stronger.
    chart: established

  - h: "Who becomes more willing to buy"
    body: |
      Purchase intentions moved only through brand personality, never directly from seeing the influencer, and only for
      people with a strong self-brand connection. That is the sense that a brand fits who you are and helps you show it to
      others.

      For the brand with the vaguer image, the exciting influencer's indirect lift among these people was 0.40 points on
      the nine-point scale, smaller than the sincere influencer's. For the well-known brands, the mismatched influencer added 0.72 points for the sincere
      brand and 0.53 for the exciting one among those strongly connected people. The matching influencer's indirect
      effect was not significant for either. In Study 1 the model explained 48% of the differences in purchase
      intentions between participants; in Study 2 it explained 44% and 58% for the sincere and exciting brands.

  - h: "What did not explain the results"
    body: |
      The two influencers differed in how credible, attractive and expert they seemed, so the authors tested whether these
      qualities, rather than personality, drove the brand ratings. In both experiments none of the three had a
      significant effect. Each quality was captured by one question only, the authors point out, and neither profile was
      built to look untrustworthy.

  - h: "The authors' advice"
    body: |
      Brands whose personality is still forming can gain from unpaid posts by micro-influencers, but they cannot choose
      whose traits they absorb. The authors suggest watching which creators share the brand and putting more money into
      paid channels the brand controls, to establish the personality it wants.

      For established brands, paying a matching creator mainly holds the existing image in place, a result the authors
      regard as no return for brand personality. Established brands are not entirely safe either: people who barely know
      such a brand may absorb an influencer's traits instead of contrasting with them, so the authors recommend a brand
      personality survey every year or every quarter to catch misperceptions. Long-term paid partnerships with mismatched creators call for care, in their view, until more research is done.

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["Score your brand's personality first", "Ask 50 customers to rate your brand from 1 to 9 on two sets of words: honest, down-to-earth and reliable, then daring, spirited and cool. If most scores sit near the middle, treat your brand's personality as still taking shape."]
  - ["Choose the one trait you want to own", "Pick the single trait you want people to name first when they think of you. Make it the first line of each brief you send to creators."]
  - ["Match creators to that trait while you are new", "If your scores were middling, shortlist only small creators whose last 20 posts show the trait you chose. Leave out anyone whose page projects a trait you would not want linked to your name."]
  - ["Add a contrasting creator if you are known", "If your scores are already high on one trait, book one or two creators with the opposite style next to your usual picks. Keep the product and offer identical, so the creator is the only difference."]
  - ["Log unpaid posts every week", "Search your brand name and tags on each platform once a week and list the small accounts that posted you. Note the trait each page projects. If the wrong one keeps showing up, run more posts on your own channels that show the trait you want."]
  - ["Repeat the survey every quarter", "Rerun the 1 to 9 survey with 50 new customers every three months. Compare the scores before and after each creator push, and also ask whether the brand suits them, because buying interest tends to follow that sense of fit."]

expect:
  - "**Gains on the brand's own trait.** For brands people already knew well, a contrasting creator strengthened the trait the brand was known for. It did not move the brand towards the creator's personality."
  - "**Little change from matching creators.** A creator who mirrors an established brand is likely to hold its image steady rather than lift it. Any case for booking one rests on other aims, such as reach, which is our own inference and was not measured."
  - "**Buying interest moves in a narrow group.** Purchase intentions rose only in the group that felt the brand fitted them, so expect smaller shifts across a whole audience."
  - "**Exposure for newer brands.** Because a brand without a settled image absorbs whatever a creator's page projects, unpaid posts from a poorly matched creator could attach an unwanted trait. The authors raise this risk; it was not tested directly."

limits:
  - "**One category.** All three brands were car makers. Measuring intentions to buy such a high-priced item may itself be unrealistic, the authors concede. Other categories are untested."
  - "**Young German participants.** Both samples came from German universities, with average ages between 22 and 24."
  - "**Mock-up pages, one viewing.** People saw invented profiles once in an online survey. Real feeds, repeated exposure and creators people actually follow may behave differently."
  - "**Two traits, one platform, one gender.** Only sincerity and excitement were tested, on Facebook-style pages, with female influencers."
  - "**Short-term effects only.** Whether a long run of posts by mismatched creators would eventually wear down an established brand's personality is open, as the authors acknowledge."
  - "**Intentions, not purchases.** People reported their buying intentions; no sales were tracked."

faq:
  - q: "Can micro-influencers change how people see a brand's personality?"
    a: "Yes, in these experiments, though the direction depended on the brand's existing image. The brand with a vaguer image was rated closer to the influencer showing it, whereas the brands with a firm image gained on the very trait they were known for when shown with an influencer unlike them (Zwicker et al., 2024)."
  - q: "Does a close influencer-brand fit always help?"
    a: "Not on this evidence. A matching influencer helped a brand whose personality was still unclear, but for brands with an established personality the match produced no measurable change in how the brand was seen or in buying interest."
  - q: "What does brand personality mean?"
    a: "The set of human traits people attach to a brand. Researchers often measure it with scales for traits such as sincerity (honest, down-to-earth, reliable) and excitement (daring, spirited, cool), the two used here."
  - q: "What is a ceiling effect in influencer marketing?"
    a: "The authors' term for what happens when an influencer's personality matches a familiar brand with a settled image. The page only confirms the existing image, so the brand's personality ratings stay where they were."
  - q: "Should established brands hire influencers who do not match them?"
    a: "The short-term results were positive: a mismatched influencer strengthened the brand's own trait and, among those who felt connected to the brand, its purchase intentions. The authors still advise care with long-term deals, because the lasting effect of repeated mismatched endorsements was not tested."

also:
  - doi: "10.1111/ijcs.12898"
    title: "The effects of influencer type, regulatory focus, and perceived authenticity on consumers' purchase intention"
    authors: "Ren, Lee, & Chun"
    journal: "International Journal of Consumer Studies"
    year: 2023
    text: >-
      Are celebrities or everyday creators better at selling products on social media? In three between-subjects
      experiments with consumers in China, South Korea and the United States, products recommended by influencers who
      were not celebrities drew higher purchase intentions than those recommended by celebrities. The advantage appeared
      among prevention-focused consumers but not among promotion-focused ones, and perceived authenticity
      explained the pattern. For an audience that worries about getting a purchase wrong, a celebrity could be the weaker
      choice.
  - doi: "10.1002/cb.2141"
    title: "Consumer privacy concerns in entrepreneurial contexts: Evidence from an online experiment"
    authors: "Xu et al."
    journal: "Journal of Consumer Behaviour"
    year: 2023
    text: >-
      An online experiment with 373 college students asked whether people worry more about their data with a start-up
      than with a mature firm when both declare that they protect privacy. They did: privacy concerns were higher towards
      the start-up. When customers were invited to take part in designing the privacy protection mechanisms, concern
      towards the start-up fell significantly. A young company may reassure customers more by involving them in its data
      rules than by publishing a promise.

