title: "What happens when a brand's chatbot lets customers down? What a Journal of Product & Brand Management study found"
dek: >-
  A failed chatbot chat damages two things at once, the brand and the bot. A survey of 238 people and 36 interviews show
  they cause different reactions, which need different responses.
short_title: "When the chatbot fails, the brand takes the blame"

description: >-
  A survey of 238 people and 36 interviews show a failed brand chatbot hurts feelings and trust through the brand, and behaviour through the bot.

keywords: [chatbots, negative brand engagement, expectation violation, customer service, service failure, brand trust, negative word of mouth,
  disengagement, branded chatbots, customer experience, Journal of Product & Brand Management]
topics: [AI, Service]

