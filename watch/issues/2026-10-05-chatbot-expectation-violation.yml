short_answer: >-
  The damage splits in two. When people feel the brand let them down, they respond with stronger feelings and doubts about the brand's
  intentions. When they feel the chatbot let them down, they act, by recommending it less, complaining or warning others. A
  bad chat can also push people to quiet withdrawal and indifference. In interviews, people with a good history with the brand were more
  likely to complain privately and constructively.

takeaways:
  - "After a failed chat, a bigger fall in trust in the brand went with more negative feelings and more doubts about the brand. It had no clear link to behaviour."
  - "A bigger fall in confidence in the chatbot went with more action against the brand, both helpful (feedback) and harmful (warning others)."
  - "Negative engagement is not always loud. Some interviewees went numb, saying they felt nothing and simply would not use the brand again."
  - "Interviewees who had a good history with the brand were more likely to complain in private and offer feedback."

