short_answer: >-
  Yes, when the influencer is clearly the bigger name. Two online experiments, with 400 adults in all, found that an
  influencer who announced a collaboration with a creator who had far fewer followers was seen as more altruistic and
  less self-serving. A lower-ranked brand partner also cut the self-serving impression but added no sense of altruism, an
  outcome the authors link to brand deals being seen as business. Equal or bigger partners did no harm and brought no benefit.

takeaways:
  - "Of 10,638 Instagram posts by 50 influencers over six months, 64% tagged at least one other account."
  - "Roughly three-quarters of the influencers analysed (33 of 43) worked mostly with peers who had fewer followers than they did."
  - "An influencer with 86,000 followers who teamed up with a 2,600-follower peer scored 5.09 (of a possible 7) for wanting to help, against 4.13 when the partner had 87,000 followers."
  - "Choosing a brand with a lower status score as partner reduced how self-serving the influencer seemed, yet ratings of wanting to help the brand stayed between 4.19 and 4.35 out of 7 in all four pairings."

