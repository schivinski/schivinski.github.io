title: "Does teaming up with smaller creators make an influencer look less self-serving? What a Psychology & Marketing study found"
dek: >-
  Influencers often tag other accounts, and how big the partner is shapes how the move is read. Two experiments
  find that working with a smaller creator makes an influencer seem less self-interested and more willing to help,
  while working with a smaller brand only does the first.
short_title: "Why bigger influencers gain from smaller partners"

description: >-
  Thomas et al. find influencers who team up with smaller creators seem less self-serving and more altruistic, while
  smaller brands only ease the first.

