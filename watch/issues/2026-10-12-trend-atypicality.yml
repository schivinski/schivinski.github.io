short_answer: >-
  Put your own spin on it. Across 85,000 TikTok dance-trend videos, those that differed more from the rest of the trend earned more
  likes per view, even for the same creator. Experiments confirmed that the difference was the cause, and a test with 38 real creators
  agreed. The edge appears once viewers have seen the trend enough to spot the twist, and it came from deviations later in the video.

takeaways:
  - "More atypical videos earned more likes per view. Among the videos in the study, the most atypical earned about 112 likes per 1,000 views, against about 92 for the most typical."
  - "The advantage grew as a trend got older and more videos were out there. In an experiment, the twist only paid off when viewers had seen the trend first."
  - "Twists in the last part of a video went with more engagement, and twists in the first seconds did not."
  - "Viewers did not get bored of the standard version. They saw the twisted one as more unique and its creator as more creative."

