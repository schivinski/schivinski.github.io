title: "How closely should a brand copy a trend? What a Journal of Marketing study of 85,000 TikTok videos found"
dek: >-
  Brands and creators jump on trends to get noticed. Across a large video analysis, three experiments and a creator field test,
  the version with a twist beat the faithful copy.
short_title: "Trend videos with a twist beat close copies"

description: >-
  An analysis of 85,000 TikTok dance videos plus three experiments finds that putting your own spin on a trend earns more likes than copying it closely.

keywords: [trend-following, atypicality, TikTok, short video, social media engagement, video analytics, content strategy, creators,
  brand content, social media marketing, Journal of Marketing]
topics: [Social media, Creative]

