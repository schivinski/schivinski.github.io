short_answer: >-
  Mostly the practical offer. Pooling 54 studies with 24,580 respondents, the researchers found that affordable prices, standout
  features and a good location were most closely tied to how highly travellers rated a peer-to-peer stay, and that this quality
  judgement went with choosing to book. In a model weighing every factor together, the website, quick replies and photos
  came next. Social pulls such as meeting locals added little once the rest were counted.

takeaways:
  - "Across 46 studies and 22,069 respondents, the practical offer of price, features and place showed the strongest tie to perceived quality of the 4 groups of factors tested."
  - "Letting each factor act on booking directly, and not only through perceived quality, lifted the part of booking the model could account for from 33% to 58%."
  - "Social pulls, such as getting to know the host or feeling part of the neighbourhood, were the only group whose own route to booking fell short of significance once the other 3 were counted."
  - "All 5 links in the model were significantly stronger in studies run in developed countries than in those run in developing countries."

