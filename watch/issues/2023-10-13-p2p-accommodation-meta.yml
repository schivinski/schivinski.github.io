title: "What drives travellers to book peer-to-peer accommodation? What a Psychology & Marketing study found"
dek: >-
  Home-sharing platforms promise lower prices, distinctive homes and the chance to live like a local. A meta-analysis of
  the survey evidence finds that the practical offer and the listing page carry the most weight in how guests judge a stay,
  while the social promise adds little once those are counted.
short_title: "What gets a home-share booked"

description: >-
  Ashaduzzaman et al. pool 54 studies of peer-to-peer stays: price, features and location tie most closely to perceived
  quality, which in turn goes with booking.

keywords: [peer-to-peer accommodation, Airbnb booking drivers, home sharing, short-term rental marketing, sharing economy,
  perceived service quality, holiday rental listings, listing photos and website design, stimulus-organism-response model,
  meta-analytic structural equation modelling, meta-analysis, Psychology & Marketing]
topics: [Service, Research methods]

