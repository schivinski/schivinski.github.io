short_answer: >-
  Often, yes, for anyone whose size is far from the model's. Across 11 studies with about 5,950 people, mostly women in
  the UK, the further a shopper's usual size sat from a slim model's, the less she saw herself in the photo, the more she
  doubted the fit and the less keen she was to buy. Showing clothes on a model in her own size eased that doubt, and so
  did letting her pick the model.

takeaways:
  - "Faced with a slim model wearing jeans, women in the first study rated the model's body as like their own at just 2.60 out of 7 on average, and lower still the bigger their usual size."
  - "With a real dress or up to £25 in cash at stake, an own-size model made women surer of the fit, and that raised their bids; a more inclusive brand image did not."
  - "Of four tops on the page, only 53 women, about one in eight, chose the one worn by the larger model, and those who did tended to wear larger sizes themselves."
  - "The 64 students who picked their own model, from sizes XS to XL, did as well as those shown a model in their size, and an exploratory check gave them the best shopping experience of any group."

