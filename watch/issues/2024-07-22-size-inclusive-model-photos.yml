title: "Do thin models on fashion websites put off shoppers who wear larger sizes? What a Journal of the Academy of Marketing Science study found"
dek: >-
  Most fashion webshops still dress every item on a slim model. A run of experiments with British shoppers shows that this
  leaves anyone a few sizes up unsure how the clothes will fit, and that a model their own size, or a choice of models,
  gives that confidence back.
short_title: "Thin models leave bigger shoppers guessing on fit"

description: >-
  Zhang et al. find slim models leave larger online shoppers unsure of fit and less keen to buy; an own-size model or a
  model picker restores their confidence.

keywords: [size-inclusive model photography, plus-size models, body size diversity in fashion, online fashion retail,
  fit risk, clothing returns, ecommerce product images, inclusive marketing, fashion ecommerce conversion,
  model size picker, Journal of the Academy of Marketing Science]
topics: [Retail, Creative, Personalization]

