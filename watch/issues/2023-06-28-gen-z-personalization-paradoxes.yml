short_answer: >-
  Many say they would. In a survey of 414 US undergraduates, irritation at irrelevant brand content was the strongest
  predictor of intending to avoid brands that do not personalize their marketing. Students who block tracking were more
  inclined to avoid such brands, not less. Seeing personalized ads as useful went with loyalty to personalizing brands,
  while privacy concern went with slightly lower loyalty and slightly more tolerance of generic marketing.

takeaways:
  - "Concern about how brands use personal data averaged 4.00 out of 5, the highest of the six scales in the survey, yet perceived usefulness of personalized ads still averaged 3.51."
  - "Annoyance at brand videos, photos, ads and posts that are not relevant averaged 3.83 on the same 5-point scale, above its midpoint of 3."
  - "60.4% of the students had five or more social media profiles, but neither that count nor daily time online showed a link with either intention."
  - "Women reported more privacy concern than men (4.10 against 3.83 out of 5) and reported taking fewer steps against tracking (2.91 against 3.07)."

