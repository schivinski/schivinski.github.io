title: "Do Gen Z consumers avoid brands that don't personalize their marketing? What a Journal of Consumer Behaviour study found"
dek: >-
  Young consumers guard their data and still expect brands to know what they want. A survey of US undergraduates finds
  that those who block tracking are more ready, not less, to drop brands whose marketing feels generic.
short_title: "Gen Z, tracking blockers and generic brand content"

description: >-
  McKee et al. find US students who block tracking still expect relevance, and annoyance at generic content predicts
  avoiding brands that don't personalize.

keywords: [Gen Z marketing, personalized advertising, digital personalization, privacy calculus, personalization privacy
  paradox, ad blocking, brand avoidance, brand loyalty, third-party cookies, first-party data, Journal of Consumer Behaviour]
