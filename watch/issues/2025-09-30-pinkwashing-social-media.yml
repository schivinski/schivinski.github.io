short_answer: >-
  Mostly two causes, and seldom a named company. In 17,641 posts on X and 1,000 sampled Instagram posts tagged
  #pinkwashing, people used the word both for campaigns that borrow the pink ribbon of breast cancer awareness and for
  LGBTQIA+ marketing, two crowds that barely overlapped. Specific brands were hardly ever singled out; the most persistent
  target on X was a government. Posts were mostly negative, but many rallied the community instead of explaining the tactic.

takeaways:
  - "On Instagram, 56% of the sampled #pinkwashing posts were about breast cancer and 32% about LGBTQIA+ causes; the other 12% used the word for pink flowers, sunsets and the like."
  - "Two in five posts on X (39.6%) landed in June or October, the months of Pride and Breast Cancer Awareness, yet only 0.04% of accounts posted in both."
  - "Almost 4,000 of the 17,641 X posts, about 23%, were rallying calls to the community rather than plain complaints."
  - "Of the Instagram captions that explained the term, 44% said why an organisation might do it, and only 12% granted that such campaigns at least raise awareness."

