title: "What does pinkwashing mean on social media, and who gets accused? What an International Journal of Advertising study found"
dek: >-
  One word now covers two very different complaints: pink ribbons on products and rainbow marketing around Pride. A look at
  more than 18,000 posts on X and Instagram shows who uses the term, how they post, and how seldom they explain the tactic
  they object to.
short_title: "What people mean when they call out pinkwashing"

description: >-
  Naderer et al. find #pinkwashing on X and Instagram covers two causes, breast cancer and LGBTQIA+ marketing, and rarely
  names a brand, across 18,641 posts.

keywords: [pinkwashing, rainbowwashing, Pride Month marketing, breast cancer awareness marketing, LGBTQIA+ marketing,
  cause marketing backlash, corporate social responsibility communication, washing accusations, social listening,
  hashtag analysis, International Journal of Advertising]
topics: [Social media, Advertising]

