title: "Does a dislike button shut people up? What a Journal of Marketing Research study found"
short_title: "The dislike button that made people post more, and shout less"
dek: >-
  Every platform that has flirted with a downvote has feared the same two outcomes: contributors go quiet, or they
  dig in. Two months of Reddit data say neither happens.
description: >-
  A noticeable drop in reputation made Reddit users 8.5 points more likely to post the next day and softened their
  strongest opinions. What that means for ratings, scores and community design.
keywords: [downvotes, dislike button, negative feedback, user-generated content, online communities, community
  management, platform design, reputation systems, karma, echo chambers, polarization, social media strategy,
  content moderation, Journal of Marketing Research]
