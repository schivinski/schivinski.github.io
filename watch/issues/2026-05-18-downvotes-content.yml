    title: "Separating the artist from the art: Social media boycotts, platform sanctions, and music consumption"
    authors: "Winkler, D., Wlömert, N., & Liaukonytė, J."
    journal: "Journal of Marketing Research"
    year: 2026
    text: >-
      When R. Kelly's music fell off the big streaming playlists after calls for a boycott, listening collapsed. It
      looks like a consumer revolt and mostly was not one: separating songs that were removed from those that stayed,
      the authors trace the fall to lost visibility rather than to people choosing differently. Pulling a product from
      the shelf and changing minds are not the same thing.
  - doi: "10.1007/s11747-026-01147-3"
    title: "How should content creators narrate their content? The impact of emotionality flips on audience engagement"
    authors: "Ghasemi, H., Astvansh, V., & Sepehri, A."
    journal: "Journal of the Academy of Marketing Science"
    year: 2026
    text: >-
      Across 33,598 podcast episodes, 3,381 TED talks and two experiments, audiences stayed with content whose
      emotional line kept changing direction rather than holding a steady mood. Arousal is the reason: each flip wakes
      the listener up. The effect is strongest for easy-to-follow material.

