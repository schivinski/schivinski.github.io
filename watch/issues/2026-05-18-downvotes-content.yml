  caption: "The feedback nobody asks for, and the one that changes behaviour. Photo: Vitaly Gariev on Unsplash."

short_answer: >-
  It does the opposite. Over two months of Reddit activity, a visible knock to someone's reputation made them 8.5
  percentage points more likely to comment the next day, against a baseline of 29%. Nobody backed out of the
  community that had just voted them down; they added activity elsewhere on top. And when their original post had carried a strong opinion, the next one on the same subject was
  measurably milder. The pattern fits people repairing a score rather than learning a lesson.

takeaways:
  - "A more noticeable drop in reputation lifted the chance of commenting the next day by 8.5 percentage points, from a base of 29%."
  - "All of that extra activity turned up in other communities (+11 points); posting in the place where the downvotes landed did not fall."
  - "Strong opinions got softer. Above a level of intensity reached by about a third of comments, the writer came back noticeably more measured on that topic."
  - "Win the reputation back and the energy goes: users who recovered their lost standing the next day posted less again."

