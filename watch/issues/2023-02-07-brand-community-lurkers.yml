short_answer: >-
  On the outcomes a brand cares about, yes. In a survey of 742 US members of brand-run online communities, those who
  read but rarely posted felt they belonged more when they saw the brand thank contributors, encourage conversation and
  share good information, just as posters did. Their trust in the brand was tied to buying intentions, recommendations
  and shrugging off bad news as closely as posters' trust was. What built that trust differed between the groups.

takeaways:
  - "Lurkers were the larger group: 405 of the 742 community members surveyed, or 55%, against 337 posters."
  - "Brand support counted for readers too. The three kinds of support together accounted for 34% of the variance in lurkers' sense of belonging, and 43% among posters."
  - "Trust had different sources. The model accounted for 64% of the variation in lurkers' trust, which leaned on what the brand published and on what they knew about it, and 57% in posters' trust, which leaned on belonging."
  - "Trust showed most in recommendations: it explained 59% of the variance in positive word of mouth among lurkers and 64% among posters, compared with about a fifth of purchase intention (20% and 19%)."

