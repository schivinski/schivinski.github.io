title: "Are lurkers in a brand's online community as valuable as its posters? What an International Journal of Electronic Commerce study found"
dek: >-
  Most members of a brand's online community read without posting. A US survey finds that the brand's support is linked to
  these readers' feeling that they belong and to their trust, much as it is among active posters, although the two
  groups trust the brand for different reasons.
short_title: "Why lurkers count in brand communities"

description: >-
  Mousavi and Roper find lurkers in brand-run online communities build trust through information, posters through
  belonging, and trust pays off equally for both.

keywords: [online brand communities, lurkers and posters, passive community members, firm-hosted online communities,
  brand trust, community identity, brand knowledge, positive word of mouth, resistance to negative information,
  community management, organizational support theory, International Journal of Electronic Commerce]
topics: [Social media, UGC]

