short_answer: >-
  Mostly, yes, with a catch you can hear. Across 301 viewers, a short video translated by an AI tool into Indonesian or into
  English drew as much stated interest in liking, sharing or commenting as a version spoken by a native speaker. But people
  rated the AI speaker as sounding much less like a native and a little less natural, and whether they understood it better
  or worse depended on which language it went into.

takeaways:
  - "Out of 7, the AI-translated speaker scored 1.9 points below a native speaker for sounding native in Indonesian, and 2.7 points below in English."
  - "Plans to engage with the post (liking, sharing, commenting) moved by less than half a point between the two versions (0.08 in Indonesia, 0.35 in the English test), and neither gap was statistically significant."
  - "Indonesian viewers understood the AI version slightly less well (5.93 against 6.31), while British and American viewers understood it slightly better (5.62 against 5.25)."
  - "The AI version came across as less natural in both directions, by about 0.4 points each time (3.83 against 4.26, and 3.80 against 4.22)."

