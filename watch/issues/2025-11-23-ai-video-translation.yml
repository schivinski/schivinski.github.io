title: "Can AI translate your marketing videos without putting viewers off? What a Journal of International Marketing study found"
dek: >-
  Tools that re-voice a finished video and move the speaker's lips to fit a new language promise one shoot for every market.
  Two experiments, run in Indonesia and with British and American viewers, found the AI speaker sounds foreign and slightly
  artificial, yet people's stated plans to like it, share it or comment held steady.
short_title: "AI-dubbed videos sound foreign, but engagement holds"

description: >-
  Wahid et al. find AI-translated marketing videos sound less native and natural than human-voiced ones, yet viewers were
  as willing to like, share or comment.

keywords: [AI video translation, AI dubbing, lip-sync translation, HeyGen, video localization, multilingual video content,
  accent in advertising, generative AI video, international marketing, customer engagement intention, Journal of International Marketing]
topics: [AI, Creative, Social media]

