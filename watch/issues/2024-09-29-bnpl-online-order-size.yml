short_answer: >-
  Yes, by a modest amount. Order records from a Nordic web shop for outdoor clothing and kit show that customers who started
  paying in interest-free instalments spent 6.42% more on each order than similar customers who kept paying by card or on delivery.
  Most of the rise came from cheaper items in the basket, and younger and lower-income shoppers drove more of it than older,
  better-off ones.

takeaways:
  - "Once a customer switched to paying later, they spent about €3.79 more a week at the shop than their matched non-adopters, over the four weeks after the switch."
  - "Baskets weighted towards low-priced products showed the biggest boost: the authors put the extra lift at 19.30%, the largest of any factor they tested."
  - "Income and age worked the other way. In the authors' estimates, they cut the effect by 10.20% and 7.18% respectively."
  - "The customers who went on to adopt were already deal-hunters: in the baseline year they had collected 34.85% more in discounts per order than those who never switched."

