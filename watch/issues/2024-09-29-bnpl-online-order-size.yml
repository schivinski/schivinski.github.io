title: "Does buy now, pay later make online shoppers spend more? What a Journal of Retailing study found"
dek: >-
  Pay-later plans handled about 5% of the world's online spending in 2023. Records from a Nordic outdoor-gear web shop
  show how a customer's basket changes once they start splitting the bill, and whose basket grows most.
short_title: "What a pay-later option does to the basket"

description: >-
  Kumar et al. find shoppers who started paying later at a Nordic web shop spent 6.42% more per order, driven by cheaper
  items and younger, lower-income buyers.

keywords: [buy now pay later, BNPL, online checkout, payment options, average order value, instalment payments,
  FinTech, consumer credit, ecommerce spending, synthetic difference-in-differences, Journal of Retailing]
topics: [Retail, Personalization]

