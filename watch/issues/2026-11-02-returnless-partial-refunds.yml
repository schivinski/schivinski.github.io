  file: issue-44-returnless-refunds.jpg
  og: issue-44-returnless-refunds-og.jpg
  alt: "A smiling young woman in a denim jacket holds a small string-tied cardboard parcel and checks it with her phone, more parcels stacked behind her"
  caption: "The parcel stays, part of the money comes back, and nobody queues at the post office. Photo: Rifki Kurniawan on Unsplash."

short_answer: >-
  Yes, if the refund is moderate. On a cross-border marketplace, 853,521 customers who started a return were split at random:
  half could be offered part of their money back to keep the item, half got the usual return. Over the next month the offer was
  worth $1.44 more per customer, mostly because those customers came back and spent more. Generous refunds cost money up front
  and invited extra claims. About 41% of the price was the sweet spot.

takeaways:
  - "At the first return the platform paid out $0.63 more per customer and saved $0.35 on shipping and handling, so it was $0.28 down at that point."
  - "Customers who could get the offer spent 2.2% more over the following 30 days, about $1.92 each, and the lift had not faded after 90 days."
  - "Follow-up return requests rose by 15.5%, a sign that some customers tested how far the new option would go."
  - "With refunds averaging half the price, the first return lost money. Cut to an average of 30%, it came out slightly ahead."

