title: "Should online shops let customers keep a faulty item for part of their money back? What a Marketing Science field experiment with 853,521 shoppers found"
dek: >-
  Returns are expensive to ship, check and throw away. A huge experiment on a worldwide marketplace tested a third option
  between a full refund and nothing: keep the item, get part of the price back, and let an AI decide the amount.
short_title: "Keep it, get part back: returns that pay off later"

description: >-
  Fang et al. tested keep-it partial refunds on 853,521 online shoppers: the first return cost more, but later spending
  left a net gain of $1.44 per customer.

keywords: [product returns, returnless refunds, partial refunds, return policy, e-commerce returns, service recovery,
  customer lifetime value, return fraud, refund abuse, AI customer service, reverse logistics, Marketing Science]
topics: [Retail, Service, AI]

