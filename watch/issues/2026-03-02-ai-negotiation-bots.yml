title: "Can AI negotiate with customers? What a Journal of Marketing Research study found"
short_title: "The AI negotiator that wins the deal and loses the relationship"
dek: >-
  An AI trained to bargain hard while acting human out-earned people and passed for human more often than real
  humans did. Yet everyone who negotiated with a bot felt worse about the relationship. What that means for AI in sales
  and procurement.
description: >-
  An AI bargainer earned 39% of the pie against 33% for humans and seemed more human than people, yet every bot hurt
  how people felt about the deal.
