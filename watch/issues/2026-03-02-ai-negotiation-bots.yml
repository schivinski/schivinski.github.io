short_answer: >-
  It can win the deal, but at a cost. In 15,285 bargaining games with 1,019 people, an AI trained to maximise its
  earnings while behaving like a human earned more than human negotiators and was judged more human than real
  people. A purely rational bot did worse, because people learned to exploit it. But every bot, however good, left
  people feeling worse about the negotiation and the relationship than bargaining with a person did, even when they
  thought the bot was human.

takeaways:
  - "The best bot kept 39% of the pie per game, against 33% for people in the same role, and was rated more human than real people (4.11 against 3.40 out of 7)."
  - "A purely profit-maximising bot was exploited. People learned that it caved near the deadline; it earned only 32%, while its opponents earned 34% instead of 22% against a human-like bot."
  - "Every bot lowered how people felt about the relationship: 3.21 to 3.90 out of 7, against 4.95 after negotiating with a person."
  - "Telling people they faced a bot (\"BargainBot\") made no difference to how satisfied they felt, but it made them push the rational bot harder."

