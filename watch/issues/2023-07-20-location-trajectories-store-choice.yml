title: "Can phone location data predict where people shop, without constant tracking? What a Journal of Interactive Marketing study found"
dek: >-
  Most location targeting still draws a circle around a store and waits for phones to enter it. Location records kept only
  near businesses in one New York borough show that a driver's recent routes help predict where they will buy fuel, even once price,
  brand and habit are known.
short_title: "Recent routes and where drivers buy fuel"

description: >-
  Shoshani et al. find that drivers' recent routes, rebuilt from phone sightings near shops, help predict which fuel
  station they pick beyond price and habit.

keywords: [location data marketing, mobile location data, geofencing, location-based targeting, consumer trajectories,
  store choice, price versus distance trade-off, privacy-preserving location data, customer acquisition value,
  fuel retail, conditional logit model, Journal of Interactive Marketing]
topics: [Retail, Personalization, Privacy]

