short_answer: >-
  It can help. Using phone location records collected only near shops on Staten Island, New York, the researchers rebuilt
  each driver's usual routes from the five days before a fill-up. For 903 regular drivers, knowing how far each station sat from
  those routes improved predictions of where they bought fuel, on top of price, brand and past visits. Drivers would add only about
  21 metres to their route for each cent saved per gallon.

takeaways:
  - "Drivers were about 7 times more likely to return to the station they used last than to pick any other station."
  - "Adding recent routes raised the share of fill-ups where the model named the right station from 39.37% to 41.83% in weeks it had not been trained on."
  - "About 30% of drivers fuelled up almost only along their usual routes and would detour about 7 metres per cent saved; the other 70% would go 38 metres."
  - "Counting shop sales and likely repeat visits, a newly won customer was worth between $3.00 and $7.59 to a station."

