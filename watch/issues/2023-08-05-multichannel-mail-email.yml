short_answer: >-
  Largely, yes. In a beauty retailer's sales records from six countries, more printed mail went with higher store sales
  only among prospects, people who had shown interest but never bought. Email was tied to web sales from medium- and
  high-value customers. A randomised test with 122,394 customers in Italy confirmed the mail result, though it found no
  email effect in any group. Redirecting the same number of mailings and emails toward those groups raised projected revenue.

takeaways:
  - "Reassigning an unchanged volume of mailings and emails across customer groups would have raised the beauty retailer's revenue by 13.5%, or €340,000, with 67% of the gain coming from where the mail went."
  - "Worked out from the randomised test, the new allocation beat the retailer's usual plan by 6.5% in revenue at the same marketing cost. The usual plan itself added only 1.6% over sending nothing."
  - "For a US women's clothing retailer, the same method pointed to a 9.3% revenue lift, and 84% of that came from redirecting email."
  - "In the authors' survey of 351 marketing managers, 46% said the most expensive marketing action belongs with the most valuable customers."

