title: "Should direct mail go to prospects and email to current customers? What a Journal of the Academy of Marketing Science study found"
dek: >-
  Many retailers send their most expensive mail to their best customers. Purchase data from six countries, backed by a field
  test in Italy, suggest printed mail works on people who have yet to buy, while regular buyers respond, if at all, to email.
short_title: "Direct mail for newcomers, email for regulars"

description: >-
  Valenti et al. find direct mail raised in-store sales among prospects alone in six countries, and moving it away from
  top customers lifted projected revenue.

keywords: [direct mail marketing, email marketing, multichannel marketing, omnichannel retail, customer segmentation,
  RFM segmentation, customer acquisition, marketing budget allocation, marketing mix modelling, field experiment,
  Journal of the Academy of Marketing Science]
topics: [Retail, Personalization]

