sections:
  - h: "What the researchers did"
    body: |
      Albert Valenti of the University of Navarra's IESE Business School in Barcelona, Shuba Srinivasan of Boston
      University's Questrom School of Business, Gokhan Yildirim of Imperial College London, and Koen Pauwels, who holds posts
      at Northeastern University's D'Amore-McKim School of Business and BI Norwegian Business School, examined a budgeting
      habit common in retail. Printed mail is expensive, so firms tend to send it to their most valuable customers. Email is
      cheap, so it goes to almost everyone, prospects included. Their question was whether the customers receiving each
      channel were in fact the ones who responded to it.

      They ran three analyses. The main one used the records of L'Occitane en Provence, a beauty and wellness retailer that
      sells its own products in its own stores and online: purchases from 2011 to 2014 and every email and direct mail
      campaign from 2013 and 2014, for 84,110 customers sampled at random in the United States, Great Britain, Germany,
      France, Spain and Italy. The second repeated the analysis with 23,891 customers of a US retailer of women's clothing and
      accessories, using data from 2010 to 2012. The third was a field experiment run with the beauty retailer's marketing
      team in Italy from July to November 2017.

      Customers were grouped by four measures from their purchase history: how recently they bought, how often, how much they
      spent, and how clumped their purchases were in time. Two further groups had no recent history to measure. Prospects had
      shown interest in a store or on the website and left contact details but never bought. Dormant customers had bought
      before, but not in the two years used to build the groups. The team then modelled weekly online and in-store sales for
      each group in each country and combined the estimates across countries.
    facts:
      - ["Main data", "84,110 beauty retailer customers in six countries, with all their purchases and marketing contacts"]
      - ["Second retailer", "A US women's clothing and accessories chain, 23,891 customers"]
      - ["Field experiment", "Italian customers contactable through both channels, each given nothing, email, direct mail, or both, by random draw"]
      - ["Channels", "Email was the only online action and direct mail the only offline one; both carried the same content"]
      - ["Measured", "Weekly sales online and in stores, by customer group"]

  - h: "Who is on a retailer's list"
    body: |
      The make-up of the list matters here. In every country, prospects and dormant customers
      together accounted for half the list or more. The United States had the most prospects, 38%, and Great Britain the most
      dormant customers, 40%. The retailer held email addresses for 42% of its customers and postal addresses for 65%.

      Two independent coders compared a sample of 385 emails and mail pieces from the US and Great Britain and confirmed that
      the messages matched. Any difference in response therefore comes from the channel, not from what was said.

      A first look at the raw figures already hinted at the result. Before any modelling, the link between direct mail and
      sales was stronger for prospects than for dormant or current customers in four of the six countries, and of similar
      size in the other two.

  - h: "Which customers responded to which channel"
    body: |
      The models report elasticities: the percentage change in sales that goes with a 1% change in a marketing action. For
      prospects, direct mail had an elasticity of 0.164 on store sales, the only mail effect that the main analysis marked
      as significant. Each 1% increase in mail to prospects went with 0.164% more store sales from that group. For
      high-value customers, the estimate was close to zero.

      Email showed up in a different group and a different channel. It was linked to online sales among medium-value (0.432)
      and high-value customers (0.478), but only at the 10% significance level, a looser standard than the 5% that the mail
      result met. Email showed no significant relationship with store sales for any group, and mail showed none with online sales.

      The authors' interpretation: a physical piece catches the attention of newcomers to the brand, and of former
      customers who stopped buying a while ago, while current customers already know the offer and need less persuading. The explanation
      fits earlier consumer research, but it was not tested here.
    chart: prospects

  - h: "Checks on the model"
    body: |
      Several checks supported these patterns. Estimating the model with Bayesian methods, or as a single model with country
      as an extra level, gave results with the same signs and significance. A test for reverse causality, in case managers
      had sent more marketing to groups they already expected to buy, left the store-sales results intact. It removed one
      online result: the email effect for high-value customers in the United States.

      A further analysis looked at what drives differences in sales. For store sales, the customer's value tier mattered most by far.
      Online, the country carried roughly the same weight as the tier, even across six similar Western markets.

      As a forecasting tool, the model held up. Predicting the last 15% of weeks, which it had not seen, its mean absolute
      error for store sales was 209.58, against 325.23 for the best machine learning alternative and 487.21 for simply carrying
      the last value forward.
    chart: variance

  - h: "A second retailer"
    body: |
      The US clothing retailer gave more of its emails to its middle and upper tiers and spread its mail in line with
      the size of each group. Its list was built differently too: 34% of customers sat in the medium tier, 14% were prospects
      and 7% were dormant.

      Here, direct mail was linked to both store sales (0.02) and online sales (0.05) among dormant customers. Email was
      linked to store sales among prospects (0.12) and dormant customers (0.14). No tier of active buyers showed a
      significant response to either channel. In both retailers, then, the people who responded to mail were outside the
      active customer base: prospects in one case, lapsed customers in the other.

  - h: "The randomised test in Italy"
    body: |
      Models fitted to past data can mistake who was targeted for what worked, so the team tested the findings directly.
      Between July and November 2017, the beauty retailer's Italian customers who could be reached by both post and email were
      each placed at random in one of four cells: no marketing, email only, direct mail only, or both. The split was made within each
      value group, so that the small high-value tier appeared in every cell. Mail was capped at 33,000 pieces for budget
      reasons, so the mail cells were smaller: 16,268 customers got mail only and 16,582 got both, against 44,840 with no
      contact and 44,704 with email only.

      Direct mail again worked only on prospects, with an elasticity of 0.132, close to the model's estimate. Email did not
      change sales significantly in any group. Sending both produced a small additional effect among medium-value customers (0.011),
      something the models had not shown.

  - h: "Moving the same budget"
    body: |
      To turn the estimates into a plan, the team kept the total number of emails and mailings in each country fixed and
      asked where each piece would bring in most, using an 82% margin based on the retailer's annual report. Managers set a
      ceiling of three emails a week, seven in the United States. Without it, the model would have sent some groups two
      emails a day.

      The plan changed both channels. Email had gone to each group roughly in proportion to its size. The plan sent fewer to
      prospects, dormant customers and recent low-value buyers, and more to the medium and high tiers and to low-value
      customers who had not bought for a while. Direct mail had gone mostly to the more valuable tiers, with
      prospects largely left out. The plan moved it toward prospects.

      The retailer's marketing team said the different response by customer type had surprised them, and that they now
      wanted to invest more in mail for winning new customers and reactivating inactive ones. The company has since built
      this cycle of modelling and testing into its planning. The authors add a suggestion of their own: countries a retailer
      has entered recently tend to hold more prospects and light buyers, so they may be the best place for mail.

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["Sort your list into six groups", "Pull two years of purchase records. Put each contact into one group: never bought, has not bought for two years, or one of four tiers of active buyers ranked by how recently, how often and how much they buy."]
  - ["Count who you can reach where", "For each group, count how many people have a postal address and how many have an email address you may use. Remove anyone who has asked not to be contacted through a channel."]
  - ["Mail your prospects first", "Plan your next print run so that contacts who have not yet bought receive a good part of the pieces, ahead of your best customers. Give them a clear reason to visit a store, such as a new opening or an in-store event."]
  - ["Keep regular buyers on email", "Give your middle and top tiers most of your emails, each with a link straight to the product page. Cap it at three emails a week per person."]
  - ["Hold back a test group", "Before you move the whole budget, split each group at random into four cells: no contact, email only, mail only, and both. Run one campaign of eight to twelve weeks and compare store and online sales cell by cell."]
  - ["Move the sends, then test again", "Shift mailings and emails toward the groups whose sales rose, keeping the total number of sends the same. Repeat the four-cell split once a year, because your groups and their habits change."]

expect:
  - "**Gains from moving, not spending.** The revenue gains came from sending the same number of pieces to different people, with no extra budget."
  - "**Plan on the lower figure.** The lift based on the field test's estimates was smaller than the model's projection, which is the safer number for a business case."
  - "**Email gains are less certain.** Email's link to online sales among regular buyers did not appear in the randomised test, so regard it as a hypothesis until your own split test supports it."
  - "**A yearly cycle.** The retailer set its marketing budget once a year and kept its customer groups fixed for that period, so expect to learn over several campaigns rather than one."

limits:
  - "**Two retailers, own-brand goods.** Both sell only their own products, through their own stores and websites, and competitors' marketing was not in the data."
  - "**Western, developed markets.** Six wealthy countries for the beauty retailer and the US for the clothing retailer; the authors would like the method tried in other regions."
  - "**Two channels only.** Email and printed mail were the only actions studied. Text messages, apps, phone calls and paid social media were not."
  - "**Order not tested.** Whether mail should come before email, or the other way round, was left open."
  - "**One country for the causal test.** The randomised test ran only in Italy, with customers reachable through both channels."
  - "**Projected revenue.** The lifts are calculations from model and test estimates, not results from a chainwide rollout."

faq:
  - q: "Does direct mail still work for retailers?"
    a: "For winning new customers, it can. Among people who had never bought, store sales rose with the amount of direct mail in a beauty retailer's data from six countries, and a randomised field test in Italy confirmed the effect, while mail did little for existing customers (Valenti et al., 2024)."
  - q: "Should I send direct mail to my best customers?"
    a: "Not by default, on this evidence. High-value customers showed no significant sales response to mail, either in the model of past sales or in the randomised test, even though retailers often target them because mail is costly."
  - q: "Is email better for existing customers?"
    a: "Possibly, but the support is weaker. The model tied email to web purchases by medium- and high-tier buyers at a lenient significance level, and the randomised test detected no effect of email on any customer group."
  - q: "What are prospects and dormant customers?"
    a: "Prospects have shown interest in a brand, at a shop or online, and given their contact details, but have not yet made a purchase. Dormant customers bought in the past but not in the previous two years."
  - q: "How can a retailer find out which customers respond to which channel?"
    a: "With a split test. The retailer here used a random draw to sort customers into four cells, ranging from no marketing at all to both channels, within each value group, and then compared sales across the cells."

also:
  - doi: "10.1002/cb.2197"
    title: "The mood effect: How mood, disclosure language and ad skepticism influence the effectiveness of native advertising"
    authors: "Wen, Wu, Dodoo, & Kim"
    journal: "Journal of Consumer Behaviour"
    year: 2023
    text: >-
      Native ads look like the articles around them, so the state readers are in may shape how they respond. In two online
      experiments, people were first put in a good or bad mood and then read an article-style ad. An explicit disclosure
      label was recognised as advertising more often than an implicit one, and a bad mood raised the chance that people
      spotted the ad. In a good mood, people rated the ad with the implicit label more favourably; in a bad mood, the explicit label
      did better, and scepticism towards advertising shaped this further. The placement of a sponsored piece deserves as
      much thought as the wording of its label.
  - doi: "10.1111/ijcs.12976"
    title: "Response to social media influencers: Consumer dispositions as drivers"
    authors: "Bailey, Mishra, & Vaishnav"
    journal: "International Journal of Consumer Studies"
    year: 2023
    text: >-
      Why do some followers act on an influencer's suggestions while others scroll past? Across two studies, people more
      attached to social media formed stronger one-sided bonds with influencers, felt more open to their influence and,
      through that chain, were more willing to do what the influencer proposed. The second study showed that scepticism
      towards influencers weakened the link between those bonds and compliance. The authors put forward compliance intentions
      as a measure of influencer performance next to purchase intention. Judging a creator by sales intent alone leaves out
      what kind of followers the creator has.

