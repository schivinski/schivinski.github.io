title: "What makes someone click on a video thumbnail? What a Journal of the Academy of Marketing Science study found"
short_title: "Busy enough to be interesting, tidy enough to be read"
dek: >-
  Nearly 23,000 thumbnails, measured by machine, and two design rules that run in opposite directions. For one of
  them the middle is the best place to be. For the other it is the worst.
description: >-
  Thumbnails with a middling amount going on won the clicks at 5.48 out of 7. Middling colour harmony lost them at
  3.41. Two dials, pulling opposite ways.

