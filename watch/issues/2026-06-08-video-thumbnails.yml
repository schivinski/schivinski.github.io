short_answer: >-
  Two things, and they pull against each other. Across 22,958 real thumbnails and two experiments, pictures with a
  moderate amount going on beat both the sparse and the crowded ones by a wide margin. Colour harmony then behaved
  the other way round: fully matched worked, completely clashing worked, and the compromise between them scored
  3.41 out of 7, the worst result anywhere in the study. Aim for the middle on how much you put in the frame, and
  avoid the middle on how well it hangs together.

takeaways:
  - "A middling amount of detail won: 5.48 out of 7 for clicking, against 4.11 for sparse and 4.49 for crowded."
  - "Colour harmony split the other way: 5.30 when every element matched, 4.89 when none did, and only 3.41 in between."
  - "The two settings did not interact, so a thumbnail can be tuned on one without disturbing the other."
  - "It made no difference whether the creator chose the image or the platform picked it automatically."

