title: "Should brands go live? What a Journal of Marketing study found about live streaming"
short_title: "The liveness lift: why people stay for live video"
dek: >-
  Same video, same content, one difference: viewers were told it was live. That alone made them feel closer to the
  person on screen, keep watching and want to follow. What it means for launches, demos, live shopping and Q&As.
description: >-
  Telling viewers a video was live made them more likely to keep watching (5.19 vs 3.59 out of 7) and to follow the
  creator. When going live pays off.
