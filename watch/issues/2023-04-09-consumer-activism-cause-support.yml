title: "What keeps an online boycott going, anger at the brand or support for the cause? What a Journal of Brand Management study found"
dek: >-
  After a Carrefour employee in Brazil killed a dog, thousands of Twitter users called for a boycott. An analysis of
  32,637 posts shows that attacks on the company led the first weeks and then declined, whereas animal-rights posts
  kept a steady share for months.
short_title: "Which posts start an online boycott, and which sustain it"

description: >-
  Muraro et al. track 32,637 tweets in a Brazilian boycott of Carrefour: attacks on the brand led early and faded, while
  animal-rights posts held steady.

keywords: [consumer activism, online boycott, social media boycott, brand transgression, brand crisis response,
  collective action framing, animal rights activism, negative word of mouth, retweets and likes, topic modelling,
  Carrefour Brazil, Journal of Brand Management]
