short_answer: >-
  Anger at the brand started it; support for the cause kept it going. When Brazilians boycotted Carrefour after an
  employee killed a dog, tweets attacking the company led the conversation at first and trailed off over the following
  four months, while posts about animal rights held a steady share throughout. Posts comparing the case with other
  scandals drew about six times the retweets of brand attacks.

takeaways:
  - "Tweets attacking the brand were usually replies sent straight to its accounts, at odds of about 5 to 1; in the other four kinds of post, such replies were rare."
  - "Posts about the cause were retweeted 58% less than brand attacks, yet they kept a steady place in the conversation from the first week to the last."
  - "Posts that simply passed on news drew 68% fewer likes and 76% fewer retweets than brand attacks, and peaked when something happened offline."
  - "Participation was broad rather than intense: 26,398 accounts posted, 1.24 times each on average, and the most active 1% averaged about four posts."

