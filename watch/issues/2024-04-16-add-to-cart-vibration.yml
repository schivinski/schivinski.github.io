title: "Does a vibration at add-to-cart make app shoppers happier with their choice? What a Psychology & Marketing study found"
dek: >-
  A short buzz as a product drops into the basket is about as small as app design gets. Three experiments in China and the
  UK suggest it leaves shoppers expecting to like their pick more, without making them any surer they chose well.
short_title: "The add-to-cart buzz that lifts expected satisfaction"

description: >-
  Li et al. find a brief phone vibration when an item goes into the basket lifts how satisfied shoppers expect to be, by making
  the item feel more like theirs.

keywords: [haptic feedback, vibrotactile feedback, m-commerce, mobile shopping app design, add to cart, psychological ownership,
  anticipated satisfaction, sensory marketing, app user experience, purchase confidence, Psychology & Marketing]
topics: [Retail, Creative]

