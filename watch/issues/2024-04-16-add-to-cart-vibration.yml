short_answer: >-
  Yes, on this evidence, though only on one measure. Across three experiments, shoppers who got a brief vibration as an
  item went into the basket, or watched one on video, expected to be more satisfied with it than shoppers who got none. They were
  no more confident they had picked the right product. The buzz seemed to work by giving a sense of handling the item, which
  made it feel more like their own.

takeaways:
  - "Among 100 gadget shoppers in the first experiment, whether the phone buzzed explained roughly half (51%) of the spread in expected satisfaction."
  - "Certainty about the choice stayed flat: it averaged 5.62 without the vibration and 5.68 with it, a gap indistinguishable from chance."
  - "With 198 people in a UK lab, expected satisfaction rose from 4.91 to 5.56 when the tablet buzzed."
  - "No new kit was involved: the tests used the roughly 400-millisecond pulse the shopping app already gave when something was added to the basket."

