title: "Which kind of pre-launch buzz drives sales, and how do brands create it? What a Journal of the Academy of Marketing Science study found"
dek: >-
  Before a film opens, people talk about it, search for it and comment on its trailers. Daily records for 330 US releases
  show which of the three sells the most tickets, and which studio moves get each one going.
short_title: "Which pre-launch buzz sells, and how to start it"

description: >-
  Schreiner et al. find fan posts on X mattered more for US opening weekends than searches or trailer comments; studio posts
  fed that talk, ads did not.

