short_answer: >-
  Fan talk matters most for sales, and the brand's own posts are its strongest trigger. Tracking 330 US film releases day
  by day over the eight weeks before opening, the researchers found that fan posts on X predicted opening weekend takings
  more strongly than Google searches or comments on YouTube trailers, although all three counted. Studio posts about the
  film did most to get people talking, new trailers mainly drew comments, and advertising spend created no
  measurable buzz.

takeaways:
  - "Fan talk paid best at the box office: 10% more fan posts on X going into the opening went with an opening weekend a little over 2% bigger, while 10% more searches or trailer comments added under 1% each."
  - "A studio's own posts about the film stirred about 5 times as much fan talk as its posts about a trailer, and about 3 times as much as releasing a new trailer."
  - "New trailers were the strongest way to get people commenting: over two weeks their pull was about 2 times that of an ordinary studio post about the film."
  - "Advertising moved none of the 3 buzz measures, yet it still paid directly: 10% more spend went with a little over 1% more at the opening weekend."

