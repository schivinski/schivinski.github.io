sections:
  - h: "What the researchers did"
    body: |
      Maher Georges Elmashhara, Susana C. Silva and Maria Levi Silva of Universidade Católica Portuguesa in Porto,
      Roberta De Cicco of the University of Urbino Carlo Bo in Italy and Maik Hammerschmidt of the University of Goettingen
      in Germany studied a growing habit in online retail: putting games inside shopping chatbots. The authors mention
      AliExpress, whose chatbot lets shoppers gamble for discounts or digital coins, and the lingerie brand Aerie, whose chat
      game hands out points and badges. Retailers hope the fun keeps people in the conversation and leads to a sale. The team
      asked whether it does, and which kind of game helps.

      They built working chatbots in Facebook Messenger with the tool Chatfuel, all for an invented online shop selling
      suitcases under its own brand. People tapped through set options to browse products and play. In Study 1, a survey,
      participants watched a video of the chatbot, said what they expected from it, then used it for a shopping task and
      described how they had taken part. Studies 2 and 3 were experiments that set a plain chatbot against two gamified ones.
    facts:
      - ["Participants", "177 European consumers who often use Facebook Messenger, reached through referrals (Study 1); 275 and 218 adults recruited on Prolific (Studies 2 and 3)"]
      - ["Setting", "Functioning Messenger chatbots for a fictitious online suitcase brand"]
      - ["Games", "Study 1: a four-question product quiz, a spot-the-differences game and badges. Studies 2 and 3: a wheel to spin or a multiple-choice quiz, compared with a chatbot that had no game"]
      - ["Reward", "In the experiments every participant won the same 30% discount, to use on a later purchase"]
      - ["Measured", "Utilitarian and hedonic motivation, three kinds of engagement and purchase intention; also a sense of free choice (Study 2) and a click to the online shop (Study 3)"]

  - h: "Not every kind of engagement helps"
    body: |
      The authors split motivation in two. Utilitarian motivation is about getting a job done: finding what you are after
      and getting good value. Hedonic motivation is about fun and enjoyment. They split engagement in three. Cognitive
      engagement is concentration and absorption. Emotional engagement is enthusiasm, dedication and attachment. Behavioural
      engagement is the time and effort put into the chat, such as asking the bot for ideas and help, or thinking of
      recommending it to others.

      Study 1 traced these links with structural equation modelling. People who expected the chatbot to be fun reported more
      behavioural engagement, and behavioural engagement went with higher purchase intention. People who expected it to be
      useful also reported more behavioural engagement, but more emotional engagement as well, and emotional engagement went
      with lower purchase intention. Usefulness therefore worked through two links with opposite effects. Cognitive engagement
      carried neither motivation through to buying.

      Study 2 ran the same analysis on new participants and confirmed the main pattern. One link did not hold the second
      time: usefulness no longer raised purchase intention through behavioural engagement.

  - h: "Wheel against quiz"
    body: |
      In Study 2, 275 people were randomly given one of three chatbots. The plain one simply offered a discount. The second
      let people spin an animated wheel for their reward. The third asked several multiple-choice questions. The games were
      set up so that nobody lost.

      The quiz drew more utilitarian motivation and more emotional engagement than both other chatbots, and less hedonic
      motivation than the wheel. The wheel had the lowest utilitarian motivation, cognitive engagement and emotional
      engagement of the three chatbots. It also produced the highest purchase intention. Two comparisons were not significant: the wheel was not
      rated reliably more fun than the plain chatbot (p = .17), and the quiz did not raise purchase intention above it
      (p = .34).

      A serial mediation analysis traced both routes. Compared with the quiz, the wheel raised enjoyment, enjoyment raised
      behavioural engagement and that raised purchase intention. The quiz raised the sense of usefulness, which raised
      emotional engagement, which in turn lowered purchase intention.
    chart: study2

  - h: "Feeling free to play"
    body: |
      Games can leave people feeling they have to play. Study 2 therefore asked two questions about choice: whether people
      felt forced to play the game, and whether they felt they could choose to play it. Wheel users felt more free than quiz
      users, and that sense of choice explained part of the wheel's advantage in purchase intention (indirect effect 0.43,
      95% confidence interval 0.15 to 0.86).

      The authors' explanation is effort. The quiz asked people to read questions and think about answers before the
      discount arrived, so taking part felt like an obligation. Spinning a wheel asked for one action and left the outcome
      to luck.

  - h: "From intention to a click"
    body: |
      Study 3 used the same three chatbots with 218 new participants on Prolific. After the chat, each person saw the brand
      in an online shop setting and chose between two buttons: visit the shop where the discount could be used, or not.
      The wheel led to more visits than either other chatbot (both p < .001). The plain chatbot and the quiz produced almost
      identical shares of visits (p = .93).

      A click is closer to buying than a rating, and the authors added this study for that reason. It is still not a purchase:
      nobody spent money, and those who clicked were told afterwards that the chatbot was part of an academic project.
    chart: clicks

  - h: "The authors' recommendations"
    body: |
      Their main warning is against assuming that any rise in engagement becomes spending. The kind to build is behavioural:
      people asking the bot for information and help with their choice. The kind to handle with care is emotional. The
      authors suggest that strong emotional involvement can turn a shopper with a goal into someone browsing for the
      experience, who then loses sight of the purchase. They also see little return in making a chat more absorbing.

      On the choice of game, they favour quick games of chance over games that test knowledge, and they ask designers to
      check that players do not feel obliged to take part. Both points rest on one product and two game formats, so they are
      best read as a strong starting point rather than a rule for every category.

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["Name the action the game should lead to", "Write down the one thing a customer should do right after playing, such as opening a product page or putting something in the basket. If a game idea does not lead there, drop it."]
  - ["Choose a game of luck", "Pick a game that takes one tap and less than ten seconds, such as a wheel, a scratch card or a mystery box. Keep quizzes and puzzles out of the buying journey."]
  - ["Keep playing optional", "Show the game as an offer with two buttons, Play and No thanks. Give product help and the standard offer to people who skip it, so nobody feels they have to play."]
  - ["Put products next to the prize", "On the screen that shows the prize, add two or three matching products and a button to the shop. Have the bot ready to answer questions on size, price and delivery."]
  - ["Compare it with a plain offer", "Run the game for 14 days with every second chat user, and give everyone else the same reward without a game. Count clicks to the shop and orders for every 100 chats in each group."]
  - ["Check who plays without buying", "Each week, count the people who play more than once without opening a product page. If that number grows, allow one spin per visit or shorten the game."]

expect:
  - "**More interest, not proven orders.** The wheel raised stated buying intentions and clicks to the shop. Completed purchases were not measured."
  - "**Taking part is not enough.** Behavioural engagement was about as high with the quiz as with the wheel (no significant difference, p = .13), yet only the wheel lifted purchase intention."
  - "**A game on top of an offer.** Every chatbot in the experiments handed over the same reward, so the evidence concerns a game layered onto a discount, not a game used instead of one."
  - "**Emotional pull has a cost.** People who become absorbed in the game may linger without buying. This is the authors' explanation for the results, not something they observed directly."

limits:
  - "**A practice purchase.** Participants used a real chatbot, but no money changed hands; purchase intention and a click were the outcomes."
  - "**One product, one invented brand.** Suitcases from a fictitious retailer were the only offer, so other categories may respond differently."
  - "**Two games compared.** Only a wheel and a multiple-choice quiz were tested against each other; points, levels or leaderboards on their own were not."
  - "**Every player won.** The games were set so that nobody lost, so how people react to losing a spin is unknown."
  - "**A survey for the paths.** Study 1 measured motivation, engagement and intention in one questionnaire, so its paths are associations; the experiments tested the chatbot types directly."

faq:
  - q: "Does adding a game to a chatbot increase sales?"
    a: "It depends on the game. A chatbot where people spun a wheel for their reward raised purchase intention and clicks to the online shop compared with a plain chatbot, while a multiple-choice quiz did not beat the plain version (Elmashhara et al., 2024). Real orders were not tracked."
  - q: "How do utilitarian and hedonic motivation differ?"
    a: "Utilitarian motivation is practical: reaching a goal, finding the right product and getting economic value. Hedonic motivation concerns enjoyment: whether the interaction seems fun, entertaining and immersive. Here both were measured as what people expected from using the chatbot."
  - q: "Can customer engagement with a chatbot lower purchase intention?"
    a: "One kind did. Emotional engagement, meaning enthusiasm, dedication and attachment during the chat, was linked to lower purchase intention in both the survey and Study 2. The authors suggest an absorbing experience can satisfy people enough that buying feels less pressing."
  - q: "Why did a quiz work worse than a game of chance?"
    a: "The quiz made the chat feel more useful and more emotionally involving, a combination that predicted weaker purchase intention. It also made people feel more obliged to play, because they had to read questions and pick answers before getting their reward."
  - q: "Which kind of engagement should a shopping chatbot aim for?"
    a: "Behavioural engagement: customers using the bot to look for ideas, information and assistance, or considering telling others about it. It was the dimension linked to higher purchase intention, while concentration and absorption showed no benefit."

also:
  - doi: "10.1111/ijcs.12992"
    title: "The interplay of app characteristics and smartphone addiction in mobile shopping behaviour"
    authors: "Prodanova & Chopdar"
    journal: "International Journal of Consumer Studies"
    year: 2024
    text: >-
      A survey of 302 people in India who shop through mobile apps, analysed with PLS-SEM, asked which app features feed
      compulsive smartphone use and what that means for buying. Perceived privacy and security, personalization, offers
      tailored to the context and the retailer's reputation were all linked to stronger smartphone addiction. Combined with
      app incentives, that addiction went with a stronger intention to shop on mobile and more frequent purchases. Teams that
      design app rewards may want to look at how their heaviest users respond, not only the average shopper.
  - doi: "10.1007/s12525-023-00664-1"
    title: "“Sorry, too much information”—Designing online review systems that support information search and processing"
    authors: "Seutter et al."
    journal: "Electronic Markets"
    year: 2023
    text: >-
      Shoppers facing hundreds of reviews can easily feel overloaded, and review systems now add features meant to make
      scanning and reading easier. Drawing on 65 review systems from a range of online platforms, the authors built and
      evaluated a taxonomy of these design features, with 50 distinct characteristics. It also sums up what is already known
      about how such features affect information overload. Anyone redesigning a review section now has a structured list of
      options to set against their own.

