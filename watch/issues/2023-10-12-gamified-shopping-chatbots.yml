short_answer: >-
  A quick game of luck can help; a quiz did not. In an experiment with 275 adults, a shopping chatbot that let people
  spin a wheel for their discount produced higher purchase intention than a plain chatbot offering the same reward,
  while a chatbot running a multiple-choice quiz only matched the plain one. In a follow-up experiment, the wheel
  also led more people to click through to the online shop.

takeaways:
  - "After spinning a wheel in the chatbot, people rated their purchase intention at 5.07 of a possible 7, against 3.66 when the chatbot simply offered a discount with no game."
  - "78.1% of people who used the wheel chatbot chose to visit the online shop, against 50.0% after the plain chatbot and 49.3% after the quiz."
  - "Quiz players felt less free to decide whether to play, scoring 2.95 on a two-question measure of choice against 4.01 for wheel users."
  - "The quiz lifted emotional engagement to 5.06 on the same scale, the highest of the three chatbots, while the wheel scored 3.64; this is the kind of engagement linked to weaker buying intentions."

