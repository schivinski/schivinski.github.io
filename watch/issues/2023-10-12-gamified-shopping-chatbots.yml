title: "Should a shopping chatbot offer customers a game? What a Psychology & Marketing study found"
dek: >-
  Retailers are adding games to their chatbots in the hope that fun turns into sales. A survey and two experiments with
  working chatbots suggest the type of game decides the result: a quick spin of a wheel raised interest in buying, while a
  product quiz gave about the same result as a plain chatbot.
short_title: "Which chatbot games help sales, and which do not"

description: >-
  Elmashhara et al. find a spin-the-wheel game in a shopping chatbot raised purchase intention and shop visits, but a quiz
  matched a chatbot with no game.

keywords: [gamified chatbots, chatbot gamification, gamification in e-commerce, spin the wheel discount, conversational
  commerce, AI shopping assistant, customer engagement, emotional engagement, hedonic motivation, purchase intention,
  consumer autonomy, Psychology & Marketing]
topics: [AI, Retail]

