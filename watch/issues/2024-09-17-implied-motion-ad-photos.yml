short_answer: >-
  Mostly, yes. In seven online tests, Americans saw one mock Instagram ad whose photo showed either a scene in motion
  or the same scene at rest: joggers, wild animals, a game of football, cars, airliners, waves or food. The moving
  version was always rated more interesting. In all but one test the ad also seemed more persuasive, but plans to buy
  went up only for some products.

takeaways:
  - "It made no real difference what was moving. Pooled across 1,392 people, photos of moving people and animals scored 4.98 for interest out of 7 and photos of moving objects 4.66, a gap that did not stand up statistically."
  - "An action shot can win the rating without winning the sale. Joggers rather than standing models lifted the sportswear ad's perceived effectiveness from 3.32 to 4.28 out of 7, yet the stated chance of buying barely moved, from 17% to 18%."
  - "The moving scene need not show the product. A lighthouse battered by waves, against the same lighthouse in calm water, made a chewing gum ad look far more convincing: 3.74 against 2.61 out of 7."
  - "Some movement barely registers. Airliners taking off rather than parked at the gate nudged the travel ad's perceived effectiveness only from 2.84 to 3.22, too small a rise to rule out chance."

