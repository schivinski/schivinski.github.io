title: "Do action shots make an ad more persuasive than a still pose? What a Journal of Advertising study found"
dek: >-
  A runner mid-stride, a burger tossed into the air, a wave breaking over a lighthouse. Seven experiments with mock
  Instagram ads show that a still photo hinting at movement pulls people in, whether a person, an animal or an object
  is on the move, and that movement along a curve works best.
short_title: "Why action shots beat still poses in ads"

description: >-
  Bünzli et al. find action shots made Instagram ads more engaging and persuasive in seven US experiments, and movement
  along a curve drew people in most.

