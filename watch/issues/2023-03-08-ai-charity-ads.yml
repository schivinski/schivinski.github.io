short_answer: >-
  Not yet, outside emergencies. In three experiments with more than 1,100 people, those who learned that the child
  pictured in a charity appeal was AI-made showed less empathy and less inclination to donate, even though the charity was open about it.
  Framing the image as protecting children's privacy was the safest wording, while citing a practical motive such as
  saving money made matters worse. When a disaster made real photos impossible to get, the difference largely
  disappeared.

takeaways:
  - "Even with people asked to picture an honest charity, being told the face was AI-made raised how manipulative the ad seemed: an average of 3.19 against 2.62 for those not told."
  - "Giving a practical reason for the image, such as saving on marketing, cost about half a point in willingness to give: 0.558 below an ethical reason and 0.531 below no reason at all."
  - "Disclosure lowered 4 of the 5 outcomes measured in the second experiment, and empathy for the child fell the most."
  - "Of the 2 settings in the third experiment, only disaster relief, where the charity could not obtain a real photo, largely escaped the drop. For an education charity, disclosure still lowered willingness to give."

