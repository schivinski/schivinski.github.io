title: "Should charities use AI-generated faces in their ads? What a Journal of Advertising study found"
dek: >-
  An image model can now produce a lifelike face for a fundraising appeal without anyone being photographed. Three
  experiments show what happens to empathy and giving once donors know the face is artificial, and why a disaster
  changes the picture.
short_title: "AI-made faces in charity appeals"

description: >-
  Arango et al. find donors told a charity ad's child face was AI-made felt less empathy and meant to give less,
  unless a disaster ruled out a real photo.

keywords: [AI-generated images, synthetic media, AI in charity advertising, nonprofit marketing, donation intention,
  empathy in advertising, guilt appeals, AI disclosure labels, generative adversarial networks, disaster appeals,
  AI image transparency, Journal of Advertising]
topics: [AI, Advertising, Creative]

