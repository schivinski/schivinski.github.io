short_answer: >-
  No, not in this test. Among 1,132 US adults, people shown a detailed explanation of why an Instagram ad had targeted
  someone felt no more watched by advertisers than people shown a short explanation or none at all. Everyone already felt
  fairly watched. The explanations did leave people feeling better informed and more able to use transparency tools,
  although few had used such tools much before.

takeaways:
  - "Almost one in five participants (17.9%) had never heard of ad transparency before taking part."
  - "Depending on the tool, between 31.4% and 88.1% of people said they had never or only rarely used it."
  - "An explanation naming 8 kinds of targeting data rather than 2 left the sense of being tracked by advertisers unchanged."
  - "People shown an explanation rated their confidence in using transparency tools 5.20 (short) or 5.27 (detailed) of a possible 7, compared with 4.80 for those shown none."

