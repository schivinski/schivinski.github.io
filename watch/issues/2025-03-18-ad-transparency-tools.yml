title: "Do 'Why am I seeing this ad?' explanations make people feel more watched? What a Journal of Advertising study found"
dek: >-
  Platforms now let people check why an ad reached them. A survey experiment with 1,132 US adults found that a long, detailed
  targeting explanation did not deepen the sense of being watched, and it left people feeling better informed about the tools.
short_title: "Ad explanations inform without alarming"

description: >-
  Wang et al. find a detailed 'why this ad' explanation left 1,132 US adults feeling no more watched, but more sure they
  knew how ad transparency works.

keywords: [ad transparency, ad transparency tools, Why am I seeing this ad, ad targeting explanation, personalized advertising,
  targeted advertising, dataveillance, perceived surveillance, online privacy, privacy cynicism, Journal of Advertising]
topics: [Privacy, Advertising, Personalization]

