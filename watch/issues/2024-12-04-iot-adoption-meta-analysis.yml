title: "What makes people take up smart devices and connected products? What a Journal of Consumer Behaviour meta-analysis found"
dek: >-
  Smartwatches, smart clothing and connected homes have been promised for years, yet many shoppers still hold back. A
  meta-analysis of 138 studies shows that the people around a buyer, and how useful a device looks, matter far more than
  how much fun it promises.
short_title: "What makes people want a smart device"

description: >-
  Ladeira et al. pool 138 studies of smart devices: other people's influence and usefulness drive adoption, and liking
  turns into intent most for branded devices.

keywords: [Internet of Things, IoT adoption, smart devices, connected products, wearable technology, smart home marketing,
  technology acceptance model, social influence, consumer trust and privacy, meta-analysis, Journal of Consumer Behaviour]
topics: [Retail, Privacy, Service]

image:
  file: 2024-iot-adoption-meta-analysis.jpg
  og: 2024-iot-adoption-meta-analysis-og.jpg
  alt: "Three friends in a sunny garden hold up their phones and press their wrists together so their watches touch, one man laughing behind sunglasses"
  caption: "How easy a gadget looks depends a lot on who around you already has one. Photo: Grace Anne Bobadilla on Unsplash."

short_answer: >-
  Mostly the people around them, plus a clear use. Pooling 138 studies with 52,629 consumers, the analysis showed
  that the example of friends, family and peers was the main thing making smart devices seem easy and useful. Devices
  seen as useful and easy won more trust and a stronger sense that personal data was safe. Warm attitudes then became
  plans to adopt most readily for branded devices and essential tasks.

takeaways:
  - "Other people did most to make a device seem easy: social influence had a path weight of 0.88 to ease of use, against 0.03 for enjoyment, which was not significant."
  - "Seeing a device as useful lowered the sense of risk (a path of −0.37). Seeing it as easy did not (0.10, not significant)."
  - "Liking a device turned into plans to adopt it more strongly when the device carried a brand (a meta-regression coefficient of 0.49) and when it handled an essential service rather than a nice-to-have (0.40)."
  - "Fun on its own did not go with wanting a device: enjoyment's pooled correlation with plans to adopt was 0.00, against 0.44 for usefulness."

