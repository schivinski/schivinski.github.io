sections:
  - h: "What the researchers did"
    body: |
      Wagner Junior Ladeira and Fernando de Oliveira Santini, who both work at Universidade do Vale do Rio dos Sinos
      (UNISINOS) in Porto Alegre and at Woxsen University in Hyderabad, teamed up with their UNISINOS colleagues Bernardo
      Frantz and Jean Carlos de Oliveira Rosa, Mohd Azhar of Woxsen University, Weng Marc Lim of Sunway University in
      Malaysia and Swinburne University of Technology, and Tareq Rasul of the Gulf University for Science and Technology in
      Kuwait. Their starting point is a puzzle that anyone selling connected products will know. Smartwatches, smart homes
      and sensor-filled shops promise a lot, yet consumers have been slow to take them up, and published research could not
      even agree on whether liking a device goes with wanting one. Some studies found no link at all; others found a strong one.

      So the team pooled the evidence. They searched eight databases and the papers of leading conferences for consumer
      studies of smart products, smart devices and the Internet of Things, and kept those that reported statistics they
      could combine.

      They set the evidence out as a four-step journey. First impressions come from the fun people expect and from the
      people around them. Next, buyers judge how easy and how useful the device is. Then they weigh up their worries about
      privacy, risk and trust. Last comes the verdict: an attitude towards the device and an intention to adopt it. On top
      of that model, they tested 13 conditions that might explain why the final step varied so much between studies.
    facts:
      - ["Evidence pooled", "2,736 effect sizes from 138 studies and 52,629 respondents"]
      - ["Search", "Eight databases, including Scopus, PsycINFO and EBSCO, plus leading conferences; studies from 2013 to December 2022"]
      - ["Screening", "578 papers met the inclusion rules; 440 were dropped because they lacked usable statistics"]
      - ["Devices and settings", "Among others, smartwatches, smart clothing and smart glasses, at home, in cities and in shops, for health, fashion, banking and bookings"]
      - ["Method", "Pooled correlations fitted to a path model, then 13 possible moderators tested on the attitude-intention link"]
      - ["Coding", "Three expert coders recorded each study's numbers, sample and setting"]

  - h: "Friends first, then fun"
    body: |
      The model begins where a buyer begins: deciding whether a device deserves a second look. Two forces were tested at
      this stage, the pleasure people expect from a gadget and the pull of the people around them.

      The social pull came out ahead on both counts. Besides its large effect on ease of use, it lifted how useful a device seemed
      (0.39) and how enjoyable people expected it to be (0.48). The authors give a down-to-earth reason: when people nearby
      use a device without fuss, they set expectations and offer informal help.

      Enjoyment's one contribution was to make a device look more useful (0.33). Ease, the authors argue, comes from
      practical things such as the interface and technical support, not from fun.
    chart: drivers

  - h: "Useful devices feel safer"
    body: |
      Next came the worries. Here usefulness did more work than ease. Devices that looked useful were trusted more (0.39)
      and felt better protected on privacy (0.22). Easy devices were trusted more as well (0.33) and felt a little safer on
      privacy (0.15).

      Trust then fed into overall attitude (0.37). Risk, perhaps surprisingly, did not: its link with
      attitude was not quite significant. Privacy produced the largest path in the whole model, 1.21. For the authors,
      this shows how much consumers prize data protection.

      We would handle that privacy figure with care. A standardised path above 1 is unusual, and in the same data the raw
      correlation between privacy and attitude was only 0.06. That combination often signals an estimate borrowing
      from overlap with the other factors, so it says less about privacy on its own than the size suggests.
    chart: links

  - h: "When liking becomes a plan to adopt"
    body: |
      The last step, from a favourable attitude to an intention to adopt, was a big one in the pooled model. Yet its size
      varied hugely, and the authors hunted for the causes.

      The largest gaps came from the brand on the device and from whether the task was essential, as the chart shows.
      Critical tasks here meant jobs people need done, such as banking, booking a hotel room or buying tickets.

      Other settings mattered too. The link was tighter in healthcare than in fashion (0.30), and the authors credit the
      appeal of health apps on smartwatches for that. It was tighter where younger people dominated the sample (0.30), in Eastern
      rather than Western countries (0.21), and in more recent studies (0.27), a sign, the authors suggest, that people
      are getting used to connected devices.
    chart: settings

  - h: "The authors' advice, and where to take it"
    body: |
      Their advice is brief. Make data privacy a visible part of campaigns. Show in advertising that plenty of people
      already use connected devices to make daily life easier, because what others do weighs so heavily. And since
      essential services turn good feelings into intentions more readily, give extra attention to the less essential
      ones, where a well-known brand can help close the gap.

      For digital marketers, the social finding is the one to build around, and it reaches beyond ads. Setup screens,
      app store pages and the first weeks after purchase are all places where a buyer can see that people like them use
      the device without trouble. This goes a step beyond the results, since the meta-analysis did not look at onboarding.

how_to:                           # 6 steps: 1–2 Ready (decide, prepare), 3–4 Set (build), 5–6 Market (launch, measure)
  - ["Name the one job that matters", "Write down the single task your device or app does that people cannot skip, such as paying, booking, checking a heart rate or locking the door. Make that task the opening line of every product page and app store listing."]
  - ["Find ten happy users", "List ten customers who use the product every week and are happy to be seen with it. Ask each one for a short quote or a photo of the product in their day."]
  - ["Lead with people, then the brand", "Build launch ads and the first setup screen around people like your buyer using the device with friends or family. Show your brand name clearly on the device, the box and the app's first screen."]
  - ["Explain the data in three lines", "Next to the sign-up button, say in three short lines what data the device collects, where it goes and how to switch it off. Link to the full policy, but do not make people read it before they start."]
  - ["Plan the first week", "Send new owners one small task a day for seven days, starting with the easiest. Make every task end with something useful, such as a saved routine or a first weekly report."]
  - ["Ask for an invite after the first win", "Once a new user finishes their first useful task, ask them to invite one friend or household member. After 30 days, check how many invited users are still active, and compare that with users who came from ads."]

expect:
  - "**Win the attitude first.** Across the pooled studies, attitude led on to intention with a path of 0.76, so most of the work lies in getting people to like the device."
  - "**Your numbers will differ.** Almost all the spread in that final step (97.7%) came from genuine contrasts among the pooled studies, not from chance, so test in your own market before trusting any average."
  - "**One approach can travel.** Smart homes, smart cities and smart shops showed no significant differences, and neither did smartwatches compared with smart shirts or glasses."
  - "**Experience pays back.** Samples in which most people had already used the device showed a stronger pull from attitude to intention (0.29), so helping people through their first uses looks worthwhile."

limits:
  - "**Plans, not purchases.** The model ends at attitudes and intentions. Actual buying and day-to-day use were not part of it."
  - "**Surveys, not experiments.** The pooled numbers are correlations, mostly from questionnaires, so they show which factors travel together, not which one drives another."
  - "**A loose overall fit.** One standard check of the model, the comparative fit index, came in at 0.84, below the 0.90 often treated as a minimum, so read individual path sizes as rough guides."
  - "**Easy samples may flatter.** Smaller studies showed stronger links than larger ones, and the authors report the same for student samples against the general public, so published effects may overstate what real customers do."
  - "**Thin evidence in places.** Only 4 coded results involved smart glasses, 6 smart clothing and 5 groups with little experience of the device, so a finding of no difference there may simply reflect too few studies."

faq:
  - q: "What makes consumers adopt Internet of Things devices?"
    a: "Above all, the people around them and a sense that the device is useful. Pooled research on smartwatches, smart homes and other connected products shows that social influence shapes how easy and useful a device seems, usefulness and ease build trust, trust warms attitudes, and attitudes drive intentions to adopt (Ladeira et al., 2025)."
  - q: "What counts as the Internet of Things for consumers?"
    a: "Everyday objects fitted with sensors that connect to the internet and to each other, such as smartwatches, smart clothing, smart glasses, home systems and connected shop technology. The authors' own example is a refrigerator that keeps track of food and reorders it."
  - q: "Does a well-known brand help sell a smart device?"
    a: "It seems to. Among the coded results, 16 came from branded devices and 20 from unbranded ones, and the move from liking to intending was clearly stronger where a brand was present. The authors see brands as a shortcut to quality and reliability when a technology is new."
  - q: "Do privacy fears stop people buying connected products?"
    a: "Not in a simple way. Once other factors were counted, perceived risk barely moved attitudes, while trust and a feeling that personal data was protected counted for more. Usefulness helped on both counts."
  - q: "Do men and women adopt smart devices differently?"
    a: "Not on this evidence. Results from mostly female samples (29) and mostly male samples (20) showed no significant difference in how strongly attitudes led to intentions, so splitting smart-device campaigns by gender has little support here."

also:
  - doi: "10.1002/mar.22154"
    title: "From Virtual Trainers to Companions? Examining How Digital Agency Types, Anthropomorphism, and Support Shape Para-Social Relationships in Online Fitness"
    authors: "Feng et al."
    journal: "Psychology & Marketing"
    year: 2025
    text: >-
      Five studies built around simulated online fitness classes asked what makes people bond with a virtual coach and stay
      subscribed. Coaches who felt interactive, genuine and good company seemed warmer and more capable, which built
      a one-sided sense of friendship and plans to keep training. A fully computer-generated coach had to feel more genuine
      than a human or avatar coach to get there, and the bond mattered more when the coach gave emotional rather than
      technical support. A coach's warmth looks like part of the retention plan, not decoration.
  - doi: "10.1111/ijcs.13104"
    title: "Facebook and Consumer Research: A Review, AI-Driven Thematic Visualisation, and Research Agenda"
    authors: "Zaveri & Wilk"
    journal: "International Journal of Consumer Studies"
    year: 2024
    text: >-
      This review gathers 336 consumer research papers on Facebook from leading journals, published between 2008 and 2023,
      and maps how their questions changed. An AI text-mining tool sorted the papers into themes and showed research moving
      with the platform itself, most sharply in the last five years. The authors then sift the papers' own suggestions into
      a list of open gaps and lessons for marketers. Before paying for a new study of Facebook audiences, check whether this
      map already holds the answer.

