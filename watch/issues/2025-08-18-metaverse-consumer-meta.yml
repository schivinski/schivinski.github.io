title: "What turns a metaverse shopping experience into intent to buy? What a Journal of Consumer Behaviour study found"
dek: >-
  Pooling 146 articles on AR try-ons, virtual stores and VR worlds, a meta-analysis maps how immersive shopping wins people over.
  Whether the experience runs online, uses AR and serves a real purpose shapes how far a good impression turns into plans to buy.
short_title: "Fun, not flow, drives metaverse shopping"

description: >-
  Ladeira et al. pool 412 results on AR, VR and metaverse shopping: control and vivid visuals build presence, and
  enjoyment, not flow, turns it into liking.

keywords: [metaverse marketing, metaverse consumer behaviour, virtual reality shopping, augmented reality marketing,
  AR vs VR, telepresence, immersive retail experience, VR headsets, consumer enjoyment, purchase intention, meta-analysis,
  Journal of Consumer Behaviour]
topics: [Retail, Creative]

