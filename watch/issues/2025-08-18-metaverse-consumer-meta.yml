  file: 2025-metaverse-consumer-meta.jpg
  og: 2025-metaverse-consumer-meta-og.jpg
  alt: "A young woman in a white VR headset and a loose white sweatshirt holds a motion controller out towards the camera, bathed in purple and pink light"
  caption: "Feeling you are there is only the start. Enjoying it is what changes minds. Photo: Adrià García Sarceda on Unsplash."

short_answer: >-
  Mostly enjoyment, and then a good opinion of the experience. Pooling 412 results from 39,580 participants, the
  researchers found that hands-on control and rich visuals each strengthened telepresence, the feeling of actually being
  in the virtual space. That feeling made experiences more enjoyable, and enjoyment, not deep absorption, carried it into
  a better attitude. Attitude in turn had the closest tie of all to plans to buy, return or recommend.

takeaways:
  - "How much people liked the experience was the best single guide to whether they meant to buy, come back or recommend: on our arithmetic from the pooled correlation, the two shared about 34% of their variation."
  - "Only 4 of the 13 features of setting, technology and product changed how readily a good attitude became intent: AR over VR, online over in store, practical use over novelty, and pleasure-led over functional products."
  - "AR was the strongest of those four: the attitude-to-intention link was 0.36 higher in AR studies than in VR ones, on a correlation scale where the pooled link stood at 0.58."
  - "Wearing a VR headset raised the link from presence to attitude by 0.20 compared with an ordinary screen, a gain that did not carry through to intention."

