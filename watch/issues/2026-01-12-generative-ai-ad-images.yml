title: "Can generative AI make better ad images? What a Journal of Marketing study found"
short_title: "Generative AI images that actually engage"
dek: >-
  Trained on the best-rated ads in its category, an open-source image model produced ads that beat
  conventionally made ones with consumers and on Meta. Here is how it worked, how to apply it, and where it fails.
