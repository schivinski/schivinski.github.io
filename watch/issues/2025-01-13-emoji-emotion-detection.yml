short_answer: >-
  They can, and more finely than a positive or negative score. Three marketing professors in Vienna trained a free tool, NADE, on
  about 110 million emoji-tagged posts. It reads any short text, predicts the emojis a person would attach, then converts those into
  eight emotions such as anger, fear, joy and trust. Against human judges it came closer than word-list tools, open-source AI
  classifiers and GPT-4.

takeaways:
  - "Nearly 70% of studies in top marketing journals that pull feelings out of text still settle for positive versus negative."
  - "In 285,839 tweets about Nike's Colin Kaepernick campaign, a standard tone score turned sharply negative, yet trust, joy and anticipation rose far more than any negative emotion."
  - "Across 1.33 million YouTube videos, titles carrying fear, anger or anxiety went with more views, while joy, trust and anticipation went with fewer."
  - "Word lists found anger, anxiety or sadness words in only about a third of those titles; the emoji route could score 88% to 95% of them."

