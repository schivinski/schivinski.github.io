title: "Can emojis reveal how customers really feel about a brand? What a Journal of Marketing study found"
dek: >-
  Most social listening tools stop at positive or negative. A free tool from WU Vienna first guesses which emojis a writer would
  add, then turns those emojis into eight distinct emotions, and it reads comments closer to the way people do.
short_title: "Reading customer emotions through emojis"

description: >-
  Hotz-Behofsits et al. built NADE, a free tool that reads eight emotions in text by way of emojis; it tracked 920 human raters
  more closely than GPT-4 did.

