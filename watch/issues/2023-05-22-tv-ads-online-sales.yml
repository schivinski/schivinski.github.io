short_answer: >-
  Mostly the second, in this case. A leading online hotel-booking firm aired TV ads in 11 of 126 areas for 15 days and kept
  the rest as a comparison. Online visits and sales rose in the hour or two after each spot. At campaign times with no recent
  spot, they then fell below what the comparison areas predicted. Across the whole campaign, the net effect on sessions and
  sales was statistically indistinguishable from zero.

takeaways:
  - "In the half hour after a spot, average sessions in the TV areas rose from 21.5 to 22.1, a 3% lift that a short attribution window would credit to TV."
  - "Paid routes such as travel comparison sites and paid search carried 56.6% of traffic and sales, and only through these did TV raise sessions and sales over the whole campaign."
  - "Desktops and laptops brought 48.5% of sessions but 66.4% of sales, and only on these did TV add visits and sales across the campaign; phones and tablets showed no net change."
  - "Just 6.8% of sessions included a price-promotion page, yet they produced 16.8% of sales; straight after a spot, it was the sessions without such pages that grew."

