title: "Does TV advertising really lift online sales, or just move them earlier? What a Journal of Marketing Research study found"
dek: >-
  Measurement tools credit a TV spot with the visits and bookings that arrive in the minutes after it airs. A regional test
  by a large online travel agent found that rise was real, but much of it was activity people would otherwise have done later.
short_title: "TV ads that move online sales earlier"

description: >-
  Lambrecht et al. find TV spots raised a travel site's visits and sales within minutes, but over a 15-day test the total
  barely moved: activity came earlier.

keywords: [TV advertising effectiveness, television and online sales, attribution window, intertemporal substitution,
  purchase acceleration, moment marketing, second screen, geo test, synthetic difference-in-differences,
  paid search and travel aggregators, online travel agent, Journal of Marketing Research]
topics: [Advertising, Research methods]

