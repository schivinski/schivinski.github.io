short_answer: >-
  Positive ones, starting with surprise. In two tests, people who tried eyewear or furniture through a brand's AR app,
  rather than its mobile website, reported more amazement and surprise. Those who felt more surprised also felt more
  excited, joyful and happy, and both sets of feelings went with a stronger desire to use the app. The eyewear app
  also stirred anger and frustration, but those feelings showed no link to that desire.

takeaways:
  - "Of 17 positive feelings tested after a virtual makeup session, 9 held up, in three sets of three: surprise, joy and feeling capable."
  - "Positive feelings accounted for 46.4% of the differences in students' desire to use an eyewear try-on app; negative feelings accounted for 1.0%."
  - "Feeling powerful, protected or capable was linked to desire for the app in only 1 of the 3 models tested."
  - "In the furniture study, desire to use the AR app accounted for 28.8% of the differences in willingness to purchase from the retailer."

