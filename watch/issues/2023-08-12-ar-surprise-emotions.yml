title: "Which feelings make people want to use an augmented reality shopping app? What a Psychology & Marketing study found"
dek: >-
  Seeing glasses on your own face or furniture in your own room through a phone camera brings surprise and amazement.
  Three studies with 638 people trace how that surprise goes with joy and with wanting the app, while frustration shows
  no measurable link.
short_title: "Why AR apps need to surprise people first"

description: >-
  Soon et al. find AR shopping apps set off surprise first, which goes with joy, and only positive feelings link to
  wanting the app, across three studies.

keywords: [augmented reality marketing, AR shopping apps, emotions in augmented reality, wow effect, surprise and amazement,
  consumption emotions, desire to use AR, virtual try-on, willingness to purchase, AR app design, Psychology & Marketing]
topics: [Retail, Advertising]

