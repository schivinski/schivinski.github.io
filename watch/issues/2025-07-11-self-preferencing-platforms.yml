title: "Do online marketplaces push their own products up the search results? What a Journal of Marketing study found"
dek: >-
  A platform that runs a marketplace and sells on it could tilt search results towards itself. Daily data on more than
  5,000 products across three European Amazon marketplaces found little sign of that, and the platform's own brand
  was shown less than its strengths would justify.
short_title: "Do marketplaces favour their own products in search?"

description: >-
  Jürgensmeier and Skiera find little sign Amazon favours its own offers in organic search, and its own brand got about
  half the visibility of close rivals.

keywords: [self-preferencing, platform self-preferencing, marketplace search rankings, Amazon search results,
  organic search visibility, private label brands, Amazon Basics, buy box, third-party sellers, Digital Markets Act,
  platform neutrality, Journal of Marketing]
topics: [Search, Retail]

