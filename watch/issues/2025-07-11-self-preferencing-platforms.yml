short_answer: >-
  Mostly not, on this evidence. In nonpersonalized organic search on Amazon's German, French and British sites in 2020
  and 2021, products were not reliably more visible on days Amazon itself was the seller, once price, sales, reviews and
  delivery were accounted for. The platform's own Amazon Basics brand fared worse: it was about half as visible as
  comparable rival private labels. The authors found little self-preferencing, and some of the reverse.

takeaways:
  - "Before adjustment, best-sellers looked 11.4% to 38.6% more visible when Amazon was the default seller; with sales, price, reviews and Prime delivery held constant, the pooled gap fell to 1.7%, indistinguishable from zero."
  - "Amazon Basics products sold better, cost 1.0% less on average and had 4.5 times as many reviews as their rivals, yet were 9.6% less visible even before adjustment."
  - "Category by category the picture split: in the buy-box study, 11 category and country pairs showed self-preferencing and 8 showed the reverse."
  - "Amazon Basics products had 2.9 times the sponsored visibility of comparable rival products, which may offset part of their weaker organic showing."

