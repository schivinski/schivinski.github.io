short_answer: >-
  Only a little. Across two online tests with about 250 Instagram users in Germany and the UK, a “Retouched person”
  stamp on a creator's sponsored photos helped people who noticed it spot the editing. It did not make her seem more or
  less authentic or credible, and adding it did little for the brand. The exception was followers who cared deeply about
  the product: when they spotted the edits, the creator lost credibility.

takeaways:
  - "A stamp printed on the photo was easy to miss: only 40 of the 80 German participants shown it could recall it afterwards, against about 80% of the British women shown it."
  - "Credibility barely shifted across three versions of the skincare posts: 4.93 out of 7 for untouched photos, 4.88 for edited ones and 4.74 for edited ones carrying the label."
  - "Edited photos with no label cost the brand a little: its liking score fell from 5.43 to 4.96 on a seven-point measure, and labelled edits landed between the two at 5.10."
  - "Some people imagined the label: 14 of the 73 Germans who saw no stamp at all said they had seen one."

