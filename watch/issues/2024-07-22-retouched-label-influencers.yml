title: "Do “retouched” labels on influencer photos change how followers see the creator? What an International Journal of Advertising study found"
dek: >-
  Norway already makes influencers stamp edited photos in sponsored posts, and other countries have weighed the same rule.
  Two experiments, one German and one British, show the stamp is easy to miss and rarely costs a creator trust, except with
  the followers who care most about the product.
short_title: "Retouch labels: easy to miss, rarely costly"

description: >-
  Mucundorfeanu et al. find a “Retouched person” stamp helps Instagram users spot edited influencer photos but rarely dents
  trust, except among product fans.

keywords: [retouched photo labels, digitally altered images disclosure, influencer marketing, Instagram photo editing,
