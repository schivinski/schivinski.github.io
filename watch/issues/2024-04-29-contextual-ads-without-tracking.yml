short_answer: >-
  Partly, and the tools are getting better. This review of advertising and computing research argues that software can now
  read the page an ad will land on, including its subject, its emotional tone and how absorbed readers are, and bid on that
  instead of on a person's history. It reports no new data. In the authors' view it works best combined with gentler,
  privacy-friendly forms of personal targeting, and want people checking what the machines decide.

takeaways:
  - "Google alone serves about 29.8 billion ad impressions a day across roughly 200 million websites, so judging each page by hand is out of the question."
  - "Having a large language model label a 750-word article costs a few US cents and takes about 60 seconds, against the roughly 400 milliseconds an ad auction allows, so each article is labelled once and the result reused."
  - "Personal data keeps its pull: pages with cookies switched off were reported to earn 50% to 80% less from ads."
  - "In an IAB Europe survey, 80% of advertisers called brand safety a top priority, even though controlled tests of harm from bad neighbouring content are scarce."

