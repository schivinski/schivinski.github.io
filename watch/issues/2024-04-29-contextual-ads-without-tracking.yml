title: "Can AI place relevant ads without tracking people? What a Journal of Current Issues & Research in Advertising review found"
dek: >-
  Privacy laws and wary shoppers are pushing advertisers to buy space by what is on the screen rather than by who is looking.
  Two computer scientists in Sweden map how AI reads a page's subject, mood and grip on its readers, and where that reading still trips up.
short_title: "Placing ads by the page, not the person"

description: >-
  Häglund and Björklund review how AI can read a page's topic, mood and reader focus to place ads without personal data, and
  where automated placement misfires.

