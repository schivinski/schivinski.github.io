short_answer: >-
  Yes, if they choose what to reveal. Across 5,565 TikTok posts from eleven luxury fashion accounts, behind-the-scenes
  production content drew the strongest engagement of any transparency theme. In an experiment with 230 British luxury
  shoppers, a production video raised perceived openness and left exclusivity intact. A video about the brand's social impact
  raised openness too, but at a cost to exclusivity.

takeaways:
  - "83% of the posts carried no transparency claim of any kind."
  - "A playful tone appeared in few posts but drew a median of 22,700 likes; the formal tone used in 57% of posts did worse."
  - "Kering's group account made explicit transparency claims in just 4% of its posts, against 10% explicit and 36% implied at LVMH."
  - "In the experiment, perceived transparency was linked to engagement more than three times as strongly as perceived exclusivity."

