title: "Should luxury brands show how their products are made on TikTok? What a Journal of Advertising Research study of 5,565 posts and an experiment found"
dek: >-
  Younger audiences expect brands to be open about their workshops and their values. Luxury depends on a degree
  of distance. A study of eleven luxury accounts on TikTok, an experiment and interviews with senior managers show which kind
  of openness helps and which kind costs exclusivity.
short_title: "How luxury brands can be open on TikTok and stay exclusive"

description: >-
  Khan et al. coded 5,565 luxury TikTok posts and tested three videos: showing how products are made raised openness without
  costing exclusivity.

keywords: [luxury brands on TikTok, luxury brand transparency, brand exclusivity, behind-the-scenes content, production
  transparency, social impact communication, CSR communication, TikTok marketing, luxury fashion marketing, signaling theory,
  brand ambassadors, Journal of Advertising Research]
topics: [Social media, Creative, Influencers]

