title: "Does a countdown, or a say over when ads play, make free-app advertising less annoying? What a Journal of Advertising study found"
dek: >-
  On the free tier of a video or music app, people pay for the content with their attention. Three US studies show that a
  timer on each ad, or letting viewers pick when the ads run, makes the same interruption easier to bear, and that the
  advertiser and the app both come out ahead.
short_title: "Why free-app ads need a timer or a choice"

description: >-
  Riedel et al. find a countdown, or a choice over when ads play, makes freemium ads seem less intrusive and lifts brand
  memory and liking in three US studies.

keywords: [freemium advertising, ad-supported streaming, ad countdown timer, ad timing choice, skippable ads,
  advertising intrusiveness, psychological reactance, brand recognition, YouTube ads, free tier user experience,
  Journal of Advertising]
