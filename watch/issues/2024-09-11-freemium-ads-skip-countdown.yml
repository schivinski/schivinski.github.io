short_answer: >-
  Yes, and the advertiser gains as well as the app. In US experiments where still ads broke into a YouTube video, letting
  people choose when the ads played, or showing a countdown, made the breaks feel less intrusive. Less intrusion meant less
  irritation, and that went with better memory for the brands and warmer feelings towards the ad, its brand and YouTube.
  Offering both controls at once added nothing.

takeaways:
  - "A visible timer lifted brand memory: viewers chose the correct brand name 1.82 times out of two when each ad counted down, against 1.66 when it did not."
  - "Being asked when to take the ads lifted the advertised brand's seven-point score to 4.79, compared with 4.27 for viewers who were not asked. The ad's own score rose to 4.67, compared with 4.01."
  - "The app gained too. Among viewers given no say over the ads, simply adding a countdown lifted their rating of YouTube from 5.16 to 5.58 out of 7."
  - "A choice of ad timing did nothing for memory on its own: viewers who picked their slot recognised 1.73 brands out of two, and viewers given no choice recognised 1.74."

