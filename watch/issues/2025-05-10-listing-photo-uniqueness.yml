short_answer: >-
  Up to a point. A model rated how distinct each New York Airbnb photo looked next to all the others. Set against
  occupancy, the scores traced an arc: listings with fairly ordinary pictures gained as those pictures grew more
  distinctive, but beyond a middle level demand slipped again. Very distinctive homes lost less when guests rated them highly and hosts replied
  quickly. Tested as a simple straight line, uniqueness showed no link to bookings at all.

takeaways:
  - "For listings on the rising side of the arc, photos one standard deviation more distinctive went with 15.9% higher occupancy, worth roughly $9,810 in extra yearly revenue for an average New York listing, by the authors' reckoning, if it stays open all year."
  - "Editing out three or four objects the model had flagged, such as lamps, a pillow or wall art, made online viewers about 22 percentage points less likely to choose that photo as one of the most unique."
  - "Each extra point on the model's scale raised the chance that lab participants put a photo among their three most unique, out of 12, by about 4 percentage points."
  - "In the authors' worked example, lifting the guest rating from 80 to 90 out of 100 was worth roughly nine times more to a listing past the sweet spot than to one still short of the peak."

