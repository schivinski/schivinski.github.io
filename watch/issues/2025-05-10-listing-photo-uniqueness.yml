title: "Do listing photos that stand out win more bookings? What a Journal of Consumer Research study found"
dek: >-
  On Airbnb and other peer-to-peer sites, buyers judge one-off offers mostly from pictures. A model trained on New York
  listing photos, then checked against people's eyes and choices, shows that looking different pays only up to a point,
  and that strong ratings let bolder listings go further.
short_title: "Stand out in your listing photos, but not too far"

description: >-
  Feng et al. scored 481,747 Airbnb photos for visual uniqueness: bookings rose with it up to a point, then fell, and good
  ratings softened the fall.

keywords: [visual uniqueness, Airbnb listing photos, peer-to-peer marketplaces, listing photo tips, product photography,
  image analytics, machine learning in marketing, contrastive learning, eye tracking, host ratings, Journal of Consumer Research]
topics: [Creative, AI, Retail]

