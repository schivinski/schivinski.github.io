title: "Does meme marketing work? What a Journal of Marketing study found"
short_title: "When brand memes sell, and when they flop"
dek: >-
  A meme ad more than doubled click-through in a real campaign and lifted return on ad spend. Six studies show why
  memes work, and two conditions that switch the effect off: the meme's age and the product you sell.
description: >-
  In a field test, a meme ad doubled click-through (1.40% against 0.65%) and raised ROAS from 1.14 to 1.52. Memes
  work only when mature and for mainstream products.
