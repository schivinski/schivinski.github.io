short_answer: >-
  Yes, and in a way that is easy to miss. In a study of 12,949 live product pitches, the more often a host's face
  changed mood, the more reactions came in up to a point, yet unit sales kept falling. The worst swings were full
  reversals. When viewers' chat stayed on the product, the damage shrank, and most of it landed within three minutes.

takeaways:
  - "Reactions peaked at about 1.5 to 1.8 mood changes a minute and then fell. Sales fell across the whole range."
  - "A full swing from one end of the mood scale to the other left expected sales at roughly 10 to 12% of baseline when it happened now and then."
  - "With product talk at about 63% of the chat, expected sales stayed at 70% of baseline. At about 7%, they fell to 14%."
  - "The sales drop began in the first minute after a swing, and most of it landed in the next three."

