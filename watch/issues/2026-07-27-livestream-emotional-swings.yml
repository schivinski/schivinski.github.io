title: "Do a livestream host's mood swings hurt sales? What a Journal of the Academy of Marketing Science study found"
short_title: "Mood swings win likes and lose sales"
dek: >-
  Hosts who change expression often keep the chat busy. They also sell less. In 12,949 real product pitches, the
  same swing that drew people in pushed them away from the checkout.

description: >-
  In 12,949 live product pitches, a sharp swing from happy to upset, or back, cut expected sales to about a tenth.
  Product chat softened the drop.

keywords: [livestream commerce, live shopping, live stream selling, influencer marketing, emotional expression,
  facial expression, viewer engagement, sales conversion, Douyin, live commerce chat, host behaviour, Journal of the
  Academy of Marketing Science]
