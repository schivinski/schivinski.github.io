short_answer: >-
  On average, yes, but it depends on the shopper's frame of mind. In one US experiment, people told they were dealing
  with a chatbot spent less of a small cash bonus on a chance to win the product, unless a few lines about progress and
  ideals had come first. In a live chat, the bot label lowered engagement among people with a weak habitual focus on
  progress, and engagement is what led on to wanting to buy.

takeaways:
  - "Primed to think about safety and caution, people bought 2.58 one-cent prize-draw tickets for the product on average, out of a 50-cent bonus, when the agent was a chatbot, against 6.69 when it was a person."
  - "Primed to think about progress and ideals instead, people who dealt with the chatbot bought 5.34 tickets on average, against 4.31 for those who dealt with a person."
  - "In a live Facebook chat, the bot label significantly lowered engagement only for people scoring below 2.62 on promotion focus; the average score was 3.41."
  - "Engagement was the link to buying: with it included, the model covered 47% of the spread in purchase intention across participants, and the bot label had no direct effect."

