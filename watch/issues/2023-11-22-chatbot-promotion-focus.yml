title: "Do shoppers buy less when a chatbot does the selling? What a Journal of Consumer Behaviour study found"
dek: >-
  Being told the sales assistant is a bot made people less ready to buy in two US experiments. A short message about
  progress and personal goals removed that drop, and in a live chat, a habitual focus on growth kept people involved with
  the bot.
short_title: "When a chatbot costs a sale, and when it does not"

description: >-
  Khan et al. find people are less willing to buy after dealing with a chatbot than with a person, unless they are focused
  on progress and personal goals.

keywords: [chatbot marketing, chatbot vs human agent, AI customer service, conversational commerce, regulatory focus theory,
  promotion focus, prevention focus, customer engagement, purchase intention, algorithm aversion, live chat,
  Journal of Consumer Behaviour]
topics: [AI, Service]

