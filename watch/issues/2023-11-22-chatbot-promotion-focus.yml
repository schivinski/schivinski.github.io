short_answer: >-
  On average, yes, but it depends on the shopper's frame of mind. Across two US experiments, people told the assistant
  was a chatbot rather than a person were less keen on buying what it described. That drop did not appear among
  people nudged towards progress and personal ideals. In a live chat, people who habitually think that way stayed
  engaged with the bot, and engagement is what led on to wanting to buy.

takeaways:
  - "Primed to think about safety and care, people bought 2.58 one-cent prize-draw tickets for the product on average, out of a 50-cent bonus, when the agent was a chatbot, against 6.69 when it was a person."
  - "Primed to think about progress and ideals instead, people who dealt with the chatbot bought 5.34 tickets, no fewer than the 4.31 bought by those who dealt with a person."
  - "In a live Facebook chat, the bot label clearly lowered engagement only for people scoring below 2.62 on promotion focus; the average score was 3.41."
  - "Engagement was the route to buying: with it included, the model explained 47% of why purchase intention differed between people, and the bot label showed no direct effect."

