title: "Does AI on a hotel's social media bring guests back? What an International Journal of Advertising study found"
dek: >-
  Guests who credited a hotel's social media with smart, AI-driven marketing felt a closer tie to its brand and were
  keener to return, a survey at five Tehran hotels suggests. Offers worked for the chains; data worries held the
  independents back.
short_title: "AI on hotel social media and the guests who return"

description: >-
  Shabankareh et al. tie AI-driven social media to closer hotel brand bonds and return plans among 854 guests, but
  privacy worries hold back independents.

keywords: [AI in hotel marketing, AI on social media, hotel social media marketing, revisit intention, customer brand
  engagement, conversion rate optimization, privacy concerns, chain vs independent hotels, hospitality advertising,
  International Journal of Advertising]
topics: [AI, Social media, Privacy]

