short_answer: >-
  It is linked to return plans, mostly through the bond guests feel with the brand. In a survey of 854 guests at two chain
  and three independent hotels in Tehran, those who perceived more AI in their hotel's social media felt more connected to
  its brand, and that connection, along with satisfaction, went with plans to come back. Social media booking offers tied to satisfaction only
  at the chains, and privacy worries dampened return plans only at the independents.

takeaways:
  - "Of the 6 main links tested, a satisfying stay had the strongest tie to plans to come back, at chains and independents alike."
  - "At the 2 chain hotels, free-cancellation and other booking offers seen on social media went with happier guests; at the 3 independents that link was too weak to count."
  - "At the independents, privacy worries weakened both of the 2 routes to a return visit, the brand bond and the satisfying stay; at the chains they changed neither."
  - "Chains and independents differed reliably on just 3 of the 8 links compared, and AI's tie to a closer brand bond held at both."

