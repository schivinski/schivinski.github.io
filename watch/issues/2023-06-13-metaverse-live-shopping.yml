short_answer: >-
  Partly. A professional cyclist presented the same cycling gear twice: on Instagram Live to 54 followers and, a week
  later, to 41 others in a virtual room where everyone appeared as an avatar. The virtual-room audience felt more
  transported and found the show more novel and interesting, yet judged it no more helpful for choosing products. Both
  kinds of value raised satisfaction, which fed the wish to return and recommend.

takeaways:
  - "Followers in the virtual room rated the show 0.65 points higher than Instagram viewers on novelty, interest and curiosity (scored 1 to 7)."
  - "The virtual room added nothing to how useful the show was for choosing cycling products: the difference was 0.014 points, statistically indistinguishable from none."
  - "Satisfaction with the show, together with two background factors, explained 47% of the variation in followers' wish to keep attending such shows."
  - "Each extra point of involvement with the cyclist's content cut the virtual room's advantage in experiential value by 0.57 points, so the least involved followers gained most."

