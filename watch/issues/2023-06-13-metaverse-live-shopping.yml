title: "Does live-stream shopping work better in the metaverse than on Instagram? What an Electronic Markets study found"
dek: >-
  Live-stream shopping lets influencers sell in real time. Researchers in Spain compared an Instagram Live with the same
  show held in a virtual room: immersion made the event more absorbing, but it did not help anyone work out what to buy.
short_title: "Live shopping in a virtual room versus Instagram Live"

description: >-
  Barta et al. find a cyclist's live show in a virtual room felt more immersive and novel than on Instagram Live, but
  no more useful for choosing products.

keywords: [live-stream shopping, live shopping, metaverse marketing, Instagram Live, influencer marketing, telepresence,
  virtual events, Mozilla Hubs, experiential value, customer satisfaction, follower engagement, Electronic Markets]
topics: [Influencers, Social media, Retail]

