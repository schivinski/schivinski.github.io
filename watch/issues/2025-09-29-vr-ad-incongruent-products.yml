short_answer: >-
  Products whose ad pulls against the reason people buy them. Across four online tests, people who watched a
  360-degree ad through their own VR headset were readier to like and share it than computer viewers, because
  they got more absorbed in its story. The gain was largest for mismatches, such as showing practical
  buyers how a car feels. When message and buying reason matched, the headset made no reliable difference.

takeaways:
  - "On YouTube, the 360-degree version of a mobile game ad collected roughly 2.5 times the likes per day of a near-identical flat cut, and about 3 times the comments."
  - "Switching from a computer screen to a headset raised stated willingness to engage with a 360-degree ad by 36% for an Oreo video and 48% for a car ad."
  - "When the car ad's focus clashed with how viewers saw the car, the headset lifted engagement by more than 2 points on an 11-point scale."
  - "When focus and buying reason matched, headset and computer scores sat within 0.51 points of each other, too close to call."

