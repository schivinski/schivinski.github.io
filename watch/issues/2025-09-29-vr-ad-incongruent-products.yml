title: "Which products are worth advertising in virtual reality? What a Psychology & Marketing study found"
dek: >-
  More people now watch video through a VR headset, and 360-degree ads can reach them there. Across five studies, the
  headset made viewers keener to like and share because it drew them into the story, and it helped most when an ad pitched
  a product at odds with why people buy it.
short_title: "VR ads pay off when the pitch clashes"

description: >-
  Hsieh et al. find viewers would sooner like and share a 360-degree ad seen through a VR headset, most of all when its
  pitch clashes with why they buy.

keywords: [VR advertising, virtual reality ads, 360-degree video ads, 360 video marketing, narrative transportation,
  consumer engagement, immersive advertising, hedonic and utilitarian products, search and experience products,
  ad incongruity, YouTube 360 video, Psychology & Marketing]
topics: [Advertising, Creative]

