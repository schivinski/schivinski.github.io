title: "Is ChatGPT changing the reviews people write? What an International Journal of Research in Marketing study found"
short_title: "When ChatGPT went dark, reviews got shorter"
dek: >-
  In spring 2023 Italy switched ChatGPT off for a month. Reviews written on computers came in thinner and a touch
  harsher. A natural experiment shows what AI help is already doing to the text your customers read.

description: >-
  When Italy blocked ChatGPT for four weeks, hotel reviews written on desktop fell 2% in number and 9% in length.
  AI help is quietly reshaping reviews.

