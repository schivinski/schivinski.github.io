short_answer: >-
  Yes, a little, and mostly on computers. During a four week ChatGPT block in Italy, desktop hotel reviews there thinned out
  against four neighbouring countries: slightly fewer reviews, noticeably shorter ones, a touch less opinion and
  slightly lower stars. The effects are modest and the study
  covers one country and one month, but it is a rare clean test.

takeaways:
  - "Under the block, reviews written on computers fell about 2% in number and 9% in length, against hotels in countries with no ban."
  - "Phone reviews did not drop the same way. The ChatGPT app was awkward to use at the time, so most AI help happened on computers."
  - "In a survey of reviewers, 63% of 95 Americans and 32% of 88 Italians had used AI to help write one, mainly to save effort."
  - "Desktop star ratings slipped by under a tenth of a star during the block, and the wording was a little less subjective."

