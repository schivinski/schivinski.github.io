short_answer: >-
  There is no single safe number, but the middle is the worst place to be. Across four studies, engagement with an
  influencer's sponsored posts followed a U-shape: highest for influencers who rarely post ads and for those who post
  mostly ads, and lowest for those in between, at around 40% to 50% sponsored on Instagram and 52% on Douyin. Mixed
  feeds make followers suspect manipulation without yet signalling that brands value the influencer.

takeaways:
  - "When an influencer showed 2 sponsored posts out of 5, only 21.7% of followers shared the next ad, against 41.8% with no prior ads and 44.4% with 4 out of 5."
  - "On Instagram, engagement bottomed out when 39% to 48% of an influencer's posts were sponsored; on Douyin, at 52%."
  - "Influencers who post ads all the time are not a lost cause: those above 73% sponsored on Instagram kept about 90% of the best engagement."
  - "Influencers who often talk about the product type in their own unpaid posts, or who endorse many different brands, are hurt less by a mixed feed."

