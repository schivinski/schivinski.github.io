title: "How many sponsored posts is too many for an influencer? What a Journal of Marketing study found"
short_title: "Why half-sponsored influencers get the least engagement"
dek: >-
  The usual advice is to avoid influencers who post lots of ads. Four studies with Instagram, Twitter and Douyin
  data say otherwise: engagement is lowest for influencers stuck in the middle, not for the ones who sponsor the most.
description: >-
  Influencers who post mostly ads or almost none get the most engagement; those at around 40–50% sponsored get the
  least. How to pick influencers by endorsement rate.
