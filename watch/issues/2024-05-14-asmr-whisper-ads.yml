title: "Do whispered ASMR voiceovers help or hurt an ad? What a Journal of Retailing and Consumer Services study found"
dek: >-
  Whispered ASMR clips are a YouTube staple, and brands from flat-pack furniture to beer have tried the style. Three experiments
  that re-voiced the same ads find viewers on average liked the hushed version less, while the minority who feel the tingle warmed to
  ad and brand alike.
short_title: "Why whispered ASMR ads split the audience"

description: >-
  Cohen et al. find a whispered ASMR voiceover made viewers like an ad less in three experiments, hurt an unknown brand, and
  won over only those who felt tingles.

keywords: [ASMR advertising, ASMR ads, whisper voiceover, sonic branding, sound in advertising, video ad creative,
  attitude toward the ad, brand attitude, unknown brands, sensory marketing, Journal of Retailing and Consumer Services]
topics: [Advertising, Creative]

