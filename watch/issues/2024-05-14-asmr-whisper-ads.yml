  caption: "The whisper that soothes one listener can grate on the next. Photo: Erwi on Unsplash."

short_answer: >-
  Mostly they hurt it. Across three online tests involving 771 people, the same video ad was voiced either normally or in a
  hushed ASMR style. The whispered cut was liked less every time. Two famous brands came through unscathed, but an SUV ad stripped
  of its branding lost ground as a brand too. The exception was viewers who feel ASMR's tingle: for them, the whisper lifted the
  mood and the ratings.

takeaways:
  - "For the chocolate maker, the brand's own rating hardly moved: 5.97 out of 7 after the normal ad and 5.86 after the whispered one, a gap small enough to be chance."
  - "With all branding removed from the SUV footage, the brand took a hit as well, sliding from 5.00 to 4.59, out of a possible 7, once the voice dropped to a whisper."
  - "A whisper on its own is a mild cue. Asked how much each ad felt like ASMR, viewers placed the whispered cuts between 3.58 and 3.96 out of 7, against 2.17 to 2.35 for the normal ones."
  - "Most viewers knew the genre already: between 74% and 78% of each group had heard of ASMR, so only a quarter or fewer were new to it."

