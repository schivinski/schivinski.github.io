short_answer: >-
  Mostly how likeable and relatable they seem. Two surveys, of 417 young Vietnamese social media users and 249 Americans
  who follow money creators, found that the sense a creator could be a friend did most to build a one-sided bond, with
  trust and similar views next. Good looks did least. That bond went with how often people came back to the account
  far more than with how long they had followed it.

takeaways:
  - "Among US followers of money creators, likeability weighed most in the bond, with a model weight of 0.35 (zero would mean no tie), ahead of honesty (0.25) and a shared outlook (0.21); expertise and looks had no direct link at all."
  - "What made a creator seem honest differed by audience: in Vietnam it was mainly expertise (0.36), while finfluencer followers leaned on likeability (0.51) more than on financial know-how (0.33)."
  - "Follower tenure was hard to predict: the models accounted for only 6% to 8% of its ups and downs, while weekly visits came out at 14% to 20%."
  - "Vietnamese followers rated their favourite creator highest on expertise, at 4.38 where 5 was the top score, and lowest on being like them, at 3.40."

