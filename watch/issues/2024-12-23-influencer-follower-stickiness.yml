title: "What makes followers stick with an influencer? What an Australasian Marketing Journal study found"
dek: >-
  Brands pay for creators whose audiences keep coming back. Surveys in Vietnam and among US fans of finance creators show
  that a warm, relatable manner holds people better than a pretty face, and that the pull is clearest in repeat visits rather
  than in years on the follower list.
short_title: "Why likeable creators keep their followers"

description: >-
  Vu et al. survey 666 followers in Vietnam and the US: creators who feel like a friend build the strongest bond, and that
  bond tracks how often fans come back.

keywords: [influencer stickiness, parasocial interaction, parasocial relationships, influencer source credibility,
  influencer likeability, follower loyalty, financial influencers, finfluencers, influencer selection,
  Australasian Marketing Journal]
