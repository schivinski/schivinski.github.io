short_answer: >-
  It depends on the job. A survey of 1,050 online shoppers and a two-month TikTok launch for two Finnish energy drinks gave
  the same split. A brand's own paid posts drew more engagement, such as clicks and interest, while posts from influencers did
  more to move buying. Run in the same weeks, each still did its own job, and both lifted sales in shops the campaign
  never linked to.

takeaways:
  - "In the survey, a paid brand ad lifted engagement about 62% more than identical content said to come from an influencer people followed."
  - "For purchase intent the order flipped: the creator version raised it about 75% more than the paid brand ad."
  - "On TikTok, each 10% rise in daily influencer views went with roughly 1% more units sold; the same rise in brand-ad views went with about 0.3%."
  - "Paid brand ads were seen far more often, about 32,400 times a day against about 3,100 for the creators' posts, and were clicked at 0.20% against 0.15%."

