title: "Should you spend on your own social ads or on influencers? What an Australasian Marketing Journal study found"
dek: >-
  Most brands now pay for two kinds of social post: ads in their own name and posts from creators. A survey of online shoppers
  and a real TikTok launch of two Finnish energy drinks suggest they are not rivals. Each is better at a different job.
short_title: "Brand ads engage, influencers sell"

description: >-
  Kumar et al. find a brand's own paid social posts win more engagement, while influencer posts sell more, in a 1,050-person
  survey and a TikTok drinks launch.

