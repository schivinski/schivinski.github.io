title: "Why do shoppers abandon online carts? What a Journal of Consumer Research study found"
short_title: "Treats in the cart, guilt at checkout"
dek: >-
  Carts full of treats get abandoned more than carts full of practical items, because indulgence feels harder to
  justify. Across almost 15 million items and four experiments, one fix stood out: recommend something practical.
description: >-
  Carts with more indulgent items are abandoned more often. Recommending a practical add-on cut abandonment from 4.61
  to 3.64 out of 7. Here is how to use it.
