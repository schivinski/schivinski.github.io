short_answer: >-
  Partly because of what is in them. Carts with a higher share of indulgent (hedonic) items, such as chocolates,
  scented candles or novelty T-shirts, were more likely to be abandoned than carts of practical (utilitarian) items.
  The whole cart feels more indulgent, and buying it feels more guilt-inducing. Recommending a practical add-on reverses
  this: shoppers saw the cart as less indulgent, felt less guilty and were less likely to abandon it, even if they
  added the extra item.

takeaways:
  - "In a four-item cart, swapping practical items for indulgent ones raised the likelihood of abandoning it from 4.41 to 5.07 out of 7, and raised guilt from 2.66 to 3.71."
  - "Field data from two online stores, with almost 15 million items bought or abandoned, showed the same pattern: the higher the share of indulgent items, the more often carts were abandoned."
  - "Recommending a practical item (\"One more item you need\") cut abandonment of a cart holding one treat from 4.61 to 3.64; recommending another treat cut it only to 4.18."
  - "The practical recommendation worked even when shoppers assumed the item was added, which roughly doubled what they would pay."

