title: "Do shoppers just take the first product an AI assistant offers? What a Journal of Interactive Marketing study found"
short_title: "When the assistant speaks first, it sells"
dek: >-
  Ask a voice assistant for batteries and it reads out one product at a time. Half of shoppers bought the very first
  one, and the brand placed first won most of the sales, whether it was the retailer's own label or the market leader.
description: >-
  Half of 484 voice shoppers bought the first product Alexa offered. What that means for brands, retailers and any
  AI assistant that recommends one option at a time.
