short_answer: >-
  It depends on how often they already review. In seven experiments with 2,444 people in the US and Europe, frequent
  reviewers grew keener to post when their verdict clashed with the average rating, because a contrary review let them
  stand out. Occasional reviewers felt no such pull and saw mainly the risk of being judged. A warmer invitation email and
  fewer ways to vote reviews down made them readier to speak up.

takeaways:
  - "Telling Amazon shoppers they belonged to the group who review a lot raised their stated likelihood of posting a dissenting review of a disappointing novel from 3.49 to 4.31."
  - "Among frequent reviewers, holding the minority view on a pair of headphones lifted intention to post from 4.21 to 5.41 out of 7; for occasional reviewers the shift, 3.48 to 3.88, was too small to count."
  - "An invitation email that praised unique and diverse views was rated as doing more to put people at ease about sharing (4.60 against 3.68 out of 7), although both emails read as equally clear requests (6.29 and 6.39)."
  - "Letting other users comment and vote a review unhelpful made posting feel riskier across the board: the social risk score of occasional reviewers climbed from 1.84 to 2.75, and that of frequent ones from 1.83 to 2.16."

