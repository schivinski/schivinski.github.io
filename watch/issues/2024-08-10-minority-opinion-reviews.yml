title: "Will customers post a review when they disagree with the star rating? What an International Journal of Research in Marketing study found"
dek: >-
  On most review sites a handful of regulars write much of what you read, and everyone else posts now and then. Seven
  experiments show that disagreeing with the average rating draws the regulars in, leaves occasional reviewers cold, and that
  two cheap changes can get the quieter customers posting.
short_title: "Who posts a review when the crowd disagrees"

description: >-
  Möller-Herm et al. find frequent reviewers are drawn to post when they differ from the average rating, while occasional
  ones hold back for fear of being judged.

keywords: [online reviews, review request emails, minority opinion, star ratings, frequent reviewers, review platform design,
  spiral of silence, review helpfulness votes, user-generated content, customer feedback,
  International Journal of Research in Marketing]
topics: [UGC, Retail, Service]

