short_answer: >-
  Not on the evidence so far. Pooling 41 studies, the researchers found that machine-learning models read personality from
  likes, posts and other digital footprints only roughly: with flawed tests removed, the guesses captured about 5% of real
  personality differences. Studies built to isolate the gain from matching an ad to a personality found almost none.
  Combine the two steps and the expected benefit is close to zero.

takeaways:
  - "About 4 in 10 personality-prediction studies let test data leak into model training, and those studies reported almost twice the accuracy of the rest."
  - "Only 1 in 3 targeting studies used a design able to tell a personality match apart from an ad that simply works better for everyone."
  - "Weaker designs found a significant targeting effect 75% of the time (18 of 24 estimates). The one sound design did so 18% of the time (2 of 11)."
  - "The typical prediction study had just 6 cases for every input its model used, short of the 10 to 20 usually recommended for even simple models."

