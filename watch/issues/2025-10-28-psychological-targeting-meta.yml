title: "Does psychological targeting with personality-matched ads work? What a Psychology & Marketing study found"
dek: >-
  Guess a person's personality from their digital footprints, then serve them an ad written for that personality: the
  pitch made headlines after Cambridge Analytica. A meta-analysis finds the guessing rough and the matching adding close to
  nothing once weak studies are set aside.
short_title: "Personality targeting, put to a fair test"

description: >-
  Perla et al. pool 41 studies on psychological targeting: footprints predict about 5% of personality, and matched ads add
  almost nothing in sound tests.

keywords: [psychological targeting, personality-based advertising, psychographic targeting, microtargeting, digital footprints,
  Big Five personality prediction, personalised advertising effectiveness, data leakage machine learning, Cambridge Analytica,
  ad testing design, meta-analysis, Psychology & Marketing]
topics: [Personalization, Advertising, Research methods]

