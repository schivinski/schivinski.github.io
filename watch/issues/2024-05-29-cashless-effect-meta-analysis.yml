short_answer: >-
  Yes, but only slightly. Pooling 392 results from 71 papers published over four decades, the researchers found that people
  who paid by card, phone or another cashless method spent a little more than people paying cash. The lift was largest for
  purchases made to show status, vanished for tips and donations, and has been shrinking for years as paying without cash
  has become routine.

takeaways:
  - "Averaged over every result, paying without cash lifted spending by 0.135 on the standard effect-size scale, below the 0.2 that researchers usually treat as a small effect."
  - "Buying to impress produced the biggest lift, roughly 2.5 times that of everyday purchases, though only 13 results from 7 papers looked at it."
  - "Across 41 results on tips and donations from 25 papers, people paying without cash gave about the same as those handing over notes and coins."
  - "Good times widened the gap: the estimated lift was 0.262 when economic growth sat one standard deviation above average, and 0.197 when it sat one below."

