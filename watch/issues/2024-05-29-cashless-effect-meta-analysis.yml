title: "Do people spend more when they pay by card or phone instead of cash? What a Journal of Retailing meta-analysis found"
dek: >-
  Cards, phone wallets and pay-later buttons have pushed notes and coins to the edge of retail. Pooling four decades of
  research, three researchers at Australian universities show that paying without cash does raise spending, but only a
  little, and by less as the years go by.
short_title: "Card or cash: how much more do people spend?"

description: >-
  Schomburgk et al. pool 71 papers on card, phone and cash payments: going cashless lifts spending a little, most for
  status buys and not at all for tips.

keywords: [cashless effect, card vs cash spending, mobile payments, contactless payment, pain of paying,
  payment methods and consumer spending, buy now pay later, checkout design, tipping and donations,
  conspicuous consumption, meta-analysis, Journal of Retailing]
topics: [Retail, Service]

