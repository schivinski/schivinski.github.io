title: "How should a business reply to a positive review? What a Journal of Marketing study found"
short_title: "How to answer customers who praise you online"
dek: >-
  "Thank you!" is not enough, and repeating the praise can backfire. Across six experiments, replies that gently
  downplayed the compliment made people like the business more and pick it more often. Here is the wording that works.
description: >-
  Replying to a 5-star review by downplaying the praise made 60.8% of people choose that business over one that
  repeated the compliment. Wording that works, and what to avoid.
keywords: [how to respond to positive reviews, reply to 5-star review, review response examples, managerial responses,
  online reviews, Google reviews, word of mouth, reputation management, humility in marketing, review response template,
  Journal of Marketing]
