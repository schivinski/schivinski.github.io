short_answer: >-
  A little, if the buzz is the right length. When each add to the cart came with a vibration lasting roughly 0.4
  seconds, people added more, because the shopping felt more rewarding. Over one week in a Swiss grocery chain's app
  with 6,866 customers, orders placed with the buzz held 54.60 items on average against 53.15 without it. A buzz eight times
  longer did no better than none, and impulsive shoppers seemed to respond most.

takeaways:
  - "Of eight buzz lengths from 0.025 to 3.2 seconds, the 0.4-second one felt most like a reward while staying among the least unpleasant."
  - "People given a buzz as feedback on each tap added more than 3 times as many items in 90 seconds as people given a text confirmation: 205 against 64."
  - "In a lab shop with 137 people, baskets filled with a buzz on every add were worth about 27% more than baskets filled without one."
  - "In the real app test, net sales per order rose by about 1.6% for the customers who got the buzz."

