title: "Does a phone vibration on add-to-cart make shoppers buy more? What a Journal of Consumer Research study found"
dek: >-
  More and more shopping apps buzz the moment a product lands in the cart. Four experiments and a seven-day trial in a
  grocery chain's own app show that a buzz of about 0.4 seconds feels like a small reward, and people add a little
  more to their orders because of it.
short_title: "How a short buzz on add-to-cart nudges baskets up"

description: >-
  Hampton and Hildebrand find a 0.4-second phone buzz on each add-to-cart feels like a reward and lifted items per order
  in a week-long grocery app field test.

keywords: [haptic feedback, phone vibration, mobile vibrations, add to cart, shopping cart, mobile commerce, app design,
  haptics in marketing, impulse buying, online grocery shopping, digital nudge, Journal of Consumer Research]
topics: [Retail, Service]

