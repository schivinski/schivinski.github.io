short_answer: >-
  Not yet, but it is changing what search ads can reach. In a study that recorded people's real searches, 76% still
  went to Google, and almost all shopping searches did. But people chose AI search for more than half of their advice
  questions, typed queries nearly three times longer there (11 words against 4), and clicked a link in only 12% of AI
  searches, against 59% on Google. Short keywords look safe for now; long, specific questions are moving to AI.

takeaways:
  - "Three in four searches still went to Google, and 94% of shopping searches did."
  - "For advice questions, such as which product suits a need, people chose AI search 54% of the time."
  - "AI queries averaged 11 words against 4 on Google; only 5% of AI searches were short two-word terms, against 35% on Google."
  - "People clicked a result in 59% of Google searches but only 12% of AI searches."

