title: "Will AI search kill search ads? What a Journal of Advertising Research study found"
short_title: "AI search takes the questions, Google keeps the keywords"
dek: >-
  Researchers recorded every search 52 people made on Google and Gemini for a day. Shopping stayed on Google, advice
  moved to AI, AI queries were nearly three times longer, and AI answers rarely led to a click.
description: >-
  People used AI search for 54% of advice searches but 6% of shopping searches, and clicked in 12% of AI searches vs 59%
  on Google. What it means for search ads.
