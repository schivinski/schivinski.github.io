title: "Should a content teaser stop mid-sentence? What a Psychology & Marketing study found"
dek: >-
  News sites and blogs often cut a preview off halfway through a sentence to pull readers in. Five experiments show the
  trick works when the rest is free, and backfires when readers have to pay to find out how the sentence ends.
short_title: "Why cliffhanger teasers backfire behind a paywall"

description: >-
  Mandler et al. find teasers cut off mid-sentence cost paid sales: 18% of students bought an article after one,
  against 33% after a teaser that finished.

keywords: [content teasers, paywall teasers, curiosity gap, cliffhanger previews, paid content conversion, news paywalls,
  free versus paid content, persuasion knowledge, clickbait, content marketing, digital publishing, Psychology & Marketing]
topics: [Creative, Advertising]

