short_answer: >-
  Only if the rest is free. In five experiments, a preview that broke off partway through a sentence made people keener
  to read or watch free content, but less willing to pay when a paywall came next. With a price attached, the cut-off
  ending looked like a sales trick rather than a hook. For paid content, a teaser that ends on a complete sentence did
  better.

takeaways:
  - "With real vouchers to spend, 18.3% of students bought a €0.49 article after a teaser that broke off mid-sentence, against 33.3% after a teaser that ended cleanly."
  - "In the final experiment, the cut-off ending lifted curiosity about a free travel article (3.88 against 3.49, scored 1 to 7), but not about a paid one, where it sat at 2.79 with a clean ending and 2.58 without."
  - "A camera reading 56 students' faces found their expressions turned about twice as negative in the five seconds after an unfinished teaser and a payment notice, while a finished teaser left them unchanged."
  - "Testing 400 adults online, the team found that cutting off the preview of a free travel article lifted intentions to read on from 4.01 to 4.69 out of 7."

