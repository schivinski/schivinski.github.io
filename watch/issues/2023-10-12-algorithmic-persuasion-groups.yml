title: "Do consumers know that algorithms pick the brand posts they see on social media? What an International Journal of Advertising study found"
dek: >-
  Algorithms decide which brand messages each social media user sees. A Dutch survey sorted 450 users by how aware they
  were of this, how fair it seemed to them and whether they felt able to avoid it, and found four distinct groups that
  call for different kinds of help.
short_title: "Four ways people handle algorithmic brand posts"

description: >-
  Voorveld et al. find four groups among 450 Dutch social media users: most know algorithms pick brand posts, yet far
  fewer think they can avoid them.

keywords: [algorithmic persuasion, algorithmic awareness, persuasion knowledge model, social media advertising,
  personalized advertising, ad avoidance, privacy fatigue, control paradox, consumer vulnerability, digital skills,
  cluster analysis, International Journal of Advertising]
topics: [Personalization, Social media, Privacy]

