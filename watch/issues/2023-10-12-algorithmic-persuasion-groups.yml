short_answer: >-
  Most do, but far fewer feel able to avoid them. A survey of 450 Dutch adults who use social media every week found
  four groups. Two in five knew algorithms shape brand posts and found that broadly acceptable. Just over a quarter knew,
  objected and felt unable to avoid such posts. Nearly one in five barely knew it happened. Only about one in seven combined awareness,
  criticism and confidence that they could avoid them.

takeaways:
  - "Awareness that algorithms tailor brand posts to them ranged from 5.26 to 5.60 (out of 7) in three of the four groups. The fourth group scored 1.85."
  - "Only the largest group leaned towards finding brands' use of algorithms acceptable (4.67, where 4 is neutral). The most skilled group rated it 1.95."
  - "Women made up 60% of the sample but 34.8% of the Skilled and Critical, the group most confident it could avoid algorithmic brand posts."
  - "The least aware group rated its own knowledge of algorithms at 1.47 out of 7, compared with 3.57 in the largest group, and had the least schooling of the four."

