short_answer: >-
  Mostly proof that it does the job better, and a role that leaves people in charge. Combining 136 experiments, 287
  comparisons and 119,358 participants, the researchers found a small but reliable lean towards humans over AI doing the
  same task. That lean shrank when the AI was billed as better at the task than people, gave advice instead of acting
  alone, or covered many kinds of task. Giving it a humanlike face or way of speaking widened it.

takeaways:
  - "AI presented as more capable than a person raised acceptance by 13.15%, the biggest lift of any design feature."
  - "Advisory AI that leaves the decision to people had a 9.36% edge in acceptance over AI that acts on its own."
  - "A general-purpose AI was 7.79% more likely to win acceptance than one built for a single domain."
  - "Women were not warier of AI: in samples that were about 50% female on average, the share of women made no difference to acceptance."

