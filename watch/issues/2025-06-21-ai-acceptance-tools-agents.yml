title: "What makes people accept AI in place of a person? What a Journal of Marketing study found"
dek: >-
  Put an AI and a human on the same task and most people lean, just slightly, towards the human. Pooling 136
  experiments, this meta-analysis shows which design choices shrink that lean and which ones make it worse.
short_title: "Which AI features win people over"

description: >-
  Li et al. pool 287 results from 136 experiments: people lean slightly towards humans over AI, but capable, advisory,
  general-purpose AI narrows the gap.

keywords: [AI acceptance, algorithm aversion, AI aversion vs appreciation, agentic AI, AI agents, human-AI interaction,
  anthropomorphism in AI design, advisory vs autonomous AI, AI transparency, AI product design, meta-analysis, Journal of Marketing]
topics: [AI, Service, Privacy]

