title: "What kind of writing keeps people reading online content? What a Journal of Marketing study found"
dek: >-
  Most measures of engagement stop at the click. Scroll data from more than 35,000 articles and two experiments follow
  readers down the page, showing which kinds of wording hold them and why an anxious tone kept them reading when a sad
  one did not.
short_title: "Which words keep people reading, and why"

description: >-
  Berger et al. find easy, concrete wording made readers up to 24.4% likelier to finish online articles, and anxious
  wording held them while sad wording did not.

keywords: [content engagement, holding attention, reading depth, scroll depth, content marketing writing, readability,
  concrete language, emotional language in content, natural language processing, recommendation algorithms, Journal of Marketing]
topics: [Creative, Personalization]

