short_answer: >-
  Plain wording and the right kind of emotion. Across 649,129 reading sessions on nine news and lifestyle sites, readers
  more often kept scrolling past paragraphs that were easy to read, simply built and full of familiar, concrete
  words. The specific emotion mattered: anxious language held readers, while sad language made stopping more likely.
  Two experiments traced this to how much uncertainty and arousal each emotion creates.

takeaways:
  - "Paragraphs one standard deviation easier to read, through shorter words and sentences, made readers 24.4% more likely to finish the article, the largest effect of any feature measured."
  - "The same step up in anxious wording made finishing 14.0% more likely, while the same step in sad wording made it 10.8% less likely."
  - "Changing a few words in a stock-market story from sad to anxious raised the proportion choosing to read on from 52% to 80%."
  - "In a simulation of 10,000 users who leaned towards anxious content, a feed tuned to hold attention lifted engagement from 50% to 64% in ten rounds, and what it served became more anxiety-inducing."

