short_answer: >-
  A little, and the retargeted ad is what sets it off. In an experiment with 392 US adults, a travel site's cookie banner
  offered either an "I Agree" button alone or "I Agree" plus "Decline". After an ad for that same site, people who had met
  the agree-only banner were reminded of it more, felt their data choices were being pushed and felt less in control.
  Through that chain, their ratings of the site, ad and brand slipped slightly.

takeaways:
  - "Asked in their own words what made a consent notice honest or deceptive, about 40% of people (49 of 122) described signs of manipulation before anyone had used the term dark pattern."
  - "In a test with 200 people, whichever wording they saw, they leaned towards feeling pushed by the banner (4.42 out of 7) and away from feeling in control of their privacy (3.72)."
  - "When the next ad came from the same travel site, an agree-only banner left people rating the ad as a stronger reminder of the notice: 4.58 against 4.03 out of 7 with a Decline button."
  - "Average liking for the brand did not move on its own: 4.08 out of 7 where the banner had no Decline button, 4.09 where it did. The harm showed up only through recall, pressure and a lost sense of control."

