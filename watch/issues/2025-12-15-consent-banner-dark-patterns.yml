title: "Can a pushy cookie banner hurt the retargeted ads that follow? What a Journal of Advertising study found"
dek: >-
  Plenty of consent banners nudge people with chatty button labels or leave out any way to say no. Three studies with 714
  Americans suggest the cost turns up later, when a retargeted ad brings that banner back to mind.
short_title: "Why a pushy cookie banner follows your ads around"

description: >-
  Ju et al. find that once an ad from the same site recalls a cookie banner with no Decline button, people feel less in
  control, in tests with 714 US adults.

keywords: [dark patterns, cookie consent banner, data consent, consent management, online behavioral advertising,
