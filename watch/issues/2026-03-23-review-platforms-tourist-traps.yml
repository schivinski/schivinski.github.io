title: "Do online reviews put tourist traps out of business? What a Marketing Science study found"
short_title: "Reviews close tourist traps and lift the hidden gems"
dek: >-
  When the EU scrapped roaming charges, tourists in Rome could check Tripadvisor on the street for free. Well-rated
  restaurants sold more, poorly rated ones were twice as likely to close, and those that survived hired better staff.
description: >-
  After EU roaming fees ended, low-rated restaurants in Rome were twice as likely to close and high-rated ones sold 5.6%
  more. What reviews do to quality.
