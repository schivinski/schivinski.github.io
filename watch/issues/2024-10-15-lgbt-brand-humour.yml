short_answer: >-
  Yes, for brands whose identity is built around the LGBT+ community. On Facebook, Grindr's posts were shared more the more
  people laughed at them, while Tinder's were not, and an LGBT+-owned coffee company showed the same lift. An experiment with
  796 Americans explained why. A meme felt like a natural match for a brand with an LGBT+ founder, and that sense of fit drove
  sharing. The same meme did nothing for a mainstream version.

takeaways:
  - "At Grindr, every extra 10 points in the share of reactions that were laughs went with about 417 more shares of a post. At Tinder there was no such link."
  - "The coffee company moved the same way on a smaller scale: roughly 8 extra shares per post for each 10 points more laughter."
  - "In the experiment, each extra point of brand-post fit on its 7-point scale went with 0.37 points more willingness to share."
  - "Funny content is rare at these brands. In 2023, humorous posts made up only 1.1% to 3.8% of what three LGBT+ brands put on Facebook."

