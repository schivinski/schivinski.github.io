title: "Should LGBT+ brands use humour on social media? What a Psychology & Marketing study found"
dek: >-
  Brands built by and for the LGBT+ community mostly post about pride and identity, and they almost never crack a joke.
  Years of Facebook posts from Grindr, Tinder and a coffee company, backed by an experiment, suggest a little humour
  would help their posts travel much further.
short_title: "Why a joke travels further for LGBT+ brands"

description: >-
  O'Rourke et al. show funny Facebook posts drew far more shares for Grindr than for Tinder, because humour feels like a
  natural fit for an LGBT+ brand.

keywords: [LGBT+ brands, humour in social media marketing, funny brand posts, eWOM, social media sharing, brand-post fit,
  Pride marketing, rainbow-washing, Facebook reactions, brand personality, Psychology & Marketing]
topics: [Social media, Creative]

