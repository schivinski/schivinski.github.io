title: "Does generative AI make ad people more creative? What a Journal of Advertising Research experiment with 98 agency professionals found"
dek: >-
  Agencies are handing creative teams AI tools and hoping for better work. An experiment inside a large agency shows what changed when
  copywriters, strategists and account people wrote taglines with and without it.
short_title: "Prompt training doubled the ideas, not the quality"

description: >-
  Milano et al. tested 98 advertising professionals: generative AI doubled the number of tagline ideas, but only after prompt training, and quality stayed flat.

keywords: [generative AI, creativity, advertising agencies, prompt engineering, prompt training, ideation, taglines, copywriting,
  human-AI collaboration, creative process, Journal of Advertising Research]
topics: [AI, Creative, Advertising]

