    title: "AI and human designers: How consumers see the genuine care in product design as more sustainable"
    authors: "Duffek & Biswas"
    journal: "Journal of the Academy of Marketing Science"
    year: 2026
    text: >-
      Across a series of studies, products designed by AI were seen as less sustainable than the same products designed by people, even though
      AI can make greener design more efficient. The reason is a sense that no one cared: sustainability is tied to love and care, and removing the
      human from the story removes that signal. Show the people behind the design.
  - doi: "10.1080/00913367.2026.2733982"
    title: "Reconceptualizing Advertising Measurement in the Age of Generative Artificial Intelligence"
    authors: "Srinivasan, Liu-Thompkins, Malthouse, & Masłowska"
    journal: "Journal of Advertising"
    year: 2026
    text: >-
      A framework paper arguing that ad metrics were built for human-made, stable campaigns and miss what happens when AI co-creates the ads and
      mediates the buyer's journey. It sorts which classic measures need rethinking, proposes new ones, and adds outcomes for employees, regulators,
      investors and society.

