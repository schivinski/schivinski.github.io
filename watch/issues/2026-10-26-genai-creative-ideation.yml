  caption: "Plenty of ideas on the wall. Picking the right one is the harder part. Photo: Jakub Żerdzicki on Unsplash."

short_answer: >-
  Not on its own. Agency staff who used an AI chatbot after a short prompt-writing lesson came up with about twice as many tagline ideas
  as colleagues working without it. Those who used the same tool with no lesson simply matched the people without AI. But the tagline each
  person chose as their best was rated just as creative in every group. The AI widened the pool of ideas and did not help pick the winner.

takeaways:
  - "With prompt training, people produced about 20 tagline ideas in 25 minutes, against about 10 with no AI or with untrained AI use."
  - "Access to the tool alone changed nothing. The gain appeared only after a short lesson on how to write prompts."
  - "Expert judges rated the chosen taglines the same across all three groups, and the top ten were spread evenly between them."
  - "Most people used the AI to churn out options. Only 2 of 67 asked it to help choose the best one."

