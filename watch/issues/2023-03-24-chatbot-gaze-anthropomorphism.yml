title: "Should a chatbot's avatar have a realistic face and look customers in the eye? What a Psychology & Marketing study found"
dek: >-
  Many customer service chatbots come with a face. Two experiments with a working chatbot, one for hiring a car and one for
  buying travel insurance, show that where that face looks, and how real it seems, change how far shoppers believe the bot and
  trust the site behind it.
short_title: "A chatbot that looks you in the eye"

description: >-
  Pizzi et al. find a chatbot avatar that looks straight at shoppers seems warmer, and lifted the share who put travel
  insurance in the cart from 42% to 52%.

keywords: [chatbot design, chatbot avatar, chatbot anthropomorphism, gaze direction, eye contact, customer service chatbot,
  willingness to disclose personal information, trust in chatbots, warmth and competence, conversational agents in e-commerce,
  Psychology & Marketing]
topics: [AI, Service, Privacy]

