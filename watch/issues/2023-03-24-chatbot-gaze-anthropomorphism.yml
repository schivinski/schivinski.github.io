short_answer: >-
  Yes to both, though each helps in a different way and the gains are small. Two online experiments put a working chatbot
  on mock car rental and travel insurance sites. An avatar whose eyes met the user's came across as warmer, while a
  realistic face seemed more competent than a cartoon one. Warmth made people believe the chatbot more, which raised trust in
  the website and, through it, willingness to share personal details and come back.

takeaways:
  - "In the travel insurance test, 52% of people whose chatbot looked straight at them put a plan in the cart, against 42% when its eyes looked away."
  - "Eye contact raised the car rental chatbot's warmth score by a third of a point, from 4.36 to 4.69, where 7 was the highest possible score."
  - "A realistic face beat a cartoon version of the same face on competence in the car rental test, 4.77 against 4.50 out of 7."
  - "Across 1,251 participants, matching the avatar's gender to the customer's own did not change how they responded to its face or gaze."

