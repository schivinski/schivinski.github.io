short_answer: >-
  Yes, if the launch gives fans what they came for. In weekly sales for 181 albums released in Canada, artists whose Facebook
  fans were more active than their following would predict sold a little more after release. That small lift turned large
  when the new album sounded close to the previous one and disappeared when it sounded far off. For young acts, an engaged
  fan base could even work against a sharp change of style.

takeaways:
  - "With very active fans and a familiar sound, the model put an artist's sales in the week a pop or rock album came out at about 1.57 times those of an act whose fans were only averagely active."
  - "For acts about a year past their debut, that same pairing went with weekly sales roughly 1.8 times those of an average act."
  - "Acts around 15 years into their careers showed neither the bonus nor the penalty, however lively their fans and however far the album strayed."
  - "About 60% of the units counted came from streams rather than purchases, so the results describe audiences already listening mostly through streaming services."

