title: "Does social media engagement help a new product launch? What a Journal of Interactive Marketing study found"
dek: >-
  Brands court likes, comments and shares before a launch. Two years of album sales in Canada show that a lively
  fan base pays off when the new release sounds like the last one, and can turn against a young act that changes course.
short_title: "Engaged fans want the familiar"

description: >-
  Perron-Brault et al. find a lively Facebook fan base lifts an artist's release-week sales about 1.57 times, but only when
  the new album sounds like the last.

keywords: [social media engagement, new product launch, customer engagement, product fit, brand extension, fan engagement,
  music marketing, artist branding, Facebook engagement, streaming, brand longevity, Journal of Interactive Marketing]
