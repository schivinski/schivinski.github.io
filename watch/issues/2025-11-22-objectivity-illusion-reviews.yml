title: "Do reviewers who think they are objective write more persuasive reviews? What a Marketing Letters study found"
dek: >-
  Some people treat their opinions as plain fact and put any disagreement down to bias. Two online studies show what that
  outlook does to customer reviews: the writer's confidence and the reader's response pull in opposite directions.
short_title: "Why the surest reviewers persuade the least"

description: >-
  Steinmetz and Pronin find reviewers who see their views as objective think their reviews persuade more, while readers
  find them less likable and convincing.

keywords: [online reviews, review persuasiveness, objectivity illusion, customer review requests, review solicitation emails,
  reviewer likability, word of mouth, eWOM, user-generated content, review strategy, Marketing Letters]
