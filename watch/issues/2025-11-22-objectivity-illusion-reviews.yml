short_answer: >-
  Not in readers' eyes, though the writers think so. In one online study, 162 people each wrote a short recommendation for
  an Instagram account, and 200 others read ten of them apiece. Writers who saw their own views as plainly objective rated
  their recommendations as more persuasive, but readers found those writers less likable, and their recommendations less
  convincing as a result. A second study linked this self-belief to a greater willingness to let others read the review.

takeaways:
  - "In the M&M study, a writer's objectivism score accounted for about 18% of the gap between writers in how persuasive they thought their own reviews were."
  - "Writers in the bottom 25% for objectivism wrote warm, fan-like praise, while those in the top 25% wrote like detached and often ironic critics, according to an exploratory comparison made with a language model."
  - "Sharing was the norm: 170 of 191 writers let other participants see their review, and those who believed it would persuade were more likely to agree."
  - "The pattern held for complaints: among 196 people reviewing a recent purchase they disliked, the more objectivist writers again rated their negative reviews as more persuasive."

