short_answer: >-
  Small talk helps; copying the customer is optional. People who took holiday or tax advice from an animated virtual
  agent felt more rapport when its replies were warm and personal rather than strictly businesslike. An agent that
  matched each customer's style, turn by turn, did as well on rapport as one that was friendly throughout, and made the
  holiday chat more engaging. Any effect of style on satisfaction and return intentions came through that sense of
  connection.

takeaways:
  - "Across 264 participants and two services, an agent that used social lines, all the time or when mirroring, built more rapport than a strictly businesslike one."
  - "Over 10 agent replies, mirroring always used fewer friendly lines than the agent that was social throughout, yet rapport came out no different in either service."
  - "Mirroring raised engagement in 1 of the 2 services, the holiday chat, and left the tax chat unchanged on this measure."
  - "The agent's style accounted for only about 6% of the variation in rapport and in engagement after the holiday chat, and under 4% after the tax chat."

