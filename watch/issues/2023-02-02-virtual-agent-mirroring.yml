title: "Should a virtual service agent make small talk, or copy the way each customer writes? What a Psychology & Marketing study found"
dek: >-
  Many chatbots and avatars are scripted to sound warm in every line. Two Dutch experiments with an animated adviser
  called Charlotte set friendly, businesslike and mirrored replies against each other, once for holiday advice and once
  for a tax return.
short_title: "Small talk or mirroring for a virtual agent"

description: >-
  van Pinxteren et al. show an animated agent's social replies raised rapport in holiday and tax advice chats, and
  mirroring raised engagement for holidays.

keywords: [conversational agents, embodied conversational agent, chatbot communication style, chatbot small talk,
  social-oriented communication, task-oriented communication, linguistic mimicry, rapport with virtual agents,
  customer engagement with chatbots, hedonic and utilitarian services, virtual assistant design, Psychology & Marketing]
topics: [AI, Service]

