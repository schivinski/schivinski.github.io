# Marketing in 3 by email (Amazon SES, Sydney). How it works and how to set it up: newsletter/README.md
#
# Everything stays hidden and nothing is sent while `endpoint` is empty. Once AWS is set up:
#   * endpoint     -> the signup forms appear on the Subscribe page and in every issue (next to the coffee prompt);
#   * send: true   -> each new issue is emailed once its page is live. Every build publishes this week's email at
#                     /watch/email/latest.json, and the sender in AWS checks it every hour.
# Sender address, test address and sending speed are set in AWS (newsletter/aws/stack.yml).

endpoint: "https://qewbdm3gpjxh42mawu5n6ac37m0hlcgm.lambda-url.ap-southeast-2.on.aws/"   # signup function URL (deploy.sh prints it), e.g. https://xxxx.lambda-url.ap-southeast-2.on.aws/
send: true                   # false = nothing goes to the list (test emails still work)

# An issue is emailed only if its "week of" date is the current week (Melbourne time), so issues filled in for
# earlier weeks never go out by email. Each issue is sent once (recorded in AWS).
window_days_before: 2
window_days_after: 6

# Wording shown with the forms.
form:
  title: "Get it by email"
  text: "New issues every Monday and Thursday, in your inbox. Free, no ads, unsubscribe anytime."
  button: "Subscribe"
  privacy: "Your address is used only to send Marketing in 3. You will get one email to confirm."
