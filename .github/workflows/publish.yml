name: Build and publish site

# REVIEW MODE: pushes only *build* the site (to check nothing is broken).
# Nothing is published unless Bruno runs this workflow by hand from the
# Actions tab with "Publish to schivinski.github.io" ticked.
# The weekly schedule is switched off until the site is approved.
on:
  push:
    branches: [main]
  # schedule:
  #   - cron: "17 2 * * 1"   # Mondays 02:17 UTC: refresh publications from ORCID
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to schivinski.github.io"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install pyyaml

      - name: Pull publications from ORCID
        run: python scripts/fetch_publications.py

      - name: Build paper pages and llms.txt
        run: python scripts/build_paper_pages.py

      - name: Save refreshed publication cache
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          git diff --cached --quiet || { git commit -m "Update publications from ORCID" && git push; }

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
