name: Build and publish site

# Pushes only *build* the site, to check nothing is broken.
# The site is published (a) by a manual run with "Publish" ticked, after Bruno approves
# a change, and (b) every Monday, to refresh the publication list from ORCID.
# Public builds include only paper pages marked "locked"; drafts never go live.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"   # Mondays 02:17 UTC: refresh publications from ORCID and republish
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to schivinski.github.io"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install pyyaml

      - name: Track citations and the h-index (chooses the highlighted papers)
        continue-on-error: true
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/citation_metrics.py

      - name: Pull publications from ORCID
        run: python scripts/fetch_publications.py

      - name: Build paper pages and llms.txt
        run: python scripts/build_paper_pages.py

      - name: Build Marketing Watch issues
        run: python scripts/build_watch.py

      - name: Build teaching page
        run: python scripts/build_teaching.py

      - name: Build mentoring page
        run: python scripts/build_mentoring.py

      - name: Save refreshed publication cache
        if: env.PUBLISH == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "Update publications from ORCID" && git push; }

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Remove draft downloads from public builds
        run: python scripts/strip_drafts.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact
      - name: Notify Bing via IndexNow
        continue-on-error: true
        run: |
          mkdir -p _site && tar -xf artifact/artifact.tar -C _site
          sleep 60
          python scripts/indexnow.py
