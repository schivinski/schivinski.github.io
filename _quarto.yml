project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "watch/**/*.qmd"
    - "papers/*.qmd"
    - "!README.md"
  post-render:
    - scripts/style_feed.py
    - scripts/add_icons.py
    - scripts/add_analytics.py
    - scripts/fix_watch_dates.py
    - scripts/link_topics.py
    - scripts/add_support.py
  resources:
    - robots.txt
    - favicon.ico
    - "assets/*.png"
    - "assets/fonts/*"
    - "assets/share/**"
    - "assets/support/*"
    - "316433b063da86628eea6ac290ebe7f0.txt"
    - llms.txt
    - "papers/manuscripts/*.pdf"
    - "papers/materials/**"
    - "watch/images/**"
    - "watch/feed.xsl"

website:
  title: "Bruno Schivinski"
  description: "Consumer behaviour, marketing psychology and digital media research."
  site-url: "https://schivinski.com"
  favicon: assets/favicon.svg
  # default link-preview image (scripts/make_share_cards.py); pages with their own image override it
  image: assets/share/site.png
  open-graph: true
  twitter-card: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: publications.qmd
        text: Publications
      - href: teaching.qmd
        text: Teaching
      - href: consultancy.qmd
        text: Consultancy
      - href: mentoring.qmd
        text: Mentoring
      - href: watch/index.qmd
        text: Marketing in 3
    right:
      - text: "Google Scholar"
        href: https://scholar.google.pl/citations?user=f-iKGD8AAAAJ
      - text: "ORCID"
        href: https://orcid.org/0000-0002-4095-1922
  page-footer:
    left: "Bruno Schivinski, Department of Marketing, Gdańsk University of Technology"
    right:
      - text: "Subscribe to Marketing in 3"
        href: watch/subscribe.qmd

format:
  html:
    include-in-header:
      text: |
        <meta name="google-site-verification" content="07UIUFLSbcPDJm263G7oL8BCvnbHfhs0M4NEzCxbc0E" />
        <link rel="preload" href="/assets/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
        <link rel="preload" href="/assets/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
    theme:
      light: [flatly, styles.scss]
    title-block-banner: true
    toc: false
    smooth-scroll: true
    # No page uses equations. Without this, a dollar sign in a listing description makes Quarto load
    # MathJax and a render-blocking polyfill from two outside servers on the home and Marketing in 3 pages.
    html-math-method: plain
