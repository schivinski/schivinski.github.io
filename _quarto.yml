project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "watch/**/*.qmd"
    - "papers/*.qmd"
    - "!README.md"

website:
  title: "Bruno Schivinski"
  description: "Consumer behaviour, marketing psychology and digital media research."
  site-url: "https://schivinski.github.io"
  favicon: assets/favicon.svg
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: publications.qmd
        text: Publications
      - href: teaching.qmd
        text: Teaching
      - href: watch/index.qmd
        text: Marketing Watch
    right:
      - text: "Google Scholar"
        href: https://scholar.google.pl/citations?user=f-iKGD8AAAAJ
      - text: "ORCID"
        href: https://orcid.org/0000-0002-4095-1922
  page-footer:
    left: "Bruno Schivinski, Department of Marketing, Gdańsk University of Technology"
    right:
      - text: "RSS"
        href: watch/index.xml

format:
  html:
    theme:
      light: [flatly, styles.scss]
    title-block-banner: true
    toc: false
    smooth-scroll: true
