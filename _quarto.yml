project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "watch/**/*.qmd"
    - "papers/*.qmd"
    - "!README.md"
  resources:
    - robots.txt
    - "316433b063da86628eea6ac290ebe7f0.txt"
    - llms.txt
    - "papers/manuscripts/*.pdf"
    - "papers/materials/**"
    - "watch/images/**"

website:
  title: "Bruno Schivinski"
  description: "Consumer behaviour, marketing psychology and digital media research."
  site-url: "https://schivinski.github.io"
  favicon: assets/favicon.svg
  open-graph: true
  twitter-card: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: publications.qmd
        text: Publications
      - href: teaching.qmd
        text: Teaching
      - href: consultancy.qmd
        text: Consultancy
      - href: watch/index.qmd
        text: Marketing Watch
    right:
      - text: "Google Scholar"
        href: https://scholar.google.pl/citations?user=f-iKGD8AAAAJ
      - text: "ORCID"
        href: https://orcid.org/0000-0002-4095-1922
  page-footer:
    left: "Bruno Schivinski, Department of Marketing, Gdańsk University of Technology"
    right:
      - text: "RSS"
        href: watch/index.xml

format:
  html:
    include-in-header:
      text: |
        <meta name="google-site-verification" content="07UIUFLSbcPDJm263G7oL8BCvnbHfhs0M4NEzCxbc0E" />
    theme:
      light: [flatly, styles.scss]
    title-block-banner: true
    toc: false
    smooth-scroll: true
