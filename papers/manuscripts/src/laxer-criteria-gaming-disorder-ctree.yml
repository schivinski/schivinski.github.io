table_overrides:
  '1':
    title: The operationalization of video game addiction according to the nine Internet Gaming Disorder (IGD) as measured with the Internet Gaming Disorder Scale–Short-Form (IGDS9-SF), their corresponding clinical criteria and comparison against the criteria for gaming disorder within the 11th International Classification of Diseases (ICD-11)
    columns: [Item, IGDS9-SF Item Wording, Clinical Criteria, 'Included in the ICD-11?']
    widths: [auto, 1fr, auto, auto]
    size: 9pt
  '2':
    title: Summary of the Conditional Inference Tree-derived rules alongside each Internet Gaming Disorder (IGD) criteria endorsement pathway according to each subtype of gamer within the sample (N = 3377)
    columns: [Rule, IGD Criteria Endorsement Pathways, '', '', Gamer Subtype]
    widths: [auto, 1fr, 1fr, 1fr, auto]
    landscape: true
    size: 9pt
    note: 'Note: Answers given by participants to each IGD criterion as measured with the Internet Gaming Disorder Scale–Short-Form (IGDS9-SF) included 1 = ‘Never’, 2 = ‘Rarely’, 3 = ‘Sometimes’, 4 = ‘Often’, and 5 = ‘Very Often’. Endorsement of an IGD criterion was operationalized with answers equal to 5 = ‘Very Often’.'
