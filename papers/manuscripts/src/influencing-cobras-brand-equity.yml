  A2:
    title: Reliability and validity of the conceptual model of CBBE effects on COBRAs.
    note: α = Cronbach’s alpha; CR = composite reliability; AVE = average variance extracted; FD = factor determinacy; MSV = maximum shared squared variance. Robust maximum-likelihood estimation method
      (MLR) χ^{2}(544) = 1113.41, comparative fit index (CFI) = 0.93, Tucker–Lewis index (TLI) = 0.92, root mean square error of approximation (RMSEA) = 0.05 (90% CI [0.04–0.05]); n = 414. t-value for correlations
      are in parenthesis. The square root of the AVE values are in italics.
    landscape: true
    size: 7.5pt
