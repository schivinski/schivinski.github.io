table_overrides:
  '1':
    title: Recent literature (published since 2020) examining the role of PCE in a variety of consumption contexts
    widths: [auto, 1fr, 1fr, auto, auto, 2fr]
    landscape: true
    size: 7.5pt
    note: 'Abbreviation: PCE, perceived consumer effectiveness.'
  '2':
    title: Standardised structural coefficients of the conceptual model
    columns: [Path, β, '*t*-value', '*p*-value']
    widths: [1fr, auto, auto, auto]
    size: 8.5pt
    note: '*Note*: MLR *χ*^{2}_{(383)} = 3177.22, CFI = 0.91, TLI = 0.90, RMSEA = 0.06 [90% C.I. 0.06–0.08]; *n* = 432.'
  A1:
    title: Descriptive statistics, factor loadings (completely standardised lambda X), explained variance on each item (R²)
    columns: [Measurements, '(λ_{x})', '*R*^{2}', Mean (SD)]
    widths: [1fr, auto, auto, auto]
    size: 8pt
    note: 'Values, identities: item anchored from 1 = strongly disagree to 5 = strongly agree (as printed). Perceived consumer effectiveness: item anchored from 1 = strongly disagree to 7 = strongly agree. The source of each scale is given in brackets after the construct name.'
  B1:
    title: Correlation matrix of the effects of the multifactorial CFA models
    columns: [Construct, α, CR, AVE, '1', '2', '3', '4', '5', '6', '7']
    widths: [1fr, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto]
    size: 8pt
    note: '*Note*: The square root of the average variance extracted values appears in italics. α = Cronbach''s alpha, CR = composite reliability (Jöreskog''s Rhô), AVE = average variance extracted (Rhô vc); MLR *χ*^{2}_{(278)} = 749.17, CFI = 0.94, TLI = 0.93, RMSEA = 0.06 [90% C.I. 0.06–0.07]; *n* = 432.'
