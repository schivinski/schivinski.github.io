scale:
  name: "Polish Internet Gaming Disorder Scale–Short-Form (IGDS9-SF)"
  short: "IGDS9-SF (Polish)"
  file_stem: "igds9sf-pl"
  summary: >-
    The Polish version of the IGDS9-SF (Pontes &amp; Griffiths, 2015): nine items, one for each DSM-5 criterion of
    Internet Gaming Disorder, answered for gaming over the past 12 months. Translated, back-translated and piloted in
    this study and validated with 3,222 Polish gamers. Free to use in research; please cite this article and the
    original IGDS9-SF.
  facts:
    - { label: "Items", value: "9 (one dimension), one per DSM-5 criterion; in Polish" }
    - { label: "Response format", value: "1 = Nigdy (never), 2 = Rzadko (rarely), 3 = Czasami (sometimes), 4 = Często (often), 5 = Bardzo często (very often)" }
    - { label: "Scoring", value: "Sum of the nine items (range 9–45); higher scores mean more severe disordered gaming" }
    - { label: "Reliability", value: "Cronbach’s α = 0.82; composite reliability = 0.87; factor determinacy = 0.91" }
    - { label: "Validated with", value: "3,222 Polish gamers recruited through gaming forums (82.7% male, mean age 20)" }
  response_labels: ["Nigdy", "Rzadko", "Czasami", "Często", "Bardzo często"]
  response_codes: [1, 2, 3, 4, 5]
  score: sum
  introduction:
    label: "Instrukcje"
    source: article
    text: >-
      Poniższe pytania dotyczą Twojej aktywności jako gracza podczas ostatniego roku (tzn. w ciągu ostatnich 12
      miesięcy). Aktywność gracza oznacza każdą aktywność związaną z grą odtwarzaną z komputera / laptopa, konsoli do
      gier lub innego urządzenia (np. telefonu komórkowego, tabletu itp.), zarówno online, jak i offline.
  pre_questions:
    - id: SCREEN
      title: "Kwalifikacja"
      type: yesno
      source: suggested
      text: "Czy w ciągu ostatnich 12 miesięcy grałeś/aś w gry wideo?"
      note: "Suggested Polish wording of the eligibility question described in the article (“played videogames in the past 12 months”). Code Nie (no) = 0 and Tak (yes) = 1; respondents who answer Nie do not continue."
      note_audience: researcher
      options: [{ code: 0, label: "Nie" }, { code: 1, label: "Tak" }]
      keep: 1
  block_instruction: "Zaznacz jedną odpowiedź przy każdym pytaniu."
  block_instruction_source: suggested
  dimensions:
    - code: "IGD"
      name: "Internet Gaming Disorder"
      r_name: "igd"
      definition: "Items 1 to 9 follow the nine DSM-5 criteria: preoccupation, withdrawal, tolerance, loss of control, giving up other activities, continuation, deception, escape and negative consequences."
      items:
        - { id: "IGD1", text: "Czy czujesz się zatroskany/a swoim zachowaniem związanym z grami? (Kilka przykładów: Czy rozmyślasz o swojej wcześniejszej aktywności związanej z grami? Czy uważasz, że granie stało się dominującą aktywnością w Twoim życiu codziennym?)", label_in_article: "Item 1, preoccupation: Do you feel preoccupied with your gaming behavior?", loading: "0.73" }
        - { id: "IGD2", text: "Czy czujesz większą drażliwość, niepokój, a nawet smutek podczas prób ograniczenia lub przerwania gry?", label_in_article: "Item 2, withdrawal: Do you feel more irritability, anxiety or even sadness when you try to either reduce or stop your gaming activity?", loading: "0.64" }
        - { id: "IGD3", text: "Czy czujesz potrzebę spędzania coraz większej ilości czasu grając, w celu osiągnięcia satysfakcji lub przyjemności?", label_in_article: "Item 3, tolerance: Do you feel the need to spend increasing amount of time engaged gaming in order to achieve satisfaction or pleasure?", loading: "0.72" }
        - { id: "IGD4", text: "Czy podejmowane próby ograniczenia lub zaprzestania aktywności związanej z grami kończą się niepowodzeniem?", label_in_article: "Item 4, loss of control: Do you systematically fail when trying to control or cease your gaming activity?", loading: "0.63" }
        - { id: "IGD5", text: "Czy straciłeś/aś zainteresowanie poprzednim hobby lub innego typu rozrywką na skutek Twojego zaangażowania w gry?", label_in_article: "Item 5, give up other activities: Have you lost interests in previous hobbies and other entertainment activities as a result of your engagement with the game?", loading: "0.62" }
        - { id: "IGD6", text: "Czy kontynuujesz granie pomimo wiedzy, że jest ono przyczyną Twoich problemów/nieporozumień z innymi ludźmi?", label_in_article: "Item 6, continuation: Have you continued your gaming activity despite knowing it was causing problems between you and other people?", loading: "0.78" }
        - { id: "IGD7", text: "Czy kiedykolwiek oszukałeś/aś, okłamałeś/aś kogokolwiek (rodzina, znajomi, terapeuci, nauczyciele itp.) z powodu Twojej aktywności związanej z graniem?", label_in_article: "Item 7, deception: Have you deceived any of your family members, therapists or others because the amount of your gaming activity?", loading: "0.60" }
        - { id: "IGD8", text: "Czy grasz po to by choć na krótki czas uciec od złego humoru lub by złagodzić negatywny nastrój bezradności, poczucia winy, niepokoju itp.?", label_in_article: "Item 8, escape: Do you play in order to temporarily escape or relieve a negative mood (e.g., helplessness, guilt, anxiety)?", loading: "0.47" }
        - { id: "IGD9", text: "Czy przez swoją aktywność związaną z grami naraziłeś/aś się na istotne kłopoty w związku, w szkole/uczelni, w pracy?", label_in_article: "Item 9, negative consequences: Have you jeopardized or lost an important relationship, job or an educational or career opportunity because of your gaming activity?", loading: "0.63" }
  administration:
    - "Ask the screening question first; the article included only people who had played video games in the past 12 months."
    - "Keep the 12-month time frame and the instructions, which cover online and offline gaming on any device."
    - "The items, instructions and response labels are in Polish, as published in Appendix 1 of the article. For the English original, use Pontes and Griffiths (2015)."
    - "The IGDS9-SF measures the severity of disordered gaming; it does not diagnose Internet Gaming Disorder. A diagnosis needs a clinical assessment."
  scoring:
    - "Code responses 1 (Nigdy) to 5 (Bardzo często)."
    - "Total score = sum of IGD1 to IGD9 (range 9–45); higher scores mean more severe disordered gaming."
    - "To classify gamers, count a criterion as endorsed only when answered 5 (Bardzo często, very often), as recommended by Pontes and Griffiths (2015); endorsing five or more of the nine criteria follows the DSM-5 threshold for disordered gaming."
    - "In the article, item means ranged from 1.71 (item 5) to 2.88 (item 8), and the graded response model gave better fit than the generalized partial credit model."
    - "For latent-variable models, specify one factor with the nine items (robust maximum likelihood, MLR, as in the article)."
  intro_note: >-
    The instructions, items and response labels are the Polish version published in Appendix 1 of the article; only the
    spelling of “terapeuci” in item 7 is corrected (printed “erapeuci”). The screening question and the short
    instruction above the items are suggested wording.
  copy_footer: >-
    Scoring: sum the nine items (9–45). A criterion is endorsed when answered 5 (Bardzo często); endorsing five or more
    criteria follows the DSM-5 threshold for disordered gaming, for research purposes.
  admin_box: >-
    Ask the screening question first and keep the 12-month time frame. Code answers 1 to 5; the total score is the sum
    of the nine items (9 to 45). A criterion is endorsed when answered 5 (Bardzo często); five or more endorsed criteria
    follow the DSM-5 threshold, for research purposes. The scale measures severity and does not replace a clinical
    diagnosis. Instructions, items and response labels are the Polish version published in the article.
  analysis:
    title: "Polish IGDS9-SF: one-factor CFA, MIMIC model and graded response model"
    r_options: 'estimator = "MLR"'
    estimator_note: "robust maximum likelihood (MLR), as in the article"
    r_extra: |

      # 4. Criteria endorsed and research classification (Pontes & Griffiths, 2015)
      endorsed <- dat[items$igd] == 5                  # answered "Bardzo czesto" (very often)
      dat$igd_criteria <- rowSums(endorsed)            # number of criteria endorsed, 0-9
      dat$igd_disordered <- dat$igd_criteria >= 5      # DSM-5 threshold: five or more criteria
      table(dat$igd_disordered)

      # 5. MIMIC model (Figure 2): weekday, weekend and per-session gaming time predicting IGD.
      #    Needs columns hours_weekdays, hours_weekend and hours_session.
      if (all(c("hours_weekdays", "hours_weekend", "hours_session") %in% names(dat))) {
        model_mimic <- paste(model_cfa, "
          igd ~ hours_weekdays + hours_weekend + hours_session
        ")
        fit_mimic <- sem(model_mimic, data = dat, estimator = "MLR")
        summary(fit_mimic, fit.measures = TRUE, standardized = TRUE, rsquare = TRUE)
      }

      # 6. Item response theory (Table 2, Figures 3 and 4): graded response model with mirt,
      #    compared with a generalized partial credit model by AIC (lower is better)
      library(mirt)
      resp <- dat[items$igd]
      grm  <- mirt(resp, 1, itemtype = "graded", verbose = FALSE)
      gpcm <- mirt(resp, 1, itemtype = "gpcm", verbose = FALSE)
      c(AIC_graded = extract.mirt(grm, "AIC"), AIC_gpcm = extract.mirt(gpcm, "AIC"))
      coef(grm, IRTpars = TRUE, simplify = TRUE)$items   # a = discrimination, b1-b4 = thresholds
      itemfit(grm)                                       # S-X2 item fit
      q3 <- residuals(grm, type = "Q3")                  # local dependence: flag values above 0.20
      plot(grm, type = "trace")                          # trace curves (Figure 3)
      plot(grm, type = "info")                           # test information curve (Figure 4)
    mplus_estimator: "MLR"
    mplus_extra: |

      ! MIMIC model (Figure 2): add hours_weekdays, hours_weekend and
      ! hours_session to NAMES and USEVARIABLES, then remove the "!" below
      ! IGD ON hours_weekdays hours_weekend hours_session;
    mplus_notes: |

      ! Total score = sum of igd1-igd9 (9-45). A criterion is endorsed when
      ! answered 5 (very often); five or more criteria = DSM-5 threshold.
      ! The graded response model was estimated in R (mirt); see the R script.
  downloads:
    - { label: "Questionnaire in Polish (PDF, print-ready)", file: "materials/igds9sf-pl/igds9sf-pl-questionnaire.pdf" }
    - { label: "Qualtrics import file (.txt)", file: "materials/igds9sf-pl/igds9sf-pl-qualtrics-import.txt" }
