in_brief: >-
  The Polish version of the nine-item Internet Gaming Disorder Scale–Short-Form is valid and reliable, and works
  best for detecting above-average levels of disordered gaming. In 3,222 Polish gamers, item response theory showed
  that the nine DSM-5 criteria do not carry equal weight: &ldquo;escape&rdquo;, &ldquo;deception&rdquo; and
  &ldquo;continuation&rdquo; fitted worst.

findings:
  - headline: "The Polish IGDS9-SF measures one dimension reliably."
    text: >-
      In 3,222 Polish gamers, a one-factor model fitted well (CFI = 0.968, RMSEA = 0.043), with Cronbach&rsquo;s
      &alpha; = 0.82, composite reliability = 0.87 and factor determinacy = 0.91 (Schivinski et al., 2018).
  - headline: "The scale is most informative above the average level of disordered gaming."
    text: >-
      The test information curve peaked between 0 and 2 standard deviations above the mean, so the IGDS9-SF is best
      suited to identifying gamers with higher levels of Internet Gaming Disorder (Schivinski et al., 2018).
  - headline: "&ldquo;Escape&rdquo; is the weakest criterion."
    text: >-
      &ldquo;Escape&rdquo; had the lowest loading (0.47) and discrimination (&alpha; = 0.88) and the poorest item fit
      (S-&chi;&sup2; = 177.50, <i>p</i> &lt; .001); &ldquo;continuation&rdquo; and &ldquo;deception&rdquo; also fitted
      poorly (Schivinski et al., 2018).
  - headline: "Preoccupation and withdrawal discriminate best."
    text: >-
      &ldquo;Preoccupation&rdquo; (&alpha; = 1.72) and &ldquo;withdrawal&rdquo; (&alpha; = 1.71) were the most
      discriminating criteria, which suggests the nine DSM-5 criteria carry different diagnostic weight (Schivinski et
      al., 2018).
  - headline: "More time gaming at weekends goes with more disordered gaming."
    text: >-
      Time spent gaming at weekends (&beta; = 0.36), on weekdays (&beta; = 0.08) and per session (&beta; = 0.09)
      predicted IGD scores, supporting criterion validity (Schivinski et al., 2018).

glance:
