question: >-
  The American Psychiatric Association proposed nine criteria for Internet Gaming Disorder in the DSM-5 and asked for
  more research on their clinical and empirical value. No study had applied polytomous item response theory to the
  nine criteria. We developed the Polish version of the IGDS9-SF, tested its validity and reliability, and examined how
  well each criterion distinguishes between gamers at different levels of disordered gaming.

implications:
  practical: >-
    Researchers and clinicians can use the Polish IGDS9-SF to assess disordered gaming in Polish-speaking samples. The
    scale is most precise for gamers above the average level of symptoms, which suits screening for problematic cases,
    but scores should not be read as a diagnosis.
  theoretical: >-
    The nine DSM-5 criteria do not carry equal diagnostic weight: &ldquo;escape&rdquo; may work better as a motive for
    gaming than as a symptom, &ldquo;deception&rdquo; depends on others being present, and &ldquo;continuation&rdquo;
    may mark milder levels. These results can inform revisions of the IGD criteria.

limitations:
  - "Non-probability online sample with a high share of male gamers."
  - "No information on the games or genres played."
  - "Screening tools for low-prevalence disorders have low positive predictive values, which can inflate prevalence estimates."

faq:
  - q: "Is there a Polish version of the IGDS9-SF?"
    a: >-
      Yes. The Polish IGDS9-SF was translated, back-translated and piloted, and validated with 3,222 Polish gamers
      (&alpha; = 0.82, composite reliability = 0.87) (Schivinski et al., 2018). The items are available on this page.
  - q: "Are all nine DSM-5 criteria for Internet Gaming Disorder equally important?"
    a: >-
      No. In an item response theory analysis, preoccupation and withdrawal discriminated best, while escape,
      deception and continuation fitted worst, suggesting different diagnostic weights (Schivinski et al., 2018).
  - q: "How is the IGDS9-SF scored?"
    a: >-
      Sum the nine items, each answered from 1 (never) to 5 (very often), for a total of 9 to 45. For classification,
      a criterion counts as endorsed when answered &ldquo;very often&rdquo; (Pontes &amp; Griffiths, 2015).
  - q: "Is escape a symptom of gaming disorder?"
    a: >-
      Its role is unclear: &ldquo;escape&rdquo; was the weakest IGDS9-SF item in this study and is also one of the
      main motives for playing, so it may be better treated as a motive than a diagnostic criterion (Schivinski et
      al., 2018).

concepts:
  - term: "Internet Gaming Disorder (IGD)"
    definition: "Persistent and recurrent gaming that leads to significant impairment or distress, proposed in the DSM-5 as a condition for further study, indicated by five or more of nine criteria over 12 months."
  - term: "IGDS9-SF"
    definition: "The nine-item Internet Gaming Disorder Scale–Short-Form (Pontes &amp; Griffiths, 2015), one item per DSM-5 criterion."
  - term: "Graded response model"
    definition: "An item response theory model for ordered answer categories that estimates each item&rsquo;s discrimination (&alpha;) and the thresholds (&beta;) between categories (Samejima)."
  - term: "Test information curve"
    definition: "A curve showing how precisely a test measures the latent trait at each level; higher information means smaller measurement error."

