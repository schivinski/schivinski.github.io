in_brief: >-
  Natural wines cost about 20% more and get longer reviews than conventional wines, but consumers rate them lower and
  write about them with less positive and more disgusted, angry language. In 6.4 million English-language Vivino
  reviews, naturalness worked as a quality signal that raised expectations the wine often did not meet.

findings:
  - headline: "Natural wines carry a price premium of about 20%."
    text: >-
      Controlling for rating, vintage, alcohol, sensory characteristics and country of origin, wines that Vivino
      classifies as natural were priced about 20% higher than conventional wines (<i>b</i> = 0.18) (Folwarczny et al.,
      2026).
  - headline: "Yet consumers rate natural wines slightly lower."
    text: >-
      Natural wines received lower ratings (<i>M</i> = 4.09 vs 4.12 on a 5-point scale), and the gap held with
      controls (<i>b</i> = &minus;0.02, <i>p</i> &lt; .001), contrary to the natural-is-better hypothesis (Folwarczny et
      al., 2026).
  - headline: "Natural wines get longer but less positive reviews."
    text: >-
      Reviews of natural wines were about 20% longer (23.0 vs 19.2 words; incidence rate ratio = 1.20) but had lower
      per-word sentiment (2.05 vs 2.21 on the AFINN scale) (Folwarczny et al., 2026).
  - headline: "Disgust and anger rise most."
    text: >-
      Natural wine reviews contained 40% more disgust words, 32% more anger words and 30% more fear words than
      conventional wine reviews, with only small increases in joy (+2.5%) and surprise (+1.8%) (Folwarczny et al.,
      2026).

