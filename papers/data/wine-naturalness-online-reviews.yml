question: >-
  Consumers tend to see natural products as better, and natural wine is sold on what has not been done to the grapes.
  Because naturalness is a credence attribute that consumers cannot verify, it can shape both what they pay and how they
  judge the wine after drinking it. We asked whether naturalness changes consumers&rsquo; ratings, the prices of wines,
  and the length, sentiment and emotions of their online reviews.

implications:
  practical: >-
    Natural wine brands should position naturalness as a credence attribute, emphasising process history, rarity and
    authenticity rather than competing on quality-for-price, and manage expectations about variable sensory profiles,
    for example by presenting cloudiness or volatile acidity as signatures of minimal intervention. The long, emotional
    reviews also offer material for online brand communities.
  theoretical: >-
    The findings challenge the natural-is-better bias in a real market: naturalness raises valuation before purchase as
    a quality signal but lowers evaluation after consumption through expectation disconfirmation, so the price premium
    and the rating penalty are two stages of the same process.

limitations:
  - "Vivino users are more involved than the average wine buyer."
  - "Natural status relies on Vivino&rsquo;s own undisclosed classification and treats a heterogeneous category as one group."
  - "Reviews are clustered within wines, so observations are not independent."

faq:
  - q: "Do people rate natural wine higher than conventional wine?"
    a: >-
      No. In 6.4 million English-language Vivino reviews, natural wines received slightly lower ratings than
      conventional wines, even after controlling for price and wine characteristics (Folwarczny et al., 2026).
  - q: "How much more does natural wine cost?"
    a: >-
      About 20% more than comparable conventional wines on Vivino, after controlling for rating, vintage, alcohol,
      sensory characteristics and country of origin (Folwarczny et al., 2026).
  - q: "What emotions do natural wine reviews express?"
    a: >-
      More negative emotions than conventional wine reviews, especially disgust (+40%), anger (+32%) and fear (+30%),
      with slightly more joy (+2.5%) and surprise (+1.8%) (Folwarczny et al., 2026).
  - q: "Why would consumers pay more for a wine they rate lower?"
    a: >-
      Naturalness works as a signal of authenticity and process integrity before purchase, but it also raises
      expectations that the wine&rsquo;s unconventional sensory profile may not meet after drinking (Folwarczny et al.,
      2026).

concepts:
  - term: "Natural wine"
    definition: "Wine made with minimal intervention, typically from organic or biodynamic grapes with indigenous yeasts and without additives such as sulfur dioxide; the term has no legal definition."
  - term: "Naturalness bias"
    definition: "The tendency to see things of natural origin or made with little human intervention as better than conventional alternatives."
  - term: "Credence attribute"
    definition: "A product quality, such as how a wine was made, that consumers cannot verify even after consumption."
  - term: "Expectation disconfirmation"
    definition: "Dissatisfaction that arises when a product performs below the expectations formed before purchase."

