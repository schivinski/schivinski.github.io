in_brief: >-
  Social media content about a brand makes people more willing to go to the events that brand sponsors, mainly through
  how they feel about the event. In a survey of 307 British social media users, firm-created and user-generated content
  improved brand attitude, user-generated content also improved event attitude, and event attitude drove intentions to
  participate.

findings:
  - headline: "Both types of social media content improve brand attitude."
    text: >-
      Positive evaluations of firm-created (&beta; = 0.32) and user-generated (&beta; = 0.30) social media brand-related
      content predicted a more positive brand attitude (Schivinski, Langaro &amp; Shaw, 2019).
  - headline: "Only user-generated content directly improves event attitude."
    text: >-
      User-generated content predicted attitude towards brand-sponsored events (&beta; = 0.24), while firm-created
      content did not (&beta; = 0.12, <i>p</i> = .12) (Schivinski, Langaro &amp; Shaw, 2019).
  - headline: "Event attitude, not brand attitude, drives intention to attend."
    text: >-
      Event attitude predicted intention to participate in a brand-sponsored event (&beta; = 0.34); brand attitude
      shaped event attitude (&beta; = 0.33) but had no direct effect on intention (&beta; = 0.03) (Schivinski, Langaro
      &amp; Shaw, 2019).
  - headline: "Social media content reaches intentions through a chain of attitudes."
    text: >-
      Both content types increased intention to participate through brand attitude and then event attitude (indirect
      &beta; = 0.03 each), with total effects of 0.09 for firm-created and 0.13 for user-generated content (Schivinski,
      Langaro &amp; Shaw, 2019).

glance:
  - { label: "Design", value: "Online survey (Qualtrics) distributed through social media; each respondent named a brand they follow on social media, whose page met screening criteria" }
  - { label: "Participants", value: "307 valid cases from 421 responses of British social media users aged 18 and over (58.4% women); 83 brands such as Adidas, O2, Tag Heuer and Virgin" }
  - { label: "Measures", value: "Firm-created and user-generated social media content (four items each, Schivinski &amp; Dabrowski); brand and event attitude (three items each); intention to participate (three items, Lee et al., 2012); 7-point scales" }
  - { label: "Analysis", value: "Confirmatory factor analysis, structural equation modelling (MLR) and bootstrapped mediation analysis (5,000 draws) in Mplus 7.2" }
  - { label: "Model fit", value: "MLR &chi;&sup2;(111) = 181.38, CFI = 0.97, TLI = 0.96, RMSEA = 0.04" }

