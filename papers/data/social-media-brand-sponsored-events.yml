question: >-
  Brands spend more and more on sponsored events and promote them on social media, and social media communication was
  thought to influence people&rsquo;s decision to attend events. This had not been tested. We asked whether firm-created
  and user-generated social media brand-related content shape consumers&rsquo; attitudes towards the brand and the
  event, and through them their intention to participate in brand-sponsored events.

implications:
  practical: >-
    Social media communication is a positive driver of attendance at brand-sponsored events. Brands need to create
    satisfying content and also encourage users, including influencers people identify with, to generate their own,
    and should promote events with consistent messages before, during and after the event that present the brand as an
    enabler of enjoyable, social experiences.
  theoretical: >-
    The study extends research on social media brand communication from purchase-related outcomes to a
    non-transactional behaviour, event participation, and shows that event attitude is the key mediator between social
    media content and attendance intentions, with stronger effects for user-generated content.

limitations:
  - "Results were not separated by social media platform or type of brand."
  - "Event attitude was measured in general terms, not for specific event types such as music or sport."
  - "Other constructs from the theory of reasoned action and its extensions were not included."

faq:
  - q: "Does social media make people more likely to attend brand-sponsored events?"
    a: >-
      Yes, indirectly. In 307 British social media users, positive evaluations of firm-created and user-generated brand
      content raised intention to participate in brand-sponsored events through brand and event attitudes (total
      effects &beta; = 0.09 and 0.13) (Schivinski, Langaro &amp; Shaw, 2019).
  - q: "Is user-generated content more effective than firm-created content for events?"
    a: >-
      In this study, yes: only user-generated content directly improved attitude towards the event (&beta; = 0.24), and
      it had the larger total effect on intention to attend (Schivinski, Langaro &amp; Shaw, 2019).
  - q: "Does liking a brand make people attend its events?"
    a: >-
      Not directly. Brand attitude improved event attitude (&beta; = 0.33), and event attitude drove intention to attend
      (&beta; = 0.34), but brand attitude had no direct effect on intention (Schivinski, Langaro &amp; Shaw, 2019).

concepts:
  - term: "Firm-created social media content"
    definition: "Brand-related content that the company itself posts on social media, such as posts on its brand page."
  - term: "User-generated social media content"
    definition: "Brand-related content that consumers create and share on social media, independently of the company."
  - term: "Brand-sponsored event"
    definition: "An event, such as a concert or sports event, that a brand organises or sponsors to engage consumers."
  - term: "Event attitude"
    definition: "A consumer&rsquo;s overall evaluation of events sponsored by a brand."

