question: >-
  Most research on how perceived risk affects consumers concerned manufacturers&rsquo; brands, and gaps remain for
  store brands despite four decades of work. We reviewed what is known about the concept and measurement of perceived
  risk for store-branded products and its main effects on buyers&rsquo; behavior.

implications:
  practical: >-
    Store brand managers should consider perceived risk when planning their assortment, especially in high-risk
    categories and where premium store brands can compete with leading national brands.
  theoretical: >-
    Future research should test store brand perceived risk outside American and Western European markets (e.g.,
    Eastern Europe), link it to store brand equity and its dimensions, and study the perceived risk of premium store
    brands.

limitations:
  - "A narrative review of selected studies, without a systematic search protocol."

faq:
  - q: "Why do consumers see store brands as risky?"
    a: >-
      Consumers compare store brands with national brands and doubt their quality, so they choose national brands to
      reduce the chance of a poor purchase (Łukasik &amp; Schivinski, 2015).
  - q: "What are the types of perceived risk in shopping?"
    a: >-
      Performance (functional), physical, psychological, social and financial risk, and time risk (Łukasik &amp;
      Schivinski, 2015).
  - q: "Does price affect how consumers judge store brands?"
    a: >-
      In high-risk categories, higher prices signal higher store brand quality; in low-risk categories, consumers do not
      make price-based quality inferences (Sheinin &amp; Wagner, 2003; reviewed by Łukasik &amp; Schivinski, 2015).

concepts:
  - term: "Perceived risk"
    definition: "The consumer&rsquo;s subjective uncertainty about the consequences of a purchase and the likelihood of a loss."
  - term: "Store brand"
    definition: "A brand owned and sold by a retailer, also called a private label; generic brands were their earliest, unbranded form."
  - term: "Category risk"
    definition: "The uncertainty consumers perceive when buying a particular type of product (Shimp &amp; Bearden, 1982)."

