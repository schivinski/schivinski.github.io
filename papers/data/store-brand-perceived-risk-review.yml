in_brief: >-
  Shoppers see store brands as riskier than national brands, and that risk lowers their willingness to buy them. This
  review of forty years of research explains the types of perceived risk and how retailer image, category risk and
  premium store brands change the picture.

findings:
  - headline: "Perceived risk has six main dimensions."
    text: >-
      Research distinguishes performance (functional), physical, psychological, social and financial risk, with time
      risk added later, each describing a different possible loss from a poor purchase (Łukasik &amp; Schivinski,
      2015).
  - headline: "Store brands are perceived as riskier than national brands."
    text: >-
      Early studies found generic brands riskier than national brands; later work showed that perceiving store brands
      as riskier reduces store brand proneness and purchase intentions (Łukasik &amp; Schivinski, 2015).
  - headline: "Retailer image and category risk shape how buyers read store brand prices."
    text: >-
      In high-risk categories, higher store brand prices signal higher quality, and a high-image retailer raises store
      brand evaluations; in low-risk categories at low-image retailers, price has no effect (Łukasik &amp; Schivinski,
      2015).
  - headline: "Premium store brands change the role of risk."
    text: >-
      High functional risk deters retailers from launching standard store brands but makes premium store brand
      launches more likely (Łukasik &amp; Schivinski, 2015).

