question: >-
  The APA (DSM-5, 2013) and the WHO (ICD-11, 2019) define disordered gaming differently: the APA proposes nine criteria
  for Internet gaming disorder, of which five must be met, while the WHO defines gaming disorder through impaired
  control, increasing priority given to gaming and continued gaming despite negative consequences. Researchers did not
  know whether the two frameworks produce different prevalence rates, or whether they lead to the same conclusions about
  how mental-health symptoms and gaming motives relate to disordered gaming.

implications:
  practical: >-
    Prevalence estimates depend on the diagnostic framework and tool, so studies and health reports should state which
    one they use and avoid comparing rates across frameworks. In treatment, clinicians should look at why clients play
    (especially gaming to escape negative feelings) rather than only at how much time they spend gaming; time spent can
    instead track progress in therapy. Helping clients understand their life goals and gaming motives may reduce urges
    and cravings.
  theoretical: >-
    The study supports the conceptual and psychometric feasibility of the WHO framework for gaming disorder and its
    measurement with the German GDT, since results closely matched the established APA framework. It shows that gaming
    motives mediate the link between psychopathological symptoms and disordered gaming regardless of framework, and
    frames the role of the escape motive within the self-medication hypothesis of addictive disorders.

limitations:
  - "The cross-sectional design does not allow causal inferences about gaming motives and symptoms."
  - "The convenience sample of German gamers, recruited through mass-media advertising, may be affected by self-selection, so prevalence rates may not generalise to all German gamers or other cultures."
  - "Self-reports can be affected by memory recall bias and social desirability."
  - "Future research should study specific populations (e.g., professional and e-sports gamers, clinical groups such as people with autism spectrum disorder), use longitudinal designs, and distinguish positive and negative forms of escapism."

faq:
  - q: "Do the WHO and APA criteria give different prevalence rates for gaming disorder?"
    a: >-
      Yes. In 1,429 German gamers, 3.28% met the WHO criteria (Gaming Disorder Test) and 5.74% met the APA criteria
      (IGDS9-SF), a statistically significant difference (Montag et al., 2019).
  - q: "Which gaming motive is most strongly linked to gaming disorder?"
    a: >-
      Escape: playing to avoid real-life problems had the largest direct effect on disordered gaming under both the WHO
      (&beta; = 0.44) and APA (&beta; = 0.47) frameworks (Montag et al., 2019).
  - q: "Can some gaming motives protect against gaming disorder?"
    a: >-
      Playing for skill development and for recreation was associated with fewer disordered gaming symptoms under both
      frameworks (&beta; between −0.08 and −0.14) (Montag et al., 2019).
  - q: "How are depression and loneliness related to gaming disorder?"
    a: >-
      Depression, loneliness and attention problems were associated with disordered gaming, largely through the escape
      motive: people with more symptoms play more to escape, which in turn predicts more disordered gaming (Montag et al.,
      2019).

concepts:
  - term: "Gaming disorder (WHO, ICD-11)"
    definition: "A pattern of gaming marked by impaired control, increasing priority given to gaming over other interests and activities, and continuation despite negative consequences, with significant impairment over 12 months."
  - term: "Internet gaming disorder (APA, DSM-5)"
    definition: "A condition proposed for further research in the DSM-5, diagnosed when five or more of nine criteria (such as preoccupation, withdrawal, tolerance and loss of control) are met over 12 months."
  - term: "Gaming motives"
    definition: "The reasons people play; the Motives for Online Gaming Questionnaire measures seven: social, escape, competition, coping, skill development, fantasy and recreation."
  - term: "Self-medication hypothesis"
    definition: "The idea that people engage in addictive behaviours to relieve painful emotional states, used in the article to explain the role of the escape motive."

