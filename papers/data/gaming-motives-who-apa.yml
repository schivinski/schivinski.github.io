  - { label: "Disordered gaming", value: "WHO framework: Gaming Disorder Test (GDT, 4 items); APA framework: Internet Gaming Disorder Scale–Short-Form (IGDS9-SF, 9 items)" }
  - { label: "Predictors and mediators", value: "Depression (PHQ-9), loneliness (UCLA Loneliness Scale, version 3), attention problems; seven gaming motives (MOGQ): social, escape, competition, coping, skill development, fantasy, recreation" }
