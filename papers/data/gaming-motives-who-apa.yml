in_brief: >-
  In 1,429 German gamers, 3.28% met the World Health Organization (WHO) criteria for gaming disorder and 5.74% met the
  American Psychiatric Association (APA) criteria for Internet gaming disorder, a significant difference. Yet the two
  frameworks told the same story about why: depression, loneliness and attention problems were linked to disordered
  gaming mainly through the escape motive.

findings:
  - headline: "The WHO framework is more conservative."
    text: >-
      3.28% of 1,429 German gamers met the WHO criteria for gaming disorder (Gaming Disorder Test) and 5.74% met the APA
      criteria for Internet gaming disorder (IGDS9-SF); the difference was significant (&chi;&sup2; = 798.32, df = 1,
      p &le; 0.001) (Montag et al., 2019).
  - headline: "Escape is the strongest motive behind disordered gaming."
    text: >-
      Gaming to escape had the largest direct effect on disordered gaming under both frameworks (&beta; = 0.44 WHO,
      0.47 APA, p &lt; 0.001), followed by competition (&beta; = 0.16 and 0.21) (Montag et al., 2019).
  - headline: "Skill development and recreation motives are protective."
    text: >-
      Playing to develop skills (&beta; = −0.09 WHO, −0.08 APA) and for recreation (&beta; = −0.14 WHO, −0.09 APA) was
      linked to fewer disordered gaming symptoms under both frameworks (Montag et al., 2019).
  - headline: "Psychopathology works through gaming motives."
    text: >-
      Depression, loneliness and attention problems were linked to disordered gaming mainly through the escape motive;
      for example, the indirect effect of depression through escape was &beta; = 0.36 (WHO) and 0.39 (APA), p &lt; 0.001
      (Montag et al., 2019).
  - headline: "The two frameworks largely agree."
    text: >-
      Direct, indirect and total effects were highly comparable across the WHO and APA frameworks; total effects were
      slightly stronger under the APA framework (depression &beta; = 0.39 vs 0.49) (Montag et al., 2019).

