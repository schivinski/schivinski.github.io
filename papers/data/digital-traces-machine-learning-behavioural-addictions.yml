question: >-
  Problematic gaming, smartphone and social media use are usually assessed with retrospective questionnaires that
  tend to catch problems late. We reviewed how the digital traces these activities leave behind, analysed with machine
  learning, could support earlier detection of risk, and what the evidence can and cannot yet show.

implications:
  practical: >-
    Machine learning outputs are best used as structured prompts: to flag people or trajectories for assessment and to
    guide stepped care, read in light of each person&rsquo;s context (late-night gaming with falling grades is not the
    same as night-shift work). Risk assessment should also ask about platform design features such as loot boxes,
    infinite scroll and auto-play, and clinicians and service users need clear explanations of what is measured and
    how data are used.
  theoretical: >-
    Digital markers become meaningful only when interpreted through theory, such as the I-PACE and cyber-developmental
    models. The field needs models trained on clinician-rated outcomes, tests of incremental validity over
    questionnaires, longitudinal and cross-cultural validation, and evaluation by calibration and sensitivity at
    fixed specificity rather than overall accuracy alone.

limitations:
  - "Most models are trained on self-report scale cut-offs rather than clinician-rated diagnoses or long-term outcomes."
  - "Samples are mostly small, convenience-based and specific to one platform, region or age group; external validation and calibration are rare."
  - "Most designs are cross-sectional; prospective prediction of onset, escalation or remission is rare, and few studies test whether digital traces add predictive value beyond questionnaires."
  - "Unequal access to platform data and changing algorithms limit comparability; consent, privacy and surveillance risks are inconsistently addressed."

faq:
  - q: "What are digital traces?"
    a: >-
      Time-stamped records of how people use devices and platforms, such as clickstreams, session timing, app
      switching, typing and scrolling, notification responses, posts and searches (Burleigh et al., 2026).
  - q: "Which online behaviours can signal risk of a behavioural addiction?"
    a: >-
      Late-night and irregular use, short gaps between sessions, fast responses to notifications, frequent brief
      checking, disrupted sleep&ndash;wake rhythms and escalating engagement; in gaming, also irregular late-night play,
      session escalation and heavy in-game spending (Burleigh et al., 2026).
  - q: "Can machine learning diagnose gaming disorder?"
    a: >-
      No. Current models are not accurate enough for stand-alone diagnosis and do not replace clinical interviews, but
      they can support risk stratification and triage alongside clinical assessment (Burleigh et al., 2026).
  - q: "Is time spent online a good sign of addiction?"
    a: >-
      Not on its own. Hours played are only weakly linked to gaming disorder symptoms once escalation, irregularity
      and night-time use are considered, and extreme screen time does not show what people do or whether it causes
      distress (Burleigh et al., 2026).

concepts:
  - term: "Digital phenotyping"
    definition: "Moment-to-moment measurement of behaviour through smartphones, wearables and online platforms to infer aspects of mental state and everyday functioning."
  - term: "Passive, active and hybrid data streams"
    definition: "Data collected automatically as people use devices (passive), data people provide deliberately, such as momentary self-reports (active), and planned designs that link the two (hybrid)."
  - term: "Incremental validity"
    definition: "The extent to which a new measurement approach, such as a model trained on digital traces, improves prediction beyond existing tools such as questionnaires."
  - term: "Multimodal fusion"
    definition: "Combining data types such as logs, sensor data and text in one model, either before modelling (early fusion), after separate models (late fusion) or inside the model (intermediate fusion)."
  - term: "I-PACE model"
    definition: "The interaction of person&ndash;affect&ndash;cognition&ndash;execution model, which explains how reward sensitivity, mood regulation and executive control shape the move from recreational to problematic use (Brand et al.)."

