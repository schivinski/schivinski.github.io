in_brief: >-
  The phones, platforms and games people use leave detailed records of how they behave. This Review shows how machine
  learning can turn such digital traces, like late-night use, short gaps between sessions and fast responses to
  notifications, into early signs of risk for gaming disorder and problematic smartphone or social media use, and why
  these tools should support clinicians rather than diagnose.

findings:
  - headline: "Three kinds of data streams can reveal risk."
    text: >-
      Passive streams (device logs, platform telemetry, wearable sensors), active streams (momentary self-reports,
      diaries, in-app surveys) and hybrid designs that link the two each trade detail against burden, consent and
      privacy; hybrid data help separate high engagement from loss of control (Burleigh et al., 2026).
  - headline: "A small set of candidate digital markers recurs."
    text: >-
      Late-night and irregular use, short gaps between sessions, fast responses to notifications, frequent brief
      checking, disrupted sleep&ndash;wake rhythms and escalating engagement are linked to higher addiction-scale
      scores and symptom burden; total time online on its own is a weak marker (Burleigh et al., 2026).
  - headline: "Models perform moderately well but rest on self-report labels."
    text: >-
      Gaming-telemetry models typically reach an area under the curve of about 0.70&ndash;0.80 and smartphone studies
      70&ndash;80% accuracy, but most are trained on questionnaire cut-offs in small convenience samples, are
      cross-sectional and lack external validation (Burleigh et al., 2026).
  - headline: "Use them for triage, not diagnosis."
    text: >-
      Their performance is not enough for stand-alone diagnosis but is comparable to many screening tools, so they are
      best used to flag people or trajectories for assessment, within governance that keeps clinical detection apart
      from commercial engagement optimisation (Burleigh et al., 2026).

