question: >-
  Gaming disorder is now recognised by the World Health Organization, while the American Psychiatric Association lists
  Internet gaming disorder as a condition for further study and suggests that affected gamers play at least 30 hours a
  week. Little is known about how much gaming is too much. We examined how weekly gaming time relates to the number of
  disordered gaming symptoms under both frameworks, how prevalence compares between them, and whether the pattern
  differs for men and women.

implications:
  practical: >-
    Clinicians should not rely on hours played alone: gaming time shares only about 10% of its variance with symptom
    levels, and the 30-hour figure risks both unnecessary concern and over-diagnosis. Functional impairment is a better
    guide. Screen-time guidance could distinguish gaming from other activities and take age into account, and the
    gaming industry could share anonymised play-time data with independent researchers.
  theoretical: >-
    The study shows that prevalence estimates depend on the diagnostic framework, with the APA framework yielding more
    than twice the WHO rate, and maps the link between symptom counts and gaming time across both frameworks and
    genders in the largest survey sample to date, informing the refinement of diagnostic criteria.

limitations:
  - "Gaming time was self-reported and may not match actual play."
  - "The design is cross-sectional and the sample non-clinical, so causal and diagnostic conclusions are limited."
  - "Parents and guardians were not surveyed, and clinical studies of the WHO framework and the GDT are still scarce."

faq:
  - q: "How many hours of gaming a week is too much?"
    a: >-
      There is no single cut-off. In 123,262 gamers, those meeting gaming disorder criteria played on average 34.5
      (APA) to 40.1 (WHO) hours a week, but gaming time explained only about 10% of the variation in symptoms, so
      impairment matters more than hours (Pontes et al., 2022).
  - q: "How common is gaming disorder?"
    a: >-
      In this world-wide sample of gamers, 1.96% met the WHO criteria for gaming disorder and 4.97% met the APA
      criteria for Internet gaming disorder (Pontes et al., 2022).
  - q: "What is the difference between gaming disorder and Internet gaming disorder?"
    a: >-
      Gaming disorder is the WHO&rsquo;s ICD-11 diagnosis, based on four features including impaired control and
      continued gaming despite harm. Internet gaming disorder is the APA&rsquo;s DSM-5 condition for further study,
      defined by five or more of nine criteria.
  - q: "Do men and women differ in gaming time and disordered gaming?"
    a: >-
      Men played more at low symptom levels, but women with many symptoms played longer than men with the same number
      of symptoms (Pontes et al., 2022).

concepts:
  - term: "Gaming disorder (WHO)"
    definition: "An ICD-11 diagnosis (6C51) marked by impaired control over gaming, increasing priority given to gaming and continued gaming despite negative consequences, with significant impairment."
  - term: "Internet gaming disorder (APA)"
    definition: "A DSM-5 condition for further study, defined by at least five of nine criteria within 12 months."
  - term: "Gaming Disorder Test (GDT)"
    definition: "A four-item measure of gaming disorder based on the WHO framework (Pontes et al., 2021)."
  - term: "IGDS9-SF"
    definition: "The Internet Gaming Disorder Scale&ndash;Short-Form, a nine-item measure of the APA criteria (Pontes &amp; Griffiths, 2015)."
  - term: "Welch&rsquo;s ANOVA"
    definition: "A version of analysis of variance that does not assume equal variances across groups."

