in_brief: >-
  The more symptoms of gaming disorder gamers report, the more hours they play, but the 30 hours a week the American
  Psychiatric Association mentions underestimates the time disordered gamers spend. In 123,262 gamers from 168
  countries, disordered gamers played about 35 to 40 hours a week, and prevalence was 1.96% under the WHO framework and
  4.97% under the APA framework.

findings:
  - headline: "Gaming disorder is rarer under the WHO definition than the APA one."
    text: >-
      Among 123,262 gamers from 168 countries, 1.96% met the World Health Organization criteria for gaming disorder,
      compared with 4.97% under the American Psychiatric Association criteria for Internet gaming disorder
      (Pontes et al., 2022).
  - headline: "More symptoms go with more gaming time."
    text: >-
      Weekly gaming time rose steadily with the number of criteria endorsed, from about 19 hours with none to about 40
      hours at the highest levels, in both frameworks; the number of criteria explained about 9% of the variance in
      gaming time (&omega;&sup2; = 0.09) (Pontes et al., 2022).
  - headline: "Disordered gamers play well over 30 hours a week."
    text: >-
      Gamers meeting the APA threshold of five criteria played 34.53 hours a week on average, and those meeting all four
      WHO criteria 40.13 hours, so the APA&rsquo;s figure of at least 30 hours a week underestimates the time invested
      in disordered gaming (Pontes et al., 2022).
  - headline: "Women with many symptoms play longer than men."
    text: >-
      Men played more than women at low symptom levels, but women endorsing six or more APA criteria, or all four WHO
      criteria, spent more time gaming than men with the same number of symptoms (Pontes et al., 2022).

