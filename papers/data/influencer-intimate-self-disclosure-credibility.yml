question: >-
  Travel influencers often share personal details alongside their recommendations, and earlier research had shown that
  self-disclosure can build closeness with followers. But not every influencer can sustain close, reciprocal
  relationships with a large audience, and studies disagreed on whether self-disclosure helps or hurts credibility. We
  asked how intimate self-disclosure in travel recommendations affects an influencer's credibility, whether the fit
  between the content and the influencer's expertise explains the effect, and whether followers who feel more competent
  through the influencer react differently.

implications:
  practical: >-
    Travel influencers and the destinations and brands that hire them should keep personal stories close to the
    influencer's field: an intimate anecdote that drifts away from travel advice makes the post feel off-topic and
    costs credibility. The cost is smaller among followers who feel more capable through the influencer, so content
    that builds followers' skills and knowledge (detailed itineraries, cost breakdowns, safety advice, travel guides,
    quizzes and challenges) helps influencers share personal stories without losing trust.
  theoretical: >-
    The study introduces content-expertise congruence, the fit between what an influencer posts and the expertise she
    is known for, as the mechanism linking self-disclosure to credibility, and competence need fulfilment, drawn from
    self-determination theory and the elaboration likelihood model, as a boundary condition. It shows that
    self-disclosure affects credibility through how followers judge the content itself, not only through the
    relationship they have with the influencer.

limitations:
  - "A fictitious influencer and a hypothetical scenario increase control but limit external validity; future studies could compare familiar and unfamiliar real influencers."
  - "The intimate and non-intimate posts differed in length, a common feature of self-disclosure manipulations that should be ruled out in future designs."
  - "Only a female influencer was shown; future research could test influencer gender and same-sex versus opposite-sex pairings."

faq:
  - q: "Should travel influencers share personal stories?"
    a: >-
      Only when the story fits their expertise. Intimate content unrelated to travel advice lowered credibility from
      5.14 to 4.54 on a 7-point scale, because followers saw it as less congruent with what the influencer is known for
      (Leite et al., 2024).
  - q: "Why does oversharing hurt an influencer's credibility?"
    a: >-
      Because the post stops matching the influencer's field. Perceived content-expertise congruence fell from 3.63 to
      2.63, and this drop carried the effect on credibility (indirect effect &minus;0.79) (Leite et al., 2024).
  - q: "When do followers forgive intimate influencer content?"
    a: >-
      When the influencer makes them feel competent. The indirect credibility loss halved from &minus;0.95 among
      followers low in competence need fulfilment to &minus;0.50 among those high in it (Leite et al., 2024).
  - q: "What content builds an influencer's credibility?"
    a: >-
      Informative content that matches the influencer's expertise and builds followers' skills, such as itineraries,
      cost breakdowns and safety advice; posts focused on travel tips were rated more congruent and more credible than
      the same tips mixed with intimate details (Leite et al., 2024).

concepts:
  - term: "Intimate self-disclosure"
    definition: "Sharing intimate, personal or private information about oneself, such as emotions, relationships and private memories, beyond surface-level facts."
  - term: "Source credibility"
    definition: "How attractive, trustworthy and expert a communicator is perceived to be (Ohanian, 1990)."
  - term: "Content-expertise congruence"
    definition: "The extent to which the content an influencer shares matches the field of expertise she is known for."
  - term: "Competence need fulfilment"
    definition: "The extent to which people feel a sense of mastery, achievement and effectiveness, here when seeing, hearing or thinking about the influencer (self-determination theory)."
  - term: "Elaboration likelihood model"
    definition: "A model of persuasion in which motivated people weigh the central message carefully, while less motivated people rely on peripheral cues."
  - term: "Moderated mediation"
    definition: "When an indirect (mediated) effect changes with the level of a third variable; here, the effect of intimacy on credibility through congruence depends on competence need fulfilment."

materials:
