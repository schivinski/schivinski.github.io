in_brief: >-
  When a travel influencer mixes intimate personal stories into travel tips, followers see her as less credible,
  because the post no longer fits what she is known for. In an experiment with 212 US social media users, that
  credibility loss was smaller among followers who felt the influencer made them more competent.

findings:
  - headline: "Intimate content lowers a travel influencer's credibility."
    text: >-
      In an experiment with 212 US social media users, travel tips that included intimate self-disclosure (a romance and
      private memories from the trip) lowered the influencer's credibility from 5.14 to 4.54 on a 7-point scale,
      <i>F</i>(1, 210) = 13.88, <i>p</i> &lt; .001 (Leite et al., 2024).
  - headline: "The cause is a mismatch between the post and the influencer's expertise."
    text: >-
      Posts with intimate content were judged less congruent with the influencer's field of expertise (2.63 vs 3.63 on
      a 5-point scale, &eta;<sub>p</sub>&sup2; = .17), and this loss of congruence carried the effect on credibility
      (indirect effect <i>b</i> = &minus;0.79, 95% CI [&minus;1.07, &minus;0.54]) (Leite et al., 2024).
  - headline: "Followers who feel more competent are less put off."
    text: >-
      The fulfilment of followers' competence needs softened the hit to congruence (interaction <i>b</i> = 0.18,
      <i>p</i> = .03): the indirect loss of credibility shrank from &minus;0.95 at low competence to &minus;0.50 at
      high competence (index of moderated mediation = 0.14, 95% CI [0.0006, 0.2986]) (Leite et al., 2024).
  - headline: "Intimacy did not damage credibility beyond the loss of fit."
    text: >-
      Once content-expertise congruence was accounted for, the direct effect of intimate content on credibility was not
      significant (<i>b</i> = 0.20, <i>p</i> &gt; .05), so the whole credibility cost ran through the perceived mismatch
      (Leite et al., 2024).

glance:
  - { label: "Design", value: "Online between-subjects experiment with two conditions (travel recommendations with vs without intimate self-disclosure) and competence need fulfilment measured as a moderator; ANOVA and PROCESS models 4 and 7 with 5,000 bootstrap samples" }
  - { label: "Participants", value: "212 US social media users recruited on Amazon Mechanical Turk (60.4% women; mean age 36.46 years), 104 in the intimate and 108 in the non-intimate condition; most used YouTube (82.5%), Facebook (82.1%) and Instagram (76.4%)" }
  - { label: "Stimuli", value: "A fictitious female travel influencer, Sophia, posting tips about Thailand on Instagram (meeting locals, beaches); the intimate version added a romance and private memories from the trip" }
  - { label: "Measures", value: "Influencer credibility (15 semantic differential items; Ohanian, 1990), content-expertise congruence (2 items; Escalas &amp; Bettman, 2017), competence need fulfilment (5 items; Thomson, 2006), perceived intimacy (3 items; Bazarova, 2012) and scenario realism" }
  - { label: "Outcome", value: "Perceived credibility of the influencer (attractiveness, trustworthiness and expertise)" }

