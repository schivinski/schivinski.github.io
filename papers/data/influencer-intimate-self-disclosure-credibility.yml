    text: "Both versions of the influencer's Instagram travel tips (with and without intimate content) are reproduced in Table A1 below."
  - label: "Scale items"
    text: "All items for credibility, content-expertise congruence and competence need fulfilment, with loadings and reliability, are in Table A2 below."
  - label: "Manipulation and realism checks"
    text: "Perceived intimacy: three 7-point semantic differential items (e.g. non-intimate to intimate, impersonal to personal; Bazarova, 2012; &alpha; = 0.83). Realism: two 7-point items on whether the scenario was realistic or similar to posts seen before (Leite et al., 2022)."

