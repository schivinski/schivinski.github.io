question: >-
  Sports brands invest heavily in experiences, from run clubs and training sessions to live events and activations,
  in the hope of creating fans rather than customers. Earlier work had linked brand experience and emotions with
  engagement in other settings, but little was known about how this works for sports brands in Australia, a country
  where sport runs deep in the culture. Using the stimulus-organism-response model, we asked whether brand experience
  increases consumers' emotional response to sports brands, and whether that emotional response increases consumer
  brand engagement.

implications:
  practical: >-
    Sports brands and their agencies should design holistic brand experiences, in which each touchpoint, from events and
    activations to athletes and imagery, is built to evoke positive emotions, because those emotions are what turn an
    experience into engagement. Experiential marketing deserves a larger share of the budget when the goal is lasting
    relationships rather than one-off sales, and campaigns should be tailored to the emotionally charged nature of
    Australian sport and to consumers' values and lifestyles.
  theoretical: >-
    The study applies the stimulus-organism-response model to sports brands, with brand experience as the stimulus,
    emotional response as the organism and consumer brand engagement as the response. It adds evidence that emotions
    are a key link between what consumers experience with a brand and how they engage with it, and extends
    experiential marketing theory to the Australian sports industry.

limitations:
  - "The study covered only sports brands, so the findings may not apply to other industries."
  - "Data were self-reported by a non-representative snowball sample that does not reflect the Australian population, which limits generalisation."
  - "The emotional response scale had a Cronbach's alpha (0.63) below the usual 0.70 threshold."
  - "Future work could test other industries, countries and variables such as brand loyalty, satisfaction or digital and social media engagement, and use more objective measures."

faq:
  - q: "Do brand experiences make consumers more engaged with sports brands?"
    a: >-
      Yes, through emotions. In a survey of 526 Australians, brand experience raised emotional response
      (&beta; = 0.39), and emotional response raised consumer brand engagement (&beta; = 0.50)
      (Schivinski, Mancuso &amp; Brzozowska-Woś, 2024).
  - q: "Why do emotions matter for sports marketing?"
    a: >-
      Emotional response had the largest effect in the model (&beta; = 0.50): people who felt more strongly after a
      brand experience thought about the brand more, felt better using it and chose it over other sports brands (Schivinski, Mancuso &amp; Brzozowska-Woś, 2024).
  - q: "What is experiential marketing?"
    a: >-
      Marketing that creates direct, memorable encounters with a brand, such as events, activations or branded
      training sessions like the Nike Run Club, rather than relying only on advertising messages.
  - q: "Does age or gender change how engaged sports fans are?"
    a: >-
      Not in this study. Neither age nor gender had a significant effect on consumer brand engagement
      (Schivinski, Mancuso &amp; Brzozowska-Woś, 2024).

concepts:
  - term: "Brand experience"
    definition: "Sensations, feelings, thoughts and behaviours evoked by brand-related stimuli such as design, identity, packaging, communication and environments (Brakus et al., 2009)."
  - term: "Emotional response"
    definition: "The positive and negative emotions, such as happiness, excitement or disappointment, that consumers feel during or after an interaction with a brand."
  - term: "Consumer brand engagement"
    definition: "A consumer's cognitive, emotional and behavioural activity in brand interactions (Hollebeek et al., 2014)."
  - term: "Stimulus-organism-response (S-O-R) model"
    definition: "A framework in which an external stimulus affects a person's internal state, which in turn shapes their behavioural response (Mehrabian &amp; Russell, 1974)."
  - term: "Experiential marketing"
    definition: "Marketing that creates direct, memorable encounters between consumers and brands."

materials:
  - label: "Scale items"
    text: "All 29 items for emotional response, brand experience and consumer brand engagement, with means, standard deviations, skewness and kurtosis, are in Table 3 below (all on 5-point scales)."
  - label: "Screening question"
    text: "&ldquo;Have you had a real-life advertising experience with a sports brand in Australia?&rdquo; Respondents then named one sports brand whose advertising they had experienced in real life and answered about that brand."
  - label: "Data screening"
    text: "Incomplete questionnaires, straight-lining (SD across items = 0) and low-variance responses (SD 0.1 to 0.5) were removed, along with univariate outliers, leaving 526 of 610 responses."

