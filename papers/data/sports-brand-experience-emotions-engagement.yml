student_note:
  title: "A note from Bruno"
  text: >-
    This article grew out of Giulio Mancuso's master's research at RMIT University in Melbourne, which I had the
    pleasure of supervising. Giulio took on a question that sits close to Australian life: when sports brands step off
    the screen and into people's lives through events, activations and other real-world experiences, do those moments
    create the emotional connection that keeps fans engaged? His project surveyed 610 Australians about their real-life
    encounters with sports brands. It showed that richer brand experiences spark stronger emotional responses, and those
    responses in turn deepen engagement with the brand. Working with Giulio was a real pleasure: he brought curiosity,
    persistence and a genuine love of sport to the project. It is a proud moment to see a student's work published, and
    I am delighted to share it here alongside Magdalena Brzozowska-Woś, who completed the author team.

