in_brief: >-
  Sports brands that give people memorable real-life experiences make them feel more, and people who feel more engage
  more with the brand. In a survey of 526 Australians who had a real-life advertising experience with a sports brand,
  brand experience raised emotional response, which in turn raised consumer brand engagement.

findings:
  - headline: "Brand experiences stir emotions."
    text: >-
      Among 526 Australians who recalled a real-life advertising experience with a sports brand, a stronger brand
      experience went with a stronger emotional response to the brand (&beta; = 0.39, <i>t</i> = 5.10, <i>p</i> = .001)
      (Schivinski, Mancuso &amp; Brzozowska-Woś, 2024).
  - headline: "Emotions drive engagement."
    text: >-
      Consumers who felt a stronger emotional response were more engaged with the sports brand, thinking about it,
      feeling good when using it and choosing it over others (&beta; = 0.50, <i>t</i> = 7.11, <i>p</i> = .001); the model explained 27%
      of the variance in engagement (Schivinski, Mancuso &amp; Brzozowska-Woś, 2024).
  - headline: "Age and gender made no difference."
    text: >-
      Neither age nor gender had a significant effect on consumer brand engagement once emotional response was taken
      into account (Schivinski, Mancuso &amp; Brzozowska-Woś, 2024).

