    text: "The same &lsquo;Lolcat&rsquo; meme image for both conditions, with the brand logo and caption: hedonic (Dior) &lsquo;When your makeup looks good all day long&rsquo;; utilitarian (Colgate) &lsquo;When the fresh taste of mint stays in your mouth all day long&rsquo;. The images are shown in Figure A1 of the article."
  - label: "Pre-test brands"
    text: "Utilitarian: Colgate Total toothpaste, Pantene shampoo, Nivea deodorant, Dove body wash. Hedonic: O.P.I nail polish, Chanel perfume, Dior eye shadow, Colour WoW hairspray."
  - label: "Iconic (2 items)"
    text: "&lsquo;This brand is a cultural symbol&rsquo;; &lsquo;This brand is iconic&rsquo;."
  - label: "Popular (4 items)"
    text: "&lsquo;This brand is liked by most people&rsquo;; &lsquo;This brand is in style&rsquo;; &lsquo;This brand is popular&rsquo;; &lsquo;This brand is widely accepted&rsquo;."
  - label: "High-status (4 items)"
    text: "&lsquo;This brand is chic&rsquo;; &lsquo;This brand is glamorous&rsquo;; &lsquo;This brand is sophisticated&rsquo;; &lsquo;This brand is ritzy&rsquo;."
