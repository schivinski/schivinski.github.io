in_brief: >-
  A meme for a hedonic beauty brand (Dior) was seen as more high-status than the same meme for a utilitarian brand
  (Colgate), and the gap grew the more popular and iconic the brand was perceived to be. In an online experiment with
  428 participants, perceived popularity moderated the effect most strongly, which the authors read as a route to
  status for everyday utilitarian brands.

findings:
  - headline: "Popularity widens the status gap between hedonic and utilitarian brand memes."
    text: >-
      In an online experiment with 428 Amazon Mechanical Turk participants who saw the same internet meme for either a
      hedonic (Dior) or a utilitarian (Colgate) beauty brand, perceived brand popularity moderated the effect of meme
      type on high-status perceptions (interaction &beta; = 0.59, <i>SE</i> = 0.11, 95% CI [0.38, 0.80]); the
      hedonic meme's advantage rose from 0.46 at low popularity to 1.05 at the mean and 1.63 at high popularity
      (Aleem et al., 2024).
  - headline: "When a brand is not seen as iconic, hedonic and utilitarian memes look equally high-status."
    text: >-
      Perceived iconicity also moderated the effect of meme type on high-status perceptions (&beta; = 0.43,
      <i>SE</i> = 0.11, 95% CI [0.22, 0.64]). At low iconicity (&minus;1 SD) the two memes did not differ (0.32,
      95% CI [&minus;0.08, 0.72]); at high iconicity (+1 SD) the hedonic meme scored 1.23 higher (95% CI [0.83, 1.63])
      (Aleem et al., 2024).
  - headline: "Brands seen as popular or iconic are also seen as high-status."
    text: >-
      Across the 428 participants, high-status perceptions correlated with perceived popularity (<i>r</i> = .55) and
      perceived iconicity (<i>r</i> = .56), both <i>p</i> &lt; .001, and popularity and iconicity correlated with each
      other (<i>r</i> = .77) (Aleem et al., 2024).
  - headline: "Utilitarian brands are not shut out of high status."
    text: >-
      The authors conclude that hedonic brands are perceived as high-status when they are also seen as iconic and
      popular, and that utilitarian brands can be associated with high status through the popular dimension of brand
      coolness; the iconic hypothesis (H1) was partially supported and the popular hypothesis (H2) fully supported
      (Aleem et al., 2024).

glance:
  - { label: "Design", value: "Between-subjects online experiment with two conditions (utilitarian vs hedonic brand meme), after a stimulus pre-test" }
  - { label: "Pre-test", value: "186 MTurk participants classified eight personal beauty brands; Colgate was seen as utilitarian by 98.4% (n = 183) and Dior as hedonic by 89.9% (n = 167)" }
  - { label: "Participants", value: "428 Amazon Mechanical Turk participants (50.9% women), 214 per condition; survey in English" }
  - { label: "Stimuli", value: "The same &lsquo;Lolcat&rsquo; meme image, made with the Imgflip generator, with the brand logo and a brand-specific caption" }
  - { label: "Measures", value: "Three dimensions of brand coolness (Warren et al., 2019) on 5-point scales: iconic (2 items, Spearman&rsquo;s &rho; = 0.75), popular (4 items, &alpha; = 0.92) and high-status (4 items, &alpha; = 0.87)" }
  - { label: "Analysis", value: "Moderation with PROCESS Model 1 (Hayes, 2018) in IBM SPSS 28, 10,000 bootstrap samples; controls for age, gender and purchase frequency of Colgate and Dior" }

