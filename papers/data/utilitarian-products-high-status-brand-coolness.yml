question: >-
  Brands increasingly talk to consumers through internet memes, and being seen as cool helps brands, but research had
  not looked at how individual dimensions of brand coolness shape consumer perceptions, nor connected memes with brand
  coolness. Status is usually linked with hedonic and luxury products. We asked: when comparing familiar utilitarian
  and hedonic brands, how does being popular or iconic strengthen or weaken perceptions that the brand is
  high-status?

implications:
  practical: >-
    Popularity is one of the strongest influences on how brands are perceived, so brands can use digital channels,
    memes included, to build it. Memes are cheap, adaptable and easy to share, which raises the chance of content
    spreading. Managers can match coolness dimensions to the type of product: for hedonic products, communication that
    stresses an iconic message (for example in messaging apps, photos or video); for utilitarian products, messages
    framed around popularity (bought by many) or exclusivity (bought by few). Because many other factors shape
    decisions on social media, target information should be kept up to date.
  theoretical: >-
    The study is presented as the first to link internet memes with brand coolness and the first to test specific
    coolness dimensions across hedonic and utilitarian products. It shows that utilitarian brands are not excluded from
    status: perceived popularity conditions how far product type shapes status perceptions, and the iconic and popular
    dimensions strengthen the link between hedonic products and high status. Popular, iconic and high-status emerge as
    core dimensions for mass cool brands.

limitations:
  - "Only one meme (the &lsquo;Lolcat&rsquo; image) was tested; the study should be repeated with other types of memes."
  - "Only personal beauty brands were studied; the design can be applied to services, food or technology."
  - "Personal values differ by culture, so future work could test whether the links between meme type, coolness dimensions and status vary across cultures, and how memes relate to perceived sustainability, conspicuous consumption and different generations."

faq:
  - q: "Can a utilitarian brand be seen as high-status?"
    a: >-
      The authors conclude that it can, through the popular dimension of brand coolness. In their experiment with 428
      participants, the status gap between a hedonic (Dior) and a utilitarian (Colgate) brand meme depended on how
      popular the brand was seen to be: 0.46 at low popularity, 1.05 at the mean and 1.63 at high popularity
      (Aleem et al., 2024).
  - q: "Does being seen as iconic make a brand high-status?"
    a: >-
      Perceived iconicity correlated with high-status perceptions (<i>r</i> = .56) and moderated the effect of product
      type (&beta; = 0.43, 95% CI [0.22, 0.64]): hedonic and utilitarian brand memes were rated equally high-status when
      the brand was seen as low in iconicity, and the hedonic meme was rated 1.23 higher when iconicity was high
      (Aleem et al., 2024).
  - q: "What are the dimensions of brand coolness?"
    a: >-
      Following Warren et al. (2019), cool brands can be useful, aesthetically appealing, energetic, original,
      authentic, rebellious, high-status, subcultural, iconic and popular. Aleem et al. (2024) focused on the three
      dimensions linked with mass cool brands: popular, iconic and high-status.
  - q: "How were brand coolness dimensions measured?"
    a: >-
      With items adapted from Warren et al. (2019) on 5-point agreement scales: iconic (2 items, Spearman&rsquo;s
      &rho; = 0.75), popular (4 items, &alpha; = 0.92) and high-status (4 items, &alpha; = 0.87) (Aleem et al., 2024).

concepts:
  - term: "Brand coolness"
    definition: "Consumers&rsquo; perception that a brand is cool; a subjective, positive and changing quality made up of up to ten dimensions (Warren et al., 2019)."
  - term: "High-status (brand coolness dimension)"
    definition: "The perception that a brand is associated with prestige, social class and sophistication: chic, glamorous, sophisticated, ritzy."
  - term: "Iconic (brand coolness dimension)"
    definition: "The perception that a brand reflects people&rsquo;s values and beliefs and is recognised as a cultural symbol."
  - term: "Popular (brand coolness dimension)"
    definition: "The perception that a brand is fashionable, in style and liked or accepted by most people."
  - term: "Hedonic versus utilitarian products"
    definition: "Hedonic products are bought mainly for pleasure and sensory experience (here, Dior make-up); utilitarian products for function and practical use (here, Colgate toothpaste)."
  - term: "Internet meme (image macro)"
    definition: "An image, usually humorous, with a short caption, copied and spread online with slight variations; image macros are the most common form."

