question: >-
  Research on problematic social media use has focused mostly on Facebook, although people now use many platforms. We
  examined which factors predict problematic use of social media in general: the motives for using social media,
  psychological well-being, self-esteem, and positive and negative affect, over and above age, gender and patterns of
  use.

implications:
  practical: >-
    The motive for using social media, and especially using it to escape problems or pass time, may help identify
    users at risk; negative affect was a strong predictor, which matters at times such as the COVID-19 pandemic when
    exposure to distressing information on social media is high. Problematic users also reported lower self-esteem and
    used more platforms.
  theoretical: >-
    The study links broad social media use motives, drawn from uses and gratifications research, to problematic social
    media use across platforms, and supports the associations of problematic use with lower well-being and self-esteem
    and with negative affect.

limitations:
  - "The cross-sectional design does not allow causal conclusions."
  - "Self-reports may not reflect actual use, and the convenience, self-selected sample was relatively small."
  - "The strict BSMAS cut-off lacks evidence of diagnostic accuracy, and only four social media use motives were examined."

faq:
  - q: "What predicts problematic social media use?"
    a: >-
      In a survey of 584 users, the strongest predictors were the intrapersonal motive (using social media to forget
      everyday complications, pass time and record one&rsquo;s life) and negative affect, followed by daily use and the
      surveillance motive (Schivinski et al., 2020).
  - q: "How common is problematic social media use?"
    a: >-
      In this sample, 6.68% of users met a strict cut-off on the Bergen Social Media Addiction Scale; earlier studies
      report rates from 1.6% to 18% (Schivinski et al., 2020).
  - q: "Is self-esteem related to problematic social media use?"
    a: >-
      Yes. Problematic users had lower self-esteem (<i>d</i> = 0.57) and lower psychological well-being
      (<i>d</i> = 0.61) than other users, although self-esteem did not remain in the final regression model
      (Schivinski et al., 2020).
  - q: "What is the Bergen Social Media Addiction Scale?"
    a: >-
      A six-item questionnaire measuring the core components of addiction applied to social media: salience, mood
      modification, tolerance, withdrawal, conflict and relapse (Andreassen et al., 2016).

concepts:
  - term: "Problematic social media use (PSMU)"
    definition: "Excessive, poorly controlled social media use that shows addiction-like symptoms and causes problems in daily life."
  - term: "Intrapersonal motive"
    definition: "Using social media to forget the complications of everyday life, remember what was done, pass time and record everyday life."
  - term: "Surveillance motive"
    definition: "Using social media to follow social issues, current affairs and professional information."
  - term: "Positive and negative affect"
    definition: "Trait-like tendencies to experience pleasant (enthusiasm, alertness) or unpleasant (distress, nervousness) emotions."

materials:
  - label: "Social media use motives"
    text: "Adapted from the Motivation for Twitter Use Measure (Lee &amp; Kim, 2014) by replacing &lsquo;Twitter&rsquo; with &lsquo;social media&rsquo;: 14 items rated from 1 = strongly disagree to 7 = strongly agree, covering surveillance (5 items), network expansion (3), intrapersonal motive (4) and relationship maintenance (2)."
  - label: "Data"
    text: "The data set is not publicly available because of confidentiality limits set by the ethics committee; requests can be made to the first author."

