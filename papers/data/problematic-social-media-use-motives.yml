in_brief: >-
  People who use social media to escape everyday problems or to record their own lives are the most likely to use it
  problematically. In a survey of 584 adult users, this intrapersonal motive and negative affect were the strongest
  predictors of problematic social media use, and 6.7% of users were classed as problematic.

findings:
  - headline: "Using social media for yourself predicts problematic use."
    text: >-
      Among 584 social media users, the intrapersonal motive (using social media to forget everyday complications, pass
      time and record one&rsquo;s life) was the strongest predictor of problematic social media use (&beta; = 0.38)
      (Schivinski et al., 2020).
  - headline: "Negative affect also predicts problematic use."
    text: >-
      Negative affect (&beta; = 0.22), daily social media use (&beta; = 0.18) and the surveillance motive
      (&beta; = 0.12) raised problematic use, and positive affect lowered it (&beta; = &minus;0.09); together they
      explained about 37% of the variance, over and above age and gender (Schivinski et al., 2020).
  - headline: "About one user in fifteen is a problematic user."
    text: >-
      6.68% (<i>n</i> = 39) of the sample scored 4 or more on all six items of the Bergen Social Media Addiction Scale
      (Schivinski et al., 2020).
  - headline: "Problematic users differ on well-being, self-esteem and motives."
    text: >-
      Problematic users used more platforms, reported more negative affect (<i>d</i> = 1.08) and stronger
      intrapersonal motives (<i>d</i> = 1.07), and had lower psychological well-being and self-esteem than other users
      (Schivinski et al., 2020).

