question: >-
  The World Health Organization&rsquo;s ICD-11 distinguishes gaming disorder that is predominantly online from gaming
  disorder that is predominantly offline, but no study had tested whether the distinction is meaningful. We compared
  gamers who play mainly online, mainly offline or both on gaming disorder symptoms, gaming time, loneliness, attention
  problems and depression, and examined whether the device people play on matters too.

implications:
  practical: >-
    Gaming mode and device can help clinicians and researchers judge who may be more vulnerable to disordered gaming:
    online play, and play on desktop computers, went with more symptoms and more hours. Because the industry holds much
    of the relevant data, for example on freemium games designed to prolong play, cooperation with independent
    researchers is needed.
  theoretical: >-
    The study provides the first empirical support for the ICD-11 distinction between predominantly online and offline
    gaming disorder, and suggests that structural characteristics such as online multiplayer features and the gaming
    device should be considered in the study of disordered gaming.

limitations:
  - "All data are self-reported; structured interviews and clinical samples are needed to validate the findings."
  - "The sample is large but not representative of German-speaking gamers, and few women took part."
  - "The design is cross-sectional and correlational, so causal conclusions cannot be drawn."

faq:
  - q: "Is online gaming more addictive than offline gaming?"
    a: >-
      In 2,768 German-speaking gamers, those who played mainly online had higher gaming disorder scores than mixed and
      offline gamers, though gaming mode explained only about 2% of the variance (Montag et al., 2021).
  - q: "Does the gaming device matter for gaming disorder?"
    a: >-
      Yes, modestly. Desktop computer gamers reported the most gaming time and the highest gaming disorder scores of all
      device groups (Montag et al., 2021).
  - q: "What does ICD-11 say about online and offline gaming disorder?"
    a: >-
      ICD-11 distinguishes gaming disorder that is predominantly online (6C51.0), predominantly offline (6C51.1) and
      unspecified.
  - q: "Is gaming disorder linked to loneliness and depression?"
    a: >-
      Yes. Gaming disorder scores correlated with loneliness (<i>r</i> = .41), attention problems (.50) and depression
      (.54) in this sample, but these did not differ by gaming mode (Montag et al., 2021).

concepts:
  - term: "Gaming disorder (WHO)"
    definition: "An ICD-11 diagnosis marked by impaired control over gaming, increasing priority given to gaming and continued gaming despite negative consequences, with significant impairment."
  - term: "Internet gaming disorder (APA)"
    definition: "A DSM-5 condition for further study, defined by at least five of nine criteria within 12 months."
  - term: "Gaming mode"
    definition: "Whether a person plays predominantly online, predominantly offline or both equally."
  - term: "Structural characteristics"
    definition: "Design features of games, such as multiplayer functions and reward schedules, that may influence playing behaviour and addictive potential."

materials:
  - label: "Measures"
    text: "GDT and IGDS9-SF rated from 1 = &lsquo;never&rsquo; to 5 = &lsquo;very often&rsquo;; UCLA loneliness (3 items) and attention problems (3 items) rated from 1 = &lsquo;strongly disagree&rsquo; to 5 = &lsquo;strongly agree&rsquo;; PHQ-8 rated from 1 = &lsquo;not at all&rsquo; to 4 = &lsquo;nearly every day&rsquo;."
  - label: "Questions on gaming"
    text: "Participants reported whether they mainly played online, offline or both equally, and whether they mainly used a console, desktop computer, laptop or mobile device such as a smartphone."

