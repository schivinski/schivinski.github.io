in_brief: >-
  The WHO&rsquo;s split of gaming disorder into a mainly online and a mainly offline form makes sense: in 2,768
  German-speaking gamers, those who played mostly online had the most symptoms, followed by mixed and then offline
  gamers. Gamers who mostly played on a desktop computer also had the highest symptom scores and played the longest.

findings:
  - headline: "Online gamers show the most gaming disorder symptoms."
    text: >-
      Gaming Disorder Test scores were highest for gamers who mainly played online (9.27), lower for those playing
      online and offline equally (8.51) and lowest for offline gamers (7.32); all three groups differed significantly
      (Montag et al., 2021).
  - headline: "Online gamers also play the longest."
    text: >-
      Online gamers played 23.0 hours a week on average, against 20.7 for mixed and 12.7 for offline gamers; gaming
      mode explained about 4% of the variance in gaming time and about 2% in disorder scores (Montag et al., 2021).
  - headline: "Desktop computer gamers score highest."
    text: >-
      Gamers who mostly used a desktop computer reported the most weekly gaming (24.2 hours) and the highest gaming
      disorder scores under both the WHO and APA frameworks, compared with console, laptop and mobile gamers
      (Montag et al., 2021).
  - headline: "Online play dominates on every device."
    text: >-
      54% of participants mainly played online, 27% online and offline, and 19% offline; online gaming was the most
      common mode for every device (Montag et al., 2021).

