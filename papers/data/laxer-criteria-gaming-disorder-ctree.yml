question: >-
  The DSM-5 lists nine criteria for Internet gaming disorder and requires five, treating all criteria as equal, while the
  WHO&rsquo;s gaming disorder leaves several of them out, including withdrawal. We asked whether some criteria carry
  more diagnostic weight than others, using a machine-learning decision tree on a large sample of Polish gamers.

implications:
  practical: >-
    Clinicians and the authors of diagnostic manuals may give withdrawal and loss of control particular weight when
    assessing disordered gaming. Because withdrawal was central to identifying disordered gamers, the WHO criteria for
    gaming disorder, which omit it, may be laxer than the DSM-5 criteria and could hinder efficient diagnosis.
  theoretical: >-
    The nine IGD criteria differ in clinical weight, supporting the distinction between core and peripheral criteria,
    and treating each criterion as a continuous rather than binary symptom reveals distinct pathways and gamer subtypes.

limitations:
  - "The sample was a community-based, non-probability sample of gamers, not a clinical sample."
  - "The cross-sectional design does not allow causal conclusions."
  - "Disordered gaming was classified psychometrically; a clinical gold standard such as structured interviews is needed."

faq:
  - q: "Which symptoms best identify gaming disorder?"
    a: >-
      In 3,222 Polish gamers, withdrawal and loss of control were the most informative: gamers experiencing both very
      often had a 78% probability of disordered gaming (Pontes et al., 2019).
  - q: "Are all Internet gaming disorder criteria equally important?"
    a: >-
      No. A decision-tree analysis found that withdrawal, loss of control, negative consequences and preoccupation
      carried the diagnostic information, while the other five criteria did not shape the tree (Pontes et al., 2019).
  - q: "Why does withdrawal matter for the WHO definition of gaming disorder?"
    a: >-
      The WHO&rsquo;s ICD-11 gaming disorder does not include withdrawal, yet withdrawal was the first split in the tree,
      so the authors argue that the WHO criteria may be laxer than the DSM-5 criteria.
  - q: "What is a conditional inference tree?"
    a: >-
      A machine-learning method that repeatedly splits a sample on the predictor most strongly associated with the
      outcome, producing if&ndash;then rules and subgroups.

concepts:
  - term: "Internet gaming disorder (IGD)"
    definition: "A DSM-5 condition for further study, defined by at least five of nine criteria within 12 months."
  - term: "Conditional inference tree (Ctree)"
    definition: "A non-parametric decision-tree method that uses permutation tests to choose splits, avoiding selection bias."
  - term: "Withdrawal"
    definition: "Irritability, anxiety or sadness when trying to reduce or stop gaming."
  - term: "MIMIC model"
    definition: "A factor model with covariates (multiple indicators, multiple causes), used here to test the scale and its links with age, gender and gaming time."

