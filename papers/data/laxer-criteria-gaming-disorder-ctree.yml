in_brief: >-
  Not all nine criteria for Internet gaming disorder carry the same weight: withdrawal and loss of control matter most.
  In a decision-tree analysis of 3,222 Polish gamers, those who very often felt withdrawal and loss of control had a
  78% probability of disordered gaming, which questions the WHO&rsquo;s choice to leave withdrawal out of gaming
  disorder.

findings:
  - headline: "Withdrawal is the first and strongest split."
    text: >-
      In a conditional inference tree on the nine IGD criteria (<i>N</i> = 3,222), very frequent withdrawal symptoms
      divided gamers first: 32.46% of those reporting withdrawal &lsquo;very often&rsquo; were disordered gamers, against
      0.19% of the others (Pontes et al., 2019).
  - headline: "Withdrawal plus loss of control marks most disordered gamers."
    text: >-
      Gamers who very often experienced both withdrawal and loss of control had a 77.77% probability of disordered
      gaming; this &lsquo;impaired self-control&rsquo; pathway held 21 of the 31 disordered gamers (Pontes et al., 2019).
  - headline: "Four criteria carried the diagnostic information."
    text: >-
      Withdrawal, loss of control, negative consequences and preoccupation were the criteria that defined five gamer
      subtypes, from &lsquo;healthy&rsquo; (95% of gamers) to &lsquo;preoccupied&rsquo;, &lsquo;low risk&rsquo;,
      &lsquo;harmful&rsquo; and &lsquo;impaired self-control&rsquo; (Pontes et al., 2019).
  - headline: "The Polish IGDS9-SF works well."
    text: >-
      The Polish Internet Gaming Disorder Scale&ndash;Short-Form was unidimensional (CFI = 0.95, RMSEA = 0.04) and
      reliable (&alpha; = 0.82), and scores were higher in younger gamers, men and those who played more
      (Pontes et al., 2019).

glance:
  - { label: "Design", value: "Cross-sectional online survey (Qualtrics) of gamers recruited through the three largest Polish gaming forums (gry-online.pl, gamesboard.pl, gamesfanatic.pl) and their social media channels; no incentives" }
  - { label: "Participants", value: "3,377 gamers who had played in the past year (82.7% men; mean age 20, SD 4.3, range 12&ndash;49); 3,222 retained after excluding missing data" }
  - { label: "Measure", value: "Polish Internet Gaming Disorder Scale&ndash;Short-Form (IGDS9-SF; nine DSM-5 criteria, 1 = never to 5 = very often), back-translated and piloted with 52 gamers; a criterion counted as endorsed when answered &lsquo;very often&rsquo;" }
  - { label: "Disordered gaming", value: "Five or more of nine criteria endorsed: 31 gamers (0.96%)" }
  - { label: "Analysis", value: "MIMIC model with age, gender and weekly gaming time (FIML, 5,000 bootstrap samples) and a conditional inference tree (partykit, minimum split 50 cases), in R" }
  - { label: "Model fit", value: "&chi;&sup2;(51) = 407.48, CFI = 0.95, TLI = 0.94, RMSEA = 0.04, SRMR = 0.02; Cronbach&rsquo;s &alpha; = 0.82, composite reliability = 0.86" }

