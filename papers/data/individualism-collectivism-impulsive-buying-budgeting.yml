in_brief: >-
  Immigrants who value hierarchy, whether competing as individuals or deferring to their group, are the most open to
  global consumer culture, and that openness goes with more impulsive buying and poorer money budgeting. In 594
  immigrants living in the UK, the vertical rather than the individualist or collectivist side of people&rsquo;s values
  explained who acculturated to global consumer culture.

findings:
  - headline: "Vertical values drive acculturation to global consumer culture."
    text: >-
      Among 594 immigrants in the UK from 35 countries, vertical individualism (&beta; = 0.44) and vertical
      collectivism (&beta; = 0.30) were positively related to acculturation to global consumer culture; horizontal
      individualism was not (Czarnecka et al., 2020).
  - headline: "Global consumer culture goes with impulsive buying."
    text: >-
      Consumers more acculturated to global consumer culture reported more impulsive buying (&beta; = 0.60) and less
      money budgeting (&beta; = &minus;0.48) (Czarnecka et al., 2020).
  - headline: "Acculturation carries the effect of vertical values."
    text: >-
      Acculturation to global consumer culture mediated the links of vertical individualism with impulsive buying
      (indirect &beta; = 0.40) and money budgeting (&minus;0.21), and of vertical collectivism with impulsive buying
      (0.27) and money budgeting (&minus;0.14); the horizontal values showed no significant indirect effects
      (Czarnecka et al., 2020).
  - headline: "Younger consumers and women are more acculturated."
    text: >-
      Younger participants (&beta; = &minus;0.28) and women (&beta; = 0.18) were more acculturated to global consumer
      culture; length of stay in the UK made no difference (Czarnecka et al., 2020).

