question: >-
  Global consumer culture promotes spending, but people differ in how far they embrace it. Drawing on
  person-environment fit and acculturation theory, we asked whether immigrants whose cultural values fit global
  consumer culture are more likely to acculturate to it, and whether that acculturation leads to more impulsive buying
  and poorer money budgeting.

implications:
  practical: >-
    Consumer organisations and social marketers can target consumers highly acculturated to global consumer culture,
    and those with vertical values, with financial education and budgeting tools. Financial services providers can
    offer such consumers products that encourage budgeting and long-term planning, framing messages around individual
    achievement for vertical individualists and around the group for vertical collectivists.
  theoretical: >-
    It is the vertical&ndash;horizontal distinction, not individualism versus collectivism, that explains the acceptance
    of global consumer culture: accepting inequality between individuals or within groups goes with acculturation. The
    fit between values, acculturation and consumption behaviours supports person-environment fit theory in consumer
    research.

limitations:
  - "The cross-sectional, non-experimental design does not allow causal inference, and the survey was in English only."
  - "Immigrants are exposed at the same time to the host (British) culture and to global consumer culture, which are hard to separate."
  - "Future work could study other consumption behaviours and replicate the model in other countries."

faq:
  - q: "Does global consumer culture make people buy impulsively?"
    a: >-
      Among 594 immigrants in the UK, those more acculturated to global consumer culture reported more impulsive buying
      (&beta; = 0.60) and less money budgeting (&beta; = &minus;0.48) (Czarnecka et al., 2020).
  - q: "Which cultural values go with acculturation to global consumer culture?"
    a: >-
      Vertical individualism and vertical collectivism, the values that accept hierarchy between individuals or within
      groups; horizontal individualism did not (Czarnecka et al., 2020).
  - q: "What is acculturation to global consumer culture?"
    a: >-
      The extent to which people adopt the knowledge, skills and behaviours of a global consumer culture, measured by
      cosmopolitanism, exposure to global marketing and media, English use, social interactions, openness and
      self-identification with global consumer culture.
  - q: "Who is most acculturated to global consumer culture?"
    a: >-
      In this sample, younger people and women; how long immigrants had lived in the UK made no difference
      (Czarnecka et al., 2020).

concepts:
  - term: "Global consumer culture (GCC)"
    definition: "A Western-style culture of consumption spread by global brands, media and mobility."
  - term: "Acculturation to global consumer culture (AGCC)"
    definition: "How far an individual adopts the knowledge, skills and behaviours of global consumer culture (Durvasula &amp; Lysonski, 2015)."
  - term: "Vertical and horizontal individualism and collectivism"
    definition: "Cultural values that combine independence or interdependence with acceptance of hierarchy (vertical) or equality (horizontal)."
  - term: "Money budgeting"
    definition: "A tendency to plan, budget and use money carefully (Luna-Arocas &amp; Tang, 2004)."
  - term: "Person-environment fit"
    definition: "The degree of match between a person&rsquo;s characteristics and those of their environment."

