question: >-
  Brands now communicate on social media, but much of the brand content consumers see there is created by other
  consumers. Little was known about how these two sources, content the brand controls and content users generate,
  shape how consumers perceive brands, or whether the effects differ by industry. We asked how firm-created and
  user-generated social media communication influence consumers' perceptions and behaviour, overall and across
  industries.

implications:
  practical: >-
    Social media should complement traditional advertising rather than replace it. Brand posts work best when they
    build positive associations and attitudes, which then carry through to brand equity and purchase intention.
    Because consumers find other users' content more credible, managers should encourage it, listen to it and respond
    to it, and be ready to manage negative content on unregulated brand pages. Strategies that invite user content,
    as in the beverage brands studied, were linked to the strongest attitude effects.
  theoretical: >-
    The study separates firm-created from user-generated social media communication as distinct antecedents of
    consumer-based brand equity and brand attitude, and shows that user-generated content is the stronger of the two.
    Firm-created content reached brand equity only through brand attitude in the model, which points to attitude as
    the key mechanism for brand-controlled messages. The measurement model held across three industries and can be
    reused in other settings.

limitations:
  - "Only one platform (Facebook) and three industries were studied; communication differs across social media channels."
  - "The sample was Polish and mostly young, so results may not generalise to other cultures."
  - "Future research could include all leading platforms, more industries, social media advertising spend, and types of users such as prosumers and lead users."

faq:
  - q: "Does user-generated content affect brand equity?"
    a: >-
      Yes. In a survey of 504 Facebook users following 60 brands, user-generated social media communication increased
      both brand equity (&beta; = 0.24) and brand attitude (&beta; = 0.29) (Schivinski &amp; Dabrowski, 2016).
  - q: "Does a brand's own social media content increase brand equity?"
    a: >-
      Not directly. Firm-created social media communication improved brand attitude (&beta; = 0.38) but had no
      significant direct effect on brand equity (&beta; = &minus;0.04, <i>p</i> = .45) (Schivinski &amp; Dabrowski, 2016).
  - q: "Is brand attitude or brand equity more important for purchase intention on social media?"
    a: >-
      Brand attitude. Its effect on purchase intention (&beta; = 0.60) was almost twice that of brand equity
      (&beta; = 0.32) (Schivinski &amp; Dabrowski, 2016).
  - q: "Do the effects of social media communication differ by industry?"
    a: >-
      The model held across non-alcoholic beverages, clothing and mobile network operators, but brand attitude had a
      stronger effect on brand equity and purchase intention for non-alcoholic beverage brands (Schivinski &amp;
      Dabrowski, 2016).

concepts:
  - term: "Firm-created social media communication"
    definition: "Brand content on social media that the company creates and fully controls, treated in the study as a form of advertising."
  - term: "User-generated social media communication"
    definition: "Brand-related content created by consumers, outside the company's control."
  - term: "Consumer-based brand equity"
    definition: "The added value consumers attach to a branded product compared with an unbranded one with the same characteristics; measured with the overall brand equity scale of Yoo and Donthu (2001)."
  - term: "Brand attitude"
    definition: "A consumer's overall evaluation of a brand."
  - term: "Measurement invariance"
    definition: "Evidence that a measurement model works the same way across groups, here three industries, so that comparisons between them are meaningful."

