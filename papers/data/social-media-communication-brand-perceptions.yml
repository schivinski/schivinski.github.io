in_brief: >-
  What consumers post about a brand on Facebook raised both brand equity and brand attitude, while what the brand
  posted itself improved attitudes only. In a survey of 504 Facebook users following 60 brands, brand attitude was
  the strongest route to purchase intention.

findings:
  - headline: "User-generated content builds brand equity and brand attitude."
    text: >-
      In a survey of 504 Facebook users in Poland who followed 60 brands, user-generated social media communication
      had positive effects on brand equity (&beta; = 0.24, <i>p</i> &lt; .001) and on brand attitude
      (&beta; = 0.29, <i>p</i> &lt; .001) (Schivinski &amp; Dabrowski, 2016).
  - headline: "Firm-created content shapes attitudes, not brand equity."
    text: >-
      Social media communication created by the brand itself improved brand attitude (&beta; = 0.38,
      <i>p</i> &lt; .001) but had no significant effect on brand equity (&beta; = &minus;0.04, <i>p</i> = .45)
      (Schivinski &amp; Dabrowski, 2016).
  - headline: "Brand attitude is the main route to purchase intention."
    text: >-
      Brand attitude increased brand equity (&beta; = 0.62) and purchase intention (&beta; = 0.60), and brand
      equity increased purchase intention (&beta; = 0.32), all <i>p</i> &lt; .001; the effect of brand attitude on
      purchase intention was almost twice that of brand equity (Schivinski &amp; Dabrowski, 2016).
  - headline: "The model works across industries, with differences in strength."
    text: >-
      The measurement model was equivalent across non-alcoholic beverages, clothing and mobile network operators
      (&Delta;CFI = 0.000); &chi;&sup2; difference tests showed that brand attitude had a stronger effect on brand
      equity for non-alcoholic beverages, where it was also the strongest driver of purchase intention
      (Schivinski &amp; Dabrowski, 2016).

