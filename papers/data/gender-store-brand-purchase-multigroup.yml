in_brief: >-
  Women and men buy a discount chain&rsquo;s own brands for partly different reasons. In a survey of 582 Polish
  shoppers about Biedronka&rsquo;s store brands, perceived risk weighed more on women&rsquo;s purchase intentions, while
  the brands&rsquo; low prices and value counted for more with men.

findings:
  - headline: "A better store image lowers the risk shoppers see in store brands."
    text: >-
      For both women and men, store image (layout and service) reduced the perceived functional and financial risk of
      the chain&rsquo;s store brands; the standardised effect was larger for women (&minus;0.51) than for men
      (&minus;0.40) (Schivinski &amp; Łukasik, 2014).
  - headline: "Price image matters more to men."
    text: >-
      A favourable price image of store brands (low relative prices and perceived benefits) reduced perceived risk more
      for men (&minus;0.44 vs &minus;0.32) and raised purchase intention more for men (0.42 vs 0.32) than for women
      (Schivinski &amp; Łukasik, 2014).
  - headline: "Perceived risk holds back purchase intention, especially for women."
    text: >-
      Store brand perceived risk lowered the intention to buy store brands in both groups, slightly more for women
      (&minus;0.60) than for men (&minus;0.55) (Schivinski &amp; Łukasik, 2014).
  - headline: "The structural paths were not equivalent across gender."
    text: >-
      The measurement model was equivalent for women and men, but chi-square difference tests showed that each of the
      four structural paths differed between the groups (Schivinski &amp; Łukasik, 2014).

glance:
  - { label: "Design", value: "Nationwide online survey (CAWI) of Polish consumers about the store brands of the Biedronka discount chain; one respondent per computer" }
  - { label: "Participants", value: "582 valid questionnaires from 652 respondents: 323 women and 259 men" }
  - { label: "Measures", value: "7-point Likert scales, translated by collaborative and iterative translation: store image (layout, service; 8 items), store brand perceived risk (functional, financial; 7 items), store brand price image (relative price level, perceived benefits; 7 items) and purchase intention (5 items)" }
  - { label: "Analysis", value: "EFA, CFA and multigroup structural equation modelling in AMOS 21.0: partial invariance (chi-square difference) tests and critical ratio of differences tests between women and men" }
  - { label: "Language", value: "The article is in Polish, with an English summary. The tables and items on this page are translated from Polish." }

