question: >-
  Store brands are a growing share of European retail, yet little was known about how women and men differ when they
  buy them. We asked whether the effects of store image and store brand price image on store brand perceived risk, and
  of price image and perceived risk on purchase intention, differ between women and men.

implications:
  practical: >-
    For women, retailers should stress store attractiveness, a clear layout, easy navigation and customer service, and
    work to reduce the functional and financial risk of their own brands. For men, communication should stress the
    relative price advantage of store brands and the benefits of buying them.
  theoretical: >-
    The study tests a model of store image, price image, perceived risk and purchase intention for store brands across
    gender with multigroup SEM, combining chi-square difference tests with critical ratio of differences tests to
    describe the size of the differences.

limitations:
  - "Single retailer: all items referred to the store brands of the Biedronka discount chain."
  - "Polish consumers only, surveyed online."
  - "The critical ratios of the differences between women and men were small (|<i>z</i>| &le; 0.55 in Table 3), so the differences in the size of the effects are descriptive."

faq:
  - q: "Do women and men buy store brands for different reasons?"
    a: >-
      In 582 Polish shoppers, perceived risk weighed more on women&rsquo;s intentions to buy a discount chain&rsquo;s
      own brands, while price image counted for more with men (Schivinski &amp; Łukasik, 2014).
  - q: "How can retailers reduce the risk consumers see in store brands?"
    a: >-
      A better store image (layout and service) and a favourable price image both lowered the perceived functional
      and financial risk of store brands (Schivinski &amp; Łukasik, 2014).
  - q: "Is this article available in English?"
    a: >-
      The article is in Polish, with an English summary. This page summarises it in English, with the tables and scale
      items translated.

concepts:
  - term: "Store brand"
    definition: "A brand owned and sold by a retail chain (also called a private label)."
  - term: "Store brand price image"
    definition: "Consumers&rsquo; view of store brand prices, here the relative price level and the perceived benefits of buying store brands (Diallo, 2012)."
  - term: "Multigroup analysis"
    definition: "Estimating the same structural equation model in several groups and testing whether its parameters are equal across them."

