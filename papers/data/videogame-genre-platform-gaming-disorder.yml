figures:
  - file: figures/marengo-et-al-2026-design.svg
    title: "Figure 1. How the analytic sample was built and what was measured"
    caption: >-
      Drawn from the article's Methods. The survey was advertised through the Electronic Sports League from 2019;
      only pre-COVID-19 responses from 2019 were included. Exclusions removed implausible ages and playing times,
      invented game titles, non-gamers, entries that could not be matched to the RAWG database, and 74 duplicates.
  - file: figures/marengo-et-al-2026-gd-by-device.svg
    title: "Figure 2. Mean gaming disorder scores by preferred device, under both frameworks"
    caption: >-
      Values from Table 2 of the article. Both instruments use a 1 to 5 response scale, and the axis starts at the
      scale minimum. Desktop and laptop gamers did not differ from each other on either measure; both scored higher
      than console gamers. Kruskal–Wallis tests: IGDS9-SF χ²(3) = 706.65, GDT χ²(3) = 999.33, both p &lt; .001.
  - file: figures/marengo-et-al-2026-genres-by-device.svg
    title: "Figure 3. Preferred game genres by device"
    caption: >-
      Model-estimated marginal percentages from Table 2 of the article, for the 17 genres retained in the analyses.
      Console gamers were more likely to prefer action, adventure, fighting, platformer, shooter and sports games;
      desktop and laptop gamers preferred multiplayer, massively multiplayer, indie and role-playing games; small-device
      gamers showed the highest prevalence of arcade, card, casual and puzzle games.

question: >-
  Gaming disorder is recognised by the World Health Organization in the ICD-11 and included as a condition for
  further study by the American Psychiatric Association in the DSM-5, but the two frameworks differ in scope and
  emphasis. Earlier studies of which games are associated with disordered gaming disagree with one another, point
  to different high-risk genres, and rarely examine genre, multiplayer capability and device preference together.
  It was therefore unclear whether game characteristics relate to gaming disorder in the same way under both
  frameworks, and how much of an individual's risk such characteristics can account for.

implications:
  practical: >-
    Prevention and ethical design efforts can be directed at the features most consistently associated with
    disordered gaming, in particular multiplayer and massively multiplayer environments, which combine social
    reinforcement, persistent worlds and few natural stopping points. At the same time, the weak predictive accuracy
    argues against screening or profiling individual players on the basis of the genre or platform they prefer:
    these variables describe groups, not people. Because preferences differ sharply by device, prevention messages
    and platform-level safeguards may need to be tailored to console, computer and mobile audiences separately.
  theoretical: >-
    The study shows that the WHO and APA frameworks yield highly similar patterns of association with game-related
    variables, supporting their convergent validity despite differing criteria. It also indicates that broad
    industry genre labels and a binary multiplayer indicator are too coarse to capture the psychologically relevant
    properties of games, and that future work should examine specific structural characteristics and mechanics, such
    as avatar customisation and virtual simulation elements, in interaction with individual traits.

limitations:
  - "All measures were self-reported, including the favourite game and weekly playing time; objective behavioural data would give a more detailed picture of gaming behaviour."
  - "Multiplayer status was taken from RAWG tags as a broad yes/no indicator, so games designed around multiplayer interaction were not distinguished from games in which multiplayer is optional or secondary."
  - "Genre categories come from an industry database rather than a theoretical taxonomy, and the same game can fall into several genres, which limits how precisely genre-related associations can be interpreted."
  - "The sample was predominantly male (92.9%) and recruited through gaming-focused platforms and the ESL portal, which may have reduced participation among casual gamers; the data are also cross-sectional and were collected in 2019."
  - "Future research should use more granular classifications of multiplayer configurations, more balanced samples, longitudinal and clinical designs, and should examine structural features that cut across genres alongside personality traits."

faq:
  - q: "Are multiplayer games associated with gaming disorder?"
    a: >-
      Yes, modestly. In 116,047 gamers, preferring a game with multiplayer features was associated with higher gaming
      disorder scores under both the APA and the WHO frameworks (<em>r</em><sub>rb</sub> = .11 in both cases), and the
      association was strongest among console gamers (Marengo et al., 2026).
  - q: "Which game genres are linked to lower gaming disorder tendencies?"
    a: >-
      Puzzle games (<em>r</em><sub>rb</sub> = −.17 under both frameworks), platformer games (−.14 APA, −.15 WHO) and,
      among small-device users, board games (−.28 on the WHO measure) were all associated with lower scores
      (Marengo et al., 2026).
  - q: "Do PC gamers show more gaming disorder symptoms than console or mobile gamers?"
    a: >-
      On average, slightly. Desktop and laptop gamers scored 2.03 on the APA measure and 2.28 on the WHO measure,
      against 1.92 and 2.12 for console gamers and 1.99 and 2.24 for small-device gamers, on 1 to 5 scales. The
      differences were statistically reliable in a sample of this size but small, and are best read as emerging
      patterns rather than clinically decisive effects (Marengo et al., 2026).
  - q: "Can gaming disorder risk be predicted from the games someone plays?"
    a: >-
      Not at the level of the individual. Random Forest models using all genre tags and the multiplayer indicator
      achieved correlations between predicted and observed scores of only .14 (APA) and .15 (WHO), falling to .08
      among small-device users (Marengo et al., 2026).
  - q: "Do the WHO and APA frameworks give the same answers about game preferences?"
    a: >-
      Yes. The two instruments correlated strongly (ρ = .71) and produced highly similar patterns of association with
      genre, multiplayer capability and device, which supports their convergent validity (Marengo et al., 2026).
  - q: "What games do console, computer and mobile gamers prefer?"
    a: >-
      Console gamers most often preferred action (78.46%), adventure (31.44%), shooter (36.14%), sports (9.13%) and
      fighting games (5.70%); desktop and laptop gamers preferred massively multiplayer (29.99% and 25.28%),
      role-playing (43.03% and 45.89%), indie and strategy games; small-device gamers showed the highest prevalence of
      arcade (11.18%), casual (10.97%), card (5.40%) and puzzle games (3.65%) (Marengo et al., 2026).

concepts:
  - term: "Gaming disorder (WHO, ICD-11)"
    definition: "A pattern of gaming behaviour marked by impaired control over gaming, increasing priority given to gaming over other activities, and continuation despite negative consequences, with significant impairment in important areas of functioning."
  - term: "Internet gaming disorder (APA, DSM-5)"
    definition: "A condition proposed for further study in the DSM-5, indicated when five or more of nine criteria, such as preoccupation, withdrawal, tolerance and loss of control, are met over a 12-month period."
  - term: "Multiplayer capability"
    definition: "Whether a game includes features allowing play with or against other people. Here it is a binary indicator taken from the RAWG database, which does not distinguish multiplayer-by-design titles from games where multiplayer is optional."
  - term: "Game genre"
    definition: "A broad grouping of games by shared themes, mechanics and player expectations. The article treats genre as a pragmatic descriptive framework rather than a precise analytical unit, and takes the labels from an external industry database to limit researcher discretion."
  - term: "Rank-biserial correlation (Somers' D)"
    definition: "A non-parametric measure of association between a binary variable, such as whether a game is tagged multiplayer, and an ordinal or non-normally distributed outcome, such as a gaming disorder score."
  - term: "Random Forest"
    definition: "A machine-learning method that combines many decision trees. It can capture non-linear relationships and interactions between predictors without the analyst specifying them in advance, and here was used to test how much of the gaming disorder score genre and multiplayer tags can account for."

