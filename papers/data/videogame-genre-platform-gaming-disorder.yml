in_brief: >-
  In 116,047 gamers worldwide, the games people preferred were related to their gaming disorder tendencies in the
  same way under both the WHO and the APA diagnostic frameworks: multiplayer titles and desktop or laptop play went
  with higher scores, while puzzle and platformer preferences went with lower ones. The associations were consistent
  but small, and genre and multiplayer tags predicted individual scores poorly, so game characteristics explain only
  a limited part of gaming disorder risk.

findings:
  - headline: "Multiplayer capability was the most consistent game-related correlate."
    text: >-
      Across 116,047 gamers, preferring a game with multiplayer features was positively associated with gaming
      disorder tendencies under both frameworks (<em>r</em><sub>rb</sub> = .11 for the APA measure and .11 for the
      WHO measure) (Marengo et al., 2026).
  - headline: "Puzzle and platformer preferences pointed the other way."
    text: >-
      A preference for puzzle games (<em>r</em><sub>rb</sub> = −.17 under both frameworks) and platformer games
      (−.14 APA, −.15 WHO) was negatively associated with gaming disorder tendencies in the overall sample
      (Marengo et al., 2026).
  - headline: "Computer gamers scored higher than console and mobile gamers."
    text: >-
      Participants preferring desktop or laptop computers reported higher gaming disorder scores (both 2.03 on the
      APA measure and 2.28 on the WHO measure) than those preferring consoles (1.92 and 2.12) or small devices
      (1.99 and 2.24), with all differences small in size (Marengo et al., 2026).
  - headline: "Among console gamers, shooters and casual games also mattered."
    text: >-
      Within the console subgroup, gaming disorder tendencies were positively associated with multiplayer
      (<em>r</em><sub>rb</sub> = .11 APA, .12 WHO), massively multiplayer (.11, .09), casual (.11, .11) and shooter
      (.11, .10) game preferences (Marengo et al., 2026).
  - headline: "Game characteristics predicted individual scores poorly."
    text: >-
      Random Forest models using all genre tags and the multiplayer indicator reached a correlation between
      predicted and observed scores of only <em>R</em> = .14 (APA) and .15 (WHO) overall, falling to .08 and .10
      among small-device users (Marengo et al., 2026).
  - headline: "Game preferences differed sharply by device."
    text: >-
      82.00% of desktop gamers preferred a game with multiplayer features against 65.99% of small-device gamers;
      shooters were preferred by 36.14% of console gamers and 16.68% of small-device gamers; strategy games by
      3.99% of console gamers and 34.74% of laptop gamers (Marengo et al., 2026).
  - headline: "Older and more educated gamers preferred cognitively oriented genres."
    text: >-
      Age was positively associated with preferring board (<em>r</em><sub>rb</sub> = .315), card (.195), puzzle
      (.191), adventure (.189) and role-playing games (.158), and negatively with arcade (−.302), multiplayer
      (−.202), action (−.178) and shooter games (−.176); education level followed the same pattern
      (Marengo et al., 2026).
  - headline: "The two diagnostic frameworks converged."
    text: >-
      The IGDS9-SF and the GDT correlated strongly with each other (Spearman ρ = .71, <em>p</em> &lt; .001) and
      produced highly similar patterns of association with every game characteristic examined (Marengo et al., 2026).

glance:
  - { label: "Design", value: "Cross-sectional online survey run in 2019 as part of the Electronic Sports League's \"Smart Gaming\" campaign, with no financial incentive and personalised feedback on gaming behaviour for participants" }
  - { label: "Participants", value: "116,047 gamers (92.9% male; mean age 24.12, SD = 7.44, range 12–80; 23.34 hours of gaming per week), retained from 188,775 initial responses across 181 countries" }
  - { label: "Game characteristics", value: "Each participant's favourite game, entered as free text, was matched to the RAWG database (over 618,000 games) for genre tags and a binary multiplayer indicator; preferred device was self-reported (desktop 57.0%, console 27.1%, laptop 12.3%, mobile 3.5%)" }
  - { label: "Outcomes", value: "Gaming disorder tendencies measured twice: the Internet Gaming Disorder Scale–Short-Form (IGDS9-SF, nine DSM-5 criteria, α = .83) and the Gaming Disorder Test (GDT, four ICD-11 criteria, α = .76)" }
  - { label: "Analysis", value: "Rank-biserial correlations (Somers' D), Spearman correlations, Phi coefficients, Kruskal–Wallis tests and binomial generalized linear models with Bonferroni-corrected comparisons (SPSS 23); Random Forest regression with 100 trees and out-of-bag accuracy (WEKA 3.8.6)" }

