question: >-
  Research has documented which city attributes matter and that cities use social media, but little was known about
  how a city&rsquo;s attributes translate into residents&rsquo; engagement with it online, or whether brand coolness,
  well studied for product brands, works the same way for places. We asked whether residents&rsquo; perception that
  their city is cool explains how physical attributes, functional attributes and the city&rsquo;s personality
  (individual and social value) lead to cognitive, emotional and behavioural engagement on social media.

implications:
  practical: >-
    City governments and place marketers should treat city attributes as signals that together build a cool image,
    then use that image to drive engagement. Physical attributes work through authenticity, for example by branding
    historic or artistic districts as cultural hubs; functional attributes by presenting efficient services and
    infrastructure as evidence of a progressive, innovative city; and personality by offering residents ways to express
    themselves and a sense of community through festivals and local projects. Interactive content such as gamified
    apps or virtual tours suits cognitive engagement, and campaigns that invite residents to share their own &lsquo;cool
    city&rsquo; moments with a hashtag suit behavioural engagement. Coolness should not be relied on to build love for a
    city: emotional bonds call for strategies built on personal memories, shared heritage and social ties.
  theoretical: >-
    The study extends brand coolness from products to places, showing that physical, functional, individual and
    social attributes of a city combine into one perception of coolness. It identifies coolness as a psychological
    mechanism that turns city attributes into cognitive and behavioural engagement on social media, rather than
    assuming a direct link between attributes and engagement. The absence of effects on emotional engagement separates
    coolness, a perception of being trendy and desirable, from affective place attachment.

limitations:
  - "The data are self-reported and cross-sectional, so causal relationships and change over time cannot be established."
  - "The sample comes from one country, Saudi Arabia, during the rapid state-led development of Vision 2030; the survey was in English and recruited online, which may have favoured more educated and affluent residents."
  - "Future research could test the model in Western cities, where branding is often more bottom-up, run cross-cultural comparisons, and examine how the four dimensions of coolness (usefulness, high status, popularity and subculture) work individually."

faq:
  - q: "What makes a city seem cool to its residents?"
    a: >-
      In a survey of 537 residents of Saudi cities, functional attributes such as jobs, transport, safety, government
      and cultural events had the largest effect on perceived city brand coolness (&beta; = 0.42), followed by
      individual value (0.31), social value (0.26) and physical attributes such as weather, scenery and architecture
      (0.09) (Schivinski et al., 2026).
  - q: "Does a cool city brand increase engagement on social media?"
    a: >-
      Yes, for attention and action. Perceived coolness increased residents&rsquo; cognitive engagement with their city
      on social media (&beta; = 0.62) and behavioural engagement such as liking, sharing and posting (&beta; = 0.54), but
      not emotional engagement (Schivinski et al., 2026).
  - q: "Is a cool city also a loved city?"
    a: >-
      Not necessarily. Coolness had no significant effect on emotional engagement (&beta; = &minus;0.24, <i>p</i> = .17),
      and none of the city attributes affected emotional engagement through coolness; emotional engagement was linked
      directly to physical attributes (&beta; = 0.30) (Schivinski et al., 2026).
  - q: "How can city marketers use coolness on social media?"
    a: >-
      By curating physical, functional and personality attributes as signals of coolness, using interactive content
      such as gamified apps or virtual tours to hold attention, and inviting residents to create and share their own
      content about the city to drive behavioural engagement (Schivinski et al., 2026).

concepts:
  - term: "City branding aspects"
    definition: "The components through which a city is branded: physical attributes (weather, scenery, historical sites, architecture), functional attributes (jobs, transport, government, safety, cultural events) and personality traits, measured here as individual and social value."
  - term: "Perceived city brand coolness"
    definition: "The extent to which residents see their city as attractive, desirable and cool; modelled as a second-order factor of usefulness, high status, popularity and subculture."
  - term: "City-related social media engagement"
    definition: "Residents&rsquo; engagement with their city on social media, in three forms: cognitive (attention and absorption), emotional (feelings and attachment) and behavioural (following, liking, commenting, sharing and creating content)."
  - term: "Individual and social value"
    definition: "The city&rsquo;s personality as experienced by residents: individual value is personal satisfaction and meaning from living there; social value is the importance of how others see the city and its residents."
  - term: "Indirect-only mediation"
    definition: "A pattern in which an attribute affects engagement only through the mediator (coolness), with no significant direct or total effect."

