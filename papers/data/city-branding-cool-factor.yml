in_brief: >-
  Residents who see their city as cool pay more attention to it on social media and interact with it more, but they
  do not engage with it more emotionally. In a survey of 537 residents of Saudi cities who follow their city online, a
  city&rsquo;s functional attributes, such as jobs, transport, safety and public services, did most to make it seem cool.

findings:
  - headline: "Functional attributes do most to make a city seem cool."
    text: >-
      In a survey of 537 residents of Saudi Arabian cities who follow their city on social media, all four city branding
      aspects raised perceived city brand coolness: functional attributes (&beta; = 0.42), individual value (0.31) and
      social value (0.26), all <i>p</i> &le; .001, and physical attributes (0.09, <i>p</i> = .04)
      (Schivinski et al., 2026).
  - headline: "A cool city drives attention and action on social media."
    text: >-
      Perceived city brand coolness increased cognitive engagement (&beta; = 0.62) and behavioural engagement
      (&beta; = 0.54), both <i>p</i> &le; .001, such as reading, liking, sharing and posting about the city, but not
      emotional engagement (&beta; = &minus;0.24, <i>p</i> = .17) (Schivinski et al., 2026).
  - headline: "Coolness carries every city attribute through to engagement."
    text: >-
      All four aspects had significant indirect effects through coolness on cognitive engagement (functional 0.26, 95%
      CI [0.12, 0.51]; individual value 0.19; social value 0.16; physical 0.05) and on behavioural engagement
      (functional 0.23, 95% CI [0.09, 0.45]; individual value 0.17; social value 0.14; physical 0.04), with every
      confidence interval excluding zero (Schivinski et al., 2026).
  - headline: "A cool city is not necessarily a loved city."
    text: >-
      None of the indirect effects on emotional engagement was significant (for example functional attributes
      &minus;0.10, 95% CI [&minus;0.28, 0.02]); emotional engagement was instead linked directly to the city&rsquo;s
      physical attributes (&beta; = 0.30, <i>p</i> &lt; .001) (Schivinski et al., 2026).
  - headline: "Social value matters most for paying attention to the city online."
    text: >-
      Social value, how much residents care about what others think of their city and its residents, had the largest
      total effect on cognitive engagement (&beta; = 0.67, <i>p</i> &le; .001), partly through coolness and mostly
      directly (&beta; = 0.51) (Schivinski et al., 2026).

glance:
  - { label: "Design", value: "Cross-sectional online survey (Qualtrics); covariance-based structural equation modelling in Mplus 8.3 with a robust maximum likelihood (MLM) estimator; indirect effects tested with 5,000 bias-corrected bootstrap resamples" }
  - { label: "Participants", value: "537 residents of Saudi Arabian cities who actively follow their city on social media (55.3% women; 50.6% aged 25&ndash;34), recruited over four weeks through social media channels and forums; survey in English" }
  - { label: "City branding aspects", value: "Physical attributes (4 items; Merrilees et al., 2009), functional attributes (5 items; Shen et al., 2019), and personality traits measured as individual value (3 items) and social value (4 items; Hennigs et al., 2012)" }
  - { label: "Mediator", value: "Perceived city brand coolness: a second-order factor of usefulness (4 items), high status (4), popularity (3) and subculture (4), adapted from Loureiro et al. (2020)" }
  - { label: "Outcomes", value: "Cognitive (5 items; Dessart et al., 2016), emotional (4 items; Harrigan et al., 2017) and behavioural (11 items; Schivinski et al., 2016) engagement with the city on social media; 5-point scales; age and gender as controls" }
  - { label: "Model fit", value: "Measurement model MLM&chi;&sup2;(1031) = 1887.19, CFI = 0.92, TLI = 0.91, RMSEA = 0.03, SRMR = 0.04; structural model ML&chi;&sup2;(1061) = 2070.62, CFI = 0.91, TLI = 0.90, RMSEA = 0.04, SRMR = 0.05" }

