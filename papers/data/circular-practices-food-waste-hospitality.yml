  - id: "6"
    title: "Challenges in research agenda themes to guide future studies"
    columns: ["Research agenda theme", "Research challenges"]
    align: ["left", "left"]
    rows:
      - ["Theme 1: Increase the scope of food waste research", "Developing innovative study models to evaluate practices aimed at preventing food waste, to be applied and tested in diverse contexts. Conducting balanced comparative studies in both developed and less developed settings to ascertain the impact of circular practices on food waste reduction. Identifying context-specific factors that influence or impede food waste, thereby establishing a benchmark for comparative analyses with analogous countries."]
      - ["Theme 2: Expanding the use of mediators and moderators", "Developing research models incorporating theoretical or practical input from different disciplines to expand understanding of circular practices and food waste. Analysing the food waste system to identify circular practices utilised in addressing food waste. Determining the necessary parameters for implementing circular practices to mitigate food waste, thereby guiding the implementation of these practices to achieve optimal results."]
      - ["Theme 3: Enhance the evaluation of strategies to mitigating food waste", "Developing comprehensive study models, including actual implementation in hospitality contexts, to determine the relationship between circular practices and food waste. Retrieving the outcomes and insights from applying circular practices to reduce food waste to guide future applications and identify potential areas for improvement. Identifying the antecedents and consequences derived from the application of circular practices to assist the development of food waste reduction strategies."]
      - ["Theme 4: Broadening the use of theories to conduct research", "Undertaking comprehensive system wide studies using a flexible theoretical framework to better understand food waste and develop effective strategies to tackle it. To identify elements of the food waste hierarchy that present the greatest opportunities for substantive change. Examining apposite theories to explore inter-multi-cross-disciplinary elements of food waste behaviour within the food waste system. Developing measurement and well-founded theoretical frameworks that can be sued to predict and influence food waste behaviours in multiple levels of the food waste system and the food waste hierarchy."]
