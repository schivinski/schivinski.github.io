in_brief: >-
  Research on cutting food waste in restaurants, hotels and other hospitality businesses has grown fast since 2020 and
  shows that circular practices work, but it concentrates on preventing, minimising and recycling waste and rarely
  explains what drives customers to take part. This review of 51 studies maps the field and sets a research agenda.

findings:
  - headline: "Research on circular food waste practices in hospitality is recent."
    text: >-
      Of 51 studies published between 2014 and August 2023, 48 (94.1%) appeared from 2020 onwards, mostly in Q1
      journals (84.3%), with Sustainability (9) and British Food Journal (6) publishing the most (Cardenas et al.,
      2024).
  - headline: "Circular practices reduce food waste and encourage sustainable customer behaviour."
    text: >-
      Practices such as smaller portions, menu planning, nudges, visual reminders, upcycled food, take-away of
      leftovers and food redistribution reduce food waste; one communication intervention cut food waste by 30%
      (Cardenas et al., 2024).
  - headline: "Most research targets prevention, minimisation and recycling."
    text: >-
      Mapped onto the food waste hierarchy, the studies focus on preventing, minimising and recycling food waste, while
      reusing, recovery and disposal practices receive far less attention (Cardenas et al., 2024).
  - headline: "Who wastes food in hospitality differs by age, income and other traits."
    text: >-
      Younger, lower-educated, higher-income, single and travelling customers tend to waste more food, while
      perceived behavioural control and social norms help customers reduce plate waste (Cardenas et al., 2024).
  - headline: "Theory is used in only 37% of the studies."
    text: >-
      Nineteen of the 51 studies used a theory, most often the theory of planned behaviour (7 studies); the review
      calls for broader theories, more explanatory research and studies in less-developed countries (Cardenas et al.,
      2024).

glance:
  - { label: "Design", value: "Systematic literature review following PRISMA, with the SPIDER framework and conventional content analysis" }
  - { label: "Search", value: "Nine databases (ProQuest, EBSCOhost, Scopus, Web of Science, Google Scholar, Emerald, Wiley, Sage, Taylor &amp; Francis); studies from 1 January 2014 to 22 August 2023" }
  - { label: "Screening", value: "4,704 records; 1,350 duplicates removed; 3,354 screened by title and abstract; 69 full texts assessed; 51 studies included" }
  - { label: "Analysis", value: "Profile of the studies (year, journal, country, establishment, design, research type) and eight themes, classified by the six levels of the food waste hierarchy" }

question: >-
  The hospitality sector produces about a quarter of global food waste, much of it avoidable, and SDG 12.3 aims to
  halve retail and consumer food waste by 2030. Circular practices aim to prevent and reduce waste and keep food in
  use. We asked what research exists on circular practices regarding food waste in hospitality, what it covers, which
  practices and theories it uses, and what future research should address.

implications:
  practical: >-
    Hospitality managers can choose practices along the food waste hierarchy, tailor interventions to customers&rsquo;
    socio-demographic and psychosocial characteristics, communicate circular practices such as upcycled food and menu
    planning to customers, and build a culture of sustainability through committed leadership, which also cuts costs.
  theoretical: >-
    The review organises the evidence by the food waste hierarchy, shows where research is missing (reuse, recovery,
    disposal; less-developed countries; explanatory designs) and proposes a four-theme research agenda with mediators,
    moderators, theories and evaluation strategies.

limitations:
  - "The search across nine databases may have missed relevant studies, including those not in English."
  - "Grey literature was excluded."
  - "The authors describe the review&rsquo;s scope as concentrated in developed nations, which may limit its applicability to less-developed contexts."

faq:
  - q: "What are circular practices for food waste in hospitality?"
    a: >-
      Practices that prevent, minimise, reuse, recycle, recover or dispose of food waste, such as menu planning,
      portion control, creative use of ingredients, redistributing surplus food, and composting (Cardenas et al., 2024).
  - q: "Do circular practices reduce food waste in restaurants and hotels?"
    a: >-
      Yes. A systematic review of 51 studies found that circular practices reduce food waste and encourage sustainable
      behaviour among customers (Cardenas et al., 2024).
  - q: "Which customers waste more food when eating out?"
    a: >-
      The studies reviewed suggest that younger customers, those with less education, higher incomes, single people
      and tourists tend to waste more food (Cardenas et al., 2024).
  - q: "What theories are used to study food waste in hospitality?"
    a: >-
      Only 37% of the 51 studies used a theory, most often the theory of planned behaviour; others include norm
      activation theory, social cognitive theory and institutional theory (Cardenas et al., 2024).

concepts:
  - term: "Circular economy"
    definition: "An economic model with a regenerative aim that keeps resources in use and prevents waste, rather than producing, using and discarding."
  - term: "Food waste hierarchy"
    definition: "A ranking of food waste practices from most to least preferred: prevention, minimisation, reusing, recycling, recovery and disposal (European Commission, 2017)."
  - term: "Plate waste"
    definition: "Food served to customers that is left uneaten and thrown away."
  - term: "Systematic literature review"
    definition: "A review that identifies, screens and synthesises all studies on a question through an explicit, reproducible search and selection procedure."

