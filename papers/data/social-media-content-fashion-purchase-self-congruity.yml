in_brief: >-
  A fashion brand's own posts build brand equity for every follower, but posts by other users do so only for people
  who see themselves in the brand. In a survey of 622 US social media users who followed a fashion brand, brand equity
  carried part of the effect of both kinds of content, and self-congruity amplified only the user-generated route.

findings:
  - headline: "Brand equity carries part of the effect of social media content on purchase intention."
    text: >-
      In a survey of 622 US social media users who followed a fashion brand, firm-created content increased
      consumer-based brand equity (&beta; = 0.59) and user-generated content did too (&beta; = 0.45); brand equity in
      turn raised purchase intention, giving significant indirect effects of 0.13 for both content types (95% CI
      [0.06, 0.20] and [0.06, 0.21]) (Schivinski et al., 2022).
  - headline: "Firm-created content also works directly, and more strongly than user-generated content."
    text: >-
      With brand equity in the model, the direct effect on purchase intention was 0.51 for firm-created content and
      0.31 for user-generated content (both <i>p</i> &lt; .001); the total effects were 0.64 and 0.44
      (Schivinski et al., 2022).
  - headline: "User-generated content builds brand equity only for consumers who identify with the brand."
    text: >-
      The effect of user-generated content on brand equity was not significant at low self-congruity
      (&beta; = 0.09, 95% CI [&minus;0.06, 0.25]), but rose to 0.29 at average and 0.49 at high self-congruity
      (interaction &beta; = 0.32, <i>p</i> &lt; .001); the index of moderated mediation was 0.07 (95% CI [0.01, 0.14])
      (Schivinski et al., 2022).
  - headline: "Firm-created content works regardless of self-congruity."
    text: >-
      The indirect effect of firm-created content on purchase intention through brand equity was significant at low
      (0.12), average (0.10) and high (0.08) self-congruity, and the index of moderated mediation was not significant
      (&minus;0.03, 95% CI [&minus;0.07, 0.01]) (Schivinski et al., 2022).
  - headline: "Self-congruity did not change the direct effect of either content type on purchase intention."
    text: >-
      The interaction of content type and self-congruity on purchase intention was not significant for firm-created
      (&beta; = 0.01, <i>p</i> = .85) or user-generated content (&beta; = &minus;0.03, <i>p</i> = .54); self-congruity
      worked through brand equity (Schivinski et al., 2022).

