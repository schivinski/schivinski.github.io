question: >-
  Fashion brands now mix their own posts with content created by users and influencers, and consumers use fashion to
  express who they are. Earlier research showed that both kinds of social media content shape brand perceptions and
  purchase intentions, but little was known about how individual differences change these effects. Drawing on
  self-congruity theory, we asked whether brand equity carries the effect of firm-created and user-generated content on
  the intention to buy fashion products, and whether this depends on how closely the brand matches the consumer's
  self-image.

implications:
  practical: >-
    Fashion brands can keep relying on their own posts, ideally across several channels: firm-created content raised
    brand equity and purchase intention whatever the consumer's self-congruity, so brands can convey their value without
    tailoring every message to individual differences. User-generated content needs a match: it built brand equity only for
    consumers who saw themselves in the brand, so brands that partner with users and influencers should look for
    creators whose followers identify with the brand, disclose endorsements and align endorsed content with their own
    posts.
  theoretical: >-
    The study brings self-congruity theory into research on social media brand communication. It shows that
    consumer-based brand equity mediates the effect of both firm-created and user-generated content on purchase
    intention, and that self-congruity moderates the indirect effect only for user-generated content. Consumers' fit
    with the brand therefore decides how much other users' content counts, while the brand's own content works through
    brand equity regardless of that fit.

limitations:
  - "One industry (fashion) and one country (the USA), with brand equity measured as an overall construct without its sub-dimensions; future studies should test other industries, sectors and cultures."
  - "A survey of perceptions rather than an experiment; future work could manipulate the two content types in a controlled setting and add mediators such as consumers' online brand-related activities (COBRAs)."
  - "Cross-sectional data; structural equation modelling with larger samples, generational cohorts and longitudinal designs could extend the findings."

faq:
  - q: "Does user-generated content increase purchase intentions for fashion brands?"
    a: >-
      Yes. Its direct effect on purchase intention was 0.31, and its indirect effect through brand equity depended on
      self-congruity: 0.11 at high, 0.07 at average and not significant at low self-congruity (Schivinski et al., 2022).
  - q: "Is firm-created or user-generated content more effective on social media for fashion brands?"
    a: >-
      In this study firm-created content had the larger total effect on purchase intention (0.64 vs 0.44) and worked for
      all consumers, while user-generated content depended on self-congruity (Schivinski et al., 2022).
  - q: "What is self-congruity and why does it matter for social media marketing?"
    a: >-
      Self-congruity is the match between a consumer's self-image and the brand's image. It amplified the effect of
      user-generated content on brand equity, from 0.09 (not significant) at low to 0.49 at high self-congruity
      (Schivinski et al., 2022).
  - q: "Should fashion brands work with influencers?"
    a: >-
      The study suggests choosing creators whose followers identify with the brand, because other users' content raised
      brand equity only when consumers felt the brand matched their self-image (Schivinski et
      al., 2022).

concepts:
  - term: "Firm-created content (FCC)"
    definition: "Brand-related content that a brand designs and posts on its own official social media pages, as part of its integrated marketing communications."
  - term: "User-generated content (UGC)"
    definition: "Brand-related content created and posted by consumers, influencers or other users, independent of the firm's control."
  - term: "Consumer-based brand equity (CBBE)"
    definition: "The added value consumers attach to a brand compared with an equivalent alternative, measured here as overall brand preference (Yoo &amp; Donthu, 2001)."
  - term: "Self-congruity"
    definition: "The congruity between a consumer's actual self-image and the image of a product or brand (Sirgy, 1982)."
  - term: "Moderated mediation"
    definition: "When an indirect (mediated) effect changes with the level of a third variable; here, whether the effect of content on purchase intention through brand equity depends on self-congruity."
  - term: "Index of moderated mediation"
    definition: "A single test of whether an indirect effect differs across levels of the moderator; a bootstrap confidence interval that excludes zero indicates moderated mediation (Hayes, 2018)."

materials:
  - label: "Brand recall"
    text: "Participants named a fashion brand they actively followed on any social media platform, and were randomly shown questions on only one content type (firm-created or user-generated) for that brand."
  - label: "Control checks"
    text: "Brand familiarity (three items: familiar with, experienced with and knowledgeable about the brand; Kent &amp; Allen, 1994; &alpha; = 0.72) and confidence in recalling the brand's posts, e.g. “I am confident that I can remember social media posts created by [Fashion Brand]” (FCC) or “… posted by other users on [Social Media Platform]” (UGC)."
  - label: "Scales"
    text: "Firm-created and user-generated content (Schivinski &amp; Dabrowski, 2016), consumer-based brand equity (Yoo &amp; Donthu, 2001), self-congruity (Sirgy et al., 1997) and purchase intention (Yoo et al., 2000), all on 5-point agreement scales; the full method is in the accepted manuscript."

