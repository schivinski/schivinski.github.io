in_brief: >-
  A 17-item scale measures how consumers engage with brand-related content on social media at three levels:
  consuming it, contributing to it and creating it. Developed with three qualitative studies and validated with
  2,668 consumers, the scale also shows that engagement builds step by step, from consumption to contribution to
  creation.

scale:
  name: "Consumer’s Engagement with Brand-Related Social-Media Content (CEBSC) scale"
  short: "CEBSC"
  summary: >-
    Seventeen items in three dimensions (consumption 5, contribution 6, creation 6). Respondents name a brand they
    follow on social media and report how often they do each activity for that brand. Takes about three minutes. Free
    to use in research and practice; please cite the article.
  facts:
    - { label: "Items", value: "17 (consumption 5, contribution 6, creation 6)" }
    - { label: "Response format", value: "7-point scale from 1 = not very often to 7 = very often, plus “not at all” coded 0" }
    - { label: "Scoring", value: "Mean of the items in each dimension (range 0–7); higher scores mean higher engagement" }
    - { label: "Reliability", value: "Cronbach’s α = 0.88 to 0.95; composite reliability = 0.88 to 0.95 across studies" }
    - { label: "Validated with", value: "2,252 consumers and 299 brands (Study 4); 416 consumers (Study 5); Poland" }
  response_labels: ["Not at all", "Not very often", "", "", "", "", "", "Very often"]
  response_codes: [0, 1, 2, 3, 4, 5, 6, 7]
  introduction: >-
    This survey is about the content related to brands that you come across on social media, such as Facebook,
    Instagram, YouTube, TikTok, X, blogs and online forums. People engage with this content in different ways: some
    read or watch it (consuming), some like, comment on or share it (contributing), and some post their own content
    about a brand (creating). There are no right or wrong answers.
  brand_question: "Please type the name of a brand that you actively follow on social media."
  brand_note: "You will answer the following questions about this brand. Wherever you see [BRAND], think of the brand you named."
  block_instruction: "How often do you do each of the following? Select “Not at all” if you never do it."
  dimensions:
    - code: "CONS"
      name: "Consumption"
      definition: "Passive engagement: reading, watching and following brand-related content."
      items:
        - { id: "CONS1", text: "I read posts related to [BRAND] on social media." }
        - { id: "CONS2", text: "I read fan page(s) related to [BRAND] on social networking sites." }
        - { id: "CONS3", text: "I watch pictures/graphics related to [BRAND]." }
        - { id: "CONS4", text: "I follow blogs related to [BRAND]." }
        - { id: "CONS5", text: "I follow [BRAND] on social networking sites." }
    - code: "CONT"
      name: "Contribution"
      definition: "Interaction with content created by the brand or by others: liking, sharing and commenting."
      items:
        - { id: "CONT1", text: "I comment on videos related to [BRAND]." }
        - { id: "CONT2", text: "I comment on posts related to [BRAND]." }
        - { id: "CONT3", text: "I comment on pictures/graphics related to [BRAND]." }
        - { id: "CONT4", text: "I share [BRAND] related posts." }
        - { id: "CONT5", text: "I “Like” pictures/graphics related to [BRAND]." }
        - { id: "CONT6", text: "I “Like” posts related to [BRAND]." }
    - code: "CREA"
      name: "Creation"
      definition: "Producing and publishing one’s own brand-related content: posts, pictures, videos and reviews."
      items:
        - { id: "CREA1", text: "I initiate posts related to [BRAND] on blogs." }
        - { id: "CREA2", text: "I initiate posts related to [BRAND] on social networking sites." }
        - { id: "CREA3", text: "I post pictures/graphics related to [BRAND]." }
        - { id: "CREA4", text: "I post videos that show [BRAND]." }
        - { id: "CREA5", text: "I write posts related to [BRAND] on forums." }
        - { id: "CREA6", text: "I write reviews related to [BRAND]." }
  administration:
    - "Ask respondents to name a brand they actively follow on social media, and insert that brand name into every item (for example with piped text in Qualtrics)."
    - "Present each dimension in its own block, on a separate page."
    - "Randomise the order of the three blocks, and the order of items within each block, to avoid order effects (as in the original study)."
    - "Each respondent answers for one brand only."
    - "The items work for any platform. To study a single platform, name it in the instructions rather than changing the item wording."
    - "For use in another language, translate and back-translate the items, and check measurement invariance before comparing groups or countries."
  scoring:
    - "Code responses 0 (not at all) and 1 to 7 (not very often to very often)."
    - "Compute one score per dimension as the mean of its items: consumption = mean(CONS1–CONS5); contribution = mean(CONT1–CONT6); creation = mean(CREA1–CREA6)."
    - "Higher scores mean higher engagement. In the original data, average engagement was highest for consumption (M = 3.68), then contribution (M = 2.65), then creation (M = 2.02)."
    - "Any cut-off for low or high engagement is arbitrary because the scale is metric; the original study used the bottom and top 10% as thresholds."
    - "For latent-variable models, specify three correlated factors, or the hierarchical model consumption → contribution → creation (Figure 2)."
  intro_note: >-
    The item wording, response format, coding and administration procedure come from the article. The welcome text, brand
    question and block instruction are suggested wording based on the procedure the article describes; adapt them to your
    study.
  downloads:
    - { label: "Questionnaire (PDF, print-ready)", file: "materials/cebsc/cebsc-questionnaire.pdf" }
    - { label: "Qualtrics import file (.txt)", file: "materials/cebsc/cebsc-qualtrics-import.txt" }
    - { label: "Item codebook (.csv)", file: "materials/cebsc/cebsc-codebook.csv" }
    - { label: "R script: scoring and CFA with lavaan (.R)", file: "materials/cebsc/cebsc-analysis.R" }
    - { label: "Mplus input: CFA and hierarchical model (.inp)", file: "materials/cebsc/cebsc-cfa.inp" }

findings:
  - headline: "Three distinct levels of engagement."
    text: >-
      Confirmatory factor analysis supported a three-factor, 17-item structure of consumption, contribution and creation
      of brand-related social-media content (robust ML: &chi;&sup2;(115) = 557.47, CFI = 0.95, TLI = 0.94, RMSEA = 0.05,
      SRMR = 0.06; validation sample n = 1,126) (Schivinski, Christodoulides &amp; Dabrowski, 2016).
  - headline: "A reliable and valid measure."
    text: >-
      Composite reliabilities were 0.88 (consumption), 0.92 (contribution) and 0.93 (creation), with average variance
      extracted above the shared variance between dimensions, supporting convergent and discriminant validity
      (Schivinski, Christodoulides &amp; Dabrowski, 2016).
  - headline: "Engagement builds step by step."
    text: >-
      Consumption predicted contribution (&beta; = 0.61) and contribution predicted creation (&beta; = 0.81); the direct
      effect of consumption on creation became non-significant once contribution was included (indirect &beta; = 0.49),
      indicating full mediation (Schivinski, Christodoulides &amp; Dabrowski, 2016).
  - headline: "Related to brand equity and brand attitude."
    text: >-
      In a new sample of 416 consumers, all three dimensions correlated positively with brand equity (r = 0.23 to 0.40)
      and brand attitude (r = 0.14 to 0.37) (Schivinski, Christodoulides &amp; Dabrowski, 2016).
  - headline: "Most consumers consume more than they create."
    text: >-
      Average engagement was highest for consumption (M = 3.68), then contribution (M = 2.65) and creation (M = 2.02),
      on a 0–7 scale (Schivinski, Christodoulides &amp; Dabrowski, 2016).

glance:
  - { label: "Design", value: "Five studies: online focus groups, online depth interviews, netnography, scale development (Study 4) and validation (Study 5)" }
  - { label: "Qualitative studies", value: "25 focus-group participants, 32 interviewees and a netnography produced a pool of 35 items" }
  - { label: "Scale development", value: "2,578 Polish consumers recruited online; 2,252 valid responses about 299 brands, split into calibration and validation samples of 1,126" }
  - { label: "Validation", value: "New sample of 416 Polish consumers; brand equity (Yoo &amp; Donthu, 2001) and brand attitude as nomological variables" }
  - { label: "Analysis", value: "Exploratory and confirmatory factor analysis, structural equation modelling and bootstrapped mediation (Mplus 7.2, robust maximum likelihood)" }

