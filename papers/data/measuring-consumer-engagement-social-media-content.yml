question: >-
  Consumers engage with brands on social media in many ways, from reading a post to liking it to publishing their own.
  The Consumer’s Online Brand-Related Activities (COBRAs) framework grouped these into consumption, contribution and
  creation, but there was no validated instrument to measure them. We developed and validated one, and tested whether the
  three levels form a hierarchy in which people move from consuming to contributing to creating.

implications:
  practical: >-
    Managers can use the scale to audit and track social-media programmes, and each item points to a concrete activity
    they can encourage. Because engagement builds from consumption to contribution to creation, brands should keep
    producing content their audiences will consume, which in turn invites liking, commenting and sharing, and then
    user-generated content. The three dimensions are best used together; individual subscales suit studies focused on one
    activity, such as content creation.
  theoretical: >-
    The study turns the COBRAs framework into a validated measurement instrument and defines engagement with brand-related
    social-media content as a behavioural construct. It shows a hierarchy among the dimensions, with contribution fully
    mediating the link between consumption and creation, and supports nomological validity through positive correlations
    with brand equity and brand attitude. The scale can serve as a dependent variable for studying the drivers of
    engagement.

limitations:
  - "The list of brand-related activities (Appendix A) is not exhaustive; new activities will appear as platforms change, and the instrument should be updated accordingly."
  - "The data were not controlled for past brand usage, which future studies could use as a moderator."
  - "The research was conducted in one country (Poland); replications should test the scale’s equivalence across nations and cultures."
  - "Future research could combine the scale with other behavioural variables in latent class analysis to identify engagement segments, and use multilevel models to compare industries and brands."

faq:
  - q: "How can I measure consumer engagement with brands on social media?"
    a: >-
      The 17-item CEBSC scale measures engagement with brand-related social-media content at three levels: consumption
      (5 items), contribution (6 items) and creation (6 items), using a 0–7 frequency scale (Schivinski, Christodoulides
      &amp; Dabrowski, 2016).
  - q: "What are COBRAs?"
    a: >-
      Consumers’ online brand-related activities: the ways people engage with brand-related content online, grouped into
      consuming, contributing and creating. Muntinga, Moorman and Smit (2011) introduced the framework, and Schivinski,
      Christodoulides and Dabrowski (2016) developed the scale that measures it.
  - q: "Is the CEBSC scale reliable?"
    a: >-
      Yes. Composite reliabilities were 0.88 to 0.93 in the validation sample and Cronbach’s alpha ranged from 0.88 to 0.94
      in a second study of 416 consumers (Schivinski, Christodoulides &amp; Dabrowski, 2016).
  - q: "Do consumers move from consuming brand content to creating it?"
    a: >-
      The evidence supports a hierarchy: consumption predicts contribution (&beta; = 0.61), contribution predicts creation
      (&beta; = 0.81), and contribution fully mediates the link between consumption and creation (Schivinski,
      Christodoulides &amp; Dabrowski, 2016).

concepts:
  - term: "Consumer’s online brand-related activities (COBRAs)"
    definition: "A set of brand-related online activities on the part of the consumer that vary in the degree to which the consumer interacts with social media and engages in the consumption, contribution, and creation of media content (definition from the article)."
  - term: "Consumption"
    definition: "The minimum level of engagement: reading, watching and following brand-related content, whether created by firms or by users."
  - term: "Contribution"
    definition: "Peer-to-peer and peer-to-content interactions about brands, such as liking, commenting and sharing, without creating new content."
  - term: "Creation"
    definition: "The strongest level of engagement: producing and publishing brand-related content, which can in turn be consumed and contributed to by others."

