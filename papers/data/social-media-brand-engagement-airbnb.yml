in_brief: >-
  On social media, people read, share and post about Airbnb because they find the brand attractive and full of
  personality, not because they find it reliable. In a survey of 449 social media users in Poland who followed Airbnb,
  reliability and trust drove engagement only by first raising brand equity.

findings:
  - headline: "A hedonic brand image drives engagement directly."
    text: >-
      In a survey of 449 social media users in Poland who followed and interacted with Airbnb, hedonic brand image
      (seeing Airbnb as attractive, desirable and strong in character and personality) increased the consumption
      (&beta; = 0.31), contribution (&beta; = 0.32) and creation (&beta; = 0.33) of Airbnb-related content on social
      media, all <i>p</i> &le; .001 (Schivinski et al., 2020).
  - headline: "A functional brand image works only through brand equity."
    text: >-
      Functional brand image (seeing Airbnb as reliable, credible and trustworthy) had no direct effect on consuming,
      contributing or creating content (<i>p</i> = .25, .56 and .23), but it raised overall brand equity
      (&beta; = 0.67, <i>p</i> &le; .001), and its indirect effects through brand equity were significant (0.26, 0.16 and
      0.13, all <i>p</i> &le; .001): brand equity fully mediated the effect (Schivinski et al., 2020).
  - headline: "Brand equity is driven mainly by function."
    text: >-
      Functional brand image had a much larger effect on Airbnb's overall brand equity (&beta; = 0.67) than hedonic
      brand image (&beta; = 0.15, <i>p</i> = .03); brand equity in turn increased consumption (&beta; = 0.22),
      contribution (&beta; = 0.19) and creation (&beta; = 0.18) of brand-related content (Schivinski et al., 2020).
  - headline: "Brand equity adds only a little to the hedonic route."
    text: >-
      The indirect effects of hedonic brand image through brand equity were small (0.06, 0.04 and 0.03 for
      consumption, contribution and creation; <i>p</i> = .03, .05 and .07), so the hedonic image worked mainly
      directly, with partial mediation by brand equity (Schivinski et al., 2020).
  - headline: "Heavier social media users consume more brand content."
    text: >-
      Time spent on social media increased the consumption of Airbnb-related content (&beta; = 0.11, <i>p</i> = .01),
      older respondents contributed and created slightly more (&beta; = 0.11 and 0.12, <i>p</i> = .05), and gender had
      no effect; results were the same when only respondents who had used Airbnb were analysed (Schivinski et al., 2020).

