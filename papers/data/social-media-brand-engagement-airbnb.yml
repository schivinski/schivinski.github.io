question: >-
  Peer-to-peer accommodation brands such as Airbnb depend on users talking about them on social media, yet research on
  consumer brand engagement had looked mostly at consumer-side drivers such as motivations and personality. Little was
  known about how the brand itself drives engagement, especially in the sharing economy. We asked whether Airbnb's
  functional and hedonic brand image lead consumers to consume, contribute and create brand-related content on social
  media, and whether overall brand equity carries these effects.

implications:
  practical: >-
    Platforms like Airbnb that want people to engage on social media should build a brand that feels attractive,
    desirable and strong in personality, for example by linking it with people, events and places and by making it easy
    for guests to share their stays as user-generated content. Reliability and trust still matter: they build brand
    equity, which keeps guests coming back and supports engagement, but on their own they mostly lead to passive
    reading rather than active posting. The two sides of the image complement each other.
  theoretical: >-
    The study shows that brand image affects social media engagement differently depending on its content: hedonic
    associations act directly, while functional associations act only through overall brand equity. It extends the
    nomological network of consumer brand engagement with firm-led, brand-related drivers in the sharing economy, and
    suggests that attitudinal loyalty, captured by overall brand equity, is an important but not indispensable route to
    engagement behaviour.

limitations:
  - "Respondents came from one country (Poland), so the results need replication in other countries and cultures."
  - "Overall brand equity was the only mediator tested; self-brand identification and brand love are candidate mechanisms for future work."
  - "Only one sharing-economy brand, Airbnb, was studied; future research could also compare engagement before and after the COVID-19 disruption to collaborative consumption."

faq:
  - q: "Why do people engage with Airbnb on social media?"
    a: >-
      Mainly because they see the brand as attractive, desirable and strong in personality. In a survey of 449 social
      media users in Poland, hedonic brand image directly increased consuming (&beta; = 0.31), contributing
      (&beta; = 0.32) and creating (&beta; = 0.33) Airbnb-related content (Schivinski et al., 2020).
  - q: "Does trust in a sharing-economy brand increase social media engagement?"
    a: >-
      Only indirectly. Seeing Airbnb as reliable, credible and trustworthy had no direct effect on engagement, but it
      raised brand equity (&beta; = 0.67), which in turn increased engagement; brand equity fully mediated the effect
      (Schivinski et al., 2020).
  - q: "Does brand equity lead to engagement on social media?"
    a: >-
      Yes. Overall brand equity increased the consumption (&beta; = 0.22), contribution (&beta; = 0.19) and creation
      (&beta; = 0.18) of Airbnb-related content on social media (Schivinski et al., 2020).
  - q: "What should a peer-to-peer platform do to get users posting about it?"
    a: >-
      Build its hedonic image. Functional associations mainly led to passive consumption of content, while active
      contribution and creation were driven directly by a hedonic, attractive brand image (Schivinski et al., 2020).

concepts:
  - term: "Consumers' online brand-related activities (COBRAs)"
    definition: "Behavioural engagement with brands on social media at three levels: consuming (reading, watching, following), contributing (liking, commenting, sharing) and creating (posting content, writing reviews) brand-related content."
  - term: "Functional brand image"
    definition: "Utilitarian, rational associations with a brand, such as reliability, competence, credibility and trust; they give the brand objective meaning."
  - term: "Hedonic brand image"
    definition: "Emotional and symbolic associations with a brand, such as being attractive, desirable and strong in character and personality; they give the brand subjective meaning."
  - term: "Overall brand equity (OBE)"
    definition: "A single-dimension measure of the added value consumers attach to a brand compared with an equivalent alternative (Yoo &amp; Donthu, 2001)."
  - term: "Collaborative consumption"
    definition: "Consumption in which access to goods and services is shared among peers and coordinated through community-based online services, favouring access over ownership."
  - term: "Full and partial mediation"
    definition: "Full mediation means a variable affects the outcome only through the mediator (here, functional image through brand equity); partial mediation means it also has a direct effect (here, hedonic image)."

