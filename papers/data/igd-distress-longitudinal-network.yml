in_brief: >-
  Internet gaming disorder holds together as its own set of symptoms rather than being a side effect of depression,
  anxiety or stress. Following 462 adult gamers over 12 months, we found that gaming symptoms connected mainly with each
  other, and the main bridge to distress ran from using games to escape bad moods to depression.

findings:
  - headline: "Gaming disorder symptoms form their own cluster."
    text: >-
      In networks of the nine IGD symptoms and depression, anxiety and stress, connections within the gaming and
      distress clusters were stronger than those between them, supporting IGD as a distinct construct (Tullett-Prado
      et al., 2025).
  - headline: "Escapism is the bridge to depression."
    text: >-
      The only notable link between the two clusters ran from escapism/mood modification to depression (edge weights
      0.17 at both waves); escapism had the highest bridge influence of the gaming symptoms (Tullett-Prado et al.,
      2025).
  - headline: "Persistence is consistently central."
    text: >-
      At the first wave, inability to stop, persistence and tolerance (with stress) had the highest expected influence;
      at the second, withdrawal and persistence led, with tolerance and stress next; escapism had the lowest
      (Tullett-Prado et al., 2025).
  - headline: "The network is stable over 12 months."
    text: >-
      Network comparison tests found no significant differences between the two waves in global structure (p = .27) or
      global strength (p = .52), and stability coefficients were .60 to .75 (Tullett-Prado et al., 2025).

glance:
  - { label: "Design", value: "Two-wave online survey of English-speaking adult gamers, 12 months apart (first wave August 2020 to August 2021, second wave August 2021 to August 2022), recruited through social media, Reddit and a university learning system" }
  - { label: "Participants", value: "968 gamers at the first wave and 462 at the second (mean age 30.8; 69.3% male), aged 18 to 64" }
  - { label: "Measures", value: "Internet Gaming Disorder Scale&ndash;Short Form (IGDS9-SF; &alpha; = .87&ndash;.88) and the Depression, Anxiety and Stress Scale (DASS-21; &alpha; = .85&ndash;.94)" }
  - { label: "Analysis", value: "Regularised (graphical lasso) networks in R (qgraph, networktools, bootnet), expected influence and bridge expected influence, case-dropping bootstrap stability, and the Network Comparison Test across waves" }
