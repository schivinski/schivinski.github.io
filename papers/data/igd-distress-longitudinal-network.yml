question: >-
  Internet gaming disorder (IGD) is only provisionally recognised, and critics argue that it may be a secondary symptom
  of depression or anxiety. We asked how the nine IGD symptoms relate to each other and to depression, anxiety and
  stress, which symptoms are most central, and whether this network holds over 12 months.

implications:
  practical: >-
    Treatment of IGD could focus on persistence and tolerance, gamers with problematic play should be screened for
    distress, and interventions should address the use of gaming to cope with negative moods; dialectical behaviour
    therapy or coping-focused cognitive behavioural therapy are suggested candidates. The results support the IGDS9-SF
    for assessing problematic gaming.
  theoretical: >-
    IGD behaved as a construct distinct from psychological distress, supporting the behavioural addiction model.
    Strong links between symptoms that mark addiction (salience, withdrawal, tolerance) and its consequences
    (persistence, negative life outcomes) suggest that the nine-symptom framework could be simplified.

limitations:
  - "The sample was mostly male (about 70%) and Caucasian, from Western countries; cultural differences were not examined."
  - "Self-report measures are open to social desirability and memory biases."
  - "The gaming and distress clusters were assumed rather than detected; exploratory graph analysis could test them more robustly."
  - "Future work: the order in which symptoms arise, how persistence and tolerance affect other symptoms, and mood modification, depression and anxiety as pathways between distress and IGD."

faq:
  - q: "Is internet gaming disorder just a symptom of depression or anxiety?"
    a: >-
      In a two-wave network study of adult gamers, IGD symptoms clustered separately from depression, anxiety and
      stress, with one main link through escapism to depression, which the authors read as support for IGD as a
      distinct disorder (Tullett-Prado et al., 2025).
  - q: "How is gaming disorder linked to depression?"
    a: >-
      Mainly through escapism or mood modification, that is, using games to escape negative moods, which connected the
      gaming symptoms to depression at both waves (Tullett-Prado et al., 2025).
  - q: "Which gaming disorder symptoms are most central?"
    a: >-
      Persistence (continuing to game despite problems) was central at both waves, alongside inability to stop and
      tolerance at the first wave and withdrawal at the second (Tullett-Prado et al., 2025).
  - q: "Does the network of gaming disorder symptoms change over a year?"
    a: >-
      No significant differences were found between the two waves, 12 months apart (Tullett-Prado et al., 2025).

concepts:
  - term: "Network analysis of psychopathology"
    definition: "An approach that treats a disorder as a network of interacting symptoms (nodes) linked by their associations (edges)."
  - term: "Expected influence"
    definition: "A centrality index: the sum of a node&rsquo;s edge weights, keeping their signs, showing how strongly a symptom is connected to the rest of the network."
  - term: "Bridge expected influence"
    definition: "The same index counting only edges to another cluster, here the links between gaming symptoms and distress."
  - term: "Internet gaming disorder"
    definition: "A condition for further study in the DSM-5, defined by nine symptoms such as preoccupation, withdrawal, tolerance, loss of control and continued gaming despite problems."

