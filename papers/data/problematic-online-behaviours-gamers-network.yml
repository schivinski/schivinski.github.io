question: >-
  Researchers still debate whether "Internet addiction" is one general problem or a set of specific problems that
  happen to take place online. Gamers are a group in which problematic gaming is common, but little was known about
  whether they also struggle with other online activities, and whether those problems overlap or stay distinct. In a
  large international sample of gamers, we asked how problematic online gaming, gambling, shopping, pornography use
  and social networking relate to each other, whether their symptoms form separate clusters, and which is most
  prevalent.

implications:
  practical: >-
    Clinicians and prevention programmes working with gamers should screen for other problematic online behaviours,
    since they often co-occur with disordered gaming, and especially for problematic social networking, which may
    reflect unmet social needs. Because each behaviour is distinct, treatment and prevention may need to target the
    specific activity rather than "Internet use" in general.
  theoretical: >-
    The results support the view of specific Internet use disorders: the Internet is the medium that fuels several
    distinct problematic behaviours rather than a single general addiction. They are consistent with frameworks such
    as I-PACE and with treating gaming disorder as one facet of a wider set of Internet-based problematic behaviours.

limitations:
  - "The sample was self-selected, mostly young and male, and recruited by convenience, so the results may not generalise."
  - "Self-reports may not match actual, objectively measured gaming, gambling, shopping, pornography and social media use."
  - "The cross-sectional design cannot show how these problems develop or influence one another over time."
  - "Future work could study female gamers, older cohorts and relationship satisfaction in the context of gaming."

faq:
  - q: "Do gamers have other problematic online behaviours?"
    a: >-
      Often, yes. Among 4,416 gamers, problematic gaming correlated with problematic social networking, pornography
      use, gambling and shopping (<i>r</i> = 0.27 to 0.39), although gaming was by far the most problematic of the five
      (Rozgonjuk et al., 2021).
  - q: "Is Internet addiction one disorder or several?"
    a: >-
      This study supports several: in a network analysis of gamers&rsquo; symptoms, problematic gaming, gambling,
      shopping, pornography use and social networking each formed a separate cluster, even though they were
      correlated (Rozgonjuk et al., 2021).
  - q: "Which online behaviour is most linked to problematic gaming?"
    a: >-
      Problematic social networking (<i>r</i> = 0.389), followed by problematic pornography use (0.318) and gambling
      (0.299) (Rozgonjuk et al., 2021).
  - q: "What is exploratory graph analysis?"
    a: >-
      A network method that estimates the partial correlations between questionnaire items and uses a community
      detection algorithm to find how many clusters, or dimensions, the items form.

concepts:
  - term: "Problematic Internet use"
    definition: "Excessive or poorly controlled use of the Internet that causes problems in daily life; also called Internet addiction or Internet use disorder."
  - term: "Specific vs generalised problematic Internet use"
    definition: "Whether problems concern particular online activities, such as gaming or shopping, or the Internet in general."
  - term: "Gaming disorder"
    definition: "A pattern of gaming with impaired control, increasing priority over other activities and continuation despite harm (WHO, ICD-11)."
  - term: "Exploratory graph analysis (EGA)"
    definition: "A network psychometrics method that estimates item networks and detects clusters of items as dimensions."
  - term: "Network loading"
    definition: "The sum of an item&rsquo;s connections to the items of a dimension; values above 0.15, 0.25 and 0.35 are small, medium and large."

materials:
  - label: "Scale items"
    text: "For each behaviour (gaming, gambling, shopping, pornography, social networking) the four items were: &ldquo;How often do you find that you spend more time [doing the behavior] than you intended?&rdquo;; &ldquo;How often do you neglect household chores to spend more time [doing the behavior]?&rdquo;; &ldquo;How often do you feel preoccupied with [doing the behavior] when offline or fantasize about [doing the behavior]?&rdquo;; &ldquo;How often do you choose to spend more time [doing the behavior] over going out with others?&rdquo; (1 = never to 5 = very often; Müller et al., 2017)."
  - label: "Exclusion criteria"
    text: "Respondents were excluded if they were outside 12 to 80 years, had not played video games in the past 12 months, reported playing a non-existent game (attention check), reported more than 119 hours of gaming a week or more than 48 hours at weekends, declared themselves professional gamers, or lacked sufficient English."
  - label: "Correction"
    text: "A correction published on 2 May 2022 replaced the third sentence of the second paragraph of the Sample and Procedure section with: &ldquo;The study has received ethical approval by the research team&rsquo;s University Ethics Committee (College Research Ethics Committee of the Nottingham Trent University [2018/95]).&rdquo;"

