in_brief: >-
  Gamers who report problematic gaming also tend to report problems with other online activities, but each problem
  stands on its own. In a survey of 4,416 gamers from many countries, problematic gaming, gambling, shopping,
  pornography use and social networking correlated with one another yet formed five separate clusters, with gaming
  the most and shopping the least problematic.

findings:
  - headline: "Problematic gaming goes with other problematic online behaviours."
    text: >-
      Among 4,416 gamers, problematic online gaming correlated positively with problematic social networking
      (<i>r</i> = 0.389), pornography use (0.318), gambling (0.299) and shopping (0.269), all <i>p</i> &lt; .001
      (Rozgonjuk et al., 2021).
  - headline: "But each behaviour is a separate problem."
    text: >-
      Exploratory graph analysis found five dimensions, one per behaviour, in 97.4% of 1,000 bootstrapped networks:
      every item loaded on its own scale, with only one cross-loading of note (gaming item 4 on gambling, &minus;0.15)
      (Rozgonjuk et al., 2021).
  - headline: "Gaming was the most problematic, shopping the least."
    text: >-
      On scales from 4 to 20, problematic gaming averaged 10.77, ahead of social networking (8.00), gambling (7.45),
      pornography (6.91) and shopping (5.77); the gap between gaming and the others was medium to large
      (Cohen&rsquo;s <i>d</i> = 0.71 to 1.27; <i>F</i>(4, 17,660) = 1981.98, <i>p</i> &lt; .001) (Rozgonjuk et al., 2021).
  - headline: "Social networking was most closely tied to gaming."
    text: >-
      Problematic social networking had the strongest link with problematic gaming, which the authors suggest may
      point to unmet social needs among gamers with disordered gaming (Rozgonjuk et al., 2021).

glance:
  - { label: "Design", value: "Cross-sectional international online survey in English (Smart Gaming campaign, ESL), 2019 data; convenience sample rewarded with personalised feedback on their gaming" }
  - { label: "Participants", value: "4,416 gamers aged 12 to 80 (mean 23.3, SD 6.7), 94% men, from many countries, most often Russia (17%), France (15%), Spain (11%), Poland (6%) and Argentina (5%); 5,905 before data cleaning" }
  - { label: "Measures", value: "Four-item scales of problematic online gaming, gambling, shopping, pornography use and social networking (Müller et al., 2017), each item from 1 = never to 5 = very often; &alpha; and &omega; = 0.79 to 0.83" }
  - { label: "Analysis", value: "Spearman correlations (Holm-adjusted); exploratory graph analysis with a Gaussian graphical model (GLASSO, EBIC) and Louvain community detection, bootstrapped 1,000 times (EGAnet); within-subjects ANOVA with Holm post hoc tests, in R 4.0.3" }
  - { label: "Ethics", value: "As printed: approved by the Institutional Review Board of Ulm University. A correction (2 May 2022) states that ethical approval was given by the College Research Ethics Committee of Nottingham Trent University (2018/95)" }

