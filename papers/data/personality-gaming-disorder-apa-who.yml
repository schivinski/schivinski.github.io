in_brief: >-
  Gamers low in conscientiousness and high in neuroticism are the most likely to show symptoms of gaming disorder, and
  this holds whether disorder is defined by the WHO or the APA. In 50,925 gamers from 150 countries, personality was
  linked much more strongly to disordered gaming than to the number of hours spent gaming.

findings:
  - headline: "Low conscientiousness and high neuroticism go with gaming disorder."
    text: >-
      Among 50,925 gamers from 150 countries, gaming disorder symptoms correlated with low conscientiousness
      (<i>r</i> = &minus;.37 under the WHO framework, &minus;.33 under the APA framework) and high neuroticism
      (<i>r</i> = .27 and .33) (Montag et al., 2021).
  - headline: "The links hold across both diagnostic frameworks."
    text: >-
      Controlling for age, gender and weekly gaming time, conscientiousness (&beta; = &minus;.28 WHO, &minus;.20 APA)
      and neuroticism (&beta; = .14 WHO, .21 APA) remained the strongest personality predictors; the models explained
      about 22% of the variance in symptoms (Montag et al., 2021).
  - headline: "Personality says little about how long people play."
    text: >-
      Correlations between the Big Five traits and weekly time spent gaming were small (&minus;.12 to .07), so
      personality matters for disordered gaming rather than for gaming time (Montag et al., 2021).
  - headline: "Disordered gamers differ on every trait."
    text: >-
      Gamers meeting the WHO criteria (2.2% of the sample) or the APA criteria (5.5%) scored lower on conscientiousness,
      agreeableness, extraversion and openness and higher on neuroticism than other gamers (all <i>p</i> &lt; .001)
      (Montag et al., 2021).

