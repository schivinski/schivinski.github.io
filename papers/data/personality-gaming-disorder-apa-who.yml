question: >-
  Personality is thought to shape vulnerability to disordered gaming, but most studies used small, single-country
  samples and only the APA framework, and none compared how personality relates to disordered gaming versus time spent
  gaming. In a large, culturally diverse sample we asked whether the Big Five traits, especially low conscientiousness
  and high neuroticism, relate to disordered gaming under both the WHO and APA frameworks, and whether they relate
  differently to gaming time.

implications:
  practical: >-
    Short screenings of conscientiousness and neuroticism could help identify gamers vulnerable to disordered gaming and
    target prevention. Because personality relates to disordered gaming much more than to hours played, high gaming
    engagement should not be confused with disorder.
  theoretical: >-
    The study confirms low conscientiousness and high neuroticism as robust correlates of disordered gaming across both
    diagnostic frameworks and many countries, supporting the role of personality in models such as I-PACE, and shows
    that disordered gaming and time spent gaming are distinct.

limitations:
  - "The cross-sectional design cannot show whether personality causes disordered gaming or results from it."
  - "All measures are self-reports, and classifying disordered gaming from questionnaires needs clinical interviews to yield a diagnosis."
  - "The English-language survey and the self-help platform may have biased the sample towards heavier or more vulnerable gamers, and few women took part."

faq:
  - q: "Which personality traits are linked to gaming disorder?"
    a: >-
      Low conscientiousness and high neuroticism, in a study of 50,925 gamers from 150 countries; lower agreeableness,
      extraversion and openness showed weaker links (Montag et al., 2021).
  - q: "Is personality related to how much people play video games?"
    a: >-
      Only weakly. Correlations between the Big Five traits and weekly gaming time ranged from &minus;.12 to .07, much
      smaller than their correlations with disordered gaming (Montag et al., 2021).
  - q: "How common was gaming disorder in this sample?"
    a: >-
      About 2.2% of gamers met the WHO criteria for gaming disorder and 5.5% met the APA criteria for Internet gaming
      disorder (Montag et al., 2021).
  - q: "Do men and women differ in disordered gaming?"
    a: >-
      In this sample, men and women did not differ meaningfully in disordered gaming scores, although men played more
      hours and women scored higher on neuroticism (Montag et al., 2021).

concepts:
  - term: "Big Five personality traits"
    definition: "Openness, conscientiousness, extraversion, agreeableness and neuroticism, the most widely used model of personality."
  - term: "Conscientiousness"
    definition: "A tendency to be organised, dependable, self-disciplined and goal-directed."
  - term: "Neuroticism"
    definition: "A tendency to experience negative emotions such as anxiety, worry and moodiness."
  - term: "Gaming disorder (WHO)"
    definition: "An ICD-11 diagnosis marked by impaired control over gaming, increasing priority given to gaming and continued gaming despite negative consequences, with significant impairment."
  - term: "Internet gaming disorder (APA)"
    definition: "A DSM-5 condition for further study, defined by at least five of nine criteria within 12 months."
  - term: "I-PACE model"
    definition: "The Interaction of Person-Affect-Cognition-Execution model of how addictive behaviours develop."

materials:
  - label: "Scoring"
    text: "Disordered gaming (WHO): all four GDT items answered 4 = &lsquo;often&rsquo; or 5 = &lsquo;very often&rsquo;. Disordered gaming (APA): five of the nine IGDS9-SF items answered 4 or 5. BFI-44 items rated from 1 = &lsquo;disagree strongly&rsquo; to 5 = &lsquo;agree strongly&rsquo;."
  - label: "Country-level results"
    text: "Participant numbers per country and personality&ndash;disordered gaming correlations for each country with at least 1% of the sample are in S1 Data of the article."

