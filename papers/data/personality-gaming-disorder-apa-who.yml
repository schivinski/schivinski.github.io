  - { label: "Measures", value: "Big Five Inventory (BFI-44); Gaming Disorder Test (GDT, WHO framework); Internet Gaming Disorder Scale&ndash;Short-Form (IGDS9-SF, APA framework); weekly time spent gaming" }
  - { label: "Analysis", value: "Welch&rsquo;s and Bayesian <i>t</i>-tests by gender, correlations with Holm correction and multiple linear regression, in R 4.0.4 and IBM SPSS" }
  - { label: "Data quality", value: "Exclusions for age, consent, English proficiency, a sham game item (&lsquo;Semeron&rsquo;), not gaming in the past year and implausible gaming hours; long-string screening for careless responding" }
