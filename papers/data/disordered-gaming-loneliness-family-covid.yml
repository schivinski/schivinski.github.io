question: >-
  Lockdowns and distancing during the COVID-19 pandemic pushed many people towards gaming, a pastime that can be
  enjoyed without anyone physically present, and campaigns even encouraged it. At the same time, isolation can breed
  loneliness and strain family life. Little was known about how gamers in particular fared. Comparing matched samples
  of gamers surveyed before the pandemic (2019) and during its first two years (2020 and 2021), we asked whether
  disordered gaming, loneliness and dysfunctional family harmony increased, and whether disordered gaming became more
  strongly linked with loneliness and poor family harmony.

implications:
  practical: >-
    Health professionals, families and the gaming industry should watch for rising disordered gaming among gamers in
    times of crisis, and for gaming used to cope with loneliness or a difficult home life. Prevention and support can
    target the link itself: gamers who feel lonely or whose family relations are strained are those for whom heavy
    gaming is most closely tied to problems.
  theoretical: >-
    The study shows that a sub-population such as gamers may not follow the same pandemic trends as the general
    population: loneliness and family harmony did not rise, yet disordered gaming did and became more closely tied to
    both. It also shows that results can differ depending on whether the WHO (Gaming Disorder) or APA (Internet Gaming
    Disorder) framework is used, supporting the study of both.

limitations:
  - "Data were self-reported in a cross-sectional online survey, so changes cannot be attributed causally to the pandemic."
  - "Each year is a different sample of gamers; the same people were not followed over time."
  - "Daily-life impairment was self-assessed; clinical interviews or objective gaming data would strengthen the findings."
  - "The samples were mostly young men, matched on socio-demographics rather than representative of all gamers."

faq:
  - q: "Did gaming disorder increase during COVID-19?"
    a: >-
      Among gamers, yes. Matched samples of 299 gamers each showed higher Gaming Disorder and Internet Gaming Disorder
      scores in 2020 and 2021 than in 2019, with medium effect sizes (Rozgonjuk et al., 2022).
  - q: "Were gamers lonelier during the pandemic?"
    a: >-
      Not on average: loneliness and family harmony did not change significantly between 2019, 2020 and 2021. But
      loneliness became more closely linked with disordered gaming, the correlation rising from about 0.2 to 0.4
      (Rozgonjuk et al., 2022).
  - q: "Do people game to cope with loneliness?"
    a: >-
      The stronger links between disordered gaming, loneliness and poor family harmony during the pandemic suggest that
      some gamers may have used gaming to cope, although the cross-sectional data cannot prove this
      (Rozgonjuk et al., 2022).
  - q: "What is the difference between Gaming Disorder and Internet Gaming Disorder?"
    a: >-
      Gaming Disorder is the WHO&rsquo;s officially recognised diagnosis (ICD-11); Internet Gaming Disorder is the
      APA&rsquo;s research diagnosis in the DSM-5. The study measured both and found broadly similar trends.

concepts:
  - term: "Gaming Disorder (GD)"
    definition: "A pattern of gaming with impaired control, increasing priority over other activities and continuation despite harm, recognised by the World Health Organization in ICD-11."
  - term: "Internet Gaming Disorder (IGD)"
    definition: "A condition for further study in the American Psychiatric Association&rsquo;s DSM-5, defined by nine criteria such as preoccupation, withdrawal and loss of interest in other activities."
  - term: "Family harmony"
    definition: "How peaceful, functional and harmonious a person&rsquo;s family relationships are; reverse-scored here as dysfunctional family harmony."
  - term: "Loneliness"
    definition: "The distressing feeling that one&rsquo;s social relationships are lacking in number or quality."
  - term: "Propensity score matching"
    definition: "A method that pairs respondents from different groups who have similar characteristics, so the groups can be compared fairly."

materials:
  - label: "Eligibility"
    text: "Respondents gave informed consent, were aged 12 to 80, proficient in English, had played video games in the past year, passed an attention check (denying play of a fictional game), were not professional gamers, and reported at most 119 hours of gaming a week and 48 hours at weekends."
  - label: "Matching"
    text: "From 47,503 eligible gamers, the analysis kept comparable ages (12 to 56) and countries with at least five respondents in 2020 and 2021 (37,394 gamers: 36,078 in 2019, 1,017 in 2020, 299 in 2021); the 2019 and 2020 samples were then matched to the 2021 sample by greedy nearest-neighbour propensity scores (seed 999)."
  - label: "Supplementary material"
    text: "The R packages used are listed in the article&rsquo;s supplementary data, available with the published version."

