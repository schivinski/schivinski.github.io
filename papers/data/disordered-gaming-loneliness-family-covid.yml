in_brief: >-
  Gamers reported more symptoms of disordered gaming during the COVID-19 pandemic than before it, while their
  loneliness and family harmony did not change. In three matched samples of 299 gamers each (2019, 2020 and 2021),
  disordered gaming also became more closely tied to loneliness and poorer family harmony, which suggests some gamers
  may have played to cope.

findings:
  - headline: "Disordered gaming rose during the pandemic."
    text: >-
      Gaming Disorder scores rose from 8.96 in 2019 to 10.69 in 2020 and 11.18 in 2021 (<i>F</i> = 30.99,
      <i>p</i> &lt; .001, &eta;&sup2;<sub>p</sub> = 0.065), and Internet Gaming Disorder scores from 18.29 to 21.92 and
      22.80 (<i>F</i> = 30.00, <i>p</i> &lt; .001), medium-sized increases over 2019 (Cohen&rsquo;s <i>d</i> = 0.47 to
      0.62) (Rozgonjuk et al., 2022).
  - headline: "Loneliness and family harmony stayed level."
    text: >-
      Across the three matched samples of 299 gamers, loneliness (<i>p</i> = .342) and dysfunctional family harmony
      (<i>p</i> = .576) did not differ between years, controlling for age and gender (Rozgonjuk et al., 2022).
  - headline: "Disordered gaming became more closely tied to loneliness."
    text: >-
      The correlation between loneliness and Gaming Disorder grew from &rho; = 0.207 in 2019 to 0.393 in 2021
      (<i>z</i> = 2.50, <i>p</i> = .013), and with Internet Gaming Disorder from 0.293 to 0.463 (<i>z</i> = 2.42,
      <i>p</i> = .015) (Rozgonjuk et al., 2022).
  - headline: "And to poorer family harmony in 2021."
    text: >-
      Gaming Disorder correlated more strongly with dysfunctional family harmony in 2021 (&rho; = 0.305) than in 2019
      (0.121) or 2020 (0.122); for Internet Gaming Disorder the 2021 rise was significant only against 2020 (0.143 to
      0.307, <i>p</i> = .035) (Rozgonjuk et al., 2022).

glance:
  - { label: "Design", value: "Repeated cross-sectional international online survey (Smart Gaming campaign, ESL) run in 2019, 2020 and 2021; three yearly samples matched by propensity scores; ANCOVAs with age and gender as covariates, Spearman partial correlations and Steiger tests in R 4.1.3" }
  - { label: "Participants", value: "897 gamers aged 12 to 56 (299 per year), matched from 37,394 eligible respondents on age, gender, country, education, employment and relationship status; mean age 24.4 to 25.2, 82% to 86% men; most often from France, Italy, the USA, Spain and Poland" }
  - { label: "Disordered gaming", value: "Gaming Disorder (WHO framework): Gaming Disorder Test, 4 items, &alpha; = 0.81 (Pontes et al., 2019). Internet Gaming Disorder (APA framework): IGDS9-SF, 9 items, &alpha; = 0.87 (Pontes &amp; Griffiths, 2015)" }
  - { label: "Family harmony", value: "Family Harmony Scale, 5 items, scored so that higher means more dysfunctional family harmony, &alpha; = 0.90 (Kavikondala et al., 2016)" }
  - { label: "Loneliness", value: "Three-item UCLA Loneliness Scale, &alpha; = 0.83 (Hughes et al., 2004)" }
  - { label: "Ethics", value: "Approved by the research team&rsquo;s university ethics committee (PONTES 2018/95, Nottingham Trent University); anonymous participation with electronic informed consent" }

