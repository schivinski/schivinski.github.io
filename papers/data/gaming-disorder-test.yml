in_brief: >-
  The Gaming Disorder Test (GDT) is a four-item questionnaire that measures gaming disorder as the World Health
  Organization defines it in ICD-11. In 560 gamers from China and the United Kingdom, the four items formed a single
  reliable factor, related as expected to loneliness, depression and weekly gaming time, and correlated strongly with an
  established measure of Internet gaming disorder.

scale:
  name: "Gaming Disorder Test (GDT)"
  short: "GDT"
  summary: >-
    Four items, one for each feature of gaming disorder in ICD-11: impaired control, increasing priority given to gaming,
    continued gaming despite negative consequences, and significant problems in life. Respondents report how often each
    occurred over the past 12 months. Takes under a minute. Free to use in research and practice; please cite the
    article.
  facts:
    - { label: "Items", value: "4 (one dimension), mapped onto the ICD-11 criteria" }
    - { label: "Response format", value: "1 = never, 2 = rarely, 3 = sometimes, 4 = often, 5 = very often; past 12 months" }
    - { label: "Scoring", value: "Sum of the four items (range 4–20); higher scores mean more severe gaming disorder" }
    - { label: "Reliability", value: "Cronbach’s α = 0.84 overall (China 0.87, UK 0.84); composite reliability = 0.85 to 0.87" }
    - { label: "Validated with", value: "560 gamers: 236 in China (Mandarin version) and 324 in the UK (English version)" }
  response_labels: ["Never", "Rarely", "Sometimes", "Often", "Very often"]
  response_codes: [1, 2, 3, 4, 5]
  score: sum
  introduction:
    label: "Instructions"
    source: article
    text: >-
      The questions below are about your gaming activity during the past year (i.e., last 12 months). Here, gaming
      activity means any gaming-related activity that has been played either from a computer/laptop or from a gaming
      console or any other kind of device (e.g., mobile phone, tablet) both online and/or offline.
  pre_questions:
    - id: SCREEN
      title: "Screening"
      type: yesno
      source: article
      text: "Have you played any video game in the past 12 months?"
      note: "Code No = 0 and Yes = 1 (in Qualtrics, set these as recode values). Respondents who answer “No” do not continue. This is the eligibility question used in the article."
      note_audience: researcher
      options: [{ code: 0, label: "No" }, { code: 1, label: "Yes" }]
      keep: 1
  block_instruction: "Please indicate how often the following issues occurred on average over the past twelve months until today."
  block_instruction_source: article
  dimensions:
    - code: "GD"
      name: "Gaming disorder"
      definition: "Items 1 to 3 map onto the three ICD-11 core criteria; item 4 captures significant impairment in life."
      items:
        - { id: "GDT1", text: "I have had difficulties controlling my gaming activity.", label_in_article: "GDT item 1 (impaired control)", loading: "0.73" }
        - { id: "GDT2", text: "I have given increasing priority to gaming over other life interests and daily activities.", label_in_article: "GDT item 2 (increased priority)", loading: "0.79" }
        - { id: "GDT3", text: "I have continued gaming despite the occurrence of negative consequences.", label_in_article: "GDT item 3 (continuation despite negative consequences)", loading: "0.79" }
        - { id: "GDT4", text: "I have experienced significant problems in life (e.g., personal, family, social, education, occupational) due to the severity of my gaming behavior.", label_in_article: "GDT item 4 (significant problems in life)", loading: "0.74" }
  administration:
    - "Ask the screening question first; the article included only people who had played a video game in the past 12 months."
    - "Keep the 12-month time frame: ICD-11 requires the gaming pattern to be evident over at least 12 months."
    - "The items cover online and offline gaming on any device (computer, console, phone, tablet)."
    - "The GDT measures the severity of gaming disorder; it does not diagnose it. A diagnosis needs a clinical assessment."
    - "English and Mandarin versions were tested in the article. For other languages, translate and back-translate the items, and check measurement invariance before comparing groups or countries."
  scoring:
    - "Code responses 1 (never) to 5 (very often)."
    - "Total score = sum of GDT1 to GDT4 (range 4–20); higher scores mean more severe gaming disorder."
    - "For research classification, an item is endorsed when answered 4 (often) or 5 (very often). Respondents who endorse all four items can be classified as potentially disordered gamers."
    - "In the original data the mean total score was 6.89 (SD = 3.17), and 1.8% of gamers endorsed all four items (China 1.7%, UK 1.9%)."
    - "For latent-variable models, specify one factor with the four items. The article added weekly gaming time, gender and age as covariates (MIMIC model, Figure 1)."
  intro_note: >-
    The instructions, items, response format and scoring are as published in the article’s appendix (only the spelling
    of “occurred” is corrected). The screening question is the eligibility question described in the article’s method.
  copy_footer: >-
    Scoring: sum the four items (4–20). An item is endorsed when answered 4 (often) or 5 (very often); endorsing all
    four items classifies a potentially disordered gamer for research purposes.
  admin_box: >-
    Ask the screening question first and keep the 12-month time frame. Code answers 1 to 5; the total score is the sum
    of the four items (4 to 20). An item is endorsed when answered 4 or 5; endorsing all four items classifies a
    potentially disordered gamer for research purposes. The GDT measures severity and does not replace a clinical
    diagnosis. Instructions, items and response format are as published.
  analysis:
    title: "GDT: one-factor CFA and MIMIC model"
    r_options: 'estimator = "ML", missing = "fiml"'
    estimator_note: "maximum likelihood with full information for missing data (FIML), as in the article"
    r_extra: |

      # 4. Criteria endorsed and research classification (article's appendix)
      endorsed <- dat[items$gaming_disorder] >= 4      # answered "often" or "very often"
      dat$gdt_criteria <- rowSums(endorsed)            # number of criteria endorsed, 0-4
      dat$gdt_disordered <- dat$gdt_criteria == 4      # all four criteria endorsed
      table(dat$gdt_disordered)
      prop.table(table(dat$gdt_disordered))

      # 5. MIMIC model (Figure 1): weekly gaming time, gender and age predicting gaming disorder.
      #    Needs columns weekly_hours, gender (0/1) and age.
      model_mimic <- paste(model_cfa, "
        gaming_disorder ~ weekly_hours + gender + age
      ")
      fit_mimic <- sem(model_mimic, data = dat, estimator = "ML", missing = "fiml",
                       se = "bootstrap", bootstrap = 5000)
      summary(fit_mimic, fit.measures = TRUE, standardized = TRUE)

      # 6. Concurrent validity (Table 3): correlation with the IGDS9-SF total score, if collected
      # cor.test(dat$gaming_disorder_score, dat$igds9sf_total)
    mplus_estimator: "ML"
    mplus_estimator_note: "add BOOTSTRAP = 5000; for bootstrapped SEs"
    mplus_extra: |

      ! MIMIC model (Figure 1): add weekly_hours, gender and age to
      ! NAMES and USEVARIABLES, then remove the "!" below
      ! GD ON weekly_hours gender age;
    mplus_notes: |

      ! Total score = sum of gdt1-gdt4 (4-20). An item is endorsed when answered
      ! 4 or 5; endorsing all four items classifies a potentially disordered gamer.
  downloads:
    - { label: "Questionnaire (PDF, print-ready)", file: "materials/gdt/gdt-questionnaire.pdf" }
    - { label: "Qualtrics import file (.txt)", file: "materials/gdt/gdt-qualtrics-import.txt" }
    - { label: "Item codebook (.csv)", file: "materials/gdt/gdt-codebook.csv" }
    - { label: "R script: scoring, classification, CFA and MIMIC model (.R)", file: "materials/gdt/gdt-analysis.R" }
    - { label: "Mplus input: CFA and MIMIC model (.inp)", file: "materials/gdt/gdt-cfa.inp" }

findings:
  - headline: "One factor, four items."
    text: >-
      A confirmatory factor analysis with covariates (MIMIC model) supported a single gaming disorder factor in 560 gamers
      (&chi;&sup2;(11) = 46.22, CFI = 0.97, TLI = 0.94, RMSEA = 0.07, SRMR = 0.03), with standardised loadings of 0.73 to
      0.79 and similar results in the Chinese and British samples (Pontes et al., 2021).
  - headline: "Reliable in China and the UK."
    text: >-
      Cronbach’s alpha was 0.84 overall, 0.87 in China and 0.84 in the UK; composite reliability was 0.85 to 0.87 and
      average variance extracted 0.59 to 0.63, supporting convergent and discriminant validity (Pontes et al., 2021).
  - headline: "Agrees with an established measure."
    text: >-
      GDT scores correlated r = 0.82 to 0.83 with the Internet Gaming Disorder Scale–Short-Form (IGDS9-SF) in the
      overall, Chinese and British samples (bootstrapped 95% BCa confidence intervals), indicating strong concurrent
      validity (Pontes et al., 2021).
  - headline: "Linked to loneliness, depression and gaming time."
    text: >-
      Gaming disorder correlated with loneliness (r = 0.45) and depression (r = 0.47), and weekly time spent gaming
      predicted it (&beta; = 0.41); the model explained 23% of the variance in gaming disorder (Pontes et al., 2021).
  - headline: "Few gamers met all four criteria."
    text: >-
      1.8% of gamers endorsed all four criteria (China 1.7%, UK 1.9%), with no significant difference between countries
      (Pontes et al., 2021).

