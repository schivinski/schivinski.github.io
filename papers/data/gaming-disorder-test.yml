question: >-
  In 2018 the World Health Organization recognised gaming disorder in the 11th revision of the International
  Classification of Diseases (ICD-11), defined by impaired control over gaming, increasing priority given to gaming, and
  continued gaming despite negative consequences, with significant impairment in life. Existing questionnaires followed
  the nine criteria for Internet gaming disorder in the DSM-5, which differ from the WHO framework. There was no
  standardised tool to measure gaming disorder as the WHO defines it. This study developed one and tested it in China and
  the United Kingdom.

implications:
  practical: >-
    Researchers, clinicians and public-health teams get a brief, free tool aligned with the official WHO definition. With
    four items it fits large surveys and epidemiological studies, and the endorsement rule (answering “often” or “very
    often” to all four items) gives a consistent way to identify potentially disordered gamers for research. English and
    Mandarin versions are available. The GDT measures severity; it is not a diagnostic instrument and does not replace
    clinical assessment.
  theoretical: >-
    The study gives empirical support to the WHO’s conceptualisation of gaming disorder as a single construct built on
    impaired control, increased priority and continuation despite harm, plus significant impairment. Unlike the DSM-5
    framework, the WHO criteria leave out withdrawal and tolerance, so prevalence and diagnostic properties may differ
    between the two frameworks. The positive links with loneliness and depression place the GDT within the expected
    nomological network of mental-health constructs.

limitations:
  - "Both samples were convenience samples of university students, so the findings may not represent all Chinese and British gamers."
  - "All measures were self-reports collected online, which can be affected by social desirability and recall bias."
  - "No clinical sample was included, so robust diagnostic cut-off points could not be established; future research should test the GDT with clinically diagnosed individuals."
  - "Future studies should test the GDT in more culturally diverse samples and age groups, and use larger samples and methods such as latent profile analysis to establish its diagnostic properties."

faq:
  - q: "How can I measure gaming disorder according to the WHO ICD-11 criteria?"
    a: >-
      The Gaming Disorder Test (GDT) has four items that map onto the ICD-11 criteria: impaired control, increasing
      priority given to gaming, continued gaming despite negative consequences, and significant problems in life. Answers
      refer to the past 12 months, on a scale from 1 (never) to 5 (very often) (Pontes et al., 2021).
  - q: "How is the Gaming Disorder Test scored?"
    a: >-
      Sum the four items for a total score from 4 to 20, with higher scores meaning more severe gaming disorder. For
      research classification, an item is endorsed when answered 4 (often) or 5 (very often); respondents who endorse all
      four items can be classified as potentially disordered gamers (Pontes et al., 2021).
  - q: "What is the difference between the GDT and the IGDS9-SF?"
    a: >-
      The IGDS9-SF follows the nine DSM-5 criteria for Internet gaming disorder; the GDT follows the WHO’s ICD-11
      framework for gaming disorder, which has fewer criteria and no withdrawal or tolerance. The two scales correlated
      r = 0.82 to 0.83 in Chinese and British gamers (Pontes et al., 2021).
  - q: "How common is gaming disorder among gamers?"
    a: >-
      In a sample of 560 Chinese and British university gamers, 1.8% endorsed all four GDT criteria (China 1.7%, UK
      1.9%), with no significant difference between countries (Pontes et al., 2021).
  - q: "Is the GDT reliable?"
    a: >-
      Yes. Cronbach’s alpha was 0.84 overall, 0.87 in China and 0.84 in the UK, with composite reliability of 0.85 to
      0.87 (Pontes et al., 2021).

concepts:
  - term: "Gaming disorder (ICD-11)"
    definition: "A pattern of persistent or recurrent online or offline gaming marked by impaired control over gaming, increasing priority given to gaming over other interests and daily activities, and continuation or escalation despite negative consequences, severe enough to cause significant impairment, normally over at least 12 months."
  - term: "Internet gaming disorder (DSM-5)"
    definition: "A tentative condition in Section III of the DSM-5, defined by five or more of nine criteria over 12 months, including withdrawal and tolerance, which the ICD-11 definition does not include."
  - term: "MIMIC model"
    definition: "A multiple-indicator multiple-causes model: a confirmatory factor analysis in which observed covariates (here weekly gaming time, gender and age) predict the latent factor."
  - term: "Concurrent validity"
    definition: "The degree to which a new measure correlates with an established measure of the same construct administered at the same time; the article treats r ≥ 0.75 as sufficient."
  - term: "Nomological validity"
    definition: "Evidence that a measure relates to other constructs as theory predicts; here, gaming disorder correlated positively with loneliness and depression."

