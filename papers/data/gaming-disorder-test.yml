  - { label: "Participants", value: "560 gamers aged 18–49 who had played video games in the past 12 months: 236 university students in Beijing, China, and 324 university students in the East Midlands and Greater London, UK" }
  - { label: "Measures", value: "GDT; Internet Gaming Disorder Scale–Short-Form (IGDS9-SF); three-item UCLA Loneliness Scale; Patient Health Questionnaire (PHQ-9); weekly gaming time, gender and age" }
