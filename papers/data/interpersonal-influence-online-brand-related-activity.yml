in_brief: >-
  People who take other consumers&rsquo; information as evidence engage more with brands on social media; wanting to
  fit in does not. In a survey of 911 Polish social media users following 223 brands, informational influence
  predicted consuming, contributing to and creating brand-related content, while normative influence predicted none
  of them.

findings:
  - headline: "Informational influence drives all three types of brand-related activity."
    text: >-
      Susceptibility to informational influence predicted consuming (&beta; = 0.39), contributing to (&beta; = 0.32)
      and creating (&beta; = 0.40) brand-related social media content, controlling for age, gender, social media usage
      and brand usage (Brzozowska-Woś &amp; Schivinski, 2019).
  - headline: "Normative influence has no direct effect."
    text: >-
      Susceptibility to normative influence did not predict consuming (&beta; = 0.08), contributing (&beta; = 0.05) or
      creating (&beta; = &minus;0.06) brand-related content (Brzozowska-Woś &amp; Schivinski, 2019).
  - headline: "Heavier social media users engage more with brands."
    text: >-
      Social media usage predicted all three types of activity (&beta; = 0.14 to 0.20), and older respondents
      contributed and created slightly more brand-related content (&beta; = 0.12 and 0.10) (Brzozowska-Woś &amp;
      Schivinski, 2019).
  - headline: "Sharing valuable content looks like pro-social behaviour."
    text: >-
      Consumers engage with brand-related content to create valuable sources of information for themselves and for
      other users, rather than to enhance their image or meet others&rsquo; expectations (Brzozowska-Woś &amp;
      Schivinski, 2019).

