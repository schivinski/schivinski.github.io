question: >-
  Consumers consume, contribute to and create brand-related content on social media, and social media are built on
  interpersonal relationships. Yet little was known about whether susceptibility to interpersonal influence, in its
  informational and normative forms, explains these consumers&rsquo; online brand-related activities (COBRAs). We
  tested both forms of influence on the three types of COBRAs among Polish social media users.

implications:
  practical: >-
    Brand content that consumers see as valuable information is more likely to be read, shared and recreated than
    content that appeals to image or social approval. Managers should consider consumers&rsquo; age and gender, the
    type of content, its perceived value and the social medium used.
  theoretical: >-
    The study is the first to test both informational and normative interpersonal influence on the three types of
    COBRAs, and shows that only informational influence has a direct effect, which suggests that brand-related
    engagement can be a form of pro-social information sharing.

limitations:
  - "Cross-sectional data from a single country, with a non-random online sample."
  - "The SUSCEP and CEBSC scales could be extended, and social media functions change quickly."
  - "Mediators and moderators such as content type, brand experience and brand perception, and differences between age cohorts, were not tested."

faq:
  - q: "Does social influence make consumers engage with brands on social media?"
    a: >-
      Informational influence does: consumers who accept information from others as evidence consume, contribute to
      and create more brand-related content. Normative influence, the wish to meet others&rsquo; expectations, had no
      direct effect (Brzozowska-Woś &amp; Schivinski, 2019).
  - q: "What are COBRAs?"
    a: >-
      Consumer&rsquo;s online brand-related activities: consuming (reading and watching), contributing (liking,
      commenting, sharing) and creating (posting and reviewing) brand-related content on social media (Muntinga et al.,
      2011; Schivinski et al., 2016).
  - q: "What is susceptibility to interpersonal influence?"
    a: >-
      A consumer&rsquo;s tendency to be influenced by others, either by accepting their information as evidence about
      reality (informational) or by conforming to their expectations and standards (normative) (Bearden et al., 1989).
  - q: "Do age and gender matter for brand engagement on social media?"
    a: >-
      In this sample, older respondents contributed and created slightly more brand-related content, and heavier social
      media users engaged more in all three activities (Brzozowska-Woś &amp; Schivinski, 2019).

concepts:
  - term: "COBRAs"
    definition: "Consumer&rsquo;s online brand-related activities, a framework that groups engagement with brand-related social media content into consuming, contributing and creating."
  - term: "Informational influence"
    definition: "The tendency to accept information from others as evidence about reality (Bearden et al., 1990)."
  - term: "Normative influence"
    definition: "The tendency to conform to others&rsquo; expectations, either to enhance one&rsquo;s image (value expressive) or to gain rewards and avoid punishment (utilitarian)."
  - term: "SUSCEP"
    definition: "The Consumer Susceptibility to Interpersonal Influence scale of Bearden, Netemeyer and Teel (1989)."

