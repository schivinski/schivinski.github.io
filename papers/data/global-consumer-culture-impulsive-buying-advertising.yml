question: >-
  Globalisation spreads a consumer culture of global brands, media and consumption, and impulsive buying is rising in
  developed and developing economies alike. Earlier work had linked acculturation to global consumer culture with
  materialism and other dispositions, but not with impulsive buying, and had not asked how people's views of
  advertising, a main carrier of that culture, shape the link. We asked whether consumers more acculturated to global
  consumer culture buy more impulsively and like advertising more, and whether attitudes towards and beliefs about
  advertising strengthen or weaken the effect.

implications:
  practical: >-
    Global brands can expect consumers who are more immersed in global consumer culture to respond well to
    advertising, and can build on that by keeping advertising ethical, truthful, entertaining and non-intrusive. For
    consumer groups, regulators and responsible retailers the warning is that sceptical views of advertising do not
    shield people from impulse buying driven by global consumer culture; advertising literacy programmes, public
    service advertising that frames impulse buying as a global issue and showing its personal cost are possible ways
    to encourage more mindful purchasing.
  theoretical: >-
    The study links acculturation to global consumer culture with impulsive buying and with attitudes towards
    advertising, supporting acculturation theory. It also tests congruity theory: when acculturation and views of
    advertising are in line, impulse buying is highest, but when they clash, the effect of acculturation is strongest,
    which congruity theory does not fully explain and invites longitudinal work on how attitudes and behaviour realign.

limitations:
  - "The AGCC measure assumes a largely American-driven global consumer culture; future work could capture European or Asian influences, consumer ethnocentrism and other identities."
  - "An online, English-language survey of a self-selected sample of immigrants in one country limits generalisability; studies in respondents' native languages are needed."
  - "Impulsive buying was self-reported rather than observed, and the data are cross-sectional; longitudinal research could follow how acculturation changes buying over time."

faq:
  - q: "Does global consumer culture make people buy more on impulse?"
    a: >-
      In this study, yes. Among 426 immigrants in the UK, those more acculturated to global consumer culture reported
      more impulsive buying (&beta; = 0.24) (Czarnecka &amp; Schivinski, 2019).
  - q: "Do people who dislike advertising buy less impulsively?"
    a: >-
      They start lower, but the pull of global consumer culture is strongest for them: as acculturation rose, impulse
      buying increased most among people with less favourable attitudes towards advertising (interaction &minus;1.49)
      (Czarnecka &amp; Schivinski, 2019).
  - q: "Which parts of global consumer culture matter most?"
    a: >-
      Exposure to global mass media loaded most strongly on acculturation to global consumer culture (&lambda; = 0.68),
      followed by self-identification with global consumer culture (0.50) and social interactions such as travel
      (0.32) (Czarnecka &amp; Schivinski, 2019).
  - q: "Does believing advertising is misleading reduce impulse buying?"
    a: >-
      Directly, yes (&beta; = &minus;0.50 on impulsive buying), but it did not weaken the effect of global consumer
      culture; the interaction was positive (unst. &beta; = 3.42) (Czarnecka &amp; Schivinski, 2019).

concepts:
  - term: "Global consumer culture (GCC)"
    definition: "Consumption-related symbols, values and behaviours, such as global brands and media, that people around the world perceive as global."
  - term: "Acculturation to global consumer culture (AGCC)"
    definition: "How far a person has acquired the knowledge, skills and behaviours of global consumer culture, measured on seven dimensions such as cosmopolitanism, global media exposure and self-identification with GCC."
  - term: "Impulsive buying"
    definition: "Unplanned, compelling purchasing in which the speed of the decision precludes thoughtful consideration of alternatives."
  - term: "Attitude towards advertising"
    definition: "A learned tendency to respond favourably or unfavourably to advertising in general."
  - term: "Beliefs about advertising"
    definition: "Specific views of what advertising does: informs, creates social image, entertains, helps the economy, misleads and promotes materialism (Tan &amp; Chia, 2007)."
  - term: "Congruity theory"
    definition: "The idea that people strive for consistency between their attitudes, beliefs and behaviours."

materials:
