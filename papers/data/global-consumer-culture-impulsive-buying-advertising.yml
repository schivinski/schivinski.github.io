in_brief: >-
  People who are more immersed in global consumer culture buy more on impulse and like advertising more. In a survey of
  426 immigrants living in the UK, the rise in impulse buying was steepest among people who disliked advertising, so
  negative views of advertising did not protect them.

findings:
  - headline: "Global consumer culture goes with more impulse buying."
    text: >-
      In a survey of 426 immigrants from 35 countries living in the UK, acculturation to global consumer culture
      (AGCC) increased impulsive buying (&beta; = 0.24, <i>p</i> = .004) (Czarnecka &amp; Schivinski, 2019).
  - headline: "It also makes people like advertising more."
    text: >-
      More acculturated consumers held more positive attitudes towards advertising in general (&beta; = 0.37,
      <i>p</i> &lt; .001); together with age, gender and income, the model explained 16% of the variance in impulsive
      buying and 17% in attitudes towards advertising (Czarnecka &amp; Schivinski, 2019).
  - headline: "Disliking advertising does not protect against the pull of global culture."
    text: >-
      The effect of AGCC on impulsive buying was strongest among people with less favourable attitudes towards
      advertising (interaction unst. &beta; = &minus;1.49, <i>p</i> = .01) and with weaker beliefs that advertising is
      entertaining (&minus;2.53, <i>p</i> = .001), informative (&minus;1.15, <i>p</i> = .04) or good for the economy
      (&minus;2.16, <i>p</i> = .01); those who already liked advertising bought impulsively at every level of AGCC
      (Czarnecka &amp; Schivinski, 2019).
  - headline: "Seeing advertising as deceptive did not slow the effect either."
    text: >-
      Believing that advertising is misleading strengthened, rather than weakened, the link between AGCC and impulsive
      buying (unst. &beta; = 3.42, <i>p</i> = .009), while beliefs that advertising promotes materialism had no
      moderating effect (<i>p</i> = .66) (Czarnecka &amp; Schivinski, 2019).
  - headline: "Younger consumers and women bought more on impulse."
    text: >-
      Age reduced impulsive buying (&beta; = &minus;0.30, <i>p</i> = .001), women bought more impulsively than men
      (&beta; = 0.16, <i>p</i> = .001), and income had a marginal positive effect (&beta; = 0.09, <i>p</i> = .06)
      (Czarnecka &amp; Schivinski, 2019).

