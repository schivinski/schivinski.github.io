question: >-
  Online firestorms, sudden floods of complaints about a brand on social media, threaten reputation and sales, and
  companies reply hoping to stop people from passing the complaint on. Situational crisis communication theory says
  that when a crisis is preventable and the firm is to blame, it should accept responsibility, but it does not say
  whether an apology or a corrective action works better, nor how the reply curbs sharing. We asked whether a reply
  changes brand attitude, whether that brand attitude reduces intentions to forward the complaint, and whether apology
  and corrective action differ in this effect.

implications:
  practical: >-
    Brands should always reply to complaints that could escalate: almost a third of negative posts on social media get
    no response at all. Because brand attitude carries the effect, community managers should craft replies that are
    likeable, agreeable and appealing in wording and structure. In general an apology is the safer choice; when the
    complaint is about a core business problem or unprofessional communication, an apology or a corrective action can
    be chosen depending on what is operationally and legally convenient, which calls for careful protocols and
    training.
  theoretical: >-
    The study extends situational crisis communication theory to online firestorms on social media and shows that it
    fits this context. It identifies brand attitude as the mechanism through which matching response strategies curb
    intentions to forward negative content, and it separates the effects of two accommodative strategies, apology and
    corrective action, which the theory had treated as equivalent, showing that the type of incident matters.

limitations:
  - "Participants volunteered, so the sample consists mostly of frequent Facebook users."
  - "The brand was fictitious, and the wording of the three complaints varied somewhat."
  - "Future work could add crisis history, prior reputation and the volume of complaints, and test forgiveness and personal identification with the incident as mechanisms."

faq:
  - q: "Should a brand apologise or fix the problem during an online firestorm?"
    a: >-
      In general an apology worked best: in an experiment with 564 Facebook users, better brand attitude after an
      apology reduced intentions to share the complaint more than after a corrective action. For service failures and
      unprofessional communication both worked about as well (Langaro et al., 2024).
  - q: "Does replying to a complaint on Facebook help a brand?"
    a: >-
      Yes. Brand attitude rose from 2.21 to 3.54 out of 7 after the brand replied, and better brand attitude lowered
      intentions to forward the complaint (Langaro et al., 2024).
  - q: "What is an online firestorm?"
    a: >-
      A sudden flood of negative comments and complaints about a brand or person on social media, often triggered by a
      single complaint and amplified as others join in and share it.
  - q: "What is situational crisis communication theory (SCCT)?"
    a: >-
      A theory that matches a firm&rsquo;s crisis response to how responsible the public thinks it is: the more
      preventable the crisis, the more the reply should accept responsibility, for example by apologising or taking
      corrective action (Coombs, 2007).

concepts:
  - term: "Online firestorm"
    definition: "A sudden discharge of large numbers of negative messages about a brand on social media (Pfeffer, Zorbach &amp; Carley, 2014)."
  - term: "Situational crisis communication theory (SCCT)"
    definition: "A theory that matches crisis response strategies to the responsibility the public attributes to the organisation (Coombs, 2007)."
  - term: "Apology"
    definition: "A victim-centred response in which the organisation expresses remorse and accepts responsibility."
  - term: "Corrective action"
    definition: "A victim-centred response in which the organisation fixes the problem and commits to preventing it from happening again."
  - term: "Brand attitude"
    definition: "A consumer&rsquo;s overall evaluation of a brand, from bad to good and unappealing to appealing."
  - term: "Negative e-WOM"
    definition: "Negative electronic word of mouth: sharing or forwarding unfavourable brand-related content to others online."

materials:
  - label: "Complaints (stimuli)"
    text: "Unethical behaviour: &lsquo;How are you capable of throwing waste &ndash; that you created &ndash; in the river that flows through the city? You are polluting the environment and affecting public health? DEPLORABLE and SHAMEFUL unethical practice!&rsquo; Core business problem: &lsquo;I have been trying to contact your customer service for over 2 weeks without success. There are other clients in the same situation! UNACCEPTABLE and OUTRAGEOUS business practice!&rsquo; Unprofessional communication: &lsquo;How were you capable of deleting my comment without responding to me? And apparently, I am not the only one complaining! INCOMPREHENSIBLE and UNFORGIVABLE communication practice!&rsquo;"
  - label: "Replies (stimuli)"
    text: "Apology: &lsquo;We are very sorry for what happened, and we assume responsibility. On behalf of Lusoretail, please accept our sincere apologies&rsquo;. Corrective action: &lsquo;We are already taking corrective actions to solve the problem immediately. In the future, actions will be taken to prevent an incident like this from happening again at Lusoretail&rsquo;."
  - label: "Scale items"
    text: "Brand attitude (7-point semantic differentials): unappealing/appealing, bad/good, unpleasant/pleasant, unfavorable/favorable, unlikable/likable. Intention to forward the negative post (1 = completely disagree, 7 = completely agree): &lsquo;This Facebook post is worth sharing with others&rsquo;; &lsquo;I will forward this Facebook post to others&rsquo;."

