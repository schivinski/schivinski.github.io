in_brief: >-
  When an angry complaint about a brand starts spreading on Facebook, the brand's reply changes how people feel about
  it, and better feelings make them less willing to share the complaint. In an online experiment with 564 Facebook
  users in Portugal, an apology worked best overall, but for service failures and unprofessional communication a
  corrective action did just as well.

findings:
  - headline: "A reply to the complaint lifts brand attitude."
    text: >-
      After reading a complaint on the brand&rsquo;s Facebook page, participants&rsquo; attitude towards the brand
      averaged 2.21 out of 7; after the brand&rsquo;s reply it rose to 3.54 (<i>p</i> &lt; .001), for all three types of
      incident (Langaro et al., 2024).
  - headline: "A better brand attitude reduces the urge to share the complaint."
    text: >-
      Brand attitude after the reply lowered intentions to forward the negative post to others (&beta; = &minus;.178,
      <i>p</i> &lt; .001), controlling for gender and age (Langaro et al., 2024).
  - headline: "An apology works best in general."
    text: >-
      The type of reply moderated this effect (interaction &beta; = .262, <i>p</i> &lt; .05): after an apology, better
      brand attitudes cut forwarding intentions far more steeply than after a corrective action (Langaro et al., 2024).
  - headline: "For service and communication failures, both replies work."
    text: >-
      For complaints about core business problems (poor customer service) or unprofessional communication (deleted
      comments), the moderation was not significant: apologies and corrective actions performed comparably
      (Langaro et al., 2024).

glance:
  - { label: "Design", value: "Online experiment on Qualtrics: each participant saw one of three simulated Facebook complaints about a fictitious retailer (Lusoretail), rated the brand, saw a randomly assigned reply (apology or corrective action) and rated the brand again" }
  - { label: "Participants", value: "564 Facebook users in Portugal recruited through Facebook (survey in Portuguese, back-translated); 58.3% men; ages 18 to 65 and over; 282 saw each reply" }
  - { label: "Incidents", value: "Unethical behaviour (dumping waste in a river), a core business problem (unreachable customer service) and unprofessional communication (deleting critical comments), all high-arousal and with the firm in control (preventable crises)" }
  - { label: "Measures", value: "Brand attitude: five 7-point semantic differential items (Spears &amp; Singh, 2004), &alpha; = 0.97. Intention to forward the negative post: two items (Chiu et al., 2007), &alpha; = 0.92" }
  - { label: "Analysis", value: "Paired <i>t</i>-test (H1), multiple regression with gender and age as controls (H2) and moderation with PROCESS 3.5 (H3), in SPSS 25" }

