in_brief: >-
  Polish Internet users mostly consume brand content online, such as looking at brand photos and ads and reading
  reviews; far fewer comment, like or create content about brands. In a survey of 2,253 users, men created and
  contributed more brand-related content than women, while women read more promotional emails and looked at more ads.

findings:
  - headline: "Consuming brand content is far more common than creating it."
    text: >-
      Among 2,253 Polish Internet users, consuming activities (mean scores up to 4.3 on a 1&ndash;7 scale) were more
      frequent than contributing (up to 3.6) and creating activities (2.0 to 2.2), and for every creating activity more
      than half of respondents answered &ldquo;never&rdquo; (Schivinski &amp; Brzozowska-Woś, 2015).
  - headline: "Photos, ads and reviews draw the most attention."
    text: >-
      The most frequent consuming activities were looking at brand photos and graphics (mean 4.3), looking at the
      brand&rsquo;s ads such as banners (4.2) and reading product reviews (4.1) (Schivinski &amp; Brzozowska-Woś, 2015).
  - headline: "&ldquo;Liking&rdquo; is the main way consumers contribute."
    text: >-
      Among contributing activities, &ldquo;liking&rdquo; the brand&rsquo;s fan pages (mean 3.6), videos and posts (3.2)
      was most frequent; commenting on brand content was rare (2.3 to 2.5) (Schivinski &amp; Brzozowska-Woś, 2015).
  - headline: "Men create and contribute more brand content than women."
    text: >-
      Men scored significantly higher than women on all eight creating activities and on most contributing ones, for
      example commenting on brand videos (2.57 vs 2.07), while women read more promotional emails (2.94 vs 2.73) and
      looked at more ads (4.37 vs 4.04) (Schivinski &amp; Brzozowska-Woś, 2015).

