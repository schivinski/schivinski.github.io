question: >-
  Social media let consumers consume, contribute to and create content about brands, but no study had systematically
  measured how often consumers in Poland engage in these consumer&rsquo;s online brand-related activities (COBRAs).
  We asked how Polish Internet users divide their engagement across consuming, contributing and creating brand-related
  content, and whether this differs between women and men.

implications:
  practical: >-
    Brand managers should publish attractive visual content on their own sites and across social media and keep using
    display advertising, which Polish consumers still notice. Campaigns can be targeted by gender (graphic and email
    advertising for women; videos and blogs for men), and brands should add &ldquo;like&rdquo; and sharing tools,
    run crowdsourcing initiatives and work with their most active consumers as ambassadors.
  theoretical: >-
    The results support Muntinga, Moorman and Smit&rsquo;s view that COBRAs run from consuming through contributing to
    creating, with engagement falling at each level, and show gender differences at all three levels.

limitations:
  - "Social media channels (social networks, microblogs, blogs, forums) were not analysed separately."
  - "The sample included only Polish consumers, and some brands operate only on the local market."
  - "The study is exploratory; the next steps were a COBRA measurement instrument and the effect of COBRAs on brand equity."

faq:
  - q: "What do Polish consumers do online with brands?"
    a: >-
      Mostly consume brand content: they look at brand photos and ads and read product reviews. Liking brand content
      is less common, and creating brand-related content is rare (Schivinski &amp; Brzozowska-Woś, 2015).
  - q: "Are men or women more active with brands online?"
    a: >-
      In 2,253 Polish Internet users, men created and contributed more brand-related content, while women read more
      promotional emails and looked at more ads (Schivinski &amp; Brzozowska-Woś, 2015).
  - q: "What are COBRAs?"
    a: >-
      Consumer&rsquo;s online brand-related activities: consuming, contributing to and creating brand-related content
      online (Muntinga, Moorman &amp; Smit, 2011).
  - q: "Is this article available in English?"
    a: >-
      The article is in Polish, with an English abstract on the e-mentor website. This page summarises it in English,
      with the activities and tables translated.

concepts:
  - term: "COBRAs"
    definition: "Consumer&rsquo;s online brand-related activities, grouped into consuming, contributing and creating brand-related content."
  - term: "Consuming COBRA type"
    definition: "The lowest level of brand-related activity: passively reading, watching and following brand content."
  - term: "Contributing COBRA type"
    definition: "A medium level of activity: interacting with existing brand content by liking, commenting or rating, without creating original content."
  - term: "Creating COBRA type"
    definition: "The highest level of activity: producing and publishing brand-related content that others consume and share."

