in_brief: >-
  In a survey of 302 Polish Facebook users who had “Liked” 60 brands in three industries, content that other users post
  about a brand raised brand awareness and associations, brand loyalty and perceived quality, while content the brand
  posts itself raised only awareness and associations. The effects differed between non-alcoholic beverages, clothing and
  mobile network providers.

scale:
  name: "Social media brand communication and brand equity measures"
  short: "SMBC"
  section_title: "Use the measures"
  file_stem: "smbc"
  summary: >-
    The full set of measures used in the article: firm-created and user-generated social media brand communication
    (four items each), brand awareness/associations (four items), brand loyalty (three items) and perceived quality
    (three items), 18 items in total. Respondents name a brand they follow on Facebook and answer on a seven-point
    agreement scale. Free to use in research and practice; please cite the article.
  facts:
    - { label: "Items", value: "18 in five constructs: firm-created (4) and user-generated (4) social media communication, brand awareness/associations (4), brand loyalty (3), perceived quality (3)" }
    - { label: "Response format", value: "7-point Likert scale from 1 = strongly disagree to 7 = strongly agree" }
    - { label: "Scoring", value: "Mean of the items in each construct (range 1–7)" }
    - { label: "Reliability", value: "Cronbach’s α = 0.84 to 0.95; composite reliability = 0.85 to 0.95; AVE = 0.59 to 0.86" }
    - { label: "Validated with", value: "302 Facebook users in Poland, 60 brands in three industries" }
  response_labels: ["Strongly disagree", "", "", "", "", "", "Strongly agree"]
  response_codes: [1, 2, 3, 4, 5, 6, 7]
  score: mean
  introduction:
    label: "Introduction"
    source: suggested
    text: >-
      This survey is about a brand you follow on Facebook. Brands post their own content on their Facebook pages, such
      as photos, videos and news from the company. Other Facebook users also post content about brands, such as
      comments, photos and reviews. There are no right or wrong answers.
  pre_questions:
    - id: BRAND
      title: "Your brand"
      type: text
      source: suggested
      text: "Please type the name of a brand that you have “Liked” on Facebook."
      note: "You will answer the following questions about this brand. Wherever you see [brand], think of the brand you named."
  block_prefix: "Think about [brand]."
  block_instruction: "Please indicate how much you agree or disagree with each statement."
  block_instruction_source: suggested
  placeholder: "[brand]"
  dimensions:
    - code: "FC"
      r_name: "fc"
      name: "Firm-created social media communication"
      definition: "Brand communication on social media created and managed by the company."
      items:
        - { id: "FC1", text: "I am satisfied with the company’s social media communications for [brand].", label_in_article: "FC1", loading: "0.90" }
        - { id: "FC2", text: "The level of the company’s social media communications for [brand] meets my expectations.", label_in_article: "FC2", loading: "0.91" }
        - { id: "FC3", text: "The company’s social media communications for [brand] are very attractive.", label_in_article: "FC3 (new item)", loading: "0.91" }
        - { id: "FC4", text: "This company’s social media communications for [brand] perform well, when compared with the social media communications of other companies.", label_in_article: "FC4", loading: "0.88" }
    - code: "UG"
      r_name: "ug"
      name: "User-generated social media communication"
      definition: "Content about the brand created and posted by other social media users, outside the company’s control."
      items:
        - { id: "UG1", text: "I am satisfied with the content generated on social media sites by other users about [brand].", label_in_article: "UG1", loading: "0.89" }
        - { id: "UG2", text: "The level of the content generated on social media sites by other users about [brand] meets my expectations.", label_in_article: "UG2", loading: "0.91" }
        - { id: "UG3", text: "The content generated by other users about [brand] is very attractive.", label_in_article: "UG3 (new item)", loading: "0.81" }
        - { id: "UG4", text: "The content generated on social media sites by other users about [brand] performs well, when compared with other brands.", label_in_article: "UG4", loading: "0.85" }
    - code: "BAW"
      r_name: "baw"
      name: "Brand awareness/associations"
      definition: "How easily consumers recognise and recall the brand and the associations it brings to mind."
      items:
        - { id: "BAS1", text: "I easily recognize [brand].", label_in_article: "BAS1", loading: "0.75" }
        - { id: "BAS2", text: "Several characteristics of [brand] instantly come to my mind.", label_in_article: "BAS2", loading: "0.63" }
        - { id: "BAS3", text: "I can quickly recall the symbol or logo of [brand].", label_in_article: "BAS3", loading: "0.74" }
        - { id: "BAS4", text: "I can recognize [brand] among other competing brands.", label_in_article: "BAS4 (printed as “X”)", loading: "0.93" }
    - code: "BL"
      r_name: "bl"
      name: "Brand loyalty"
      definition: "Commitment to keep buying from the brand."
      items:
        - { id: "BL1", text: "The prospect of lower prices would make me switch to another company.", label_in_article: "BL1 (reverse-scored)", loading: "0.93", reverse: true }
        - { id: "BL2", text: "If it were possible to do so without problems, I would choose another company.", label_in_article: "BL2 (reverse-scored)", loading: "0.92", reverse: true }
        - { id: "BL3", text: "I intend to remain the company’s customer.", label_in_article: "BL3", loading: "0.92" }
    - code: "PQ"
      r_name: "pq"
      name: "Perceived quality"
      definition: "The consumer’s judgement of the brand’s overall quality."
      items:
        - { id: "PQ1", text: "Most of the products of [brand] are of great quality.", label_in_article: "PQ1", loading: "0.86" }
        - { id: "PQ2", text: "The likelihood that [brand] is reliable is very high.", label_in_article: "PQ2", loading: "0.91" }
        - { id: "PQ3", text: "Products of [brand] are worth their price.", label_in_article: "PQ3", loading: "0.81" }
  administration:
    - "Ask respondents to name a brand they have “Liked” on Facebook, and insert that name into every item (for example with piped text in Qualtrics)."
    - "Give a short example of each type of content (posts by the brand, posts by other users) so that respondents can tell firm-created and user-generated communication apart, as in the original study."
    - "The original study also screened respondents on how often they receive brand content and read what other users post about the brand; include similar screening questions if exposure matters for your study."
    - "The items work for other social networks: replace “social media sites” with the platform you study, keeping the rest of the wording."
    - "For use in another language, translate and back-translate the items (the original was administered in Polish) and check measurement invariance before comparing groups."
  scoring:
    - "Code responses 1 (strongly disagree) to 7 (strongly agree)."
    - "Compute one score per construct as the mean of its items: firm-created = mean(FC1–FC4); user-generated = mean(UG1–UG4); brand awareness/associations = mean(BAS1–BAS4); brand loyalty = mean(BL1–BL3); perceived quality = mean(PQ1–PQ3)."
    - "BL1 and BL2 are reverse-scored (as in the original study): recode them as 8 − x before computing the brand loyalty score, so that higher scores mean higher loyalty. They are marked R in the questionnaire above."
    - "In the original data, item means ranged from 4.42 to 5.22 for the communication items and from 5.58 to 6.78 for the brand equity items (Table AI)."
    - "For latent-variable models, specify five correlated factors, then the structural model in Figure 2."
  intro_note: >-
    Item wording, response format and sources are as published in the article’s Table AI (BAS4 printed “X” for the brand
    name; here it reads [brand]). The introduction, brand question and instruction are suggested wording based on the
    procedure the article describes.
  admin_box: >-
    Replace [brand] with the brand the respondent named. Present each construct in its own block. Code answers 1 to 7;
    each construct score is the mean of its items. Introduction and brand question are suggested wording; item wording
    and response format are as published.
  analysis:
    title: "SMBC: five-factor CFA and structural model"
    r_options: 'estimator = "ML"'
    estimator_note: "maximum likelihood, as in the article (AMOS 21.0)"
    r_extra: |

      # 4. Structural model (Figure 2): H1a-H5
      model_sem <- paste(model_cfa, "
        baw ~ fc + ug
        bl  ~ fc + ug + baw
        pq  ~ fc + ug + baw
      ")
      fit_sem <- sem(model_sem, data = dat, estimator = "ML")
      summary(fit_sem, fit.measures = TRUE, standardized = TRUE)

      # 5. Industry comparison (Table III): multi-group model with a column 'industry' (three groups).
      #    The paths from firm-created communication to loyalty and quality are dropped, as in the article.
      #    Each labelled path gets a z-test of the difference between industries (comparable to CRDIFF).
      model_mg <- paste(model_cfa, "
        baw ~ c(a1, a2, a3) * fc + c(b1, b2, b3) * ug
        bl  ~ c(c1, c2, c3) * ug + c(d1, d2, d3) * baw
        pq  ~ c(e1, e2, e3) * ug + c(f1, f2, f3) * baw
        fc_baw_12 := a1 - a2
        fc_baw_13 := a1 - a3
        fc_baw_23 := a2 - a3
        ug_pq_12  := e1 - e2
        ug_pq_13  := e1 - e3
        ug_pq_23  := e2 - e3
      ")
      fit_mg <- sem(model_mg, data = dat, group = "industry", estimator = "ML")
      subset(parameterEstimates(fit_mg), op == ":=")
    mplus_estimator: "ML"
    mplus_estimator_note: "maximum likelihood, as in the article"
    mplus_extra: |

      ! Structural model (Figure 2): remove the "!" below
      ! BAW ON FC UG;
      ! BL ON FC UG BAW;
      ! PQ ON FC UG BAW;
    mplus_notes: |

      ! BL1 and BL2 are reverse-scored: recode them as 8 - x before the analysis.
      ! Industry comparison (Table III): add the grouping variable, e.g.
      !   GROUPING = industry (1 = beverages 2 = clothing 3 = mobile);
      ! and compare labelled paths with MODEL TEST or MODEL CONSTRAINT.
