question: >-
  Brands use Facebook to communicate with consumers, and consumers post their own content about brands on the same
  platform. Research had studied eWOM, online reviews and brand communities, but no study had examined how firm-created
  and user-generated social media communication each affect the dimensions of consumer-based brand equity: brand
  awareness/associations, perceived quality and brand loyalty. Nor had any study compared these effects across
  industries.

implications:
  practical: >-
    Posting brand content builds awareness and associations, but on its own it does not make consumers more loyal or
    raise their view of quality; content from other users does. Managers should therefore keep publishing their own
    content while encouraging consumers to create and share brand content, for example through exclusive campaigns,
    contests and offers that require users to engage with the fan page. Strategies should be tailored by industry: in the
    study, firm content worked best for non-alcoholic beverages, while user content shaped perceived quality most for
    mobile network providers.
  theoretical: >-
    The study separates two sources of social media brand communication and shows that they affect consumer-based
    brand equity differently: user-generated communication influences all three dimensions, firm-created communication
    only awareness/associations. It supports the hierarchy-of-effects view in which awareness/associations precede
    loyalty and perceived quality, and shows that industry moderates the effects of social media communication on brand
    equity.

limitations:
  - "Only Facebook was studied; future research should compare the leading social networks, as brand communication differs across channels."
  - "Only three industries were examined; a broader range would show how consumers perceive brands from different industries on social media."
  - "Each construct was measured with a small number of items; replications should consider adding items."
  - "The sample was Polish and mostly young, which limits generalisation; studies in other countries should account for social, economic and cultural differences."
  - "Future research could use Keller’s brand equity framework, control for differences between brands, and link social media communication to company financial performance."

faq:
  - q: "Does user-generated content on social media affect brand equity?"
    a: >-
      Yes. In a study of 302 Facebook users, user-generated social media communication had positive effects on brand
      awareness/associations (&beta; = 0.12), brand loyalty (&beta; = 0.24) and perceived quality (&beta; = 0.26)
      (Schivinski &amp; Dabrowski, 2015).
  - q: "Does a brand’s own Facebook content make consumers more loyal?"
    a: >-
      Not directly. Firm-created social media communication raised brand awareness/associations (&beta; = 0.14) but had
      no significant effect on brand loyalty or perceived quality; it can affect them indirectly, because awareness
      influences loyalty and perceived quality (Schivinski &amp; Dabrowski, 2015).
  - q: "Do the effects of social media communication differ by industry?"
    a: >-
      Yes. The effect of firm-created communication on awareness/associations was largest for non-alcoholic beverages
      (&beta; = 0.31), and user-generated communication shaped perceived quality much more for mobile network providers
      (&beta; = 0.51) than for the other industries (Schivinski &amp; Dabrowski, 2015).
  - q: "How can I measure firm-created and user-generated social media communication?"
    a: >-
      With two four-item scales adapted from Mägi (2003), Tsiros et al. (2004) and Bruhn et al. (2012), each with one new
      item, answered on a 7-point agreement scale; both had composite reliability above 0.90 (Schivinski &amp; Dabrowski,
      2015).

concepts:
  - term: "Firm-created social media communication"
    definition: "Brand communication on social media that is created and controlled by the company, for example posts on the brand’s Facebook page."
  - term: "User-generated social media communication"
    definition: "Brand-related content made publicly available online by users, reflecting some creative effort and created outside professional routines and practices (the OECD definition of user-generated content used in the article)."
  - term: "Consumer-based brand equity (CBBE)"
    definition: "The value a brand holds in consumers’ minds; the article measures three of Aaker’s dimensions: brand awareness/associations, perceived quality and brand loyalty."
  - term: "Critical ratio difference (CRDIFF) test"
    definition: "A pairwise test of whether a path coefficient differs between groups in a multi-group structural model, reported with z-values."

