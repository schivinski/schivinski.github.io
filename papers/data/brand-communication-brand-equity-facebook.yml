findings:
  - headline: "Brand-posted content builds awareness only."
    text: >-
      Firm-created social media communication had a positive effect on brand awareness/associations (&beta; = 0.14,
      p = 0.02) but no significant effect on brand loyalty (&beta; = −0.08, p = 0.15) or perceived quality
      (&beta; = −0.03, p = 0.61) among 302 Facebook users (Schivinski &amp; Dabrowski, 2015).
  - headline: "User-generated content strengthens all three dimensions."
    text: >-
      User-generated social media communication had positive effects on brand awareness/associations (&beta; = 0.12,
      p = 0.05), brand loyalty (&beta; = 0.24, p = 0.001) and perceived quality (&beta; = 0.26, p = 0.001)
      (Schivinski &amp; Dabrowski, 2015).
  - headline: "Awareness leads to loyalty and perceived quality."
    text: >-
      Brand awareness/associations had positive effects on brand loyalty (&beta; = 0.13, p = 0.03) and perceived quality
      (&beta; = 0.22, p = 0.001), consistent with a hierarchy-of-effects view of brand equity (Schivinski &amp; Dabrowski,
      2015).
  - headline: "Effects differ by industry."
    text: >-
      The effect of firm-created communication on brand awareness/associations was largest for non-alcoholic beverages
      (&beta; = 0.31, p = 0.003) and not significant for clothing, while user-generated communication affected perceived
      quality strongly for mobile network providers (&beta; = 0.51, p = 0.001), significantly more than in the other two
      industries (Schivinski &amp; Dabrowski, 2015).
  - headline: "Valid and reliable measures."
    text: >-
      The five-factor measurement model fitted well (&chi;&sup2;/df = 1.54, CFI = 0.98, TLI = 0.98, RMSEA = 0.04,
      SRMR = 0.03), with composite reliabilities of 0.85 to 0.95 and average variance extracted of 0.59 to 0.86
      (Schivinski &amp; Dabrowski, 2015).

