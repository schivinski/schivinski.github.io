question: >-
  Most behavioural research uses samples from Western, educated, industrialised, rich and democratic (WEIRD)
  societies; samples from Latin America remain rare. Classic accounts of culture predict that authority appeals
  should persuade more in collectivist, high power-distance countries, and commitment-and-consistency appeals more in
  individualistic ones. We tested both principles side by side in Ecuador, traditionally classed as collectivist, and
  Norway, traditionally classed as individualistic, using a real product choice rather than stated intentions.

implications:
  practical: >-
    Brands, retailers and public agencies can raise sustainable choices with authority messages, provided the source
    fits the behaviour: sustainability experts, trusted organisations or government officials rather than celebrities
    or sports stars. Showing the authority making the sustainable choice, and matching the source to the audience,
    should strengthen the effect where trust in such authorities is moderate to high. The same principle applies
    to policy campaigns towards Sustainable Development Goal 12, for example environmental officials recommending
    reusable cups at airports and stations.
  theoretical: >-
    The authority principle generalised across two countries assumed to hold very different cultural values,
    extending laboratory evidence of similar obedience to authority across cultures to a behavioural field setting.
    The absence of the predicted cultural difference adds to work questioning the individualism&ndash;collectivism
    and East&ndash;West dichotomies; Latin American consumers, for instance, often show independent self-construals
    usually linked to individualism.

limitations:
  - "The samples differed in age (mean 26 in Ecuador, 40 in Norway), mirroring national age profiles; results held when controlling for age."
  - "The authority source fitted the target behaviour, while the commitment message relied on passive commitment and was less concrete, which may have widened the gap between the two conditions."
  - "Future studies could test the fit between authority source and behaviour, active versus passive commitment, the mechanisms behind the authority effect, and other world regions, including qualitative designs."

faq:
  - q: "Do authority messages increase sustainable product choices?"
    a: >-
      Yes. In a preregistered field experiment in Ecuador and Norway (N = 346), 57.3% of people who were told that
      sustainability experts recommend choosing sustainably picked a fairtrade-labelled chocolate, compared with
      38.6% after a commitment-based message and 33.9% with no message (Cardenas et al., 2027).
  - q: "Does culture change how persuasion principles affect sustainable consumption?"
    a: >-
      Not in this study. Country did not moderate the effect of authority versus commitment-and-consistency messages
      on fairtrade choices in Ecuador and Norway, despite their different cultural profiles (Cardenas et al., 2027).
  - q: "Which works better for promoting fairtrade choices: authority or commitment and consistency?"
    a: >-
      Authority. The authority message produced a substantially higher fairtrade choice rate than the
      commitment-and-consistency message in both countries, &chi;&sup2;(1) = 8.06, <i>d</i> = 0.38 (Cardenas et al., 2027).
  - q: "What kind of authority should brands use to promote sustainable products?"
    a: >-
      A source whose expertise fits the behaviour, such as sustainability experts, trusted organisations or
      government officials, rather than celebrities or sports stars (Cardenas et al., 2027).

concepts:
  - term: "Authority principle"
    definition: "People are more likely to follow a recommendation when it comes from a source they see as a credible expert or institution."
  - term: "Commitment and consistency principle"
    definition: "Once people commit to a position, they tend to act in line with it so that they appear, and feel, consistent."
  - term: "Contextually aligned authority"
    definition: "An authority whose expertise matches the behaviour being encouraged, here sustainability experts recommending sustainable choices (the match-up effect)."
  - term: "WEIRD samples"
    definition: "Research participants from Western, educated, industrialised, rich and democratic societies, who dominate behavioural science despite being a small share of the world's population."

materials:
  - label: "Authority message"
    text: "&ldquo;Dear citizen, to protect our planet from accelerated climate change, sustainability experts strongly recommend citizens to choose sustainably.&rdquo;"
  - label: "Commitment-and-consistency message"
    text: "&ldquo;Dear citizen, don't you also want the best for our planet? Then make sustainable choices!&rdquo;"
  - label: "Choice task"
    text: "Two chocolates priced the same ($8 per package), one with a highly salient fairtrade label, offered as a thank-you gift after the survey."
  - label: "Measures"
    text: "Trust in authorities (three items, van Dijke &amp; Verboon, 2010), need for consistency (single item), need to belong (single item) and ecological dominance orientation, on 7-point scales."
materials_note: "Messages reproduced from the article (CC BY-NC-ND 4.0); they were adapted from Baca-Motes et al. (2013) and Whittler and Manolis (2015)."

