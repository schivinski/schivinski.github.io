question: >-
  Most research on nudging people towards sustainable choices comes from Western countries, with very little from
  Latin America. That leaves an open question for anyone designing a sustainability message: does a persuasion
  principle that works in one culture work in another with different values? We tested two well-established
  principles of social influence, authority and commitment-and-consistency, side by side in Ecuador and Norway.

implications:
  practical: >-
    Retailers, brands and public agencies that want shoppers to pick the more sustainable product can use an
    authority-based message at the point of choice. The same type of message raised fairtrade choices in both
    Ecuador and Norway, so a single principle can underpin campaigns in markets with very different cultural
    profiles.
  theoretical: >-
    Social influence principles are not interchangeable: authority outperformed commitment-and-consistency, and
    neither trust in authorities nor need for consistency explained the difference. The absence of country
    moderation questions the assumption that persuasion effects are culturally contingent, using rare field evidence
    from Latin America.

faq:
  - q: "Do authority messages increase sustainable product choices?"
    a: >-
      Yes. In a preregistered field experiment in Ecuador and Norway (N = 346), an authority-based message was the
      most effective of the messages tested at getting people to choose a fairtrade-labelled product over an
      unlabelled one (Cardenas et al., 2027).
  - q: "Does culture change how persuasion principles affect sustainable consumption?"
    a: >-
      Not in this study. The effects of authority and commitment-and-consistency messages on fairtrade choice did
      not differ between Ecuador and Norway, two countries with very different cultural values (Cardenas et al., 2027).
  - q: "Is commitment and consistency as effective as authority for promoting fairtrade choices?"
    a: >-
      No. The authority message was considerably more effective than the commitment-and-consistency message in
      both countries (Cardenas et al., 2027).

concepts:
  - term: "Authority principle"
    definition: "People are more likely to follow a recommendation when it comes from a source they see as a credible expert or institution."
  - term: "Commitment and consistency principle"
    definition: "Once people commit to a position, they tend to act in line with it so that they appear, and feel, consistent."
  - term: "Sustainable choice (in this study)"
    definition: "Choosing the fairtrade-labelled chocolate rather than the unlabelled one."

