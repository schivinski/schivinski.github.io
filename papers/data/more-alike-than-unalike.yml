in_brief: >-
  When a message said that sustainability experts recommend choosing sustainably, 57% of people picked the
  fairtrade chocolate, against 34% with no message. The authority message worked equally well in Ecuador and
  Norway, two countries usually assumed to respond to persuasion differently.

findings:
  - headline: "Social influence messages increased sustainable choices."
    text: >-
      In a preregistered field experiment with 346 people in Quito (Ecuador) and Kristiansand (Norway), 48.1% of
      those who received a social influence message chose a fairtrade-labelled chocolate, compared with 33.9% of
      those who received no message, &chi;&sup2;(1) = 6.25, <i>p</i> = .008, <i>d</i> = 0.27 (Cardenas et al., 2027).
  - headline: "Authority did most of the work."
    text: >-
      A message stating that sustainability experts recommend choosing sustainably led 57.3% of participants to
      choose the fairtrade chocolate, compared with 38.6% after a commitment-and-consistency message,
      &chi;&sup2;(1) = 8.06, <i>p</i> = .003, <i>d</i> = 0.38 (Cardenas et al., 2027).
  - headline: "Culture did not change the effect."
    text: >-
      Contrary to the preregistered prediction that authority would work better in collectivist Ecuador and
      commitment-and-consistency in individualistic Norway, country did not moderate the effect of the messages
      (<i>b</i> = 0.02, <i>p</i> = .966), and there was no main effect of country (Cardenas et al., 2027).
  - headline: "The effect held against a less attractive product."
    text: >-
      A validation study (N = 44) showed that the fairtrade chocolate was seen as more sustainable than the
      alternative (M = 4.73 vs. 3.86 on a 7-point scale) but less appealing in brand, expected taste and packaging,
      making the choice a conservative test of the messages (Cardenas et al., 2027).

