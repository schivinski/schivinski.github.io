in_brief: >-
  A message built on authority made people more likely to choose the sustainable product, and it worked just as
  well in Ecuador as in Norway. In a field experiment with 346 people, the authority message outperformed both a
  commitment-and-consistency message and no message at all.

findings:
  - headline: "Persuasion messages increased sustainable choices."
    text: >-
      In a preregistered field experiment with 346 consumers in Ecuador and Norway, messages based on the authority
      and commitment-and-consistency principles together increased the likelihood of choosing a fairtrade-labelled
      chocolate over an unlabelled one, compared with a no-message control (Cardenas et al., 2027).
  - headline: "Country made no difference."
    text: >-
      Contrary to the preregistered prediction, the effectiveness of the social influence messages did not differ
      between Ecuador and Norway (Cardenas et al., 2027).
  - headline: "Authority did most of the work."
    text: >-
      The authority message was considerably more effective than both the commitment-and-consistency message and
      the control in both countries, regardless of participants' trust in authorities or their need for consistency
      (Cardenas et al., 2027).

