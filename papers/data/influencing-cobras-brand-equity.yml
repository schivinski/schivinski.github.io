in_brief: >-
  Brand equity drives how much consumers read, share and create brand content on social media, and brand loyalty is
  its strongest driver. In a survey of 414 social media users in Poland following 51 brands, lower perceived quality
  went with more reading and commenting, not less.

findings:
  - headline: "Overall brand equity drives engagement with brand content."
    text: >-
      In a survey of 414 social media users in Poland, each rating one of 51 brands they followed, overall
      consumer-based brand equity increased overall engagement with brand-related social media content (&beta; = 0.30,
      <i>t</i> = 5.24, <i>p</i> &lt; .001), controlling for age, gender and social media usage (Schivinski et al., 2021).
  - headline: "Brand loyalty is the only dimension that drives content creation."
    text: >-
      Brand loyalty increased the consumption (&beta; = 0.33), contribution (&beta; = 0.32) and creation
      (&beta; = 0.32) of brand-related social media content, all <i>p</i> &lt; .001; it was the only brand equity
      dimension with a significant effect on creating content (Schivinski et al., 2021).
  - headline: "Brand associations drive reading and commenting, not creating."
    text: >-
      Brand associations increased the consumption (&beta; = 0.21, <i>p</i> &lt; .001) and contribution
      (&beta; = 0.13, <i>p</i> &lt; .05) of brand-related social media content, but had no effect on its creation
      (<i>p</i> = .96) (Schivinski et al., 2021).
  - headline: "Lower perceived quality goes with more engagement."
    text: >-
      Perceived quality had a negative effect on the consumption of brand-related social media content
      (&beta; = &minus;0.13, <i>t</i> = &minus;2.87) and a weaker, marginal negative effect on contribution
      (&beta; = &minus;0.11, <i>t</i> = &minus;1.78, <i>p</i> &lt; .10), and no effect on creation; the study did not
      measure whether this engagement was positive or negative (Schivinski et al., 2021).
  - headline: "Brand equity dimensions follow a learning sequence."
    text: >-
      Brand awareness increased brand associations (&beta; = 0.36) and perceived quality (&beta; = 0.35), which in turn
      increased brand loyalty (&beta; = 0.26 and &beta; = 0.52), all <i>p</i> &lt; .001, supporting a
      cognitive&ndash;affective&ndash;conative structure of consumer-based brand equity (Schivinski et al., 2021).
  - headline: "Younger consumers engage more."
    text: >-
      Age had a negative effect on overall engagement with brand-related social media content (&beta; = &minus;0.09,
      <i>p</i> &lt; .05), and on consumption (&beta; = &minus;0.16) and contribution (&beta; = &minus;0.08) at the
      dimension level (Schivinski et al., 2021).

glance:
  - { label: "Design", value: "Cross-sectional online survey (Qualtrics); confirmatory factor analysis and structural equation mixture modelling in Mplus 7.2 (robust maximum likelihood), with brands as latent classes" }
  - { label: "Participants", value: "414 valid questionnaires from 489 social media users in Poland (59.7% women; 47.6% aged 22&ndash;25; 45.4% online 2&ndash;4 hours a day), recruited on social media channels, online forums and discussion groups, with no incentive" }
  - { label: "Brands", value: "51 brands across industries and product categories (e.g. Pepsi, Zara, Chanel, Apple); each respondent rated one brand they had actively followed on social media for at least four months" }
  - { label: "Measures", value: "Brand awareness, brand associations, perceived quality and brand loyalty (3 items each; Christodoulides et al., 2015; 1&ndash;7 agreement); consumption (5 items), contribution (6) and creation (6) of brand-related social media content (CEBSC scale; Schivinski et al., 2016; 0 = not at all, 1&ndash;7 frequency); Polish, back-translated" }
  - { label: "Models", value: "Macro: higher-order CBBE predicting higher-order COBRAs. Micro: the four brand equity dimensions in sequence, predicting each of the three COBRAs. Controls: age, gender, social media usage" }
  - { label: "Model fit", value: "CFA: MLR &chi;&sup2;(539) = 1122.36, CFI = 0.93, TLI = 0.92, RMSEA = 0.05. Macro model: &chi;&sup2;(654) = 1355.82, CFI = 0.92, TLI = 0.91, RMSEA = 0.05. Micro model: &chi;&sup2;(640) = 1522.45, CFI = 0.90, TLI = 0.90, RMSEA = 0.05" }

