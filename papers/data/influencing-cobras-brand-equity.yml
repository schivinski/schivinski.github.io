question: >-
  Companies want consumers to read, share and create content about their brands on social media, and research had
  looked at the content people engage with and at personal drivers such as motivations and tie strength. What the
  brand itself contributes was largely unknown: why consumers engage with some brands and leave others untouched. We
  asked whether consumers' perceptions of a brand, captured as consumer-based brand equity, explain how much they
  consume, contribute and create brand-related content on social media, overall and dimension by dimension.

implications:
  practical: >-
    Social media managers should build positive brand associations, not only stress functional product features, to
    raise reading, liking and commenting. Loyal customers are a smaller group on social media but the only one that
    covers the whole range of activity, including creating content, so they are worth reaching directly. Because
    consumers who see a brand's quality as low consume and contribute more brand content, brands should monitor how
    quality is perceived and step in early to contain negative information. The two models can also serve as an audit
    tool: the overall score shows how well a brand triggers social media activity, the dimension scores show which
    part of brand equity drives it, and the same survey can benchmark competing brands beyond platform metrics such as
    likes and shares.
  theoretical: >-
    The study links two frameworks that had been studied apart, consumer-based brand equity and COBRAs, and identifies
    brand-specific drivers of behavioural engagement on social media. It supports modelling Aaker's brand equity as a
    learning sequence from awareness to attitudes to loyalty. At the dimension level, associations relate to lower and
    medium levels of engagement, loyalty to all levels, and perceived quality negatively to consumption and
    contribution, which fits the view that negative product information has higher diagnostic value. The most active
    level, creating content, responded to loyalty only.

limitations:
  - "Brand equity was measured with Aaker's framework only; other conceptualisations, such as Keller's brand knowledge model, could map further antecedents of COBRAs."
  - "Past brand usage was not measured; it could moderate the effects, as social media followers tend to be loyal customers."
  - "Differences between brand types and industries were not tested; a multilevel design could show how engagement varies at brand and industry level."
  - "COBRAs do not capture the valence of engagement; future surveys and experiments could measure whether content is positive or negative across media types."

faq:
  - q: "Does brand equity increase engagement on social media?"
    a: >-
      Yes. In a survey of 414 social media users in Poland following 51 brands, overall consumer-based brand equity
      increased overall engagement with brand-related social media content (&beta; = 0.30, <i>p</i> &lt; .001)
      (Schivinski et al., 2021).
  - q: "What makes consumers create content about a brand on social media?"
    a: >-
      Of the brand equity dimensions tested, only brand loyalty predicted creating brand-related content
      (&beta; = 0.32, <i>p</i> &lt; .001); brand associations and perceived quality had no effect on creation
      (Schivinski et al., 2021).
  - q: "Do people engage more with brands they think are low quality?"
    a: >-
      For lower levels of engagement, yes. Perceived quality had a negative effect on consuming (&beta; = &minus;0.13)
      and, marginally, on contributing to (&beta; = &minus;0.11, <i>p</i> &lt; .10) brand-related content, but no
      effect on creating it; the study did not measure whether that engagement was positive or negative (Schivinski
      et al., 2021).
  - q: "Are younger consumers more engaged with brands on social media?"
    a: >-
      Yes. Age had a negative effect on overall engagement with brand-related social media content (&beta; =
      &minus;0.09) and on consuming (&beta; = &minus;0.16) and contributing to it (&beta; = &minus;0.08) (Schivinski et
      al., 2021).

concepts:
  - term: "Consumers' online brand-related activities (COBRAs)"
    definition: "Brand-related activities on social media that range from passive to active: consuming, contributing to and creating brand-related content (Muntinga, Moorman &amp; Smit, 2011)."
  - term: "Consumption, contribution and creation"
    definition: "The three COBRA levels: consumption is reading, watching and following brand content; contribution is liking, commenting on and sharing it; creation is posting one's own brand-related content, reviews and videos."
  - term: "Consumer-based brand equity (CBBE)"
    definition: "The perceptions, attitudes, knowledge and behaviour that let a brand earn more volume or margin than it could without its name; measured here through brand awareness, brand associations, perceived quality and brand loyalty (Aaker, 1991)."
  - term: "Perceived quality"
    definition: "The consumer's judgement about a product's overall excellence or superiority (Zeithaml, 1988)."
  - term: "Negativity effect"
    definition: "The tendency to give negative information more weight than positive information when forming evaluations of a product or brand."
  - term: "Structural equation mixture model"
    definition: "A structural equation model in which parameters, here factor means and path slopes, are allowed to vary across classes, here the 51 brands."

