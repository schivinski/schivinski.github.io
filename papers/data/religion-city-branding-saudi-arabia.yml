question: >-
  Religion shapes daily life and policy in the Middle East, yet place branding research has mostly looked at
  religious architecture rather than at how religion engages the people who live in a city. Taking Saudi Arabia&rsquo;s
  Jeddah and Riyadh Seasons as a case, we asked how government actors use religious factors to engage residents in
  branding Saudi cities on social media, how residents respond, and what this means for empowering residents in city
  branding through religion.

implications:
  practical: >-
    Cities in religious societies can build their brand personality around shared values and beliefs, such as the
    Islamic values of tolerance and justice, and weave them into the physical and functional sides of the city brand.
    To move residents from liking and sharing to genuine conversation, governments and pro-government actors should
    communicate ethically on social media, above all on Twitter, by responding to users&rsquo; reactions, comments and
    questions.
  theoretical: >-
    The study proposes a framework of religion city branding through stakeholder engagement, which links religion
    with the three dimensions of a place brand (physical attributes, functional attributes and personality traits) and
    shows in particular how religious factors shape a place brand&rsquo;s personality. It suggests that religion can
    drive engagement at the individual level, but that moving engagement to the social level, where it builds
    resources for social development, should be reassessed in a context of power asymmetries between government and
    citizens.

limitations:
  - "As a case study of Saudi Arabia, the findings may not generalise to other countries; larger samples within and beyond the Middle East are needed."
  - "Only two festivals in two cities were analysed; branding outside these periods may differ."
  - "Only government and resident content was examined; future work could study corporate stakeholders, influencers and NGOs, using surveys or interviews."

faq:
  - q: "How does religion help brand a city?"
    a: >-
      In Saudi Arabia, the government used Islamic architecture, Qur&rsquo;anic teachings, religious competitions and
      rituals in its posts about the Jeddah and Riyadh Seasons, and residents engaged most with posts about the
      cities&rsquo; functions and personality, such as cultural activities, social bonding and religious values
      (Li, Alahmari &amp; Schivinski, 2024).
  - q: "Which social media platform worked best for city branding in Saudi Arabia?"
    a: >-
      Twitter. Resident engagement with government posts was highest on Twitter, followed by Instagram, with Facebook
      the least effective (Li, Alahmari &amp; Schivinski, 2024).
  - q: "Did residents talk back to the government on social media?"
    a: >-
      Rarely. Engagement came mostly from likes and shares; comments, the highest level of engagement, were scarce on
      all three platforms (Li, Alahmari &amp; Schivinski, 2024).
  - q: "What are the three dimensions of a place brand?"
    a: >-
      Physical attributes (what the place looks like), functional attributes (what it offers, such as services,
      transport and activities) and personality traits (the values, beliefs and character people associate with it).

concepts:
  - term: "Place branding"
    definition: "Building and managing the identity, image and meanings of a city, region or country as a brand."
  - term: "Stakeholder engagement"
    definition: "Involving groups such as governments and residents in shaping and promoting a place brand, from individual responses to collective, social-level participation."
  - term: "Physical attributes"
    definition: "The visible features of a place brand, such as architecture, design, colours and logos."
  - term: "Functional attributes"
    definition: "What a place offers, such as a clean environment, business opportunities, cultural activities, transport and government services."
  - term: "Brand personality traits"
    definition: "The human-like character, values and beliefs associated with a place brand."
  - term: "Popularity, virality and commitment"
    definition: "Engagement indices based on likes, shares and comments per post, scaled by followers; their sum is the engagement (E) index."

