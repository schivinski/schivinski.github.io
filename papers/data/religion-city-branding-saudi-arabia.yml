in_brief: >-
  Religion is a powerful tool for engaging residents in city branding in Saudi Arabia. Analysing 1,253 government
  posts about the Jeddah and Riyadh Seasons on Twitter, Facebook and Instagram, we found the government drew on
  Islamic values, architecture and events, and residents responded by liking and sharing, especially on Twitter,
  but rarely by commenting.

findings:
  - headline: "Government posts focused on what the cities offer."
    text: >-
      Of 1,253 government posts about the 2019 Jeddah and Riyadh Seasons, 53% (666) built the cities&rsquo; functional
      attributes, such as cultural activities, transport and a clean environment, 32% (393) their personality traits,
      such as social bonding and religious beliefs, and only 15% (194) their physical attributes (Li, Alahmari &amp;
      Schivinski, 2024).
  - headline: "Religion ran through all three dimensions."
    text: >-
      The government highlighted Islamic architecture and calligraphy, Qur&rsquo;an recitation contests, a competition
      reviving the Prophet&rsquo;s call to teach children swimming, archery and horse riding, and prayers during a solar
      eclipse that postponed festival events (Li, Alahmari &amp; Schivinski, 2024).
  - headline: "Residents liked and shared, but rarely commented."
    text: >-
      Resident engagement came mostly from likes (popularity) and shares (virality), with commitment through comments
      at 0.1 to 0.4 on every platform, a low level of engagement the authors link to limits on public speech in Saudi
      Arabia (Li, Alahmari &amp; Schivinski, 2024).
  - headline: "Twitter was the main channel."
    text: >-
      Engagement was highest on Twitter (E index 2.0 to 2.7), followed by Instagram (1.3 to 2.5) and Facebook (0.5 to
      0.9), with functional attributes and personality traits drawing the most engagement (Li, Alahmari &amp;
      Schivinski, 2024).

