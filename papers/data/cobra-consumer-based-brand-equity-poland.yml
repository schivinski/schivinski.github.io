question: >-
  Research shows that social media communication shapes how consumers perceive brands, but how consumers&rsquo; own
  brand-related activity affects brand equity was less clear. We asked whether Polish consumers&rsquo; engagement in
  consuming, contributing to and creating brand-related content in social media (COBRA) affects the dimensions of
  their consumer-based brand equity (CBBE).

implications:
  practical: >-
    Brand managers should build the COBRA model into the management of their social media campaigns: by
    systematically observing and analysing how consumers consume, contribute to and create brand-related content, they
    can expect higher brand equity, and in turn higher sales and profits.
  theoretical: >-
    Treating consuming, contributing and creating as one second-order COBRA construct, the study links consumers&rsquo;
    brand-related social media activity to Aaker&rsquo;s brand equity dimensions, with awareness and associations
    combined into one dimension as in Yoo and Donthu (2001).

limitations:
  - "The sample included only Polish consumers; the study should be repeated in other cultural, social and economic settings."
  - "Differences between social media platforms were not taken into account."

faq:
  - q: "Does engaging with brands on social media increase brand equity?"
    a: >-
      In 766 Polish social media users, consuming, contributing to and creating brand-related content had positive
      effects on brand awareness/associations, brand loyalty and perceived quality (Schivinski &amp; Łukasik, 2015).
  - q: "Which part of brand equity does online brand-related activity affect most?"
    a: >-
      Brand loyalty (&beta; = 0.42), followed by brand awareness/associations (&beta; = 0.27) and perceived quality
      (&beta; = 0.18) (Schivinski &amp; Łukasik, 2015).
  - q: "What are COBRAs?"
    a: >-
      Consumer&rsquo;s online brand-related activities: consuming, contributing to and creating brand-related content
      in social media (Muntinga, Moorman &amp; Smit, 2011).
  - q: "Is this article available in English?"
    a: >-
      The article is in Polish, with an English abstract on the e-mentor website. This page summarises it in English,
      with the hypotheses, tables and scale items translated.

concepts:
  - term: "COBRAs"
    definition: "Consumer&rsquo;s online brand-related activities: consuming (reading, watching, following), contributing (liking, commenting) and creating (posting, sharing, reviewing) brand-related content."
  - term: "Consumer-based brand equity"
    definition: "The value a brand has in consumers&rsquo; minds; here measured by brand awareness/associations, perceived quality and brand loyalty (Aaker, 1991)."
  - term: "Second-order factor"
    definition: "A latent variable measured by other latent variables; here COBRA is formed by the consumption, contribution and creation factors."

