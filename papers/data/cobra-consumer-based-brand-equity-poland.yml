in_brief: >-
  The more Polish social media users consume, contribute to and create content about a brand, the more they know
  and like it, the more loyal they are and the higher they rate its quality. A survey of 766 users about 203 brands
  showed that online brand-related activity has its strongest effect on brand loyalty.

findings:
  - headline: "Online brand-related activity raises brand awareness and associations."
    text: >-
      Consumers&rsquo; engagement in consuming, contributing and creating brand-related content (COBRA, modelled as
      one second-order factor) had a positive effect on brand awareness/associations (&beta; = 0.27, <i>p</i> &lt; .001)
      (Schivinski &amp; Łukasik, 2015).
  - headline: "The strongest effect is on brand loyalty."
    text: >-
      COBRA had a positive effect on brand loyalty (&beta; = 0.42, <i>p</i> &lt; .001), the largest of the three
      paths (Schivinski &amp; Łukasik, 2015).
  - headline: "Brand-related activity also improves perceived quality."
    text: >-
      COBRA had a smaller positive effect on the brand&rsquo;s perceived quality (&beta; = 0.18, <i>p</i> &lt; .001)
      (Schivinski &amp; Łukasik, 2015).
  - headline: "Managers can grow brand equity by tracking how consumers engage."
    text: >-
      Systematically observing and analysing consumers&rsquo; online brand-related activities in social media
      campaigns can be expected to raise overall brand equity, and in turn sales and profits (Schivinski &amp;
      Łukasik, 2015).

glance:
  - { label: "Design", value: "Standardised online survey of Polish social media users; the sample reflects the profile of Polish social media users in January 2013 (Gemius)" }
  - { label: "Participants", value: "766 valid questionnaires from 897 respondents (85.4%); 56.3% women; 57.2% aged 25&ndash;30; 203 brands (clothing and accessories, cars, beverages, computers, high tech, mobile operators)" }
  - { label: "Measures", value: "COBRA: 15 items (5 consumption, 4 contribution, 6 creation) on a 7-point frequency scale with a &ldquo;never&rdquo; option coded 0; CBBE: brand awareness/associations (4 items), perceived quality (4) and brand loyalty (5) on 7-point Likert scales" }
  - { label: "Hypotheses", value: "COBRA has a positive effect on brand awareness/associations (H1), brand loyalty (H2) and perceived quality (H3); all three supported" }
  - { label: "Analysis", value: "Exploratory factor analysis (SPSS 21), confirmatory factor analysis and structural equation modelling (Mplus 7.2, MLM estimator), with COBRA as a second-order factor" }
  - { label: "Language", value: "The article is in Polish; the English abstract is on the journal&rsquo;s site. The hypotheses, tables and items on this page are translated from Polish." }
