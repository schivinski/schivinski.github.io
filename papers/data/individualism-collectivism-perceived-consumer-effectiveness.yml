in_brief: >-
  Consumers who value responsibility for themselves or for their group are the ones who believe their shopping can
  help the environment and society. In a survey of 432 consumers in Poland, vertical individualism and vertical
  collectivism raised perceived consumer effectiveness, and local identity strengthened the link for vertical
  collectivists.

findings:
  - headline: "Vertical individualists believe their purchases matter."
    text: >-
      Among 432 consumers in Poland, vertical individualism, the competitive, self-responsible orientation, raised
      perceived consumer effectiveness, the belief that one&rsquo;s purchases affect the environment, society and
      employees (&beta; = 0.17, <i>p</i> = .01) (Czarnecka &amp; Schivinski, 2022).
  - headline: "So do vertical collectivists, against the hypothesis."
    text: >-
      Vertical collectivism, which stresses duty to one&rsquo;s group, was expected to lower perceived consumer
      effectiveness but raised it (&beta; = 0.32, <i>p</i> &lt; .001); horizontal individualism (<i>p</i> = .55) and
      horizontal collectivism (<i>p</i> = .28) had no effect (Czarnecka &amp; Schivinski, 2022).
  - headline: "Local identity amplifies the effect for vertical collectivists."
    text: >-
      The stronger a vertical collectivist&rsquo;s local identity, the stronger their belief that their consumption
      matters (interaction &beta; = 0.23, <i>p</i> &lt; .001), the opposite of the predicted weakening
      (Czarnecka &amp; Schivinski, 2022).
  - headline: "Global identity gives a weaker boost to vertical individualists."
    text: >-
      Global identity raised perceived consumer effectiveness directly (&beta; = 0.16, <i>p</i> = .001) and steepened the
      link with vertical individualism (interaction &beta; = 0.07, <i>p</i> = .09), which the article reports as
      support for its hypothesis; older consumers also scored higher (&beta; = 0.11) (Czarnecka &amp; Schivinski, 2022).

