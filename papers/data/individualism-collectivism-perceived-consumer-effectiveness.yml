question: >-
  Some consumers believe their individual purchases affect the environment, social issues and employee welfare, and
  so are more likely to buy sustainably; others do not. Cultural values and social identities are thought to shape this
  belief, known as perceived consumer effectiveness, but evidence from post-transitional economies is scarce. Drawing
  on the idea of value congruence, we asked how vertical and horizontal individualism and collectivism relate to
  perceived consumer effectiveness among Polish consumers, and whether global and local identities moderate these
  relations.

implications:
  practical: >-
    Marketers of green products and social marketers can segment consumers by vertical individualism and vertical
    collectivism, which both go with a stronger belief that one&rsquo;s purchases matter, but for different reasons.
    Messages to vertical individualists can stress personal responsibility and achievement, especially if framed
    globally; messages to vertical collectivists can stress the impact on their group and community and draw on local
    identity, for example through identity-based campaigns.
  theoretical: >-
    The study shows that the horizontal&ndash;vertical distinction in individualism and collectivism matters for
    explaining perceived consumer effectiveness, and that global and local identities are meaningful moderators. Value
    congruence explains the relations only partly: vertical collectivism, which was expected to lower the belief, raised
    it. The study adds evidence from the understudied post-transitional economy of Poland.

limitations:
  - "The survey is cross-sectional and from one country, so causal claims and generalisation to other markets are limited."
  - "Perceived consumer effectiveness is a belief, not observed sustainable behaviour."
  - "Future work could replicate the study in other national contexts, study the motives behind the belief and link it to actual purchases."

faq:
  - q: "Which consumers believe their purchases can make a difference?"
    a: >-
      In a survey of 432 Polish consumers, those high in vertical individualism (personal responsibility and
      competition) and in vertical collectivism (duty to one&rsquo;s group) had the strongest perceived consumer
      effectiveness (Czarnecka &amp; Schivinski, 2022).
  - q: "What is perceived consumer effectiveness?"
    a: >-
      The belief that one&rsquo;s consumption choices affect the natural environment, social and community issues and
      employee welfare; it is a known driver of sustainable purchasing.
  - q: "Does local identity matter for sustainable consumption beliefs?"
    a: >-
      Yes. Local identity strengthened the link between vertical collectivism and perceived consumer effectiveness
      (interaction &beta; = 0.23), so locally rooted, group-minded consumers felt their purchases mattered most
      (Czarnecka &amp; Schivinski, 2022).
  - q: "What is the difference between vertical and horizontal individualism?"
    a: >-
      Vertical individualism combines independence with competition and status; horizontal individualism combines
      independence with equality and uniqueness. Only the vertical form raised perceived consumer effectiveness.

concepts:
  - term: "Perceived consumer effectiveness (PCE)"
    definition: "The belief that one&rsquo;s consumption choices affect the environment, social issues and employee welfare; also called consumer self-efficacy (Ellen et al., 1991)."
  - term: "Vertical individualism"
    definition: "Valuing independence together with competition and hierarchy between individuals."
  - term: "Horizontal individualism"
    definition: "Valuing independence and uniqueness among equals."
  - term: "Vertical collectivism"
    definition: "Placing group goals above one&rsquo;s own and accepting hierarchy and duty within the group."
  - term: "Horizontal collectivism"
    definition: "Seeing oneself as similar to others and stressing common goals, interdependence and sociability."
  - term: "Global and local identity"
    definition: "Identification with the world community and a global lifestyle, or with one&rsquo;s local community, habits and traditions (Tu et al., 2012)."
  - term: "Value congruence"
    definition: "The fit between a person&rsquo;s values and their beliefs or behaviours."

