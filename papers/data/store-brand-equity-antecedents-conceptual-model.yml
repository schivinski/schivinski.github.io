in_brief: >-
  Store brands are no longer just cheap copies, yet little is known about how retailers&rsquo; advertising and
  promotions build their brand equity. This paper proposes a model in which advertising spend, attitudes toward the
  ads, price promotions and non-price promotions shape the awareness, associations, perceived quality and loyalty of
  store brands, to be compared across discount stores, hypermarkets and delicatessens.

findings:
  - headline: "A model of how advertising and promotions build store brand equity."
    text: >-
      The model links four marketing communication antecedents (store brand advertising spend, attitudes toward store
      brand advertisements, price promotions and non-price promotions) to the four dimensions of Aaker&rsquo;s brand
      equity: awareness, associations, perceived quality and loyalty (Łukasik &amp; Schivinski, 2017).
  - headline: "Advertising is expected to strengthen every dimension of store brand equity."
    text: >-
      Perceived advertising spend is hypothesised to raise store brand awareness, associations, perceived quality and
      loyalty, and favourable attitudes toward the ads to raise awareness, associations and perceived quality
      (Łukasik &amp; Schivinski, 2017).
  - headline: "Price promotions may hurt store brands; non-price promotions may help."
    text: >-
      Because consumers read low prices as a sign of low quality, price promotions are hypothesised to lower store
      brand perceived quality and associations, while non-price promotions such as gifts, samples and contests should
      raise them (Łukasik &amp; Schivinski, 2017).
  - headline: "The first store brand equity model to use all four of Aaker&rsquo;s dimensions."
    text: >-
      Previous store brand research measured brand equity with a single dimension; this framework adapts the national
      brand model of Villarejo-Ramos and Sánchez-Franco (2005) and Buil et al. (2013) to store brands (Łukasik &amp;
      Schivinski, 2017).

