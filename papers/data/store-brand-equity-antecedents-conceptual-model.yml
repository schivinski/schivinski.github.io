question: >-
  Store brands now compete with national brands on quality and image, but research has looked at them from the
  perspective of retailers, manufacturers and consumers rather than as brands. Little evidence exists on how
  advertising and sales promotion build consumer-based store brand equity, and previous studies measured it with a
  single dimension. We propose a model to test these antecedents across three retail formats.

implications:
  practical: >-
    Once tested, the model will show retailers how their advertising budget and promotional tools affect each part of
    store brand equity, helping them design advertising campaigns and choose between price and non-price promotions
    in each retail format.
  theoretical: >-
    The paper extends a national brand equity framework to store brands and proposes measuring store brand equity with
    all four of Aaker&rsquo;s dimensions, opening a comparison between consumers&rsquo; perceptions of national brands
    and store brands.

limitations:
  - "The paper presents a conceptual model and hypotheses; it reports no data."

faq:
  - q: "Does advertising build store brand equity?"
    a: >-
      This conceptual model hypothesises that perceived store brand advertising spend increases store brand awareness,
      associations, perceived quality and loyalty (Łukasik &amp; Schivinski, 2017).
  - q: "Do price promotions hurt store brands?"
    a: >-
      The model expects price promotions to lower store brand perceived quality and associations, because consumers
      use price as a cue to quality, while non-price promotions should improve them (Łukasik &amp; Schivinski, 2017).
  - q: "What is store brand equity?"
    a: >-
      The value consumers attach to a retailer&rsquo;s own brand, measured here through Aaker&rsquo;s four dimensions:
      awareness, associations, perceived quality and loyalty.

concepts:
  - term: "Store brand"
    definition: "A brand owned, managed and marketed by a retailer, also called a private label or own brand (Sprott &amp; Shimp, 2004)."
  - term: "Consumer-based store brand equity (SBBE)"
    definition: "The value of a store brand from the consumer&rsquo;s perspective, built from awareness, associations, perceived quality and loyalty."
  - term: "Non-price promotion"
    definition: "A sales promotion that does not reduce the price, such as free gifts, free samples, sweepstakes and contests."

