in_brief: >-
  Good online reviews lift every part of a restaurant&rsquo;s brand equity, but bad reviews mainly hurt perceived
  quality. In a survey of 777 Polish consumers who order meals online, positive reviews raised brand awareness,
  associations, perceived quality and loyalty, while negative reviews lowered perceived quality and, weakly, loyalty.

findings:
  - headline: "Positive reviews strengthen every dimension of brand equity."
    text: >-
      Among 777 Polish consumers who order restaurant meals online, positive online reviews raised brand awareness
      (&beta; = 0.39), brand associations (0.47), perceived quality (0.60) and brand loyalty (0.61)
      (Brzozowska-Woś &amp; Schivinski, 2019).
  - headline: "Negative reviews mainly damage perceived quality."
    text: >-
      Negative online reviews lowered perceived quality (&beta; = &minus;0.19, <i>p</i> &lt; .001) and showed a weak
      negative link with loyalty (&beta; = &minus;0.10, <i>p</i> = .09) (Brzozowska-Woś &amp; Schivinski, 2019).
  - headline: "Bad reviews do not change awareness or associations."
    text: >-
      Negative reviews had no effect on brand awareness (&beta; = 0.03) or brand associations (&beta; = &minus;0.01) of
      the restaurant (Brzozowska-Woś &amp; Schivinski, 2019).
  - headline: "Most diners check reviews before ordering."
    text: >-
      54.7% of respondents checked online reviews and ratings before ordering a meal, and 10.9% did so every time
      (Brzozowska-Woś &amp; Schivinski, 2019).

glance:
  - { label: "Design", value: "Online survey (CAWI) with snowball sampling through social media and email; each respondent named a restaurant they order from online" }
  - { label: "Participants", value: "777 valid responses from 1,023 Polish consumers who read restaurant reviews and order meals online (60.2% women; aged 18 to 64, median age group 18&ndash;24)" }
  - { label: "Measures", value: "Positive and negative eWOM (three items each, adapted from Goyette et al., 2010); brand awareness, brand associations, perceived quality and brand loyalty (three items each, Christodoulides et al., 2015); 7-point scales" }
  - { label: "Analysis", value: "Confirmatory factor analysis and structural equation modelling with robust maximum likelihood (MLR) in Mplus 7.2" }
  - { label: "Model fit", value: "MLR &chi;&sup2;(120) = 548.82, CFI = 0.93, TLI = 0.91, RMSEA = 0.06" }

