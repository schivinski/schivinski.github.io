question: >-
  Consumers increasingly choose restaurants on online meal delivery platforms, where positive and negative reviews
  appear side by side. Drawing on the stimulus-organism-response model, we asked how positive and negative online
  reviews affect each dimension of consumer-based brand equity, brand awareness, brand associations, perceived quality
  and brand loyalty, for restaurants that sell meals online in Poland.

implications:
  practical: >-
    Restaurant managers should encourage satisfied customers to post reviews, since positive reviews build every part of
    brand equity, and should monitor and respond to negative reviews, which mainly erode perceived quality. Review
    management on delivery platforms can be part of the brand strategy of local and family-owned restaurants.
  theoretical: >-
    The study adds evidence on how positive and negative eWOM, presented together as on real platforms, relate to each
    dimension of consumer-based brand equity, and shows an asymmetry: positive reviews matter for all dimensions,
    negative reviews only for quality and loyalty.

limitations:
  - "The sample was not random and does not represent all Polish consumers."
  - "The eWOM scales may need further development, and respondents may have chosen restaurants they like."
  - "The quantity and quality of reviews were not studied directly."

faq:
  - q: "Do online reviews affect restaurant brand equity?"
    a: >-
      Yes. In 777 Polish consumers ordering meals online, positive reviews raised brand awareness, associations,
      perceived quality and loyalty, and negative reviews lowered perceived quality (Brzozowska-Woś &amp; Schivinski,
      2019).
  - q: "Are negative reviews more harmful than positive reviews are helpful?"
    a: >-
      Not in this study: positive reviews had larger and broader effects (&beta; = 0.39 to 0.61) than negative reviews,
      which mainly affected perceived quality (&beta; = &minus;0.19) (Brzozowska-Woś &amp; Schivinski, 2019).
  - q: "What is consumer-based brand equity?"
    a: >-
      The value a brand has in consumers&rsquo; minds, usually measured through brand awareness, brand associations,
      perceived quality and brand loyalty (Aaker, 1991).
  - q: "How many people read reviews before ordering food online?"
    a: >-
      In this sample, 54.7% checked online reviews and ratings before ordering a meal, including 10.9% who always did
      (Brzozowska-Woś &amp; Schivinski, 2019).

concepts:
  - term: "Electronic word of mouth (eWOM)"
    definition: "Positive or negative statements about a product or company made by consumers and shared online, such as reviews and ratings."
  - term: "Consumer-based brand equity (CBBE)"
    definition: "The value of a brand from the consumer&rsquo;s perspective, built from brand awareness, brand associations, perceived quality and brand loyalty."
  - term: "Stimulus-organism-response (S-O-R) model"
    definition: "A model in which environmental stimuli shape internal evaluations, which in turn drive responses (Mehrabian &amp; Russell, 1974)."
  - term: "Online meal delivery platform"
    definition: "A service that lets consumers compare restaurants, read reviews and order meals for delivery online."

