question: >-
  Brands want people to read, share and create content about them on social media, and research had mapped what
  engagement is and which personal motives drive it. Less was known about how a consumer's view of the brand itself turns
  into engagement. I asked which levels of brand equity, item by item, lead consumers to consume, contribute to and create
  brand-related content, and whether those patterns describe recognisable types of consumers.

implications:
  practical: >-
    The five patterns give social media managers a way to plan engagement by what consumers think of the brand. For
    brand passionates, the largest group, managers can build commitment through a shared sense of community on the brand
    page and keep recognition high by featuring brand extensions and offers. Brand fans respond to personalised content
    and humanised brand communication. For low engaged consumers, typical of fast-moving goods and business-to-business
    markets, the first task is to improve brand associations. Brand curious consumers want to learn, so educational and
    cross-device campaigns suit them, and prospect brand fans, often found among niche and newer brands, can be turned
    into fans by widening their familiarity with the product range.
  theoretical: >-
    The study contributes to the behavioural view of consumer brand engagement by showing how specific levels of brand
    equity translate into consuming, contributing and creating brand content, in line with the hierarchy-of-effects
    model. Instead of estimating average effects across variables, the conditional inference tree isolates thresholds in
    individual items and the combinations that lead to each level of engagement, and from those combinations it derives a
    typology of five consumer subtypes. Brand commitment, from the loyalty dimension, emerged as the most important item.

limitations:
  - "The conditional inference tree is exploratory; experiments that manipulate brand equity are needed to confirm the patterns."
  - "All respondents already followed the brand on social media, and data came from one country, so the patterns should not be generalised to all consumers or cultures."
  - "Differences between brands, industries and high- and low-equity brands were not examined; other brand constructs, such as brand image, attitude or love, could also drive COBRAs."

faq:
  - q: "Which brand perceptions make people engage with brands on social media?"
    a: >-
      In a machine learning analysis of 1,356 social media users in Poland, four brand equity items predicted engagement:
      brand commitment, brand recognition, brand familiarity and favourable brand associations, with commitment as the
      first and most important split (Schivinski, 2021).
  - q: "What are the five types of brand followers on social media?"
    a: >-
      Brand passionates (46% of the sample), brand fans (41%), low engaged consumers (8%), brand curious consumers (3%) and
      prospect brand fans (2%), each defined by a combination of commitment, recognition, familiarity and associations
      (Schivinski, 2021).
  - q: "Who creates the most content about brands on social media?"
    a: >-
      Committed consumers. Among brand fans, highly committed and highly familiar with the brand, 17.96% created brand
      content at a high level, and among prospect brand fans, committed but less familiar with the brand, 34% did
      (Schivinski, 2021).
  - q: "Why do some followers barely engage with a brand they know?"
    a: >-
      In this study, consumers who recognised the brand but rated its associations as unfavourable (3 or lower on a 1&ndash;7
      scale) formed the low engaged group; 65.9% of them created little or no brand content (Schivinski, 2021).

concepts:
  - term: "Conditional inference tree (Ctree)"
    definition: "A machine learning method that splits a sample step by step on the predictor most strongly associated with the outcome, using permutation tests to avoid selection bias; its results read as if&ndash;then rules (Hothorn, Hornik &amp; Zeileis, 2006)."
  - term: "Consumers' online brand-related activities (COBRAs)"
    definition: "Brand-related activities on social media, from passive to active: consuming, contributing to and creating brand-related content (Muntinga, Moorman &amp; Smit, 2011; Schivinski et al., 2016)."
  - term: "Consumer-based brand equity (CBBE)"
    definition: "The perceptions, attitudes, knowledge and behaviour that let a brand earn more volume or margin than it could without its name; measured here through brand awareness, associations, perceived quality and loyalty (Aaker, 1991)."
  - term: "Brand commitment"
    definition: "An item of the brand loyalty dimension (&ldquo;I am committed to this brand&rdquo;) and the first split in the tree."
  - term: "Brand recognition and brand familiarity"
    definition: "Two items of brand awareness: being able to pick the brand out among others, and knowing the brand well."
  - term: "Rule"
    definition: "A path from the top of the tree to a terminal node: the combination of item thresholds that defines one consumer subtype."

