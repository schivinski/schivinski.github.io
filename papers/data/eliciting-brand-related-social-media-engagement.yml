in_brief: >-
  Four things consumers think about a brand, how committed they are to it, whether they recognise it, how familiar it is
  and whether its associations are favourable, sort social media users into five engagement patterns. A machine learning
  tree on 1,356 users following 282 brands in Poland showed that brand commitment is the first dividing line.

findings:
  - headline: "Four brand equity items predict who engages with brand content."
    text: >-
      In a survey of 1,356 social media users in Poland, each rating a brand they followed (282 brands), a conditional
      inference tree selected four of twelve brand equity items as predictors of consuming, contributing to and creating
      brand-related social media content: brand commitment, brand recognition, brand familiarity and favourable brand
      associations (Schivinski, 2021).
  - headline: "Brand commitment is the first split."
    text: >-
      The tree first divided consumers at a score of 4 on a 1&ndash;7 agreement scale for &ldquo;I am committed to this
      brand&rdquo; (<i>p</i> &lt; .001); committed consumers were then split by brand familiarity and less committed ones
      by brand recognition and favourable associations (Schivinski, 2021).
  - headline: "Most consumers are brand passionates."
    text: >-
      The largest group, the brand passionate (rule 1, <i>n</i> = 625), combined average or low commitment (&le; 4),
      high brand recognition (&gt; 4) and favourable associations above 3; most of them consumed (87.15%) and contributed
      to (82.44%) brand content at a medium level, while 54.13% created little content (Schivinski, 2021).
  - headline: "Brand fans are the most active creators."
    text: >-
      Brand fans (rule 2, <i>n</i> = 558), with high commitment and high familiarity (both &gt; 4), had the largest shares
      of high engagement: 21.17% contributed and 17.96% created brand content at a high level (Schivinski, 2021).
  - headline: "Weak associations hold engagement down."
    text: >-
      Low engaged consumers (rule 3, <i>n</i> = 108) recognised the brand (&gt; 4) but rated its associations as
      unfavourable (&le; 3); 65.9% created little or no brand content and 42.59% contributed at a low level
      (Schivinski, 2021).
  - headline: "Loyal consumers who know the brand less well create more."
    text: >-
      Prospect brand fans (rule 5, <i>n</i> = 24) were committed to the brand (&gt; 4) but less familiar with it
      (&le; 4); 34% of them created brand content at a high level (Schivinski, 2021).

