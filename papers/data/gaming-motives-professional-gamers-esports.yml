question: >-
  Esports has grown into a billion-dollar industry, yet little is known about whether professional gamers play for
  different reasons than other gamers, or whether their motives relate to gaming disorder in the same way. We compared
  professional gamers, gamers intending to become professional and gamers without such ambitions on seven gaming
  motives, and examined how these motives relate to gaming disorder as defined by the World Health Organization.

implications:
  practical: >-
    Because escapism was the motive most linked to gaming disorder in every group, it can help flag gamers who may be
    vulnerable, including those pursuing an esports career. Aspiring professionals had the highest rate of disordered
    gaming, so esports organisations and education programmes could tell them that long hours of play carry risks, and
    that it is possible to be a highly engaged gamer and keep a healthy lifestyle.
  theoretical: >-
    The study extends research on gaming motives to esports using the WHO framework for gaming disorder. Motive
    profiles of professionals and aspiring professionals were alike, against the expectation that professionals would
    score highest on skill development, competition and social motives. The links of the social and coping motives with
    disordered gaming are discussed in light of the interpersonal impairment hypothesis.

limitations:
  - "The cross-sectional design prevents causal conclusions, and all data are self-reported."
  - "The professional gamer group was small (n = 129), and non-professional gamers were about four years older than the other groups."
  - "Gender could not be examined because few women took part (8 professional gamers were women); no performance data were available to judge professional success."

faq:
  - q: "Do professional gamers play for different reasons than other gamers?"
    a: >-
      Not compared with aspiring professionals: in a survey of 5,187 gamers, the two groups had similar motive
      profiles. Both scored higher than gamers without esports ambitions on all motives except recreation
      (Montag et al., 2022).
  - q: "Which gaming motive is most linked to gaming disorder?"
    a: >-
      Escapism, gaming to get away from everyday life. It correlated most strongly with gaming disorder symptoms in
      professional, aspiring and non-professional gamers alike (&rho; = .40 to .44; Montag et al., 2022).
  - q: "Are esports players more at risk of gaming disorder?"
    a: >-
      In this sample, gamers aspiring to turn professional had the highest rate of disordered gaming (8.8%), while
      professional gamers (5.4%) were similar to other gamers (5.9%) (Montag et al., 2022).
  - q: "How was gaming disorder measured?"
    a: >-
      With the Gaming Disorder Test, a four-item measure based on the World Health Organization&rsquo;s ICD-11 criteria
      for gaming disorder.

concepts:
  - term: "Gaming disorder"
    definition: "A condition in ICD-11 (6C51) marked by impaired control over gaming, increasing priority given to gaming and continued gaming despite negative consequences, with significant impairment."
  - term: "Esports"
    definition: "Playing video games competitively, with organised teams and official international competitions."
  - term: "Escapism motive"
    definition: "Gaming to escape from everyday life and its problems."
  - term: "Motives for Online Gaming Questionnaire (MOGQ)"
    definition: "A 27-item measure of seven gaming motives: social, escapism, competition, coping, skill development, fantasy and recreation (Demetrovics et al., 2011)."
  - term: "Interpersonal impairment hypothesis"
    definition: "The idea that disordered gamers are more prone to interpersonal stress, such as conflict or social isolation (Cheng et al., 2018)."

materials:
  - label: "Measures"
    text: "Motives for Online Gaming Questionnaire (Demetrovics et al., 2011), five-point scale from &lsquo;almost never/never&rsquo; to &lsquo;almost always/always&rsquo;; Gaming Disorder Test (Pontes et al., 2019), five-point scale from &lsquo;never&rsquo; to &lsquo;very often&rsquo;."
  - label: "Supplementary material"
    text: "LSD contrasts, MANCOVA results, skewness, kurtosis, normality tests and Pearson correlations are in the article&rsquo;s online supplementary data."

