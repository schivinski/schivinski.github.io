in_brief: >-
  Professional gamers and gamers who want to turn professional play for much the same reasons, and both groups score
  higher than other gamers on every gaming motive except recreation. In a survey of 5,187 gamers, the escapism motive
  went with gaming disorder symptoms most strongly in all three groups, and aspiring professionals had the highest rate
  of disordered gaming.

findings:
  - headline: "Aspiring professionals play for the same reasons as professionals."
    text: >-
      In a survey of 5,187 gamers, professional gamers (<i>n</i> = 129) and non-professionals planning to turn
      professional (<i>n</i> = 646) had very similar levels of all seven gaming motives (Montag et al., 2022).
  - headline: "Both score higher than other gamers on all motives but recreation."
    text: >-
      Gamers without esports ambitions (<i>n</i> = 4,412) scored lower on the social, escapism, competition, coping,
      skill development and fantasy motives; the largest gaps were for skill development (&eta;&sup2; = .056) and social
      play (&eta;&sup2; = .054), while recreation was similar across groups (&eta;&sup2; = .002) (Montag et al., 2022).
  - headline: "Escapism is the motive most tied to gaming disorder."
    text: >-
      In all three groups, gaming to escape everyday life correlated most strongly with Gaming Disorder Test scores
      (&rho; = .40 to .44), and it was the strongest predictor in the regression (&beta; = .41), ahead of competition
      (&beta; = .19) and weekly gaming time (&beta; = .23) (Montag et al., 2022).
  - headline: "Aspiring professionals have the highest rate of disordered gaming."
    text: >-
      8.8% of aspiring professionals met the disordered gaming threshold, compared with 5.9% of other non-professionals
      and 5.4% of professional gamers (&chi;&sup2; = 8.13, <i>p</i> &lt; .05) (Montag et al., 2022).

