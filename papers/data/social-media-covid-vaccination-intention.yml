in_brief: >-
  Positive views of vaccine information shared on social media go with a stronger intention to get vaccinated, because
  they make the vaccine seem effective and safe. In a survey of 428 adults in Australia in 2021, this held for both
  official sources and posts by ordinary users; fear of COVID-19 did not carry the effect.

findings:
  - headline: "Official vaccine information on social media goes with intention to vaccinate."
    text: >-
      Among 428 adults in Australia, positive evaluations of official sources&rsquo; social media communication about
      COVID-19 vaccines had a total effect on intention to take the vaccine of &beta; = 0.28 (<i>p</i> = .001); the
      direct effect, reported as positive in the article, was &beta; = 0.05 (<i>p</i> = 0.10) (Park et al., 2023).
  - headline: "User-generated posts work only through beliefs about the vaccine."
    text: >-
      User-generated social media communication had no direct effect on intention (&beta; = &minus;0.01,
      <i>p</i> = .87) but raised it indirectly through perceived vaccine efficacy (indirect &beta; = 0.08, <i>p</i> = .01)
      and safety (0.02, <i>p</i> = .03): full mediation (Park et al., 2023).
  - headline: "Perceived efficacy is the strongest route."
    text: >-
      Perceived vaccine efficacy was the strongest predictor of intention (&beta; = 0.57) and carried most of the effect
      of official sources (indirect &beta; = 0.16, 95% CI 0.09&ndash;0.24); perceived safety added a smaller route
      (0.04) (Park et al., 2023).
  - headline: "Risk perception did not mediate."
    text: >-
      Official posts raised COVID-19 risk perception (&beta; = 0.20), but risk perception did not predict intention
      (&beta; = 0.06, <i>p</i> = .14), so neither indirect path through it was significant (Park et al., 2023).

glance:
  - { label: "Design", value: "Cross-sectional online survey on Qualtrics, late August to early September 2021, shared on Facebook groups and pages (convenience and snowball sampling); structural equation model with mediation, 5,000 bootstrap draws, in R (lavaan)" }
  - { label: "Participants", value: "428 adults living in Australia (from 554 responses; 126 with six or more missing items excluded), aged 16 to 79 (mean 46.2), 53.2% women, 51.6% from Victoria; 46.9% had two vaccine doses and 27.3% one" }
  - { label: "Predictors", value: "Evaluations of official source and of user-generated social media communication about the vaccines, 4 items each (adapted from Schivinski &amp; Dabrowski, 2016), &alpha; = 0.87 and 0.90" }
  - { label: "Mediators", value: "Perceived vaccine efficacy (8 items) and safety (5 of 6 items) from the Oxford COVID-19 vaccine confidence and complacency scale (Freeman et al., 2020); COVID-19 risk perception (5 of 6 items, adapted from Yang &amp; Cho, 2017)" }
  - { label: "Outcome", value: "Intention to take a COVID-19 vaccine, including boosters (3 items, adapted from Huynh &amp; Senger, 2021), &alpha; = 0.85" }
  - { label: "Controls", value: "Gender, age and time spent on social media (none significant)" }
  - { label: "Model fit", value: "CFA: ML &chi;&sup2;(362) = 800.50, CFI = 0.95, TLI = 0.94, RMSEA = 0.05. Structural model: ML &chi;&sup2;(364) = 1286.66, CFI = 0.91, TLI = 0.90, RMSEA = 0.06; <i>R</i>&sup2; for intention = 0.73" }

