question: >-
  Social media can spread both accurate vaccine information and misinformation, and studies of its effect on
  vaccination have been inconsistent, mostly treating all social media content as the same. During the 2021 COVID-19
  vaccination campaign in Australia, we asked whether vaccine information from official sources (such as health
  authorities, governments and news organisations) and from ordinary users relates differently to intention to
  vaccinate, and whether perceived vaccine efficacy, perceived safety and risk perception explain the link.

implications:
  practical: >-
    Health agencies should use social media actively: official sources&rsquo; credibility carries over to the platform,
    making it an effective way to reach people looking for vaccine information. Messages should focus on how well and
    how safely vaccines work rather than on fear of the disease, and communicators can encourage user-generated content
    that shares accurate information about efficacy and safety, since even posts by ordinary users raise intention when
    they shape those beliefs.
  theoretical: >-
    The study separates social media communication by source and shows that the source matters for vaccine intention,
    which may explain the inconsistent findings of earlier studies that treated social media as one channel. It
    identifies perceived vaccine efficacy and safety, not risk perception, as the beliefs through which social media
    communication relates to intention to vaccinate.

limitations:
  - "The convenience and snowball sample recruited on Facebook may not represent the Australian population."
  - "The data are cross-sectional, so causal links between social media communication and intention cannot be established."
  - "Differences between groups (for example by vaccination status or country) were not examined; the availability of official sources on social media may vary by country."

faq:
  - q: "Does social media make people more willing to get vaccinated?"
    a: >-
      It depends on the source and on what people come to believe. Among 428 adults in Australia, positive views of
      official vaccine information on social media went with a stronger intention to vaccinate, mostly because they
      raised perceived vaccine efficacy and safety (Park et al., 2023).
  - q: "Do posts by ordinary users affect vaccine intentions?"
    a: >-
      Not directly. User-generated social media communication had no direct effect, but it raised intention indirectly
      by improving perceptions of how effective and safe the vaccine is (Park et al., 2023).
  - q: "Does fear of COVID-19 explain vaccination intentions?"
    a: >-
      Not in this study: COVID-19 risk perception did not predict intention to vaccinate and did not mediate the
      effects of social media communication (Park et al., 2023).
  - q: "What should health campaigns on social media focus on?"
    a: >-
      The authors recommend focusing on vaccine efficacy and safety, using official sources&rsquo; credibility on social
      media, and encouraging accurate user-generated content (Park et al., 2023).

concepts:
  - term: "Social media communication (SMC)"
    definition: "Content about a topic shared on social media, here evaluated by how satisfied people are with it, whether it meets their expectations and how good its information is."
  - term: "Official source vs user-generated SMC"
    definition: "Content from health authorities, governments and news organisations versus content created by ordinary users such as family and friends."
  - term: "Perceived vaccine efficacy"
    definition: "The belief that a vaccine works to protect oneself and others."
  - term: "Perceived vaccine safety"
    definition: "The belief that a vaccine is safe, including views on how quickly it was developed and on its side effects."
  - term: "Risk perception"
    definition: "How likely and how severe a person believes catching a disease would be."
  - term: "Vaccine hesitancy"
    definition: "Delay in accepting, or refusal of, vaccination despite its availability."

materials:
  - label: "Scale items"
    text: "All items, with standardised loadings, means, standard deviations, skewness and kurtosis, are in Table A below (all on 5-point agreement scales). Two items were removed for low loadings: &lsquo;Taking a COVID-19 vaccine will make me feel like a guinea pig&rsquo; (safety, &lambda; = 0.12) and &lsquo;Even if I fall ill with other ailments, I will avoid going to hospital because of COVID-19&rsquo; (risk, &lambda; = 0.05)."
  - label: "Eligibility"
    text: "Respondents had to live in Australia and be older than 16, the age from which COVID-19 vaccination was available at the time."

