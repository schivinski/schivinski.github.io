in_brief: >-
  Individualistic consumers want rare, customised and unusual products because individualism raises their need to be
  different, not directly. In a survey of 504 non-British consumers living in the UK, that need for uniqueness turned
  into a stronger desire for unique products among people more immersed in global consumer culture.

findings:
  - headline: "Both kinds of individualism raise the need for uniqueness."
    text: >-
      Among 504 non-British consumers living in the UK, vertical individualism, the competitive and status-seeking
      kind, increased the need for uniqueness (&beta; = 0.61, <i>p</i> &lt; .001), and horizontal individualism, the
      kind that values independence among equals, increased it too (&beta; = 0.27, <i>p</i> &lt; .001)
      (Czarnecka, Schivinski &amp; Baxter, 2026).
  - headline: "The need for uniqueness drives the desire for unique products."
    text: >-
      Consumers with a higher need for uniqueness had a much stronger desire for rare, distinctive and customised
      products (&beta; = 0.89, <i>p</i> &lt; .001); gender also predicted it (&beta; = 0.18, <i>p</i> = .003), while
      education did not (Czarnecka, Schivinski &amp; Baxter, 2026).
  - headline: "Individualism works only through the need for uniqueness."
    text: >-
      The indirect effects of vertical (&beta; = 0.54, 95% CI 0.34&ndash;0.72) and horizontal individualism
      (&beta; = 0.24, 95% CI 0.05&ndash;0.36) on the desire for unique products were significant, while their direct
      effects were not (<i>p</i> = .13 and .26): full, indirect-only mediation (Czarnecka, Schivinski &amp; Baxter, 2026).
  - headline: "Horizontal individualism shows a suppressor effect."
    text: >-
      For horizontal individualism the indirect effect (&beta; = 0.24) was larger than the total effect (&beta; = 0.16,
      <i>p</i> = .02): its pull towards unique products appears only once it is routed through the need for
      uniqueness (Czarnecka, Schivinski &amp; Baxter, 2026).
  - headline: "Global consumer culture amplifies the effect."
    text: >-
      Acculturation to global consumer culture strengthened the link between the need for uniqueness and the desire for
      unique products (interaction unst. &beta; = 0.09, <i>p</i> = .04) and also raised that desire directly
      (unst. &beta; = 0.39, <i>p</i> &lt; .001) (Czarnecka, Schivinski &amp; Baxter, 2026).

