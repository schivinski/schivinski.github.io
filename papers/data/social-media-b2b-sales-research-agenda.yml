in_brief: >-
  Research shows that social media helps B2B sales mainly indirectly, by building relationships rather than closing
  deals. Reviewing a key study by Agnihotri et al. (2016) and the literature around it, this article sets out five
  research themes still open: adoption, platform roles, customer engagement, return on investment and risk.

findings:
  - headline: "Social media adds value to B2B sales indirectly, through relationships."
    text: >-
      Reviewing research on social media in business-to-business sales, Nunan et al. (2018) conclude that a consensus
      has emerged: the value of social media lies mainly in building and maintaining buyer–seller relationships rather
      than in closing deals directly.
  - headline: "Customer satisfaction should be measured from the buyer's side."
    text: >-
      Nunan et al. (2018) argue that Agnihotri et al. (2016) assessed customer satisfaction through salespeople's own
      perceptions, which may inflate results, and that research should survey B2B buyers to reflect the dyadic nature
      of buyer–salesperson interaction.
  - headline: "Research on social media in B2B sales falls into five streams."
    text: >-
      Nunan et al. (2018) organise the literature into five streams: the value social media creates in sales
      relationships, the practices that create it, the drivers of adoption by salespeople, why it creates value, and
      the conditions under which it does, placing Agnihotri et al. (2016) in the fourth.
  - headline: "Five themes set the research agenda."
    text: >-
      Nunan et al. (2018) propose five themes for future research on social media in B2B sales: patterns of adoption,
      the roles of different platforms across the sales process, B2B customer engagement, modelling return on
      investment, and the risks of social media for sales relationships and firms, with 17 specific research challenges.
  - headline: "Measuring ROI is hampered by who controls the data."
    text: >-
      Nunan et al. (2018) note a paradox: social media generates more data than ever, but the platforms control it and
      offer metrics built for consumer advertising, not the account-level measures B2B sales needs, so researchers
      fall back on self-reported surveys.

