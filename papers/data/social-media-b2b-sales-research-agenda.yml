question: >-
  Research on social media in business-to-business settings lags far behind consumer research, even though buyers
  use social media to search, compare and connect with salespeople. Agnihotri et al. (2016) were among the first to
  show empirically how salespeople's social media use leads to customer satisfaction. We critically appraised their
  study, placed it within the fast-growing literature on social media in B2B sales, and asked what remains unknown.

implications:
  practical: >-
    Sales managers should treat social media as a relationship tool rather than a direct sales channel, combine it
    with CRM systems and face-to-face meetings, and train salespeople in its use. Because adoption is led by employees
    and customers rather than imposed by the firm, managers need clear and enforceable policies on how salespeople use
    personal accounts, how information is shared, and how risks such as fraud, data leaks and competitive intelligence
    gathering are controlled. Firms should also expect to build their own measures of return on investment, since
    platform metrics are designed for advertising.
  theoretical: >-
    The article organises research on social media in B2B sales into five streams and identifies gaps in each. It
    calls for buyer-side and dyadic data rather than salesperson self-reports, and for formal theory, such as the
    technology acceptance model, the elaboration likelihood model or engagement marketing theory, to explain how
    information communicated through social media turns into customer satisfaction. It extends consumer engagement
    to B2B settings, where engagement spans several platforms and depends on groups rather than individuals.

limitations:
  - "The article is a commentary and review rather than an empirical study; its claims rest on the literature available in early 2018."
  - "Future research should test the role of social media in B2B sales with data from buyers as well as salespeople, and across countries, platforms and stages of the sales relationship."
  - "The agenda lists 17 research challenges, from measuring return on investment to the risks of personal social media accounts in sales."

faq:
  - q: "How does social media create value in B2B sales?"
    a: >-
      Mainly indirectly. Reviewing the research, Nunan et al. (2018) conclude that social media creates value in B2B
      sales by building and maintaining buyer–seller relationships, for example by helping salespeople communicate
      faster, respond to customers and adapt their selling, rather than by closing deals directly.
  - q: "What are the main research gaps on social media in B2B sales?"
    a: >-
      Nunan et al. (2018) identify five themes: patterns of adoption by salespeople and buyers, the roles of different
      platforms across the sales process, B2B customer engagement, modelling the return on investment of social media,
      and the risks of social media for sales relationships and firms.
  - q: "Why is the ROI of social media hard to measure in B2B?"
    a: >-
      Because the platforms control the data and provide metrics built for consumer advertising, while B2B sales needs
      account-level data that is often unavailable to marketers, so measurement relies on self-reported surveys
      (Nunan et al., 2018).
  - q: "What risks does social media bring to B2B sales?"
    a: >-
      Nunan et al. (2018) point to misinformation, fraud, identity theft, malware and corporate espionage, the
      difficulty of controlling platforms salespeople adopt on their own, the blurring of personal and business
      communication, and stress from interruptions.

concepts:
  - term: "Social selling"
    definition: "Salespeople's use of social media to identify prospects, communicate with buyers and build relationships throughout the sales process."
  - term: "Adaptive selling"
    definition: "A salesperson's ability to change their behaviour to fit the selling situation; social media is argued to strengthen it by improving access to information and communication."
  - term: "B2B customer engagement"
    definition: "Engagement of business customers that, unlike online consumer engagement, spans several platforms and channels and depends on groups rather than single individuals."
  - term: "Return on investment (ROI) of social media"
    definition: "The financial return from social media activity; hard to estimate in B2B sales because the metrics needed are held by platforms."
  - term: "Target and position article"
    definition: "An Industrial Marketing Management format in which authors critically appraise an influential article and set out where the field should go next."

