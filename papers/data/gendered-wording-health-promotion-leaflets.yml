question: >-
  Health campaigns often try to reach men and women with different messages, and research on job adverts suggests that
  &lsquo;agentic&rsquo; (stereotypically masculine) and &lsquo;communal&rsquo; (stereotypically feminine) words can
  attract or put off each gender. Drawing on message-audience congruence and homophily theory, we asked whether
  gendered wording and the gender of the endorsing doctor change how British adults respond to a leaflet promoting
  walking, and whether a person&rsquo;s gender role identity matters more than their gender.

implications:
  practical: >-
    Public health bodies, social marketers and commercial providers such as gyms need not tailor leaflet wording to
    women, who responded well to all versions. When targeting masculine men, they should avoid communal wording and
    consider agentic wording with a male endorser. Anyone using gendered language should also weigh efforts to
    promote gender-fair language and the risk of reinforcing gender expectations.
  theoretical: >-
    Gender-based congruence between message and audience was not needed for a leaflet to work, except for masculine
    men. Dominant gender role identity explained preferences better than gender, which challenges the assumptions of
    message-audience congruence and homophily for women, and suggests that changing gender roles shape how women respond
    to gendered content.

limitations:
  - "Survey experiments and interviews raise questions of external validity, and the cross-sectional design and purposive sampling limit causal inference."
  - "The leaflets were seen without competing material, and only a doctor endorser was used; the interview sample was small."
  - "The findings come from the UK and may not generalise to other countries, languages, ethnic groups or behaviours."

faq:
  - q: "Does gendered wording make health leaflets more effective?"
    a: >-
      Mostly not. In three UK studies, women and feminine men rated leaflets positively whatever the wording; only
      masculine men responded negatively, to communal wording (Baxter et al., 2022).
  - q: "What is agentic and communal wording?"
    a: >-
      Agentic wording uses words stereotypically linked with men, such as decide, active, challenging, ambitious and
      self-confident; communal wording uses words linked with women, such as choice, pleasant, gentle, cheerful and
      communally.
  - q: "How should health campaigns talk to masculine men?"
    a: >-
      Avoid communal, caring wording, which masculine men rated poorly (means of 3.38 and 3.65, against 5.3 or more for every other group), and
      consider agentic wording presented by a male endorser (Baxter et al., 2022).
  - q: "Do women prefer a female endorser?"
    a: >-
      Not clearly. Most women interviewed had no preference between a male and a female doctor, and women in Study 3
      rated all four leaflets positively (Baxter et al., 2022).

concepts:
  - term: "Gendered wording"
    definition: "The use of words stereotypically associated with men (agentic) or women (communal)."
  - term: "Agentic and communal traits"
    definition: "Agentic traits, such as ambition and assertiveness, are stereotypically linked with men; communal traits, such as warmth and care, with women."
  - term: "Dominant gender role identity (DGRI)"
    definition: "Whether a person scores higher on femininity or on masculinity on the Gender Trait Index."
  - term: "Message-audience congruence"
    definition: "The idea that messages work better when their content matches the characteristics of the audience."
  - term: "Homophily theory"
    definition: "The idea that people are more persuaded by, and relate more to, sources similar to themselves."

materials:
  - label: "Agentic leaflet (male endorser)"
    text: "&lsquo;Hi, I am Dr James Baxter. I have been a hospital Dr for 15 years and I am now an avid walker. I recommend walking 30 minutes a day for 5 times a week as this can bring you lots of health benefits. Start walking soon! Making the decision to keep active is good for your mental health. Exercise promotes good mental health because it stimulates chemicals in your brain that leaves you feeling more self-confident and more relaxed than you were before you worked out. Exercise is also good for your physical health and for your weight. When you are physically fit you burn off calories. The more you exercise, the more calories you burn. This helps you maintain your ideal weight and keeps you looking good. Building walking into everything that you do is one of the best ways to get the workout you need. Challenge yourself and take the stairs at every chance you get. When you are driving, be ambitious and park in the car park or space that is the farthest from your destination. If you have been sitting for a long period of time, be determined to take some time to get up and walk around. The benefits are yours for the taking. All you need to do is start moving now either individually or even better walk with colleagues or friends! Start walking 30 minutes a day, 5 times a week!&rsquo;"
  - label: "Communal leaflet (female endorser)"
    text: "&lsquo;Hi, I am Dr Julie Baxter. I have been a hospital Dr for 15 years and I am now an avid walker. I recommend walking 30 minutes a day for 5 times a week as this can bring you lots of health benefits. Start walking soon! Making the choice to keep fit is good for your mental and emotional health. Exercise promotes good mental health because it stimulates chemicals in your brain that leaves you feeling more cheerful and more relaxed than you were before you worked out. Exercise is also good for your physical health and for your weight. When you are keeping fit you burn off calories. Understandably the more you exercise the more calories you burn. This helps you maintain your ideal weight and will give you a flatterable physique. Building gentle walking into everything that you do is one of the best ways to get the exercise you need. Take the stairs at every chance you get. When you are driving, park in the car park or space that is the farthest from your destination. If you have been sitting for a long period of time, be sure to take some time to get up and walk around. The benefits and pleasant effects are yours for the taking. All you need to do is start moving now on your own or even better walk communally with colleagues or friends! Start walking 30 minutes a day, 5 times a week!&rsquo;"
  - label: "Leaflet design"
    text: "Both leaflets carried the headline &lsquo;Walking Campaign: Benefits of Walking&rsquo;, a body diagram listing benefits (mental health, lifespan, heart health, weight, immunity, bones, balance) and the slogan &lsquo;Walking not only changes your BODY, it changes your MIND, your ATTITUDE and your MOOD&rsquo;. Wording transcribed from S1 and S2 Fig of the article."
  - label: "Measures"
    text: "Attitude towards the ad: six semantic differentials (irritating, boring, good, informative, objective, appropriate). Behavioural intention: likelihood of walking 30 minutes a day, 5 days a week (unlikely/likely, improbable/probable, impossible/possible, uncertain/certain). Advertising credibility: three items. Gender role identity: Gender Trait Index (8 femininity and 8 masculinity items)."

