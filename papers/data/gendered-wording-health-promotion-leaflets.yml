  - { label: "Stimuli", value: "Leaflets promoting walking 30 minutes a day, five days a week, endorsed by a male or female hospital doctor (&lsquo;Dr James Baxter&rsquo; or &lsquo;Dr Julie Baxter&rsquo;) of the fictitious campaign &lsquo;Life training&rsquo;; about 3.5% gendered words" }
  - { label: "Study 1", value: "247 adults in Hertfordshire, England (49.4% women), pen-and-paper mall-intercept survey, November 2017 to March 2018" }
  - { label: "Study 2", value: "20 semi-structured interviews (10 men, 10 women) with Study 1 volunteers, March to July 2018; directed qualitative content analysis" }
  - { label: "Study 3", value: "599 UK adults (50.9% women, mean age 38.8), online Qualtrics survey, January to June 2019; gender role identity measured with the Gender Trait Index" }
  - { label: "Outcomes", value: "Attitude towards the ad, behavioural intention to walk and, in Study 3, advertising credibility" }
