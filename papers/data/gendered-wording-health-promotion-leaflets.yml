in_brief: >-
  Whether a health leaflet uses &lsquo;masculine&rsquo; or &lsquo;feminine&rsquo; wording matters mainly for one
  audience: masculine men. Across two survey experiments and interviews in the UK, masculine men rated leaflets with
  communal, caring wording poorly, while women and less masculine men rated all versions positively.

findings:
  - headline: "Masculine men dislike communal wording."
    text: >-
      In Study 3 (<i>n</i> = 599), men whose dominant gender role identity was masculine gave the communal-wording
      leaflets the lowest ratings of any group (attitude 3.38 and 3.65, against 5.3 to 6.2 for everyone else), whoever
      the doctor endorsing it was (Baxter et al., 2022).
  - headline: "Everyone else liked every leaflet."
    text: >-
      Women and feminine men evaluated all four leaflets positively, whether the wording was agentic or communal and
      the endorser male or female; their ratings differed, but none was negative (Baxter et al., 2022).
  - headline: "Men preferred the male doctor with agentic wording."
    text: >-
      In a mall-intercept experiment with 247 adults (Study 1), men rated the agentic leaflet with a male endorser more
      positively than women did (4.32 vs 3.34, <i>p</i> &lt; .001) and reported higher intention to walk (3.33 vs 2.60,
      <i>p</i> = .012); most men interviewed in Study 2 preferred this leaflet too (Baxter et al., 2022).
  - headline: "Most women had no preference."
    text: >-
      In 20 semi-structured interviews, most women did not prefer either leaflet, and in Study 1 women&rsquo;s attitude
      towards communal and agentic wording did not differ significantly from men&rsquo;s in most conditions
      (Baxter et al., 2022).

