<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="Two-by-two matrix: in high-risk categories price is positively related to perceived store brand quality; in low-risk categories with a low-image retailer price has no effect" font-family="Hanken Grotesk, Arial, Helvetica, sans-serif"><rect width="960" height="430" fill="#ffffff"/><text x="377.5" y="36.0" font-size="14" fill="#15203b" text-anchor="middle" font-weight="600" dominant-baseline="middle">High-risk category</text><text x="752.5" y="36.0" font-size="14" fill="#15203b" text-anchor="middle" font-weight="600" dominant-baseline="middle">Low-risk category</text><text x="176.0" y="131.0" font-size="14" fill="#15203b" text-anchor="end" font-weight="600" dominant-baseline="middle">High-image</text><text x="176.0" y="149.0" font-size="14" fill="#15203b" text-anchor="end" font-weight="600" dominant-baseline="middle">retailer</text><rect x="190" y="60" width="375" height="160" fill="#fbf6ec" stroke="#15203b" stroke-width="1.2"/><text x="206.0" y="100.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">The positive relationship between price and</text><text x="206.0" y="120.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">perceived store brand quality was found. In</text><text x="206.0" y="140.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">a high image retail environment, consumers</text><text x="206.0" y="160.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">evaluate store brands in the context of high</text><text x="206.0" y="180.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">status national brands.</text><rect x="565" y="60" width="375" height="160" fill="#ffffff" stroke="#15203b" stroke-width="1.2"/><text x="581.0" y="110.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">There is a positive relationship between price</text><text x="581.0" y="130.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">and perceived quality. Both attitude and</text><text x="581.0" y="150.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">purchase intention were lower than expected</text><text x="581.0" y="170.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">and premium prices than at the discount price.</text><text x="176.0" y="291.0" font-size="14" fill="#15203b" text-anchor="end" font-weight="600" dominant-baseline="middle">Low-image</text><text x="176.0" y="309.0" font-size="14" fill="#15203b" text-anchor="end" font-weight="600" dominant-baseline="middle">retailer</text><rect x="190" y="220" width="375" height="160" fill="#fbf6ec" stroke="#15203b" stroke-width="1.2"/><text x="206.0" y="260.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">Consumers perceive higher store brand quality</text><text x="206.0" y="280.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">at the expected price, than at the discount</text><text x="206.0" y="300.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">price. They perceive no gain in quality at the</text><text x="206.0" y="320.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">premium price. A low retail image offers no</text><text x="206.0" y="340.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">assurance that the quality is sufficient.</text><rect x="565" y="220" width="375" height="160" fill="#ffffff" stroke="#15203b" stroke-width="1.2"/><text x="581.0" y="270.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">Price had no effect on either quality or</text><text x="581.0" y="290.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">attitude, because in low-risk categories,</text><text x="581.0" y="310.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">consumers are not inclined to make price-based</text><text x="581.0" y="330.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">evaluative inferences.</text><text x="20.0" y="412.0" font-size="12" fill="#5b6476" text-anchor="start" font-weight="400" dominant-baseline="middle">Based on Sheinin and Wagner (2003): how buyers use price information (discount, expected and premium prices) by category risk and retailer image.</text></svg>
