<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="Brand experience increases emotional response, which increases consumer brand engagement, controlling for age and gender" font-family="Hanken Grotesk, Arial, Helvetica, sans-serif"><rect width="960" height="380" fill="#ffffff"/><ellipse cx="130" cy="130" rx="100" ry="50" fill="#ffffff" stroke="#15203b" stroke-width="1.6"/><text x="130.0" y="121.5" font-size="14" font-weight="600" fill="#15203b" text-anchor="middle" dominant-baseline="middle">Brand</text><text x="130.0" y="138.5" font-size="14" font-weight="600" fill="#15203b" text-anchor="middle" dominant-baseline="middle">experience</text><ellipse cx="480" cy="130" rx="100" ry="50" fill="#fbf6ec" stroke="#15203b" stroke-width="1.6"/><text x="480.0" y="121.5" font-size="14" font-weight="600" fill="#15203b" text-anchor="middle" dominant-baseline="middle">Emotional</text><text x="480.0" y="138.5" font-size="14" font-weight="600" fill="#15203b" text-anchor="middle" dominant-baseline="middle">response</text><ellipse cx="830" cy="130" rx="100" ry="50" fill="#ffffff" stroke="#15203b" stroke-width="1.6"/><text x="830.0" y="121.5" font-size="14" font-weight="600" fill="#15203b" text-anchor="middle" dominant-baseline="middle">Consumer brand</text><text x="830.0" y="138.5" font-size="14" font-weight="600" fill="#15203b" text-anchor="middle" dominant-baseline="middle">engagement</text><line x1="230.0" y1="130.0" x2="373.0" y2="130.0" stroke="#15203b" stroke-width="1.8"/><polygon points="380.0,130.0 371.6,133.3 371.6,126.7" fill="#15203b"/><text x="305.0" y="112.0" font-size="14" font-weight="600" fill="#15203b" text-anchor="middle" dominant-baseline="middle">H1: β = 0.39***</text><line x1="580.0" y1="130.0" x2="723.0" y2="130.0" stroke="#15203b" stroke-width="1.8"/><polygon points="730.0,130.0 721.6,133.3 721.6,126.7" fill="#15203b"/><text x="655.0" y="112.0" font-size="14" font-weight="600" fill="#15203b" text-anchor="middle" dominant-baseline="middle">H2: β = 0.50***</text><text x="900.0" y="66.0" font-size="13" font-weight="400" fill="#5b6476" text-anchor="middle" dominant-baseline="middle">R² = 0.27</text><rect x="745" y="285" width="170" height="58" rx="3" fill="#ffffff" stroke="#15203b" stroke-width="1.4"/><text x="830.0" y="304.0" font-size="13" font-weight="400" fill="#15203b" text-anchor="middle" dominant-baseline="middle">Control variables:</text><text x="830.0" y="323.0" font-size="13" font-weight="400" fill="#15203b" text-anchor="middle" dominant-baseline="middle">age, gender</text><line x1="830.0" y1="285.0" x2="830.0" y2="187.0" stroke="#15203b" stroke-width="1.3"/><polygon points="830.0,180.0 833.3,188.4 826.7,188.4" fill="#15203b"/><text x="820.0" y="232.5" font-size="12" font-weight="400" fill="#5b6476" text-anchor="end" dominant-baseline="middle">age 0.13, gender 0.01 (both n.s.)</text></svg>
