<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-label="How the analytic sample of 116,047 gamers was built and what was measured" font-family="Hanken Grotesk, Arial, Helvetica, sans-serif"><title>How the analytic sample of 116,047 gamers was built and what was measured</title><rect width="860" height="430" fill="#fff"/><defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6476"/></marker></defs><rect x="40" y="36" width="330" height="76" rx="8" fill="#fff" stroke="#15203b" stroke-width="1.4"/><text x="58" y="64" font-size="16" font-weight="600" fill="#15203b">188,775 responses</text><text x="58" y="84" font-size="11.5" fill="#5b6476">Gamers from 181 countries, recruited in 2019 through the</text><text x="58" y="99" font-size="11.5" fill="#5b6476">Electronic Sports League's healthy-gaming campaign</text><line x1="205" y1="112" x2="205" y2="140" stroke="#5b6476" stroke-width="1.3" marker-end="url(#ah2)"/><rect x="40" y="140" width="330" height="76" rx="8" fill="#fff" stroke="#15203b" stroke-width="1.4"/><text x="58" y="168" font-size="16" font-weight="600" fill="#15203b">127,028 after cleaning</text><text x="58" y="188" font-size="11.5" fill="#5b6476">Implausible ages and play times, invented games and</text><text x="58" y="203" font-size="11.5" fill="#5b6476">non-gamers removed</text><line x1="205" y1="216" x2="205" y2="244" stroke="#5b6476" stroke-width="1.3" marker-end="url(#ah2)"/><rect x="40" y="244" width="330" height="76" rx="8" fill="#fff" stroke="#15203b" stroke-width="1.4"/><text x="58" y="272" font-size="16" font-weight="600" fill="#15203b">116,047 analysed</text><text x="58" y="292" font-size="11.5" fill="#5b6476">Entries whose favourite game could not be matched to the</text><text x="58" y="307" font-size="11.5" fill="#5b6476">RAWG database, and 74 duplicates, removed</text><rect x="455" y="18" width="368" height="91" rx="8" fill="#f7f8fa" stroke="#dde1e8" stroke-width="1"/><text x="473" y="41" font-size="13" font-weight="600" fill="#15203b">Each player reported</text><circle cx="479" cy="57" r="2.6" fill="#e0a12a"/><text x="490" y="61" font-size="12" fill="#5b6476">Favourite game (free text)</text><circle cx="479" cy="76" r="2.6" fill="#e0a12a"/><text x="490" y="80" font-size="12" fill="#5b6476">Preferred device</text><circle cx="479" cy="95" r="2.6" fill="#e0a12a"/><text x="490" y="99" font-size="12" fill="#5b6476">Weekly hours of play</text><rect x="455" y="123" width="368" height="72" rx="8" fill="#f7f8fa" stroke="#dde1e8" stroke-width="1"/><text x="473" y="146" font-size="13" font-weight="600" fill="#15203b">Matched from RAWG</text><circle cx="479" cy="162" r="2.6" fill="#e0a12a"/><text x="490" y="166" font-size="12" fill="#5b6476">Genre tags (21 genres)</text><circle cx="479" cy="181" r="2.6" fill="#e0a12a"/><text x="490" y="185" font-size="12" fill="#5b6476">Multiplayer: yes or no</text><rect x="455" y="209" width="368" height="72" rx="8" fill="#f7f8fa" stroke="#dde1e8" stroke-width="1"/><text x="473" y="232" font-size="13" font-weight="600" fill="#15203b">Gaming disorder measured twice</text><circle cx="479" cy="248" r="2.6" fill="#e0a12a"/><text x="490" y="252" font-size="12" fill="#5b6476">IGDS9-SF, nine APA criteria</text><circle cx="479" cy="267" r="2.6" fill="#e0a12a"/><text x="490" y="271" font-size="12" fill="#5b6476">GDT, four WHO criteria</text><rect x="455" y="295" width="368" height="86" rx="8" fill="#fff" stroke="#15203b" stroke-width="1.4"/><text x="473" y="319" font-size="13" font-weight="600" fill="#15203b">Analysis</text><text x="473" y="337" font-size="12" fill="#5b6476">Rank-biserial correlations (Somers’ D), overall and</text><text x="473" y="354" font-size="12" fill="#5b6476">within each device group; Kruskal–Wallis tests</text><text x="473" y="371" font-size="12" fill="#5b6476">Random Forest, 100 trees, out-of-bag accuracy</text></svg>