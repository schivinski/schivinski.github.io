<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="Five streams of research on social media in B2B sales and five themes for future research" font-family="Hanken Grotesk, Arial, Helvetica, sans-serif"><text x="10" y="34" font-size="15" font-weight="600" fill="#15203b">What research has covered (Section 3)</text><rect x="10" y="54" width="330" height="60" rx="8" fill="#ffffff" stroke="#15203b" stroke-width="1.6"/><circle cx="38" cy="84" r="14" fill="#15203b"/><text x="38" y="84" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text><text x="64" y="84" font-size="14.5" fill="#15203b" dominant-baseline="central">The value social media creates</text><rect x="10" y="130" width="330" height="60" rx="8" fill="#ffffff" stroke="#15203b" stroke-width="1.6"/><circle cx="38" cy="160" r="14" fill="#15203b"/><text x="38" y="160" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text><text x="64" y="160" font-size="14.5" fill="#15203b" dominant-baseline="central">Practices that create value</text><rect x="10" y="206" width="330" height="60" rx="8" fill="#ffffff" stroke="#15203b" stroke-width="1.6"/><circle cx="38" cy="236" r="14" fill="#15203b"/><text x="38" y="236" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text><text x="64" y="236" font-size="14.5" fill="#15203b" dominant-baseline="central">Drivers of adoption by salespeople</text><rect x="10" y="282" width="330" height="60" rx="8" fill="#fdf3df" stroke="#e0a12a" stroke-width="1.6"/><circle cx="38" cy="312" r="14" fill="#e0a12a"/><text x="38" y="312" font-size="14" font-weight="600" fill="#15203b" text-anchor="middle" dominant-baseline="central">4</text><text x="64" y="304" font-size="14.5" fill="#15203b" dominant-baseline="central">Why social media creates value</text><text x="64" y="324" font-size="12.5" font-style="italic" fill="#5b6476"