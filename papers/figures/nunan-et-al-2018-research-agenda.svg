="middle" dominant-baseline="central">4</text><text x="474" y="312" font-size="14.5" fill="#15203b" dominant-baseline="central">Modelling the ROI of social media</text><rect x="420" y="358" width="330" height="60" rx="8" fill="#ffffff" stroke="#15203b" stroke-width="1.6"/><circle cx="448" cy="388" r="14" fill="#15203b"/><text x="448" y="388" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text><text x="474" y="388" font-size="14.5" fill="#15203b" dominant-baseline="central">Risks of social media in B2B sales</text><line x1="350" y1="235" x2="408" y2="235" stroke="#15203b" stroke-width="1.8"/><polygon points="414,235 403,229.5 403,240.5" fill="#15203b"/></svg>
