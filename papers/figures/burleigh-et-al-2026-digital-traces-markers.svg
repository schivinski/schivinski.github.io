<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" aria-label="Diagram: active data streams (self-reports) and passive data streams (logs, telemetry, sensors) combine into hybrid data streams, which point to six candidate digital markers of risk: late-night and irregular use, short gaps between sessions, fast responses to notifications, frequent brief checking, disrupted sleep-wake rhythms and escalating engagement" font-family="Hanken Grotesk, Arial, Helvetica, sans-serif"><rect width="960" height="610" fill="#ffffff"/><rect x="20" y="20" width="290" height="230" rx="6" fill="#ffffff" stroke="#b5562f" stroke-width="2"/><rect x="20" y="20" width="290" height="46" rx="6" fill="#b5562f"/><rect x="20" y="50" width="290" height="16" fill="#b5562f"/><text x="34.0" y="36.0" font-size="15" fill="#ffffff" text-anchor="start" font-weight="700" dominant-baseline="middle">Active data streams</text><text x="34.0" y="55.0" font-size="12" fill="#ffffff" text-anchor="start" font-weight="400" dominant-baseline="middle">People provide the input</text><circle cx="38" cy="88" r="2.6" fill="#b5562f"/><text x="48.0" y="88.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">Ecological momentary assessment</text><circle cx="38" cy="110" r="2.6" fill="#b5562f"/><text x="48.0" y="110.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">Experience sampling</text><circle cx="38" cy="132" r="2.6" fill="#b5562f"/><text x="48.0" y="132.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">In-app or embedded surveys</text><circle cx="38" cy="154" r="2.6" fill="#b5562f"/><text x="48.0" y="154.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">Digital diaries</text><circle cx="38" cy="176" r="2.6" fill="#b5562f"/><text x="48.0" y="176.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">Capture: mood, craving, motives,</text><text x="48.0" y="198.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">perceived control and harm</text><rect x="20" y="270" width="290" height="230" rx="6" fill="#ffffff" stroke="#3c5a80" stroke-width="2"/><rect x="20" y="270" width="290" height="46" rx="6" fill="#3c5a80"/><rect x="20" y="300" width="290" height="16" fill="#3c5a80"/><text x="34.0" y="286.0" font-size="15" fill="#ffffff" text-anchor="start" font-weight="700" dominant-baseline="middle">Passive data streams</text><text x="34.0" y="305.0" font-size="12" fill="#ffffff" text-anchor="start" font-weight="400" dominant-baseline="middle">Captured automatically</text><circle cx="38" cy="338" r="2.6" fill="#3c5a80"/><text x="48.0" y="338.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">Screen, app and notification logs</text><circle cx="38" cy="360" r="2.6" fill="#3c5a80"/><text x="48.0" y="360.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">Device and platform telemetry</text><circle cx="38" cy="382" r="2.6" fill="#3c5a80"/><text x="48.0" y="382.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">Wearables: sleep, activity,</text><text x="48.0" y="404.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">heart rate</text><circle cx="38" cy="426" r="2.6" fill="#3c5a80"/><text x="48.0" y="426.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">Clickstreams, purchases, posts,</text><text x="48.0" y="448.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">chats, searches, social graphs</text><rect x="380" y="145" width="250" height="230" rx="6" fill="#ffffff" stroke="#c98a12" stroke-width="2"/><rect x="380" y="145" width="250" height="46" rx="6" fill="#c98a12"/><rect x="380" y="175" width="250" height="16" fill="#c98a12"/><text x="394.0" y="161.0" font-size="15" fill="#ffffff" text-anchor="start" font-weight="700" dominant-baseline="middle">Hybrid data streams</text><text x="394.0" y="180.0" font-size="12" fill="#ffffff" text-anchor="start" font-weight="400" dominant-baseline="middle">Passive and active, linked</text><circle cx="398" cy="213" r="2.6" fill="#c98a12"/><text x="408.0" y="213.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">Logged use matched to</text><text x="408.0" y="235.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">momentary reports</text><circle cx="398" cy="257" r="2.6" fill="#c98a12"/><text x="408.0" y="257.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">Prompts triggered by long</text><text x="408.0" y="279.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">sessions or frequent checking</text><circle cx="398" cy="301" r="2.6" fill="#c98a12"/><text x="408.0" y="301.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">Separates high engagement</text><text x="408.0" y="323.0" font-size="13" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">from loss of control</text><line x1="310" y1="135" x2="372" y2="220" stroke="#15203b" stroke-width="1.6"/><polygon points="380,220 370,215 370,225" fill="#15203b"/><line x1="310" y1="385" x2="372" y2="300" stroke="#15203b" stroke-width="1.6"/><polygon points="380,300 370,295 370,305" fill="#15203b"/><line x1="630" y1="260" x2="672" y2="260" stroke="#15203b" stroke-width="1.6"/><polygon points="680,260 670,255 670,265" fill="#15203b"/><rect x="680" y="70" width="262" height="380" rx="6" fill="#fbf6ec" stroke="#8a5a00" stroke-width="1.6"/><text x="696.0" y="96.0" font-size="15" fill="#8a5a00" text-anchor="start" font-weight="700" dominant-baseline="middle">Candidate digital markers</text><text x="696.0" y="116.0" font-size="13" fill="#8a5a00" text-anchor="start" font-weight="600" dominant-baseline="middle">recurring across studies</text><circle cx="706" cy="152" r="9" fill="#8a5a00"/><text x="706.0" y="152.5" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" dominant-baseline="middle">1</text><text x="724.0" y="152.0" font-size="13.5" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">Late-night and irregular use</text><circle cx="706" cy="186" r="9" fill="#8a5a00"/><text x="706.0" y="186.5" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" dominant-baseline="middle">2</text><text x="724.0" y="186.0" font-size="13.5" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">Short gaps between sessions</text><circle cx="706" cy="220" r="9" fill="#8a5a00"/><text x="706.0" y="220.5" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" dominant-baseline="middle">3</text><text x="724.0" y="220.0" font-size="13.5" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">Fast responses to notifications</text><circle cx="706" cy="254" r="9" fill="#8a5a00"/><text x="706.0" y="254.5" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" dominant-baseline="middle">4</text><text x="724.0" y="254.0" font-size="13.5" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">Frequent brief checking</text><circle cx="706" cy="288" r="9" fill="#8a5a00"/><text x="706.0" y="288.5" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" dominant-baseline="middle">5</text><text x="724.0" y="288.0" font-size="13.5" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">Disrupted sleep–wake rhythms</text><circle cx="706" cy="322" r="9" fill="#8a5a00"/><text x="706.0" y="322.5" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" dominant-baseline="middle">6</text><text x="724.0" y="322.0" font-size="13.5" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">Escalating engagement</text><text x="696.0" y="380.0" font-size="12.5" fill="#5b6476" text-anchor="start" font-weight="400" dominant-baseline="middle">Linked to higher addiction-scale</text><text x="696.0" y="398.0" font-size="12.5" fill="#5b6476" text-anchor="start" font-weight="400" dominant-baseline="middle">scores and symptom burden; best</text><text x="696.0" y="416.0" font-size="12.5" fill="#5b6476" text-anchor="start" font-weight="400" dominant-baseline="middle">read in context, as prompts for</text><text x="696.0" y="434.0" font-size="12.5" fill="#5b6476" text-anchor="start" font-weight="400" dominant-baseline="middle">clinical conversation</text><text x="20.0" y="532.0" font-size="12.5" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">Machine learning on these streams: supervised models (regularized regression, support vector machines, decision trees, random forests,</text><text x="20.0" y="552.0" font-size="12.5" fill="#15203b" text-anchor="start" font-weight="400" dominant-baseline="middle">gradient boosting, deep learning) predict scale-based risk; unsupervised models (clustering, dimensionality reduction, topic models) find subgroups.</text><text x="20.0" y="584.0" font-size="12" fill="#5b6476" text-anchor="start" font-weight="400" dominant-baseline="middle">Drawn for this page from the Review's text, Table 1 and Figure 1 (Burleigh et al., 2026).</text></svg>
