        cover: "assets/textbooks/demooij-global-marketing-advertising-6e.jpg"
        url: "https://collegepublishing.sagepub.com/products/274128"
    taught:
      - { inst: rmit, programme: "Master's, School of Media and Communication", years: "2024, 2025" }

  - id: international-marketing
    area: "Marketing"
    title: "International Marketing"
    levels: ["Undergraduate"]
    summary: >-
      How firms take their products to foreign markets. Students weigh culture, language, political and legal systems,
      economic systems and technology, choose countries and entry modes, and adapt the marketing mix (product, price,
      distribution and promotion) for international customers.
    outline:
      - "Introduction to international marketing"
      - "Culture and cross-cultural marketing"
      - "Global trade and integration"
      - "Country selection and entry strategies"
      - "International marketing planning, organisation and control"
      - "Markets and segmentation in an international context"
      - "International positioning"
      - "Market research in the international environment"
      - "International product and brand marketing"
      - "Standardisation and adaptation"
      - "International pricing and finance"
      - "International channels, exporting and retailing"
      - "Globally integrated marketing communications"
      - "International sales promotion and public relations"
    textbooks:
      - cite: "Baack, D. W., Czarnecka, B., & Baack, D. E. (2018). *International marketing* (2nd ed.). Sage."
        cover: "assets/textbooks/baack-czarnecka-baack-international-marketing-2e.jpg"
        url: "https://www.sagepub.com/shop/buy-a-book/international-marketing-2-258004"
    taught:
      - { inst: ftu, as: "Multinational Marketing Strategy", programme: "Advanced Program in International Business Management (bachelor's, taught in English)", years: "2025" }

  - id: marketing-planning-strategy
    area: "Marketing"
    title: "Marketing Planning and Strategy"
    levels: ["Undergraduate", "Master's"]
    summary: >-
      How to analyse a market and turn the analysis into a marketing plan that can be defended to senior managers:
      internal and external analysis, objectives, strategy, the marketing programme, budgets and metrics. Students write
