# Teaching page data. Built into teaching.qmd by scripts/build_teaching.py (edit this file, not the page).
# One entry per institution, newest first. Course facts come from each university's official course cards.

intro: >-
  I teach marketing, consumer behaviour, digital marketing and quantitative research methods, in English, from
  first-year undergraduates to doctoral candidates. My courses are built around real market problems: students write
  complete marketing plans, design digital strategies with the SOSTAC model, and analyse how culture, technology and
  social influence shape what people buy. At doctoral level I teach the methods I use in my own research,
  multivariate analysis and structural equation modelling.

invite:
  title: "Visiting teaching and guest lectures"
  text: >-
    I welcome invitations to teach as a visiting professor, run intensive courses, give guest lectures, and lead
    doctoral workshops on structural equation modelling and survey research methods.
  link: { label: "Contact me on LinkedIn", url: "https://www.linkedin.com/in/bruno-schivinski-b2baa044" }

