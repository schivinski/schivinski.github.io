      - "The front end of the plan"
      - "Internal analysis"
      - "The global and market environment"
      - "Bringing the analyses together"
      - "Objectives and assumptions"
      - "Marketing strategy"
      - "The marketing programme"
      - "Budgets"
      - "Metrics and market research"
      - "Scenarios"
      - "Ethics in marketing planning"
      - "Strategy models and empirical generalisations"
    textbooks:
