# Teaching page data. Built into teaching.qmd by scripts/build_teaching.py (edit this file, not the page).
# Two lists: `institutions` (where Bruno has taught; logo + roles) and `courses` (the portfolio, grouped by area,
# alphabetical within each area). Each course names its core textbook(s) and lists where it was taught (`taught`),
# so a new university is added by appending to `institutions` and to the `taught` lists of the courses it offered.

intro: >-
  I teach marketing, consumer behaviour, digital and international marketing, advertising and research methods, in
  English, from first-year undergraduates to doctoral candidates, at universities in Poland, Australia, Vietnam and the
  United Kingdom. My courses follow leading international textbooks and are built around real market problems: students
  write complete marketing plans, design digital marketing strategies, run their own surveys and in-depth interviews
  and, at doctoral level, estimate and test structural equation models with their own data.

role: "Course coordinator and instructor"

invite:
  title: "Visiting teaching and guest lectures"
  text: >-
    I welcome invitations to teach as a visiting professor, run intensive courses, give guest lectures, and lead
    doctoral workshops on structural equation modelling and survey research methods.
  link: { label: "Contact me on LinkedIn", url: "https://www.linkedin.com/in/bruno-schivinski-b2baa044" }

areas: ["Marketing", "Research methods"]

