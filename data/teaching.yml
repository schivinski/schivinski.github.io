    taught:
      - { inst: ftu, programme: "Advanced Program in International Business Management (bachelor's, taught in English)", years: "2025" }
      - { inst: ntu, as: "Strategic Marketing and the Global Environment", programme: "MSc Marketing suite", years: "2015–2017" }

  - id: principles-of-marketing
    area: "Marketing"
